<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 900" width="100%" height="100%" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
  <defs>
    <!-- Blueprint Grid -->
    <pattern id="blueprint-grid" width="30" height="30" patternUnits="userSpaceOnUse">
      <path d="M 30 0 L 0 0 0 30" fill="none" stroke="#1e293b" stroke-width="0.8"/>
      <path d="M 150 0 L 0 0 0 150" fill="none" stroke="#2a324b" stroke-width="1.2"/>
    </pattern>

    <!-- Gradients -->
    <linearGradient id="header-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="50%" stop-color="#1e3a8a"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>

    <linearGradient id="day-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#065f46"/>
      <stop offset="100%" stop-color="#022c22"/>
    </linearGradient>

    <linearGradient id="night-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4c1d95"/>
      <stop offset="100%" stop-color="#1e1b4b"/>
    </linearGradient>

    <linearGradient id="morning-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e40af"/>
      <stop offset="100%" stop-color="#172554"/>
    </linearGradient>

    <linearGradient id="danger-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#7f1d1d"/>
      <stop offset="100%" stop-color="#450a0a"/>
    </linearGradient>

    <!-- Markers -->
    <marker id="arrow-emerald" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#10b981"/>
    </marker>
    <marker id="arrow-purple" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#c084fc"/>
    </marker>
    <marker id="arrow-cyan" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#38bdf8"/>
    </marker>
    <marker id="arrow-amber" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#fbbf24"/>
    </marker>
  </defs>

  <!-- Canvas -->
  <rect width="1400" height="900" fill="#0f172a"/>
  <rect width="1400" height="900" fill="url(#blueprint-grid)"/>

  <!-- Header -->
  <rect x="20" y="16" width="1360" height="68" rx="8" fill="url(#header-grad)" stroke="#38bdf8" stroke-width="1.5"/>
  <text x="700" y="44" fill="#f8fafc" font-size="19" font-weight="700" text-anchor="middle" letter-spacing="0.8">
    CONTRÔLE QUALITÉ NOCTURNE &amp; CONSOLIDATION D'INGÉNIERIE — CONCEPTION D-BOT V1
  </text>
  <text x="700" y="68" fill="#94a3b8" font-size="13" text-anchor="middle">
    Transposition du paradigme « Sleep-Time Compute » au cycle CAO Fusion 360 / FEA CalculiX / BOM / Documentation LightRAG (Mac M1 Max 64 Go)
  </text>

  <!-- ===================================================================== -->
  <!-- PANEL 1: JOURNÉE D'INGÉNIERIE (TOP)                                   -->
  <!-- ===================================================================== -->
  <rect x="20" y="100" width="1360" height="205" rx="10" fill="#1e293b" stroke="#10b981" stroke-width="1.8"/>
  <rect x="20" y="100" width="1360" height="34" rx="10" fill="url(#day-grad)"/>
  <text x="45" y="122" fill="#ecfdf5" font-size="14" font-weight="700">
    1. ACTIVITÉ DIURNE D'INGÉNIERIE (SOURCES DE VÉRITÉ PHYSIQUES &amp; ARBITRAGES DE SESSION)
  </text>
  <rect x="1115" y="105" width="248" height="24" rx="4" fill="#064e3b" stroke="#34d399" stroke-width="1"/>
  <text x="1239" y="121" fill="#a7f3d0" font-size="11" font-weight="700" text-anchor="middle">
    Zéro Friction Rédactionnelle en Journée
  </text>

  <!-- 4 Daytime Input Cards -->
  <!-- Card 1: CAD Fusion 360 -->
  <rect x="38" y="148" width="315" height="140" rx="6" fill="#0f172a" stroke="#34d399" stroke-width="1.2"/>
  <text x="50" y="170" fill="#34d399" font-size="12" font-weight="700">A. CAO Fusion 360 &amp; Métrologie</text>
  <text x="50" y="191" fill="#cbd5e1" font-size="11">• Assemblage Torse-123 v42, Bassin, Hanches</text>
  <text x="50" y="209" fill="#cbd5e1" font-size="11">• Export AUDIT_METROLOGIQUE_...json</text>
  <text x="50" y="227" fill="#cbd5e1" font-size="11">  (coordonnées 3D, masses, bounding boxes)</text>
  <text x="50" y="245" fill="#cbd5e1" font-size="11">• Snapshots PNG (Pieces_Isolees / Vues_Ensemble)</text>
  <text x="50" y="268" fill="#6ee7b7" font-size="10" font-style="italic">-&gt; Source souveraine géométrique &amp; visserie</text>

  <!-- Card 2: FEA & Mass Budgets -->
  <rect x="372" y="148" width="315" height="140" rx="6" fill="#0f172a" stroke="#34d399" stroke-width="1.2"/>
  <text x="384" y="170" fill="#34d399" font-size="12" font-weight="700">B. Simulations FEA &amp; Bilans Physiques</text>
  <text x="384" y="191" fill="#cbd5e1" font-size="11">• CalculiX 3D (Squelette Torse 140 N.m, Bride v87)</text>
  <text x="384" y="209" fill="#cbd5e1" font-size="11">• Contraintes Von Mises (MPa) &amp; Facteurs Sf</text>
  <text x="384" y="227" fill="#cbd5e1" font-size="11">• Calibration FDM PA12-CF &amp; Bilan de masse</text>
  <text x="384" y="245" fill="#cbd5e1" font-size="11">• Dimensionnement CAN / Alimentation 48V 600W</text>
  <text x="384" y="268" fill="#6ee7b7" font-size="10" font-style="italic">-&gt; Source souveraine RDM &amp; électromécanique</text>

  <!-- Card 3: BOM & Hardware -->
  <rect x="706" y="148" width="315" height="140" rx="6" fill="#0f172a" stroke="#34d399" stroke-width="1.2"/>
  <text x="718" y="170" fill="#34d399" font-size="12" font-weight="700">C. Approvisionnement, BOM &amp; Git</text>
  <text x="718" y="191" fill="#cbd5e1" font-size="11">• Références McMaster-Carr (visserie 12.9 / inox)</text>
  <text x="718" y="209" fill="#cbd5e1" font-size="11">• Stocks Alu 7075-T6 (coupons C500), PA12-CF</text>
  <text x="718" y="227" fill="#cbd5e1" font-size="11">• Inventaire 27/27 moteurs RobStride RS-00..06</text>
  <text x="718" y="245" fill="#cbd5e1" font-size="11">• Commits Git quotidiens (code, scripts, docs)</text>
  <text x="718" y="268" fill="#6ee7b7" font-size="10" font-style="italic">-&gt; Source souveraine logistique &amp; versions</text>

  <!-- Card 4: Session Transcripts -->
  <rect x="1040" y="148" width="322" height="140" rx="6" fill="#0f172a" stroke="#34d399" stroke-width="1.2"/>
  <text x="1052" y="170" fill="#34d399" font-size="12" font-weight="700">D. Conversations &amp; Arbitrages (Antigravity)</text>
  <text x="1052" y="191" fill="#cbd5e1" font-size="11">• Journaux de session : transcript.jsonl</text>
  <text x="1052" y="209" fill="#cbd5e1" font-size="11">• Corrections d'hypothèses de l'utilisateur</text>
  <text x="1052" y="227" fill="#cbd5e1" font-size="11">• Préférences d'atelier &amp; conventions CAO/CNC</text>
  <text x="1052" y="245" fill="#cbd5e1" font-size="11">• Arbitrages techniques pris à la volée</text>
  <text x="1052" y="268" fill="#6ee7b7" font-size="10" font-style="italic">-&gt; Source des indices comportementaux (Clues)</text>

  <!-- Downward Arrows to Nightly Engine -->
  <path d="M 195 288 L 195 328" stroke="#10b981" stroke-width="2.2" marker-end="url(#arrow-emerald)"/>
  <path d="M 530 288 L 530 328" stroke="#10b981" stroke-width="2.2" marker-end="url(#arrow-emerald)"/>
  <path d="M 863 288 L 863 328" stroke="#10b981" stroke-width="2.2" marker-end="url(#arrow-emerald)"/>
  <path d="M 1201 288 L 1201 328" stroke="#10b981" stroke-width="2.2" marker-end="url(#arrow-emerald)"/>

  <!-- ===================================================================== -->
  <!-- PANEL 2: PIPELINE NOCTURNE D'AUDIT & CONSOLIDATION (MIDDLE)           -->
  <!-- ===================================================================== -->
  <rect x="20" y="332" width="1360" height="250" rx="10" fill="#1e293b" stroke="#c084fc" stroke-width="2"/>
  <rect x="20" y="332" width="1360" height="36" rx="10" fill="url(#night-grad)"/>
  <text x="45" y="355" fill="#faf5ff" font-size="14" font-weight="700">
    2. PIPELINE NOCTURNE « NIGHTLY DESIGN SANITY CHECK » (00:00 EUROPE/PARIS — LECTURE SEULE SUR LES DOSSIERS NIVEAU 1)
  </text>
  <rect x="1055" y="337" width="308" height="25" rx="4" fill="#3b0764" stroke="#d8b4fe" stroke-width="1"/>
  <text x="1209" y="354" fill="#f3e8ff" font-size="11" font-weight="700" text-anchor="middle">
    Python Déterministe + qwen3.8:27b-mlx + LightRAG
  </text>

  <!-- 4 Nightly Modules -->
  <!-- Module 1 -->
  <rect x="38" y="382" width="315" height="184" rx="6" fill="#0f172a" stroke="#c084fc" stroke-width="1.3"/>
  <rect x="38" y="382" width="315" height="26" rx="6" fill="#3b0764"/>
  <text x="195" y="399" fill="#f3e8ff" font-size="11" font-weight="700" text-anchor="middle">
    MODULE 1 : DIFF MÉTROLOGIQUE CAO / DOC / BOM
  </text>
  <text x="50" y="424" fill="#d8b4fe" font-size="11" font-weight="700">Priorité : 10/10 (100% Déterministe Python)</text>
  <text x="50" y="444" fill="#cbd5e1" font-size="11">• Compare AUDIT_METROLOGIQUE.json avec les</text>
  <text x="50" y="460" fill="#cbd5e1" font-size="11">  masses/cotes des DOSSIER_TECHNIQUE_.</text>
  <text x="50" y="480" fill="#cbd5e1" font-size="11">• Vérifie que chaque référence McMaster-Carr</text>
  <text x="50" y="496" fill="#cbd5e1" font-size="11">  de la CAO figure dans FINAL_BOM_.</text>
  <text x="50" y="516" fill="#cbd5e1" font-size="11">• Compare mtime(Snapshots PNG) vs mtime(SVG)</text>
  <text x="50" y="532" fill="#cbd5e1" font-size="11">  pour signaler tout schéma vectoriel obsolète.</text>
  <text x="50" y="553" fill="#e9d5ff" font-size="10" font-family="monospace">-&gt; Zéro hallucination, détection d'écart 1:1</text>

  <!-- Module 2 -->
  <rect x="372" y="382" width="315" height="184" rx="6" fill="#0f172a" stroke="#c084fc" stroke-width="1.3"/>
  <rect x="372" y="382" width="315" height="26" rx="6" fill="#3b0764"/>
  <text x="529" y="399" fill="#f3e8ff" font-size="11" font-weight="700" text-anchor="middle">
    MODULE 2 : HIÉRARCHIE BI-TEMPORELLE RAG
  </text>
  <text x="384" y="424" fill="#d8b4fe" font-size="11" font-weight="700">Priorité : 8/10 (Inspiration Zep Graphiti)</text>
  <text x="384" y="444" fill="#cbd5e1" font-size="11">• Détecte lorsqu'une nouvelle cote dans un</text>
  <text x="384" y="460" fill="#cbd5e1" font-size="11">  DOSSIER_TECHNIQUE_ ou FINAL_ contredit</text>
  <text x="384" y="476" fill="#cbd5e1" font-size="11">  une valeur antérieure dans un STUDY_.</text>
  <text x="384" y="496" fill="#cbd5e1" font-size="11">• Marque l'ancienne assertion comme invalidée</text>
  <text x="384" y="512" fill="#cbd5e1" font-size="11">  (t_invalid) dans check_integrity.py avant</text>
  <text x="384" y="528" fill="#cbd5e1" font-size="11">  la passe Nightly RAG Reindex (index_docs.py).</text>
  <text x="384" y="553" fill="#e9d5ff" font-size="10" font-family="monospace">-&gt; Élimine les réponses RAG contradictoires</text>

  <!-- Module 3 -->
  <rect x="706" y="382" width="315" height="184" rx="6" fill="#0f172a" stroke="#c084fc" stroke-width="1.3"/>
  <rect x="706" y="382" width="315" height="26" rx="6" fill="#3b0764"/>
  <text x="863" y="399" fill="#f3e8ff" font-size="11" font-weight="700" text-anchor="middle">
    MODULE 3 : TRANSCRIPT DREAMING (CLUE -&gt; RULE)
  </text>
  <text x="718" y="424" fill="#d8b4fe" font-size="11" font-weight="700">Priorité : 7/10 (Inspiration Linger Dreaming)</text>
  <text x="718" y="444" fill="#cbd5e1" font-size="11">• Parcourt les transcript.jsonl du jour.</text>
  <text x="718" y="462" fill="#cbd5e1" font-size="11">• Extrait les rectifications méthodologiques</text>
  <text x="718" y="478" fill="#cbd5e1" font-size="11">  de l'utilisateur (1 fois = Clue, 2 fois = Rule).</text>
  <text x="718" y="498" fill="#cbd5e1" font-size="11">• Propose des règles modulaires par métier</text>
  <text x="718" y="514" fill="#cbd5e1" font-size="11">  (CAO, FEA, CAN) sans surcharger AGENTS.md</text>
  <text x="718" y="530" fill="#cbd5e1" font-size="11">  pour préserver le Prompt Cache.</text>
  <text x="718" y="553" fill="#e9d5ff" font-size="10" font-family="monospace">-&gt; Capitalise le savoir-faire d'atelier</text>

  <!-- Module 4 -->
  <rect x="1040" y="382" width="322" height="184" rx="6" fill="#0f172a" stroke="#c084fc" stroke-width="1.3"/>
  <rect x="1040" y="382" width="322" height="26" rx="6" fill="#3b0764"/>
  <text x="1201" y="399" fill="#f3e8ff" font-size="11" font-weight="700" text-anchor="middle">
    MODULE 4 : ALIGNEMENT GIT DIFF &lt;-&gt; ROADMAP
  </text>
  <text x="1052" y="424" fill="#d8b4fe" font-size="11" font-weight="700">Priorité : 8/10 (Règle Zero Journal / Zero Bloat)</text>
  <text x="1052" y="444" fill="#cbd5e1" font-size="11">• Croise git log --since="24h" avec les</text>
  <text x="1052" y="460" fill="#cbd5e1" font-size="11">  tâches [ ] de ROADMAP_STRATEGIQUE_V1.md.</text>
  <text x="1052" y="480" fill="#cbd5e1" font-size="11">• Identifie les items résolus à supprimer</text>
  <text x="1052" y="496" fill="#cbd5e1" font-size="11">  et les sous-tâches restantes.</text>
  <text x="1052" y="516" fill="#cbd5e1" font-size="11">• Compile une section courte éphémère en</text>
  <text x="1052" y="532" fill="#cbd5e1" font-size="11">  tête de AUDIT_INTEGRITE.md (zéro nouveau log).</text>
  <text x="1052" y="553" fill="#e9d5ff" font-size="10" font-family="monospace">-&gt; Prêt pour validation 1-clic au réveil</text>

  <!-- Downward Arrows to Panel 3 -->
  <path d="M 350 566 L 350 606" stroke="#38bdf8" stroke-width="2.2" marker-end="url(#arrow-cyan)"/>
  <path d="M 1050 566 L 1050 606" stroke="#fbbf24" stroke-width="2.2" marker-end="url(#arrow-amber)"/>

  <!-- ===================================================================== -->
  <!-- PANEL 3: RÉSULTAT MATINAL & GARDE-FOU DE SÉCURITÉ (BOTTOM)            -->
  <!-- ===================================================================== -->
  <!-- Left Bottom: Morning Actionable Output -->
  <rect x="20" y="610" width="760" height="190" rx="10" fill="#1e293b" stroke="#38bdf8" stroke-width="1.8"/>
  <rect x="20" y="610" width="760" height="34" rx="10" fill="url(#morning-grad)"/>
  <text x="45" y="632" fill="#f0f9ff" font-size="14" font-weight="700">
    3. AU RÉVEIL (OUVERTURE SESSION ANTIGRAVITY) — RAPPORT D'ALIGNEMENT 1-CLIC
  </text>

  <text x="45" y="666" fill="#38bdf8" font-size="12" font-weight="700">Sortie Consolidée dans Annexes/Outils_de_Travail/RAG/AUDIT_INTEGRITE.md :</text>
  <text x="45" y="690" fill="#e2e8f0" font-size="11">1. Alertes d'Écarts Métrologiques : « Waits_Plate_7075 : +4 vis M4x12 en CAO non répercutées dans FINAL_BOM »</text>
  <text x="45" y="710" fill="#e2e8f0" font-size="11">2. Alertes Visuelles SVG : « Snapshot Tirant_Bas.png plus récent que ./media/squelette_torse.svg »</text>
  <text x="45" y="730" fill="#e2e8f0" font-size="11">3. Propositions d'Hygiène Roadmap : « Le commit 3c8734d traite le script butée Waist : mettre à jour l'item [ ] ? »</text>
  <text x="45" y="750" fill="#e2e8f0" font-size="11">4. Règles Candidates (Clue -&gt; Rule) : soumises à validation humaine explicite avant toute écriture.</text>
  <text x="45" y="778" fill="#7dd3fc" font-size="11" font-weight="700">
    -&gt; L'ingénieur garde 100 % du contrôle décisionnel ; le temps de vérification documentaire chute de 90 %.
  </text>

  <!-- Right Bottom: Strict Engineering Guardrail (Red Prohibition Box) -->
  <rect x="800" y="610" width="580" height="190" rx="10" fill="#1e293b" stroke="#ef4444" stroke-width="1.8"/>
  <rect x="800" y="610" width="580" height="34" rx="10" fill="url(#danger-grad)"/>
  <text x="825" y="632" fill="#fef2f2" font-size="14" font-weight="700">
    4. GARDE-FOU INVIOLABLE (CE QU'IL EST INTERDIT DE FAIRE)
  </text>

  <text x="820" y="666" fill="#fca5a5" font-size="12" font-weight="700">ZÉRO RÉÉCRITURE AUTONOME NOCTURNE DES DOSSIERS TECHNIQUES :</text>
  <text x="820" y="690" fill="#e2e8f0" font-size="11">• Interdiction formelle pour un LLM nocturne de modifier seul un fichier</text>
  <text x="820" y="707" fill="#e2e8f0" font-size="11">  DOSSIER_TECHNIQUE_, FINAL_ ou STUDY_ sans validation humaine.</text>
  <text x="820" y="729" fill="#e2e8f0" font-size="11">• Risque évité : une hallucination silencieuse sur une tolérance (H7 vs H8),</text>
  <text x="820" y="746" fill="#e2e8f0" font-size="11">  une profondeur de taraudage borgne M4 ou un câblage XT30 48V détruirait</text>
  <text x="820" y="763" fill="#e2e8f0" font-size="11">  une pièce usinée sur la C500 ou un contrôleur RobStride.</text>
  <text x="820" y="784" fill="#fecaca" font-size="11" font-weight="700">
    -&gt; La nuit AUDITE et PRÉPARE ; le jour VALIDE et EXÉCUTE.
  </text>

  <!-- Legend Footer -->
  <rect x="20" y="818" width="1360" height="64" rx="8" fill="#0f172a" stroke="#334155" stroke-width="1.5"/>
  <text x="45" y="841" fill="#94a3b8" font-size="12" font-weight="700">LÉGENDE DU CYCLE D'INGÉNIERIE ASSISTÉE D-BOT :</text>

  <rect x="45" y="853" width="14" height="14" rx="3" fill="#065f46" stroke="#10b981" stroke-width="1.5"/>
  <text x="68" y="864" fill="#cbd5e1" font-size="11">Production Diurne (CAO Fusion 360, FEA CalculiX, Code, BOM)</text>

  <rect x="470" y="853" width="14" height="14" rx="3" fill="#4c1d95" stroke="#c084fc" stroke-width="1.5"/>
  <text x="493" y="864" fill="#cbd5e1" font-size="11">Audit Nocturne Automatisé 00:00 (Diff JSON/Doc + LightRAG)</text>

  <rect x="885" y="853" width="14" height="14" rx="3" fill="#1e40af" stroke="#38bdf8" stroke-width="1.5"/>
  <text x="908" y="864" fill="#cbd5e1" font-size="11">Validation Matinale 1-Clic</text>

  <rect x="1105" y="853" width="14" height="14" rx="3" fill="#7f1d1d" stroke="#ef4444" stroke-width="1.5"/>
  <text x="1128" y="864" fill="#cbd5e1" font-size="11">Verrou de Sécurité Matérielle</text>
</svg>
