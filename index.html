        const docs = {"Fondations: 00_Index": "# Documentation Projet Robot D-Bot (Évolution 2026)\n\nBienvenue dans la documentation technique du projet de robot humanoïde D-Bot. Cette documentation est optimisée pour l'IA et la consultation rapide.\n\n## 🚀 ÉTAT DE L'ART (SYNTHÈSES PAR ARTICULATION)\n*Pour une vision technique immédiate des dernières décisions validées (RobStride & Dynamixel).*\n\n- **[Synthèse : Épaule (Shoulder 3 DOF)](./Synthese_Etat_Actuel/SYNTHESE_Epaule.md)**\n- **[Synthèse : Hanche (Hip 3 DOF)](./Synthese_Etat_Actuel/SYNTHESE_Hanche.md)**\n- **[Synthèse : Genou (Knee 300Nm)](./Synthese_Etat_Actuel/SYNTHESE_Genou.md)**\n- **[Synthèse : Cheville (Ankle Cardan)](./Synthese_Etat_Actuel/SYNTHESE_Cheville.md)**\n- **[Synthèse : Mains (D-Hand Hybrid)](./Synthese_Etat_Actuel/SYNTHESE_Mains.md)**\n- **[Synthèse : Torse & Cou (Neck)](./Synthese_Etat_Actuel/SYNTHESE_Torse_Cou.md)**\n- **[Synthèse : Audio & IMU](./Synthese_Etat_Actuel/SYNTHESE_Audio_IMU.md)**\n- **[Synthèse : Électronique & Câblage](./Synthese_Etat_Actuel/SYNTHESE_Electronique.md)**\n\n---\n\n## 📖 GUIDES DE RÉFÉRENCE (V1)\n\n1.  **[Synthèse du Projet](./01_Synthese_Projet.md)** : Vision, Roadmaps et Architecture CPU/IA.\n2.  **[Liste des Achats (BOM)](./02_Liste_Achats.md)** : Composants exacts et liens marchands.\n3.  **[Guide Montage Mécanique](./03_Montage_Mecanique.md)** : Tolérances, roulements et CNC.\n4.  **[Électronique & Câblage](./04_Electronique_Cablage.md)** : Bus CAN, Star Power 48V et PDB.\n5.  **[Logiciel & Configuration](./05_Logiciel_Configuration.md)** : JetPack, ROS2, mROS.\n7.  **[Vision et IA](./07_Vision_IA.md)** : OAK-D Pro S2 FF et LiDAR Unitree L2 (V2).\n8.  **[Architecture Audio](./08_Architecture_Audio.md)** : XMOS XVF-3800 et Haut-Parleur.\n9.  **[Intelligence Conversationnelle](./09_Intelligence_Conversationnelle.md)** : Intégration LLM local 100% hors-ligne, STT, TTS et debug mémoire.\n10. **[Stratégie IMU et Fusion](./18_Strategie_IMU_Fusion.md)** : Équilibre Bipède (416Hz) et V-SLAM.\n9.  **[Guide Impression 3D](./annexes/impression_3d/09_Guide_Avance_Impression.md)** : Orca Slicer, PA12-CF et Recuit.\n12a. **[Guide Pièces Métal CNC](./annexes/cnc/12_Guide_Parties_Metal_CNC.md)** : C500, Alu 7075-T6 et plaques RS-04.\n12b. **[Bibliothèque CNC NestWorks](./annexes/cnc/12b_Bibliotheque_C500_Vitesses_Coupe.md)** : Vitesses de coupe et ajustements H7.\n14. **[Cinématique & Moteurs](./14_Cinematique_Moteurs.md)** : Tableau comparatif RobStride.\n\n---\n\n## 🛠️ ANNEXES & GUIDES DE DEBUG\n*Guides d'interfaçage ponctuel et configurations de bas niveau.*\n### Actionneurs RobStride\n#### Configuration Initiale\n- 31. **[Guide Debug RS-05 — Module EL05 & MotorStudio](./annexes/robstride/configuration_initiale/31_Guide_Debug_RS05_MotorStudio.md)** : Câblage CAN, DIP switches, procédure Wanptek, et connexion logicielle MotorStudio.\n- 32. **[Configuration ID, Zéro & Limites (RS-05 Cou)](./annexes/robstride/configuration_initiale/32_Configuration_ID_Limites_Cou.md)** : Procédure ID, calibration du zéro et bornes de rotation logicielles.\n\n#### Firmware\n- **[Notes de Mise à Jour Firmware (04/2026)](./annexes/robstride/firmware/01_Notes_Maj_Firmware.md)** : Traduction exhaustive du changelog des firmwares (séries RS00 à RS06) avec explications sur le calibrage, l'anti-rétro-entraînement et le watchdog.\n\n---\n\n## 🏛️ DOSSIERS D'ÉTUDES (ARCHIVES)\n*Historique des calculs, alternatives explorées et décisions passées.*\n\n- **[Étude 34 kg Baseline](./Archives/ETUDE_34kg_Baseline.md)** (Ancienne config K-Bot)\n- **[Étude Configurations Moteurs](./Archives/ETUDE_Configurations_Moteurs_Historique.md)** (Évolution A/B/C/D)\n- **[Étude Alternatives Moteurs Genou](./Archives/ETUDE_Alternatives_Moteurs_Genou.md)**\n- **[Étude Transmissions Genou](./Archives/ETUDE_Knee_Legacy_Transmissions.md)** (Vérin vs GT3)\n- **[Étude Comparatif Batteries](./Archives/ETUDE_Batterie_Comparatif.md)**\n- **[Étude Batteries Semi-Solide](./Archives/ETUDE_Batterie_Semi_Solide.md)**\n- **[Étude Cheville Cardan](./20_Etude_Cheville_Cardan.md)**\n\n\n---\n*Documentation réorganisée en Mars 2026 pour optimiser la clarté et l'indexation IA.*\n*Documentation exhaustive générée et auditée en Février/Mars 2026.*\n", "Fondations: 01_Synthese": "# Synthèse du Projet D-Bot (Évolution)\n\n## 1. Vision et Objectifs\nLe projet consiste à construire un robot humanoïde baptisé **D-Bot**.\nIl s'agit d'une **évolution majeure** de la plateforme open-source **K-Bot**, améliorée avec des actionneurs modernes et une intelligence embarquée avancée. Ce n'est pas un simple fork, mais une refonte complète de l'architecture électronique et motrice.\n\n### Améliorations Clés (vs K-Bot Original)\nLe D-Bot repose sur un système de **24 moteurs RobStride** (membres, cou) et **16 servomoteurs Dynamixel purs** (mains tactiles D-Hand Hybrid à 8 DOF chacune), une vision IA **Luxonis OAK-D Pro** (le LiDAR Unitree L2 étant réservé pour la V2), le tout piloté par une **NVIDIA Jetson Orin Nano Super** (67 TOPS) et une **Sony Spresense**.\n\n## 2. Feuille de Route (Roadmap)\nLe projet est découpé en 4 phases distinctes pour valider chaque étape critique.\n\n### Phase 1 : Tête, Torse et Cou (Focus Actuel)\n*   **Objectif** : Valider l'intelligence perception/audio et l'intégration mécanique du cou (VOR).\n*   **Matériel** : Jetson Orin Nano (**✅ Déjà achetée**), OAK-D Pro, Spresense.\n*   **Moteurs** : 2× RS-05 cou Pan/Tilt (**✅ Déjà achetés**).\n\n### Phase 2 : Premier Bras (En Préparation)\n*   **Objectif** : Validation mécanique et manipulation.\n*   **Matériel** : + 5 Moteurs Robstride (RS-04, RS-03, RS-06, RS-02, RS-00) et **D-Hand Hybrid**.\n    *   *Note : Les 5 moteurs Robstride du bras sont **✅ Déjà achetés**.*\n*   **Budget Est.** : ~3 000 € (Bras + Main).\n\n### Phase 3 : Deuxième Bras\n*   **Objectif** : Coordination bimanuelle.\n*   **Matériel** : + 5 Moteurs Robstride et **D-Hand Hybrid**.\n\n### Phase 4 : Marche (Jambes) + Cou\n*   **Objectif** : Locomotion et équilibre dynamique.\n*   **Matériel** : + 12 Moteurs (RS-04 hanches/genoux, RS-03 hanche/cheville cardan). *Note : les 2× RS-05 cou sont déjà achetés en Phase 1.*\n*   **Capteurs** : IMU torse (BMI270 Add-on) pour le contrôle d'équilibre + capteurs FSR plantaires.\n\n## 3. Architecture Matérielle\nL'architecture repose sur une séparation claire entre la puissance de calcul (IA) et le contrôle temps réel (Moteurs/Capteurs bas niveau).\n\n```mermaid\ngraph TD\n    A[NVIDIA Jetson Orin Nano] -- \"USB3 (High Speed)\" --> B[Sony Spresense]\n    A -- USB/CAN --> C[\"InnoMaker USB2CAN-C\"]\n    C -- \"Bus CAN (1 Mbps)\" --> D[Moteurs Robstride]\n    A -- USB3 --> E[\"OAK-D Pro (Vision AI)\"]\n    A -. USB .-> F[LiDAR Unitree L2 (V2)]\n\n    subgraph \"Contrôle Moteur\"\n    D --> D1[\"RS-02/03/04/06 (Membres)\"]\n    D --> D2[\"RS-00/05 (Poignets/Cou)\"]\n    A -- \"Bus TTL (U2D2)\" --> D3[\"Dynamixel XC430/XC330 (Mains)\"]\n    end\n\n    subgraph \"Perception Audio/Sensor\"\n    B --> B1[\"Micros (Beamforming)\"]\n    B --> B2[\"IMU Torse (BMI270)\"]\n    B --> B3[Capteurs I2C/SPI]\n    end\n```\n\n## 4. Plateforme de Fabrication (Stratégie Hybride)\n\nLe D-Bot utilise une approche **Squelette Aluminium CNC + Coque Imprimée 3D** pour combiner la résistance mécanique aux endroits critiques et la facilité de fabrication partout ailleurs.\n\n### Machines Disponibles\n- **Qidi Plus 4** : Impression 3D haute température (PA12-CF, PETG-CF).\n- **NestWorks C500 (Kickstarter)** : CNC 4 axes, usinage aluminium avec tolérances H7 (±0.02mm).\n\n### Répartition des Matériaux par Zone\n\n| Zone | Matériau | Machine | Justification |\n| :--- | :--- | :---: | :--- |\n| Brackets hanches/genoux (RS-04) | **Alu 6061/7075 CNC** | C500 | 120 N.m de couple, plastics insuffisants |\n| Brackets épaules (RS-04/03) | **Alu 6061 CNC** | C500 | Porte-à-faux du bras |\n| Pied / semelle structurelle | **PA12-CF** 100% | Qidi | Résistance aux chocs, rigidité |\n| Tibia / avant-bras | **PA12-CF** ou **Alu tubulaire** | Qidi/C500 | Rigidité en flexion |\n| Torse (structure interne) | **PA12-CF** 100% | Qidi | Grande surface, CNC trop coûteuse |\n| Coques extérieures (torse, bras) | **PETG-CF** 40% gyroid | Qidi | Esthétique carbone, léger |\n| Tête (boîtier capteurs) | **PETG-CF** 60% | Qidi | Masse à minimiser |\n| Phalanges main | **PA12-CF** → Alu 7075 (V2) | Qidi/C500 | Évolutif avec la C500 |\n\n- **Masse totale estimée** : ~**40.2 kg** (Configuration Hybride : RS-04 Pitch + RS-03 Roll épaules, RS-06 coudes, Cardan 2×RS-03 chevilles, D-Hand Hybrid ×2, V1 sans LiDAR).\n- **Détails Impression** : Voir le **[Guide Avancé Impression 3D](./09_Guide_Avance_Impression.md)**.\n- **Détails CNC** : Voir l'**[Usinage CNC C500](./22_Usinage_CNC_C500.md)**.\n\n## 5. Points de Vigilance Critique (Audit Discussion)\n-   **Motorisation** : Le couple de pointe (Peak Torque) des RS-04 (hanches/genoux) atteint 120 Nm. La structure doit être en PA12-CF ou Aluminium 6061.\n-   **Sécurité Électrique** : Toujours utiliser le mode **OCP** (Overcurrent Protection) sur l'alimentation Wanptek (limite à 1A pour les premiers tests).\n-   **Communication** : Le bus CAN 1 Mbps exige des paires torsadées et une masse commune (GND) entre la Jetson et les moteurs.\n-   **Maintenance** : Utiliser des connecteurs **WAGO 221** dans le cou pour faciliter le démontage rapide de la tête.\n\n---\n**Note** : Ce projet est une évolution active. Les choix techniques documentés ici reflètent l'état des lieux en Février 2026.\n", "Fondations: 02_Liste_Achats": "# Liste des Achats (BOM Consolidée)\n\n## 1. Visserie & Fixations (Hardware)\n**Stratégie** : Utilisation de vis **DIN 912 (Tête Cylindrique)** en Acier Inoxydable A2 (Inox 304) pour la résistance à la corrosion, ou Acier Noir 12.9 pour les axes moteurs de force.\n\n### Quantités Requises (D-Bot + 2x RS-05)\n| Type | Diamètre | Longueur | Quantité Est. | Usage |\n| :--- | :--- | :--- | :--- | :--- |\n| **Vis CHC** | M3 | 6mm - 12mm | ~240 | Fixations électroniques, caches, small motors |\n| **Vis CHC** | M4 | 10mm - 15mm | ~160 | Structure principale, moteurs RS-01-RS-04 |\n| **Vis CHC** | M5 | 12mm - 20mm | ~40 | Hanches, Grosses articulations |\n| **Écrous/Rondelles** | M3/M4/M5 | - | ~150 de chaque | - |\n\n### Liens d'Achat Recommandés\n*   **Protorx (France)** : [Lien vers Boîtes M3/M4 Inox](https://www.protorx.com) - *Idéal pour un stock propre*.\n*   **Vis-Express** : [Lien vers M4 DIN 912 Inox A2](https://www.vis-express.fr) - *Livraison rapide*.\n*   **ScrewsAndMore** : [Lien vers Assortiment 400pcs](https://www.screwsandmore.de) - *Rapport quantité/prix*.\n\n> **Conseil** : Achetez un kit \"Build Complet\" (1225pcs M2-M5) pour avoir du stock, et complétez avec des sachets de 50 vis M4 Acier 12.9 pour les moteurs.\n\n### Inserts Filetés (Heat-set)\n*   **Marque Recommandée** : **Ruthex** (ou CNC Kitchen).\n*   **Modèle** : RX-M3x5.7 (M3) et versions \"Longues\" pour M4.\n*   **Pourquoi ?** Les moletages opposés offrent la meilleure résistance à l'arrachement dans le PETG-CF.\n*   **Acheter chez** : [3DJake France](https://www.3djake.fr) ou Amazon.\n\n### Roulements à Section Fine (Articulations)\nPour un ratio Moment/Poids optimal en montage de type \"Chape\", fuyez les roulements standards (60xx) beaucoup trop profonds et lourds. Utilisez les séries *67xx* ou *68xx* :\n*   **Pour le Moteur RS-04 (Hanches/Genoux) : 6807-2RS**\n    *   *Dimensions* : 35 mm (Int) × 47 mm (Ext) × 7 mm (Ép).\n    *   *Masse & Capacité* : ~30g, Capacité radiale **4.8 kN** (~480 kg). Le large diamètre interne permet de passer vos câbles XT30 et CAN !\n*   **Pour le Moteur RS-03 (Cou/Chevilles) : 6705-2RS**\n    *   *Dimensions* : 25 mm (Int) × 32 mm (Ext) × 4 mm (Ép).\n    *   *Masse* : ~11g, hyper léger.\n> [!CAUTION]\n> **Joints 2RS Obligatoires** : Achetez exclusivement des versions \"2RS\" (Joints d'étanchéité en caoutchouc). Vos pièces en PA12-CF vont générer une fine poussière de carbone très abrasive qui détruira des roulements métalliques ouverts (ZZ) en quelques heures.\n\n---\n\n## 2. Moteurs & Actionneurs (Par Phase)\n\n### Phase 1 : Tête / Torse (Aucun Moteur)\n*   Focus uniquement sur les capteurs et l'intelligence.\n\n### Phase 2 : Premier Bras (5 DOF)\n| Modèle | Quantité | Couple (Peak) | Usage |\n| :--- | :--- | :--- | :--- |\n| **Robstride 04** | 1 (**✅ Acheté**) | **120 Nm** | Épaule Pitch (Force levage frontal) |\n| **Robstride 03** | 1 (**✅ Acheté**) | **60 Nm** | Épaule Roll (Écartement latéral) |\n| **Robstride 06** | 1 (**✅ Acheté**) | **36 Nm** | Coude |\n| **Robstride 02** | 1 (**✅ Acheté**) | **17 Nm** | Épaule Yaw |\n| **Robstride 00** | 1 (**✅ Acheté**) | 14 Nm | Poignet Roll |\n\n### Phase 3 : Deuxième Bras (5 DOF identiques)\n*Même configuration que Phase 2, symétriquement.*\n\n### Phase 4 : Jambes + Cou (14 DOF)\n| Modèle | Quantité | Couple (Peak) | Usage |\n| :--- | :--- | :--- | :--- |\n| **Robstride 04** | 4 | **120 Nm** | Hanches Pitch + Genoux |\n| **Robstride 03** | 4 | **60 Nm** | Hanches Roll/Yaw |\n| **Robstride 03** | 4 | **60 Nm** | Chevilles Pitch+Roll (**2× par cheville**, architecture cardan + bielles) |\n| **Robstride 05** | 2 (**✅ Achetés**) | **5.5 Nm** | Cou Pan/Tilt |\n\n> **Note** : Architecture cheville = Cardan DIN 808 + 2× RS-03 par cheville (différentiel Pitch/Roll). Voir [Étude Cheville](./20_Etude_Cheville_Cardan.md) pour le détail.\n\n### Phase 5 : Mains (16 DOF — 8 par main)\n| Modèle | Quantité | Couple (Peak) | Usage |\n| :--- | :--- | :--- | :--- |\n| **Dynamixel XC430-W240-T** | 8 | **1.9 Nm** | Canaux de Force (Pouces, Index, Majeurs, Paumes) |\n| **Dynamixel XC330-T288-T** | 8 | **1.0 Nm** | Canaux de Précision (Oppositions, Abductions, Annulaires, Auriculaires) |\n| **U2D2** (USB↔Dynamixel) | 2 | — | Interface bus TTL (1 par main) |\n| **Buck 48V→12V 5A** | 2 | — | Alimentation servos main depuis bus 48V. **⚠️ Entrée ≥ 60V obligatoire** (batterie = 54.6V chargée). Recherche : `\"DC DC converter 48V 12V 5A 60W\"`. ~10-18 €/pièce |\n| **Kit Tactile eFlesh** | 2 | — | Silicone Ecoflex 00-30, 10× MLX90393, 10× aimants N52 par main |\n\n> **Note** : Voir [Étude Main Robotique](./21_Etude_Main_Robotique.md) pour l'architecture D-Hand Premium.\n\n### Autres Composants Électroniques\n| Composant | Modèle | Quantité | Note |\n| :--- | :--- | :--- | :--- |\n| Distribution Centrale | **Busbar double cuivre (Busbar 2 voies)** 12 x M4, 150A + Couvercle | 1 | (**✅ Acheté**) Torse. Distribution centrale validée 48V/150A. |\n| Distribution Jambes | **Mini-busbars 6 bornes** cuivre, 60V+ | 2 | Splitters locaux bassin G/D. Amazon `\"bus bar 6 way marine\"`. ~8-12 €/pce |\n| Splitters Bras/Cou | **WAGO 221-413 / 221-415** | 10 (**✅ Achetés**) | Splitters locaux dans les bras (2×WAGO-415 par bras) et le cou (WAGO-413). 32A / 450V sans soudure. |\n| Fusibles par zone | **Porte-fusible lame en ligne** + fusibles 80A ×1 + 50A ×2 + 30A ×2 + 5A ×1 | 6 | Isolation de faute par membre. Amazon `\"porte-fusible lame automobile en ligne\"`. ~3-5 € le lot |\n| Connecteurs XT60/XT30 | **Connecteurs nus Mâle/Femelle (pré-étamés)** | 1 lot | (**✅ Achetés**) Pour fabriquer les pigtails sur-mesure des moteurs et les troncs détachables. |\n| Câbles de Puissance | **Rouleaux Silicone 14 AWG et 18 AWG** | 1 lot | (**✅ Achetés**) Rouge + Noir. 14 AWG (troncs/gros moteurs), 18 AWG (rouleau 30m pour petits moteurs). |\n| Alimentation Labo | **Wanptek DPS605U** (60V/5A) | 1 (**✅ Achetée**) | Indispensable Phases 1-4 (48V). Limite 3A pour RS-04/05 (voir [§4c](./04_Electronique_Cablage.md#4c-séquence-de-validation--wanptek--batterie)). Manuel : [dps605U.pdf](./manuels/dps605U.pdf). |\n| Interface CAN — Bus Cou | **InnoMaker USB2CAN-C** | 1 (**✅ Acheté**) | Bus Cou : RS-05 Pan + Tilt (2 moteurs). Manuel : [usb2can.pdf](./manuels/usb2can.pdf). |\n| Interface CAN — Bus Membres | **CANable Pro** (isolation galvanique 2.5kV, firmware candleLight) | 4 (à acheter) | 1 par membre (Bras G, Bras D, Jambe G, Jambe D). Achat progressif possible. Sources : [openlightlabs.com](https://openlightlabs.com) ~45 USD, AliExpress `\"CANable Pro isolated 2.5kV\"` ~20-35€, [Tindie](https://tindie.com) ~30-40€. Vérifier la mention **\"2.5kV galvanic isolation\"**. |\n| Hub USB | **Hub USB alimenté multi-ports** | 1 (à choisir) | Choix différé — à déterminer après liste complète des périphériques Jetson (CAN ×5, U2D2 ×2, module de debug, Spresense, OAK-D...). |\n| Module de Debug | **Module de Debug RobStride (Isolation Galvanique)** | 1 (**✅ Acheté**) | Config/debug uniquement via RobStride Studio. 1 seul suffit pour tous les moteurs. |\n\n> **Note** : Vérifiez bien que les moteurs arrivent avec leurs câbles d'alimentation (XT60) et data (JST-GH). Sinon, commander séparément.\n\n---\n\n## 3. Électronique & Cerveau (Détail Phase 1 & 2)\n\n| Composant | Modèle | Note |\n| :--- | :--- | :--- |\n| **Cerveau IA** | **NVIDIA Jetson Orin Nano Super** (8GB, 67 TOPS) | (**✅ Achetée**) |\n| **Vision (Tête)** | [Luxonis OAK-D Pro FF](https://www.mouser.fr/ProductDetail/Luxonis/OAK-D-PRO-FF?qs=Znm5pLBrcAK58KqDdxCLeQ%3D%3D) | (**✅ Achetée**) Version Fixed-Focus (FF) recommandée (vibrations). |\n### Électronique de Contrôle\n- **Sony Spresense** :\n    - [*Main Board*](https://www.mouser.fr/ProductDetail/Sony-Spresense/CXD5602PWBMAIN1_FG_875607611_P?qs=%252B6g0mu59x7Ifurwfgmhhqg%3D%3D) + [*Extension Board* (Standard)](https://www.mouser.fr/ProductDetail/Sony-Spresense/CXD5602PWBEXT1E_FG_875612931_P?qs=%252B6g0mu59x7IfMFVSCO3mMw%3D%3D) (**✅ Achetées**).\n    - **Note** : La Spresense **ne gère plus l'audio** (remplacé par le ReSpeaker). Ses rôles restants : Watchdog, Power Management, IMU BMI270, FSR, Thermistances.\n- **IMU Torse (Équilibre)** : [**SparkFun 6DoF IMU Breakout - BMI270** (Réf: `SEN-22397`)](https://www.mouser.fr/ProductDetail/SparkFun/SEN-22397?qs=1Kr7Jg1SGW8PccltG0E4HQ%3D%3D) (**✅ Achetée**) + Câble. \n    - **C'est l'IMU principale d'équilibre** du robot (voir [18 — Stratégie IMU](. ell DDR-15G-5** (ou Buck 60V->5V) | Alimente la Spresense en permanence (Always-On). |\n| **Switch Puissance** | **Infineon BTS50085-1TMA** (ou MOSFET Opto) | Coupe le 48V (Jetson/Moteurs) sur ordre de la Spresense. |\n| **Pont Diviseur** | Résistances 150kΩ + 10kΩ | Surveillance de la tension batterie 13S (48V). |\n| **Condensa.** | 1000µF / 63V (Low ESR) | Filtrage des pics de tension au branchement. |\n| **Connecteur** | **Anderson SB50** (anti-spark) ou XT90-S | Connecteur haute puissance pour batterie 13S NMC 48V. |\n| **Batterie Phase 1 (prototype)** | **Batterie VAE 48V 13S NMC 10Ah BMS 30A+** (format boîte, connecteur XT60) | ~180-350 €. Sources vérifiées FR : [Save My Battery](https://www.savemybattery.fr) (~350€) ou [Yose Power](https://www.yosepower.com) (~250€) ou Amazon.fr (`\"batterie 48V 13S 10Ah BMS\"`). **Vérifier : BMS 13S, ≥30A continu, connecteur XT60.** Voir [§4](./04_Electronique_Cablage.md#4-alimentation--batterie). |\n| **Batterie Phase 2 (production)** | **Pack sur-mesure 48V 13S NMC, forme optimisée** | ~400-700 €. À commander quand le torse CAO est figé : [OZO Electric](mailto:batteries@ozo-electric.com) ou [Save My Battery](https://www.savemybattery.fr) ou [Neogy](https://www.neogy.fr). |\n| **Chargeur 13S** | **54.6V CC/CV 4-5A** | Chargeur dédié Li-ion 13S NMC (souvent livré avec la batterie VAE). |\n| ~~**LiDAR**~~ | ~~**Unitree L2**~~ | ⚠️ **Repoussé à la V2**. SLAM assuré par l'OAK-D Pro en V1. Voir [Analyse LiDAR](./19_Perception_Spatiale_LiDAR.md). |\n\n### Interface CAN & Câbles\n*   **Adaptateur USB-CAN** : **InnoMaker USB2CAN-C**\n    *   *Critique* : Basé sur firmware `gs_usb` (compatible Linux natif).\n*   **Module de Debug** : **R-Link**\n    *   Un seul module USB vers CAN suffit pour paramétrer tous les moteurs via *RobStride Studio*. Exiger l'**Isolation Galvanique** pour protéger le PC de la tension 48V.\n*   **Connecteurs Data** : **JST-GH 1.25mm** (Marque Holybro recommandée pour la qualité).\n    *   Acheter des câbles ** |\n| Trou Insert (PETG-CF) | dh | 4.2 - 4.5 mm | 5.6 - 5.8 mm |\n| Épaisseur Plancher | T | 3.0 mm min | 4.0 mm min |\n\n---\n\n### Inserts et Roulements\n- **Inserts Ruthex** : Utilisez les versions **Longues (8.1mm)** pour les RS-04. Les versions courtes (5.7mm) suffisent pour les carters.\n\n### Commande CNC (Aluminium 6061)\n- **Format** : Fichiers `.step` uniquement.\n- **Rayons** : Rayons internes de **2mm minimum** (usinage fraise).\n- **Finition** : \"As Machined\" (le plus économique).\n\n### Chambrages (Counterbore) pour têtes de vis DIN 912\nL'objectif est de noyer la tête de vis pour qu'elle ne dépasse pas, tout en laissant passer la clé Allen.\n| Paramètre | Symbole | M3 | M4 |\n| :--- | :--- | :--- | :--- |\n| **Diamètre Chambrage** | $D_{cb}$ | **6.5 mm** | **8.5 mm** |\n| **Profondeur** | $H_{cb}$ | **3.5 mm** | **4.5 mm** |\n| **Passage de vis** | $d$ | 3.4 mm | 4.5 mm |\n\n> **Astuce Fusion 360** : Utilisez l'outil *Hole (H)* > *Counterbore* > *Simple* > *Flat*.\n\n### Trous pour Inserts (Heat-set)\nCes diamètres sont optimisés pour les inserts Ruthex standards.\n| Paramètre | M3 | M4 |\n| :--- | :--- | :--- | \n| **Diamètre perçage** | **4.2 - 4.5 mm** | **5.6 - 5.8 mm** |\n| **Épaisseur paroi min** | 1.6 mm | 2.0 mm |\n| **Épaisseur fond plan** | **3.0 mm** (Min) | **4.0 mm** (Min) |\n\n---\n\n## 2. Impression 3D (Qidi Plus 4)\n\n### Matériau Recommandé : PETG-CF\nLe PETG renforcé fibre de carbone (PETG-CF) est le meilleur compromis pour le D-Bot sur cette machine.\n*   **Avantages** : Rigidité accrue (moins de flexion que le PETG pur), aspect mat qui cache les couches, bonne tenue en température (vers 80°C).\n*   **Inconvénients** : Abrasif (utilisez une buse acier trempé).\n\n*   **(A) PLA** : Pour le prototypage rapide et validation de forme. **(~20€/kg)**\n*   **(B) PETG-CF** (Recommandé) : Rigide, facile à imprimer, esthétique carbone. Suffisant pour 80% du robot. **(~30€/kg)**\n*   **(C) PA12-CF** (Nylon Carbone) : Performance ultime (Chaleur/Choc). Nécessite enceinte chauffée + séchage pro. Pour les pièces critiques uniquement (Hanches). **(~100€/kg)**\n\n### Comparatif Matériaux\n| Critère | PLA (Proto) | PETG-CF (Standard) | PA12-CF (Pro) |\n| :--- | :--- | :--- | :--- |\n| **Coût (Est.)** | 20€ / kg | **30€ / kg** | 100€ / kg |\n| **Rigidité** | Moyenne | Élevée | Très Élevée |\n| **Résistance Chaleur** | Faible (50°C) | Moyenne (75°C) | Haute (100°C+) |\n| **Facilité Impression** | Très Facile | Facile | Difficile (Warping) |\n| **Usage D-Bot** | Tests de forme | **Coques, Bras, Tête** | Gears, Hanches |\n\n### Paramètres de Slicer (OrcaSlicer / QidiSlicer)\n*   **Matériau** : Creality Hyper **PETG-CF** (Recommandé pour débuter).\n    *   *Alternative Pro* : **PA12-CF** (Nylon Carbone). Plus rigide et résistant à la chaleur, mais nécessite une enceinte chauffée et un séchage parfait. À réserver aux utilisateurs expérimentés.\n*   **Températures** :\n    *   **Buse** : 270°C\n    *   **Plateau** : 80°C\n    *   **Chambre (Active)** : 50°C\n*   **Vitesse** : 200-300 mm/s.\n*   **Hauteur de couche** : 0.20 mm (Standard) ou 0.16 mm (Précision engrenages).\n*   **Périmètres (Walls)** : **4 à 5 murs minimum**. C'est le plus important pour la solidité des filetages/inserts.\n*   **Remplissage (Infill)** :\n    *   **100% (Solid)** pour : Hanches, Épaules, Supports Moteurs.\n    *   **40% (Gyroid)** pour : Coques, avant-bras, tête.\n*   **Séchage** : Obligatoire avant impression (65°C / 6h).\n\n---\n\n## 3. Montage des Moteurs Robstride\n\n### Sécurisation Haute Charge (RS-04: 120 N.m)\nLe couple pharaonique des moteurs RS-04 (Hanches et Genoux) génère des efforts de cisaillement massifs d'environ 4000 N sur le cercle de perçage radial. Pour empêcher les vis de cisailler ou les pièces plastiques (PA12-CF/PETG-CF) de s'écraser et de s'ovaliser sous la pression :\n1.  **Goupilles de Positionnement (Dowel Pins)** : Ne comptez **jamais** sur le corps des vis pour encaisser le couple. Insérez impérativement 2 goupilles cylindriques rectifiées en acier trempé (Ø5mm ou Ø6mm en diamétralement opposé) pour reprendre le cisaillement pur.\n2.  **Interface Aluminium CNC** : Usinez systématiquement une plaque en Aluminium de 5mm à la **CNC C500** (cf. [Guide CNC](./annexes/cnc/12_Guide_Parties_Metal_CNC.md)) entre le stator RS-04 et le squelette pour dissiper l'énorme chaleur générée par le moteur à l'arrêt, et servir de cage de rétention.\n3.  **Visserie Acier 12.9** : Remplacez l'inox A2 standard par de la visserie de classe **12.9** (Acier bruni) sécurisée avec du frein-filet **Loctite 243** (Bleu) pour anticiper les chocs de la course.\n4.  **Inserts et Rondelles** : Le serrage sur plastique requiert systématiquement de larges rondelles d'appui.\n\n### Intégration Robstride 05 (RS-05) - Cou / Poignets\n*   **Ancrage** : Le couple de pointe (5.5 Nm) est élevé pour du plastique.\n    *   Utilisez des **vis M4 x 12mm Acier 12.9 (Noir)** pour fixer le corps moteur au châssis. L'Inox est trop \"mou\" pour ces zones de force pure si vous démontez souvent.\n*   **Longueur de vis** : Règle d'or = Épaisseur pièce plastique + (Profondeur trou moteur - 1mm).\n    *   *Ne forcez jamais* si la vis touche le fond du trou borgne du moteur ! Vous détruiriez le filetage interne du stator.\n\n### Maintenance Rapide (Connectique Tête/Cou)\n- **Tête/Cou** : L'utilisation de borniers **WAGO 221-413 (3 entrées)** ou **415 (5 entrées)** est vivement recommandée pour les liaisons LiDAR et moteurs de cou. Cela permet de remplacer un capteur ou un moteur en 30 secondes sans soudure, tout en garantissant un contact électrique fiable face aux vibrations.\n\n### Roulements à Section Fine (Articulations Actives)\n*   Pour les **articulations actives** (hanches, genoux, cou), utilisez impérativement les **roulements à section fine** (6807-2RS, 6705-2RS) documentés dans la BOM §1.\n\n\n### Architecture Articulaire : Montage en Chape (Simple Soutien) vs Double Soutien\nPour le design mécanique des jonctions de genou et de hanche du D-Bot (39 kg), deux écoles d'ingénierie s'affrontent :\n1.  **Le Double Soutien (Hyperstatique / Cage)** : Consiste à enfermer le RS-04 dans une cage avec deux gros roulements externes soutenant l'axe de chaque côté du stator pour totalement isoler le moteur. *Risque Majeur* : L'alignement des deux roulements externes avec les roulements internes du moteur doit être parfait au micron près. Le moindre défaut de concentricité lors d'un assemblage génère des contraintes internes qui ruineront le moteur par friction.\n2.  **Montage en Chape Rigide (Recommandé)** : C'est le standard de l'industrie (ex: Unitree Go2). Le stator du moteur D-Bot est fixé d'un côté. L'axe de sortie (rotor) traverse le membre et est supporté par **un seul** roulement à l'extrémité opposée (montage en porte-à-faux supporté).\n    *   **Mise en œuvre D-Bot** : Utilisez un support en Aluminium 7075 usiné à la CNC C500. Du côté opposé au moteur, insérez un roulement étanche à section fine **6807-2RS** (pour laisser passer les câbles XT30/CAN de 35mm). L'ensemble doit être lié par une entretoise transversale extrêmement rigide assurant la coaxialité parfaite.\n\n### Fixation Axiale des Roulements sur Arbre (Aluminium CNC)\nL'assemblage des roulements à section fine sur l'axe en aluminium de la chape demande une géométrie stricte pour durer :\n1.  **L'Épaulement (Butée)** : Il sert de référence perpendiculaire. Sa hauteur doit **uniquement** s'appuyer sur la bague *intérieure* du roulement. S'il est trop haut et frotte la bague extérieure ou le joint 2RS, votre moteur forcera et surchauffera.\n2.  **La Gorge de Décharge** : La CNC laissera toujours un rayon (congé d'outil) à la base de l'épaulement, ce qui crée un faux-rond repoussant le roulement. Usinez une toute petite gorge de décharge dans cet angle pour garantir que le roulement plaque à plat contre le mur de l'épaulement.\n3.  **Rétention par le Haut (Le Piège)** :\n    *   *Cou / Bras (Léger)* : Le blocage par un simple **Circlips** (anneau élastique) suffit amplement. Assurez-vous d'usiner la gorge à la largeur exacte du roulement (+0.05 mm) pour éviter tout \"cliquetis\" qui éroderait l'axe en alu.\n    *   *Genoux / Hanches (Lourd 39 kg)* : Un choc latéral brutal peut faire sauter un circlips de sa gorge. Sur ces gros points névralgiques, remplacez-le par un **Écrou à encoches (Écrou KM)** ou une grosse entretoise pleine vissée en bout d'arbre. C'est plus lourd, mais indestructible.\n\n---\n\n## 4. Intégration Cheville 2-DOF (Roll + Pitch) [Phase 4] — Architecture Cardan DIN 808\n\n> ⚠️ **Mise à jour Mars 2026** : L'ancienne architecture (RS-02 Pitch + RS-00 Roll avec Bracket en L) a été **remplacée** par le système **Cardan DIN 808 + 2× RS-03 + Bielles Carbone**, retenu pour sa robustesse et ses performances supérieures (120 N.m Pitch + 120 N.m Roll). Voir [20_Etude_Cheville_Cardan.md](./20_Etude_Cheville_Cardan.md) pour l'étude complète.\n\n### Principe\nLes deux moteurs **RS-03** (60 N.m chacun) sont fixés **en haut du tibia** (pas dans le pied). Chacun actionne la cheville via une **bielle en carbone** (tube 3K Ø10/8mm) avec un ratio d'amplification mécanique de ~2:1, portant le couple effectif à **120 N.m** par axe (Pitch et Roll). Le joint de liaison est un **Cardan DIN 808 Série G** (acier C45, axe 12mm) commercial.\n\n### Avantages vs Ancien Design\n| Critère | Ancien (RS-02+RS-00) | Nouveau (Cardan + 2×RS-03) |\n| :--- | :---: | :---: |\n| Couple Pitch | ~34 N.m | **120 N.m** |\n| Couple Roll | 14 N.m | **120 N.m** |\n| Masse distale (pied) | ~870g (moteurs) | **~0g** (moteurs en haut du tibia) |\n| Robustesse | Fragile | Acier C45 industriel |\n\n### Pièces Clés\n*   **Cardan** : Michaud Chailly A5-473-12 (DIN 808, Ø axe 12mm).\n*   **Bielles** : Tubes carbone 3K Ø10/8mm + rotules Igus EBRM-05.\n*   **Capteurs FSR** : 4× FSR 402 dans la semelle du pied (mesure du CoP).\n*   **Semelle** : PA12-CF + patin TPU/caoutchouc 2mm pour le grip.\n\n> Pour le détail complet (fournisseurs, montage, cinématique) : **[Étude Cheville Cardan](./20_Etude_Cheville_Cardan.md)** | **[Révision 39 kg](./15c_Revision_Cardan_39kg.md)**\n\n", "Conception: 04_Electronique_Cablage": "# Électronique & Câblage\n\n## 1. Schéma Global de Connexion\nL'architecture repose sur un bus CAN centralisé et des liaisons USB High-Speed.\n\n### Cerveau Principal (NVIDIA Jetson Orin Nano)\n*   **Alimentation** : 19V DC (via Jack ou XT60 régulé).\n*   **Rôle** : Orchestrateur ROS2, Vision IA, Planification de mouvement.\n*   **Ports** :\n    *   **USB A** -> **InnoMaker USB2CAN** (Contrôle Moteurs)\n    *   **USB C** -> **OAK-D Pro** (Vision Stéréo + IA)\n    *   **USB A** -> **Sony Spresense** (Audio / Capteurs TR)\n\n---\n\n## 2. Bus CAN (Moteurs Robstride)\n\nC'est la colonne vertébrale du robot. Une erreur ici rend le robot inerte.\n\n### Principe du Bus CAN\n\nLe bus CAN (Controller Area Network) est le protocole de communication entre la Jetson et tous les moteurs RobStride. Il fonctionne sur 3 fils :\n- **CAN_H** et **CAN_L** : la paire différentielle (signal)\n- **GND** : la masse commune — **critique**, sans elle le signal \"flotte\" et génère des erreurs \"Bus Off\"\n\nTous les moteurs d'un même bus sont **chaînés en série** (daisy-chain), du premier au dernier. Le dernier moteur doit porter une **résistance de terminaison 120 Ω**.\n\n---\n\n### Combien de bus CAN et pourquoi ?\n\n> [!NOTE]\n> Ce n'est pas un choix arbitraire — c'est **une contrainte physique du protocole CAN** qui impose le découpage en zones.\n\n**Calcul de capacité par bus (1 Mbps) :**\n- Taille d'une trame RobStride (position + vitesse + couple) : ~130 bits\n- Boucle de contrôle cible : **1 kHz** (1000 commandes/sec/moteur)\n- Bande passante consommée par moteur : **~130 kbps**\n- Capacité maximale théorique : 1000 / 130 ≈ **7 moteurs**\n- **Règle pratique retenue : 5-6 moteurs par bus** (marge pour les acquittements et les pics)\n\n| Bus CAN | Moteurs | Nb | % bande passante |\n| :--- | :--- | :---: | :---: |\n| **Bus Cou** | RS-05 Pan + RS-05 Tilt | **2** | ~26% ✅ |\n| **Bus Bras G** | RS-04, RS-03, RS-02, RS-06, RS-00 | **5** | ~65% ✅ |\n| **Bus Bras D** | RS-04, RS-03, RS-02, RS-06, RS-00 | **5** | ~65% ✅ |\n| **Bus Jambe G** | RS-04 ×2, RS-03 ×4 | **6** | ~78% ✅ |\n| **Bus Jambe D** | RS-04 ×2, RS-03 ×4 | **6** | ~78% ✅ |\n\n> **Les mains (Dynamixel XC430/XC330)** utilisent le protocole **TTL half-duplex** via le module **U2D2** — elles sont **entièrement indépendantes du bus CAN**. Aucun adaptateur CAN n'est nécessaire pour les mains.\n\n---\n\n### Choix du matériel USB2CAN — Étude Comparative\n\nTrois options ont été évaluées :\n\n| Option | Format | Prix total | Ports USB | Isolation | Verdict |\n| :--- | :--- | :---: | :---: | :---: | :---: |\n| **4× InnoMaker USB2CAN-C** (simple) | Boîtier ~80×50mm | ~120€ | 4+ | ✅ | Trop encombrant |\n| **2× InnoMaker USB2CAN-X2** (dual) | Boîtier ~80×50mm | ~160€ | 2 | ✅ | Cher |\n| **1× InnoMaker + 3× CANable Pro** | PCB nu **45×16mm** | **~100-130€** | 4 (hub) | **✅ Isolation 2.5kV** | **✅ Retenu** |\n\n#### Architecture Définitive Retenue\n\n| Adaptateur | Bus | Moteurs | Statut |\n| :--- | :--- | :--- | :--- |\n| **InnoMaker USB2CAN-C** | Bus Cou | RS-05 Pan + RS-05 Tilt | ✅ Acheté |\n| **CANable Pro n°1** | Bus Bras G | 5 moteurs RS | À acheter |\n| **CANable Pro n°2** | Bus Bras D | 5 moteurs RS | À acheter |\n| **CANable Pro n°3** | Bus Jambe G | 6 moteurs RS | À acheter |\n| **CANable Pro n°4** | Bus Jambe D | 6 moteurs RS | À acheter |\n\n> **Note** : 4 CANable Pro sont nécessaires pour les membres. Si le budget est contraint, un 1er achat de 3 CANable Pro suffit pour les 2 bras + 1 jambe (Phase 2-3), le 4e s'achète en Phase 4 avec les jambes.\n\nLe **CANable Pro** est la version avec **isolation galvanique 2.5kV** du CANable 2.0 open-source, au même format ultra-compact (45 × 16 mm). Avec le firmware **candleLight**, il apparaît nativement comme interface `gs_usb` sous Linux — identique à l'InnoMaker.\n\n**Sources d'achat :**\n- **[openlightlabs.com](https://openlightlabs.com)** : fabricant officiel, ~45 USD, qualité garantie\n- **AliExpress** : chercher `\"CANable Pro isolated 2.5kV\"` ou `\"USB CAN isolated candleLight\"`, ~20-35€\n- **[Tindie.com](https://tindie.com)** : vendeurs vérifiés, ~30-40€\n\n> [!WARNING]\n> Sur AliExpress, vérifier que la fiche mentionne explicitement **\"2.5kV galvanic isolation\"**. Les CANable 2.0 standard (sans isolation) sont souvent vendus sous le même nom.\n\n```\nJetson Orin Nano\n    └── Hub USB (modèle à choisir après liste complète des périphériques)\n         ├── InnoMaker USB2CAN-C (✅ Acheté) → Bus Cou    (RS-05 ×2)\n         ├── CANable Pro n°1    (à acheter) → Bus Bras G (RS-04/03/02/06/00)\n         ├── CANable Pro n°2    (à acheter) → Bus Bras D (idem)\n         ├── CANable Pro n°3    (à acheter) → Bus Jambe G (RS-04 ×2 + RS-03 ×4)\n         └── CANable Pro n°4    (à acheter) → Bus Jambe D (idem)\n\nDynamixel (Mains) :\n    └── Hub USB → U2D2 Main G  (TTL, indépendant CAN)\n    └── Hub USB → U2D2 Main D  (TTL, indépendant CAN)\n```\n\n---\n\n### Topologie du Câblage Data (CAN) par Bus\n\n> [!CAUTION]\n> **Interdiction absolue de faire un \"Y\" (étoile)** : Ne dérivez jamais le câble CAN. Les stubs > 30 cm corrompent le signal à 1 Mbps.\n\n```\nCANable/InnoMaker\n      │\n   Moteur ID-1 ── Moteur ID-2 ── ... ── Moteur ID-N\n                                               │\n                                      [Résistance 120 Ω]\n```\n\n**Règles :**\n1. Chaque moteur a un **ID unique sur son bus** (configurer via module de debug avant montage)\n2. La résistance **120 Ω** se place **uniquement sur le dernier moteur** de la chaîne\n3. Le fil **GND** doit relier l'adaptateur CAN à la masse commune moteurs (borne **-** du busbar)\n\n**Couleurs des fils RobStride :**\n- **CAN_H** → Fil Jaune\n- **CAN_L** → Fil Blanc\n- **GND** → Fil Noir\n\n---\n\n### Module de Debug (✅ Déjà Acheté)\n\nLe module de debug est un outil de **configuration uniquement** — il ne sert pas à faire tourner le robot en conditions normales. Il sert à :\n- Attribuer les **ID uniques** (1, 2, 3...) à chaque moteur via *RobStride Studio*\n- Mettre à jour les firmwares moteurs\n- Tester un moteur individuellement sur le banc\n\n**Un seul module de debug suffit** pour configurer tous vos moteurs, un à un.\n\n> [!IMPORTANT]\n> **Isolation galvanique obligatoire** : Votre module de debug possède une isolation galvanique (optocoupleur). C'est indispensable pour protéger votre PC lors des sessions de debug sur le banc avec le 48V.\n\n___\n\n## 3. Sony Spresense & OAK-D Pro\n\n### OAK-D Pro (Vision)\n*   Agit comme un capteur USB3.\n*   Intègre une **IMU (BNO085/BMI270)** — **utilisée uniquement pour la stabilisation du regard**, pas pour l'équilibre du corps (voir [18 — Stratégie IMU](./18_Strategie_IMU_Fusion.md)).\n\n### Sony Spresense (Audio & I/O)\n*   **Carte Extension Choisie** : **Standard Board** (CXD5602PWBEXT1).\n    *   *Raison* : Permet de brancher jusqu'à **8 microphones numériques** pour le Beamforming (localisation de la voix).\n    *   *Évolutabilité* : Headers Arduino compatibles pour ajouter des shields futurs.\n*   **Alternative LTE** : Si le robot doit sortir en extérieur (hors Wi-Fi), une **LTE Extension Board** aurait été préférée, mais la Standard offre plus de flexibilité I/O audio pour un robot social.\n*   **Liaison Jetson** : Via USB (Port principal micro-USB de la Spresense). La Spresense apparaît comme un périphérique série (`/dev/ttyUSBx`) ou Audio USB selon le sketch chargé.\n\n---\n\n### Mise sous tension (Sécurité Wanptek)\nPour les premiers tests moteurs (Banc d'essai) :\n1.  Régler la tension à **24.0V** (ou 48V) à vide.\n2.  Régler la limite de courant à **3.0A** pour 2× RS-05 (voir [Doc 33 §1](./annexes/robstride/configuration_initiale/33_Test_Multi_Moteurs_CAN_Banc.md) pour le détail par moteur).\n3.  Activer le mode **OCP** (Overcurrent Protection).\n4.  Séquence : Allumer l'alim → Vérifier tension → Brancher XT30 → `Enable` logiciel.\n\n> [!TIP]\n> **Manuel Utilisateur** : Le manuel de la Wanptek est disponible ici : [dps605U.pdf](./manuels/dps605U.pdf).\n\n> [!WARNING]\n> **3 bornes Wanptek : (+), (-) et (⏚ GND).** Brancher les moteurs et le module de debug sur la borne **(-)** uniquement. La borne **(⏚ GND)** est la terre de protection secteur (PE) — ne rien brancher dessus. Voir [Doc 04 §4b](./04_Electronique_Cablage.md#4b-c%C3%A2bles-de-puissance-moteurs--guide-dachat-et-longueurs) pour le détail.\n\n> [!IMPORTANT]\n> **Pourquoi couper les fils pré-étamés d'usine ?**\n> Les moteurs arrivent avec des fils étamés (soudure au bout) pour faciliter la soudure sur PCB. Cependant, pour une **connexion mécanique** (WAGO à ressort ou Cosse ronde à sertir), l'étain est trop rigide et \"flue\" (se déforme) avec le temps, ce qui peut desserrer la connexion. \n> **Action** : Coupez les 5 derniers mm d'étain pour retrouver le cuivre nu souple avant de l'insérer dans un WAGO ou une cosse.\n\n## 4. Alimentation & Batterie\n\n### Spécifications Système\n*   **Tension nominale** : **46.8V** (13S Li-ion NMC) — Standard K-Bot.\n*   **Tension max (charge)** : 54.6V (13S NMC, chargeur CC/CV dédié).\n*   **Connecteur principal** : **Anderson SB50** (anti-spark) ou **XT90-S**.\n*   **Distribution** : **PDB (Power Distribution Board)** type Matek PDB-HEX pour éclater le 48V vers les moteurs.\n*   **Sécurité** :\n    *   Fusible automobile 80A sur la ligne principale.\n    *   Bouton d'arrêt d'urgence (E-Stop) coupant l'alim moteurs mais *pas* la Jetson.\n    *   MOSFET piloté par Spresense pour coupure logicielle (voir [Guide Watchdog](./11_Guide_SensiEDGE_Watchdog.md)).\n\n> [!NOTE]\n> **Pourquoi 13S (48V) et non 12S (44V) ?** Le \"S\" = nombre de cellules en Série. Chaque cellule NMC fait 3.6V nominal. 13 × 3.6V = 46.8V ≈ \"bus 48V\" — c'est le standard des RobStride et du K-Bot officiel. En 12S (43.2V), les moteurs fonctionnent mais avec un couple réduit de ~8%. Le passage en 12S LiPo (3.7V/cellule = 44.4V) serait un compromis acceptable pour du RC, mais pour le D-Bot on suit le standard K-Bot.\n\n### Choix de Batteries — Stratégie Progressive (Avril 2026)\n\n> [!IMPORTANT]\n> **Stratégie retenue : Progressive en 2 phases.** La forme finale du torse n'étant pas encore validée, l'espace batterie exact est inconnu. On démarre avec une batterie **standard VAE 48V** (format rectangulaire universel, achat immédiat) pour prototyper, puis on passera à du **sur-mesure** (forme optimisée pour le CdG du robot) une fois le châssis figé.\n\n---\n\n#### Phase 1 — Prototype : Batterie VAE Standard 48V (Achat Immédiat)\n\nUne batterie de vélo électrique 48V (13S) est le choix le plus pragmatique pour le prototype :\n- Disponible immédiatement sur Amazon.fr, AliExpress, ou chez des spécialistes FR\n- BMS 13S intégré avec protection (surcharge, sous-tension, court-circuit)\n- Connecteur XT60 ou Anderson souvent inclus\n- Format boîte rectangulaire « universel » facile à fixer avec du Velcro\n\n| Paramètre | Spécification Recherchée |\n| :--- | :--- |\n| **Chimie** | Li-ion NMC (18650 ou 21700) |\n| **Tension** | 48V nominale (13S), 54.6V max charge |\n| **Capacité** | 10 Ah minimum (480 Wh) |\n| **BMS** | 30A continu minimum (50A+ recommandé) |\n| **Connecteur** | XT60 pré-câblé (ou adaptable) |\n| **Poids** | 2.5–4.0 kg selon les cellules |\n| **Budget** | 180–350 € TTC |\n\n**Où acheter (vérifié accessible en France, Avril 2026) :**\n\n| Source | Type | Prix | Avantage | Lien |\n| :--- | :--- | :---: | :--- | :--- |\n| **Save My Battery** | Assemblage FR, cellules marque | ~300–450 € | 🇫🇷 SAV français, cellules Samsung/LG | [savemybattery.fr](https://www.savemybattery.fr) |\n| **Yose Power** | VAE standard, stock EU | ~200–300 € | Livraison rapide Europe, bon rapport qualité/prix | [yosepower.com](https://www.yosepower.com) |\n| **Amazon.fr / AliExpress** | VAE générique | ~180–280 € | Achat immédiat, livraison 48h-7j | Recherche : `\"batterie 48V 13S 10Ah BMS\"` |\n\n> [!WARNING]\n> **Vérifier impérativement** avant achat :\n> - Le **BMS est bien 13S** (pas 12S = 44.4V incompatible)\n> - Le courant de décharge continu est **≥ 30A** (les batteries VAE bas de gamme sont parfois limitées à 15-20A)\n> - Le connecteur de sortie (XT60 de préférence, sinon Anderson PP30 ou PP45)\n> - Les avis récents (éviter les batteries avec cellules reconditionnées)\n\n---\n\n#### Phase 2 — Production : Batterie Sur-Mesure (Quand le Châssis est Figé)\n\nUne fois le torse CAO validé et l'espace batterie défini, passer commande chez un assembleur français :\n\n| Fournisseur | Spécialité | Avantage | Contact |\n| :--- | :--- | :--- | :--- |\n| **[Save My Battery](https://www.savemybattery.fr)** | Assemblage NMC sur mesure | 🇫🇷 FR, cellules Samsung 50E, forme custom | Via site web |\n| **[OZO Industries](https://www.ozo-electric.com)** | NMC/LFP custom, bureau d'études | 🇫🇷 FR (Éguilles), BMS CAN possible | batteries@ozo-electric.com |\n| **[Neogy](https://www.neogy.fr)** | Batteries haute performance | 🇫🇷 FR, expertise robotique et mobilité | Via site web |\n\n**Cahier des charges à fournir** :\n- Tension : 48V (13S NMC)\n- Capacité : 10-15 Ah (480-720 Wh)\n- Courant continu : 50A minimum, pic 100A\n- Dimensions max : à définir selon le torse CAO\n- Connecteur : XT90-S (anti-spark) ou Anderson SB50\n- BMS : avec sortie monitoring (idéalement CAN ou UART pour la Jetson)\n- Budget : 400-700 €\n\n---\n\n#### Pourquoi NMC et pas LiFePO4 ?\n\n| Critère | NMC 21700 | LiFePO4 |\n| :--- | :--- | :--- |\n| **Densité massique** | ~250 Wh/kg | ~160 Wh/kg |\n| **Poids pour 480 Wh** | **~2.0-2.5 kg** | ~3.0-4.0 kg |\n| **Tension/cellule** | 3.6V → 13S = 46.8V ✅ | 3.2V → 15S nécessaire ❌ |\n| **Cycles** | 800-1000 | 2000-6000 |\n| **Sécurité** | ⚠️ BMS indispensable | ✅ Plus stable chimiquement |\n| **Verdict** | **Retenu** (poids critique pour bipède) | Exclu (trop lourd, 15S incompatible) |\n\n---\n\n### Sécurité Incendie (NMC)\n\n- ✅ Utiliser uniquement des **packs fermés avec BMS dédié** (jamais de cellules nues)\n- ✅ **Espace d'air** autour de la batterie dans le torse\n- ✅ **Cloisonnement** en matériaux ignifugés (PC/ABS, tôle alu)\n- ✅ **Sortie de dégazage** vers l'arrière (ne pas enfermer hermétiquement)\n- ✅ **Charge** uniquement avec chargeur **54.6V (13S) CC/CV** dédié, en zone ventilée\n- ✅ **Monitoring** température/tension/courant via Spresense (harnais faible puissance du BMS)\n\n### Positionnement dans le Robot\n\n- **Phase Prototype** : Batterie VAE fixée par Velcro industriel + sangle dans le torse bas, accessible par trappe arrière\n- **Phase Production** : Pack sur-mesure intégré dans un slot CAO dédié avec patin anti-vibration TPU\n- **Dimensions à prévoir** : ~200 × 100 × 70 mm minimum (format VAE standard)\n\n> [!TIP]\n> **Évolution future** : Quand le design du torse sera figé, une 2ème batterie identique pourra être ajoutée en parallèle (symétrie gauche/droite) pour doubler l'autonomie (~40-50 min → ~80-100 min). Les 2 packs DOIVENT être identiques (même modèle, même âge). Utiliser un ORing MOSFET pour éviter les courants d'équilibrage.\n\n### Topologie de Puissance (48V) : ÉTOILE OBLIGATOIRE\n\n> [!CAUTION]\n> **DANGER FONTE XT30 / Daisy-Chain** : S'il est tentant de chaîner les câbles de puissance d'un RS-04 à l'autre le long de la jambe (comme pour le data), c'est une manipulation **interdite et dangereuse**. Le petit connecteur XT30 au dos du moteur supporte **30A continu max**. Un RS-04 tire jusqu'à **90A en pic**. Un chaînage de puissance fondra immédiatement le premier connecteur de la cuisse, et causera une chute de tension extrême (*Under-voltage error*) pour la cheville.\n\nLe 48V de chaque moteur doit impérativement rejoindre la barre de distribution centrale de la manière la plus directe possible (Topologie Étoile / Parallèle).\n\n### Distribution : Système Busbar + Pigtails (Sans Soudure)\n\n> [!WARNING]\n> **Le Matek PDB-HEX (drone) est INCOMPATIBLE** avec le bus 48V du D-Bot (tension max 18V). Ne pas utiliser de PDB drone standard.\n\n#### Architecture Retenue : Distribution Hiérarchique \"Arbre\" (Standard Industrie)\n\nL'architecture de distribution du D-Bot suit le modèle hiérarchique utilisé par les robots humanoïdes industriels (Unitree H1/G1, Tesla Optimus) : un **busbar central compact** dans le torse qui alimente **des lignes \"tronc\" fusionnées par zone**, chacune aboutissant à un **splitter local** dans chaque membre.\n\n> [!NOTE]\n> **Pourquoi pas un busbar géant à 27 bornes ?** Avec 24 moteurs + 3 convertisseurs, un busbar unique dans le torse serait un nœud de 27 paires de câbles — ingérable, lourd, et sans isolation de fautes. En découpant en zones avec des splitters locaux, on obtient :\n> - Seulement **7 câbles \"tronc\"** qui quittent le torse (au lieu de 27)\n> - **Protection fusible par zone** → un court-circuit dans une jambe ne coupe pas les bras\n> - **Déconnexion rapide** d'un membre entier via un seul connecteur XT60\n> - Câbles courts vers les moteurs (< 30 cm) → moins de chutes de tension\n\n#### Vue Globale — Topologie en Arbre\n\n```\n                    ┌─────────────────────────────────────────────┐\n                    │          TORSE (Busbar Central 8 bornes)     │\n                    │                                             │\n     Batterie ──── Fusible 80A ──── E-Stop ──── BUSBAR (+ / -)   │\n                    │                 │                            │\n                    │    ┌────────────┼────────────┐              │\n                    │    │            │            │              │\n                    └────┼────────────┼────────────┼──────────────┘\n                         │            │            │\n                    ┌────┴───┐   ┌────┴───┐   ┌───┴──────┐\n                    │ Tronc  │   │ Tronc  │   │  Tronc   │\n                    │ Bras G │   │ Bras D │   │ Logique  │\n                    │ 30A    │   │ 30A    │   │ 5V / 19V │\n                    └───┬────┘   └───┬────┘   └──────────┘\n                        │            │\n              ┌─────────┴──┐   ┌────┴─────────┐\n              │Splitter    │   │Splitter       │\n              │Bras G      │   │Bras D         │\n              │(WAGO/mini  │   │(WAGO/mini     │\n              │ busbar)    │   │ busbar)       │\n              └────────────┘   └───────────────┘\n\n     ┌────────────┐  ┌────────────┐\n     │ Tronc      │  │ Tronc      │\n     │ Jambe G    │  │ Jambe D    │\n     │ 50A        │  │ 50A        │\n     └─────┬──────┘  └─────┬──────┘\n           │               │\n     ┌─────┴──────┐  ┌─────┴──────┐\n     │Splitter    │  │Splitter    │      ┌────────────┐\n     │Jambe G     │  │Jambe D     │      │ Tronc      │\n     │(mini       │  │(mini       │      │ Cou / Tête │\n     │ busbar)    │  │ busbar)    │      │ 5A         │\n     └────────────┘  └────────────┘      └────────────┘\n```\n\n#### Découpage en 7 Zones\n\n| Zone | Moteurs / Charges | N° moteurs | Fusible | AWG tronc | Connecteur tronc |\n| :--- | :--- | :---: | :---: | :---: | :---: |\n| **Bras G** | RS-04 + RS-03 + RS-02 + RS-06 + RS-00 + Buck→12V | 5 + 1 | **30A** | **14 AWG** | XT60 |\n| **Bras D** | (idem) | 5 + 1 | **30A** | **14 AWG** | XT60 |\n| **Jambe G** | RS-04 × 2 + RS-03 × 3 + RS-02 | 6 | **50A** | **12 AWG** | XT60 |\n| **Jambe D** | (idem) | 6 | **50A** | **12 AWG** | XT60 |\n| **Cou / Tête** | RS-05 × 2 | 2 | **5A** | **18 AWG** | XT30 |\n| **Logique** | DC-DC 48V→5V (Spresense) + DC-DC 48V→19V (Jetson) | 0 | **5A** | **18 AWG** | fils vissés |\n| **E-Stop** | Bouton arrêt d'urgence NC | — | — | — | panneau |\n| **TOTAL bornes sur busbar central** | | | | | **7 paires (+/-)** |\n\n> **Résultat** : le busbar central n'a besoin que de **~8 bornes par rail** (7 zones + 1 entrée batterie) → un **busbar double 8-12 bornes** unique suffit pour le robot complet.\n\n#### Rôle des WAGO 221 (✅ Déjà Achetés)\n\n> [!TIP]\n> **Les WAGO 221-413 (3 entrées) et 221-415 (5 entrées) sont les splitters locaux** à l'intérieur de chaque membre. Ils ne remplacent pas le busbar central — ils font le travail de distribution finale après le tronc fusionné.\n\n```\nExemple — Splitter Bras G (situé dans l'épaule ou haut du bras) :\n\nCâble Tronc 14 AWG (XT60 depuis busbar)\n    │\n    └── WAGO 221-415 (5 entrées, 32A max)\n         ├── (+) → XT60 pigtail → RS-04 Épaule Pitch      14 AWG\n         ├── (+) → XT30 pigtail → RS-03 Épaule Roll        18 AWG\n         ├── (+) → XT30 pigtail → RS-02 Épaule Yaw         18 AWG\n         ├── (+) → XT30 pigtail → RS-06 Coude Pitch        18 AWG\n         └── (+) → XT30 pigtail → RS-00 Poignet Roll       18 AWG\n\n    └── WAGO 221-415 (5 entrées) → même chose pour le (-)\n\n    └── Buck 48V→12V 5A → WAGO 221-413 (3 entrées) → 8 Dynamixel main\n```\n\n**Pourquoi les WAGO et non un mini-busbar dans le membre ?**\n- Les WAGO 221 sont compacts (18×6×16mm), sans outil (levier), et supportent **32A / 450V** → bien au-delà de nos besoins\n- Ils acceptent du **0.2 à 4 mm²** (24 à 12 AWG) → parfait pour mixer 14 et 18 AWG\n- Ils sont transparents → vérification visuelle du contact\n- **Déjà achetés** ✅\n\n> [!WARNING]\n> Les WAGO 221 sont adaptés pour les **bras et le cou** (courant par zone ≤ 30A). Pour les **jambes** (50A par zone avec 2× RS-04 + 3× RS-03), utilisez un **mini-busbar 6 bornes** comme splitter local au lieu des WAGO (limités à 32A de capacité nominale).\n\n#### Schéma Détaillé de Distribution\n\n```text\nBatterie 13S NMC 48V (XT90-S / Anderson SB50)\n    │\n    ├── Fusible principal 80A (ANL/MIDI lame)\n    │\n    ├── E-Stop (Coup de poing NC — coupe moteurs, pas Jetson)\n    │\n    └── BUSBAR CENTRAL DOUBLE 8-12 bornes (torse)\n         │\n         │  ═══ ZONE BRAS GAUCHE ═══════════════════════════════\n         ├── Fusible 30A lame ──→ XT60 tronc (14 AWG, ~40cm)\n         │   └── Splitter Bras G (WAGO 221-415 × 2, dans épaule)\n         │        ├── XT30 → RS-04 Épaule Pitch G      (14 AWG, ~15cm)\n         │        ├── fils → RS-03 Épaule Roll G       (18 AWG, ~15cm)\n         │        ├── fils → RS-02 Épaule Yaw G        (18 AWG, ~20cm)\n         │        ├── fils → RS-06 Coude G             (18 AWG, ~40cm)\n         │        ├── fils → RS-00 Poignet G           (18 AWG, ~60cm)\n         │        └── Buck 48V→12V → 8× Dynamixel main G\n         │\n         │  ═══ ZONE BRAS DROIT ════════════════════════════════\n         ├── Fusible 30A lame ──→ XT60 tronc (14 AWG, ~40cm)\n         │   └── Splitter Bras D (idem)\n         │\n         │  ═══ ZONE JAMBE GAUCHE ══════════════════════════════\n         ├── Fusible 50A lame ──→ XT60 tronc (12 AWG, ~30cm)\n         │   └── Mini-busbar 6 bornes (bassin G)\n         │        ├── XT30 → RS-04 Hanche Pitch G      (14 AWG, ~15cm)\n         │        ├── fils → RS-03 Hanche Roll G       (18 AWG, ~15cm)\n         │        ├── fils → RS-03 Hanche Yaw G        (18 AWG, ~20cm)\n         │        ├── XT30 → RS-04 Genou G             (14 AWG, ~50cm)\n         │        ├── fils → RS-03 Cheville Pitch G    (18 AWG, ~80cm)\n         │        └── fils → RS-03 Cheville Roll G     (18 AWG, ~80cm)\n         │\n         │  ═══ ZONE JAMBE DROITE ══════════════════════════════\n         ├── Fusible 50A lame ──→ XT60 tronc (12 AWG, ~30cm)\n         │   └── Mini-busbar 6 bornes (bassin D, idem)\n         │\n         │  ═══ ZONE COU / TÊTE ═══════════════════════════════\n         ├── Fusible 5A ──→ fils tronc (18 AWG)\n         │   └── WAGO 221-413\n         │        ├── fils → RS-05 Cou Pan             (18 AWG, ~20cm)\n         │        └── fils → RS-05 Cou Tilt            (18 AWG, ~20cm)\n         │\n         │  ═══ ZONE LOGIQUE ══════════════════════════════════\n         └── DC-DC 48V→5V (Spresense always-on)\n             DC-DC 48V→19V (Jetson Orin Nano)\n```\n\n#### Avantages de cette Architecture\n\n| Critère | Busbar plat (ancienne) | Arbre hiérarchique (retenue) |\n| :--- | :---: | :---: |\n| Câbles au torse | 27 paires | **7 paires** |\n| Isolation de faute | Non (1 fusible 80A) | **Oui (fusible par zone)** |\n| Déconnecter un bras | 5 vis au busbar | **1 XT60** |\n| Longueur câble max | 1.2m (busbar→cheville) | **0.8m (splitter→cheville)** |\n| Nœud de câbles torse | ❌ Dense | **✅ Aéré** |\n| Extension/maintenance | Compliqué | **Modulaire** |\n| Standard industriel | Non | **Oui (Unitree, Tesla)** |\n\n#### Composants du Système Complet\n\n| Composant | Spécification | Qté | Prix | Source |\n| :--- | :--- | :---: | :---: | :--- |\n| **Busbar double (12 bornes M4)** | Laiton étamé, 150A, couvercle anti-étincelle | 1 | ✅ Acheté | Amazon / Marine Grade |\n| **Mini-busbars 6 bornes** | Laiton, 60V+, pour bassin jambes | 2 | ~8-12 €/pce | Amazon.fr : `\"bus bar 6 way 60V\"` |\n| **WAGO 221-415 (5 entrées)** | Levier, 32A, 450V, 0.2-4mm² | 4 (×2 par bras) | ✅ Déjà achetés | — |\n| **WAGO 221-413 (3 entrées)** | Levier, 32A, 450V | 6 | ✅ Déjà achetés | — |\n| **Fusibles lame + porte-fusibles** | 30A ×2 (bras) + 50A ×2 (jambes) + 5A ×1 (cou) + 80A ×1 (principal) | 6 | ~3-5 € le lot | Amazon.fr : `\"porte-fusible lame automobile en ligne\"` |\n| **Connecteurs XT60/XT30 nus** | Mâle/Femelle (pré-étamés) | 1 lot | ✅ Déjà achetés | Fabrication pigtails moteurs & troncs |\n| **Câble 18 AWG Silicone** | Rouleau 30m (Rouge + Noir) | 1 | ✅ Acheté | Liaison petits moteurs (RS-05, 00, 02, 06, 03) |\n| **Câble 14 AWG Silicone** | 5m (Rouge + Noir) | 1 | ✅ Acheté | Liaison gros moteurs (RS-04) |\n| **DC-DC 48V→5V** | Buck isolé, 5V 5A (25W) | 1 | ~10-15 € | Amazon.fr : `\"48V to 5V DC-DC converter 5A\"` |\n| **DC-DC 48V→19V** | Buck, 19V 5A (95W) | 1 | ~15-20 € | Amazon.fr : `\"48V to 19V DC-DC converter 5A\"` |\n| **Buck 48V→12V 5A** | Entrée ≥ 60V, sortie 12V 5A | 2 | ~10-18 €/pce | Amazon.fr : `\"DC DC converter 48V 12V 5A 60W\"` |\n| **Bouton E-Stop** | Coup de poing NC | 1 | ~8-12 € | Amazon.fr |\n| **Total estimé** | | | **~60-80 €** | |\n\n#### Où Trouver les Busbars\n\n> [!TIP]\n> **Le secteur nautique** (bateaux) fabrique exactement ces composants pour la distribution DC 12V/24V/48V avec des bornes robustes, couvercle de protection, et laiton étamé anti-corrosion. Ils supportent tous 60V+ malgré la mention \"12/24V\".\n\n| Source | Terme de recherche | Avantage |\n| :--- | :--- | :--- |\n| **Amazon.fr** | `\"dual bus bar 12 way\"` ou `\"bus bar 6 way marine\"` | Livraison rapide, ~10-25 € |\n| **SVB Marine** ([svb24.com](https://www.svb24.com)) | Blue Sea Systems, BEP Marine | Qualité premium, couvercle inclus |\n| **Seatronic.fr** ([seatronic.fr](https://www.seatronic.fr)) | \"Bornier de raccordement\" | Spécialiste FR, bon SAV |\n| **RS Components** ([fr.rs-online.com](https://fr.rs-online.com)) | \"Power distribution block\" | Qualité industrielle |\n\n**Checklist avant achat busbar** :\n- ✅ **Laiton étamé** (pas aluminium pur)\n- ✅ **Couvercle transparent** (anti court-circuit)\n- ✅ Bornes acceptant **12-14 AWG** (≥ 2.5 mm²)\n- ✅ Courant nominal **≥ 100A** par rail\n\n#### Câblage Mixte (Sur-mesure + Sans Soudure)\n\nL'avantage d'avoir vos propres connecteurs nus est de pouvoir fabriquer des câbles pile à la bonne longueur. Le câblage se fait en deux étapes :\n\n**1. Côté Connecteurs (XT60 / XT30) : Soudure (RS-04 et Troncs uniquement)**\n*   **Connexion Moteur ↔ WAGO** : Seul le gros moteur **RS-04** possède un connecteur (XT30 Mâle) d'origine. Vous devez lui fabriquer un \"pigtail\" : soudez un XT30 *Femelle* aux fils rouge/noir, et l'autre extrémité ira dans le WAGO. \n*   **Pour tous les autres moteurs (RS-03, RS-02, RS-06...)** : Leurs câbles sont nus et pré-étamés d'usine. **Ne soudez aucun connecteur !** Coupez juste le petit bout étamé avec une pince coupante pour retrouver le cuivre pur souple, puis insérez-le directement dans le WAGO ou la cosse ronde.\n*   **Troncs Détachables (Busbar ↔ Membre)** : Soudez un XT60 *Femelle* sur le câble qui part du torse. Soudez un XT60 *Mâle* sur celui qui part du bras/jambe. Pour retirer le membre, il suffit de déclipser cette prise.\n*   *Note équipement* : Le câble 14 AWG et les XT60 pompent beaucoup de chaleur. Utilisez un fer puissant (≥ 60W) et n'oubliez pas la gaine thermo-rétractable.\n\n**2. Côté Busbar et WAGO : Interdiction de souder !**\nUne fois les XT soudés, l'autre extrémité de vos fils (qui se banche sur les répartiteurs) ne doit **jamais** être soudée ou étamée (l'étain est mou et se desserre avec le temps sous la pression).\n\n```\nWAGO 221 (dans les bras et cou) ──────────────────────────────────\n  1. Dénuder 12mm du câble silicone (cuivre nu pur)\n  2. Ouvrir le levier orange\n  3. Insérer le cuivre nu et fermer. Le ressort garantit la tension à vie.\n\nBUSBAR CENTRAL / MINI-BUSBARS (vis M4) ───────────────────────────\n  1. Dénuder le fil\n  2. Insérer le cuivre nu dans une cosse ronde à sertir (Ring Terminal M4)\n  3. Sertir fermement avec une vraie pince à sertir\n  4. Visser la cosse sur le busbar.\n\n  [XT60 soudé] ════ fil 14 AWG sur-mesure ════ [Cosse ronde sertie] ──> Vissé au Busbar\n```\n\n---\n\n## 4b. Câbles de Puissance Moteurs — Guide d'Achat et Longueurs\n\n\n### Courants par Modèle de Moteur\n\n| Moteur | Courant continu | Courant crête | AWG adapté | Utilisation D-Bot |\n| :---: | :---: | :---: | :---: | :--- |\n| **RS-05** | ~0.8 A | ~3 A | 20–22 AWG | Cou (Pan + Tilt) |\n| **RS-00** | ~1.5 A | ~4 A | 20–22 AWG | Poignets Roll |\n| **RS-02** | ~2 A | ~5 A | 18–20 AWG | Épaule Yaw |\n| **RS-06** | ~4 A | ~10 A | 18–20 AWG | Coudes |\n| **RS-03** | ~6 A | ~15 A | 18 AWG | Épaule Roll, Hanches R/Y, Chevilles |\n| **RS-04** | ~10 A | ~22 A | **14–16 AWG** | Épaule Pitch, Hanche Pitch, Genoux |\n\n### Stratégie Rationalisée — 2 Calibres Seulement\n\n> [!TIP]\n> Plutôt que d'acheter un calibre différent par moteur, **deux calibres couvrent toute la gamme** sans compromis critique :\n> - **14 AWG** → RS-04 uniquement (les plus gourmands)\n> - **18 AWG silicone souple** → Tous les autres moteurs (RS-05, RS-00, RS-02, RS-06, RS-03)\n>\n> Le 18 AWG est certifié pour 16A continu. Le RS-03 pointe brièvement à 15A — largement toléré. Ce compromis évite de gérer 4-5 calibres différents.\n\n### Wanptek — Quelle borne utiliser ?\n\n> [!WARNING]\n> La Wanptek DPS605U (et les alimentations de labo similaires) dispose de **3 bornes de sortie** :\n> - **(+)** : +24V/48V du circuit → brancher vos XT30/XT60 (+) moteurs ✅\n> - **(-)** : 0V du circuit (masse de référence) → brancher vos XT30/XT60 (-) moteurs ET le GND du module de debug CAN ✅\n> - **(⏚ GND)** : Terre de sécurité secteur (PE, reliée à la prise murale) → **ne rien brancher dessus** ❌\n>\n> Brancher le module de debug sur la borne ⏚ au lieu de (-) = référence CAN flottante = erreurs \"Bus Off\" immédiates.\n\n### Longueurs Estimées par Zone — Câble 14 AWG (RS-04)\n\nDistance PDB (bassin/torse) → moteur, par conducteur :\n\n| Moteur | Qty | Longueur estimée | Total par couleur |\n| :--- | :---: | :---: | :---: |\n| Épaule Pitch (RS-04 ×2) | 2 | ~50 cm | 1.0 m |\n| Hanche Pitch (RS-04 ×2) | 2 | ~30 cm | 0.6 m |\n| Genou (RS-04 ×2) | 2 | ~60 cm | 1.2 m |\n| **Sous-total** | 6 | | **2.8 m** |\n| Marge 30% | | | **+0.8 m** |\n| **Total à avoir par couleur** | | | **~3.6 m** |\n\n> Une bobine de **5m par couleur** (rouge + noir) couvre tous les RS-04 avec marge confortable.\n\n### Longueurs Estimées par Zone — Câble 18 AWG (Tous les autres)\n\n| Zone | Moteurs | Qty | Longueur/moteur | Total par couleur |\n| :--- | :---: | :---: | :---: | :---: |\n| Cou | RS-05 | 2 | 40 cm | 0.8 m |\n| Poignets | RS-00 | 2 | 80 cm | 1.6 m |\n| Épaule Yaw | RS-02 | 2 | 55 cm | 1.1 m |\n| Coudes | RS-06 | 2 | 70 cm | 1.4 m |\n| Épaule Roll | RS-03 | 2 | 55 cm | 1.1 m |\n| Hanches Roll/Yaw | RS-03 | 4 | 25 cm | 1.0 m |\n| Chevilles | RS-03 | 4 | 65 cm | 2.6 m |\n| **Sous-total** | **18** | | | **9.6 m** |\n| Marge 30% | | | | **+2.9 m** |\n| **Total à avoir par couleur** | | | | **~12.5 m** |\n\n> Commander **15m par couleur** (rouge + noir) en 18 AWG silicone.\n\n### Recommandations d'Achat (disponible en France)\n\n| Câble | Format | Où acheter | Recherche | Prix estimé |\n| :--- | :--- | :--- | :--- | :---: |\n| 14 AWG silicone rouge | Bobine séparée 5m | Amazon.fr | `\"silicone wire 14AWG red 5m\"` | ~10-15 € |\n| 14 AWG silicone noir | Bobine séparée 5m | Amazon.fr | `\"silicone wire 14AWG black 5m\"` | ~10-15 € |\n| **18 AWG silicone rouge** | **Bobine séparée 15m** | Amazon.fr | `\"silicone wire 18AWG red 15m\"` | ~15-20 € |\n| **18 AWG silicone noir** | **Bobine séparée 15m** | Amazon.fr | `\"silicone wire 18AWG black 15m\"` | ~15-20 € |\n\n> [!IMPORTANT]\n> **Fils séparés, pas bipolaires.** Acheter des bobines **rouge et noir séparément** (pas un câble bipolaire avec les 2 conducteurs dans la même gaine). Dans un robot, le + et le - d'un même moteur passent souvent par des chemins légèrement différents dans les passages d'articulation. Des fils séparés offrent la flexibilité de routing nécessaire et sont plus faciles à passer dans les passages étroits.\n>\n> **Silicone obligatoire** (pas PVC) : la gaine silicone reste souple à froid, résiste à 200°C, et supporte les flexions répétées dans les articulations mobiles.\n\n### Récapitulatif Budget Câble Puissance\n\n| Achat | AWG | Quantité | Statut | Prix |\n| :--- | :---: | :---: | :---: | :---: |\n| 14 AWG rouge + noir | 14 | 5m × 2 couleurs | ✅ Déjà acheté | — |\n| **18 AWG rouge + noir silicone** | 18 | 15m × 2 couleurs | 🛒 À acheter | **~30-40 €** |\n| **Total investissement câble puissance** | | | | **~30-40 €** |\n\n---\n\n## 4c. Séquence de Validation — Wanptek → Batterie\n\nLa Wanptek DPS605U peut alimenter le busbar directement, exactement comme la batterie le ferait :\n\n```\nWanptek (+) ──── Borne (+) busbar   ← fil 14 AWG, 30-50 cm\nWanptek (-) ──── Borne (-) busbar\n                     │\n                     ├── Pigtail XT30 → Moteur 1\n                     ├── Pigtail XT30 → Moteur 2\n                     └── Buck 48V→12V → Dynamixel (main)\n```\n\nLa limite est le **courant maximum de la Wanptek : 5A**. Voici les zones de validité :\n\n### Composition du Bras — Rappel (Pourquoi pas de \"test bras complet\" avec Wanptek)\n\n| Articulation | Moteur/Servo | Protocole | Tension | Courant typique | Wanptek |\n| :--- | :---: | :---: | :---: | :---: | :---: |\n| Épaule Pitch | **RS-04** | CAN | 48V | 10–22 A | ❌ |\n| Épaule Roll | **RS-03** | CAN | 48V | 6–15 A | ❌ |\n| Épaule Yaw | RS-02 | CAN | 48V | ~2–5 A | ✅ |\n| Coude | RS-06 | CAN | 48V | ~4–10 A | ⚠️ |\n| Poignet Roll | RS-00 | CAN | 48V | ~1.5–4 A | ✅ |\n| Main ×4 XC430 | Dynamixel | TTL | **12V** | ~0.5 A/servo | ✅ via buck |\n| Main ×4 XC330 | Dynamixel | TTL | **12V** | ~0.3 A/servo | ✅ via buck |\n\n> [!IMPORTANT]\n> Il n'existe **pas de test bras complet sans batterie** : l'épaule Pitch (RS-04) est l'articulation proximale. Par contre, le segment \"coude → poignet → main\" est entièrement testable avec la Wanptek + un buck 48V→12V.\n\n### Intégration de la Main — Architecture Buck 48V→12V\n\nLa D-Hand utilise des servos **Dynamixel TTL à 12V**, totalement différents des RobStride (CAN, 48V). Un buck connecté sur le busbar 48V permet d'alimenter tout depuis la même source :\n\n```\nWanptek 48V (ou batterie)\n     │\n     └──→ Busbar 48V / GND\n               │\n               ├──→ RS-06 (coude)      48V CAN\n               ├──→ RS-02 (épaule yaw) 48V CAN\n               ├──→ RS-00 (poignet)    48V CAN\n               │\n               └──→ Buck 48V→12V 5A\n                    GND commun busbar ✅\n                          │\n                          └──→ U2D2 → XC430 ×4 + XC330 ×4\n                                        12V TTL\n```\n\n**La masse GND est automatiquement commune** — tout part du même busbar. C'est aussi l'architecture définitive de production.\n\n#### Budget Courant — Avant-Bras + Main avec Wanptek\n\n| Composant | Courant @ 48V | Calcul |\n| :--- | :---: | :--- |\n| RS-06 coude | ~2 A | mouvement léger |\n| RS-02 yaw | ~1 A | mouvement léger |\n| RS-00 poignet | ~0.8 A | mouvement léger |\n| Buck (→ 8 servos Dynamixel) | ~0.8 A | 12V×3A ÷ 48V ÷ 0.9 eff. |\n| **Total** | **~4.6 A** | **≤ 5A Wanptek ✅** |\n\n> Faisable pour des mouvements doux et séquentiels. Un pic RS-06 en accélération rapide déclenche l'OCP Wanptek — protection automatique, pas un problème.\n\n#### Buck à Commander (Utile Maintenant + Indispensable en Production)\n\n> [!WARNING]\n> La batterie chargée est à **54.6V max**. Il faut un buck supportant **≥ 60V en entrée** — les modules limités à 40V ne conviennent pas.\n\n| Spec | Valeur |\n| :--- | :--- |\n| Tension entrée max | **≥ 60V** |\n| Tension sortie | 12V (réglable) |\n| Courant sortie | **5A minimum** (60W) |\n| Recherche Amazon.fr | `\"DC DC converter 48V 12V 5A 60W\"` ou `\"step down 60V 12V 5A\"` |\n| Prix | ~10–18 € |\n| Quantité | **2** (1 par bras, identiques en production) |\n\n---\n\n### Roadmap Complète — Tous les Tests Possibles par Segment\n\n```\n╔══════════════════════════════════════════════════════════════════════╗\n║  ZONE WANPTEK SUFFISANTE (5A @ 48V)                                 ║\n╠══════════════════════════════════════════════════════════════════════╣\n║                                                                      ║\n║  1. CONFIGURATION INDIVIDUELLE — TOUS LES MOTEURS       < 1A ✅     ║\n║     • ID unique (1..24), zéro mécanique, limites soft               ║\n║     • RS-04 IDLE < 1A  (dès qu'il bouge → OCP)                     ║\n║     • Outil : MotorStudio + module de debug                         ║\n║     • Wanptek : 24V ou 48V, limite 1A par moteur                    ║\n║                                                                      ║\n║  2. SCAN CAN MULTI-MOTEURS                              ~0A ✅       ║\n║     • Vérification adressage, baudrate, version firmware            ║\n║     • Aucun mouvement = aucune limite courant                       ║\n║                                                                      ║\n║  3. TEST COU (2× RS-05)                                ~1–3A ✅     ║\n║     • Pan + Tilt, mouvements amplitude complète                     ║\n║     • Wanptek : 24V, limite 3A                                      ║\n║                                                                      ║\n║  4a. TEST AVANT-BRAS ROBSTRIDE ISOLÉ                   ~3–4A ✅     ║\n║     • RS-06 (coude) + RS-02 (yaw) + RS-00 (poignet)                ║\n║     • Pas d'épaule = pas de RS-04 ✅                                ║\n║     • Mouvements séquentiels doux                                   ║\n║                                                                      ║\n║  4b. TEST MAIN DYNAMIXEL SEULE                         ~3A@12V ✅   ║\n║     • Wanptek réglée à 12V (déconnecter RobStride)                  ║\n║     • 8 servos via U2D2, Python SDK ou Dynamixel Wizard             ║\n║     • Grip, amplitude doigts, mesure courant par servo              ║\n║                                                                      ║\n║  4c. TEST AVANT-BRAS + MAIN INTÉGRÉ                    ~4.6A ✅     ║\n║     • Nécessite Buck 48V→12V sur busbar ← ACHETER AVANT             ║\n║     • RS-06 + RS-02 + RS-00 (48V) + Dynamixel via buck (12V)       ║\n║     • Gestes de préhension complets, mouvements doux               ║\n║                                                                      ║\n╠══════════════════════════════════════════════════════════════════════╣\n║  ⚡ BATTERIE INDISPENSABLE (VAE 48V 13S) — Acheter avant étape 5    ║\n╠══════════════════════════════════════════════════════════════════════╣\n║                                                                      ║\n║  5. PREMIER MOUVEMENT RS-04 / RS-03                    > 10A        ║\n║     • Épaule pitch, hanche, genou, cheville                         ║\n║     • Même un RS-04 à vide en accélération > 5A                    ║\n║                                                                      ║\n║  6. TEST BRAS COMPLET (épaule + avant-bras + main)                  ║\n║     • 5 RobStride + 8 Dynamixel coordonnés                          ║\n║     • Pick & place, gestes de manipulation                          ║\n║                                                                      ║\n║  7. TEST JAMBE                                                       ║\n║     • RS-04 hanche pitch + genou                                    ║\n║     • RS-03 hanche Roll/Yaw + cheville (×2 par cheville)            ║\n║                                                                      ║\n║  8. TEST DEBOUT — ÉQUILIBRE BIPÈDE STATIQUE                          ║\n║     • Tous moteurs actifs                                            ║\n║     • IMU BMI270 + FSR pieds en boucle de contrôle                 ║\n║                                                                      ║\n║  9. MARCHE DYNAMIQUE                                                 ║\n║     • 2ème batterie recommandée (autonomie doublée)                 ║\n║     • ORing MOSFET pour mise en parallèle des 2 packs              ║\n╚══════════════════════════════════════════════════════════════════════╝\n```\n\n> [!TIP]\n> **Avantage de la Wanptek en phases 1–4** : la limite OCP est une **protection active**. Une batterie peut débiter 100A dans un court-circuit et fondre les connecteurs — la Wanptek coupe proprement. Ne passez à la batterie qu'à l'étape 5.\n>\n> **Batterie à acheter avant l'étape 5.** Voir [§4 — Batterie Progressive](#choix-de-batteries--stratégie-progressive-avril-2026).\n\n---\n\n## 5. Capteurs de Force (FSR) - Phase 4\n\nPour la marche dynamique, chaque pied est équipé de 4 capteurs FSR (Force Sensing Resistor) pour mesurer le Centre de Pression (CoP).\n\n### Schéma de Câblage (Pont Diviseur)\nLes FSR sont des résistances variables (Infini à vide -> ~1kΩ appuyé). La Spresense lit une **tension** (ADC). Il faut donc un circuit diviseur.\n\n```\n      3.3V (Spresense VREF)\n        │\n        │\n       [ ]  FSR (Capteur de force)\n        │\n        ├─── vers Pin Analogique (A0, A1, A2, A3)\n        │\n       [ ]  Résistance Pull-down (R = 10kΩ)\n        │\n       GND\n```\n\n### Connexion Spresense\n*   **Haut de l'Extension Board** : Pins `A0` à `A3` (4 canaux).\n*   **Multiplexage** : Si vous avez 8 FSR (4 par pied) et seulement 4 entrées analogiques libres :\n    *   Option A : Mettre les FSR Avant en parallèle (moyenne) et Arrière en parallèle. = 2 fils par pied.\n    *   Option B : Utiliser un multiplexeur I2C (ex: ADS1115) pour lire 4 canaux supplémentaires.\n    *   *Reco Prototype* : Option A (Suffisant pour savoir si le poids est sur les pointes ou les talons).\n", "Conception: 05_Logiciel_Configuration": "# Logiciel & Configuration\n\n## 0. Installation de base (JetPack & Accès Distant)\nPour rappel, la configuration initiale complète du cerveau du D-Bot (Jetson Orin Nano Super) est documentée en annexe :\n- **[40 — Installation JetPack (BalenaEtcher)](./annexes/jetson/installation/40_Installation_JetPack_6.md)** : Flashage de l'image `JP6.2.1` et premier démarrage.\n- **[41 — Accès Distant Headless (NoMachine & SSH)](./annexes/jetson/installation/41_Acces_Distant_NoMachine.md)** : Prise de contrôle du bureau Ubuntu à distance depuis votre Mac.\n- **[42 — Configuration Bus CAN InnoMaker + RS-05](./annexes/jetson/liaison_can/42_Configuration_CAN_InnoMaker_RS05.md)** : Câblage, activation SocketCAN et règles udev pour le Bus 1 (Cou).\n\n---\n\n## 1. NVIDIA Jetson (SocketCAN)\nLa configuration du bus CAN est essentielle pour piloter les moteurs Robstride.\n\n### Prérequis Linux\n```bash\nsudo apt-get update\nsudo apt-get install can-utils\n```\n\n### Couche Jetson (Middleware)\nLe D-Bot tourne sous **Ubuntu 22.04 (JetPack 6)** avec **ROS 2 Humble**.\n- **Micro-ROS Agent** : Gère la passerelle avec la Sony Spresense via `/dev/ttyTHS0` (Pins 8/10).\n- **NVIDIA Isaac ROS** : Accélération matérielle pour la vision (OAK-D).\n\n### Couche Spresense (Temps Réel)\nLa Spresense exécute un firmware Arduino/NuttX avec **Micro-ROS Client**.\n- **Topics publiés** :\n    - `/audio/direction` : Angle DoA calculé par beamforming.\n    - `/imu/balance` : Données IMU torse (BMI270 Add-on) pour le contrôle d'équilibre.\n    - `/power/status` : Tension batterie 13S (48V) et température interne.\n- **Fonction Watchdog** : Le firmware surveille le heartbeat de la Jetson et coupe le MOSFET de puissance en cas de freeze.\n- **Liaison Audio** : Flux 8 canaux via **UAC 2.0** (USB) pour une qualité Hi-Res (192 kHz).\n\n### Maintenance et Sauvegarde Système\nPour éviter de perdre des heures de configuration ROS2 en cas de corruption de carte SD :\n- **Clonage de sécurité** : Créez régulièrement un clone de la carte SD sur un SSD externe (ex: Hynix P310) avant chaque mise à jour majeure via la commande :\n  ```bash\n  # Remplacez /dev/sdX par l'identifiant de votre carte SD\n  sudo dd if=/dev/sdX of=backup_dbot_date.img status=progress\n  ```\n\n### Activation de l'Interface CAN\nL'adaptateur InnoMaker est reconnu comme `can0` (parfois `can1`).\nLe débit standard Robstride est **1 Mbps** (1,000,000 bps).\n\n**Commande d'activation :**\n```bash\nsudo ip link set can0 up type can bitrate 1000000\n```\n\n**Commande de diagnostic (candump) :**\n```bash\ncandump can0\n```\n*Si vous voyez des lignes défiler (ex: `can0 141 [8] ...`), la communication est établie.*\n\n### Dépannage\n*   **Erreur \"Bus-off\"** : Souvent un problème physique (Fils non torsadés, Terminaison 120 Ohm manquante, GND non relié).\n*   **Interface introuvable** : Vérifiez `lsusb` (ID 1d50:606f) et chargez le module si besoin : `sudo modprobe gs_usb`.\n\n---\n\n## 2. Architecture ROS2\nL'objectif est d'avoir un système réactif où la vision influence directement les moteurs.\n\n### Noeuds ROS2 Suggérés\n1.  **kbot_vision** : Wrapper pour l'OAK-D Pro. Publie les objets détectés (`/detections`) et l'odométrie visuelle (`/odom`).\n2.  **kbot_motor_control** : Lit `/cmd_vel` ou `/joint_states` et envoie les trames CAN brutes aux moteurs.\n3.  **kbot_audio** : Interface avec la Spresense. Reçoit la direction du son (x,y,z) et publie une cible pour la tête (`/head_target`).\n4.  **kbot_balance** : Contrôleur d'équilibre. Lit `/imu/balance` (BMI270 torse) + `/joint_states` (encodeurs moteurs) et publie les corrections de couple sur les hanches/chevilles.\n5.  **kbot_joint_states** : Publie les positions/vitesses/couples des 24 moteurs via les encodeurs 14-bit RobStride intégrés (`/joint_states`).\n\n### Idées Algorithmiques\n*   **Beamforming (Audio)** : Utiliser les micros de la Spresense pour orienter la tête vers celui qui parle.\n*   **Équilibre (IMU Torse)** : Lire l'IMU BMI270 du torse (via Spresense) pour le contrôle d'équilibre bipède. **Ne PAS utiliser l'IMU de l'OAK-D** (tête) pour l'équilibre — elle bouge indépendamment du corps.\n*   **Propriöception (Encodeurs)** : Les encodeurs 14-bit doubles de chaque moteur RobStride fournissent la position et la vitesse articulaire en temps réel. L'estimation de couple via le courant moteur peut remplacer des capteurs de force/couple externes.\n\n---\n\n## 3. Outils de Développement\n*   **Fusion 360** : CAO Mécano-Soudée.\n*   **Docker** : Recommandé sur la Jetson pour isoler l'environnement ROS2 Humble/Jazzy.\n\n---\n*Dernière mise à jour : Mars 2026*\n", "Conception: 06_Decisions_Architecturales": "# Décisions Architecturales\n\nCe document recense les choix techniques structurants effectués durant la phase de conception (Discussions Février 2026).\n\n## 1. Choix du Kit Moteur\n**Décision** : Ajouter 2 moteurs **Robstride 05 (RS05)** au kit standard.\n*   **Pourquoi ?** Le kit de base manquait de couple au niveau du cou et des poignets pour un humanoïde de cette taille.\n*   **Conséquence** : Nécessite des vis spécifiques (M4 Acier 12.9) et un ancrage châssis renforcé (PETG-CF 100% Infill).\n\n## 2. Carte d'Extension Sony Spresense\n**Choix** : **Extension Board Standard** (vs LTE Extension Board).\n*   **Motif Principal** : Capacités Audio et Évolutivité.\n    *   La carte Standard permet de connecter jusqu'à **8 microphones numériques** (essentiel pour le *beamforming* et l'interaction vocale avancée).\n    *   Elle possède des connecteurs Arduino compatibles, permettant d'ajouter un shield LTE tiers plus tard si nécessaire.\n    *   La carte LTE officielle sacrifie trop d'I/O audios (max 4 micros) pour un usage \"autonome outdoor\" qui n'est pas la priorité immédiate.\n\n## 3. Positionnement LiDAR (Unitree L2) - Option V2\n**Choix** : **Haut du Torse, devant le cou, incliné 10-20° vers l'avant**.\n*   **Alternatives rejetées** :\n    - *Sommet de la tête* : FOV idéal mais nécessite un câble passant dans le cou articulé (Pan/Tilt RS-05) — risque d'usure et de torsion du câble, poids en hauteur (+CdG).\n    - *Tibia* : Trop bas, ne voit pas les tables ni les obstacles en hauteur.\n    - *Bassin* : Occulté par les jambes lors de la marche.\n*   **Avantage du torse haut** :\n    - Champ de vision 360° dégagé (les bras n'occultent que temporairement lors de manipulation).\n    - Pas de contrainte mécanique de câble articulé.\n    - Position stable (pas de vibrations du cou Pan/Tilt) = meilleur SLAM.\n    - L'inclinaison de 10-20° compense le décalage par rapport au sol.\n*   **Compensation** : L'OAK-D Pro (vision stéréo) dans la tête complète le champ de vision frontal quand les bras sont levés.\n\n## 4. Matériaux et Fixations\n*   **Visserie** : Standardisation sur **DIN 912** (Cylindrique) Inox A2.\n*   **Inserts** : Laiton (type Ruthex) préférés à l'Inox.\n    *   *Raison* : L'Inox conduit mal la chaleur, rendant la pose dans le plastique très risquée (fonte excessive autour de l'insert). La longueur de l'insert prime sur sa matière.\n", "Conception: 14_Cinematique_Moteurs": "# 14 - Cinématique & Choix Moteurs\n\nCe document détaille l'architecture cinématique du D-Bot (**Standard 24 DOF**) et les spécifications techniques des actionneurs **RobStride**.\n\n## 1. Configuration K-Bot Standard (20 DOF
