ion prévisible |\n| **TF ROS2** | Dynamique (lidar→head→neck→torso) | ✅ **Statique** (lidar→torso = constante) |\n| **FOV L2 suffisant sans bouger ?** | Le L2 couvre déjà 96° vertical | ✅ **96° = sol au plafond sans incliner** |\n| **Inertie cervicale** | 330g (L2+OAK-D) sur la tête | ✅ **~91g** (OAK-D seul) |\n| **OAK-D libre de pointer ?** | ❌ Mouvements tête perturbent le L2 | ✅ **Tête 100% dédiée à l'OAK-D** |\n| **Benchmark G1** | — | ✅ Le G1 fait exactement cela |\n\n**Séparation des rôles** :\n\n| Rôle | Capteur | Position | Ce qu'il apporte |\n| :--- | :--- | :---: | :--- |\n| **SLAM global (360°)** | L2 (360°×96°) | **Torse** (fixe) | Cartographie, localisation — mouvement stable et prévisible |\n| **Perception locale (orientable)** | OAK-D Pro (~80°) | **Tête** (2 DOF) | Obstacles proches, reconnaissance, densité adaptative |\n| **Odométrie inertielle** | BMI270 (400 Hz) | **Torse** (co-localisé L2) | Compensation locomotion, stabilité SLAM |\n\n**Résultat** : la zone **devant le robot** (là où il marche) bénéficie de la **densité OAK-D Pro** (~300k pixels depth), orientable par le cou. Le **reste** (côtés, arrière, sol, plafond) est couvert par le L2 avec 64k pts/s en position stable — optimal pour le SLAM.\n\n> [!TIP]\n> **Compensation de densité** : L'OAK-D Pro produit ~**300 000 points de profondeur** par frame (640×480 depth map @ 30 FPS) dans son cône de 80°. Le L2 ne produit que 64 000 pts/s sur 360°×96°. En fusionnant les deux, la **densité effective dans la zone de marche** est **5× supérieure** au L2 seul — et même supérieure au Livox MID-360 dans cette zone !\n>\n> De plus, l'OAK-D étant sur la tête orientable, le robot peut **diriger le cône dense là où c'est nécessaire** : vers le sol en course, vers un objet d'intérêt à l'arrêt, vers une porte à franchir.\n\n### 5.3 Comparaison Densité Effective (Zone Avant 80°)\n\n| Source | Points dans le cône avant 80° | Fréquence |\n| :--- | :---: | :---: |\n| L2 seul | ~14k pts/s (80°/360° × 64k) | 5.55 Hz |\n| OAK-D Pro depth | ~300k pts/frame | 30 Hz |\n| **L2 + OAK-D Pro fusionnés** | **~314k pts/frame** | **30 Hz** |\n| Livox MID-360 (80°/360°) | ~44k pts/s | 10 Hz |\n\n→ Notre solution budget bat le MID-360 en densité locale !\n\n### 5.4 Intégration Logicielle (ROS2)\n\n**Algorithme SLAM recommandé** : **RTAB-Map** (ROS2)\n\nRTAB-Map accepte nativement :\n- Un nuage de points 3D (topic `/lidar/cloud`) → L2\n- Une paire stéréo / depth map (topic `/oakd/depth`, `/oakd/rgb`) → OAK-D Pro\n- Un flux IMU (topic `/imu/data`) → BMI270\n\n```yaml\n# Exemple de launch RTAB-Map avec fusion L2 + OAK-D Pro + IMU\nrtabmap_ros:\n  parameters:\n    subscribe_depth: true        # OAK-D Pro depth\n    subscribe_scan_cloud: true   # L2 point cloud\n    wait_imu_to_init: true       # BMI270\n\n  remappings:\n    rgb/image: /oakd/rgb/image_raw\n    rgb/camera_info: /oakd/rgb/camera_info\n    depth/image: /oakd/stereo/depth\n    scan_cloud: /lidar/cloud\n    imu: /imu/data\n```\n\n### 5.5 Mitigation des Faiblesses du L2\n\n| Problème | Solution | Coût |\n| :--- | :--- | :---: |\n| **IMU défectueuse** | Ignorer l'IMU L2, utiliser BMI270 Spresense (400 Hz, timing stable) | $0 (déjà prévu) |\n| **Bruit nuage de points** | Filtre **Statistical Outlier Removal** (SOR) dans le pipeline PCL ROS2 | $0 (logiciel) |\n| **Vibrations miroir rotatif** | Montage sur **silent blocks caoutchouc** (amortissement 50-70 Hz) | ~$5 |\n| **Faible densité (64k pts/s)** | **Fusion avec depth map OAK-D Pro** (+300k pts/frame dans le cône avant) | $0 (déjà prévu) |\n| **Fréquence scan 5.55 Hz** | Suffisant à 2-3 km/h. L'OAK-D Pro couvre à 30 Hz pour les obstacles proches | — |\n\n---\n\n## 6. Matrice Décisionnelle Finale\n\n| # | Solution | Coût supp. | SLAM | FOV vertical | Densité zone avant | Vibrations | Verdict |\n| :---: | :--- | :---: | :---: | :---: | :---: | :---: | :--- |\n| **🏆 A** | **L2 + OAK-D Pro + BMI270** | **$419** | ✅✅ | **96°** ⚡ | **314k pts** ⚡ | ⚠️ (amortisseur) | **Retenu — Meilleur rapport perf/prix** |\n| B | MID-360 + OAK-D Pro | $700-900 | ✅✅ | 59° ⚠️ | ~344k pts | ✅ (solid-state) | Bon mais FOV vertical insuffisant |\n| C | OAK-D Pro seul | $0 | ⚠️ | 80° cone | 300k pts | ✅ | Insuffisant (pas de 360°) |\n| D | 2× LiDAR 2D + OAK-D Pro | $100-200 | ❌ | Plan unique | 300k pts + 2D | ⚠️ | ❌ Inadapté bipède |\n| E | Vision pure multi-cam | $50-200 | ⚠️ | Variable | Élevée | ✅ | ❌ Hors capacité IA |\n\n---\n\n## 7. Évolutions Possibles\n\n| Phase | Évolution | Raison |\n| :--- | :--- | :--- |\n| **Phase 4 V1** | L2 + OAK-D Pro + BMI270 (config retenue) | Couverture 360° + densité avant + IMU fiable |\n| **Phase 4 V2** | + 1 caméra USB arrière (~$50) | Couverture depth 360° (avant + arrière) |\n| **Phase 5+** | Réévaluer Livox MID-360 v2 ou équivalent solid-state | Si le bruit L2 est problématique en pratique |\n| **2027+** | Puce IA embarquée + visual SLAM end-to-end | Quand les frameworks vision seront matures pour bipèdes |\n\n---\n\n## 8. Montage Physique\n\n```\n            ┌────────────────────────┐\n            │      TÊTE D-BOT        │    ← Orientable (2× RS-05)\n            │                        │       Légère : OAK-D seul (~91g)\n            │   ┌──────────┐         │\n            │   │ OAK-D Pro│ ←→ 🔵   │    ← En façade, centré\n            │   │ (front)  │         │       Fixation M4 sur support alu\n            │   └──────────┘         │\n            └────────┬───────────────┘\n                     │ Cou (2× RS-05)\n            ┌────────┴───────────────┐\n            │    TORSE HAUT          │    ← Position fixe, stable\n            │                        │\n            │   ┌──────────┐         │    ← L2 monté devant le cou,\n            │   │ L2 (fix) │         │       sur 4 silent blocks Ø6mm\n            │   └──────────┘         │       vis M3 + rondelles caoutchouc\n            │                        │       TF statique lidar→torso\n            │   ┌──────────┐         │\n            │   │Spresense │         │    ← BMI270 co-localisé avec L2\n            │   │ BMI270   │         │       Même repère = meilleure fusion\n            │   └──────────┘         │\n            └────────────────────────┘\n```\n\n**Avantage clé du montage** : Le L2 et le BMI270 sont **co-localisés sur le torse** → leur repère est quasi-identique, ce qui simplifie la fusion IMU+LiDAR dans l'algorithme SLAM (pas de bras de levier entre les deux capteurs).\n\n**Câblage** :\n- L2 → USB3 (câble fourni, passé dans le cou) → Jetson Orin USB-A #1\n- OAK-D Pro → USB3 (câble DepthAI, flexible dans le cou) → Jetson Orin USB-A #2\n- BMI270 → Serial (via Spresense) → Jetson Orin USB-C (ou micro-ROS)\n\n> [!NOTE]\n> Les câbles USB de l'OAK-D Pro passent par le cou articulé. Prévoir un **câble USB3 spiralé ou extra-souple** (type câble robot industriel) pour supporter les rotations du cou sans fatigue mécanique. Longueur recommandée : 30-40 cm avec mou.\n\n---\n\n## 9. Stabilisation Active du Regard (Gaze Control)\n\n### 9.1 Le Problème en Marche Rapide / Course\n\nÀ mesure que la vitesse augmente, le **torse oscille** en pitch (±5-15°) et roll (±3-8°) à chaque foulée. Ces oscillations :\n- **Flouttent l'image** de l'OAK-D Pro (motion blur → depth map dégradée).\n- **Déplacent le cône OAK-D** verticalement → le robot \"perd de vue\" le sol ou la direction.\n- **Secouent le L2** (sur le torse) → bruit modéré, mais mouvement prévisible (compensable par IMU).\n\n### 9.2 La Solution : le Réflexe Vestibulo-Oculaire (VOR) du D-Bot\n\n> [!IMPORTANT]\n> **La tête du D-Bot dispose de 2 DOF** (2× RS-05 : Pitch + Yaw) qui permettent une **stabilisation active du regard de l'OAK-D Pro**, exactement comme le réflexe vestibulo-oculaire humain compense les mouvements de la tête pendant la marche. Le L2, fixé sur le torse, n'a **pas besoin** de VOR — ses oscillations sont prévisibles et compensées par le BMI270 co-localisé.\n\n**Principe** : Le BMI270 (IMU torse) mesure les oscillations du corps en temps réel. Le contrôleur de la tête applique une **compensation inverse** sur les moteurs du cou pour maintenir l'OAK-D Pro orienté de manière stable, indépendamment des mouvements du torse.\n\n```\n            Oscillation du torse (marche/course)\n                    ┌──────────────┐\n                    │   TORSE      │    ← Pitch ±10°, Roll ±5°\n                    │ ┌──────┐     │\n                    │ │  L2  │ fixe│    ← L2 subit les oscillations torse\n                    │ └──────┘     │       MAIS mouvement prévisible\n                    │ ┌──────┐     │       → compensé par BMI270 dans SLAM\n                    │ │BMI270│     │\n                    │ └──────┘     │\n                    └────┬─────────┘\n                         │ Cou 2× RS-05\n           ╔═════════════╧══════════════╗\n           ║   COMPENSATION INVERSE     ║\n           ║                            ║\n           ║  θ_tête = -θ_torse × k     ║    ← k ∈ [0.8, 1.0] (gain VOR)\n           ║  + bias selon vitesse       ║       Uniquement pour l'OAK-D\n           ║                            ║\n           ╚═════════════╤══════════════╝\n                    ┌────┴─────┐\n                    │   TÊTE   │    ← Stable dans le repère monde\n                    │ OAK-D Pro│       Image nette, depth map précise\n                    └──────────┘\n```\n\n> [!TIP]\n> **Avantage clé de l'architecture L2-torse / OAK-D-tête** : Le VOR ne doit stabiliser que **~91g** (OAK-D Pro seul) au lieu de 330g (L2+OAK-D). Les RS-05 ont une marge de vitesse immense et l'inertie cervicale réduite améliore toute la dynamique de marche.\n\n### 9.3 Modes de Regard par Phase de Locomotion\n\n| Phase | Vitesse | Pitch tête (OAK-D) | Yaw tête | OAK-D cible | L2 (torse, fixe) |\n| :--- | :---: | :--- | :--- | :--- | :--- |\n| **Debout / Station** | 0 km/h | Libre (exploration) | Libre | Scène en face / objet d'intérêt | SLAM 360° continu |\n| **Marche lente** | 1-2 km/h | VOR actif (-pitch torse) | Direction marche | Sol 1-5m devant | SLAM optimal |\n| **Marche rapide** | 3-4 km/h | VOR actif + bias -15° | Direction marche | **Sol + obstacles proches** | SLAM bon (filtré SOR) |\n| **Course** | 5-8 km/h | VOR actif + bias -20° | Direction course | **Sol immédiat 0-3m** | SLAM dégradé mais compensé BMI270 |\n\n**En mode course**, la tête s'incline davantage vers le bas (bias -15° à -20°) pour **maximiser la couverture du sol** de l'OAK-D à proximité immédiate. C'est critique : à 6 km/h (1.67 m/s), le robot parcourt ~1.7 m entre chaque scan L2 (5.55 Hz). L'OAK-D Pro à 30 FPS comble ce gap en scannant le sol toutes les 33 ms = ~5.5 cm d'avancée.\n\n> [!NOTE]\n> **Indépendance tête/torse** : En mode exploration (debout, station), la tête peut librement regarder autour sans perturber le SLAM LiDAR. C'est **impossible** avec le L2 sur la tête — chaque mouvement de curiosité aurait perturbé le scan.\n\n### 9.4 Implémentation ROS2 (Gaze Stabilization Node)\n\n```python\n#!/usr/bin/env python3\n\"\"\"\nD-Bot Gaze Stabilization — Vestibulo-Ocular Reflex (VOR)\nCompense les oscillations du torse en temps réel via les 2 DOF tête.\n\"\"\"\nimport rclpy\nfrom rclpy.node import Node\nfrom sensor_msgs.msg import Imu\nfrom std_msgs.msg import Float32\n\nclass GazeStabilizer(Node):\n    def __init__(self):\n        super().__init__('gaze_stabilizer')\n        \n        # IMU torse (BMI270 via Spresense)\n        self.sub_imu = self.create_subscription(\n            Imu, '/imu/data', self.imu_callback, 10)\n        \n        # Commandes moteurs tête\n        self.pub_pitch = self.create_publisher(Float32, '/head/pitch_cmd', 10)\n        self.pub_yaw = self.create_publisher(Float32, '/head/yaw_cmd', 10)\n        \n        # Paramètres VOR\n        self.vor_gain_pitch = 0.9   # Compensation à 90%\n        self.vor_gain_yaw = 0.85\n        self.speed_mode = 'walk'    # walk, fast_walk, run\n        \n        # Bias selon vitesse (inclinaison sol)\n        self.pitch_bias = {\n            'stand': 0.0,       # Exploration libre\n            'walk': -5.0,       # Léger regard vers le sol\n            'fast_walk': -15.0, # Sol + obstacles proches\n            'run': -20.0,       # Sol immédiat prioritaire\n        }\n    \n    def imu_callback(self, msg):\n        # Extraire pitch et yaw du torse\n        torso_pitch = self._quat_to_pitch(msg.orientation)\n        torso_yaw_rate = msg.angular_velocity.z\n        \n        # Compensation inverse (VOR)\n        head_pitch = -torso_pitch * self.vor_gain_pitch\n        head_pitch += self.pitch_bias.get(self.speed_mode, 0.0)\n        \n        head_yaw_correction = -torso_yaw_rate * self.vor_gain_yaw * 0.01\n        \n        # Publier commandes\n        self.pub_pitch.publish(Float32(data=head_pitch))\n        self.pub_yaw.publish(Float32(data=head_yaw_correction))\n```\n\n---\n\n## 10. Analyse par Régime de Vitesse\n\n### 10.1 La Triple Fusion est-elle Suffisante en Course ?\n\n| Critère | Marche (2 km/h) | Marche rapide (4 km/h) | Course (7 km/h) |\n| :--- | :---: | :---: | :---: |\n| **Distance entre scans L2** | ~10 cm | ~20 cm | ~35 cm |\n| **OAK-D entre frames** | ~1.8 cm | ~3.7 cm | ~6.5 cm |\n| **Vibrations torse (= L2)** | Faibles (±3°) | Modérées (±8°) | Fortes (±15°) |\n| **L2 SLAM (torse fixe)** | ✅ Excellent | ✅ Bon (BMI270 compense) | ⚠️ Dégradé mais compensé BMI270 |\n| **VOR OAK-D (tête)** | ✅ RS-05 : ~21 rad/s max | ✅ Marge confortable | ✅ 15°×5Hz = 75°/s << 21 rad/s |\n| **OAK-D motion blur** | ❌ Négligeable | 🟡 Gérable (VOR) | 🟠 Résiduel malgré VOR |\n| **Masse VOR (tête seule)** | ✅ 100g OAK-D seul | ✅ Réactif | ✅ Inertie faible |\n| **Obstacles proches (OAK-D)** | ✅ Dense, orientable | ✅ Dense, VOR + bias sol | ✅ Dense, VOR + bias -20° |\n| **Verdict** | ✅✅ Optimal | ✅ Suffisant | ⚠️ Viable avec VOR |\n\n### 10.2 Pourquoi la Course Reste Viable\n\n1. **VOR léger** : Le RS-05 ne stabilise que **~91g** (OAK-D seul, pas L2+OAK-D). L'oscillation torse en course (~15° × 3 Hz = ~45°/s) représente seulement **~4% de la capacité** du RS-05 (~21 rad/s). Marge immense.\n\n2. **L2 stable sur torse** : Même en course, les oscillations du torse sont **prévisibles** (locomotion régulière). Le BMI270 co-localisé compense la distorsion dans l'algorithme SLAM (motion undistortion). C'est bien mieux que si le L2 subissait les mouvements aléatoires de la tête.\n\n3. **OAK-D Pro à 30 FPS** : Même en course (1.9 m/s), l'OAK-D scanne tous les **6.5 cm** d'avancement — bien assez pour détecter les obstacles au sol. Le VOR stabilise l'image pour éviter le motion blur.\n\n4. **Redondance SLAM** : En course, si le SLAM LiDAR dérive, le **SLAM visuel OAK-D** prend le relais comme source d'odométrie principale. Le L2 contribue toujours à la localisation globale même avec un nuage filtré.\n\n5. **Stratégie de repli** : Si la course dégrade trop le SLAM, le robot peut automatiquement **ralentir à la marche rapide** pendant les phases de cartographie critique (virage, changement de pièce).\n\n### 10.3 Facteur Limitant Réel\n\nLe facteur limitant de la perception en course n'est **PAS le capteur** mais la **puissance de calcul** :\n- RTAB-Map avec fusion L2 + OAK-D + IMU à pleine vitesse → **~40-60% GPU** Jetson Orin\n- En course, les algorithmes de **planification de trajectoire** et de **contrôle de balance** consomment aussi du GPU\n- Budget GPU total disponible : ~20-30% GPU pour le planning/contrôle\n\n→ C'est largement gérable sur un Jetson Orin (NVDLA + GPU 1024-core).\n\n> [!TIP]\n> **Optimisation course** : En mode course, réduire la résolution OAK-D de 640×480 à 320×240 (75k pts/frame au lieu de 300k) pour libérer du GPU au contrôle de balance. La couverture reste suffisante pour la détection d'obstacles proches.\n", "Perception: 07_Vision_IA": "# 07 - Vision et Intelligence Artificielle\n\n## 1. Capteur Principal : Luxonis OAK-D Pro (FF) ⭐ CONFIRMÉ (Mars 2026)\nLe choix s'est porté sur la version **Fixed Focus (FF)** pour garantir la stabilité de l'IA malgré les vibrations mécaniques des moteurs RobStride.\n\n### 1.1 Comparatif des Caméras de Profondeur (État de l'Art — Mars 2026)\n\nLe marché des caméras de profondeur pour la robotique a évolué depuis le choix initial. Voici l'analyse comparative des alternatives envisagées :\n\n| Critère | **OAK-D Pro FF** ⭐ | **Orbbec Gemini 335** | **OAK-D S2** | **Intel RealSense D435i** | **OAK-D SR** |\n| :--- | :---: | :---: | :---: | :---: | :---: |\n| **Prix** | ~399 € | ~264-359 € | ~249 € | ~300 € | ~199 € |\n| **Poids** | 91g | 97g | 68g | 72g | ~60g |\n| **Dimensions** | 97×29×23 mm | ~comparable | Plus petit | 90×25×25 mm | Très compact |\n| **Vision nocturne (IR)** | ✅ Laser + LED | ❌ | ❌ | ❌ | ❌ |\n| **IA embarquée (VPU)** | ✅ 4 TOPS (Myriad X) | ❌ (ASIC prof.) | ✅ 4 TOPS | ❌ | ✅ 4 TOPS |\n| **Caméra RGB** | 12 MP (IMX378) | 1080p | 12 MP | 1080p | 1 MP |\n| **Portée profondeur** | 70cm – 12m | 10cm – 20m+ | 20cm – 10m | 15cm – 10m | 30cm – 1m |\n| **IMU intégré** | ✅ 9 axes (BNO085) | ❌ | ✅ 9 axes | ✅ 6 axes | ✅ 6 axes |\n| **Résistance poussière** | ❌ | ✅ IP5X | ❌ | ❌ | ❌ |\n| **SDK / Ecosystem** | DepthAI (ROS2) | Orbbec SDK (ROS2) | DepthAI (ROS2) | librealsense (ROS2) | DepthAI (ROS2) |\n\n### 1.2 Justification du Choix OAK-D Pro FF pour la Tête du D-Bot\n\nL'OAK-D Pro FF est le **seul** capteur qui combine ces 4 atouts critiques pour un robot humanoïde :\n\n1. **IA embarquée (4 TOPS)** : Détection d'objets, reconnaissance faciale et tracking 3D directement sur le VPU, sans consommer de GPU sur la Jetson → latence réduite.\n2. **Vision nocturne active** : Le projecteur IR à 4700 points + LED IR flood permettent au robot de percevoir la profondeur dans le noir total (déplacement nocturne, pièces sombres).\n3. **Caméra RGB 12 MP** : Résolution suffisante pour la reconnaissance faciale, la lecture de texte, et le streaming vidéo HD.\n4. **IMU 9 axes** : Fusion capteur pour la stabilisation du regard et le Visual-SLAM (V-SLAM).\n\n> ⚠️ **Limitation connue** : La portée minimale de 70cm signifie que le robot ne voit pas nettement les objets très proches de son visage. Pour la manipulation d'objets (mains), une caméra courte portée complémentaire sera nécessaire (cf. section 1.3).\n\n### 1.3 Caméras Complémentaires (Futures — Poignets/Mains)\n\nPour de futures itérations avec des mains préhensiles, deux options sont à surveiller :\n\n| Option | Portée min. | Intérêt |\n| :--- | :---: | :--- |\n| **Orbbec Gemini 305** (CES 2026) | 4 cm | Conçue pour montage au poignet de robot, compatible Jetson Thor |\n| **Luxonis OAK-D SR** | 30 cm | Ultra-compact, 60g, idéal pour le guidage de préhension |\n\n### Intégration Mécanique\nPour un encastrement parfait dans le visage du robot :\n- **Dimensions du perçage** : **98 x 30 mm** (prévoir +0.5 mm de tolérance).\n- **Fixation** : 2x vis M3, entraxe de **75 mm**, centrées.\n- **Passage Câble** : Encoche de **18 mm** en bas pour le connecteur USB-C coudé.\n- **Orientation** : Inclinaison de **-10° à -15°** vers le sol recommandée pour détecter les obstacles proches.\n\n### Atouts Techniques (Audit)\n- **Stéréo Active** : Contrairement à la version Lite, la Pro dispose d'un projecteur IR permettant de voir la profondeur même sur des surfaces sans texture (murs blancs unis).\n- **IMU Intégrée (BNO085/BMI270)** : Utilisée **uniquement pour la stabilisation du regard** et le V-SLAM. ⚠️ **Ne doit PAS servir pour l'équilibre du corps** car l'OAK-D est dans la tête qui bouge indépendamment du torse (2 DOF cou).\n- **Rôle dans la stratégie IMU** : Voir [18 — Stratégie IMU](./18_Strategie_IMU_Fusion.md) pour la répartition des rôles (IMU tête vs IMU torse vs IMU LiDAR).\n\n\n- **Rôle de la Vision** : Perception locale, détection d'obstacles rapprochés (0-10m), reconnaissance d'objets et V-SLAM.\n- **Rôle du LiDAR** : SLAM global 360°, cartographie à longue portée (30m) et odométrie LiDAR-Inertielle (LIO-SLAM).\n- **Fusion** : Les flux sont fusionnés dans **RTAB-Map** pour une localisation redondante et précise.\n\n> 👉 Pour l'étude technique complète du LiDAR, son montage sur le torse et la stratégie de fusion : **[19 — Perception Spatiale & LiDAR](./19_Perception_Spatiale_LiDAR.md)**.\n\n\n## 3. Stack Logicielle (NVIDIA Isaac)\n- **Isaac ROS** : Utilise les moteurs de deep learning de la Jetson pour traiter le flux OAK-D en temps réel.\n- **Isaac Gym** : Utilisé pour l'apprentissage par renforcement de la marche (Deep RL), en important l'URDF mis à jour avec la masse de l'OAK-D (91g).\n", "Securite: 11_Guide_SensiEDGE_Watchdog": "# 11 - Guide IMU & Watchdog (Sécurité & Équilibre)\n\nCe guide détaille l'intégration de l'**IMU torse** (SparkFun BMI270) et la mise en place de l'architecture de **Sécurité Active** (Watchdog + Power Management) pilotée par la Sony Spresense.\n\n> [!NOTE]\n> **Mars 2026** : La Spresense **ne gère plus l'audio** (remplacé par le [ReSpeaker XVF-3800](./08_Architecture_Audio.md)). Ses rôles restants sont :\n> - **Watchdog** : Surveillance heartbeat Jetson + coupure MOSFET 48V\n> - **Power Management** : Surveillance tension batterie 12S\n> - **IMU BMI270** : Équilibre bipède (416 Hz)\n> - **FSR** : Lecture capteurs plantaires (6× ADC)\n> - **Thermistances** : Monitoring moteurs RS-04\n\n> [!WARNING]\n> **Migration SensiEDGE → BMI270** : La carte SensiEDGE CommonSense initialement prévue **n'est pas disponible au grand public** (réservée aux professionnels). Ce guide a été mis à jour pour utiliser la **SparkFun 6DoF IMU Breakout - BMI270 (SEN-22397)** couplée à un câble Qwiic, beaucoup plus simple à sourcer en Europe.\n\n## 1. Matériel : IMU Torse\n\n### Option Recommandée : SparkFun BMI270 (SEN-22397)\n*   **Connexion** : Se câble sur le port I2C de la **Spresense Extension Board** via le câble adaptateur **Qwiic vers Pins Mâles (Adafruit 4209)**.\n*   **Capteur** : **Bosch BMI270** — Accéléromètre + Gyroscope 6 axes.\n*   **Rôle** : \"Sens de l'équilibre\" indépendant de la Jetson. Envoie les données (416Hz) vers ROS2.(accéléromètre) / **6.4 kHz** (gyroscope).\n*   **Rôle primaire** : **IMU d'équilibre** du robot — contrôle du centre de masse en temps réel.\n*   **Rôle secondaire** : Détection de chute quand la Jetson est éteinte (Watchdog).\n*   **Bibliothèque Arduino** : `Arduino_BMI270_BMM150` ou `BMI270-Sensor-API`.\n\n### Alternative Haute Précision : Sony Spresense Multi-IMU Add-on Board\n*   **Sortie** : Février 2025.\n*   **Principe** : 16 MEMS IMUs fusionnées pour une précision comparable aux **gyroscopes à fibre optique (FOG)**.\n*   **Quand l'utiliser** : Si la marche dynamique sur terrain complexe nécessite une précision angulaire extrême.\n*   **Interface** : SPI.\n\n### ~~SensiEDGE CommonSense~~ (Indisponible)\n*   ⚠️ **Non disponible au grand public** — réservée aux clients professionnels.\n*   Contenait : IMU (LSM6DSOX), Magnétomètre (LIS2MDL), Temp/Humidité (HTS221), Pression (LPS22HH), Qualité d'air (SGP40).\n*   Les capteurs environnementaux ne sont **pas critiques** pour le prototype V1. Si nécessaire, ajouter des thermistances ($1) sur les moteurs RS-04.\n\n### Montage Mécanique\nL'empilement (Stack) se fait verticalement dans le torse :\n1.  **Base** : Spresense Extension Board (Arduino form factor).\n2.  **Milieu** : Spresense Main Board.\n3.  **Haut** : **SparkFun BMI270 Breakout** (se connecte sur les headers/broches I2C via fils Qwiic).\n\n---\n\n## 2. Architecture \"Power Manager\" (Veille & Réveil)\nLa Spresense est le seul composant \"Always-On\" du robot. Elle contrôle l'alimentation de puissance (48V) via un **MOSFET**.\n\n### Schéma de Câblage (Protection 13S NMC)\n*   **Entrée Batterie** : 13S NMC 21700 (46.8V Nominal / 54.6V Max).\n*   **Pont Diviseur (Surveillance Tension)** :\n    *   Connecté à la **Pin A0** de la Spresense.\n    *   **R1** (Côté Batterie) : **150 kΩ**\n    *   **R2** (Côté Masse) : **10 kΩ**\n    *   *Ratio* : 55V en entrée donne ~3.44V en lecture (Compatible 3.3V avec marge).\n*   **Commande Puissance (MOSFET)** :\n    *   Connecté à la **Pin D13**.\n    *   Composant recommandé : **Infineon BTS50085** (Smart High-Side Switch) ou Module MOSFET 100V opto-isolé.\n    *   Rôle : Coupe physiquement l'alimentation de la Jetson et des Moteurs RobStride.\n*   **Heartbeat (Watchdog)** :\n    *   Connecté à la **Pin D12**.\n    *   Signal : La Jetson envoie une impulsion \"Vivant\" toutes les 100ms.\n\n---\n\n## 3. Code Spresense (C++)\nVoici le code complet pour gérer la sécurité, la batterie et le réveil.\n\n### Gestionnaire d'Alimentation & Watchdog\nCe code surveille la batterie (protection décharge profonde) et la Jetson (anti-freeze).\n\n```cpp\n/*\n * D-Bot Power Manager & Watchdog\n * Matériel : Sony Spresense + SparkFun BMI270 (IMU Équilibre)\n */\n\n#include <RTC.h> // Pour la gestion du temps\n\nconst int PIN_MOSFET = 13;    // Commande du Relais/MOSFET Puissance\nconst int PIN_HEARTBEAT = 12; // Entrée signal vie Jetson\nconst int PIN_WAKEUP = 11;    // Bouton de Test (ou Trigger Vocal)\nconst int PIN_BATTERY = A0;   // Pont diviseur\n\n// Paramètres Batterie 13S NMC (Sécurité)\nconst float R1 = 150000.0; \nconst float R2 = 10000.0;\nconst float VOLTAGE_THRESHOLD = 39.0; // Seuil critique (3.0V / cellule × 13S)\n\n// Paramètres Watchdog\nunsigned long lastHeartbeat = 0;\nconst unsigned long WATCHDOG_TIMEOUT = 5000; // 5 secondes sans signal = Crash\nbool isRobotAwake = false;\n\n// Lecture sécurisée de la tension batterie\nfloat readBatteryVoltage() {\n  int raw = analogRead(PIN_BATTERY);\n  // Conversion ADC (Ref 3.3V ou 5V selon jumper Extension Board)\n  float vOut = (raw * 5.0) / 1023.0; // Assumes 5V ref on Extension Board ADC\n  float vBat = vOut * ((R1 + R2) / R2);\n  return vBat;\n}\n\nvoid setup() {\n  pinMode(PIN_MOSFET, OUTPUT);\n  pinMode(PIN_HEARTBEAT, INPUT);\n  pinMode(PIN_WAKEUP, INPUT_PULLUP);\n  \n  digitalWrite(PIN_MOSFET, LOW); // Sécurité : Tout éteint au démarrage\n  Serial.begin(115200);\n  Serial.println(\"--- D-Bot Security Sentinel Started ---\");\n}\n\nvoid loop() {\n  // 1. Surveillance Batterie (Priorité Absolue)\n  float voltage = readBatteryVoltage();\n  if (voltage < VOLTAGE_THRESHOLD && voltage > 5.0) { // >5V pour éviter faux positif si pas branché\n    Serial.print(\"CRITIQUE : Batterie faible (\");\n    Serial.print(voltage);\n    Serial.println(\"V). Arrêt d'urgence.\");\n    emergencyShutdown();\n    return; // On ne fait rien d'autre\n  }\n\n  // 2. Gestion du Réveil (Si éteint)\n  if (!isRobotAwake) {\n    if (digitalRead(PIN_WAKEUP) == LOW) { // Ou détection vocale\n       if (voltage > VOLTAGE_THRESHOLD) {\n          wakeupRobot();\n       } else {\n          Serial.println(\"Refus d'allumage : Batterie trop faible.\");\n       }\n    }\n  }\n\n  // 3. Watchdog (Si allumé)\n  if (isRobotAwake) {\n    if (digitalRead(PIN_HEARTBEAT) == HIGH) {\n      lastHeartbeat = millis();\n    }\n    \n    if (millis() - lastHeartbeat > WATCHDOG_TIMEOUT) {\n      Serial.println(\"ALERTE : Perte signal Jetson (Freeze). Reboot...\");\n      emergencyShutdown();\n      // Optionnel : Tentative de redémarrage après 5s\n    }\n  }\n  \n  delay(100);\n}\n\nvoid wakeupRobot() {\n  Serial.println(\"Réveil du D-Bot...\");\n  digitalWrite(PIN_MOSFET, HIGH);\n  isRobotAwake = true;\n  lastHeartbeat = millis(); \n  delay(2000); // Laisser le temps à l'alim de se stabiliser\n}\n\nvoid emergencyShutdown() {\n  digitalWrite(PIN_MOSFET, LOW);\n  isRobotAwake = false;\n  Serial.println(\"Système mis en sécurité.\");\n}\n```\n\n### Intégration des Capteurs SensiEDGE\nPour lire l'IMU BMI270 (remplacement de la SensiEDGE), utilisez :\n- **IMU** : `Arduino_BMI270_BMM150` (Bosch officiel) ou `BMI270-Sensor-API`\n\nSi des capteurs environnementaux sont ajoutés ultérieurement :\n- **Température** : Thermistance NTC sur ADC Spresense\n- **Note** : Les bibliothèques SensiEDGE (`Arduino_LSM6DSOX`, `Arduino_HTS221`, etc.) ne sont plus nécessaires.\n\n*Note : L'IMU SparkFun utilise le bus I2C standard de la Spresense via son câble Qwiic.*\n", "Annexes: 16_Annexe_Batterie_NMC": "# Annexe — Recherche Batteries NMC 21700 pour K-Bot/D-Bot\n\n> **Source** : Recherche Perplexity AI — Février 2026\n> **Objectif** : Identifier les meilleurs packs Li-ion NMC 21700 48V disponibles depuis la France pour un robot humanoïde type K-Bot.\n\n---\n\n## 1. Cible Énergétique et Topologie\n\nLes specs K-Scale parlent d'un pack hot-swappable 48V 15 Ah (~720 Wh). Pour le D-Bot :\n- **Cible** : 2 × 48V 10 Ah ≃ 960 Wh total\n- **Masse** : ~4.5–5 kg avec du 21700 NMC de qualité\n- **Topologie** : Bus 48V (13S Li-ion), DC-DC pour 24V/12V/5V\n- **Usage des 2 packs** :\n  - 1 en service + 1 spare hot-swappable, ou\n  - 2 en parallèle via ORing MOSFET\n\n## 2. Chimies Comparées\n\n### NMC/NCA (21700) — ✅ Recommandé\n- Densité : 200–220 Wh/kg → masse minimale\n- Sécurité correcte avec cellules de marque (LG/Samsung) + BMS sérieux\n- **Exemple** : AT WEY 48V 10 Ah = 480 Wh pour 2.3 kg\n\n### LiFePO4 — ⚠️ Trop lourd\n- Densité 130–160 Wh/kg → 30-40% plus lourd\n- Pack 48V 10 Ah LFP ≃ 3–4 kg (vs 2.3 kg NMC)\n- Usage : prototypage stationnaire uniquement\n\n## 3. Option Recommandée : AT WEY NMC 48V 10 Ah\n\n| Paramètre | Valeur |\n| :--- | :--- |\n| **Chimie** | Li-ion NMC 21700 LG M50LT |\n| **Tension** | 48V nominale (13S) |\n| **Capacité** | 10 Ah (480 Wh) |\n| **Poids** | 2.3 kg par pack |\n| **BMS** | 13S NMC, 20-50A continu, 100A pic |\n| **Connectique** | Personnalisable (Anderson SB50, XT, etc.) |\n| **Usage** | Robotique, industrie, modélisme |\n| **Fabrication** | Assemblé en France |\n| **Lien** | [atwey.fr](https://atwey.fr/accueil/94-batterie-generique-48v-10ah.html) |\n\n### Configuration Robot (2 packs)\n- **Énergie totale** : 960 Wh\n- **Masse totale** : ~4.6 kg\n- **Courant** : 40–100A continu selon BMS (vérifier avec AT WEY)\n\n### Topologies possibles\n1. **1 pack en service + 1 spare** : Trappe batterie, connecteur Anderson SB50, fusible 80A\n2. **2 packs en parallèle** : Packs identiques, même âge, ORing MOSFET, connecteur/déconnexion à SoC ~50-60%\n\n## 4. Autres Fournisseurs NMC FR\n\n| Fournisseur | Modèle | Chimie | Capacité | Note |\n| :--- | :--- | :--- | :--- | :--- |\n| **Smolt & Co** | Li-ion 48V 10 Ah | Samsung/LG | 10 Ah | Bonne qualité, BMS avec sonde temp. |\n| **B-Volt** | Custom 48V | Samsung 35E | Variable | Ultra-léger, fabrication FR, Anderson |\n| **CMBatteries** | 48V 20 Ah | Samsung 50E | 20 Ah | Haute densité mais BMS limité à 30A |\n| **OZO** | Custom 48V | Sur mesure | Variable | Bureau d'étude FR, custom forme/BMS |\n| **Li-Tech** | Standard 48V LFP | LiFePO4 | 30-40 Ah | Sécurité max, mais très lourd |\n\n## 5. Sur-Mesure FR (Meilleur Compromis)\n\nStratégie recommandée :\n1. Partir du pack **AT WEY NMC 48V 10 Ah** comme base\n2. Contacter AT WEY pour **2 modules plus fins** montables de chaque côté du torse\n3. Connecteur Anderson SB50/QS8 + câble vers powerboard centrale\n\n## 6. Intégration (Schéma Électrique 48V)\n\n- **Par pack** : BMS interne 13S → Fusible 60-80A → Connecteur Anderson SB50\n- **Bus robot** : Powerboard 48V + CAN vers membres, buck vers compute\n- **Sécurité** :\n  - Packs fermés avec BMS dédié (jamais de cellules nues)\n  - Espace d'air autour de la batterie\n  - Cloisonnement en matériaux ignifugés (PC/ABS, alu)\n  - Sortie de dégazage \"vers l'arrière\"\n  - Charge avec chargeur 54.6V (13S) CC/CV dédié\n\n## 7. Résumé Achats\n\n1. **2 × AT WEY 48V 10 Ah NMC 21700** (~€300/pack) — [Lien](https://atwey.fr/accueil/94-batterie-generique-48v-10ah.html)\n2. **1 × Chargeur 48V Li-ion 13S (54.6V) 4-5A**\n3. **Connectique** : Anderson SB50 + fusibles 60-80A\n4. **Optionnel** : Contact OZO/AT WEY pour double pack sur-mesure\n\n---\n\n> **Sources principales** : [AT WEY](https://atwey.fr), [B-Volt](https://www.b-volt.com), [CMBatteries](https://cmbatteries.com), [OZO Industries](https://ozo-industries.com), [Li-Tech](https://www.li-tech.fr), [K-Scale Docs](https://docs.kscale.dev/robots/k-bot/electrical/)\n", "Annexes: 20_Etude_Cheville": "# Étude Cheville D-Bot — Historique Évolutif & Architecture Cardan\n\nCe document retrace l'évolution des solutions envisagées pour la cheville du D-Bot, puis détaille l'architecture finale retenue : un **cardan central DIN 808** couplé à un **système différentiel à 2 bielles** (type Optimus), actionné par **2× RS-03 par cheville**.\n\n---\n\n## 1. Historique des Solutions Étudiées\n\nL'architecture de la cheville a traversé cinq itérations avant d'aboutir au design final.\n\n### Étape 1 — K-Bot Standard (Architecture de Base)\nLe K-Bot original utilise un seul **RS-02 monté en haut du tibia**, actionné via un mécanisme de **tirant (pushrod)** avec un ratio de levier ~2:1.\n- **Couple effectif** : ~34 N.m (17 N.m × 2)\n- **DOF** : 1 seul (Pitch)\n- **Roll** : ❌ Absent\n- **Problème** : Pas de stabilité latérale, marche uniquement sur sol plat.\n\n### Étape 2 — Rotule GE12UK (Premier Pivot Envisagé)\nTentative d'ajout d'un pivot central avec une **rotule radiale GE12UK** (roulement lisse sphérique).\n- **Débattement** : ±15° seulement\n- **Problème** : Débattement insuffisant pour marcher sur des pentes, s'accroupir ou absorber les chocs. Le mécanisme arrive en butée mécanique rapidement, risquant de casser les pièces PA12-CF ou de griller les moteurs.\n- **Verdict** : ❌ Écarté — limite cinématique trop basse.\n\n### Étape 3 — Ajout RS-00 Roll Direct-Drive (D-Bot V1)\nAjout d'un **RS-00** (14 N.m, 310g) monté directement à la cheville pour le Roll, en conservant le RS-02+tirant pour le Pitch.\n- **DOF** : 2 (Pitch + Roll)\n- **Avantage** : Simple à implémenter, assemblage trivial.\n- **Problème** : 310g de masse distale (inertie oscillante), RS-02+tirant toujours limité à ~34 N.m pour le Pitch (marche rapide impossible).\n- **Analyse** : Voir [Analyse Biomécanique §7](./15_Analyse_Biomecanique.md).\n\n### Étape 4 — RS-06 \"Sweet Spot\" avec Tirant (D-Bot V2)\nRemplacement du RS-02 par un **RS-06** (36 N.m, 621g) dans le tibia, avec tirant.\n- **Couple Pitch effectif** : ~72 N.m (36 × 2)\n- **Avantage** : Double le couple pour seulement +75g, marche rapide possible.\n- **RS-00 Roll conservé** (14 N.m).\n- **Analyse** : Voir [Cinématique §4.5](./14_Cinematique_Moteurs.md).\n- **Verdict** : ⚠️ Solution correcte mais le Roll reste au pic en marche rapide.\n\n### Étape 5 — Architecture Cardan + Double Bielles (RETENUE ✅)\nAbandon du tirant au profit d'un **cardan central** (DIN 808, acier C45) + **2 bielles rotulées** actionnées par **2× RS-03** par cheville.\n- **Couple Pitch** : 120 N.m (2× 60 N.m en mode synchrone)\n- **Couple Roll** : 120 N.m (2× 60 N.m en mode différentiel)\n- **Masse distale** : ~0g (moteurs en haut du tibia)\n- **Inspiré de** : Tesla Optimus (mécanisme à bielles parallèles)\n- **Verdict** : ✅ **Architecture finale du D-Bot.**\n\n---\n\n## 2. Architecture Retenue — Cheville Différentielle à Cardan\n\n### Principe de Fonctionnement\n\nLa cheville fonctionne en \"trépied\" :\n- Le **Cardan Central** : Supporte 100% du poids du robot (~38-40 kg). Il permet un débattement très élevé (+30°/−45° en Pitch, ±25° en Roll) sans butée structurelle.\n- Les **2 Bielles (Pushrods) à l'Arrière** : Reliées chacune à un RS-03 monté en haut du tibia.\n\n```\n      ┌─────┐\n      │GENOU│\n      └──┬──┘\n         │\n    ╔════╧════╗   ╔════╧════╗\n    ║ RS-03 A ║   ║ RS-03 B ║  ← 2 moteurs HAUT du tibia\n    ╚════╤════╝   ╚════╤════╝    (chacun 60 N.m pic, 880g)\n         │             │\n         │ Bielle A    │ Bielle B    ← Tubes carbone 3K\n         │ (rotule M5) │ (rotule M5)   Ø10/8mm\n         │             │\n         ╰──────┬──────╯\n                │\n           ╔════╧════╗\n           ║ CARDAN  ║  ← DIN 808, Série G, Acier C45\n           ║ (pivot) ║    Supporte 100% du poids\n           ╚════╤════╝\n           ┌────┴────┐\n           │  PIED   │\n           └─────────┘\n\n    A↓ + B↓ (même sens)    = PITCH (flexion/extension)\n    A↓ + B↑ (sens opposé) = ROLL  (inversion/éversion)\n```\n\n### Bilan des Performances\n\n| Paramètre | Valeur |\n| :--- | :--- |\n| **Couple Pitch effectif** | 120 N.m (2× RS-03 synchrones) |\n| **Couple Roll effectif** | 120 N.m (2× RS-03 différentiels) |\n| **Marge vs besoin statique (33 N.m)** | **+260%** |\n| **Masse distale** | ~0g (moteurs haut du tibia) |\n| **Débattement Pitch** | +30° / −45° |\n| **Débattement Roll** | ±25° |\n| **DOF total jambe** | 6 (Hanche P/R/Y + Genou + Cheville P/R) |\n| **Moteurs par jambe** | 6 (2× RS-04 + 2× RS-03 hanche + 2× RS-03 cheville) |\n\n---\n\n## 3. Achats et Montage\n\n### A. Joint de Cardan Central\nJoint de cardan simple **Série G** (douilles lisses, résistantes aux chocs), norme DIN 808, acier C45, axe 12 mm.\n- **Mouvement** : la transmission de couple se fait par montage à **rainure de clavette (Keyway)** de 4 mm.\n- **Fournisseurs France** :\n  - **Michaud Chailly** : Réf. A5-473-12 (qualité premium, option rainure).\n  - **HPC Europe** : Réf. UJ-12.\n\n### B. Fixation et Maintien Axial\nL'axe en acier rectifié (12mm h6) doit être immobilisé axialement :\n- **Bagues d'arrêt (Shaft Collars)** en acier, 2 parties (fendues), de chaque côté du cardan.\n  - **HPC Europe** : BAG2-012 ou **Michaud Chailly / Ruland** : F2-39-12. Vis de classe 12.9.\n\n### C. Bielles (Pushrods) et Rotules\n\n#### Pourquoi des tubes en Carbone plutôt que de l'Aluminium ?\nLe choix de tubes en **fibre de carbone 3K (Ø ext 10mm / Ø int 8mm)** au lieu de tiges en aluminium est fondamental pour la locomotion bipède, pour 4 raisons d'ingénierie :\n\n1. **Résistance au Flambement (Compression extrême)** : Lors d'un pas dynamique, les bielles encaissent des forces massives (> 1500 N). La résistance au flambement dépend du module de Young ($E$). L'aluminium (69 GPa) plierait sous la charge à ce diamètre. Le carbone 3K pultrudé ($E \\approx 120-150$ GPa) est plus de deux fois plus rigide.\n2. **Réduction de l'Inertie Distale** : Toute masse située loin de la hanche coûte très cher en énergie lors de la phase oscillante (balancement de la jambe). Un tube carbone Ø10/8 pèse ~20 g/mètre, contre ~40 g/mètre pour l'alu. Ce gain en bas de la jambe permet des foulées plus rapides et réduit la chauffe des moteurs.\n3. **Résistance à la Fatigue Cyclique** : À chaque pas, la bielle subit des stress alternés (Traction → Compression). L'aluminium finit par micro-fissurer (fatigue du métal). Le carbone a une résistance à la fatigue cyclique virtuellement infinie tant qu'il ne subit pas d'impact transversal direct.\n4. **Intégration par Collage Bicomposant** : Tarauder un tube aluminium de 1mm d'épaisseur (10/8) est mécaniquement faible. Avec le carbone, on utilise **le collage structural à l'époxy** : on encolle une tige filetée M5 (acier) avec une résine époxy bicomposant (ex: Loctite EA ou DP490) et on l'insère dans le tube (Ø int 8mm est parfait pour accueillir la tige et la colle + insert 3D). Cela crée un joint indissociable sans jeu mécanique.\n- **Rotules d'extrémité** : Embouts M5.\n  - **Igus EBRM-05** (polymère, ultra léger)\n  - **SAK 5 C** (acier/PTFE, sur 123Roulement).\n\n### D. Protection (Soufflet)\nSoufflet de protection en néoprène (vendu en option avec le cardan chez RS, Michaud ou HPC). Indispensable pour protéger l'articulation de la poussière.\n\n---\n\n## 4. Impact sur la Configuration Globale\n\nL'adoption de cette architecture modifie la configuration moteur des jambes :\n\n| Articulation | Moteur | Qté (×2 jambes) | Couple | Note |\n| :--- | :---: | :---: | :---: | :--- |\n| Hanche Pitch | RS-04 | 2 | 120 N.m | Inchangé (K-Bot) |\n| Hanche Roll | RS-03 | 2 | 60 N.m | Inchangé |\n| Hanche Yaw | RS-03 | 2 | 60 N.m | Inchangé |\n| Genou Pitch | RS-04 | 2 | 120 N.m | Inchangé |\n| **Cheville A** | **RS-03** | **2** | **60 N.m** | **NOUVEAU** (remplace RS-02 tirant) |\n| **Cheville B** | **RS-03** | **2** | **60 N.m** | **NOUVEAU** (remplace RS-00 Roll) |\n\n**Total moteurs jambes** : 12 (au lieu de 10 pour K-Bot + 2 RS-00 Roll précédents)\n**Surpoids** : +2× (880g − 405g) + 2× (880g − 310g) = +950g + 1140g = **+2.09 kg** vs V1.\n**Surcoût** : +2× ($250 − $160) + 2× ($250 − $135) = +$180 + $230 = **+$410** vs V1.\n\n> [!IMPORTANT]\n> **Ce surpoids est en position BASSE (tibia)**, donc l'impact sur le centre de gravité est minimal. L'avantage de couple (+260% de marge) et la suppression de toute masse distale (~0g vs 310g/cheville) compensent largement.\n\n---\n*Étude réalisée en Février 2026. Basée sur les analyses biomécaniques documentées dans les Annexes 14 et 15.*\n", "Annexes: 21_Etude_Main_Robotique": "# Étude Main Robotique : D-Hand Hybrid\n\nCette annexe détaille la conception de la main articulée anthropomorphe du D-Bot, basée sur une architecture à **tendons déportés** et des servos mixtes **Dynamixel XC430-W240-T** (force) et **XC330-T288-T** (précision).\n\n## 1. Philosophie de Conception\n\n### Objectif\nObtenir une main de dextérité avancée (8 DOF, **~175 N de grip effectif** grâce aux capteurs tactiles eFlesh) permettant la manipulation d'objets courants (outils, bouteilles, poignées de porte), tout en restant réparable, évolutive, et compatible avec l'apprentissage par renforcement (sim-to-real).\n\n### Principe : Actionnement Déporté à Tendons (comme la main humaine)\n\nDans la main humaine, les muscles responsables de la flexion des doigts sont situés dans l'**avant-bras**, pas dans les doigts eux-mêmes. Des tendons transmettent la force sur de longues distances. La D-Hand reproduit ce principe :\n\n```\n┌──────────────────────────────┐\n│       AVANT-BRAS D-BOT      │ ← 8 servos (4×XC430 + 4×XC330)\n│    (structure PA12-CF/Alu)   │ ← Masse moteur : 352g seulement\n│                              │\n│  Servos → Poulies → Tendons ─┼──→ vers le poignet (RS-00)\n└──────────────────────────────┘\n                                    │\n                               ┌────┴────┐\n                               │  MAIN   │ ← Aucun moteur !\n                               │ ~400g   │ ← Phalanges étudiées pour eFlesh\n                               └─────────┘    + ressorts de rappel\n```\n\n**Avantages** :\n- La main est **légère** (~400g avec capteurs) car les éléments lourds n'y sont pas.\n- L'inertie au bout du bras est **minimale** → meilleure dynamique de manipulation.\n- Les servos dans l'avant-bras sont **facilement accessibles** pour la maintenance.\n\n---\n\n## 2. Choix des Servos : Écosystème Dynamixel 2.0\n\n### Pourquoi cet écosystème ?\nRobotis Dynamixel est le **standard de facto** de la robotique de recherche. Il combine compacité, engrenages métaux, et un écosystème logiciel mature (SDK Python, ROS 2 natif). La **D-Hand Hybrid** utilise deux modèles complémentaires sur le même bus de données connectés en daisy-chain :\n- **4× XC430-W240-T** pour les canaux de **force brute** (1.9 N.m).\n- **4× XC330-T288-T** pour les canaux de **précision / faible effort** (1.0 N.m).\n\n### Fiche Technique Comparée\n\n| Paramètre | Moteur de Force (XC430-W240-T) | Moteur de Précision (XC330-T288-T) |\n| :--- | :--- | :--- |\n| **Dimensions** | 46.5 × 28.5 × 34 mm | 34 × 20 × 26 mm |\n| **Poids** | 65 g | 23 g |\n| **Couple de blocage (12V)** | **1.9 N.m** (19.4 kg.cm) | **1.0 N.m** (10.2 kg.cm) |\n| **Vitesse à vide** | 70 RPM | 71 RPM |\n| **Résolution** | 4096 pas / tour (0.088°) | 4096 pas / tour (0.088°) |\n| **Encodeur** | Magnétique absolu, sans contact | Magnétique absolu, sans contact |\n| **Réducteur** | Ratio 245:1, engrenages **métal** | Ratio 288:1, engrenages **métal** |\n| **Modes de contrôle** | Position, Vitesse, Courant, PWM | Position, Vitesse, Courant, PWM |\n| **Protocole** | Dynamixel Protocol 2.0 (TTL) | Dynamixel Protocol 2.0 (TTL) |\n| **Tension** | 10 – 14.8V (recommandé 12V) | 6.5 – 12V (recommandé 11.1V) |\n| **Prix unitaire (EU)** | ~130 € | ~110 € |\n\n> ✅ **Backdrivability** : Les deux modèles supportent le mode courant, offrant une **compliance passive totale** (le robot cède si on le pousse, assurant la sécurité des interactions).\n\n### Comparaison avec les Alternatives Écartées\n\n| Critère | XC330-T288-T | Feetech STS3215 | CubeMars GL30+Cyclo |\n| :--- | :--- | :--- | :--- |\n| Couple | 1.0 N.m | 3.0 N.m | 0.28 N.m (×15 = 4.2 en théorie) |\n| Poids | **23g** | 55g | ~50g + réducteur |\n| Engrenages | **Métal** | Nylon | Cycloïdal usiné (120+ pièces) |\n| Durabilité | Industrielle | Hobby | Expérimental |\n| Backdrivability | ✅ Excellente | ⚠️ Limitée | ✅ (si usiné parfait) |\n| Écosystème | **Dynamixel SDK, ROS** | SDK basique | FOC custom |\n| Coût / main (8×) | ~1 040€ | ~150€ | ~700€ (optimiste) |\n| Risque projet | 🟢 Faible | 🟢 Faible | 🔴 Très élevé |\n\n**Verdict** : Le XC330 compense son couple inférieur par l'amplification mécanique des poulies et une fiabilité supérieure. Le STS3215 reste une option V1 budget si le coût est prioritaire.\n\n---\n\n## 3. Architecture — Configuration 8 DOF\n\n### 3.1 Affectation Mixte des Servos (Système Hybride)\n\nL'idée fondamentale de la **D-Hand Hybrid** est d'affecter la puissance là où elle est nécessaire (prise en force) et la finesse là où elle est utile (dextérité, opposition) pour maximiser le grip tout en conservant 8 DOF complets et un encombrement minimal.\n\n| # | Doigt | Mouvement | Besoin Force | Servo Affecté | Tendon |\n| :---: | :--- | :--- | :---: | :--- | :--- |\n| 1 | **Pouce** | Flexion (Curl) | 🔴 ÉLEVÉ | **XC430** (1.9 N.m) | Dyneema Ø1.0mm |\n| 2 | **Pouce** | Opposition (Abd.) | 🟡 MOYEN | **XC330** (1.0 N.m) | Dyneema Ø0.8mm |\n| 3 | **Index** | Flexion (Curl) | 🔴 ÉLEVÉ | **XC430** (1.9 N.m) | Dyneema Ø1.0mm |\n| 4 | **Index** | Abduction | 🟢 FAIBLE | **XC330** (1.0 N.m) | Dyneema Ø0.8mm |\n| 5 | **Majeur** | Flexion (Curl) | 🔴 ÉLEVÉ | **XC430** (1.9 N.m) | Dyneema Ø1.0mm |\n| 6 | **Annulaire** | Flexion | 🟡 MOYEN | **XC330** (1.0 N.m) | Dyneema Ø0.8mm |\n| 7 | **Auriculaire** | Flexion | 🟢 FAIBLE | **XC330** (1.0 N.m) | Dyneema Ø0.8mm |\n| 8 | **Paume** | Curl palmaire | 🔴 ÉLEVÉ | **XC430** (1.9 N.m) | Dyneema Ø1.0mm |\n\n### 3.2 Implantation dans l'Avant-Bras (Le défi de l'encombrement)\n\nL'avant-bras du D-Bot mesure ~22 cm de l'articulation coude à l'articulation poignet (RS-00). Intégrer les gros XC430 avec les petits XC330 se fait via une conception en tandem :\n\n```\nVUE LONGITUDINALE — AVANT-BRAS (coupe latérale)\n\n  COUDE (RS-06)                              POIGNET (RS-00)\n  ←────────────────── 22 cm ─────────────────────────→\n  │                                                   │\n  │  ┌────────────────┐ ┌──────────┐                  │\n  │  │  4× XC430      │ │ 4× XC330 │   Espace libre   │\n  │  │  (2×2 empilés) │ │ (2×2 env)│   pour câblage,  │\n  │  │  93mm long     │ │ 52mm long│   buck 48V→12V,  │\n  │  │  57mm × 68mm   │ │ 40×52mm  │   U2D2 controller│\n  │  └────────────────┘ └──────────┘                  │\n  │  ←     93 mm    →   ←  52 mm →   ←   75 mm    →   │\n```\n\n> ✅ L'ensemble compact (145 mm) s'intègre parfaitement, laissant 75 mm pour l'électronique de contrôle et le routage des 8 tendons sous gaine PTFE. Le poids total des servos est de **352g** (4×65g + 4×23g).\n\n### 3.3 Système de Tendons et Guidage\n\n| Composant | Spécification |\n| :--- | :--- |\n| **Tendon** | Tresse Dyneema Ø0.8mm (résistance 40 lbs / 18 kg) |\n| **Gaine de guidage** | Tube PTFE Ø1.5mm intérieur (friction quasi nulle) |\n| **Poulie de sortie** | Ø8mm aluminium 6061, usinée CNC (C500) |\n| **Poulies de renvoi** | Ø6mm dans la paume, PA12-CF imprimé 3D |\n| **Retour passif** | Ressort de torsion 0.05 N.m par articulation |\n| **Fixation tendon** | Nœud + goutte de cyanoacrylate sur la phalange distale |\n\n**Parcours du tendon (exemple : Index, Curl) :**\n```\nXC330 #3 → Poulie Ø8mm CNC → Tendon Dyneema dans gaine PTFE\n  → Traverse le poignet (RS-00 creux) → Renvoi base de la main\n  → Phalange proximale (MCP) → Phalange médiale (PIP)\n  → Attache sur phalange distale (DIP)\n\nRetour : 3 ressorts de torsion miniatures (MCP + PIP + DIP)\n         ramènent le doigt en position ouverte\n```\n\n---\n\n## 4. Performances Estimées\n\n### 4.1 Force de Grip\n\n> [!NOTE]\n> **Paramètres des poulies validés (Mars 2026)** : Les poulies CNC intègrent un roulement MR84ZZ (Ø8mm extérieur). Le diamètre optimal retenu est **Ø12mm** en **Aluminium 7075-T6** ou **Bronze CuSn8**, avec roulement MR84ZZ pressé. Rayon effectif de gorge : **r = 6mm**. Rendement η = **85%** (alu 7075) ou **88%** (bronze, auto-lubrifiant).\n\n| Mesure | Calcul (Ø12mm, r=6mm, η=85%) | Résultat |\n| :--- | :--- | :--- |\n| **Tension XC430 (canal Force)** | 1.9 N.m × 0.85 / 0.006 m | **~269 N** |\n| **Tension XC330 (canal Précision)** | 1.0 N.m × 0.85 / 0.006 m | **~142 N** |\n| **Force pointe du doigt (tendu)** | Levier anatomique sur 90mm | **~22 N** (2.2 kg) |\n| **Pince pouce+index** | 2 tendons XC430 en opposition | **~55 N** (5.5 kg) |\n| **Grip global (5 doigts)** | Somme pondérée (XC430×4 + XC330×4) | **~150-165 N** |\n| **Avec eFlesh (grip adaptatif)** | Suppression marge sécurité aveugle (95% au lieu de 60%) | **~170-180 N** |\n\n> ⚠️ **Nota : impact du diamètre de poulie sur la force**\n>\n> | Config | r | Tension XC430 (η=85%) | Grip estimé |\n> | :--- | :---: | :---: | :---: |\n> | Ø16mm Alu 6061 (ORCA original style) | 8mm | 202 N | ~120-130 N |\n> | Ø14mm Alu 6061 | 7mm | 218 N | ~136-148 N |\n> | **Ø12mm Alu 7075-T6 ⭐** | **6mm** | **269 N** | **~170-180 N** |\n> | Ø12mm Bronze CuSn8 (η=88%) | 6mm | 279 N | ~174-184 N |\n>\n> Le Ø12mm en 7075-T6 est **structurellement équivalent** au Ø16mm en 6061 (paroi 2mm × 503 MPa ≈ paroi 4mm × 241 MPa). Voir §11.2 pour le choix de matériau CNC.\n\n### 4.2 Comparaison\n\n| Main | Force Grip | DOF | Poids | Coût /main | Servos |\n| :--- | :---: | :---: | :---: | :---: | :--- |\n| **D-Hand Hybrid (Ø12mm 7075)** | **~175 N** | **8** | **~850g** | **~1 110€** | 4×XC430 + 4×XC330 |\n| ORCA Hand Base (mesuré) | ~103 N | 17 | ~1 300g | ~3 500$ | 17× Dynamixel |\n| LEAP Hand v2 (CMU) | ~80 N | 17 | ~400g | ~4 000€ | 17× Dynamixel |\n| Main humaine | ~300-400 N | 27 | ~400g | N/A | — |\n| K-Bot Gripper | ~50 N | 1 | ~100g | ~30€ | 1× STS3215 |\n\n### 4.3 Vitesse\n\n| Métrique | D-Hand Hybrid | Main Humaine |\n| :--- | :---: | :---: |\n| Temps de fermeture | ~0.5 s | ~0.3 s |\n| Temps de prise de force | ~0.7 s | ~0.5 s |\n\n---\n\n## 5. BOM — D-Hand Hybrid (par main)\n\n| Composant | Qté | Prix Unit. | Total |\n| :--- | :---: | :---: | :---: |\n| Dynamixel XC430-W240-T (Force) | 4 | 130 € | 520 € |\n| Dynamixel XC330-T288-T (Précision) | 4 | 110 € | 440 € |\n| U2D2 (USB↔Dynamixel) | 1 | 35 € | 35 € |\n| U2D2 Power Hub | 1 | 25 € | 25 € |\n| Buck Converter 48V→12V (5A-10A) | 1 | 15 € | 15 € |\n| Tendons Dyneema (bobine 50m) | 1 | 15 € | 15 € |\n| Tubes PTFE Ø1.5mm (10m) | 1 | 8 € | 8 € |\n| Roulements MR52ZZ (2×5×2.5mm) | 16 | 1 € | 16 € |\n| Structure main (PA12-CF, impr. 3D) | 1 lot | — | 20 € |\n| Poulies Ø8mm alu CNC (C500) | 8 | 5 € | 40 € |\n| Visserie M2/M2.5 inox | lot | — | 10 € |\n| Capteurs tactiles eFlesh (Silicone + PCBs) | 1 lot | — | ~150 € |\n| **TOTAL par main** | | | **~1 294 €** |\n\n> *Note : Prix optimisé estimé à ~1 110€ en achat volume / distributeur.*\n**Pour les 2 mains : ~2 220 €.**\n\n### Alimentation\nLes XC430 et XC330 fonctionnent à 12V. Le D-Bot utilise du 48V. Un **Buck Converter 48V→12V** (~15€) sera intégré dans le châssis avant-bras. Courant total max : 4 × 1.4A (XC430) + 4 × 0.88A (XC330) = **~9.1A (en stall continu)**, ~4A en usage normal. Il faudra un buck converter robuste (10A) pour supporter les pics dynamiques de prise en force de la main complète.\n\n---\n\n## 6. Intégration Logicielle\n\n| Couche | Technologie |\n| :--- | :--- |\n| **Interface physique** | U2D2 (USB) → Jetson Orin Nano |\n| **SDK** | Dynamixel SDK Python / C++ (officiel ROBOTIS) |\n| **Middleware** | ROS 2 Humble — `dynamixel_workbench` |\n| **Contrôle** | Position+Courant (mode #5) pour grip adaptatif |\n| **Simulation** | MuJoCo / Isaac Gym (modèle URDF disponible) |\n| **Apprentissage** | Compatible sim-to-real (RL policy transfer) |\n\nLe protocole Dynamixel 2.0 permet de lire en temps réel : position, vitesse, courant, température et charge de chaque servo à 200 Hz sur le bus TTL — suffisant pour un contrôle de grip adaptatif.\n\n### 6.1 Backdrivabilité Mécanique vs Compliance Active\n\nContrairement aux gros moteurs RobStride des bras/jambes (quasi direct-drive à ~9:1), les servomoteurs de la main possèdent d'énormes réducteurs métalliques (245:1 pour le XC430, 288:1 pour le XC330).\n- **Mécaniquement : NON Backdrivable.** Une main D-Bot éteinte est figée. Forcer manuellement sur les doigts risque de casser les engrenages. L'avantage est qu'une fois un objet saisi, la main peut rester serrée avec une consommation électrique très faible (Holding Torque \"mécanique\").\n- **Logiciellement : Compliance Active (OUI).** Pour qu'un robot humanoïde puisse interagir en toute sécurité, les servos sont pilotés en mode **Current Control** (Contrôle en Courant pour XC330) ou **PWM Control** (XC430). L'IA limite le courant maximum autorisé. Dès que le doigt touche l'objet, le courant monte ; si la limite de consigne est atteinte, le moteur s'arrête de forcer sans jamais casser l'objet (un œuf, par exemple). De plus, si un humain tire sur l'objet avec une force supérieure à la consigne, le moteur \"cédera\" et reculera logiciellement. La main agit alors comme un ressort virtuel paramétrable.\n\n---\n\n## 7. Comparatif Complet : Les Cinq Architectures D-Hand\n\nLa conception de la D-Hand a évolué au gré des itérations pour aboutir à l'architecture Hybride (Solution E). Ce chapitre présente l'historique de la réflexion et les 5 approches étudiées côte à côte pour conserver l'historique des choix.\n\n---\n\n### Solution A : D-Hand Premium (8× Dynamixel XC330-T288-T)\n*Architecture d'origine — Standard Académique*\n\n#### Fiche Technique XC330\n\n| Paramètre | Valeur |\n| :--- | :--- |\n| **Dimensions (L×l×H)** | **34 × 20 × 26 mm** |\n| **Poids** | **23 g** |\n| **Couple de blocage (12V)** | 1.00 N.m (10.2 kg.cm) |\n| **Vitesse à vide** | 71 RPM (0.21 s/60° @12V) |\n| **Résolution position** | 4096 pas / 0.088° |\n| **Encodeur** | Magnétique absolu 12 bits |\n| **Réducteur** | 288:1 — engrenages **métal** |\n| **Moteur de base** | Coreless DC, très faible inertie |\n| **Bruit fonctionnement** | **~35–38 dB** (@ 30 cm; estimation) |\n| **Backdrivability** | ✅ Mode courant → compliance totale |\n| **Protocole** | Dynamixel 2.0 TTL, 4 Mbps, daisy-chain |\n| **Compatible SDK/ROS** | ✅ Dynamixel SDK, ROS 2, Isaac Gym URDF |\n| **Prix unitaire (EU)** | **~130 € (ROBOTIS-EU)** |\n| **Prix 8× / main** | **~1 040 €** |\n| **Prix total 2 mains** | **~2 080 €** |\n\n#### Implantation dans l'Avant-Bras\n\nUn seul XC330 mesure 34 × 20 × 26 mm. Avec 8 servos :\n- Emprise en coupe transversale : **60 × 60 mm**\n- Longueur de la \"batterie de servos\" : **~102 mm** (3 rangées de 26mm + 1 rangée)\n- Sur une fenêtre avant-bras de 22 cm (coude → poignet), l'emprise total laisse **12 cm** libres pour l'électronique (buck 48V→12V, câblage, contrôleur U2D2).\n\n```\nVUE EN COUPE TRANSVERSALE — 8× XC330\n          ← 60 mm →\n┌───────────────────────────┐\n│  ┌────────┐ ┌────────┐    │ ← Rangée 1\n│  │XC330 20│ │XC330 20│    │   (Pouce Curl + Index Curl)\n│  └────────┘ └────────┘    │\n│  ┌────────┐ ┌────────┐    │ ← Rangée 2 (décalée 26mm)\n│  │XC330   │ │XC330   │    │   (Pouce Abduction + Index Abduction)\n│  └────────┘ └────────┘    │\n│  ┌────────┐ ┌────────┐    │ ← Rangée 3\n│  │XC330   │ │XC330   │    │   (Majeur + Annulaire/Auriculaire)\n│  └────────┘ └────────┘    │\n│       ┌────────┐          │ ← Rangée 4\n│       │XC330   │          │   (Paume)\n│       └────────┘          │\n└───────────────────────────┘\n  Emprise totale : 60×60×102 mm / 184g de servos\n```\n\n#### Points Forts / Faibles\n\n| Critère | Évaluation |\n| :--- | :--- |\n| ✅ **Poids** | Le plus léger (~184g) — idéal pour l'inertie distale |\n| ✅ **Silencieux** | Coreless + engrenages métal → ~35-38 dB en fonctionnement |\n| ✅ **Backdrivability** | Compliance programmable → sécurité humain-robot |\n| ✅ **Précision** | 0.088°, encodeur magnétique sans contact, très fiable |\n| ✅ **Écosystème** | Meilleur du marché : SDK, ROS 2, URDF pour Isaac Gym |\n| ❌ **Prix** | 130€/servo → 1 040€/main → **2 080€ pour les deux** |\n| ❌ **Disponibilité** | Délais European ROBOTIS-EU parfois longs |\n| ❌ **Couple brut** | 1 N.m seulement — nécessite l'amplification par poulies |\n\n---\n\n### Solution B : D-Hand Standard (8× Feetech STS3215)\n*Architecture Budget Haute Performance*\n\nLe Feetech STS3215 est le servo *bus* le plus populaire dans la robotique open-source mondiale. Il équipe les K-Bot (1er prototype), les robots NASA Valkyrie hacks, et des centaines de projets DIY en attendant une version améliorée.\n\n#### Fiche Technique STS3215\n\n| Paramètre | Valeur |\n| :--- | :--- |\n| **Dimensions (L×l×H)** | **45.2 × 24.7 × 35 mm** |\n| **Poids** | **55 g** |\n| **Couple de blocage (12V)** | **3.0 N.m (30 kg.cm)** |\n| **Vitesse à vide** | ~45 RPM (0.222 s/60° @12V) |\n| **Résolution position** | 4096 pas / 0.088° |\n| **Encodeur** | Magnétique absolu 12 bits |\n| **Réducteur** | ~252:1 — engrenages **acier** (version 12V) |\n| **Moteur de base** | DC standard (à balais, inertie plus élevée) |\n| **Bruit fonctionnement** | **~40–45 dB** (@ 30 cm; mesuré par fabricant) |\n| **Backdrivability** | ⚠️ Limitée (réducteur fort) — compliance partielle en courant |\n| **Protocole** | Feetech TTL (UART Half-Duplex, compatible SCSerial) |\n| **Compatible SDK/ROS** | ✅ Python SCSerial, ROS 2 via wrapper open-source |\n| **Prix unitaire (EU)** | **~22–30 € (RobotShop, AliExpress)** |\n| **Prix 8× / main** | **~180–240 €** |\n| **Prix total 2 mains** | **~360–480 €** |\n\n#### Implantation dans l'Avant-Bras\n\nUn STS3215 mesure 45.2 × 24.7 × 35 mm, soit **2x plus grand** qu'un XC330 dans chaque dimension. Avec 8 servos, deux configurations sont possibles :\n\n**Option 1 : 2 rangées de 4 (côte à côte)**\n```\nVUE EN COUPE TRANSVERSALE — 8× STS3215 (config 2×4)\n           ← ~100 mm →\n┌───────────────────────────────────────┐\n│  ┌─────────┐ ┌─────────┐ ┌─────────┐ ┌─────────┐  │ ← Rangée 1 (4×)\n│  │STS 45mm │ │STS 45mm │ │STS 45mm │ │STS 45mm │  │   45×35 mm\n│  └─────────┘ └─────────┘ └─────────┘ └─────────┘  │\n│  ┌─────────┐ ┌─────────┐ ┌─────────┐ ┌─────────┐  │ ← Rangée 2 (4×)\n│  └─────────┘ └─────────┘ └─────────┘ └─────────┘  │\n└───────────────────────────────────────┘\n  Emprise totale : 100×80×95 mm — TROP LARGE (Ø avant-bras ~80mm)\n```\n\n> ⚠️ **Problème Majeur d'Intégration** : 4 STS3215 côte à côte nécessitent ~100 mm de largeur. L'avant-bras du D-Bot ne fait que 80-90 mm à sa section la plus large (au niveau du coude). Cette configuration ne rentre **pas** dans un avant-bras esthétiquement correct.\n\n**Option 2 : Disposition en Tandem (2 colonnes de 4)**\n```\nVUE LONGITUDINALE — 8× STS3215 (tandem 2×4)\n  COUDE                                     POIGNET\n  ←────────────── 22 cm ─────────────────────→\n  │  ┌─────────┐ ┌─────────┐             │\n  │  │ Col A   │ │ Col B   │ Espace très  │\n  │  │ 4×STS   │ │ 4×STS   │ limité pour  │\n  │  │ 190mm   │ │ 190mm   │ l'électroniq.│\n  │  └─────────┘ └─────────┘             │\n    Emprise : 50mm × 70mm × 190 mm → Très juste\n```\n\n> ⚠️ La disposition en tandem est physiquement faisable, mais elle occupe **190 mm** de l'avant-bras en longueur (sur 220 mm totaux), laissant à peine **3 cm** pour le buck converter, le câblage bus série, et le contrôleur. C'est extrêmement contraint.\n\n> 💡 **Alternative réaliste** : Réduire à **6 STS3215** au lieu de 8 (en couplant mécaniquement les doigts 4 et 5). On tombe alors à ~143mm d'emprise en longueur, ce qui laisse 8 cm pour l'électronique. La perte fonctionnelle est acceptable.\n\n#### Points Forts / Faibles\n\n| Critère | Évaluation |\n| :--- | :--- |\n| ✅ **Couple brut** | 3× supérieur au XC330 (3 N.m vs 1 N.m) → prise de force immédiate |\n| ✅ **Prix** | ~25€/servo → 200€/main → **400€ pour les deux** — économie de 1 700€ |\n| ✅ **Disponibilité** | Stock constant (AliExpress, RobotShop, Seeed Studio) |\n| ✅ **Engrenages acier** | Plus robustes aux chocs que les bagues nylon |\n| ❌ **Poids** | 55g vs 23g → 440g de servos au lieu de 184g → +256g par main |\n| ❌ **Bruit** | 40–45 dB mesurés (vs ~35 dB XC330) — audible dans une pièce calme |\n| ❌ **Backdrivability** | Compliance réduite → risque de blesser les mains d'un humain si mal réglé |\n| ❌ **Encombrement** | **Trop grand** pour 8 servos en avant-bras standard. Oblige à passer à 6 DOF |\n| ❌ **Écosystème** | SDK Python correct mais moins bien intégré avec ROS 2 natif |\n\n---\n\n### Concrètement : Que représentent ces forces de grip dans la vie réelle ?\n\nIl est difficile de se représenter ce que signifient \"80 N\" ou \"150 N\" de force de grip. Voici un tableau de correspondance pratique :\n\n| Force de Grip | Équivalent Concret dans la Vie Réelle |\n| :---: | :--- |\n| **5 N** | Saisir délicatement un œuf sans le casser |\n| **10 N** | Tenir un stylo ou un téléphone portable |\n| **20 N** | Ouvrir un bouchon de bouteille d'eau dévissable |\n| **50 N** | Serrer fermement une poignée de porte (force d'un enfant de 8 ans) |\n| **80 N** | Tenir un outil visseuse/perceuse légère — **seuil fonctionnel quotidien** |\n| **100 N** | Soulever un pack de 6 bouteilles d'eau par la poignée en plastique |\n| **150 N** | Serrage ferme d'une clé à pipe / poignée de main vigoureuse — **seuil industriel** |\n| **200 N** | Écraser une canette en aluminium à vide à une main |\n| **300-400 N** | Force de grip moyenne d'un homme adulte (main dominante) |\n\n> **Synthèse** : Avec **80-100 N** (D-Hand Premium XC330), le robot peut effectuer les gestes de tous les jours (ouvrir des portes, tenir des objets, porter un verre). Avec **120-150 N** (D-Hand Standard STS3215), il entre dans le domaine de l'outillage léger. Aucune des deux solutions n'atteint la force de préhension humaine (~300 N), mais c'est largement suffisant pour un robot domestique / de recherche.\n\n---\n\n### Solution D : D-Hand Power+ (6× Dynamixel XC430-W240-T)\n*Quatrième option — La montée en gamme Dynamixel*\n\nLe Dynamixel **XC430-W240-T** est le « grand frère » direct du XC330. Il offre **presque le double du couple** (1.9 N.m vs 1.0 N.m) tout en restant dans l'écosystème Dynamixel à 100%.\n\n#### Fiche Technique XC430-W240-T\n\n| Paramètre | Valeur | vs XC330 |\n| :--- | :--- | :--- |\n| **Dimensions (L×l×H)** | **46.5 × 28.5 × 34 mm** | ~2× plus grand |\n| **Poids** | **65 g** | 2.8× plus lourd |\n| **Couple de blocage (12V)** | **1.9 N.m (19.4 kg.cm)** | **+90% de couple** |\n| **Vitesse à vide** | 70 RPM (identique @12V) | = |\n| **Résolution position** | 4096 pas / 0.088° | = |\n| **Réducteur** | 245:1 — engrenages **métal** | = |\n| **Backdrivability** | ✅ Mode courant → compliance totale | = |\n| **Protocole** | Dynamixel 2.0 TTL | **100% compatible** |\n| **Prix unitaire (EU)** | **~130 € (Génération Robots / MyBotShop)** | +20€ vs XC330 |\n\n#### Clarification : Quels DOF perd-on exactement en passant de 8 à 6 ?\n\nVoici le rôle de chacun des 8 DOF avec le classement par criticité :\n\n| # | Doigt | Mouvement | Besoin en Force | Criticité | Statut à 6 DOF |\n| :---: | :--- | :--- | :---: | :---: | :--- |\n| 1 | **Pouce** | Flexion (Curl) | 🔴 ÉLEVÉ | ⭐⭐⭐ | ✅ **Conservé** |\n| 2 | **Pouce** | Opposition (Abduction) | 🟡 MOYEN | ⭐⭐⭐ | ✅ **Conservé** |\n| 3 | **Index** | Flexion (Curl) | 🔴 ÉLEVÉ | ⭐⭐⭐ | ✅ **Conservé** |\n| 4 | **Index** | Abduction (Écartement) | 🟢 FAIBLE | ⭐ | ❌ **SUPPRIMÉ** |\n| 5 | **Majeur** | Flexion (Curl) | 🔴 ÉLEVÉ | ⭐⭐⭐ | ✅ **Conservé** |\n| 6 | **Annulaire** | Flexion | 🟡 MOYEN | ⭐⭐ | ✅ **Conservé** (couplé à #7) |\n| 7 | **Auriculaire** | Flexion | 🟢 FAIBLE | ⭐ | ❌ **FUSIONNÉ** avec #6 |\n| 8 | **Paume** | Curl palmaire global | 🔴 ÉLEVÉ | ⭐⭐⭐ | ✅ **Conservé** |\n\n**Ce qu'on perd concrètement :**\n- **DOF #4 (Abduction index)** : L'index ne peut plus s'écarter latéralement. Impact : perte de la capacité à faire un signe \"pistolet\" ou à \"pointer\" indépendamment du majeur. En manipulation quotidienne, c'est rarement utilisé.\n- **DOF #7 (Auriculaire indépendant)** : L'auriculaire et l'annulaire bougent ensemble (un seul tendon les tire). Impact : impossible de lever l'auriculaire seul (adieu le geste \"distingué\" avec la tasse de thé !). En grip, l'impact est négligeable car ces 2 doigts travaillent presque toujours ensemble.\n\n> **Verdict** : Les 2 DOF perdus sont les 2 **moins utiles** fonctionnellement. Toutes les prises de force (cylindrique, sphérique, pincette) restent pleinement opérationnelles.\n\n---\n\n### 🏆 Solution E : D-Hand Hybrid (4× XC430 + 4× XC330) — LA Solution Optimale\n*Cinquième option — Le meilleur des deux mondes, 8 DOF complets*\n\nL'idée est **brillante** : affecter les gros moteurs XC430 aux 4 canaux de **force** (ceux qui tirent fort sur les tendons) et les petits XC330 aux 4 canaux de **précision** (ceux qui dosent finement).\n\n#### Affectation Hybride Détaillée\n\n| # | Doigt | Mouvement | Besoin Force | Servo Affecté | Pourquoi |\n| :---: | :--- | :--- | :---: | :--- | :--- |\n| 1 | **Pouce** | Flexion (Curl) | 🔴 ÉLEVÉ | **XC430** (1.9 N.m) | Prise de force maximale |\n| 2 | **Pouce** | Opposition | 🟡 MOYEN | **XC330** (1.0 N.m) | Dosage fin de l'opposition |\n| 3 | **Index** | Flexion (Curl) | 🔴 ÉLEVÉ | **XC430** (1.9 N.m) | Pince pouce-index puissante |\n| 4 | **Index** | Abduction | 🟢 FAIBLE | **XC330** (1.0 N.m) | Mouvement de précision |\n| 5 | **Majeur** | Flexion (Curl) | 🔴 ÉLEVÉ | **XC430** (1.9 N.m) | Les 3 doigts de force |\n| 6 | **Annulaire** | Flexion | 🟡 MOYEN | **XC330** (1.0 N.m) | Complément de grip |\n| 7 | **Auriculaire** | Flexion | 🟢 FAIBLE | **XC330** (1.0 N.m) | Indépendant ! |\n| 8 | **Paume** | Curl global | 🔴 ÉLEVÉ | **XC430** (1.9 N.m) | Prise de force ultime |\n\n#### Résultat : Chiffres Clés\n\n| Métrique | Valeur |\n| :--- | :--- |\n| **DOF** | **8 (TOUS conservés !)** |\n| **Force grip (3 doigts principaux + paume)** | **~160-190 N** (XC430 sur les canaux de force) |\n| **Dextérité fine** | **Totale** (XC330 sur les canaux de précision) |\n| **Poids servos** | 4×65g + 4×23g = **352 g** |\n| **Coût servos / main** | 4×130€ + 4×110€ = **960 €** |\n| **Coût total 2 mains** | **~1 920 €** |\n| **Avec eFlesh (+150€/main)** | **~1 110 €/main → 2 220 € les deux** |\n\n#### Implantation dans l'Avant-Bras — Ça passe ?\n\nLa magie du mix : les 4 \"petits\" XC330 compensent les 4 \"gros\" XC430 en occupant beaucoup moins de place :\n\n```\nVUE LONGITUDINALE — HYBRIDE 4×XC430 + 4×XC330\n\n  COUDE (RS-06)                                    POIGNET (RS-00)\n  ←──────────────────── 22 cm ──────────────────────→\n  │                                                  │\n  │ ┌────────────────┐  ┌──────────┐                │\n  │ │  4× XC430      │  │ 4× XC330 │  Espace libre │\n  │ │  (2×2 empilés)  │  │ (2×2)    │  ~7.5 cm pour │\n  │ │  93mm long      │  │ 52mm     │  buck, U2D2,  │\n  │ │  57mm × 68mm    │  │ 40×52mm  │  câblage      │\n  │ └────────────────┘  └──────────┘                │\n  │ ← 93mm →  ← 52mm →  ← 75mm →                   │\n```\n\n> ✅ **Total longitudinal : 93 + 52 = 145 mm** sur 220 mm disponibles → il reste **75 mm** pour l'électronique (buck 48V→12V, U2D2, câblage). **C'est très confortable !**\n\n> ✅ **En coupe transversale** : Section max = 68 mm × 57 mm (zone des XC430) → rentre dans un avant-bras de Ø80 mm.\n\n#### Pourquoi cette solution est optimale\n\n| Critère | D-Hand Hybrid vs D-Hand Power+ (6 DOF) | vs D-Hand Premium (8× XC330) |\n| :--- | :--- | :--- |\n| **DOF** | +2 DOF récupérés (8 au lieu de 6) | = (8) |\n| **Force grip** | = (même XC430 sur les canaux de force) | **+90%** (presque double) |\n| **Dextérité** | **Supérieure** (Index Abduction + Auriculaire indépendant) | = |\n| **Poids** | +/-  (352g vs 390g) — plus léger ! | + (352g vs 184g) |\n| **Coût / main** | +180€ (960€ vs 780€) | -70€ (960€ vs 1 030€) |\n| **Écosystème** | = (Dynamixel 2.0, même bus TTL) | = |\n\n> 🏆 **Verdict** : La Solution E (Hybrid) est **LA recommandation finale**. Elle combine la force brute des XC430 là où ça compte (pouce, index, majeur, paume = les 4 canaux de puissance), la finesse des XC330 là où c'est nécessaire (abduction, auriculaire = les 4 canaux de précision), le tout pour un coût quasi identique à la Solution A d'origine, mais avec **presque le double de grip** !\n\n### Solution C : D-Hand Ultra-Budget (8× Dynamixel XL330-M288-T)\n*Troisième option — Le meilleur des deux mondes ?*\n\nLe Dynamixel **XL330-M288-T** est le \"petit frère\" du XC330. Il partage son facteur de forme identique mais fonctionne à 5V au lieu de 12V, ce qui réduit à la fois le couple et le prix.\n\n#### Fiche Technique XL330-M288-T\n\n| Paramètre | Valeur |\n| :--- | :--- |\n| **Dimensions (L×l×H)** | **34 × 20 × 26 mm** (identique au XC330 !) |\n| **Poids** | **18 g** (5g de moins que le XC330) |\n| **Couple de blocage (5V)** | 0.52 N.m (5.3 kg.cm) |\n| **Vitesse à vide** | 104 RPM (plus rapide que le XC330) |\n| **Résolution position** | 4096 pas / 0.088° |\n| **Encodeur** | Magnétique absolu 12 bits |\n| **Réducteur** | 288:1 — engrenages **plastique renforcé** |\n| **Backdrivability** | ✅ Mode courant → compliance totale |\n| **Protocole** | Dynamixel 2.0 TTL (100% compatible XC330) |\n| **Compatible SDK/ROS** | ✅ Même SDK/ROS 2 que le XC330 |\n| **Tension** | 3.7 – 6V (recommandé 5V — alimentable par USB !) |\n| **Bruit fonctionnement** | **~30–35 dB** (moteur coreless, très discret) |\n| **Prix unitaire (EU)** | **~40 € (ROBOTIS-EU)** |\n| **Prix 8× / main** | **~320 €** |\n| **Prix total 2 mains** | **~640 €** |\n\n#### Points Forts / Faibles\n\n| Critère | Évaluation |\n| :--- | :--- |\n| ✅ **Prix intermédiaire** | 40€/servo → 320€/main → 640€ pour les deux (3× moins cher que XC330) |\n| ✅ **Compatible 100%** | Même taille, même SDK, même ROS 2, même URDF que le XC330 |\n| ✅ **Le plus léger** | 18g/servo → 144g de servos par main. Record absolu. |\n| ✅ **Ultra-silencieux** | Le plus discret des 3 (~30 dB) |\n| ✅ **Alimentation 5V** | Pas besoin de buck 48V→12V — alimentable via USB-C directement ! |\n| ❌ **Couple faible** | Seulement 0.52 N.m (moitié du XC330) → grip estimé ~40-60 N max |\n| ❌ **Engrenages plastique** | Moins durables aux chocs que les engrenages métal du XC330 |\n| ❌ **Grip insuffisant** | En dessous du seuil fonctionnel (80 N) pour des tâches quotidiennes |\n\n> **Verdict** : Le XL330 produit un grip estimé à seulement **~40-60 N**, ce qui suffit pour les gestes délicats (laboratoire, recherche, démonstration), mais est en dessous du seuil recommandé de 80 N pour manipuler robustement des outils et objets du quotidien. Il peut être un excellent choix pour un prototype de test d'IA (entraîner les algorithmes de manipulation), avant d'upgrader les servos vers les XC330 (remplacement sans aucune modification mécanique !).\n\n---\n\n### Benchmark Mondial : D-Hand vs Mains Robotiques Haute Gamme\n\n| Main Robotique | DOF | Grip (N) | Poids Main | Actionneurs | Coût / main | Tactile | Remarques |\n| :--- | :---: | :---: | :---: | :--- | :---: | :---: | :--- |\n| **Main Humaine** | 27 | 300-400 | ~400g | Muscles | — | ✅ | Référence absolue |\n| **Tesla Optimus Gen3** | **22** | ~150-200* | ~350g* | Moteurs custom, tendons | Secret | ✅ | 22 DOF. Attrape un œuf sans le casser |\n| **Shadow Dexterous Hand** | **24** | ~200+ | ~4 kg | Pneumatique/Électrique | **~100 000 €** | ✅ | Le Graal de la recherche |\n| **Allegro Hand V5+** | 16 | ~50-80 | ~1.1 kg | 16× Moteurs DC | ~16 000 € | ✅ | 360° tactile omnidirectionnel |\n| **LEAP Hand V2 (CMU)** | 17 | ~80+ | ~400g | 17× Dynamixel XC330 | ~2 000 € | ❌ | Open-source, surpasse l'humain en test |\n| **D-Hand Hybrid (XC430+XC330)** | **8** | **~160-190** | **~400g** | 4× XC430 + 4× XC330 | **~1 110 €** | ✅ eFlesh | **🏆 RECOMMANDÉ ! 8 DOF + force Optimus** |\n| **D-Hand Power+ (XC430)** | **6** | **~160-190** | **~450g** | 6× XC430 | **~930 €** | ✅ eFlesh | Alt. plus simple si 6 DOF suffit |\n| **D-Hand Premium (XC330)** | **8** | **~80-100** | **~250g** | 8× XC330 | **~1 030 €** | ❌ | Standard IA, léger, compliance totale |\n| **D-Hand Ultra-Budget (XL330)** | **8** | **~40-60** | **~200g** | 8× XL330 | **~420 €** | ❌ | Prototype IA, upgrade drop-in XC330 |\n| **D-Hand Standard (STS3215)** | **6** | **~120-150** | **~400g** | 6× STS3215 | **~300 €** | ❌ | Le moins cher, SDK basique |\n| K-Bot Gripper | 1 | ~50 | ~100g | 1× STS3215 | ~30 € | ❌ | Pince basique |\n\n*Note : Les valeurs Tesla sont des estimations basées sur les démonstrations publiques (AI Day 2024).*\n\n> **Conclusion** : La D-Hand Hybrid (XC430+XC330 + eFlesh) est le nouveau point d'inflexion : **8 DOF complets + ~175 N de grip effectif** pour ~1 110€/main. C'est la seule main open-source qui rivalise avec le Tesla Optimus en force ET en dextérité !\n\n---\n\n### Comparatif Final Côte à Côte (5 Solutions)\n\n| Critère | 🏆 D-Hand Hybrid | D-Hand Power+ | D-Hand Premium | D-Hand Standard | D-Hand Ultra-Budget |\n| :--- | :---: | :---: | :---: | :---: | :---: |\n| **Servos** | 4×XC430 + 4×XC330 | 6× XC430 | 8× XC330 | 6× STS3215 | 8× XL330 |\n| **Coût 2 mains (+eFlesh)** | **~2 220 €** | ~1 860 € | ~2 060 € | **~650 €** 🟢 | ~940 € |\n| **DOF** | **8** 🟢 | 6 | **8** 🟢 | 6 | **8** 🟢 |\n| **Grip effectif (avec T2)** | **~175 N** 🟢🟢 | **~175 N** 🟢🟢 | ~90 N | ~140 N | ~55 N |\n| **Poids servos/main** | 352 g | 390 g | **184 g** 🟢 | 330 g | **144 g** 🟢 |\n| **Backdrivability** | ✅ Totale | ✅ Totale | ✅ Totale | ⚠️ | ✅ Totale |\n| **Écosystème** | **Dynamixel** 🟢 | **Dynamixel** 🟢 | **Dynamixel** 🟢 | SCSerial 🟡 | **Dynamixel** 🟢 |\n\n---\n\n### Recommandations Stratégiques\n\n> 🏆 **Choix recommandé : Solution E (Hybrid XC430+XC330 + eFlesh)** :\n> - **8 DOF complets** — aucun sacrifice de dextérité.\n> - **~175 N de grip effectif** — niveau Tesla Optimus, surpasse la LEAP Hand.\n> - **~1 110 €/main** — moins cher qu'un achat 8× XC330 seul, mais bien plus puissant.\n> - Écosystème Dynamixel 2.0 complet (SDK, ROS 2, Isaac Gym).\n> - Compliance totale (sécurité humain-robot).\n\n> **Alternative budget : Solution B (STS3215)** si le budget est la priorité absolue (~300€/main).\n\n> **Alternative IA pure : Solution C (XL330)** pour commencer l'entraînement Isaac Gym à moindre coût, avec upgrade drop-in vers XC330 ou Hybrid.\n\n---\n*Étude réalisée en Février/Mars 2026. Prix basés sur ROBOTIS-EU, RobotShop et distributeurs AliExpress.*\n\n---\n\n## 8. Le Toucher Robotique : Capteurs Tactiles pour la D-Hand\n\n### 8.1 Pourquoi le tactile change tout ?\n\nSans capteurs tactiles, un robot manipule « en aveugle » : il sait où sont ses doigts (grâce aux encodeurs moteur), mais il **ne sait pas ce qu'il touche**, ni avec quelle force.\n\nImaginez fermer les yeux et enfiler des gants de boxe : vous pouvez encore saisir une bouteille, mais impossible de manipuler une clé, de sentir si l'objet glisse, ou de doser la force pour ne pas écraser un œuf. Voilà la réalité d'un robot sans toucher.\n\n#### Ce que les capteurs tactiles apportent concrètement :\n\n| Capacité | Sans Tactile | Avec Tactile |\n| :--- | :--- | :--- |\n| **Détection de contact** | ❌ Le robot ne sait pas quand il touche l'objet | ✅ Détecte le contact au milligramme près |\n| **Dosage de la force** | ⚠️ Force préprogrammée (risque d'écraser / de lâcher) | ✅ Ajuste la pression en temps réel |\n| **Détection de glissement** | ❌ L'objet tombe sans prévenir | ✅ Détecte le micro-glissement → resserre |\n| **Reconnaissance d'objet** | ❌ Uniquement par la caméra | ✅ Identifie forme, texture, rigidité au toucher |\n| **Sécurité humaine** | ⚠️ Peut blesser en serrant trop fort | ✅ Relâche immédiatement si contact humain |\n| **Apprentissage (RL/IA)** | 🟡 Policies visuelles uniquement | 🟢 **Policies visuo-tactiles** (état de l'art 2024-2025) |\n\n> **En RL (Isaac Gym)** : Les publications les plus récentes (2024-2025) montrent que l'ajout de données tactiles dans les observations de l'agent **divise par 2 à 5 le temps d'entraînement** pour les tâches de manipulation et **améliore dramatiquement le taux de réussite du sim-to-real**. Les policies purement visuelles échouent presque systématiquement sur les tâches de manipulation fine (visser, insérer, tourner une clé).\n\n---\n\n### 8.2 Comparatif des Technologies Tactiles\n\n| Technologie | Principe | Sensibilité | Axes | Épaisseur | Prix / capteur | Complexité |\n| :--- | :--- | :---: | :---: | :---: | :---: | :---: |\n| **FSR (Force Sensing Resistor)** | Résistance variable sous pression | ±5% (qualitatif) | 1 axe (normal) | 0.3 mm | **~2-5 €** | 🟢 Très simple |\n| **Capacitif (DIY TPU)** | Capacité entre 2 plaques | ±10% | 1 axe | 2-5 mm | **~5-15 €** | 🟢 Simple (3D print) |\n| **Piézoélectrique (PVDF)** | Charge électrique sous déformation | Très élevée | 1 axe (dynamique) | 0.1 mm | ~10-20 € | 🟡 Moyen |\n| **Magnétique (eFlesh)** | Hall sensor + aimant sous élastomère | Bonne | **3 axes** | 5-8 mm | ~15-30 € | 🟡 Moyen (open-source) |\n| **Xela uSkin** | Magnétique 3 axes industriel | **0.1 gf** | **3 axes** | 4-6.6 mm | **~200-500 €*** | 🔴 Pro (SDK dédié) |\n| **SynTouch BioTac** | Multi-modal (pression, vibration, T°) | Extrême | Multi | 25 mm | **~5 000 €** | 🔴 Recherche pure |\n\n*Prix Xela estimé (non public, sur devis).*\n\n---\n\n### 8.3 Propositions d'Intégration pour la D-Hand\n\n#### Option T1 : FSR DIY (~50€ / main) — « Le Minimum Vital »\n\nLa solution la plus accessible : coller de petits capteurs FSR (type Interlink 402 ou Adafruit FSR) sur les bouts de doigts et la paume.\n\n| Composant | Qté | Prix |\n| :--- | :---: | :---: |\n| FSR Interlink 402 (Ø12.7mm) | 5 (bout de chaque doigt) | 25 € |\n| FSR longue bande (paume) | 2 | 10 € |\n| Multiplexeur analogique CD4051 | 1 | 2 € |\n| ADC 12-bit (ADS1015 ou intégré Jetson) | 1 | 5 € |\n| Câblage, film adhésif, gaine | lot | 8 € |\n| **Total / main** | | **~50 €** |\n\n```\nImplantation FSR sur la D-Hand :\n\n        ┌──── FSR Ø12mm ─────┐\n        │  [Pouce]  [Index]   │\n        │  [Majeur] [Annu.]   │\n        │  [Auric.]           │\n        │                     │\n        │  ══FSR Bande══      │  ← Paume (zone de puissance)\n        │  ══FSR Bande══      │\n        └─────────────────────┘\n```\n\n**Avantages** :\n- Intégration instantanée (coller + souder).\n- Compatible avec n'importe quelle version de D-Hand (XC330, STS3215, XL330).\n- Suffisant pour la détection de contact et le dosage basique de force.\n\n**Inconvénients** :\n- 1 seul axe (pression normale uniquement) → pas de détection de glissement.\n- Précision qualitative (~±20%) → pas de mesure absolue de force.\n- Pas de retour de texture ou de cisaillement.\n\n---\n\n#### Option T2 : Magnétique eFlesh 3-axes (~150€ / main) — « Le Sweet Spot Open-Source »\n\nLe projet **eFlesh** (publié 2024, open-source) propose des capteurs 3-axes imprimables en 3D. Un petit aimant est noyé dans un coussin d'élastomère, et un magnétomètre (type MLX90393) en dessous mesure le champ magnétique en X, Y, Z. Quand on appuie sur le coussin, l'aimant se déplace et le champ change.\n\n| Composant | Qté | Prix |\n| :--- | :---: | :---: |\n| Magnétomètre MLX90393 (breakout) | 5 (doigts) + 4 (paume) = 9 | 90 € |\n| Aimants néodyme Ø3×1mm | 9 | 5 € |\n| Élastomère silicone (Ecoflex 00-30) | 1 kit | 25 € |\n| Moules (imprimés 3D, PA12-CF) | 1 lot | 15 € |\n| Multiplexeur I²C TCA9548A | 1 | 5 € |\n| Câblage FPC + connecteurs | lot | 10 € |\n| **Total / main** | | **~150 €** |\n\n**Avantages** :\n- **3 axes** → détecte la pression ET le cisaillement (glissement).\n- Open-source, reproductible, réparable (moules imprimés 3D).\n- Résolution ~0.5 gf par axe → largement suffisant pour le grip adaptatif.\n- Forme personnalisable (bouts de doigts arrondis, paume plate).\n\n**Inconvénients** :\n- Épaisseur ~6 mm sur chaque bout de doigt (augmente légèrement le volume).\n- Calibration manuelle nécessaire pour chaque capteur.\n- Le silicone (Ecoflex) doit
