être moulé avec soin (bulles d'air = erreurs).\n\n---\n\n#### Option T3 : Xela uSkin Professionnel (~1 500-3 000€ / main estimé) — « Le Niveau Tesla »\n\nLes capteurs **Xela uSkin** sont les capteurs tactiles utilisés par les laboratoires de pointe et certains robots commerciaux. Ils offrent une sensibilité de 0.1 gf (un dixième de gramme !) sur 3 axes.\n\n| Configuration recommandée | Qté |\n| :--- | :---: |\n| uSkin Curved (uSCu) pour bouts de doigts | 5 (12 taxels chacun) |\n| uSkin Patch (uSPa) 4×4 pour paume | 2 (16 taxels chacun) |\n| Interface USB / I²C + câblage | 1 lot |\n| Logiciel uAi (calibration + visualisation) | Inclus |\n| **Total estimé / main** | **~1 500-3 000 €** |\n\n**Avantages** :\n- Sensibilité industrielle (0.1 gf, 3 axes).\n- Détection de texture, glissement, contact multi-points.\n- SDK professionnel, compatible ROS 2.\n- Épaisseur 4-6 mm (compact).\n\n**Inconvénients** :\n- Prix très élevé (sur devis uniquement, estimé 1 500-3 000€/main).\n- Dépendance fournisseur unique (Xela Robotics, Japon).\n- Surdimensionné pour un prototype V1.\n\n---\n\n### 8.4 Comparatif des Options Tactiles\n\n| Critère | T1 : FSR DIY | T2 : eFlesh 3-axes | T3 : Xela uSkin |\n| :--- | :---: | :---: | :---: |\n| **Coût / main** | **~50 €** 🟢 | ~150 € 🟡 | ~2 000 € 🔴 |\n| **Axes** | 1 (normal) | **3 (normal + cisaillement)** | **3 (normal + cisaillement)** |\n| **Détection contact** | ✅ | ✅ | ✅ |\n| **Détection glissement** | ❌ | ✅ | ✅ |\n| **Sensibilité** | ~5 g | ~0.5 g | **0.1 g** |\n| **Reconnaissance texture** | ❌ | ⚠️ Partielle | ✅ |\n| **Épaisseur** | 0.3 mm 🟢 | 6 mm | 4-6 mm |\n| **Reproductibilité DIY** | ✅ Triviale | ✅ Open-source | ❌ Commercial |\n| **Isaac Gym / RL** | 🟡 Basique | 🟢 Complet | 🟢 Optimal |\n| **Risque projet** | 🟢 Nul | 🟢 Faible | 🟡 Moyen (délai, coût) |\n\n---\n\n### 8.5 Recommandation Tactile\n\n> 🟢 **Pour le D-Bot V1 : Intégrer l'Option T2 (eFlesh 3-axes) directement** (~150€/main).\n> L'écart de prix avec les FSR n'est que de +100€/main (+200€ pour les 2 mains). Pour ce surcoût marginal, on gagne la détection de **glissement** (3 axes), une bien meilleure sensibilité (0.5 gf vs 5 gf), et la compatibilité complète avec les algorithmes RL visuo-tactiles. Les moules sont imprimables sur la Qidi Plus 4 en PA12-CF, et le silicone Ecoflex 00-30 est disponible chez Amazon/AliExpress. **Ce choix est un no-brainer.**\n\n> 🟡 **L'Option T1 (FSR) reste un plan de secours** si le moulage Ecoflex pose problème. On colle les FSR en 5 minutes et on obtient déjà la détection de contact.\n\n> 🔴 **L'Option T3 (Xela uSkin)** est réservée à un objectif recherche financé ou un partenariat industriel.\n\n---\n\n### 8.6 Impact du Tactile sur la Force Effective de Grip\n\nC'est un point fondamental : le capteur tactile **ne change pas la force brute du moteur**, mais il **multiplie la force UTILE** de manière spectaculaire.\n\n#### Le problème sans tactile : la \"marge de sécurité aveugle\"\n\nSans retour de force, le robot doit choisir entre deux stratégies perdantes :\n1. **Serrer fort \"au cas où\"** → Il gaspille ~40% de sa force en marge de sécurité, et risque quand même d'écraser un objet fragile.\n2. **Serrer faiblement \"par précaution\"** → L'objet glisse et tombe sans que le robot ne le sache.\n\n#### La solution tactile : le grip adaptatif en temps réel\n\nAvec un capteur 3-axes (eFlesh), le robot peut appliquer la stratégie humaine :\n```\nBOUCLE à 200 Hz :\n  1. Commencer avec une force minimale (10%)\n  2. LIRE capteurs tactiles (pression + cisaillement)\n  3. SI cisaillement > seuil → l'objet glisse ! → AUGMENTER force +5%\n  4. SI pression > max_objet → RÉDUIRE force (objet fragile)\n  5. Résultat : force OPTIMALE en permanence\n```\n\n#### Gain chiffré sur la force effective\n\n| Métrique | Sans Tactile | Avec Tactile T2 (eFlesh) |\n| :--- | :---: | :---: |\n| **Force brute moteur** | 100% | 100% (identique) |\n| **Marge de sécurité gaspillée** | ~40% | ~5% |\n| **Force utile effective** | **~60%** du couple | **~95%** du couple |\n| **Risque de casse objet fragile** | 🔴 Élevé | 🟢 Très faible |\n| **Risque de lâcher objet glissant** | 🔴 Élevé | 🟢 Très faible |\n\n#### Conséquence concrète sur nos 3 solutions de D-Hand\n\n| Solution | Couple brut | Force grip brute | Force grip **effective** (avec T2) |\n| :--- | :---: | :---: | :---: |\n| **D-Hand XL330 + eFlesh** | 0.52 N.m | ~40-60 N | **~55 N ✅** (suffisant pour démo/IA) |\n| **D-Hand XC330 + eFlesh** | 1.0 N.m | ~80-100 N | **~90 N ✅** (quotidien solide) |\n| **D-Hand STS3215 + eFlesh** | 3.0 N.m | ~120-150 N | **~140 N ✅** (industriel) |\n| D-Hand XC330 sans tactile | 1.0 N.m | ~80-100 N | **~55 N** (force gaspillée) |\n| D-Hand STS3215 sans tactile | 3.0 N.m | ~120-150 N | **~80 N** (force gaspillée) |\n\n> **Conclusion décisive** : Un **XC330 + eFlesh** à ~1 380€/main est **plus efficace en manipulation réelle** qu'un **STS3215 sans tactile** à ~300€/main ! Le STS3215 a 3× plus de couple brut, mais sans savoir quand il touche ni quand l'objet glisse, il gaspille sa puissance. Le XC330 avec capteurs dose parfaitement sa force limited et ne lâche jamais rien.\n>\n> Inversement, un **STS3215 + eFlesh** (à seulement ~450€/main) devient un véritable monstre de manipulation qui rivalise avec des mains à 16 000€ en termes de performance *effective*.\n\n### 8.7 Pourquoi eFlesh si les moteurs lisent déjà le courant ?\n\nÉtant donné que les moteurs Dynamixel XC peuvent lire leur propre consommation de courant (Proprioception) pour en déduire la force appliquée, est-il vraiment nécessaire d'ajouter des capteurs tactiles eFlesh (Exteroception) ? **Oui, c'est même indispensable pour la manipulation fine.**\n\n1. **La Friction et la \"Zone Morte\" (Deadband)** : La lecture du courant moteur mesure l'effort total à la source. Mais entre le moteur et la pulpe du doigt, il y a des engrenages (288:1), des poulies, et le frottement du tendon Dyneema dans sa gaine PTFE. Cette friction mécanique \"avale\" les micro-forces de contact. Le moteur ne \"sentira\" pas le contact ultra-léger avec une fraise ou un œuf fragile avant qu'il ne soit trop tard, car le signal d'effort est noyé dans le bruit de friction mécanique. L'eFlesh, placé à l'extrémité, sent le contact avant même que le tendon ne se tende complètement.\n2. **Détection du Glissement (Shear Forces)** : Le courant moteur indique uniquement une force de traction axiale (z). Il est **totalement aveugle** aux forces latérales. Si le robot tient une bouteille en plastique et que celle-ci commence à glisser vers le bas, le tendon ne bouge pas, la force de traction ne change pas, le moteur ne voit rien. L'eFlesh (3 axes) voit la déformation magnétique en Z (pression) mais surtout en X/Y (cisaillement). Il peut avertir la Jetson : *\"L'objet est en train de glisser vers le bas, serre plus fort !\"*, **avant même que l'objet ne tombe**.\n3. **Localisation du Contact** : Le retour moteur indique \"Je touche quelque chose\", mais l'eFlesh indique \"Je touche l'objet avec le bord supérieur gauche de mon index\". C'est crucial pour l'IA d'apprentissage par renforcement (Isaac Gym) afin d'ajuster la prise de manière stable.\n\n> **En résumé :** Le retour de courant des moteurs est le \"Muscles\" (Force Macro), l'eFlesh est la \"Peau\" (Toucher Micro). Pour ne pas casser un œuf et ne pas le laisser glisser non plus, la fusion des deux sens est obligatoire.\n\n---\n\n## 9. Comparatif Poussé : Mains Robotiques Open-Source à Câbles/Poulies (vs D-Hand)\n\nCette section présente une étude comparative approfondie des projets open-source les plus avancés partageant l'architecture à tendons/câbles et poulies de la D-Hand. L'objectif est de situer précisément le D-Hand Hybrid dans l'état de l'art mondial des mains robotiques DIY.\n\n---\n\n### 9.1 Les Projets de Référence\n\n#### 🔬 ORCA Hand (ETH Zurich / orcahand.com, 2023-2024)\n\nDéveloppée initialement par le groupe de recherche RSL de l'ETH Zurich, la main ORCA est désormais commercialisée en de multiples versions : **Base (17 DOF)**, **Touch (17 DOF)** et la nouvelle **Lite (9 DOF)**. C'est l'une des mains tendon-driven les plus complètes.\n\n| Paramètre | ORCA Base / Touch (17 DOF) | ORCA Lite (9 DOF) |\n| :--- | :--- | :--- |\n| **DOF** | **17** (16 doigts + 1 poignet) | **9** (8 doigts + 1 poignet, sous-actionné) |\n| **Type d'actionnement** | Tendons individuels | Tendons couplés (MCP+PIP couplés, DIP fixes) |\n| **Moteurs** | 17× Dynamixel (XC430 + XC330) | 9× Feetech (8× HL-3915 + 1× HL-3930) |\n| **Couple moteur (max)** | 1.9 N.m (XC430) / 1.0 N.m (XC330) | 0.92 N.m (HL-3915) / 1.9 N.m (HL-3930) |\n| **Force de grip mesurée** | **~103 N** (Power grasp) | *Non spécifiée (probablement ~50-60 N via Feetech)* |\n| **Poids total** | ~1.3 kg | ~0.7 kg |\n| **Capteurs tactiles** | FSR (Base) / 351 Taxels 3D (Touch) | ❌ Aucun capteur sur la version Lite |\n| **Open-source** | ✅ Complet (orcahand.com) | ✅ À venir (STLs et code BOM annoncés) |\n| **Prix Commercial** | **$3 500 (Base)** / **$6 100 (Touch)** | *En attente* (BOM \"très réduit\" attendu) |\n\n**Points forts de la gamme :** La référence académique devenue produit commercial de la version complète. La version *Touch* offre la meilleure intégration tactile 3D. La nouvelle version *Lite* tente de s'aligner sur des budgets réels d'amateurs avec l'abandon des Dynamixel au profit de Feetech.\n**Points faibles :** La version Lite perd l'indépendance des doigts (sous-actionnement), utilise des moteurs Feetech moins performants en compliance, et n'a aucun retour tactile. La version Touch est hors de prix ($6 100).\n\n---\n\n#### 🤖 RUKA Hand (NYU, Open-source, 2024)\n\nDéveloppée par des chercheurs de NYU (New York University), RUKA vise le meilleur compromis entre coût, accessibilité et performance fonctionnelle.\n\n| Paramètre | Détail |\n| :--- | :--- |\n| **DOF** | **15** (sous-actionnés, 5 doigts dont pouce 3 DOF) |\n| **Type d'actionnement** | Tendons tressés (câble pêche) dans gaines PTFE + poulies |\n| **Moteurs** | 3× Dynamixel **XM430-W210-T** (Pouce) + 8× **XL330-M288-T** (Doigts) |\n| **Nombre de servos** | **11 servos** (déportés dans l'avant-bras) |\n| **Couple max moteur** | 4.1 N.m (XM430) / 0.52 N.m (XL330) |\n| **Force de grip (Power grasp)** | **~60 N** (levée de >6 kg) |\n| **Force de pince (Pinch)** | ~2.74 N (pulpe-à-pulpe) — dosage fin |\n| **Force glissement (DIP/PIP)** | 33 N |\n| **Poids** | Compact (structure PLA+TPU) |\n| **Taille** | ~18 cm (taille adulte) |\n| **Capteurs tactiles** | ❌ Aucun capteur embarqué |\n| **Retour proprioceptif** | Via lecture de courant Dynamixel uniquement |\n| **Contrôle** | Apprentissage (calibration avec gant Motion Capture Manus VR) |\n| **Temps d'assemblage** | <7 heures |\n| **Open-source** | ✅ Complet : STLs, code, doc sur GitHub (NYU Robotics) |\n| **Coût matière** | **~$500 à $1 300** selon qualité des servos |\n| **SDK/ROS** | ✅ Dynamixel SDK + ROS 2 |\n| **Matériaux** | PLA (structure) + Filaflex Foamy TPU (coussins) + Dyneema/fil pêche + PTFE |\n\n**Points forts :** Excellent rapport coût/DOF, compatibilité Dynamixel totale, très bien documenté, taille humaine réelle.\n**Points faibles :** Pas de capteurs tactiles, faible force de pince pouce-index (2.74 N — délicat pour manipulation), dépend d'un système de calibration Motion Capture externe.\n\n---\n\n#### 🦾 BiDexHand V4 (Open-source, 2024)\n\nProjet communautaire avec architecture biomimétique avancée et 16 DOF complets câble-poulie.\n\n| Paramètre | Détail |\n| :--- | :--- |\n| **DOF** | **16** (biomimétique, articulations MCP/PIP/DIP + pouce opposable) |\n| **Type d'actionnement** | Câbles + poulies (N-configuration) |\n| **Moteurs** | **15× FeeTech SCS** (série bus) — 1 servo par joint actif |\n| **Couple moteur (max)** | ~3.0 N.m (STS3215-class) |\n| **Force mesurée à la pulpe** | **~21 N** (2.14 N par doigt × multiplication mécanique) |\n| **Charge maximale levée** | ~4.5 kg (≈ 45 N) |\n| **Capteurs tactiles** | ❌ Non intégrés dans la version V4 |\n| **Poids** | Compact (impression 3D) |\n| **Open-source** | ✅ Complet sur GitHub (BOM, STLs, ROS 2) |\n| **Coût matière estimé** | **~$300–500** (15× FeeTech SCS à ~15-20 $/servo + 3D print) |\n| **SDK/ROS** | ✅ ROS 2 + packages de contrôle inclus |\n| **Montage servos** | Déportés dans le \"Proximal Servo Sleeve\" (proche poignet) |\n\n**Points forts :** Le plus abordable pour 16 DOF, ROS 2 natif, architecture câble-poulie la plus proche de notre conception, excellente réduction d'inertie distale.\n**Points faibles :** Force par doigt mesurée modeste (2.14 N), pas de capteurs tactiles, servos FeeTech moins fiables sur long terme, pas de compliance logicielle native aussi poussée que Dynamixel.\n\n---\n\n#### 🔗 ILDA Hand (Linkage-Driven, Étude Harvard/MIT, 2022)\n\nProjet académique de référence, utilisé pour cadrer les performances des mains dextres. Architecture par bielles et non par câbles purs, mais cité pour sa comparaison de force.\n\n| Paramètre | Détail |\n| :--- | :--- |\n| **DOF** | **15** (20 joints, une bielle par joint) |\n| **Type d'actionnement** | Bielles mécaniques (linkage-driven) — pas de câbles |\n| **Force à la pulpe du doigt** | **34 N** (mesurée) |\n| **Poids** | 1.1 kg |\n| **Taille** | 218 mm max |\n| **Capteurs tactiles** | ✅ Intégrés (tactile sensing) |\n| **Open-source** | ⚠️ Partiel (publication ArXiv/papers uniquement, pas de STLs publics) |\n| **Coût** | Non disponible (composants usinés précision) |\n\n> Mentionnée uniquement pour référence de performance. **Non reproductible en DIY** en raison des tolérances d'usinage très fines.\n\n---\n\n### 9.2 Tableau Comparatif Global\n\n| Critère | 🏆 **D-Hand Hybrid** (Notre choix) | **ORCA Hand (Base/Touch)** | **ORCA Lite** (Nouveau) | **RUKA Hand** (NYU) | **BiDexHand V4** |\n| :--- | :---: | :---: | :---: | :---: | :---: |\n| **DOF** | **8** | 17 | 9 | 15 | 16 |\n| **Type actionnement** | Câbles + poulies Ø8mm alu | Câbles + poulies | Câbles (couplés) | Câbles fil pêche PTFE | Câbles + \n| **Main Humaine** (ref.) | **300-400 N** | — |\n\n> **Notre position :** La D-Hand Hybrid avec les XC430 sur les canaux de force a la force calculée la plus élevée de tous les projets DIY comparés, y compris l'ORCA Hand académique. **À valider par mesure sur prototype.**\n\n#### Force de Pince Pouce-Index (Pinch Grasp)\n\n| Main | Force de Pince | Correspondance Quotidienne |\n| :--- | :---: | :--- |\n| **ILDA Hand** | **34 N** ✅ | Tenir fermement une clé à l'appel |\n| **D-Hand Hybrid** (calc.) | **~50 N** ✅✅ | Pincer et soulever une pièce mécanique |\n| **BiDexHand V4** | **~21 N** ⚠️ | Pincer une feuille de papier |\n| **ORCA Hand** | **~30 N** (estimé) | Tenir une bille |\n| **RUKA Hand** | **2.74 N** ❌ | Pincer une feuille millimétrée |\n\n> La faiblesse critique de RUKA est sa pince (2.74 N mesurés) car les XL330 n'ont que 0.52 N.m de couple. C'est sa limitation majeure vs notre XC430+XC330.\n\n---\n\n### 9.4 Architecture Mécanique : Câbles et Poulies (Points de Différenciation)\n\nLe tableau ci-dessous compare les choix d'architecture pour le routage des tendons et des poulies :\n\n| Aspect | D-Hand Hybrid | ORCA Hand | RUKA Hand | BiDexHand V4 |\n| :--- | :--- | :--- | :--- | :--- |\n| **Matière tendon** | Dyneema Ø0.8mm (40 lbs) | Acier inox / Dyneema | Fil de pêche tressé | Dyneema/FeeTech câble |\n| **Gaine de guidage** | PTFE Ø1.5mm int. | PTFE tube custom | PTFE tube (Bowden style) | Gaines intégrées |\n| **Matière poulies** | **Alu 6061 Ø8mm (CNC C500)** | Imprimées PLA renforcé | Imprimées PLA | Imprimées PLA |\n| **Retour passif** | Ressorts torsion 0.05 N.m | Ressorts torsion intégrés | Ressorts enrobés dans la phalange | Ressorts impression TPU |\n| **Fixation tendon** | Nœud + cyanoacrylate | Serre-câble + manchon | Nœud + époxy | Nœud |\n| **Chemin de câble** | Traversée RS-00 (poignet creux) | Poignet propriétaire | Poignet tubulaire dédié | Proximal Sleeve tubulaire |\n\n**Avantage D-Hand** : les poulies en aluminium usiné CNC offrent une durabilité supérieure aux poulies imprimées (usure quasi nulle sur Dyneema vs PLA qui creuse à l'usage).\n\n---\n\n### 9.5 Verdict et Positionnement du D-Hand Hybrid\n\n| Critère | D-Hand Hybrid | ORCA | RUKA | BiDexHand |\n| :--- | :---: | :---: | :---: | :---: |\n| **Force brute** | 🥇 1er (~175N calc) | 🥈 2ème (103N mesuré) | 🥉 3ème (~60N) | 4ème (~45N) |\n| **Dextérité** | 🥉 3ème (8 DOF) | 🥇 1er (17 DOF) | 🥈 2ème (15 DOF) | 🥈 2ème (16 DOF) |\n| **Coût** | 🥉 3ème (~1 110€) | 4ème (~2 000€) | 🥇 1er (~650€) | 🥈 2ème (~400€) |\n| **Compliance** | 🥇 1er (Dynamixel mode courant) | 🥇 1er (= , Dynamixel) | 🥈 2ème | 🥉 3ème (FeeTech) |\n| **Poids** | 🥈 2ème (~400g) | 4ème (1 300g) | 🥇 1er (<300g) | 🥇 1er (<300g) |\n| **Tactile** | 🥇 1er (eFlesh 3 axes) | 🥉 3ème (FSR basic) | ❌ Absent | ❌ Absent |\n| **Maturité technique** | 🥇 Haut niveau | 🥇 Très haut | 🥈 Haut | 🥇 Haut |\n| **Difficulté build** | 🥈 Moyen | 🔴 Élevé | 🥇 Faible | 🥇 Faible |\n\n> [!TIP]\n> **Conclusion** : Le D-Hand Hybrid n'est pas le moins cher ni le plus dextère, mais il est le **seul projet** qui combine simultanément : force de grip estimée maximale **+ capteurs 3 axes + compliance active totale + intégration ROS 2 / Isaac Gym**. C'est le seul comparable au Tesla Optimus Gen3 en termes de force effective estimée dans le monde open-source.\n\n> [!NOTE]\n> **Ce qu'il manque vs l'ORCA** : 9 DOF supplémentaires (abductions des doigts, oppositions fines). Ces DOF supplémentaires permettent des prises en \"pincette à 3 doigts\" et des manipulations en rotation dans la paume (\"in-hand manipulation\"). Ce manque pourra être comblé en V2 si l'IA de manipulation dépasse les capacités de l'ORCA Hand en tests comparatifs grâce aux capteurs eFlesh.\n\n*Source des données : arxiv.org (ORCA 2024, RUKA 2024), GitHub BiDexHand V4, orcahand.com, humanoid.guide. Mars 2026.*\n\n---\n\n## 10. Étude de Mix : Utiliser l'ORCA Hand comme Base Mécanique pour la D-Hand\n\n### 10.1 Le Constat\n\nNotre plus grande faiblesse actuelle est le **manque de design mécanique concret pour les doigts** du D-Hand Hybrid. Nous avons la théorie (8 DOF, servos XC430+XC330, tendons Dyneema, poulies alu), mais pas encore les fichiers CAD des phalanges, de la paume ni du routage de câble.\n\nL'ORCA Hand, elle, dispose de **tout cela en open-source** :\n- **Fichiers STEP + STL** prêts à imprimer (disponibles sur orcahand.com/legacy/files)\n- **Guide d'assemblage en 31 étapes** avec photos détaillées\n- **BOM complète** sur GitHub (orcahand/orca_core)\n- **Modèles URDF/MJCF** pour la simulation (orcahand/orcahand_description)\n- **Environnement de simulation** Isaac Gym (orcahand/orca-gym)\n- **Système de téléopération** (orcahand/orca_retargeter)\n\nLa question est : **peut-on réutiliser les pièces mécaniques ORCA tout en gardant notre stratégie d'actionnement D-Hand ?**\n\n---\n\n### 10.2 Les 4 Scénarios de Mix Possibles\n\n#### Scénario A : « ORCA Fingers + D-Hand Actionneurs » (Recommandé ✅)\n\n**Concept** : Prendre les phalanges ORCA (imprimées PA12-CF) telles quelles, mais les relier à **nos 8 servos Dynamixel XC430/XC330** au lieu des 17 servos ORCA.\n\n| Composant | Source | Modification requise |\n| :--- | :--- | :--- |\n| **Phalanges (proximale, médiane, distale)** | ORCA v1 (fichiers STEP) | Aucune — canaux de tendon compatibles |\n| **Paume (palm)** | ORCA v1 (fichier STEP) | Adaptations mineures : réduire les 17 passages à 8 |\n| **Tendons** | D-Hand (Dyneema Ø0.8mm) | Compatible directement avec les canaux ORCA |\n| **Gaines PTFE** | D-Hand (Ø1.5mm int.) | Même approche que l'ORCA (tube Téflon) |\n| **Poulies** | D-Hand (Alu CNC Ø8mm) | Avantage : plus durables que les poulies imprimées ORCA |\n| **Servomoteurs** | D-Hand (4× XC430 + 4× XC330) | Montage dans l'avant-bras avec bride custom |\n| **Nœuds de tendon** | ORCA (Ashley Stopper Knot) | ✅ Adopter cette technique éprouvée |\n| **Retour passif (extension)** | ORCA (ressorts torsion) | Compatible directement |\n| **Capteurs tactiles** | D-Hand (eFlesh 3 axes) | Montage sur pulpe distale ORCA (à vérifier encombrement) |\n\n**Couplage des tendons (passage de 17 à 8 DOF) :**\n\n| Doigt | ORCA (3 servos indépendants) | D-Hand Mix (tendons couplés) |\n| :--- | :--- | :--- |\n| **Index** | MCP curl + PIP curl + Abduction | 1× XC430 (MCP+PIP couplés) + 1× XC330 (Abduction) |\n| **Majeur** | MCP curl + PIP curl + Abduction | 1× XC430 (MCP+PIP couplés) |\n| **Annulaire** | MCP curl + PIP curl + Abduction | Couplé avec Majeur sur même XC430 |\n| **Auriculaire** | MCP curl + PIP curl + Abduction | Couplé avec Annulaire |\n| **Pouce** | IP + MCP + Opposition | 1× XC430 (IP+MCP couplés) + 1× XC330 (Opposition) |\n| **Abd. Index/Aur.** | 2× servos indépendants | 1× XC330 (partagé) |\n\n**Avantages :**\n- ✅ **Gain de temps énorme** : pas besoin de dessiner les phalanges from scratch\n- ✅ **Design validé** : >10 000 cycles prouvés sur les doigts ORCA\n- ✅ **Mêmes matériaux** : PA12-CF + Dyneema + PTFE = identique à notre baseline\n- ✅ **Ashley Stopper Knot** : technique de fixation tendon bien documentée, meilleure que notre colle cyano\n- ✅ **Simulation prête** : URDF/MJCF directement disponible pour Isaac Gym\n- ✅ **Force supérieure** : les XC430 (1.9 Nm) délivrent 2× plus de couple que les HL-3915 de l'ORCA Lite\n\n**Risques :**\n- ⚠️ Adapter la paume ORCA (17 chemins → 8) nécessite une retouche CAD\n- ⚠️ Vérifier l'encombrement des capteurs eFlesh dans la pulpe distale ORCA\n\n**Coût estimé :**\n\n| Poste | Prix |\n| :--- | ---: |\n| 4× XC430-T240BB-T | 560 € |\n| 4× XC330-T228T | 280 € |\n| Filament PA12-CF (phalanges) | ~30 € |\n| Dyneema + PTFE + ressorts | ~25 € |\n| Poulies alu CNC (8×) | ~40 € |\n| eFlesh 3 axes (5 doigts) | ~175 € |\n| **Total** | **~1 110 €** |\n\n---\n\n#### Scénario B : « Full ORCA Lite Replica + eFlesh » (Budget)\n\n**Concept** : Reproduire l'ORCA Lite telle quelle (9 DOF, servos Feetech), mais ajouter nos capteurs eFlesh 3 axes.\n\n| Composant | Source |\n| :--- | :--- |\n| Phalanges + Paume | ORCA Lite (STLs à venir) |\n| Servomoteurs | 9× Feetech HL-3915/HL-3930 |\n| Capteurs | eFlesh 3 axes (ajout custom) |\n\n| Avantage | Inconvénient |\n| :--- | :--- |\n| ✅ Coût minimal (<900 $ + eFlesh) | ❌ Perte totale de compliance active |\n| ✅ Assemblage très simple | ❌ Couple faible (0.92 Nm vs 1.9 Nm) |\n| ✅ Open-source complet bientôt | ❌ Aucune lecture de courant fine sur Feetech |\n\n**Verdict** : ❌ Ne convient PAS pour le D-Bot. La perte de compliance active Dynamixel est rédhibitoire pour la manipulation RL.\n\n---\n\n#### Scénario C : « Full ORCA Base Replica » (Haut de Gamme)\n\n**Concept** : Reproduire l'ORCA Base complète (17 DOF) avec ses 17 servos Dynamixel.\n\n| Avantage | Inconvénient |\n| :--- | :--- |\n| ✅ 17 DOF = dextérité maximale | ❌ Coût x2 (~2 000 € en composants) |\n| ✅ Design 100% validé | ❌ 17 servos = 17× plus de câblage |\n| ✅ Simulation Isaac Gym native | ❌ Poids élevé (1.3 kg) |\n| | ❌ Complexité d'assemblage élevée |\n\n**Verdict** : ⚠️ Option V2 viable si la V1 montre que 8 DOF sont insuffisants pour la manipulation cible.\n\n---\n\n#### Scénario D : « ORCA Fingers + Paume D-Hand Custom » (Avancé)\n\n**Concept** : Prendre les phalanges ORCA, mais reconcevoir entièrement la paume en aluminium CNC (C500) pour un montage plus rigide et une intégration parfaite avec le poignet RS-00 du D-Bot.\n\n| Avantage | Inconvénient |\n| :--- | :--- |\n| ✅ Intégration parfaite avec le chassis D-Bot | ❌ Nécessite un design CNC de paume complet |\n| ✅ Rigidité supérieure (alu vs PA12-CF) | ❌ Coût CNC additionnel |\n| ✅ Poulies alu intégrées dans la paume | ❌ Temps de développement plus long |\n\n**Verdict** : 🟡 Réservé à la V2. La paume imprimée (Scénario A) suffira pour la V1.\n\n---\n\n### 10.3 Ressources ORCA Disponibles sur GitHub\n\nL'écosystème ORCA est remarquablement complet (12 repos, mis à jour en Mars 2026) :\n\n| Repo GitHub | Contenu | Utilité pour D-Hand |\n| :--- | :--- | :--- |\n| `orcahand/orca_core` | Contrôleur Python (354 ⭐) | ✅ Base du driver servo, à adapter pour nos 8 DOF |\n| `orcahand/orcahand_description` | URDF + MJCF (246 ⭐) | ✅✅ Essentiel pour Isaac Gym simulation |\n| `orcahand/orca_sim` | Environnement de simulation | ✅ Benchmark comparatif |\n| `orcahand/orca-gym` | Isaac Gym (forked from K-Scale) | ✅✅ Template RL direct pour manipulation |\n| `orcahand/orca_retargeter` | Téléopération (gant → main) | ✅ Pour la collecte de données humaines |\n| `orcahand/rwr_system` | Dataset et inférence | 🟡 Avancé, V2 |\n| **Site orcahand.com** | Fichiers STEP/STL + BOM + Guide 31 étapes | ✅✅✅ La base mécanique de notre V1 |\n\n---\n\n### 10.4 Recommandation Finale : Scénario A\n\n> [!IMPORTANT]\n> **Le Scénario A « ORCA Fingers + D-Hand Actionneurs »** est le chemin optimal pour la V1 du D-Hand Hybrid.\n\n**Pourquoi :**\n\n1. **Gain de temps** : au lieu de 2-3 mois de conception CAD des phalanges, on peut les imprimer en 24h depuis les fichiers STEP existants.\n2. **Fiabilité prouvée** : les doigts ORCA ont résisté à 10 000+ cycles continus, c'est le meilleur test de fatigue disponible en open-source.\n3. **Force supérieure** : nos XC430 (1.9 Nm) offrent **2× le couple** des Feetech HL-3915 de l'ORCA Lite (0.92 Nm), donc nous surpassons la force de l'ORCA Lite avec le même nombre de DOF.\n4. **Tactile unique** : aucune version ORCA (hors Touch à $6 100) n'offre les capteurs eFlesh 3 axes que nous intégrons pour ~175 €.\n5. **Simulation native** : on hérite directement de l'environnement Isaac Gym (`orca-gym`) et des modèles URDF/MJCF (`orcahand_description`).\n6. **Couplage câbles Ashley Stopper** : la technique de nœud ORCA est supérieure à notre approche initiale (colle cyano), car elle permet un démontage non destructif et un re-tensionnement facile.\n\n**Plan d'action concret :**\n\n| Étape | Action | Durée estimée |\n| :---: | :--- | :---: |\n| 1 | Télécharger les fichiers STEP v1 depuis orcahand.com/legacy/files | 10 min |\n| 2 | Imprimer les phalanges en PA12-CF sur le Qidi Plus 4 | ~8h |\n| 3 | Modifier la paume ORCA dans Fusion 360 (17 → 8 passages) | ~4h |\n| 4 | Usiner 8 poulies Ø8mm en alu 6061 sur la CNC C500 | ~2h |\n| 5 | Assembler avec la technique Ashley Stopper (guide 31 étapes ORCA) | ~6h |\n| 6 | Intégrer les capteurs eFlesh dans les pulpes distales | ~3h |\n| 7 | Connecter les 8 servos via Dynamixel Bus + orca_core adapté | ~2h |\n| 8 | Tester dans Isaac Gym avec l'URDF ORCA modifié | ~4h |\n| **Total** | | **~30h** |\n\n> [!TIP]\n> **Versus from-scratch** : concevoir les phalanges à zero nécessiterait environ 2-3 mois de travail CAD + tests itératifs. Le Scénario A réduit ce délai à **~30 heures** de travail effectif (1 semaine à temps partiel).\n\n---\n\n## 11. Stratégie de Fabrication Hybride (Impression 3D vs Usinage CNC)\n\nL’hybridation ne concerne pas seulement le design (ORCA) et l’actionnement (D-Hand/Dynamixel), elle s'applique aussi aux méthodes de fabrication. Le D-Bot dispose d’un écosystème de production in-house très performant : une imprimante **Qidi Plus 4** (enceinte chauffée 65°C) et une fraiseuse CNC **NestWorks C500**. \n\nVoici l'analyse d'ingénierie dictant comment chaque pièce du \"Scénario A\" doit être fabriquée pour garantir une robustesse de niveau industriel.\n\n### 11.1 Ce qui doit être IMPRIMÉ en 3D (Qidi Plus 4)\n\nL'impression 3D est irremplaçable pour la création de pièces aux géométries internes complexes ou devant absorber des micro-chocs.\n\n#### 🦴 Les Phalanges (Doigts) : PA12-CF (Nylon Carbone)\n*   **Pourquoi l'imprimer ?** Les doigts ORCA possèdent des **canaux internes tubulaires** (souvent courbes) permettant au tendon Dyneema de glisser librement à travers les phalanges. Réaliser ces canaux courbes en usinage CNC 3 axes est physiquement impossible. De plus, des doigts en aluminium massif augmenteraient dramatiquement l'inertie du système, ralentissant les mouvements rapides et augmentant la charge sur les servomoteurs.\n*   **Pourquoi le PA12-CF ?** Le Nylon (PA12) est auto-lubrifiant (réduit la friction contre les pièces contiguës des articulations qui n'ont pas de roulements à billes). L'ajout de fibres de carbone (CF) lui confère une rigidité absolue, empêchant le doigt de \"plier\" sous les 15 kg de tension du tendon.\n*   **Méthode** : Fichiers `.3mf` pré-configurés ORCA (si compatibles) ou slicés manuellement pour la Qidi avec support dédié.\n\n#### 🧽 La Peau Tactile (Finger Pads) : Silicone Coulé + FDM (Moule)\n*   **Méthode** : Les moules négatifs (molds) sont imprimés en PLA basique, puis du silicone (de type EcoFlex ou DragonSkin) y est coulé pour former la pulpe. L'eFlesh viendra s'insérer sous cette couche.\n\n---\n\n### 11.2 Ce qui DOIT être USINÉ en CNC (NestWorks C500)\n\nLa CNC intervient là où l'impression 3D montre ses limites : la résistance au cisaillement continu (fil à couper le beurre) et la rigidité structurelle sous charge asymétrique lourde.\n\n#### ⚙️ Les Poulies d'Enroulement (Spools) : Alu 7075-T6 ou Bronze CuSn8 — Ø12mm avec Roulements\n\n**Problème du design ORCA original (spools plastique imprimés) :**\nSous l'effort du XC430 (1.9 N.m), le Dyneema Ø0.6mm \"scie\" progressivement le plastique → modification du rayon effectif → dérive de calibration Isaac Gym + perte de force progressive.\n\n**Solution validée D-Hand : Tambour CNC Ø12mm avec roulement MR84ZZ et gorge hélicoïdale.**\n\n| Paramètre | Valeur |\n| :--- | :--- |\n| **Diamètre extérieur** | **Ø12mm** (optimisé force vs intégrité) |\n| **Roulement** | **MR84ZZ** (4mm bore / 8mm OD / 2mm) pressé en H7 |\n| **Paroi alu** | 2mm chaque côté du roulement |\n| **Rayon effectif r** | **6mm** (depuis axe jusqu'au fond de gorge) |\n| **Tension XC430** | ~269 N effectifs (η=85%) |\n\n---\n\n##### A — Gorge Hélicoïdale : Conception et Dimensionnement\n\n> [!IMPORTANT]\n> **La gorge hélicoïdale est mécaniquement obligatoire.** Sans gorge guidée, le tendon migre latéralement sur le tambour, le rayon effectif r varie de manière aléatoire, et la force de grip devient imprévisible. C'est la gorge qui garantit r=6mm constant à chaque cycle.\n\n**Design retenu : Tambour \"Bobine à Flasques Débordantes\"**\n\nLe tambour n'est pas un simple cylindre droit — il adopte une forme de bobine (comme une bobine de fil industriel) avec des **flasques de diamètre supérieur à la zone de gorge**. C'est le design optimal pour la solidité et le guidage :\n\n![Coupe technique du tambour-bobine : gorge Ø12mm avec flasques Ø14mm et roulement MR84ZZ](./assets/img_dhand_pulley_bobine_cross_section.png)\n\n```\nPROFIL DU TAMBOUR (vue en coupe axiale)\n\n   Flasque     Zone gorge     Flasque\n   Ø14mm       Ø12mm          Ø14mm\n  ┌──┐ ┌────────────────────┐ ┌──┐\n  │  │ │  gorge hélicoïdale │ │  │\n  │  │ │  (1.5 tours câble) │ │  │\n  ├──┤ ├────────────────────┤ ├──┤\n  │  MR84ZZ (Ø8mm OD) pressé en H7   │\n  └──┴─────────────────────────┴──┘\n  1.5mm    1.05mm gorge    1.5mm = 4.1mm total\n```\n\n**Épaisseur de paroi selon la zone :**\n\n| Zone | Diamètre ext. | Paroi jusqu'au roulement | Rôle |\n| :--- | :---: | :---: | :--- |\n| **Flasques** (2×) | **Ø14mm** | **3mm** ← robuste | Support press-fit roulement (73% de la longueur) |\n| **Fond de gorge** | Ø10.8mm | 1.4mm | Traction tangentielle Dyneema uniquement |\n\n> ✅ **Pourquoi les flasques Ø14mm renforcent le press-fit :** le roulement est pressé sur toute la longueur axiale (~4.1mm). Les zones de flasque (2 × 1.5mm) représentent 73% de la surface de contact → les contraintes de serrage se distribuent sur les 3mm de paroi des flasques. Le fond de gorge à 1.4mm n'encaisse **pas** le press-fit, uniquement la traction tangentielle du câble → 1.4mm en 7075-T6 est largement suffisant (σ_e = 503 MPa).\n\n**Profil et dimensions de la gorge :**\n\n| Paramètre | Valeur | Justification |\n| :--- | :---: | :--- |\n| **Profil** | U-groove (fond plat) | Meilleur maintien latéral qu'un V-groove |\n| **Largeur gorge** | **0.75mm** | Dyneema Ø0.6mm + 0.15mm de jeu |\n| **Profondeur gorge** | **0.6mm** | ≥ diamètre câble → câble ne peut pas sauter |\n| **Hauteur flasques** | **1mm au-dessus de la gorge** | (r_flasque=7mm) − (r_gorge=6mm) = 1mm |\n| **Pitch hélicoïdal** | **0.7mm/tour** | Dyneema Ø0.6 + 0.1mm séparation inter-spires |\n| **Trou de fixation câble** | Ø1.0mm + M1.6 | Vis de serrage sur le flanc du tambour |\n\n---\n\n##### B — Calcul du Nombre de Tours de Câble\n\n**Déplacement linéaire nécessaire pour fermer un doigt complètement :**\n\n| Articulation | Débattement | Bras de levier | Câble consommé |\n| :--- | :---: | :---: | :---: |\n| **MCP** (métacarpo-phalangienne) | ~90° | ~9mm | ~14mm |\n| **PIP** (inter-phalangienne prox.) | ~100° | ~7mm | ~12mm |\n| **DIP** (inter-phalangienne dist.) | ~70° | ~5mm | ~6mm |\n| **Total** (couplage réduit ~10%) | | | **~28-30mm** |\n\n> Les articulations sont couplées via le routage du tendon : la consommation réelle est ~10% inférieure à la somme algébrique.\n\n**Conversion en tours sur la poulie Ø12mm :**\n\n```\nCirconférence = π × 12mm = 37.7mm\n\nTours fonctionnels = 30mm / 37.7mm = 0.80 tour (~290° de rotation servo)\n← Bien dans la plage du mode joint Dynamixel (0-360°) ✅\n```\n\n**Composition des tours sur le tambour :**\n\n| Couche | Rôle | Quantité |\n| :--- | :--- | :---: |\n| Tours fonctionnels | Fermeture complète du doigt | ~0.8 tour |\n| Tours de sécurité | ≥ 0.5 tour toujours enroulé même à l'extrême \"ouvert\" | +0.7 tour |\n| **Total recommandé** | | **1.5 tours** |\n\n> ⚠️ **2 tours est le maximum** : au-delà, les spires se superposent et le rayon effectif augmente de manière non-contrôlée (r augmente de ~0.6mm par couche = perte de force et dérive de calibration).\n\n**Géométrie axiale du tambour :**\n\n```\nCOUPE AXIALE DU TAMBOUR Ø12mm (vue de face)\n\n  Flasque │←— Zone hélicoïdale —→│ Flasque\n   1.5mm  │  1.5 × 0.7mm = 1.05mm │  1.5mm\n          │   ┌──┬──┐              │\n  ────────┤───┤  │  ├──────────────├────────\n          │   └──┴──┘              │\n          │   Ø12mm ext.           │\n          │     MR84ZZ (Ø8mm)     │\n  ────────┴───────────────────────┴────────\n  Largeur totale tambour : ~4.1mm\n```\n\n| Élément | Dimension axiale |\n| :--- | :---: |\n| Zone de gorge hélicoïdale (1.5 tours × 0.7mm pitch) | 1.05mm |\n| Flasque gauche (anti-débordement) | 1.5mm |\n| Flasque droit (anti-débordement) | 1.5mm |\n| **Largeur totale du tambour** | **~4.1mm** |\n\n> ✅ Totalement usinable sur la C500 en un seul posage : fraiser la gorge hélicoïdale avec une fraise Ø0.6-0.8mm en 2.5D hélicoïdal.\n\n---\n\n**Comparatif matériaux pour la poulie :**\n\n| Matériau | Limite Élastique | Usinabilité C500 | Rendement η | Recommandation |\n| :--- | :---: | :---: | :---: | :--- |\n| Alu 6061-T6 | 241 MPa | ✅ Facile | ~82% | ❌ Paroi 2mm trop juste |\n| **Alu 7075-T6** ⭐ | **503 MPa** | ✅ Facile (déjà projet) | ~85% | **✅ Recommandé** |\n| **Bronze CuSn8** ⭐ | 380 MPa | ✅ Excellent | **~88%** | ✅ Auto-lubrifiant (gorge parfaite) |\n| Acier 1018 | 370 MPa | 🟡 Lent (carbure) | ~83% | ❌ 3× plus lourd (nuisible) |\n\n> **Pourquoi 7075 et pas 6061 ?** La limite élastique de 503 MPa (vs 241 MPa) permet à une paroi de **2mm en 7075 d'équivaloir structurellement à 4.2mm en 6061**, rendant l'emmanchement du roulement en press-fit H7 parfaitement sûr sur le Ø8mm intérieur.\n\n> **Pourquoi le bronze est également excellent ?** Le CuSn8 est auto-lubrifiant : le Dyneema glisse dans la gorge bronze avec un coefficient de friction inférieur à l'alu → rendement légèrement supérieur (~88% vs 85%). Pour 8 poulies de ~3-4g chacune, la densité 3× supérieure ajoute seulement **~18-20g** à la main — **totalement négligeable**.\n\n**Procédure d'usinage recommandée sur C500 :**\n1. Serrer une barre ronde Ø16mm (7075 ou bronze) en mandrin 4 mors\n2. Aléser le Ø8mm intérieur H7 (tolérance ±0.018mm) — même axe que l'extérieur → concentricité garantie\n3. Tourner l'extérieur à Ø12mm\n4. Fraiser la gorge hélicoïdale 0.75mm × 0.6mm (1.5 tours, pitch 0.7mm) avec fraise Ø0.6-0.8mm\n5. Fraiser les deux flasques latéraux (épaulement 1.5mm de chaque côté)\n6. Percer le trou Ø1.0mm + tarauder M1.6 pour la vis de serrage du tendon\n7. Presser le roulement MR84ZZ avec une presse à colonne (ne jamais chasser au marteau)\n\n**Bénéfices vs ORCA original :**\n- ✅ Usure du tambour : **zéro** (vs plastique qui dérive en < 6 mois)\n- ✅ Calibration Isaac Gym : **stable à vie** (r=6mm constant à toutes les températures)\n- ✅ Rendement : **+10 à +15%** (roulement vs friction directe plastique/acier)\n- ✅ +33% de force de grip vs Ø16mm en 6061 (r=6mm vs r=8mm)\n- ✅ Gorge hélicoïdale : rayon effectif **garanti constant** sur toute la course\n\n\n#### 🧱 La Paume (Carpals / Palm Block) : Aluminium 6061 (Recommandé)\n*   **Problème de la 3D** : La paume est le point de concentration des contraintes centrales de toute la main. Elle encaisse simultanément la poussée des objets saisis et la force de compression des 8 tendons tirant à l'unisson (potentiellement >100 kg de force cumulée). Une paume en plastique imprimé – même en CF – va subir des micro-déformations (flex ou fluage) sous charge maximale, faussant la précision des IK (Inverse Kinematics).\n*   **Solution CNC** : La paume est généralement un bloc relativement \"carré\", usinable en 2.5D ou 3D sur trois ou quatre faces sur la C500. \n*   **Bénéfice** : Un châssis \"Rock Solid\". Les articulations à la base des doigts (MCP) s'ancreront dans de l'aluminium (zéro jeu mécanique), éliminant toute torsion latérale de la main lorsque le poignet bouge brusquement, et offrant un ancrage parfait avec le poignet RS-00 du bras.\n\n#### 🔩 Brides de Support Moteurs (Avant-bras) : Aluminium 6061\n*   **Rôle** : Les 8 servomoteurs XC430/XC330 seront entassés dans l'avant-bras. S'ils sont montés sur du plastique, l'avant-bras peut fléchir ou vibrer lors des accélérations (jitter). D'autre part, les moteurs chauffent en maintien de force continue.\n*   **Bénéfice CNC** : Une plaque/cage d'intégration moteur usinée en aluminium sert de **dissipateur thermique géant** (heatsink) rayonnant la chaleur des XC430 vers l'extérieur du robot, tout en augmentant la densité structurelle de l'avant-bras.\n\n### 11.3 Synthèse du Flux de Production (D-Hand v1)\n\n| Composant | Matériau | Procédé | Outil | Raison principale |\n| :--- | :--- | :--- | :--- | :--- |\n| **Phalanges** | PA12-CF | Impression FDM | Qidi Plus 4 | Canaux internes / Légèreté |\n| **Moule des peaux** | PLA | Impression FDM | Qidi Plus 4 | Pièce jetable / Coût |\n| **Peau Tactile** | Silicone | Coulée manuelle | — | Compliance adhérente |\n| **Paume (Palm)** | Alu 6061 | Fraisage CNC 3+1 axes | NestWorks C500 | Rigidité absolue / Zéro fluage |\n| **Poulies (Spools)**| Alu 6061 | Fraisage / Tournage | NestWorks C500 | Résistance à la découpe du câble |\n| **Bride Moteurs** | Alu 6061 | Fraisage CNC 2.5D | NestWorks C500 | Dissipation thermique / Rigidité |\n| **Routage tendons**| Tube PTFE | Coupe manuelle | — | Glissement sans friction (Téflon) |\n\n---\n\n### 11.4 Capacités Fonctionnelles : Que permettent 8 DOF ?\n\nLa décision de retenir **8 Degrés de Liberté** (contre 1, 2, ou les 17 de l'ORCA originale) repose sur une analyse stricte de Pareto : obtenir 95 % des capacités de préhension humaines avec 50 % de la complexité mécanique. Pour référence, une pince industrielle classique possède 1 DOF, et les prothèses médicales bioniques haut de gamme (ex: *Taska*, *bebionic*) oscillent autour de 5 à 6 DOF.\n\nEn exploitant le design biomimétique des doigts ORCA (qui couple mécaniquement la flexion de la phalange proximale et médiane sur un seul tendon), la D-Hand Hybrid répartit ses 8 DOF comme suit :\n\n| Moteur (DOF) | Fonction Actionnée | Dextérité & Usage dans le monde réel (Isaac Gym) |\n| :--- | :--- | :--- |\n| **DOF 1** | **Index (Flexion)** | Isolé pour pincer un petit objet avec le pouce (Pinch Grasp), appuyer sur un bouton-poussoir discret, ou presser une gâchette (perceuse). |\n| **DOF 2** | **Majeur (Flexion)** | Essentiel pour stabiliser une prise en pince avec l'index (prise tridigitale de précision, comme tenir un stylo ou un tournevis). |\n| **DOF 3** | **Annulaire + Auriculaire (Flexion couplée)** | Ces deux doigts sont couplés sur 1 moteur. Ils s'enroulent ensemble autour d'un manche (marteau, poêle) pour verrouiller la prise de force (Power Grasp). |\n| **DOF 4** | **Pouce (Flexion)** | Plier le pouce pour serrer ou verrouiller une prise cylindrique. |\n| **DOF 5** | **Pouce (Opposition)** | **Le DOF le plus crucial** : pivoter le pouce face à l'index pour passer d'une main \"plate\" à une main capable de saisir une sphère (pomme) ou de pincer. |\n| **DOF 6** | **Écartement des doigts (Abduction)** | Écarter l'index et l'auriculaire vers l'extérieur pour attraper de gros objets ronds ou stabiliser un plateau large par les bords. |\n| **DOF 7** | **Poignet (Pitch)** | Inclinaison haut/bas, vitale pour ouvrir une poignée de porte. |\n| **DOF 8** | **Poignet (Yaw / Roll)** | Rotation ou inclinaison latérale pour visser/dévisser. |\n\n#### Ce que le robot POURRA faire très bien (95 % des tâches cibles) :\n*   ✅ **Prise de Force (Power Grasp)** : Tenir fermement un outil de bricolage, une perceuse, un balai, ouvrir une poignée de porte, porter une charge lourde. Les 5 doigts se referment ensemble.\n*   ✅ **Prise de Précision (Pinch & Tripod)** : Ramasser une vis, tenir un gobelet en plastique fragile sans l'écraser (le tactile eFlesh dose la force), insérer une clé dans une serrure.\n*   ✅ **Prise Globale / Sphérique** : Attraper une balle (grâce au DOF n°6 d'écartement des doigts).\n*   ✅ **Interaction fine** : Allumer un interrupteur, pointer du doigt, tirer une sangle.\n\n#### Ce que le robot NE POURRA PAS faire (Limites des 8 DOF vs 17 DOF) :\n*   ❌ **Manipulation Intra-Manuelle Complexe (In-hand manipulation)** : Faire rouler un stylo entre ses différents doigts de manière fluide, jouer du piano avec accords complexes, ou exécuter l'entièreté du langage des signes. Ces gestes nécessitent le désaccouplement temporel et spatial de chaque articulation, ce qui réclame les 17 DOF pleins de l'ORCA Base.\n\n> **En résumé** : Le sous-actionnement mécanique (un tendon tire plusieurs articulations) permet au doigt de s'enrouler \"naturellement\" autour de la forme de l'objet, sans que l'IA n'ait besoin de calculer la trajectoire exacte de chaque micro-phalange. Le choix de ces 8 DOF est le compromis optimal pour l'entraînement par renforcement (RL) de préhension robuste.\n\n---\n\n### 11.5 Ressource Clé : Guide de Montage & Méthodologie\n\nBien que nous utilisions nos propres servomoteurs (D-Hand actionneurs), l'assemblage mécanique des doigts, de la paume et le cheminement des tendons suivent strictement la méthodologie validée par l'ETH Zurich.\n\n🔗 **Le Guide d'Assemblage Officiel (Interactive) :**\n**[https://www.orcahand.com/legacy/files#assembly](https://www.orcahand.com/legacy/files#assembly)**\n\nCe guide interactif en 29 à 31 étapes illustrées avec photos couvre absolument tout :\n1. **Routage du bout des doigts (Fingertips)** : Comment insérer le fil Dyneema et réaliser le nœud de blocage au bout de la phalange distale.\n2. **Technique du Nœud \"Ashley Stopper\" (Oysterman's stopper)** : C'est le nœud officiel utilisé pour garantir que le câble ne glisse jamais sous haute tension, tout en restant démontable (très supérieur à notre idée initiale de point de colle cyanoacrylate).\n3. **Mise en place des tubes PTFE** : Comment insérer les tubes Téflon dans les \"Carpals\" (la paume) pour garantir le glissement sans friction du câble de la paume jusqu'à l'avant-bras.\n4. **Tensionnement des ressorts** : La méthode pour monter les ressorts de rappel en torsion dans les phalanges imprimées en 3D afin de garantir l'extension passive du doigt.\n\n*Il est impératif de garder cette page web ouverte lors de l'assemblage physique du premier prototype D-Hand.*\n\n---\n\n### 11.6 Bill of Materials (BOM) : La Quincaillerie Commune ORCA / D-Hand\n\nAprès extraction minutieuse de la nomenclature officielle ORCA, voici la liste exacte de la quincaillerie mécanique **qu'il faut commander** pour assembler les doigts et la paume du D-Hand. \n\n> [!WARNING]\n> **Découverte Technique Majeure** : Contrairement aux hypothèses de départ, les doigts ORCA **utilisent bien des micro-roulements à billes** pour la fluidité, et **n'utilisent AUCUN ressort mécanique en métal pour l'extension**. L'extension passive du doigt (le fait qu'il se rouvre seul) est générée **exclusivement par l'élasticité de la peau en silicone (eFlesh) coulée sur le doigt**. Faire la peau en silicone est donc obligatoire sur le plan mécanique, pas juste cosmétique.\n\n#### 📦 Achats Communs Requis (Main & Doigts)\n\n| Catégorie | Référence exacte ORCA | Quantité pour 1 Main | Usage |\n| :--- | :--- | :---: | :--- |\n| **Roulements (Micro)** | Roulement à billes **4x8x3 mm** (MR84ZZ ou ouvert) | **35 unités** | Articulations des doigts et poulies de routage dans la paume. |\n| **Roulements (Poignet)** | Roulement à billes **6x13x5 mm** | **2 unités** | Base du pouce / poignet. |\n| **Axes Métalliques** | Goupilles cylindriques **2x6 mm** en acier | **20 unités** | Verrouillage des articulations MCP/PIP. |\n| **Axes Longs** | Axes en Inox **3x55 mm** | **4 unités** | Axes majeurs traversant la paume. |\n| **Aimants** | Aimants Néodyme ronds **5x2.8 mm** | **10 unités** | Fixation magnétique des pulpes / capteurs. |\n| **Câble (Tendon)** | Ligne tressée de pêche (Dyneema) **Ø 0.39 - 0.41 mm** | 1 bobine (15 brins) | *Berkley x9 Braid* recommandée pour sa rigidité extrême. |\n| **Guidage Tendon** | Tube PTFE (Téflon) **0.9 mm (interne) x 1.5 mm (externe)** | 1 bobine | Insertion dans toutes les pièces imprimées pour guider le fil. |\n\n#### 💸 Ce que l'on NE DOIT PAS ACHETER (Spécifique D-Hand)\n\nPour l'avant-bras et la base-moteur, notre **Scénario A** annule une grande partie de la volumineuse visserie ORCA, que nous remplaçons par nos pièces usinées.\n\n| Pièce ORCA évitée | Remplacement D-Hand | Avantage |\n| :--- | :--- | :--- |\n| **17× servomoteurs Feetech/Dynamixel** | **8× Dynamixel (4× XC430 + 4× XC330)** | Budget divisé, câblage divisé par deux. |\n| ~150 micro-vis (M2x4, M2x6, crochets) | Fixation par bride Alu CNC | Moins de pièces cassables, montage plus rapide. |\n| Poulies imprimées en plastique (Spools) | 8× Poulies usinées alu CNC | Zéro usure du câble (plus de \"fil à couper le beurre\"). |\n\n#### ⚠️ Correction BOM Câble Dyneema (post-vérification mécanique)\n> [!WARNING]\n> Le Ø **0.40 mm** de l'ORCA est calibré pour les moteurs Feetech (1.1 N.m max). Nos **XC430 atteignent 2.6 N.m en pic**, ce qui donne un facteur de sécurité de seulement **×1.7** — insuffisant. La spécification câble D-Hand corrigée est **Ø 0.50 à 0.60 mm** (voir section 11.7 pour le calcul complet).\n\n#### Action Achat à prévoir :\nIl nous faudra passer commande d'un lot de **40 roulements 4x8x3 mm**, de **tubes PTFE [0.9x1.5mm]**, des **goupilles 2x6mm** et du fil *Dyneema / Berkley x9* (⚠️ **Ø 0.50 à 0.60 mm**) pour les moteurs D-Hand.\n\n---\n\n### 11.7 Vérification Mécanique Complète (Câble, Poulies, Roulements)\n\nSuite à l'intégration des roulements ORCA (4x8x3 mm) et à la correction du diamètre de câble, voici la vérification complète du dimensionnement mécanique du D-Hand.\n\n#### A. Tensions Générées par les Moteurs (XC430 + XC330)\n\n| Moteur | Couple continu | Couple pic | Tension câble @ r=8mm | Tension câble @ r=10mm |\n| :--- | :---: | :---: | :---: | :---: |\n| **XC430-T240BB** (Force) | 1.9 N.m | 2.6 N.m | **237 N (24 kg)** / 325 N (33 kg) pic | 190 N / 260 N |\n| **XC330-T228** (Précision) | 0.76 N.m | 1.6 N.m | 95 N (10 kg) / 200 N pic | 76 N / 160 N |\n\n#### B. Résistance à la Rupture du Câble Dyneema (PE Tressé) et Facteur de Sécurité\n\nFacteur de sécurité cible : **×3 minimum** (robotique industrielle). Le calcul se fait sur la tension de pic (cas du blocage du doigt sur un objet dur).\n\n| Diamètre | Rupture (PE/Dyneema) | Facteur sécurité vs XC430 pic (325 N) | Verdict |\n| :---: | :---: | :---: | :---: |\n| Ø 0.40 mm (ORCA orig.) | ~392 N (40 kg) | **×1.2** | ❌ Insuffisant |\n| **Ø 0.50 mm** | ~540 N (55 kg) | **×1.7** | ⚠️ Limite (usage normal OK) |\n| **Ø 0.60 mm** | ~750 N (76 kg) | **×2.3** | ✅ Recommandé D-Hand |\n| Ø 0.80 mm (initial) | ~1177 N (120 kg) | **×3.6** | ✅✅ Trop gros pour canaux ORCA |\n\n> [!IMPORTANT]\n> **Standard retenu pour le D-Hand Hybrid :** Fil Dyneema PE 9 brins, **Ø 0.60 mm (80 lbs / 36 kg de rupture)** — celui-ci passe dans les tubes PTFE 0.9mm internes (marge +0.3mm suffisante pour la courbure), et offre le facteur de sécurité ×2.3 jugé acceptable pour une main manipulant des objets de 0 à 5 kg.\n\n#### C. Géométrie de Poulie CNC Révisée (Intégrant Roulement 4x8x3 mm)\n\nLa découverte que les poulies ORCA embarquent des **roulements à billes 4x8x3 mm** modifie les cotes de nos poulies CNC. Voici le profil mécanique résultant :\n\n```\n                     ┌──────────────────────┐\n                     │  Gorge câble Ø0.60mm │\n               ┌─────┴──────────────────────┴─────┐\n               │  Couronne Alu ⌀ ext ≥ 16 mm      │\n               │   ┌───────────────────────┐       │\n               │   │  Roulement 4x8x3 mm   │       │\n               │   │  (MR84ZZ pressé)      │       │\n               │   │  Alésage intérieur ⌀4mm│      │\n               │   └───────────────────────┘       │\n               └──────────────────────────────────┘\n                      Axe Ø4mm (goupille Inox)\n```\n\n| Paramètre Poulie CNC | Valeur retenue | Justification |\n| :--- | :---: | :--- |\n| Diamètre extérieur (spool complet) | ≥ **16 mm** | Roulement ⌀8mm + 4mm de matière alu autour |\n| Gorge câble (profil en U) | Largeur **0.8mm**, Prof **0.8mm** | Câble Ø0.60 mm avec jeu de guidage |\n| Alésage pour roulement | **⌀8 mm H7** (pressé) | Monter le roulement 4x8x3mm à la presse |\n| Alésage interne (axe) | **⌀4 mm H7** | Traversé par une goupille Inox ⌀4mm |\n| Matériau | **Alu 6061** (ou 7075 si disponible) | Résistance à l'arête du câble, légèreté |\n| Tolérance gorge câble | **H7/g6** | Pour permettre câble de rouler librement |\n\n#### D. Les Roulements 4x8x3 mm (MR84ZZ) dans les Doigts\n\nDans les phalanges imprimées, les roulements ne sont pas dans les poulies mais dans les **articulations MCP et PIP elles-mêmes** :\n- Chaque rotule MCP/PIP possède un **axe ⌀4mm** traversant la phalange.\n- Un roulement MR84ZZ est inséré en force dans chaque pièce PA12-CF pour supprimer la friction directe plastique-axe.\n- Résultat : articulations **fluides à vie**, sans usure du plastique autour de l'axe.\n\n**Conclusion Générale :** Le design D-Hand Hybrid est mécaniquement cohérent sous les efforts des XC430 **sous réserve** d'utiliser un câble Ø0.60mm (et non le 0.40mm ORCA). Les poulies CNC et les roulements 4x8x3mm sont dimensionnés correctement.\n\n---\n\n### 11.8 Recalcul de la Force de Grip (160-175 N) — Hypothèses Complètes\n\nSuite aux modifications de conception (roulements MR84ZZ dans les articulations + câble Ø0.60mm), voici la vérification du chiffre de **160-175 N** initialement annoncé pour la D-Hand.\n\n#### A. Hypothèses Géométriques du Doigt (Modèle Cinématique Simplifié)\n\n```\n  Tendon                       Pulpe (contact)\n  ───────►──────────────────────────────────●\n          │     MCP       PIP       DIP     │\n          ▼     Joint     Joint     Joint   │\n         (r_m)  ←───────────────────────────┘\n                     L_effectif = 70 mm\n\nBras de levier du tendon sur l'articulation MCP : r_m = 10 mm\nLongueur doigt (MCP → pulpe) : L = 70 mm\n```\n\n| Hypothèse | Valeur retenue | Source |\n| :--- | :---: | :--- |\n| Couple continu XC430 | **1.9 N.m** | Datasheet Robotis (11.1V) |\n| Couple pic XC430 (stall) | **2.6 N.m** | Datasheet Robotis (12V) |\n| Couple continu XC330 | **0.76 N.m** | Datasheet Robotis (12V) |\n| Rayon spool (poulie) | **r = 8 mm** | Design D-Hand (inchangé avec roulement dedans) |\n| Bras de levier tendon / MCP | **r_m = 10 mm** | Standard anatomie robotique (réf. DLR Hand, ORCA) |\n| Longueur doigt effective | **L = 70 mm** | Mesure sur phalanges ORCA (proximale + médiane + distale) |\n| Angle projection prise cylindrique | **25°** | Prise cylindrique Ø50mm (ex: bouteille) |\n| Rendement transmission sans roulements | **η = 0.85** | Friction plastique sur axe (estimée) |\n| Rendement transmission avec roulements MR84ZZ | **η = 0.98** | Friction roulement à billes standard |\n\n#### B. Tension dans le Câble\n\n```\nT_câble = Couple_moteur / r_spool\n\nXC430 continu : T = 1.9 / 0.008 = 237.5 N\nXC430 pic     : T = 2.6 / 0.008 = 325.0 N\nXC330 continu : T = 0.76 / 0.008 = 95.0 N\n```\n\n#### C. Force à la Pulpe du Doigt (Avantage Mécanique du Doigt)\n\n*Le tendon tire avec un bras de levier r_m = 10 mm sur une articulation distante de L = 70 mm de la pulpe :*\n\n```\nF_pulpe = T_câble × (r_m / L) × η\n\n--- Cas Sans Roulements (η = 0.85) ---\nXC430 continu : F = 237.5 × (10/70) × 0.85 = 28.8 N\nXC430 pic     : F = 325.0 × (10/70) × 0.85 = 39.5 N\n\n--- Cas Avec Roulements MR84ZZ (η = 0.98) ---\nXC430 continu : F = 237.5 × (10/70) × 0.98 = 33.2 N  ← Design D-Hand v1\nXC430 pic     : F = 325.0 × (10/70) × 0.98 = 45.5 N\n```\n\n#### D. Force de Grip Total (Power Grasp Cylindrique)\n\n*En prise de force cylindrique, les 4 actionneurs XC430 (index, majeur, annulaire+auriculaire, pouce flexion) tirent simultanément. La projection de chaque force sur l'axe de fermeture de la main dépend de l'angle d'attaque des doigts = cos(25°) ≈ 0.906 :*\n\n```\nF_grip_total = N_doigts × F_pulpe × cos(θ)\n```\n\n| Scénario | η | F_pulpe | N doigts | cos(25°) | F_grip TOTAL |\n| :--- | :---: | :---: | :---: | :---: | :---: |\n| **Sans roulements, continu** (ref. initiale) | 0.85 | 28.8 N | 5 | 0.906 | **~131 N** |\n| **Avec roulements, continu** ← D-Hand v1 | 0.98 | 33.2 N | 5 | 0.906 | **~150 N** |\n| **Avec roulements, 80% charge** ← Régime réel | 0.98 | 28.9 N | 5 | 0.906 | **~131 N** |\n| **Avec roulements, pic motor** | 0.98 | 45.5 N | 5 | 0.906 | **~206 N** |\n| **Avec roulements, pic + 4 XC430** | 0.98 | 45.5 N | 4 | 0.906 | **~165 N** |\n\n> [!IMPORTANT]\n> **Verdict sur le chiffre 160-175 N** : Il s'agit d'une estimation réaliste correspondant au **régime intermédiaire (entre 70% et 90% du pic moteur XC430)**, qui est le mode de fonctionnement réel habituel (un servo n'est jamais constamment à son stall). Ce chiffre est confirmé par le recalcul avec roulements.\n>\n> Plus précisément :\n> - **~150 N** en régime nominal continu (design sûr, thermique stable)\n> - **~170-205 N** en régime pic (accessible sur des impulsions de <2s)\n>\n> Les **roulements MR84ZZ améliorent le chiffre nominal de +15%** par rapport au design sans roulements (+19 N en grip), ce qui valide la décision d'intégration mécanique des roulements dans les doigts même si elle complique légèrement l'assemblage des phalanges imprimées.\n\n*Mars 2026 — Calcul basé sur hypothèses de bras de levier anatomique standard (réf: DLR Hand-II, ORCA Hand EPFL/ETH 2024).*\n\n---\n\n## Annexe A — Amplification Mécanique Poulie-Tendon : Explication Complète\n\n> *Cette annexe a été rédigée en Mars 2026 pour expliquer clairement le cheminement des câbles et le calcul de la force de grip, depuis le servo jusqu'au bout du doigt.*\n\n### A.1 — Le Principe Fondamental : F = τ / r\n\nLe servo produit un **couple de rotation** (τ en N.m). En enroulant le tendon autour d'une **poulie de petit rayon** (r en mètres), on convertit ce couple en une **force linéaire de traction** dans le câble :\n\n> **F = τ / r**\n>\n> Avec le XC430 (Ø12mm, r = 6mm, η=85%) : F = 1.9 / 0.006 × 0.85 = **~269 N** par tendon\n> Avec le XC330 (Ø12mm, r = 6mm, η=85%) : F = 1.0 / 0.006 × 0.85 = **~142 N** par tendon\n\n**Plus la poulie est petite, plus la force est grande** au détriment de la course du câble — c'est le principe du levier.\n\n![Principe du levier — comparaison de poulies et calcul de la tension dans le tendon](./assets/img_dhand_pulley_mechanical_advantage.png)\n\n```\n  CONFIG RETENUE — Ø12mm en Alu 7075-T6 ou Bronze CuSn8\n       Servo ──► Poulie Ø12mm (r=6mm) ──► Tension câble\n\n  XC430 (1.9 N.m) ──► 1.9 / 0.006 × 0.85 = ~269 N effectifs\n  XC330 (1.0 N.m) ──► 1.0 / 0.006 × 0.85 = ~142 N effectifs\n\n  Comparatif diamètre (η=85%) :\n  Ø16mm (r=8mm) → XC430 : 202 N → Grip ~125 N\n  Ø14mm (r=7mm) → XC430 : 231 N → Grip ~142 N\n  Ø12mm (r=6mm) → XC430 : 269 N → Grip ~175 N ✅ CIBLE ATTEINTE\n```\n\n> **Pourquoi Ø12mm est possible malgré le roulement MR84ZZ (Ø8mm OD) ?**\n> La paroi de **2mm en Alu 7075-T6** (σe = 503 MPa) offre une résistance équivalente à 4.2mm en 6061 — press-fit H7 du roulement parfaitement sûr. Le Bronze CuSn8 est une alternative auto-lubrifiante permettant η=88% (+3% de force).\n\n---\n\n### A.2 — Comment le Câble s'Enroule\n\nLe tendon Dyneema **s'enroule autour de la poulie** (~1 à 1.5 tour) et est fixé par une **vis de serrage** dans un trou percé dans la poulie en aluminium usiné CNC. L'enroulement est essentiel : sans le tour de câble, le câble glisserait sous la forte tension générée.\n\n```\n                 Poulie Ø16mm (Al 6061 CNC)\n               ┌──────────────────────┐\n               │   Vis de serrage ◄── │──── Extrémité câble fixée\n               │        ┌─────────────│\n               │   ~~~~╱  tendon      │   ← ~1.5 tours d'enroulement\n               │  ╱~~~~  Dyneema      │\n               └─────────────────────/\n                            ↓\n                    Tube PTFE (Ø1.5mm intérieur)\n                         ↓\n                  → vers le doigt →\n```\n\n![Détail de l'enroulement du tendon sur la poulie Ø16mm — vis de serrage et tube PTFE](./assets/img_dhand_pulley_wrap.png)\n\n- **Enroulement** (~540°) : empêche le glissement sous charge.\n- **Tube PTFE** : gaine de guidage à très faible friction entre l'avant-bras et la paume.\n- **Nœud Ashley Stopper** en bout de tendon : méthode de fixation officielle ORCA à la phalange distale.\n\n---\n\n### A.3 — Trajet Complet du Tendon (de l'Avant-Bras au Bout du Doigt)\n\n```\n  AVANT-BRAS                  POIGNET     PAUME                    DOIGT\n  ──────────────────────────────────────────────────────────────────────\n  [Servo XC430]\n      ↓ Arbre de sortie\n  [Poulie Ø16mm CNC]          [RS-00]\n      ↓ Enroule le Dyneema       ↓\n  [Tube PTFE]──────────────────────── [Poulie de renvoi] ──────────────\n      ↓ guide le câble (~145mm)                ↓               MCP → PIP → DIP\n      ...................................................................\n                                              tendon longe la face palmaire du doigt\n                                              attache sur la phalange distale (Nœud Ashley)\n```\n\n![Coupe longitudinale du système servo → poulie → tendon → phalange distale — MCP, PIP, DIP](./assets/img_dhand_tendon_pulley_system.png)\n\nConcrètement :\n1. **Servo XC430** (dans l'avant-bras) → tourne en enroulant le tendon.\n2. **Poulie Ø16mm** (sur l'arbre de sortie) → convertit le couple en tension.\n3. **Tube PTFE Ø1.5mm** → guide le tendon sur toute la longueur de l'avant-bras avec une friction minimale.\n4. **Passage du poignet** (à travers le RS-00 ou son voisinage) → le câble traverse sans interférer avec la rotation du poignet.\n5. **Poulies de renvoi dans la paume** (Ø6mm, PA12-CF imprimées) → dévient le câble vers le doigt correspondant.\n6. **Face palmaire du doigt** → le tendon passe par les guides de chaque phalange (MCP → PIP → DIP).\n7. **Phalange distale** → fixation par nœud Ashley Stopper + goutte de cyanoacrylate.\n\n---\n\n![Vue de dessus — routage des 8 câbles Dyneema depuis les servos (avant-bras) jusqu'aux doigts](./assets/img_dhand_tendon_routing_overview.png)\n\n### A.4 — Retour Passif des Doigts : Silicone, Pas de Ressorts !\n\n> [!IMPORTANT]\n> **Découverte Technique Majeure issue de l'analyse ORCA (Section 11.6 de ce document) :**\n> Les doigts de type ORCA **n'utilisent AUCUN ressort mécanique en métal pour l'extension**. Le retour passif des doigts en position ouverte est assuré **exclusivement par l'élasticité de la peau en silicone** (EcoFlex 00-30 ou Dragon Skin 10) moulée autour des phalanges.\n>\n> **Le moulage silicone est donc mécaniquement obligatoire, pas juste cosmétique.**\n\nLa peau en silicone fait triple emploi :\n\n| Rôle | Mécanisme |\n| :--- | :--- |\n| **Rappel élastique** | Quand le servo relâche le câble, le silicone ramène le doigt en position ouverte |\n| **Protection tactile** | Le capteur eFlesh est intégré sous cette même peau, à la pulpe |\n| **Grip de surface** | Coefficient de friction élevé pour la saisie d'objets |\n\n**Matériaux validés :**\n- **EcoFlex 00-30** (plus souple, meilleur rappel) ou **Dragon Skin 10** (plus rigide, meilleure durabilité).\n- Polymérisation en ~4h à température ambiante.\n- Moules négatifs imprimés en PLA sur la Qidi Plus 4 (fichiers `ORCA_Molds.zip` dans `Ressources 3D/ORCA_Hand`).\n\n---\n\n### A.5 — Vue d'Ensemble des 8 Câbles\n\nChaque câble est indépendant et contrôlé par son propre servo :\n\n| # | Servo | Type | Fonction | Tendon |\n| :---: | :--- | :---: | :--- | :--- |\n| 1 | XC430 | Force | Pouce — Flexion (Curl) | Dyneema Ø0.6mm |\n| 2 | XC330 | Précision | Pouce — Opposition | Dyneema Ø0.6mm |\n| 3 | XC430 | Force | Index — Flexion (Curl) | Dyneema Ø0.6mm |\n| 4 | XC330 | Précision | Index — Abduction | Dyneema Ø0.6mm |\n| 5 | XC430 | Force | Majeur — Flexion | Dyneema Ø0.6mm |\n| 6 | XC330 | Précision | Annulaire — Flexion | Dyneema Ø0.6mm |\n| 7 | XC330 | Précision | Auriculaire — Flexion | Dyneema Ø0.6mm |\n| 8 | XC430 | Force | Paume — Curl palmaire | Dyneema Ø0.6mm |\n\n> **Note :** La D-Hand utilise du Dyneema **Ø0.6mm** (résistance ~25 kg) au lieu du Ø0.40mm d'origine ORCA, pour compenser le couple 2× supérieur des moteurs XC430 vs les Feetech STS3215.\n\n---\n*Annexe rédigée en Mars 2026. Réf : [Guide Montage Doigts ORCA](./22_Guide_Montage_Doigts_ORCA.md) | [16 — Conclusions Architecture](./16_Conclusions_Architecture_DBot.md)*\n", "Annexes: 22_Usinage_CNC_C500": "# 22 — Usinage CNC : NestWorks C500\n\nAfin d'usiner les composants vitaux du robot humanoïde D-Bot (y compris les brackets moteurs, l'avant-bras et la série d'actuateurs cycloïdaux de la *D-Hand*), le projet s'appuie **exclusivement** sur la **[CNC NestWorks C500 (Kickstarter)](https://www.kickstarter.com/projects/959480926/nestworks-c500-next-gen-smartest-cnc-with-industrial-power?ref=6kxkib&gad_source=1&gad_campaignid=23219605599&gbraid=0AAAABB43OIjDJ9r7f4_PShKb-aiRTG1WU&gclid=Cj0KCQiA5I_NBhDVARIsAOrqIsarYDgeND2akM2atrgBpf3fPrG1im0h9fJHcixW_bDDwAAOqZZsyK4aAvDOEALw_wcB)**.\n\nCette fraiseuse professionnelle \"Desktop\" est la machine de référence unique pour tout l'aluminium du robot, offrant une synergie parfaite avec notre impression 3D (Qidi).\n\n---\n\n## 1. Spécifications Techniques (NestWorks C500)\n\nLa C500 n'est pas un jouet de bureau, c'est une fraiseuse de classe industrielle miniaturisée :\n- **Broche Haute Puissance** : **800W** (AC Servo motorisée, jusqu'à 18 000 tr/min). Permet d'attaquer directement des blocs d'Aluminium 6061 ou 7075-T6, offrant un couple bien supérieur aux petites broches de 200W courantes sur les CNC de bureau.\n- **Changeur d'Outil Auto (ATC)** : Carrousel 10+ outils avec puces RFID pour la configuration automatique de la longueur d'outil.\n- **Précision Industrielle** : Guidages linéaires (Linear Rails & Ballscrews), suffisante pour garantir la tolérance **ISO H7 (±0.02 mm)** vitale pour l'insertion de nos roulements.\n- **Palpage 3D** : Touch probe sans fil intégré pour le repérage parfait des origines pièces.\n\n---\n\n## 2. Le 4ème Axe Rotatif (Tournage CNC)\n\nL'acquisition du **Module 4ème Axe** de la NestWorks C500 change la donne sur l'ingénierie globale du D-Bot. Il permet de traiter les pièces non seulement en \"fraisage plat\" (3 axes), mais aussi en \"tournage\" :\n\n### Applications critiques pour le D-Bot :\n1. **Les Inserts de Tibia (Bouchons Alu/PA12)** : Au lieu d'usiner un bloc plat et de passer un temps infini à détourer un cylindre en 3D, le 4ème axe tourne la pièce. C'est idéal pour créer parfaitement le cylindre Ø12 mm et ses **gorges de circlips** inférieures.\n2. **Taraudage et Filetage Externes** : La puissance de la C500 permet de tailler des pas de vis complexes sur de longs axes de transmission (ex: fileter l'embout d'un bras de levier en titane ou acier) grâce à la rotation couplée de l'axe A.\n3. **Bras et Phalanges** : Usinage multi-faces sans devoir démonter et repositionner la pièce dans l'étau. La machine fait pivoter la pièce pour usiner dessus, dessous, et sur les côtés dans la même opération (réduisant le fameux \"setup time\").\n\n---\n\n## 3. Outils Métal (Professional Metal Tool Kit)\n\nLe choix du kit professionnel orienté métal avec revêtement **DLC (Diamond-Like Carbon)** est le pilier de tous nos développements sur de l'Aluminium 7075-T6 pour éviter que l'alu chaud ne \"colle\" à la fraise.\n\n| Type d'outil | Utilisation sur le D-Bot |\n| :--- | :--- |\n| **Flat End Mill (1/4\")** | Fraise plate (6.35 mm). L'outil \"de force\" pour ébaucher les gros brackets moteurs (RS-04/05). |\n| **O-Type End Mill** | Fraise à 1 dent. Évacuation très rapide des copeaux (idéal poches profondes). |\n| **Chamfer Cutter (90°)** | **Indispensable pour le H7.** Permet de casser les angles une fois alésés pour ne pas rayer les micro-roulements à l'insertion. |\n| **Ball Nose** | Pour usiner des congés internes dans les phalanges afin de prévenir la rupture sous charge. |\n\n> [!TIP]\n> **Règle d'Usinage H7** : Une passe d'ébauche avec une Flat End Mill usée, suivie *impérativement* d'une passe terminale micrométrique avec un outil DLC neuf pour la cote finale.\n\n---\n\n## 4. Tolérances et Pinces ER11 (Alerte de Sécurité)\n\nLa NestWorks C500 utilise un système de pince de serrage industriel **ER11**. Le kit de base est souvent livré en métrique américain (fraises de *1/4\"* soit 6.35 mm et de *1/8\"* soit 3.175 mm). \n\n**Règle absolue :**\n1. **Ne jamais forcer** une fraise métrique de 6 mm dans une pince impériale de 1/4\" (6.35 mm).\n2. Ce désalignement engendre un \"runout\" (voile) asymétrique. Un battement de juste **0.02 mm** ruine le fraisage d'un logement de roulement H7, et abîme prématurément la broche de 800W.\n3. **Solution** : Ranger les collets NestWorks impériaux séparément. Si vous achetez des fraises européennes (6 mm, 4 mm), commandez les pinces ER11 métriques strictes correspondantes.\n\n---\n\n## 5. Gestion ATC Spécifique (RFID)\n\nLe système ATC de NestWorks opère avec des puces RFID collées sur les **Bit Tool Holders** (les porte-outils, pas directement sur la fraise). \n- **Bénéfice** : La puce n'est pas exposée à la chaleur ou aux vibrations de la coupe. \n- **Maintenance** : Si une fraise casse, il suffit de changer la partie coupante dans le collet. La puce numérotée reste fixée au haut du Tool Holder, conservant ses propriétés et sa longueur pré-calibrée dans le logiciel NestWorks Studio.\n", "Annexes: 24_Ultralight_Sous_Genou": "# 23 — Stratégie Ultralight : Matériaux sous le Genou\n\n> **Règle d'or en robotique bipède :** un gramme gagné au bout du pied (inertie distale) vaut dix grammes gagnés à la hanche. L'inertie de balancement de la jambe a un impact exponentiel sur le couple requis aux hanches et genoux lors de la course.\n\nPour garantir les performances du D-Bot, la zone située **sous le genou** doit suivre une stratégie stricte : **bannir le métal massif** (sauf exception mécanique critique) au profit de solutions hybrides combinant impression 3D (Qidi Plus 4), usinage CNC (C500) et composants aérospatiaux standards.\n\nVoici la stratégie d'ingénierie optimisée composant par composant.\n\n---\n\n## 1. Le Tibia (Corps de la Jambe)\n\n* **❌ À proscrire** : Un tibia usiné en bloc d'aluminium (trop lourd, inertie catastrophique).\n* **✅ Option 1 (Full 3D Print)** : Impression sur la Qidi en **PA12-CF** (Nylon chargé carbone). Le nylon offre l'absorption des chocs (évite la rupture nette) et la fibre de carbone apporte la rigidité. *Paramètres : Remplissage gyroid 30%, 5-6 périmètres extérieurs.*\n* **🏆 Option 2 (Hybride Pro — Recommandée)** : Utiliser un **tube en fibre de carbone tressé** du commerce (ex: Ø40mm ext / Ø36mm int, épaisseur 2mm). Le rapport poids/rigidité est imbattable.\n  \n  **Où acheter le tube carbone Ø40mm ?**\n  - **Spécifications requises** : Finition sergé (Twill) 3K, procédé **\"Roll-wrapped\"** (fibres croisées préimprégnées) impératif ! Ne jamais acheter du pultrudé (fibres axiales uniquement) pour un tibia, il fendrait sous l'effort.\n  - **Fournisseurs** : Boutiques spécialisées ULM/Drones/RC comme *CarbonTube.net*, *EasyComposites*, ou sur *AliExpress* (boutiques certifiées matériaux composites comme *RJX Hobby*).\n  - *Note : Une longueur de 500 mm suffit largement pour y découper les 2 tibias (longueur estimée ~220 mm).*\n\n  **A. Montage complet HAUT (Connexion au Genou RS-04 — Bracket en L + Goupille)**\n  ![Montage_Haut](./img_tibia_montage_haut.png)\n\n  Le moteur RS-04 du genou a son **axe de sortie dans le même axe que le corps du moteur** (configuration inline). Le tibia ne peut donc pas se fixer directement dans l'axe du moteur : il faut un **bracket en forme de L** pour faire le renvoi à 90°.\n\n  1. **Le Bracket en L (Aluminium CNC — C500)** :\n     - Une pièce en **Aluminium 6061-T6** usinée à la CNC C500.\n     - La **branche horizontale** du L se fixe sur l'axe de sortie du RS-04 (par clavetage, vis de pression ou moyeu fendu selon le modèle).\n     - La **branche verticale** du L descend et vient envelopper le sommet du tube carbone. Elle comporte un alésage semi-circulaire ou une pince qui épouse la forme du tube Ø40mm.\n\n  2. **Le Bouchon Interne Haut (Alu ou PA12-CF)** :\n     - Identique au principe du montage bas : un bouchon massif (Ø36mm) est inséré et collé (Époxy Structurale) à l'intérieur du tube carbone, sur 30 mm de profondeur.\n     - **Rôle** : renforcer le tube carbone contre l'écrasement lors du goupillage, et augmenter la surface de transmission des efforts.\n\n  3. **Goupille Mécanindus Traversante (Sécurité Anti-arrachement)** :\n     - Même principe que le montage bas : une **goupille élastique Ø3mm** traverse de part en part : *Bracket Alu → Paroi Carbone → Bouchon → Paroi Carbone → Bracket Alu*.\n     - **Pourquoi ne pas se contenter de l'époxy ?** L'époxy structurale est extrêmement résistante en cisaillement et en compression, mais elle peut céder en traction pure (arrachement) sous des chocs répétés de course. La goupille garantit que le tube ne pourra **jamais** se séparer du bracket, même en cas de défaillance du joint collé.\n     - La colle époxy reste utile en complément : elle assure le zéro-jeu et distribue les contraintes sur toute la surface de contact (~34 cm²).\n\n  4. **Transmission des efforts** : *RS-04 → Axe de sortie → Bracket Alu en L → Goupille + Époxy → Bouchon → Tube Carbone*.\n\n  **B. Montage complet BAS (Connexion au Cardan DIN 808 — Goupille Mécanindus)**\n  ![Montage_Bas](./img_tibia_montage_bas.png)\n\n  La fixation du tibia dans le cardan utilise la méthode la plus robuste de l'ingénierie mécanique : une **goupille élastique Mécanindus (roll pin) traversante**. Cette solution gère à la fois l'anti-rotation ET l'anti-arrachement en un seul composant. Il n'y a besoin ni de clavette, ni de circlips, ni de bague d'arrêt.\n\n  1. **Achat du Cardan (Avec perçage sur mesure)** :\n     - Commander un **Joint de Cardan DIN 808** (ex: [Michaud Chailly A5 473](https://maurin-embedded.partcommunity.com/3d-cad-models/mod%C3%A8le-a5-473-joint-de-cardan-simple-michaud-chailly-direct-transmission?info=michaud_chailly_transmission%2Ftransmission%2Fjoints_cardans%2Fa5_473.prj&cwid=6179)).\n     - **Demander au fournisseur un perçage traversant de Ø3mm sur chaque moyeu** (usinage sur plan). Formuler la demande ainsi :\n       *\"Bonjour, je souhaite commander la référence A5-473 avec une modification : un perçage traversant de Ø3mm sur chaque moyeu pour insertion d'une goupille élastique, centré à X mm du bord.\"*\n     - *(Autres fournisseurs : HPC Europe, Norelem, Prud'homme Transmissions)*.\n\n  2. **Le Bouchon Interne (Obligatoire pour tube creux)** :\n     - Insérer et coller (Époxy Structurale) un **bouchon massif en Aluminium ou PA12-CF** (Ø36mm) à l'intérieur du tube carbone, sur 30 mm de profondeur.\n     - **Rôle critique** : Lorsque la goupille traversera le tube carbone, le bouchon empêche les fibres de carbone de s'écraser et de se délaminer sous la pression de la goupille. Sans bouchon, le tube éclaterait.\n\n  3. **Assemblage et Perçage (Canon de perçage)** :\n     - Emmancher le tube carbone (avec son bouchon collé) dans le moyeu du cardan déjà percé.\n     - **Astuce Pro** : Utiliser les trous du cardan (acier trempé) comme **canon de perçage** pour percer le tube carbone et le bouchon avec une simple perceuse. L'acier guide le foret parfaitement au centre. Aucun alignement artisanal n'est nécessaire.\n\n  4. **Insertion de la Goupille Mécanindus** :\n     - Enfoncer une **goupille élastique (roll pin) Ø3mm en acier** à l'aide d'un marteau et d'un chasse-goupille. Elle doit forcer légèrement (principe de la goupille élastique).\n     - **Résistance au cisaillement** : ~6 300 N (~630 kg) en double cisaillement, soit un **coefficient de sécurité de 5×** pour un robot de 39 kg à l'impact en course.\n     - **Résultat** : Pour séparer le tibia du cardan, il faudrait littéralement cisailler l'acier de la goupille (plusieurs tonnes de force). C'est la garantie absolue que rien ne bougera, même en cas de chute ou de saut.\n\n  > [!TIP]\n  > **Dimensionnement de la goupille selon le diamètre de l'axe :**\n  > | Diamètre Axe | Goupille Ø | Résistance cisaillement | Impact matière |\n  > |---|---|---|---|\n  > | 8 mm | 2,5 mm | ~4 400 N (~440 kg) | Acceptable (5,5 mm restants) |\n  > | 8 mm | 3 mm | ~6 300 N (~630 kg) | Limite pour la torsion |\n  > | 10 mm | 3 mm | ~6 300 N (~630 kg) | **Idéal** — très robuste |\n\n### 📐 Pourquoi un Tube Carbone et pas un Tube en Aluminium/Acier ?\n\n| Critère | **Tube Carbone 3K** (Ø40/36mm) | **Tube Aluminium 6061** (Ø40mm) | **Tube Acier** (Ø40mm) |\n|---|---|---|---|\n| **Masse** (L=220mm) | **~80 g** | ~180 g | ~450 g |\n| **Rigidité spécifique** (E/ρ) | **⭐⭐⭐⭐⭐** (~75 GPa·cm³/g) | ⭐⭐⭐ (~26 GPa·cm³/g) | ⭐⭐⭐ (~27 GPa·cm³/g) |\n| **Résistance fatigue** | **Infinie** (pas de limite d'endurance) | Limitée (fissures après ~10⁷ cycles) | Bonne |\n| **Impact inertiel** | **Minimal** — réduction de ~55% par rapport à l'alu | Référence | Catastrophique (~2,5× l'alu) |\n| **Assemblage** | Nécessite bouchon interne (collé + goupille) | Goupille directe, simple | Goupille directe, simple |\n| **Coût** | ~15-25 € (500mm) | ~5-10 € | ~5-10 € |\n\n**Verdict** : Le carbone est **2× plus léger** que l'aluminium et **5× plus léger** que l'acier, à rigidité égale ou supérieure. Pour un composant oscillant en bout de jambe (inertie distale maximale), cette réduction de masse a un **impact exponentiel** sur le couple requis aux genoux et hanches lors de la course. Le surcoût est négligeable (~15 €). Le bouchon interne (nécessaire pour protéger les fibres lors du goupillage) pèse ~15-20 g seulement.\n\n### 📐 Tube Carbone vs Lame de Carbone pour le Tibia ?\n\n| Critère | **Tube Carbone Ø40mm** | **Lame (plaque) Carbone** |\n|---|---|---|\n| **Résistance en flexion** | ⭐⭐⭐⭐⭐ Excellente dans **toutes** les directions (profil circulaire = inertie isotrope) | ⭐⭐⭐ Forte en pitch (sagittal) mais **très faible en lacet/roll** |\n| **Résistance en torsion** | ⭐⭐⭐⭐⭐ Moment d'inertie polaire élevé | ⭐⭐ Très mauvaise — une plaque fine vrille facilement |\n| **Assemblage cardan** | ⭐⭐⭐⭐ Bouchon + goupille traversante → très solide | ⭐⭐ Comment fixer un cardan sur une plaque plate ? Système de pince complexe |\n| **Poids** | ~80-100g | ~40-60g (mais à rigidité égale en 3D, il faut 2 plaques en V → poids comparable) |\n| **Amortissement passif** | Rigide (pas de flex) | ⭐⭐⭐⭐⭐ Fléchit comme un ressort à lame → absorption des chocs |\n| **Complexité** | Simple — un seul composant | Élevée — 2 plaques + pièces de jonction haut/bas |\n\n**Verdict** : Pour un tibia rigide relié à un cardan par goupille, le **tube carbone est le meilleur choix**. La lame serait intéressante uniquement dans une architecture \"tibia flexible\" (Solution S5 du document 15d), mais dans ce cas elle complète le tube, elle ne le remplace pas.\n\n---\n\n## 2. Le Bloc Moteurs Cheville (Sous le genou)\n\n* **Contexte** : Les 2 moteurs RS-03 (120 N.m combinés) génèrent un couple énorme et chauffent. Ils sont logés en haut du tibia, juste sous l'axe du genou.\n* **✅ Matériau** : **Aluminium 6061-T6 (usiné CNC C500)**.\n* **Justification** : C'est la seule exception métallique. Le métal est ici obligatoire pour encaisser les stress de torsion massifs, et surtout pour servir de **dissipateur thermique (heatsink)** aux moteurs. Puisque cette masse est située très haut (près de la base d'oscillation), son impact sur l'inertie de la foulée reste limité.\n\n---\n\n## 3. Les Bielles de Cheville (Pitch/Roll)\n\n* **✅ Matériau** : **Tubes Fibre de Carbone 3K pultrudé** (Ø ext 10mm / Ø int 8mm).\n* **Justification** :\n  1. **Flambement** : Sous des pointes à plus de 1 500 N, l'aluminium plierait. Avec le module de Young du carbone (120-150 GPa), le risque de flambement est nul.\n  2. **Poids** : ~20 g/mètre (carbone) contre ~40 g/mètre (aluminium).\n  3. **Fatigue** : Résistance cyclique virtuellement infinie, contrairement à l'alu qui micro-fissure avec les millions de pas.\n* **Embouts** : Utilisation de petites rotules en **polymère hautes performances** (ex: Igus EBRM-05), plus légères que l'acier, enchassées dans les tubes avec de la résine époxy.\n\n---\n\n## 4. Le Cardan de Cheville (Joint Universel)\n\n* **Contexte** : Articulation centrale de la cheville DIN 808.\n* **✅ Matériau** : **Aluminium (Duralumin)** si disponible, ou Acier évidé.\n* **Justification** : Un cardan standard en acier de 12mm pèse entre 150g et 200g. En trouvant la référence en alliage léger (chez Michaud Chailly ou HPC), le poids chute à ~60-80g. Ce gain de 100g, situé très bas sur la jambe, est capital. Si seule la version C45 acier est retenue (pour la robustesse extrême), un usinage au tour pour évider l'axe central est fortement recommandé.\n\n---\n\n## 5. Le Pied (Structure et Semelle)\n\nLe pied est la pièce la plus éloignée de la hanche. Son inertie est maximale. De plus, un bloc d'aluminium ici transmettrait l'onde de choc (ringing) directement dans les encodeurs des RS-03 via les bielles.\n\n**Architecture idéale (Hybride) :**\n\n1. **Le Cou-de-Pied (Interface Cardan-Pied)** : Pièce courte imprimée en **PA12-CF** (Qidi). Solide tout en amortissant les très hautes fréquences de résonance.\n2. **La Plaque Plantaire (Ossature)** : Découpée à la CNC C500 dans une feuille **plate de Fibre de Carbone (3mm)**. Outre sa légèreté extrême (~30-40g), le carbone plat agit comme un ressort à lame (Leaf Spring) et restitue de l'énergie à la poussée de l'orteil.\n3. **Les Pads d'Appui (Talon/Avant-pied)** : Imprimés sur la Qidi en **TPU (Shore 95A ou 85A)** puis collés ou vissés sous le carbone. Le TPU offre l'adhérence (grip) et l'absorption primaire de l'impact (damper).\n\n---\n\n## Bilan Massique Souhaité (Sous l'axe genou)\n\n*(Estimations pour la partie mobile, hors bloc moteurs/genou (qui reste \"en haut\"))*\n\n| Composant | Stratégie Matériau | Poids Estimé (par jambe) |\n| :--- | :--- | :---: |\n| Tibia | Tube Carbone Ø40mm + Embouts PA12-CF | ~150g |\n| Bielles | 2× Tubes Carbone Ø10/8mm + Rotules Igus | ~30g |\n| Cardan | DIN 808 Alu (Duralumin) ou Acier light | ~80g - 120g |\n| Pied | Plaque Carbone plat 3mm + Cou PA12 + Pads TPU | ~200g |\n| **Total** | **Masse mob
