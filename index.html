ute | ✅ Pied s'incline pour suivre le sol |\n| **Terrain irrégulier** | ❌ Très instable, surface d'appui réduite | ✅ Contact pied complet maintenu |\n| **Virage en marchant** | ⚠️ Très limité, transfert de poids difficile | ✅ Transfert latéral naturel |\n| **Position debout statique** | ⚠️ Oscillations latérales mal corrigées | ✅ Micro-ajustements permanents |\n| **Portage asymétrique** | ❌ Objet lourd d'un côté = déséquilibre | ✅ Compensation par inclinaison pied |\n\n> [!CAUTION]\n> **Impact estimé** : Sans Roll cheville, la stabilité latérale du robot est réduite de **40-60%** selon les publications. Le robot sera limité à des surfaces planes et parfaitement horizontales pour une marche fiable.\n\n### 7.3 Solutions Proposées\n\n#### Solution S1 : Ajout d'un moteur Roll par cheville (Config \"6 DOF Jambe\")\n\nC'est la solution la plus directe. L'idée d'un 6ème DOF (pivot cheville) a été évoquée dans une vidéo de présentation K-Scale comme extension possible du K-Bot 5 DOF/jambe, bien qu'aucune documentation écrite officielle ne détaille cette modification.\n\n**Deux variantes** sont envisagées selon le moteur Roll choisi :\n\n##### Calcul du couple Roll cheville requis\n```\nCouple Roll cheville requis (estimation) :\n= Masse × g × Décalage_latéral_CoG\n= 36 kg × 9.81 × 0.03 m (décalage latéral max)\n≈ 10.6 N.m (statique)\n≈ 15 N.m (dynamique avec marges)\n```\n\n##### Comparatif RS-00 vs RS-02 pour Cheville Roll\n\n| Paramètre | RS-00 | RS-02 |\n| :--- | :---: | :---: |\n| **Couple pic** | 14 N.m | 17 N.m |\n| **Couple nominal** | 5 N.m | 6 N.m |\n| **Poids** | **310g** | 405g |\n| **Dimensions** | **57×57×51 mm** | 78.5×78.5×45.5 mm |\n| **Prix** | **$135** | $160 |\n| **Ratio réducteur** | 10:1 | 7.75:1 |\n| **Vitesse max** | 315 RPM | 410 RPM |\n| **Marge vs 10.6 N.m** (statique) | ✅ +32% | ✅ +60% |\n| **Marge vs 15 N.m** (dynamique) | ⚠️ -7% | ✅ +13% |\n| **Surpoids (×2)** | **+620g** | +810g |\n| **Surcoût (×2)** | **+$270** | +$320 |\n| **Surface section** | **32.5 cm²** | 61.6 cm² |\n\n##### S1a : Variante RS-00 (🏆 RECOMMANDÉE)\n\n| Paramètre | Détail |\n| :--- | :--- |\n| **Moteur ajouté** | 2× RS-00 (1 par cheville) |\n| **DOF cheville** | Pitch (**RS-02 + tirant**) + **Roll (RS-00)** |\n| **Couple Roll** | 14 N.m pic (5 N.m nominal) |\n| **Surpoids** | +620g (2× 310g) |\n| **Surcoût** | +$270 (2× $135) |\n| **DOF total robot** | 22 → **24 DOF** |\n| **Encombrement** | **57×57 mm** — s'intègre facilement dans le pied |\n\n**Avantages clés** du RS-00 pour ce rôle :\n- **-190g par cheville** (×2 = -380g aux pieds) → inertie oscillante réduite = meilleure fréquence de pas\n- **47% plus compact** en surface → intégration mécanique facilitée dans le pied\n- **Ratio 10:1** (vs 7.75:1) → micro-corrections plus **précises** pour la stabilisation latérale\n- **-$50 total** sur le robot\n\n##### S1b : Variante RS-02 (option conservatrice)\n\n| Paramètre | Détail |\n| :--- | :--- |\n| **Moteur ajouté** | 2× RS-02 (1 par cheville) |\n| **DOF cheville** | Pitch (**RS-02 + tirant**) + **Roll (RS-02)** |\n| **Couple Roll** | 17 N.m pic (6 N.m nominal) |\n| **Surpoids** | +810g (2× 405g) |\n| **Surcoût** | +$320 (2× $160) |\n| **DOF total robot** | 22 → **24 DOF** |\n\n**Avantage** : +21% de couple pic → marge de 13% au-dessus du besoin dynamique.\n\n##### Impact par régime de vitesse\n\n| Régime | Couple Roll requis | RS-00 (14 N.m) | RS-02 (17 N.m) |\n| :--- | :---: | :---: | :---: |\n| **Station debout** | ~3-5 N.m | ✅ 3× marge | ✅ 4× marge |\n| **Marche lente** (<1.5 km/h) | ~8-10 N.m | ✅ +40% marge | ✅ +70% marge |\n| **Marche normale** (2-3 km/h) | ~12-14 N.m | ⚠️ Juste (~0% marge) | ✅ +21% marge |\n| **Marche rapide** (3-4 km/h) | ~15-18 N.m | ❌ Insuffisant au pic | ⚠️ Juste au pic |\n| **Terrain irrégulier** | ~10-15 N.m | ⚠️ Acceptable | ✅ OK |\n\n> [!NOTE]\n> **Analyse** : Le RS-00 est **suffisant pour la marche lente à normale** (~0-3 km/h), ce qui couvre 95% des scénarios d'un robot domestique/démo. En **marche rapide**, le couple pic de 14 N.m sera brièvement dépassé (~15-18 N.m requis), mais :\n> - Le pic dure < 50 ms par pas (correction de transfert latéral)\n> - Les moteurs RobStride supportent des **dépassements transitoires** de 20-30% pendant < 100 ms\n> - La hanche Roll (RS-03, 60 N.m) **assiste** la cheville Roll — les deux travaillent en synergie\n>\n> **En pratique**, le RS-00 est viable jusqu'à ~3 km/h. Au-delà, le RS-02 offre plus de marge, mais les deux sont insuffisants pour la course (>4 km/h) qui requiert des SEA.\n\n#### Solution S2 : Pied Passif à Compliance (Sans Moteur)\n\nAlternative mécanique sans ajout de moteur :\n\n| Paramètre | Détail |\n| :--- | :--- |\n| **Principe** | Pied articulé avec joint élastomère permettant un Roll passif (~±5°) |\n| **Moteur ajouté** | Aucun |\n| **Surpoids** | +100-200g (mécanisme passif) |\n| **Surcoût** | +$20-50 (impression 3D + élastomère) |\n| **Couple Roll** | 0 N.m (passif, retour élastique uniquement) |\n| **Complexité** | Faible — Design mécanique du pied uniquement |\n\n**Avantage** : Zéro surcoût moteur, zéro complexité électronique supplémentaire.\n\n**Inconvénient** : Pas de contrôle actif du Roll. Le pied s'adapte au sol par compliance mais ne peut pas corriger activement l'équilibre. Mieux que rien, mais insuffisant pour terrain irrégulier.\n\n#### Solution S3 : Mécanisme Parallèle Cheville 2-DOF (Design Avancé)\n\nSolution inspirée de la recherche robotique (DFKI, IEEE) :\n\n| Paramètre | Détail |\n| :--- | :--- |\n| **Principe** | 2 moteurs actionnant la cheville en parallèle (type Stewart plateforme simplifiée) |\n| **Moteurs** | 2× RS-02 ou 2× RS-06 en configuration parallèle |\n| **Avantage** | Pitch ET Roll avec un seul mécanisme compact |\n| **Surpoids** | +405-621g (1 moteur supplémentaire, le 2ème remplace le Pitch existant) |\n| **Surcoût** | +$160-230 |\n| **Complexité** | **Élevée** — Conception mécanique complexe (cinématique parallèle) |\n\n**Verdict** : Trop complexe pour un premier prototype. Recommandé uniquement pour une V2 du robot.\n\n### 7.4 Recommandation : Solution S1a (RS-00 Roll Cheville)\n\nLa Solution **S1a (RS-00)** est recommandée car :\n- ✅ Couple suffisant pour marche lente à normale (14 N.m vs ~10-12 N.m en usage courant)\n- ✅ **47% plus compact** que le RS-02 → intégration mécanique facilitée dans le pied\n- ✅ **-380g** au total aux pieds → meilleure dynamique de marche\n- ✅ **Ratio 10:1** = corrections latérales plus précises\n- ✅ **-$50** sur le coût total\n- ✅ Compatible écosystème RobStride existant (même bus CAN, même connectique)\n- ✅ Évoquée dans une vidéo K-Scale comme extension envisagée du K-Bot\n- ✅ Porte le D-Bot à **24 DOF** (objectif initial)\n\n> [!TIP]\n> **Règle de décision** : Si le robot est principalement destiné à de la marche intérieure (sol plat, ≤ 2-3 km/h) → **RS-00**. Si marche rapide fréquente en extérieur (3-4 km/h, terrain variable) → **RS-02**. Le D-Bot V1 vise la marche intérieure, donc RS-00 recommandé.\n\n---\n\n## 8. Configurations Finales Révisées\n\n### 🏆 Option C-Révisée : \"D-Bot Performance\" (RECOMMANDÉE)\n\nConserve le RS-02 avec tirant pour Pitch (architecture K-Bot) + ajout Roll cheville (**RS-00**, compact et léger) + coudes améliorés (RS-06).\n\n| Zone | Moteur | Qté | Couple Pic | Poids | Usage |\n| :--- | :---: | :---: | :---: | :---: | :--- |\n| Cou | RS-05 | 2 | 5.5 N.m | 191g | Orientation tête |\n| Poignet | RS-00 | 2 | 14 N.m | 310g | Manipulation fine |\n| Épaule Pitch/Roll | RS-03 | 4 | 60 N.m | 880g | Lever/écarter bras |\n| Épaule Yaw | RS-02 | 2 | 17 N.m | 405g | Rotation interne |\n| **Coude** | **RS-06** | **2** | **36 N.m** | **621g** | **Flexion améliorée** |\n| Hanche Pitch | RS-04 | 2 | 120 N.m | 1420g | Flexion jambe |\n| Hanche Roll/Yaw | RS-03 | 4 | 60 N.m | 880g | Équilibre/rotation |\n| Genou | RS-04 | 2 | 120 N.m | 1420g | Flexion genou |\n| **Cheville Pitch** | **RS-02** | **2** | **17 N.m** (×2 tirant = ~34 N.m) | **405g** | **Propulsion (tirant K-Bot)** |\n| **Cheville Roll** | **RS-00** | **2** | **14 N.m** | **310g** | **Stabilité latérale (compact)** |\n\n> [!NOTE]\n> **Alternative** : Remplacer le RS-00 par un RS-02 (17 N.m, $160, 405g) si une marge de couple supplémentaire est souhaitée pour la marche rapide. Coût : +$50, poids : +190g/cheville.\n\n#### Bilan Option C-Révisée\n\n| Impact | Détail |\n| :--- | :--- |\n| **Total moteurs** | **24 moteurs** (objectif D-Bot atteint ✅) |\n| **Poids moteurs** | ~18.1 kg |\n| **Poids robot total** | ~38.0 kg |\n| **Surpoids vs K-Bot** | +2.0 kg (chevilles upgrade + Roll RS-00 + coudes) |\n| **Surcoût vs K-Bot** | +$590 total |\n| **DOF total** | **24 DOF** |\n| **Marche** | ✅ Stable, propulsée, avec adaptation latérale |\n| **Marche rapide** | ✅ 2-3 km/h réalisable (Roll au pic en transitoire) |\n| **Terrain irrégulier** | ✅ Adaptation active du pied |\n| **Portage bras plié** | ✅ ~10 kg |\n\n### Option D-Révisée : \"D-Bot Maximal\"\n\nAjoute les RS-04 aux épaules en plus de la config C-Révisée :\n\n| Zone | Moteur | Qté | Couple Pic | Changement vs K-Bot |\n| :--- | :---: | :---: | :---: | :--- |\n| Épaule Pitch/Roll | **RS-04** | 4 | **120 N.m** | Upgrade RS-03→RS-04 |\n| Coude | **RS-06** | 2 | **36 N.m** | Upgrade RS-02→RS-06 |\n| Cheville Pitch | **RS-02** | 2 | **17 N.m** (×2 tirant) | Architecture K-Bot conservée |\n| Cheville Roll | **RS-00** | 2 | **14 N.m** | **NOUVEAU (compact)** |\n| Reste | Inchangé | - | - | - |\n\n| Impact | Détail |\n| :--- | :--- |\n| **Total moteurs** | **24 moteurs** |\n| **Poids robot total** | ~41.5 kg |\n| **Surcoût vs K-Bot** | +$710 total |\n| **Portage bras tendu** | **5 kg continu** |\n| **Portage bras plié** | **15+ kg théorique** |\n\n---\n\n## 9. Comparatif des Configurations\n\n| Critère | K-Bot Standard | D-Bot Perf (C-Rév.) | D-Bot Max (D-Rév.) |\n| :--- | :---: | :---: | :---: |\n| **DOF** | 20 | **24** | **24** |\n| **Moteurs** | 20 | **24** | **24** |\n| **Cheville Roll** | ❌ Absent | **RS-00 (14 N.m)** | **RS-00 (14 N.m)** |\n| **Poids robot** | 34 kg | 38.0 kg | 41.5 kg |\n| **Surcoût** | Base | +$590 | +$710 |\n| **Marche lente** | ⚠️ Shuffle | ✅ Stable | ✅ Stable |\n| **Marche normale** (2-3 km/h) | ❌ Impossible | ✅ Roll RS-00 OK | ✅ Roll RS-00 OK |\n| **Marche rapide** (3-4 km/h) | ❌ Impossible | ⚠️ Roll au pic | ⚠️ Roll au pic |\n| **Terrain irrégulier** | ❌ Impossible | ✅ Roll actif | ✅ Roll actif |\n| **Stabilité latérale** | ❌ Hanches seules | ✅ Cheville Roll | ✅ Cheville Roll |\n| **Portage bras tendu** | 2 kg | 3 kg | **5 kg** |\n| **Portage bras plié** | ~5 kg | **10 kg** | **15+ kg** |\n| **Tête articulée** | ❌ | ✅ Pan/Tilt | ✅ Pan/Tilt |\n\n> [!IMPORTANT]\n> **Cheville Roll RS-00** : Choix par défaut pour les deux configs. Plus compact (-47% surface), plus léger (-190g/cheville), moins cher (-$25/moteur). Suffisant pour marche ≤ 3 km/h. Si marche rapide fréquente (3-4 km/h), upgrade en RS-02 (+$50, +380g).\n\n> [!IMPORTANT]\n> **L'Option D-Révisée est désormais recommandée** si le portage est un objectif. Le Roll cheville compense le CdG plus haut, et la différence D vs C n'est que de +$120 / +1.35 kg pour un gain de portage majeur (5 kg bras tendu vs 3 kg). **L'Option C reste pertinente uniquement si la priorité absolue est l'autonomie batterie.**\n\n---\n---\n\n## 10. Améliorations Supplémentaires de la Stabilité\n\n> *Idées complémentaires pour optimiser l'équilibre du D-Bot, applicables à l'Option C comme D.*\n\n### 10.1 Optimisation du Design des Pieds\n\nLe design du pied est un facteur **majeur** de stabilité, souvent sous-estimé.\n\n| Amélioration | Principe | Impact | Difficulté | Coût |\n| :--- | :--- | :--- | :---: | :---: |\n| **Pieds plus grands** | Augmenter la surface d'appui (largeur +2 cm) | ✅ Base de support élargie, plus de marge CoP | Faible | ~$0 (impression 3D) |\n| **Semelle courbe (rocker)** | Courbure avant/arrière pour rouler naturellement | ✅ Transition de pas plus fluide, moins de couple cheville | Moyen | ~$10 |\n| **Orteils passifs** | Joint élastique à l'avant du pied (~15° flex) | ✅ Phase de poussée améliorée (toe-off) | Moyen | ~$5-15 |\n| **Semelle antidérapante** | Caoutchouc souple type Shore 40A collé sous le pied | ✅ Meilleure adhérence, moins de glissement | Faible | ~$5 |\n\n> [!TIP]\n> **Les pieds plus grands sont le gain de stabilité le plus simple et gratuit.** Un pied 2 cm plus large de chaque côté augmente la base de support de ~30%, ce qui donne une marge considérable au contrôleur d'équilibre.\n\n### 10.2 Placement Stratégique de la Batterie\n\nLa batterie est la **masse la plus facile à repositionner** sans impact fonctionnel.\n\n| Position | Impact CdG | Avantage | Inconvénient |\n| :--- | :--- | :--- | :--- |\n| **Torse haut** (actuel typique) | CdG haut | Facile d'accès, échange rapide | ❌ Élève le CdG |\n| **Torse bas / bassin** ✅ | CdG **bas** ✅ | Stabilité améliorée | Accès plus difficile |\n| **Dos bas (sac à dos)** | CdG moyen-bas | Bon compromis accès/stabilité | Légère protubérance |\n| **Répartie (2 batteries)** ✅ | CdG symétrique ✅ | Équilibre gauche/droite + redondance | Plus de câblage |\n\n**Recommandation** : Placer la batterie le **plus bas possible** dans le torse, idéalement au niveau du bassin. Voir le **[Guide Batterie Détaillé](./04_Electronique_Cablage.md#4-alimentation--batterie)** pour la stratégie progressive (1 batterie centrée → 2 batteries symétriques) et les spécifications semi-solide.\n\n### 10.3 IMU et Capteurs de Force\n\nL'équilibre d'un robot bipède dépend autant des **capteurs** que des actionneurs.\n\n| Capteur | Rôle | Priorité | Coût |\n| :--- | :--- | :---: | :---: |\n| **IMU haute fréquence** (≥200 Hz) | Mesure d'angle et de vitesse angulaire du torse | 🔴 **CRITIQUE** | ~$20-50 |\n| **Capteurs de force plantaires** | Mesure du Centre de Pression (CoP) sous chaque pied | 🟡 **IMPORTANT** | ~$30-80/pied |\n| **Encodeurs moteurs** (déjà inclus) | Position et vitesse articulaire | ✅ Intégré RobStride | $0 |\n\nL'IMU est **indispensable** — sans elle, le robot est aveugle à son inclinaison. Les capteurs plantaires sont un **plus significatif** qui permettent de savoir directement où se trouve le CoP au lieu de l'estimer par le modèle dynamique.\n\n### 10.4 Éléments Élastiques en Série (SEA)\n\nUne approche mécanique pour améliorer la compliance et la sécurité des interactions :\n\n| Concept | Principe | Avantage | Inconvénient |\n| :--- | :--- | :--- | :--- |\n| **SEA cheville** | Ressort entre moteur et articulation | Absorption des chocs au sol, protection du moteur | Réduit la bande passante du contrôle |\n| **SEA genou** | Idem au genou | Récupération d'énergie en phase de balancement | Complexité mécanique |\n\n**Verdict** : Intéressant pour une V2, mais ajoute une complexité mécanique significative. Les QDD RobStride ont déjà une certaine backdrivabilité grâce à leur faible ratio de réduction (9:1 à 10:1), offrant une compliance naturelle.\n\n### 10.5 DOF de Taille/Torse (Waist) — Optionnel V2\n\nBeaucoup de robots humanoïdes avancés (Unitree H2, ATLAS) ont un **DOF de rotation du torse** :\n\n| DOF Taille | Moteur Suggéré | Avantage | Quand ? |\n| :--- | :---: | :--- | :---: |\n| **Yaw** (rotation) | RS-03 | Dissocier mouvement bras/jambes, virages naturels | V2 |\n| **Pitch** (inclinaison) | RS-03 | Se pencher en avant sans bouger les hanches | V2+ |\n| **Roll** (latéral) | RS-03 | Compensation de charges latérales | V2+ |\n\n**Verdict** : Non prioritaire pour la V1. Le K-Bot standard n'en a pas et parvient à marcher. Intéressant pour une V2 si la marche rapide et le portage asymétrique deviennent des objectifs.\n\n### 10.6 Synthèse des Améliorations de Stabilité\n\n| Priorité | Amélioration | Coût | Difficulté | Statut | Impact |\n| :---: | :--- | :---: | :---: | :---: | :--- |\n| 🔴 **1** | IMU haute fréquence (BMI270 Spresense) | ~$30 | Faible | ✅ Prévu | Indispensable pour tout contrôle d'équilibre |\n| 🔴 **2** | Pieds plus grands (+2 cm) | ~$0 | Faible | ✅ Prévu | +30% de base de support |\n| 🟠 **3** | Batterie en position basse | ~$0 | Faible | ✅ Prévu | CdG abaissé de 5-10 cm |\n| 🟡 **4** | Semelle antidérapante TPU | ~$15 | Faible | ✅ Prévu | Meilleure adhérence au sol |\n| 🟡 **5** | Capteurs de force plantaires (FSR) | ~$40-60 | Moyen | ✅ Prévu | Mesure directe du CoP |\n| 🟢 **6** | Semelle courbe (rocker) | ~$10 | Moyen | 📋 V2 | Transition de pas naturelle |\n| 🟢 **7** | Orteils passifs | ~$15 | Moyen | 📋 V2 | Meilleur toe-off |\n| 🔵 **8** | SEA (élasticité série) | ~$50 | Élevé | 📋 V2 | Absorption de chocs |\n| 🔵 **9** | DOF Taille Yaw | ~$250 | Élevé | 📋 V2 | Virages naturels |\n\n> [!IMPORTANT]\n> **Les améliorations 1 à 5 seront implémentées dès la V1.** Coût total : ~$85. L'IMU (1) est déjà intégrée via la Spresense + BMI270 Add-on Board. Les pieds (2) et la batterie basse (3) sont des modifications CAD/positionnement sans coût. Les semelles TPU (4) et les FSR (5) sont détaillés ci-dessous.\n\n---\n\n### 10.7 Détail — Semelle Antidérapante TPU (Amélioration 4)\n\n#### 10.7.1 Choix du Matériau\n\n> [!NOTE]\n> **Shore A** mesure la dureté des élastomères. Plus le chiffre est bas, plus le matériau est souple et adhérent. Pour une semelle de robot bipède, la plage **80A–90A** offre le meilleur compromis entre adhérence et résistance à l'usure.\n\n| Shore A | Équivalent | Adhérence | Résistance usure | Usage |\n| :---: | :--- | :---: | :---: | :--- |\n| **70A** | Semelle running souple | ✅✅✅ | ⚠️ Faible | Trop mou, usure rapide |\n| **80A** | Pneu vélo | ✅✅ | ✅ | **🏆 Idéal sol lisse (carrelage, parquet)** |\n| **85A** | Talon de chaussure | ✅✅ | ✅✅ | Bon compromis polyvalent |\n| **90A** | Roulette de skateboard | ✅ | ✅✅ | **🏆 Idéal sol dur (béton, extérieur)** |\n| **95A** | Pneu plein robot | ⚠️ | ✅✅✅ | Trop dur, glisse sur carrelage |\n\n**Recommandation** : Imprimer **deux jeux de semelles** — 80A (intérieur) et 90A (extérieur) — et changer selon l'environnement.\n\n#### 10.7.2 Design de la Semelle\n\n```\n     ┌───────────────────────────┐\n     │     PIED D-BOT (vue dessous)     │\n     │                                   │\n     │  ┌─────────────────────────────┐  │\n     │  │        SEMELLE TPU          │  │\n     │  │                             │  │\n     │  │   ┌─────┐       ┌─────┐    │  │    ← Rainures 2mm × 1mm\n     │  │   │ FSR │       │ FSR │    │  │       Motif en chevrons\n     │  │   │  1  │       │  2  │    │  │       pour évacuation eau\n     │  │   └─────┘       └─────┘    │  │\n     │  │      (talon gauche)  (talon droit)   │\n     │  │                             │  │\n     │  │   ╲╲╲╲╲╲╲╲╲╲╲╲╲╲╲╲╲╲╲╲╲   │  │    ← Texture chevrons\n     │  │   ╱╱╱╱╱╱╱╱╱╱╱╱╱╱╱╱╱╱╱╱╱   │  │       sur toute la surface\n     │  │   ╲╲╲╲╲╲╲╲╲╲╲╲╲╲╲╲╲╲╲╲╲   │  │\n     │  │                             │  │\n     │  │   ┌─────┐       ┌─────┐    │  │\n     │  │   │ FSR │       │ FSR │    │  │\n     │  │   │  3  │       │  4  │    │  │\n     │  │   └─────┘       └─────┘    │  │\n     │  │      (avant gauche)  (avant droit)   │\n     │  └─────────────────────────────┘  │\n     │                                   │\n     └───────────────────────────────────┘\n```\n\n- **Épaisseur** : 3-4 mm (assez pour amortir, assez fin pour ne pas trop suréléver le pied)\n- **Texture** : Rainures en chevrons (type pneu tout-terrain), 2 mm de large × 1 mm de profondeur\n- **Fixation** : Encastrement + colle cyanoacrylate sur la semelle PLA/PETG du pied\n- **Poches FSR** : 4 cavités Ø20 mm × 1.5 mm creusées depuis le dessus pour accueillir les FSR 402\n\n#### 10.7.3 Paramètres d'Impression TPU\n\n| Paramètre | Valeur |\n| :--- | :--- |\n| **Filament** | TPU Shore 80A ou 90A |\n| **Buse** | 0.4 mm standard (pas besoin de tungstène) |\n| **Température buse** | 220-240°C (selon filament) |\n| **Température plateau** | 50-60°C |\n| **Vitesse** | **15-25 mm/s** (TPU souple = imprimer lentement) |\n| **Rétraction** | **Désactivée** ou très courte (0.5 mm, directe uniquement) |\n| **Remplissage** | 100% (semelle = surface de contact, pas de creux) |\n| **Hauteur couche** | 0.2 mm |\n| **Ventilateur** | 50-80% |\n| **Extrudeur** | **Direct Drive obligatoire** — le TPU <90A ne passe PAS en Bowden |\n\n> [!WARNING]\n> **TPU 80A est TRÈS souple** — il nécessite un extrudeur **Direct Drive** (type MK3S, Prusa XL, Bambu Lab). Si votre imprimante est en Bowden, utiliser du 90A minimum ou acheter un adaptateur Direct Drive. Le TPU 80A en Bowden va se coincer dans le tube PTFE.\n\n> [!TIP]\n> **Compatibilité Qidi X-Plus 4** : La Qidi X-Plus 4 est équipée d'un **extrudeur Direct Drive** avec engrenages en acier trempé et un hotend monobloc pouvant atteindre 370°C. Le TPU 88A Francofil est **parfaitement compatible** :\n> - ✅ **Direct Drive** = le filament souple ne peut pas se coincer (pas de tube Bowden long)\n> - ✅ **Tête titane** = aucun problème, le TPU s'imprime à 220-240°C (bien dans les capacités)\n> - ✅ **Chambre chauffée** = laisser la porte **ouverte** pour le TPU (pas besoin de chaleur, au contraire)\n> - ⚠️ **Capteur de filament** = le TPU souple peut ne pas déclencher le capteur de filament — le pousser manuellement si besoin\n> - **Vitesse recommandée** : 20-30 mm/s max (la X-Plus 4 peut aller à 600 mm/s mais le TPU déteste la vitesse)\n> - **Rétraction** : 0.5 mm max, vitesse rétraction 20 mm/s (le Direct Drive de la Qidi gère bien)\n\n#### 10.7.4 Où Acheter le TPU (France / Europe)\n\n| Fournisseur | Shore | Prix/kg | Lien | Note |\n| :--- | :---: | :---: | :--- | :--- |\n| **Francofil** 🇫🇷 | TPE 88A | ~€35/kg | [francofil.fr](https://www.francofil.fr) | 🏆 Fabricant français, mention \"semelles\" |\n| **Recreus Filaflex** 🇪🇸 | 82A / 95A | ~€40/kg | [recreus.com](https://recreus.com) | Large gamme Shore, EU |\n| **Spectrum S-Flex** 🇵🇱 | 90A | ~€35/kg | [center3dprint.com](https://center3dprint.com) | Bonne résistance usure, EU |\n| **WASP TPU** 🇮🇹 | 80A | ~€40/kg | [3dwasp.shop](https://3dwasp.shop) | Spécialisé flexible |\n| **PrimaSelect** 🇸🇪 | 80A | ~€38/kg | [3dprima.com](https://3dprima.com) | Bonne qualité, dispo EU |\n| **Formfutura Python** 🇳🇱 | 90A | ~€45/kg | [3djake.fr](https://3djake.fr) | Industriel, anti-UV |\n\n> [!TIP]\n> **Recommandation achat** : Commencer par le **Francofil TPE 88A** (~€35/kg, fabriqué en France). C'est le meilleur compromis adhérence/imprimabilité. Si trop souple pour vos pistes, passer au **Spectrum S-Flex 90A**.\n\n---\n\n### 10.8 Détail — Capteurs de Force Plantaires FSR (Amélioration 5)\n\n#### 10.8.1 Choix du Capteur : FSR 402\n\n> [!NOTE]\n> Les **FSR (Force Sensing Resistors)** sont des capteurs polymères dont la résistance diminue quand la force augmente. Ce sont les capteurs les plus utilisés pour la mesure de pression plantaire des robots bipèdes (publications IEEE, recherche ZMP/CoP).\n\n| Caractéristique | FSR 402 (Interlink) |\n| :--- | :--- |\n| **Type** | Résistif à force (FSR) |\n| **Forme** | Rond, Ø18.3 mm zone active |\n| **Épaisseur** | 0.46 mm (se glisse sous une semelle) |\n| **Plage de force** | 0.1 N – 10 N (extensible à 100 N avec résistance adaptée) |\n| **Temps de réponse** | < 3 ms |\n| **Interface** | 2 fils — simple diviseur de tension |\n| **Prix** | ~$7-8 / unité (×4 = **~$30 par pied**) |\n| **Durée de vie** | > 10 millions d'actuations |\n\n**Alternatives évaluées** :\n\n| Capteur | Prix | Avantage | Limite |\n| :--- | :---: | :--- | :--- |\n| **FSR 402** | ~$7 | 🏆 Fin, rond, adapté pied | Plage 10 N (extensible) |\n| FSR 406 | ~$8 | Plus grand (carré 44mm) | Trop grand pour notre pied |\n| FSR 408 | ~$10 | Longue bande | Pas adapté CoP ponctuel |\n| Velostat DIY | ~$1 | Ultra pas cher | Imprécis, dérive |\n| Capteur piézo | ~$2 | Très rapide | Mesure impacts, pas force statique |\n| Cellule de charge | ~$15 | Très précis | Trop encombrant pour un pied |\n\n**Verdict** : **4× FSR 402 par pied** (8 au total pour les 2 pieds) = la solution standard en robotique bipède.\n\n#### 10.8.2 Placement — Configuration 4 Points\n\n```\n                PIED D-BOT (vue dessous)\n     ┌───────────────────────────────────┐\n     │                                   │\n     │    (arrière / talon)              │\n     │                                   │\n     │    FSR 1 ●─────────────● FSR 2    │    ← 2 capteurs talon\n     │    (x₁,y₁)            (x₂,y₂)    │       Portent ~60% du poids\n     │                                   │\n     │           Centre Pied             │\n     │                                   │\n     │    FSR 3 ●─────────────● FSR 4    │    ← 2 capteurs avant-pied\n     │    (x₃,y₃)            (x₄,y₄)    │       Portent ~40% du poids\n     │                                   │\n     │    (avant / orteils)              │\n     │                                   │\n     └───────────────────────────────────┘\n```\n\n**Position recommandée** (pied de ~12 × 8 cm) :\n\n| FSR | Position | Coordonnées (x, y) mm | Rôle |\n| :---: | :--- | :---: | :--- |\n| **1** | Talon gauche | (20, 25) | Phase d'appui talon (heel strike) |\n| **2** | Talon droit | (20, 55) | Phase d'appui talon |\n| **3** | Avant gauche | (90, 25) | Phase de propulsion (toe-off) |\n| **4** | Avant droit | (90, 55) | Phase de propulsion |\n\n#### 10.8.3 Circuit Électrique — Diviseur de Tension\n\nChaque FSR 402 nécessite un **diviseur de tension** pour être lu par un ADC (la Spresense a 6 entrées analogiques sur l'Extension Board) :\n\n```\n        3.3V (Spresense)\n         │\n         │\n    ┌────┴────┐\n    │  FSR    │    ← R_fsr varie : 1 MΩ (0 force) → ~1 kΩ (force max)\n    │  402    │\n    └────┬────┘\n         │\n         ├──────── A0 (Spresense ADC)    ← Lecture analogique\n         │\n    ┌────┴────┐\n    │  R_ref  │    ← Résistance fixe de référence\n    │  10 kΩ  │       Choix : 10 kΩ pour plage 0.1-10 N\n    └────┬────┘       (utiliser 1 kΩ si plage 10-100 N souhaitée)\n         │\n        GND\n```\n\n**Formule** : `V_out = V_cc × R_ref / (R_fsr + R_ref)`\n\n- Sans force : R_fsr ≈ 1 MΩ → V_out ≈ 0.03 V (≈ bruit)\n- Force légère (1 N) : R_fsr ≈ 30 kΩ → V_out ≈ 0.83 V\n- Force moyenne (5 N) : R_fsr ≈ 5 kΩ → V_out ≈ 2.2 V\n- Force forte (10 N) : R_fsr ≈ 1 kΩ → V_out ≈ 3.0 V\n\n#### 10.8.4 Câblage Spresense\n\n```\n    Spresense Extension Board\n    ┌──────────────────────────┐\n    │                          │\n    │   A0 ◄── FSR 1 (pied L, talon G)\n    │   A1 ◄── FSR 2 (pied L, talon D)\n    │   A2 ◄── FSR 3 (pied L, avant G)\n    │   A3 ◄── FSR 4 (pied L, avant D)\n    │   A4 ◄── FSR 5 (pied R, talon G)\n    │   A5 ◄── FSR 6 (pied R, talon D)\n    │                          │\n    │   GPIO D2 ◄── FSR 7 via MUX   │  ← Si >6 capteurs : utiliser\n    │   GPIO D3 ◄── FSR 8 via MUX   │    un MUX analogique CD4051\n    │                          │\n    │   3.3V ──► Alimentation FSR\n    │   GND  ──► Masse commune\n    │                          │\n    └──────────────────────────┘\n```\n\n> [!NOTE]\n> La Spresense Extension Board a **6 entrées analogiques** (A0-A5). Pour 8 capteurs FSR (4 par pied), deux solutions :\n> - **Option A** : Utiliser un **MUX analogique CD4051** (~$1) pour multiplexer les 2 derniers FSR sur A4/A5 via GPIO de sélection.\n> - **Option B** : Connecter 6 FSR directement (3 par pied, triangle : talon, avant-gauche, avant-droit) — suffisant pour un CoP 3 points.\n>\n> **Recommandation** : Option B (3 FSR/pied = 6 total) est plus simple et suffit largement pour le calcul du CoP. La triangulation 3 points donne le même résultat mathématique qu'une quadrilatère.\n\n#### 10.8.5 Calcul du Centre de Pression (CoP)\n\nLe CoP se calcule comme la **moyenne pondérée des positions des capteurs**, pondérée par la force mesurée :\n\n```\nCoP_x = Σ(Fᵢ × xᵢ) / Σ(Fᵢ)\nCoP_y = Σ(Fᵢ × yᵢ) / Σ(Fᵢ)\n```\n\n**Code C++ pour Spresense** (intégré dans le watchdog existant) :\n\n```cpp\n// ─── Capteurs de Force Plantaires (FSR 402) ─────────────────\n// 3 FSR par pied (6 total), lus sur A0-A5\n// Coordonnées en mm depuis le coin arrière-gauche du pied\n\nstruct FSR_Sensor {\n    int pin;        // Pin analogique\n    float x_mm;     // Position X sur le pied (mm)\n    float y_mm;     // Position Y sur le pied (mm)\n};\n\n// Pied GAUCHE : 3 capteurs (talon, avant-gauche, avant-droit)\nFSR_Sensor fsr_left[3] = {\n    {A0, 20.0, 40.0},   // Talon centre\n    {A1, 90.0, 20.0},   // Avant gauche\n    {A2, 90.0, 60.0},   // Avant droit\n};\n\n// Pied DROIT : 3 capteurs\nFSR_Sensor fsr_right[3] = {\n    {A3, 20.0, 40.0},   // Talon centre\n    {A4, 90.0, 20.0},   // Avant gauche\n    {A5, 90.0, 60.0},   // Avant droit\n};\n\n// Convertir lecture ADC en force (N) — calibration approx.\nfloat adcToForce(int adc_value) {\n    float voltage = adc_value * 3.3 / 1023.0;\n    if (voltage < 0.05) return 0.0;  // Seuil de bruit\n    // R_fsr = R_ref × (Vcc - Vout) / Vout\n    float r_fsr = 10000.0 * (3.3 - voltage) / voltage;\n    // Courbe FSR 402 approx : F ≈ (R_fsr / 30000)^(-1.4)\n    float force = pow(r_fsr / 30000.0, -1.4);\n    return constrain(force, 0.0, 100.0);\n}\n\n// Calcul CoP pour un pied (3 capteurs)\nvoid calculateCoP(FSR_Sensor sensors[], int count,\n                  float &cop_x, float &cop_y, float &total_force) {\n    float sum_fx = 0.0, sum_fy = 0.0;\n    total_force = 0.0;\n\n    for (int i = 0; i < count; i++) {\n        float f = adcToForce(analogRead(sensors[i].pin));\n        sum_fx += f * sensors[i].x_mm;\n        sum_fy += f * sensors[i].y_mm;\n        total_force += f;\n    }\n\n    if (total_force > 0.1) {  // Seuil minimum\n        cop_x = sum_fx / total_force;\n        cop_y = sum_fy / total_force;\n    } else {\n        cop_x = -1.0;  // Pied en l'air\n        cop_y = -1.0;\n    }\n}\n\n// Publier sur ROS2 via micro-ROS ou Serial\n// Topic : /foot/left/cop  (geometry_msgs/Point)\n// Topic : /foot/right/cop (geometry_msgs/Point)\n// Topic : /foot/left/force  (std_msgs/Float32)\n// Topic : /foot/right/force (std_msgs/Float32)\n```\n\n#### 10.8.6 Utilisation du CoP en Contrôle de Balance\n\nLe CoP mesuré par les FSR est comparé au **ZMP (Zero Moment Point)** calculé par l'algorithme de marche. Si le CoP s'écarte du centre de la base de support, le contrôleur d'équilibre ajuste les moteurs :\n\n| Situation | CoP position | Action correctrice |\n| :--- | :--- | :--- |\n| Équilibre normal | Centre du pied | Aucune correction |\n| Robot penche en avant | CoP vers les orteils | Cheville pitch → flex dorsale |\n| Robot penche en arrière | CoP vers le talon | Cheville pitch → flex plantaire |\n| Robot penche à gauche | CoP vers le bord gauche | Cheville roll → éversion |\n| Pied décollé | Force totale ≈ 0 | Phase oscillante détectée |\n\n#### 10.8.7 Où Acheter les FSR\n\n| Fournisseur | Modèle | Prix/unité | Lien | Note |\n| :--- | :--- | :---: | :--- | :--- |\n| **SparkFun** | FSR 402 (Interlink) | ~$7 | [sparkfun.com](https://www.sparkfun.com/products/9375) | Référence standard |\n| **DigiKey EU** | FSR 402 | ~$7 | [digikey.fr](https://www.digikey.fr) | Livraison rapide EU |\n| **Mouser EU** | FSR 402 | ~$7 | [mouser.fr](https://www.mouser.fr) | Stock EU |\n| **AliExpress** | FSR 402 compatible | ~$2-3 | AliExpress | Clones, qualité variable |\n| **Amazon FR** | FSR 402 | ~$8-10 | amazon.fr | Dispo immédiate |\n\n> [!TIP]\n> **Budget total FSR** : 6 FSR 402 × ~$7 + 6 résistances 10 kΩ (~$1) + câblage (~$3) = **~$45**. Pas besoin de circuit imprimé : câblage direct sur les pins analogiques de l'Extension Board Spresense.\n\n---\n\n### 10.9 Résumé des Coûts — Améliorations de Stabilité V1\n\n| # | Amélioration | Composants | Coût |\n| :---: | :--- | :--- | :---: |\n| **1** | IMU BMI270 | Spresense + Add-on Board (déjà prévu) | $0 (inclus) |\n| **2** | Pieds +2 cm | Réimpression 3D (PLA/PETG) | ~$2 filament |\n| **3** | Batterie basse | Repositionnement dans le torse | $0 |\n| **4** | Semelles TPU | 1 rouleau TPU 88A Francofil (~250g utilisé) | ~$10 |\n| **5** | FSR plantaires | 6× FSR 402 + 6× R 10 kΩ + câbles | ~$45 |\n| | | **Total** | **~$57** |\n\n---\n---\n\n## 11. Re-Analyse Biomécanique — Configuration Cardan (Mars 2026)\n\n> *Cette section met à jour l'ensemble des calculs précédents avec les nouveaux paramètres du D-Bot : masse ~39 kg et architecture cheville à Cardan DIN 808 + 2× RS-03 (120 N.m par cheville, Pitch ET Roll).*\n\n### 11.1 Nouveaux Paramètres de Référence\n\n| Paramètre | Ancien (K-Bot base) | Nouveau (D-Bot Cardan) | Δ |\n| :--- | :---: | :---: | :---: |\n| **Masse totale** | 34 kg | **~39 kg** | +5 kg |\n| **Cheville Pitch (couple effectif)** | RS-02+tirant → ~34 N.m | **2× RS-03 cardan → 120 N.m** | **×3.5** |\n| **Cheville Roll (couple effectif)** | RS-00 → 14 N.m | **2× RS-03 cardan différentiel → 120 N.m** | **×8.5** |\n| **Masse distale cheville** | RS-00: 310g en bas du tibia | ~0g (moteurs RS-03 en haut du tibia) | **-310g** |\n| **Architecture cheville** | Série (tirant + direct) | Différentiel (2 bielles) | — |\n\n> [!NOTE]\n> **Paramètres géométriques conservés** : Hauteur 1.40 m, bras de levier pied ~0.10 m, longueurs segments identiques à l'analyse précédente. Seules la masse et les couples de cheville changent.\n\n---\n\n### 11.2 Marche Lente (< 1 km/h) — Recalcul\n\n#### Couple Cheville Pitch requis (statique)\n\n```\nM = 39 kg,  g = 9.81 m/s²,  L_pied = 0.10 m\n\nτ_cheville_Pitch = M × g × L_pied\n                 = 39 × 9.81 × 0.10\n                 = 38.3 N.m  (statique, pied plat)\n                 ≈ 45-55 N.m (dynamique, déroulé du pied)\n```\n\n#### Couples Hanches et Genou (marche lente, appui simple)\n\n```\nPhase appui simple : 1 jambe supporte 39 kg\n\nτ_hanche_Pitch ≈ M × g × 0.13 m (bras de levier horizontal)\n               ≈ 49.7 N.m\n\nτ_genou ≈ M × g × (L_tibia/2 + L_cuisse/2)\n        ≈ 39 × 9.81 × 0.18\n        ≈ 68.8 N.m\n\nτ_hanche_Roll ≈ M × g × 0.05 m (déport latéral CoM)\n              ≈ 19.1 N.m\n```\n\n#### Tableau Récapitulatif — Marche Lente\n\n| Articulation | Moteur | Couple Dispo (Pic) | Couple Requis | Marge | Verdict |\n| :--- | :---: | :---: | :---: | :---: | :---: |\n| **Hanche Pitch** (RS-04) | RS-04 | 120 N.m | **~50 N.m** | **+140%** | ✅ Confortable |\n| **Hanche Roll** (RS-03) | RS-03 | 60 N.m | **~20 N.m** | **+200%** | ✅ Très large |\n| **Hanche Yaw** (RS-03) | RS-03 | 60 N.m | **~15 N.m** | **+300%** | ✅ Surplus |\n| **Genou Pitch** (RS-04) | RS-04 | 120 N.m | **~69 N.m** | **+74%** | ✅ OK ← +15% vs 34 kg |\n| **Cheville Pitch** (2× RS-03) | 2× RS-03 | **120 N.m** | **~45 N.m** | **+167%** | ✅ **EXCELLENT** ← était limite ❌ |\n| **Cheville Roll** (2× RS-03) | 2× RS-03 | **120 N.m** | **~20 N.m** | **+500%** | ✅ **TRÈS LARGE** |\n\n> [!IMPORTANT]\n> **L'ancienne limite critique est résolue.** La cheville Pitch obligeait une marge de ~0% avec le RS-02+tirant (34 N.m vs 33.4 requis). Avec 2× RS-03 (120 N.m), la marge est de +167% pour **39 kg**. Cette marge suffit même pour une masse de 70 kg — le D-Bot a une réserve énorme.\n\n---\n\n### 11.3 Marche Normale (2–3 km/h) — Recalcul\n\nEn marche normale, les forces d'impact doublent par rapport au statique (facteur dynamique ×1.5–2.0 selon l'allure).\n\n```\nCouples dynamiques estimés (facteur ×1.7) :\n\nτ_cheville_Pitch ≈ 38.3 × 1.7 = 65 N.m\nτ_hanche_Pitch   ≈ 49.7 × 1.7 = 84 N.m\nτ_genou          ≈ 68.8 × 1.7 = 117 N.m   ← Proche du pic RS-04 !\nτ_cheville_Roll  ≈ 19.1 × 2.0 = 38 N.m   (corrections latérales plus rapides)\n```\n\n| Articulation | Couple Dispo (Pic) | Couple Requis (Dynamique) | Marge | Verdict |\n| :--- | :---: | :---: | :---: | :---: |\n| **Hanche Pitch** (RS-04) | 120 N.m | **~84 N.m** | +43% | ✅ OK |\n| **Genou Pitch** (RS-04) | 120 N.m | **~117 N.m** | +3% | ⚠️ **AU PIC** (transitoire) |\n| **Cheville Pitch** (2× RS-03) | 120 N.m | **~65 N.m** | **+85%** | ✅ **CONFORTABLE** |\n| **Cheville Roll** (2× RS-03) | 120 N.m | **~38 N.m** | **+216%** | ✅ **Très large** |\n\n> [!WARNING]\n> **Genou RS-04 au pic à 2-3 km/h.** À 39 kg avec facteur dynamique ×1.7, le couple genou atteint ~117 N.m, très proche du pic RS-04 (120 N.m). En pratique, les pics durent < 50 ms et les RS-04 supportent des dépassements transitoires. Mais la marge de confort est réduite. Recommandation : veiller à l'algorithme de marche pour lisser les impacts (ZMP control, courbe de jerk).\n\n> [!NOTE]\n> **Cheville : totalement résolue.** La cheville Pitch (65 N.m requis vs 120 N.m dispo) a désormais +85% de marge même à masse supérieure et en dynamique. C'est un bond qualitatif massif par rapport à l'ancienne configuration (34 N.m = 0% marge statique).\n\n---\n\n### 11.4 Seuil de Course (> 4 km/h) — Estimation\n\nLa course implique une phase de vol (les 2 pieds quittent le sol). Les couples pics sont estimés à ×2.5–3.0 fois le statique sur les articulations propulsives.\n\n```\nτ_cheville_Pitch_course ≈ 38.3 × 2.7 = 103 N.m\nτ_hanche_Pitch_course   ≈ 49.7 × 2.3 = 114 N.m\nτ_genou_course          ≈ 68.8 × 2.5 = 172 N.m  ← Dépasse RS-04 !\n\nFréquence de pas requise (4 km/h) : ~2.5 Hz\nVitesse rotation genou (4 km/h) : ~120-180 RPM\nVitesse max RS-04 : 200 RPM → ✅ Vitesse OK\n```\n\n| Articulation | Couple Dispo | Couple Requis (Course) | Marge | Verdict |\n| :--- | :---: | :---: | :---: | :---: |\n| **Hanche Pitch** (RS-04) | 120 N.m | **~114 N.m** | +5% | ⚠️ **AU PIC** |\n| **Genou Pitch** (RS-04) | 120 N.m | **~172 N.m** | ❌ -30% | ❌ **INSUFFISANT** |\n| **Cheville Pitch** (2× RS-03) | 120 N.m | **~103 N.m** | **+17%** | ✅ **Viable** ← changement majeur ! |\n| **Cheville Roll** (2× RS-03) | 120 N.m | **~50 N.m** | **+140%** | ✅ Large |\n\n> [!IMPORTANT]\n> **Révélation majeure : la cheville n'est plus le goulot d'étranglement pour la course !**\n> Avec 2× RS-03 (120 N.m), la cheville couvre +17% de marge même en phase de course à 4 km/h.\n> Le **genou RS-04 devient le nouveau goulot** (172 N.m requis vs 120 N.m disponible). Pour envisager la course (> 4 km/h), il faudrait :\n> - Un mécanisme **SEA au genou** (ressort en série = récupération d'énergie, puissance effectivement multipliée) — V2/V3.\n> - Ou un **genou à câble linéaire** (comme Optimus/Figure) permettant des actionneurs plus puissants.\n\n---\n\n### 11.5 Vitesse de Marche Maximale Estimée\n\nOn peut estimer la vitesse maximale en marche normale (sans phase de vol) en cherchant la vitesse à laquelle le genou atteint son pic (120 N.m) :\n\n```\nτ_genou(v) = 68.8 × facteur_dynamique(v)\n\nFacteur dynamique(v) ≈ 1 + 0.08 × v (estimation empirique, v en km/h)\nSeuil pic genou : 120 = 68.8 × (1 + 0.08 × v)\n                  1.743 = 1 + 0.08 × v\n                  v_max ≈ 9.3 km/h ← marche rapide large !\n```\n\n> [!TIP]\n> **Vitesse de marche max estimée : ~9 km/h.** C'est la limite théorique avant que le genou RS-04 atteigne son couple de blocage en régime de marche (sans phase de vol). En pratique, la limite réelle sera ~5-6 km/h (marge thermique, contrôle). C'est un résultat très performant, comparable au Unitree G1.\n\n---\n\n### 11.6 Re-Analyse du Portage (Impact de la Masse Supplémentaire)\n\nLe portage dépend principalement de l'épaule et du coude, pas de la masse du robot. L'augmentation de 34→39 kg n'affecte que le couple de **compensation gravitationnelle du bras propre** du robot.\n\n```\nCouple bras seul (épaule, bras tendu) = Masse_bras × g × L_bras/2\n= 3 kg × 9.81 × 0.235 m  = 6.9 N.m   (inchangé, le bras pèse toujours ~3 kg)\n```\n\nLes tableaux de portage précédents (Section 3) **restent valides** → la capacité de portage est inchangée.\n\n| Cas de Portage | Couple Épaule Requis | Couple Dispo (RS-03) | Verdict |\n| :--- | :---: | :---: | :---: |\n| **2 kg bras tendu** (continu) | ~19 N.m | 60 / 20 N.m | ✅ OK |\n| **5 kg bras tendu** (pic) | ~33 N.m | 60 N.m pic | ⚠️ Transitoire |\n| **2 kg bras tendu** (continu) | ~24 N.m | RS-06 coude : 36 N.m | ✅ OK si RS-06 |\n\n---\n\n### 11.7 Synthèse de la Validité — Configuration Cardan 39 kg\n\n| Scénario | Config Précédente (34 kg, RS-02) | Config Cardan (39 kg, 2× RS-03) | Verdict |\n| :--- | :---: | :---: | :---: |\n| **Équilibre statique** | ⚠️ Marge 0% | ✅ **+167%** | 🟢 Résolu |\n| **Marche lente (< 1 km/h)** | ✅ Viable (limite) | ✅ **Très confortable** | 🟢 Amélioré |\n| **Marche normale (2-3 km/h)** | ❌ Cheville bloquante | ✅ **Cheville OK** | 🟢 Résolu |\n| **Marche rapide (3-5 km/h)** | ❌ Impossible | ✅ **Possible (~5 km/h)** | 🟢 Nouveau! |\n| **Vitesse max estimée** | < 2 km/h | **~5-6 km/h pratique, ~9 km/h théorique** | 🟢 Majeur |\n| **Course (> 4 km/h)** | ❌ Impossible | ⚠️ **Genou bloquant** (SEA nécessaire v2) | 🟡 Partiel |\n| **Stabilité latérale (Roll)** | ❌ RS-00 limité | ✅ **120 N.m** (×8 vs avant) | 🟢 Exceptionnel |\n| **Portage bras tendu 2 kg** | ✅ OK | ✅ **Inchangé** | ✅ |\n| **Masse distale jambe** | 310g | **~0g** | 🟢 Inertie réduite |\n\n> [!IMPORTANT]\n> **Conclusion générale** : Les calculs restent valides mais dans un sens très positif. La masse augmentée de 5 kg (+15%) est largement compensée par le gain de couple de cheville (+250%). Le D-Bot avec l'architecture Cardan passe d'un robot capable de marcher lentement à un robot capable de marcher normalement à 3-5 km/h. La course reste hors portée sans SEA au genou, mais la cheville n'est plus le facteur limitant.\n\n> [!NOTE]\n> **Le genou (RS-04) devient le prochain point d'attention.** À 39 kg et 2-3 km/h, il opère à ~97% de son pic. Il n'y a pas de risque immédiat (les Robstride supportent les dépassements transitoires < 100ms), mais le contrôle de marche devra lisser les impacts. C'est un objectif de tuning algorithmique, pas un problème matériel bloquant.\n\n---\n*Section ajoutée en Mars 2026 suite à la révision de l'architecture cheville (Cardan DIN 808 + 2× RS-03) et à la mise à jour de la masse de référence (~39 kg).*\n", "Conception: 19_Perception_LiDAR": "# 19. Perception Spatiale & LiDAR — Analyse Complète\n\n> **Objectif** : Doter le D-Bot d'une perception 3D fiable pour la navigation autonome (SLAM), l'évitement d'obstacles et la cartographie en temps réel.\n\n---\n\n## 1. Besoin Fonctionnel\n\nLe D-Bot a besoin de percevoir son environnement en 3D pour :\n- **Localisation** : savoir où il est dans l'espace (SLAM).\n- **Navigation** : planifier un chemin et éviter les obstacles.\n- **Cartographie** : construire une carte de l'environnement.\n- **Sécurité** : détecter les escaliers, les trous, les marches, les objets en hauteur.\n\nPour un **bipède de 1.35 m marchant à 2-3 km/h en intérieur**, les contraintes sont :\n- FOV vertical large (voir le sol ET les obstacles en hauteur).\n- Portée ≥ 10 m (pièces, couloirs).\n- Robustesse aux vibrations de la marche.\n- Poids minimal (monté sur la tête = impact sur l'inertie cervicale).\n\n---\n\n## 2. Retour d'Expérience — Unitree L2\n\n### 2.1 Points Forts\n\n| Avantage | Détail |\n| :--- | :--- |\n| **FOV** | 360° × 96° — le FOV vertical le plus large de sa catégorie |\n| **Zone aveugle** | 0.05 m seulement (excellent pour le near-field) |\n| **Poids** | 230 g (très compact : 75×75×65 mm) |\n| **Prix** | ~$419 — le 3D LiDAR le moins cher du marché |\n| **Anti-éblouissement** | Fonctionne en extérieur (100 klux) |\n| **ROS** | Support ROS1/ROS2 natif, SLAM open-source (Point-LIO) |\n| **Précision** | ≤ 2 cm à 10 m |\n\n### 2.2 Problèmes Identifiés (Retours Communauté)\n\n> [!CAUTION]\n> L'IMU intégrée du L2 est **défectueuse** — c'est un problème confirmé par de multiples utilisateurs et **non corrigé** par Unitree.\n\n| Problème | Gravité | Détail |\n| :--- | :---: | :--- |\n| **IMU timing aléatoire** | 🔴 Critique | Intervalles de données aléatoires (2 µs – 100 ms au lieu de 500 Hz fixe). \"Widespread issue\" non corrigé. |\n| **Drift SLAM** | 🔴 Critique | L'IMU incorrecte provoque une dérive sévère avec Point-LIO sur ROS2. |\n| **Bruit nuage de points** | 🟠 Modéré | Données bruitées sur plateformes mobiles à cause du miroir rotatif. |\n| **Vibrations** | 🟠 Modéré | Le L1 (prédécesseur) était \"très sensible aux vibrations\". Le L2 réduit le problème sans l'éliminer. |\n| **Fréquence de scan** | 🟡 Mineur | 5.55 Hz — insuffisant pour FAST-LIVO2, suffisant pour marche lente. |\n\n> [!NOTE]\n> Le L1 (prédécesseur) n'a PAS ces problèmes d'IMU. C'est un **défaut spécifique au L2**, probablement lié à un changement de firmware.\n\n---\n\n## 3. Benchmark Industrie — Comment les Concurrents Perçoivent l'Espace\n\n| Robot | Stratégie | LiDAR | Caméras | IMU | SLAM |\n| :--- | :--- | :---: | :---: | :---: | :--- |\n| **Unitree G1** | LiDAR + depth cam | **Livox MID-360** | Intel RealSense D435i | Intégrée LiDAR + dédiée | LiDAR-SLAM (FAST-LIO) |\n| **Tesla Optimus** | **Vision pure** (pas de LiDAR) | ❌ | Caméras RGB multiples | IMU torse + capteurs couple | Vision end-to-end NN |\n| **Figure 02** | **Vision pure** (6 caméras) | ❌ | 6× RGB + VLM embarqué | IMU torse | Vision Language Model |\n| **Agility Digit** | LiDAR + caméras | Propriétaire | Multiples | Propriétaire | Fusion capteurs |\n| **Fourier GR-2** | Intel RealSense | ❌ | RealSense D455 + RGB | IMU torse | Visual-Inertial |\n\n**Tendance industrie** : Les robots haut de gamme (Optimus, Figure 02) abandonnent le LiDAR au profit de la vision pure grâce aux progrès de l'IA. Les robots milieu de gamme (G1) combinent LiDAR + depth camera. **Unitree n'utilise PAS le L2 sur son propre G1** — signal fort.\n\n---\n\n## 4. Alternatives Évaluées\n\n### 4.1 LiDARs 3D\n\n| LiDAR 3D | Prix | Points/s | FOV (H×V) | IMU | Poids | IP | Note |\n| :--- | :---: | :---: | :---: | :---: | :---: | :---: | :--- |\n| **Unitree L2** | **~$419** | 64k eff. | 360°×96° | ❌ Défectueuse | **230g** | IP52 | FOV vertical imbattable |\n| **Livox MID-360** | ~$600-900 | 200k | 360°×59° | ✅ | 265g | IP67 | Choix du G1, solid-state |\n| Hesai QT64 | ~$800+ | ~300k | 360°×104° | ❌ | 400g | IP67 | Excellent FOV, cher |\n| Ouster OSDome | ~$1500+ | 5.2M | 360°×180° | ❌ | 470g | IP68 | Trop cher |\n\n### 4.2 LiDARs 2D (paire avant + arrière)\n\n| LiDAR 2D | Prix unité | Portée | Points/s | Poids |\n| :--- | :---: | :---: | :---: | :---: |\n| LD-19 | ~$50 | 12m | 4.5k | 100g |\n| RPLidar A1 | ~$100 | 12m | 8k | 170g |\n| RPLidar A2 | ~$285 | 12m | 16k | 190g |\n| YDLIDAR X4 Pro | ~$80 | 10m | 5k | 115g |\n\n> [!WARNING]\n> **2D LiDAR ❌ inadapté pour un bipède** : un LiDAR 2D scanne un seul plan horizontal. Sur un bipède qui oscille en pitch/roll à chaque pas, le plan de scan bouge en permanence. Zéro information verticale = escaliers, seuils de porte et objets en hauteur invisibles.\n\n### 4.3 Vision Pure (Multi-Caméras)\n\n| Config | Caméras | FOV combiné | GPU Jetson Orin | Faisabilité |\n| :--- | :---: | :---: | :---: | :---: |\n| OAK-D Pro seul | 1 stéréo | ~80° depth | ~15% GPU | ✅ Trivial |\n| OAK-D Pro + 1 cam arrière | 2 unités | ~160° | ~30% GPU | ✅ Réaliste |\n| OAK-D Pro + 2 cam latérales | 3 unités | ~240° | ~50% GPU | ⚠️ Lourd |\n| 4-6 caméras (style Figure 02) | 4-6 | 360° | >70% GPU | ❌ Hors budget GPU |\n\nLa vision pure est insuffisante à notre niveau : pas assez de puissance IA pour du visual SLAM end-to-end, sensible aux conditions de lumière et aux surfaces sans texture.\n\n---\n\n## 5. Solution Retenue — Triple Fusion L2 + OAK-D Pro + BMI270\n\n### 5.1 Principe\n\n> [!IMPORTANT]\n> **La clé de notre solution** : séparer le LiDAR de son IMU défectueuse, le monter sur le **torse** (position stable pour le SLAM), et fusionner avec l'OAK-D Pro sur la **tête** (orientable pour la perception locale). C'est l'approche du G1 (MID-360 sur torse + RealSense en tête), adaptée à notre budget.\n\n```\n                    ┌─────────────────┐\n                    │   TÊTE D-BOT     │    ← 2 DOF (2× RS-05 : Pitch + Yaw)\n                    │   (orientable)   │       Gaze Control actif (VOR)\n                    │  ┌────────────┐  │\n                    │  │ OAK-D Pro  │  │  ← Depth Camera : 80° cone, 640×480 pixels\n                    │  │ (stéréo)   │  │     Nuage de points DENSE (près, 0-10m)\n                    │  └────────────┘  │     Orientation active → regarde où il faut\n                    └────────┬─────────┘\n                             │ Cou (2× RS-05)\n                    ┌────────┴─────────┐\n                    │   TORSE (haut)    │\n                    │                  │\n                    │  ┌────────────┐  │\n                    │  │ Unitree L2 │  │  ← LiDAR 3D : 360°×96°, 64k pts/s\n                    │  │ (sans IMU) │  │     Position FIXE sur torse = TF statique\n                    │  │ [silent bl]│  │     Mouvement prévisible (locomotion)\n                    │  └────────────┘  │\n                    │                  │\n                    │  ┌────────────┐  │\n                    │  │ Spresense  │  │  ← IMU BMI270 : 400 Hz, timing stable\n                    │  │ BMI270     │  │     Co-localisé avec le L2 sur le torse\n                    │  └────────────┘  │     Publie sur /imu/data\n                    └────────┬─────────┘\n                             │ USB3 × 2 + Serial\n                    ┌────────▼─────────┐\n                    │   Jetson Orin     │\n                    │                  │\n                    │  ┌────────────┐  │     ROS2 Topics :\n                    │  │  RTAB-Map  │◀─┼──── /lidar/points  (L2, 64k pts/s)\n                    │  │    ou      │◀─┼──── /oakd/depth     (dense, 80° FOV)\n                    │  │ FAST-LIO   │◀─┼──── /imu/data       (BMI270, 400 Hz)\n                    │  └────────────┘  │\n                    └──────────────────┘\n```\n\n### 5.2 Pourquoi Cette Architecture (L2 Torse / OAK-D Tête)\n\n> [!NOTE]\n> **Choix de placement du L2 sur le torse** : Le positionnement du L2 a fait l'objet d'une analyse approfondie. Le **torse** a été retenu plutôt que la tête pour 5 raisons :\n\n| Critère | L2 sur la **tête** (rejeté) | L2 sur le **torse** (retenu) |\n| :--- | :---: | :---: |\n| **SLAM stabilité** | ⚠️ Mouvements tête imprévisibles → distorsion intra-scan | ✅ Mouvement locomotion prévisible |\n| **TF ROS2** | Dynamique (lidar→head→neck→torso) | ✅ **Statique** (lidar→torso = constante) |\n| **FOV L2 suffisant sans bouger ?** | Le L2 couvre déjà 96° vertical | ✅ **96° = sol au plafond sans incliner** |\n| **Inertie cervicale** | 330g (L2+OAK-D) sur la tête | ✅ **100g** (OAK-D seul) |\n| **OAK-D libre de pointer ?** | ❌ Mouvements tête perturbent le L2 | ✅ **Tête 100% dédiée à l'OAK-D** |\n| **Benchmark G1** | — | ✅ Le G1 fait exactement cela |\n\n**Séparation des rôles** :\n\n| Rôle | Capteur | Position | Ce qu'il apporte |\n| :--- | :--- | :---: | :--- |\n| **SLAM global (360°)** | L2 (360°×96°) | **Torse** (fixe) | Cartographie, localisation — mouvement stable et prévisible |\n| **Perception locale (orientable)** | OAK-D Pro (~80°) | **Tête** (2 DOF) | Obstacles proches, reconnaissance, densité adaptative |\n| **Odométrie inertielle** | BMI270 (400 Hz) | **Torse** (co-localisé L2) | Compensation locomotion, stabilité SLAM |\n\n**Résultat** : la zone **devant le robot** (là où il marche) bénéficie de la **densité OAK-D Pro** (~300k pixels depth), orientable par le cou. Le **reste** (côtés, arrière, sol, plafond) est couvert par le L2 avec 64k pts/s en position stable — optimal pour le SLAM.\n\n> [!TIP]\n> **Compensation de densité** : L'OAK-D Pro produit ~**300 000 points de profondeur** par frame (640×480 depth map @ 30 FPS) dans son cône de 80°. Le L2 ne produit que 64 000 pts/s sur 360°×96°. En fusionnant les deux, la **densité effective dans la zone de marche** est **5× supérieure** au L2 seul — et même supérieure au Livox MID-360 dans cette zone !\n>\n> De plus, l'OAK-D étant sur la tête orientable, le robot peut **diriger le cône dense là où c'est nécessaire** : vers le sol en course, vers un objet d'intérêt à l'arrêt, vers une porte à franchir.\n\n### 5.3 Comparaison Densité Effective (Zone Avant 80°)\n\n| Source | Points dans le cône avant 80° | Fréquence |\n| :--- | :---: | :---: |\n| L2 seul | ~14k pts/s (80°/360° × 64k) | 5.55 Hz |\n| OAK-D Pro depth | ~300k pts/frame | 30 Hz |\n| **L2 + OAK-D Pro fusionnés** | **~314k pts/frame** | **30 Hz** |\n| Livox MID-360 (80°/360°) | ~44k pts/s | 10 Hz |\n\n→ Notre solution budget bat le MID-360 en densité locale !\n\n### 5.4 Intégration Logicielle (ROS2)\n\n**Algorithme SLAM recommandé** : **RTAB-Map** (ROS2)\n\nRTAB-Map accepte nativement :\n- Un nuage de points 3D (topic `/lidar/cloud`) → L2\n- Une paire stéréo / depth map (topic `/oakd/depth`, `/oakd/rgb`) → OAK-D Pro\n- Un flux IMU (topic `/imu/data`) → BMI270\n\n```yaml\n# Exemple de launch RTAB-Map avec fusion L2 + OAK-D Pro + IMU\nrtabmap_ros:\n  parameters:\n    subscribe_depth: true        # OAK-D Pro depth\n    subscribe_scan_cloud: true   # L2 point cloud\n    wait_imu_to_init: true       # BMI270\n\n  remappings:\n    rgb/image: /oakd/rgb/image_raw\n    rgb/camera_info: /oakd/rgb/camera_info\n    depth/image: /oakd/stereo/depth\n    scan_cloud: /lidar/cloud\n    imu: /imu/data\n```\n\n### 5.5 Mitigation des Faiblesses du L2\n\n| Problème | Solution | Coût |\n| :--- | :--- | :---: |\n| **IMU défectueuse** | Ignorer l'IMU L2, utiliser BMI270 Spresense (400 Hz, timing stable) | $0 (déjà prévu) |\n| **Bruit nuage de points** | Filtre **Statistical Outlier Removal** (SOR) dans le pipeline PCL ROS2 | $0 (logiciel) |\n| **Vibrations miroir rotatif** | Montage sur **silent blocks caoutchouc** (amortissement 50-70 Hz) | ~$5 |\n| **Faible densité (64k pts/s)** | **Fusion avec depth map OAK-D Pro** (+300k pts/frame dans le cône avant) | $0 (déjà prévu) |\n| **Fréquence scan 5.55 Hz** | Suffisant à 2-3 km/h. L'OAK-D Pro couvre à 30 Hz pour les obstacles proches | — |\n\n---\n\n## 6. Matrice Décisionnelle Finale\n\n| # | Solution | Coût supp. | SLAM | FOV vertical | Densité zone avant | Vibrations | Verdict |\n| :---: | :--- | :---: | :---: | :---: | :---: | :---: | :--- |\n| **🏆 A** | **L2 + OAK-D Pro + BMI270** | **$419** | ✅✅ | **96°** ⚡ | **314k pts** ⚡ | ⚠️ (amortisseur) | **Retenu — Meilleur rapport perf/prix** |\n| B | MID-360 + OAK-D Pro | $700-900 | ✅✅ | 59° ⚠️ | ~344k pts | ✅ (solid-state) | Bon mais FOV vertical insuffisant |\n| C | OAK-D Pro seul | $0 | ⚠️ | 80° cone | 300k pts | ✅ | Insuffisant (pas de 360°) |\n| D | 2× LiDAR 2D + OAK-D Pro | $100-200 | ❌ | Plan unique | 300k pts + 2D | ⚠️ | ❌ Inadapté bipède |\n| E | Vision pure multi-cam | $50-200 | ⚠️ | Variable | Élevée | ✅ | ❌ Hors capacité IA |\n\n---\n\n## 7. Évolutions Possibles\n\n| Phase | Évolution | Raison |\n| :--- | :--- | :--- |\n| **Phase 4 V1** | L2 + OAK-D Pro + BMI270 (config retenue) | Couverture 360° + densité avant + IMU fiable |\n| **Phase 4 V2** | + 1 caméra USB arrière (~$50) | Couverture depth 360° (avant + arrière) |\n| **Phase 5+** | Réévaluer Livox MID-360 v2 ou équivalent solid-state | Si le bruit L2 est problématique en pratique |\n| **2027+** | Puce IA embarquée + visual SLAM end-to-end | Quand les frameworks vision seront matures pour bipèdes |\n\n---\n\n## 8. Montage Physique\n\n```\n            ┌────────────────────────┐\n            │      TÊTE D-BOT        │    ← Orientable (2× RS-05)\n            │                        │       Légère : OAK-D seul (100g)\n            │   ┌──────────┐         │\n            │   │ OAK-D Pro│ ←→ 🔵   │    ← En façade, centré\n            │   │ (front)  │         │       Fixation M4 sur support alu\n            │   └──────────┘         │\n            └────────┬───────────────┘\n                     │ Cou (2× RS-05)\n            ┌────────┴───────────────┐\n            │    TORSE HAUT          │    ← Position fixe, stable\n            │                        │\n            │   ┌──────────┐         │    ← L2 monté devant le cou,\n            │   │ L2 (fix) │         │       sur 4 silent blocks Ø6mm\n            │   └──────────┘         │       vis M3 + rondelles caoutchouc\n            │                        │       TF statique lidar→torso\n            │   ┌──────────┐         │\n            │   │Spresense │         │    ← BMI270 co-localisé avec L2\n            │   │ BMI270   │         │       Même repère = meilleure fusion\n            │   └──────────┘         │\n            └────────────────────────┘\n```\n\n**Avantage clé du montage** : Le L2 et le BMI270 sont **co-localisés sur le torse** → leur repère est quasi-identique, ce qui simplifie la fusion IMU+LiDAR dans l'algorithme SLAM (pas de bras de levier entre les deux capteurs).\n\n**Câblage** :\n- L2 → USB3 (câble fourni, passé dans le cou) → Jetson Orin USB-A #1\n- OAK-D Pro → USB3 (câble DepthAI, flexible dans le cou) → Jetson Orin USB-A #2\n- BMI270 → Serial (via Spresense) → Jetson Orin USB-C (ou micro-ROS)\n\n> [!NOTE]\n> Les câbles USB de l'OAK-D Pro passent par le cou articulé. Prévoir un **câble USB3 spiralé ou extra-souple** (type câble robot industriel) pour supporter les rotations du cou sans fatigue mécanique. Longueur recommandée : 30-40 cm avec mou.\n\n---\n\n## 9. Stabilisation Active du Regard (Gaze Control)\n\n### 9.1 Le Problème en Marche Rapide / Course\n\nÀ mesure que la vitesse augmente, le **torse oscille** en pitch (±5-15°) et roll (±3-8°) à chaque foulée. Ces oscillations :\n- **Flouttent l'image** de l'OAK-D Pro (motion blur → depth map dégradée).\n- **Déplacent le cône OAK-D** verticalement → le robot \"perd de vue\" le sol ou la direction.\n- **Secouent le L2** (sur le torse) → bruit modéré, mais mouvement prévisible (compensable par IMU).\n\n### 9.2 La Solution : le Réflexe Vestibulo-Oculaire (VOR) du D-Bot\n\n> [!IMPORTANT]\n> **La tête du D-Bot dispose de 2 DOF** (2× RS-05 : Pitch + Yaw) qui permettent une **stabilisation active du regard de l'OAK-D Pro**, exactement comme le réflexe vestibulo-oculaire humain compense les mouvements de la tête pendant la marche. Le L2, fixé sur le torse, n'a **pas besoin** de VOR — ses oscillations sont prévisibles et compensées par le BMI270 co-localisé.\n\n**Principe** : Le BMI270 (IMU torse) mesure les oscillations du corps en temps réel. Le contrôleur de la tête applique une **compensation inverse** sur les moteurs du cou pour maintenir l'OAK-D Pro orienté de manière stable, indépendamment des mouvements du torse.\n\n```\n            Oscillation du torse (marche/course)\n                    ┌──────────────┐\n                    │   TORSE      │    ← Pitch ±10°, Roll ±5°\n                    │ ┌──────┐     │\n                    │ │  L2  │ fixe│    ← L2 subit les oscillations torse\n                    │ └──────┘     │       MAIS mouvement prévisible\n                    │ ┌──────┐     │       → compensé par BMI270 dans SLAM\n                    │ │BMI270│     │\n                    │ └──────┘     │\n                    └────┬─────────┘\n                         │ Cou 2× RS-05\n           ╔═════════════╧══════════════╗\n           ║   COMPENSATION INVERSE     ║\n           ║                            ║\n           ║  θ_tête = -θ_torse × k     ║    ← k ∈ [0.8, 1.0] (gain VOR)\n           ║  + bias selon vitesse       ║       Uniquement pour l'OAK-D\n           ║                            ║\n           ╚═════════════╤══════════════╝\n                    ┌────┴─────┐\n                    │   TÊTE   │    ← Stable dans le repère monde\n                    │ OAK-D Pro│       Image nette, depth map précise\n                    └──────────┘\n```\n\n> [!TIP]\n> **Avantage clé de l'architecture L2-torse / OAK-D-tête** : Le VOR ne doit stabiliser que **100g** (OAK-D Pro seul) au lieu de 330g (L2+OAK-D). Les RS-05 ont une marge de vitesse immense et l'inertie cervicale réduite améliore toute la dynamique de marche.\n\n### 9.3 Modes de Regard par Phase de Locomotion\n\n| Phase | Vitesse | Pitch tête (OAK-D) | Yaw tête | OAK-D cible | L2 (torse, fixe) |\n| :--- | :---: | :--- | :--- | :--- | :--- |\n| **Debout / Station** | 0 km/h | Libre (exploration) | Libre | Scène en face / objet d'intérêt | SLAM 360° continu |\n| **Marche lente** | 1-2 km/h | VOR actif (-pitch torse) | Direction marche | Sol 1-5m devant | SLAM optimal |\n| **Marche rapide** | 3-4 km/h | VOR actif + bias -15° | Direction marche | **Sol + obstacles proches** | SLAM bon (filtré SOR) |\n| **Course** | 5-8 km/h | VOR actif + bias -20° | Direction course | **Sol immédiat 0-3m** | SLAM dégradé mais compensé BMI270 |\n\n**En mode course**, la tête s'incline davantage vers le bas (bias -15° à -20°) pour **maximiser la couverture du sol** de l'OAK-D à proximité immédiate. C'est critique : à 6 km/h (1.67 m/s), le robot parcourt ~1.7 m entre chaque scan L2 (5.55 Hz). L'OAK-D Pro à 30 FPS comble ce gap en scannant le sol toutes les 33 ms = ~5.5 cm d'avancée.\n\n> [!NOTE]\n> **Indépendance tête/torse** : En mode exploration (debout, station), la tête peut librement regarder autour sans perturber le SLAM LiDAR. C'est **impossible** avec le L2 sur la tête — chaque mouvement de curiosité aurait perturbé le scan.\n\n### 9.4 Implémentation ROS2 (Gaze Stabilization Node)\n\n```python\n#!/usr/bin/env python3\n\"\"\"\nD-Bot Gaze Stabilization — Vestibulo-Ocular Reflex (VOR)\nCompense les oscillations du torse en temps réel via les 2 DOF tête.\n\"\"\"\nimport rclpy\nfrom rclpy.node import Node\nfrom sensor_msgs.msg import Imu\nfrom std_msgs.msg import Float32\n\nclass GazeStabilizer(Node):\n    def __init__(self):\n        super().__init__('gaze_stabilizer')\n        \n        # IMU torse (BMI270 via Spresense)\n        self.sub_imu = self.create_subscription(\n            Imu, '/imu/data', self.imu_callback, 10)\n        \n        # Commandes moteurs tête\n        self.pub_pitch = self.create_publisher(Float32, '/head/pitch_cmd', 10)\n        self.pub_yaw = self.create_publisher(Float32, '/head/yaw_cmd', 10)\n        \n        # Paramètres VOR\n        self.vor_gain_pitch = 0.9   # Compensation à 90%\n        self.vor_gain_yaw = 0.85\n        self.speed_mode = 'walk'    # walk, fast_walk, run\n        \n        # Bias selon vitesse (inclinaison sol)\n        self.pitch_bias = {\n            'stand': 0.0,       # Exploration libre\n            'walk': -5.0,       # Léger regard vers le sol\n            'fast_walk': -15.0, # Sol + obstacles proches\n            'run': -20.0,       # Sol immédiat prioritaire\n        }\n    \n    def imu_callback(self, msg):\n        # Extraire pitch et yaw du torse\n        torso_pitch = self._quat_to_pitch(msg.orientation)\n        torso_yaw_rate = msg.angular_velocity.z\n        \n        # Compensation inverse (VOR)\n        head_pitch = -torso_pitch * self.vor_gain_pitch\n        head_pitch += self.pitch_bias.get(self.speed_mode, 0.0)\n        \n        head_yaw_correction = -torso_yaw_rate * self.vor_gain_yaw * 0.01\n        \n        # Publier commandes\n        self.pub_pitch.publish(Float32(data=head_pitch))\n        self.pub_yaw.publish(Float32(data=head_yaw_correction))\n```\n\n---\n\n## 10. Analyse par Régime de Vitesse\n\n### 10.1 La Triple Fusion est-elle Suffisante en Course ?\n\n| Critère | Marche (2 km/h) | Marche rapide (4 km/h) | Course (7 km/h) |\n| :--- | :---: | :---: | :---: |\n| **Distance entre scans L2** | ~10 cm | ~20 cm | ~35 cm |\n| **OAK-D entre frames** | ~1.8 cm | ~3.7 cm | ~6.5 cm |\n| **Vibrations torse (= L2)** | Faibles (±3°) | Modérées (±8°) | Fortes (±15°) |\n| **L2 SLAM (torse fixe)** | ✅ Excellent | ✅ Bon (BMI270 compense) | ⚠️ Dégradé mais compensé BMI270 |\n| **VOR OAK-D (tête)** | ✅ RS-05 : ~21 rad/s max | ✅ Marge confortable | ✅ 15°×5Hz = 75°/s << 21 rad/s |\n| **OAK-D motion blur** | ❌ Négligeable | 🟡 Gérable (VOR) | 🟠 Résiduel malgré VOR |\n| **Masse VOR (tête seule)** | ✅ 100g OAK-D seul | ✅ Réactif | ✅ Inertie faible |\n| **Obstacles proches (OAK-D)** | ✅ Dense, orientable | ✅ Dense, VOR + bias sol | ✅ Dense, VOR + bias -20° |\n| **Verdict** | ✅✅ Optimal | ✅ Suffisant | ⚠️ Viable avec VOR |\n\n### 10.2 Pourquoi la Course Reste Viable\n\n1. **VOR léger** : Le RS-05 ne stabilise que **100g** (OAK-D seul, pas L2+OAK-D). L'oscillation torse en course (~15° × 3 Hz = ~45°/s) représente seulement **~4% de la capacité** du RS-05 (~21 rad/s). Marge immense.\n\n2. **L2 stable sur torse** : Même en course, les oscillations du torse sont **prévisibles** (locomotion régulière). Le BMI270 co-localisé compense la distorsion dans l'algorithme SLAM (motion undistortion). C'est bien mieux que si le L2 subissait les mouvements aléatoires de la tête.\n\n3. **OAK-D Pro à 30 FPS** : Même en course (1.9 m/s), l'OAK-D scanne tous les **6.5 cm** d'avancement — bien assez pour détecter les obstacles au sol. Le VOR stabilise l'image pour éviter le motion blur.\n\n4. **Redondance SLAM** : En course, si le SLAM LiDAR dérive, le **SLAM visuel OAK-D** prend le relais comme source d'odométrie principale. Le L2 contribue toujours à la localisation globale même avec un nuage filtré.\n\n5. **Stratégie de repli** : Si la course dégrade trop le SLAM, le robot peut automatiquement **ralentir à la marche rapide** pendant les phases de cartographie critique (virage, changement de pièce).\n\n### 10.3 Facteur Limitant Réel\n\nLe facteur limitant de la perception en course n'est **PAS le capteur** mais la **puissance de calcul** :\n- RTAB-Map avec fusion L2 + OAK-D + IMU à pleine vitesse → **~40-60% GPU** Jetson Orin\n- En course, les algorithmes de **planification de trajectoire** et de **contrôle de balance** consomment aussi du GPU\n- Budget GPU total disponible : ~20-30% GPU pour le planning/contrôle\n\n→ C'est largement gérable sur un Jetson Orin (NVDLA + GPU 1024-core).\n\n> [!TIP]\n> **Optimisation course** : En mode course, réduire la résolution OAK-D de 640×480 à 320×240 (75k pts/frame au lieu de 300k) pour libérer du GPU au contrôle de balance. La couverture reste suffisante pour la détection d'obstacles proches.\n", "Perception: 07_Vision_IA": "# 07 - Vision et Intelligence Artificielle\n\n## 1. Capteur Principal : Luxonis OAK-D Pro (FF)\nLe choix s'est porté sur la version **Fixed Focus (FF)** pour garantir la stabilité de l'IA malgré les vibrations mécaniques des moteurs RobStride.\n\n### Intégration Mécanique\nPour un encastrement parfait dans le visage du robot :\n- **Dimensions du perçage** : **98 x 30 mm** (prévoir +0.5 mm de tolérance).\n- **Fixation** : 2x vis M3, entraxe de **75 mm**, centrées.\n- **Passage Câble** : Encoche de **18 mm** en bas pour le connecteur USB-C coudé.\n- **Orientation** : Inclinaison de **-10° à -15°** vers le sol recommandée pour détecter les obstacles proches.\n\n### Atouts Techniques (Audit)\n- **Stéréo Active** : Contrairement à la version Lite, la Pro dispose d'un projecteur IR permettant de voir la profondeur même sur des surfaces sans texture (murs blancs unis).\n- **IMU Intégrée (BNO085/BMI270)** : Utilisée **uniquement pour la stabilisation du regard** et le V-SLAM. ⚠️ **Ne doit PAS servir pour l'équilibre du corps** car l'OAK-D est dans la tête qui bouge indépendamment du torse (2 DOF cou).\n- **Rôle dans la stratégie IMU** : Voir [Stratégie IMU](./08_Audio_Perception.md) pour la répartition des rôles (IMU tête vs IMU torse vs IMU LiDAR).\n\n## 2. LiDAR : Unitree L2\n\n### Position : Haut du Torse (avant le cou)\n- **Montage** : Fixé sur le haut du torse, devant la base du cou, **incliné de 10-20° vers l'avant**.\n- **Orientation** : Légèrement incliné vers le sol pour maximiser la détection d'obstacles proches et le SLAM au sol.\n- **Justification du placement** :\n    - ✅ **Pas de câble à passer dans le cou** (contrairement au placement sur la tête)\n    - ✅ **Position stable** : le torse bouge moins que la tête (pas de vibrations Pan/Tilt)\n    - ✅ **FOV 360°×90°** dégagé (les bras n'occultent que partiellement en position levée)\n    - ⚠️ **Occlusion partielle** par les bras lors de manipulation frontale — compensée par l'OAK-D Pro (vision stéréo)\n- **IMU intégrée** : 3 axes accéléromètre + 3 axes gyroscope, 1 kHz sampling. Utilisée pour la **fusion odométrique LiDAR-inertielle** (LIO-SLAM).\n- **Paramètres** : 128 000 pts/s bruts (64 000 effectifs), portée 30m, zone aveugle 0.05m.\n\n## 3. Stack Logicielle (NVIDIA Isaac)\n- **Isaac ROS** : Utilise les moteurs de deep learning de la Jetson pour traiter le flux OAK-D en temps réel.\n- **Isaac Gym** : Utilisé pour l'apprentissage par renforcement de la marche (Deep RL), en important l'URDF mis à jour avec la masse de l'OAK-D (91g).\n", "Perception: 08_Audio_Perception": "# 08 - Audio et Perception Sensorielle\n\n## 1. Système Audio Sony Spresense\nL'architecture audio est conçue pour l'interaction sociale et la localisation spatiale des sons.\n\n### Configuration Microphones (Audit)\n- **Standard (8 micros)** : Utilisation de microphones **MEMS numériques (PDM)**.\n- **Placement stratégique** : \n    - 2x Oreilles\n    - 1x Torse (Face)\n    - 1x Nuque (Dos)\n    - + 4x Additionnels pour le beamforming 3D.\n- **Câblage** : Utiliser impérativement des **câbles blindés** pour éviter que les interférences des antennes (LTE/Wifi) ou des moteurs ne créent de \"buzz\" audio.\n\n### Isolation Acoustique\n- **Filtrage Mécanique** : Les microphones doivent être montés sur des supports en **TPU souple** pour isoler les capteurs des vibrations haute fréquence des moteurs RobStride.\n- **Synchronisation** : La Spresense garantit une capture synchronisée à **192 kHz**, indispensable pour le calcul du TDOA (Time Difference of Arrival).\n\n## 2. Stratégie IMU (Fusion Multi-Capteurs)\n\nLe D-Bot exploite **3 IMUs** positionnées stratégiquement, chacune avec un rôle clairement défini :\n\n### Matrice des Rôles IMU\n\n| IMU | Capteur | Position | Fréquence | Rôle Principal | Rôle Secondaire |\n| :--- | :--- | :--- | :---: | :--- | :--- |\n| **IMU Torse** | **BMI270** (Add-on Spresense) | Torse (centre de masse) | **416 Hz** | 🔴 **Équilibre bipède** | Détection de chute (Watchdog) |\n| **IMU Tête** | BNO085/BMI270 (OAK-D Pro) | Front (tête) | 100 Hz | **Stabilisation regard** | V-SLAM visuel |\n| **IMU LiDAR** | IMU intégrée (Unitree L2) | Haut du torse | **1000 Hz** | **Odométrie LiDAR** (LIO-SLAM) | Fusion avec V-SLAM |\n\n### Architecture de Fusion\n\n```\nIMU Torse (BMI270, 416 Hz)\n  → Spresense (Temps Réel)\n    → Contrôle d'équilibre (hanche/cheville Roll)\n    → Détection chute si Jetson hors ligne\n    → Publie sur ROS2 : /imu/balance\n\nIMU Tête (OAK-D Pro, 100 Hz)\n  → Jetson (DepthAI / Isaac ROS)\n    → Stabilisation du regard (compensation cou Pan/Tilt)\n    → Odométrie visuelle (V-SLAM)\n    → Publie sur ROS2 : /imu/head\n\nIMU LiDAR (Unitree L2, 1000 Hz)\n  → Jetson (ROS2 driver L2)\n    → Fusion LiDAR-Inertielle (LIO-SLAM)\n    → Localisation et cartographie\n    → Publie sur ROS2 : /imu/lidar\n```\n\n### ⚠️ Erreur Fréquente à Éviter\n\nL'IMU de l'OAK-D (dans la tête) **ne doit PAS être utilisée pour l'équilibre du corps**. La tête bouge indépendamment du torse via les 2 DOF du cou (Pan RS-05 + Tilt RS-05). Son IMU mesure l'orientation de la **tête**, pas du **corps**.\n\n> **Règle** : L'IMU la plus proche du centre de masse = IMU d'équilibre. C'est le **BMI270 dans le torse** (via Spresense).\n\n### Note : Migration depuis SensiEDGE CommonSense\n\nLa carte **SensiEDGE CommonSense** (IMU LSM6DSOX + capteurs environnementaux) était initialement prévue mais **n'est pas disponible au grand public** (réservée aux clients professionnels).\n\n**Remplacement** : **BMI270 Add-on Board** (Switch Science / Bosch) — compatible Spresense, 6 axes (accéléromètre + gyroscope), I2C/SPI, bibliothèque Arduino disponible.\n\n> [!NOTE]\n> **Alternative haute précision** : Sony a sorti en février 2025 le **Spresense Multi-IMU Add-on Board** embarquant 16 MEMS IMUs fusionnées, atteignant une précision comparable aux gyroscopes à fibre optique (FOG). Cette carte est recommandée si une précision extrême est requise (marche dynamique sur terrain complexe).\n\n### Perte des Capteurs Environnementaux SensiEDGE\n\nLa SensiEDGE apportait aussi : température (HTS221), pression (LPS22HH), qualité d'air (SGP40), magnétomètre (LIS2MDL). Si ces capteurs restent souhaités pour la surveillance interne du torse :\n- **Thermistance** (~$1) : Collée sur les moteurs RS-04 les plus puissants → ADC Spresense\n- **Magnétomètre** : Non critique (pas de cap magnétique nécessaire pour un robot d'intérieur)\n- **Qualité d'air** : Non critique pour un prototype V1\n", "Fabrication: 09_Guide_Avance_Impression": "# Guide Avancé : Impression 3D Technique (PETG-CF & PA12-CF)\n\nCe guide compile les procédures critiques pour réussir vos impressions sur **Qidi Plus 4**, issues des retours techniques de Février 2026.\n\n## 1. Gestion de l'Humidité (Facteur #1 d'Échec)\nLe **PA12-CF** (Nylon) est extrêmement hygroscopique. Une exposition de 15 minutes à l'air libre suffit pour ruiner une impression.\n\n### Protocole de Séchage & Transfert\n1.  **Séchage Initial** :\n    *   **PETG-CF** : 65°C pendant 6-8h. (La Qidi Box suffit).\n    *   **PA12-CF** : 80°C - 90°C pendant 12h. (Four dédié recommandé si la Qidi Box plafonne).\n2.  **Le Transfert \"Flash\"** (PA12-CF uniquement) :\n    *   Ne laissez jamais la bobine refroidir dans le four (elle réabsorbe l'humidité).\n    *   Transférez-la dans la Qidi Box en **moins de 2 minutes**.\n3.  **Maintien en Qidi Box** :\n    *   Réglez la Box sur **60°C - 70°C** pendant toute l'impression.\n    *   **Règle absolue** : Le chemin de filament Box -> Extrudeur doit être 100% sous tube PTFE. Le moindre centimètre à l'air libre est un point de contamination.\n\n## 2. Calibration de Fiabilité (OrcaSlicer)\nPour du filament générique sur la Qidi Plus 4, la calibration manuelle est indispensable pour éviter les \"blobs\" et les clics d'extrudeur.\n\n### Calibration du Débit (Flow Rate)\n*   **Menu** : *Calibration > Flow Rate > Pass 1*.\n*   **Objectif** : Repérez la surface la plus lisse sans bourrelets.\n*   **Calcul** : $Flow_{New} = Flow_{Current} \\times (100 + Modificateur) / 100$.\n\n### Limite de Débit Volumétrique (Le verrou de sécurité)\nC'est le réglage le plus critique pour la Plus 4.\n*   **PLA Générique** : Limitez à **15 mm³/s**.\n*   **PETG Générique** : Limitez à **8 mm³/s** pour éviter l'accumulation sur la buse.\n*   **Action** : Réduisez la valeur par défaut de 20% pour garantir une fiabilité totale sur des impressions de longue durée.\n\n### Pressure Advance (Coins nets)\n*   **Valeurs typiques (Direct Drive)** : \n    *   PLA : **0.02 - 0.04**\n    *   PETG : **0.04 - 0.06**\n\n---\n\n## 3. Profils JSON Optimisés (Réglages \"Safe\")\nPlutôt que d'importer des fichiers JSON instables, modifiez ces valeurs dans vos profils @Qidi Plus4 :\n\n| Paramètre | PLA Fiable | PETG Anti-Échec |\n| :--- | :--- | :--- |\n| **Max Volumetric Speed** | 15 mm³/s | 8 mm³/s |\n| **Vitesse paroi ext.** | 60 mm/s | 60 mm/s |\n| **Z-hop** | Standard | **Spiral Z-hop** (évite les chocs) |\n| **Ventilateur Aux.** | 20% max | **OFF** (évite le warping) |\n\n---\n\n## 4. Post-Traitement : Recuit (Annealing) & Macros G-Code\nLe recuit stabilise les molécules et augmente la rigidité (+30%). Profitez de la chambre chauffée de la Qidi Plus 4.\n\n### Protocoles et Consignes\n| Matériau | Plateau / Chambre | Durée | Conseils |\n| :--- | :--- | :--- | :--- |\n| **eSUN PLA+** | 70°C / 60°C | 1h | Laisser les supports (Tree) pour éviter l'affaissement. |\n| **PETG-CF** | 85°C / 60°C | 3h | Stable dimensionnellement. |\n| **PA12-CF** | 100°C / 65°C | 8h | **Refroidissement lent** (2h porte fermée) obligatoire. |\n\n> [!CAUTION]\n> **Inserts Ruthex** : Ne faites JAMAIS de recuit sur des pièces équipées d'inserts. Le plastique ramollirait et les inserts se décentreraient. **Recuit d'abord, inserts après.**\n\n### Macros G-Code (Recuit Automatique de Fin d'Impression)\nPour une automatisation totale, insérez ces scripts dans votre \"End G-code\" dans OrcaSlicer. La pièce reste ainsi fixée au plateau, ce qui réduit drastiquement le retrait.\n\n#### 1. eSUN PLA+ (Cristallisation)\n```gcode\n; --- G-code de fin : Recuit Direct PLA+ ---\nM104 S0 ; Éteindre la buse\nM140 S70 ; Plateau à 70°C (Maintien base)\nM191 S60 ; Chambre à 60°C\nM117 Cristallisation PLA+ (1h)...\nG4 P3600000 ; Pause de 1 heure\nM140 S0 M191 S0\nM117 Terminé. Refroidissement porte fermée.\nM84\n```\n\n### Avantages du Recuit \"In-Situ\" (Audit)\nIl est fortement recommandé de lancer le recuit **immédiatement après l'impression** sans retirer la pièce du plateau :\n- **Absence d'humidité** : Le PA12-CF n'a pas le temps d'absorber l'humidité ambiante (ce qui ferait bouillir l'eau lors du recuit).\n- **Contrainte mécanique** : Le plateau agit comme un gabarit de maintien, empêchant le retrait (shrinkage) de la base de la pièce.\n- **Béquille Thermique** : Pour les pièces hautes et fines, laissez les **Tree Supports** (supports arborescents). Ils servent de béquille thermique pour éviter que la pièce ne penche lors de la phase de ramollissement à 70-80°C.\n\n#### 2. PETG-CF (Finition & Stress-Relief)\n```gcode\n; --- G-code de fin : Recuit Direct PETG-CF ---\nM104 S0 ; Éteindre buse\nM140 S85 ; Plateau à 85°C (Transition vitreuse)\nM191 S60 ; Chambre à 60°C\nM117 Recuit PETG-CF (3h)...\nG4 P10800000 ; Pause de 3 heures\nM140 S0 M191 S0\nM117 Finition. Refroidissement lent.\nM84\n```\n\n#### 3. PA12-CF (Performance Maximale)\n```gcode\n; --- G-code de fin : Recuit Direct PA12-CF ---\nM104 S0 ; Éteindre buse\nM140 S100 ; Plateau à 100°C (Radiateur)\nM191 S65 ; Chambre à 65°C\nM117 Recuit PA12-CF (8h)...\nG4 P28800000 ; Pause de 8 heures\nM140 S0 M191 S0\nM117 Refroidissement passif (2h)...\nM84\n```\n\n---\n\n## 5. Validation et Calibration Finale\n*   **Test du \"Son\" (PA12-CF)** : Une pièce bien recuite émet un son clair, presque métallique, lorsqu'on la tapote. Une pièce \"brute\" sonne plastique et mat.\n*   **Retrait PLA+** : Si vous constatez un retrait de 3% après recuit, appliquez un facteur d'échelle (Scale) de **103%** dans OrcaSlicer avant l'impression finale.\n*   **Maintenance Carbon** : Soufflez les poussières de carbone dans l'extrudeur tous les 2kg de filament pour éviter les glissements de roue dentée.\n", "Fabrication: 10_Guide_Buse_Tungstene": "# Guide Technique : Installation & Optimisation Buse Carbure de Tungstène\n\nCe document détaille l'installation de la buse haute performance en **Carbure de Tungstène**, recommandée pour les filaments chargés carbone (PETG-CF, PA12-CF) du projet D-Bot.\n\n## 1. Pourquoi cette Upgrade ?\n*   **Résistance Extrême** : Inusable face à l'abrasion du carbone (contrairement au laiton qui se creuse en quelques heures et à l'acier trempé qui s'use lentement).\n*   **Conductivité Thermique** : Proche du cuivre. Permet de chauffer aussi vite et stablement que le laiton, contrairement à l'acier trempé qui isole et demande de surchauffer (+10°C).\n*   **Fluidité** : Réduit drastiquement les risques de bouchage (clogs).\n\n## 2. Procédure de Remplacement (Critique)\nLe carbure de tungstène est ultra-dur mais **cassant** aux chocs. De plus, le bloc de chauffe est fragile.\n\n### Matériel Requis\n*   Clé plate fournie.\n*   **Pince multiprise** (Indispensable pour le contre-appui).\n*   Gants thermiques.\n\n### Étape 1 : Démontage Sécurisé\n1.  **Chauffe** : Montez la température à **250°C**. (À froid, le plastique colle et vous casserez le heatbreak).\n2.  **Videz l'extrudeur** (Unload).\n3.  **Contre-Appui (Règle d'Or)** : Maintenez **fermement** le bloc de chauffe carré avec la pince. Il ne doit **jamais** tourner sur lui-même pendant le dévissage.\n4.  Dévissez la buse d'origine.\n\n### Étape 2 : Montage et Serrage à Chaud\n1.  **Nettoyage** : Vérifiez que le filetage est propre.\n2.  **Vissage** : Vissez la buse Tungstène à la main (avec gant) pour sentir le filetage. Ne forcez pas si ça résiste.\n3.  **Serrage Final** : Toujours à **250°C** et avec la pince en contre-appui, serrez fermement (1.5 - 2.0 Nm).\n    *   *Contrôle Visuel* : Il doit rester un espace de **0.5mm à 1mm** entre la tête de la buse et le bloc. Si elle touche le bloc, elle ne scelle pas le heatbreak -> Fuite garantie.\n\n## 3. Calibration Machine (Obligatoire)\nLa thermique de la tête change radicalement. L'imprimante doit réapprendre.\n\n1.  **PID Calibration** : Menu Qidi > Configuration > PID Tuning. (Stabilisation thermique).\n2.  **Auto-Leveling** : La nouvelle buse peut être plus longue de quelques microns. Refaites le niveau.\n3.  **Z-Offset** : Vérifiez la première couche. Ajustez si nécessa
