ile distale à balancer** | **~400 à 460 g** |\n\nUn sous-genou à **moins de 500 grammes** est exceptionnel à l'échelle d'un humanoïde de près de 40 kg. C'est ce qui permettra d'atteindre les vitesses de course cibles (~5 à 10 km/h) sans exiger le passage aux monstrueux moteurs RS-06.\n", "Annexes: 25_Etude_Extension_Carbone_Membres": "# 24 — Étude : Extension de l'Architecture Carbone (Fémur & Bras)\n\nSuite à la validation de l'architecture \"Tube Carbone + Insert + Goupille Mécanindus\" pour le tibia (réduisant drastiquement l'inertie distale), il est naturel de se demander si cette solution peut être généralisée aux autres membres du D-Bot : le fémur (cuisse), le bras et l'avant-bras.\n\nVoici l'analyse d'ingénierie mécanique comparative.\n\n---\n\n## 1. Extension aux Bras et Avant-Bras : Un Grand OUI 🏆\n\n**L'application du tube carbone aux membres supérieurs est extrêmement pertinente et fortement recommandée.**\n\n### 🦾 Avant-Bras (Coude → Poignet)\n- **Contexte** : Relie le moteur du coude (RS-02) à la main (D-Hand avec moteurs XC330).\n- **Inertie** : Le poignet/main est au bout d'un long bras de levier. Réduire le poids de l'avant-bras améliore drastiquement la réactivité du poignet et réduit la charge constante sur le moteur de l'épaule et du coude.\n- **Efforts** : Le portage maximal cible étant de ~2 kg (voire 3-4 kg), les efforts transmis (torsion, flexion, arrachement) sont **très faibles** comparés à ceux des jambes du robot.\n- **Verdict** : Un **Tube Carbone de Ø25 mm ou Ø30 mm** avec la même méthode (Insert Alu/PA12 + Goupille Mécanindus de Ø2 mm ou Ø2.5 mm) est la solution parfaite.\n\n### 💪 Bras / Humérus (Épaule → Coude)\n- **Contexte** : Relie l'épaule (RS-03) au coude (RS-02).\n- **Efforts** : Principalement de la flexion (porter la charge) et de la torsion.\n- **Verdict** : Un **Tube Carbone de Ø35 mm ou Ø40 mm** est tout à fait applicable. Les inserts CNC en aluminium (avec goupille Mécanindus travaillant en cisaillement) feront parfaitement la liaison avec les faces planes des moteurs RS.\n\n**Bénéfice global pour les bras** : En marche dynamique, le balancement des bras agit comme un pendule d'équilibrage pour contrecarrer le lacet du bassin. Des bras plus légers permettent une oscillation beaucoup plus rapide sans générer de forces perturbatrices massives sur le buste.\n\n---\n\n## 2. Extension au Fémur (Cuisse) : Mitigé / Complexe ⚠️\n\nL'application du tube carbone au fémur semble intuitive pour gagner du poids, mais elle se heurte à plusieurs défis d'architecture de haut niveau.\n\n### 🚫 Problème 1 : L'encombrement et la géométrie des interfaces\n- Le fémur doit relier la **Hanche** (gros bloc de 2 moteurs orientés à 90°) au **Genou** (Moteur RS-04, potentiellement doublé d'un mécanisme SEA ou d'une poulie).\n- Ces articulations demandent des points de fixation très larges (les \"Brackets\" de hanche et de genou en forme de \"U\" ou \"H\").\n- **Conséquence** : Transférer l'effort de ces immenses brackets vers un tube cylindrique étroit (Ø40 ou Ø50 mm) au centre demanderait des inserts massifs en forme d'entonnoir en aluminium usiné CNC. Le poids gagné par le tube carbone risque d'être totalement perdu par le poids des énormes adaptateurs en aluminium haut et bas.\n\n### 🚫 Problème 2 : L'intégration globale (câblage, électronique)\n- Le fémur n'est pas qu'un os : dans les robots bipèdes modernes, c'est l'endroit idéal pour loger les contrôleurs moteurs, acheminer les nappes de câbles (hanche → genou → cheville) cachées sous des coques de protection.\n- Un simple tube cylindrique rond empêche tout montage propre d'électronique et rend le \"cable routing\" (routage des câbles) affreux (tout courrait à l'extérieur, exposé aux chocs).\n\n### 📐 Les vraies solutions pour le Fémur : \"Poutre en U\" ou \"Treillis 3D\"\nPour résoudre ces problèmes, l'ingénierie biomimétique privilégie deux architectures robustes :\n\n#### Solution 1 : La Poutre en U (Aluminium CNC)\n\n![Fémur : Poutre en U Aluminum](./img_femur_poutre_u.png)\n\nUn profilé large et évidé en Aluminium 6061-T6 usiné à la CNC (C500). \n*   **Rigidité** : Extrêmement rigide en flexion.\n*   **Intégration** : Il offre de très larges surfaces planes en haut et en bas pour visser les énormes brackets des moteurs de Hanche et de Genou.\n*   **Électronique** : Sa cavité interne est parfaite pour loger les PCB de puissance et faire passer les câbles proprement, protégés des chocs par une coque d'habillage externe en impression 3D (PA12-CF).\n\n#### Solution 2 : L'Exosquelette Treillis (Plaques Carbone + Aluminium)\n\n![Fémur : Exosquelette Treillis Carbone](./img_femur_treillis.png)\n\nPlutôt qu'un tube rond, on utilise des matériaux composites plats pour former une \"boîte\" ou 3D Truss :\n*   **Structure** : Deux épaisses plaques parallèles (gauche/droite) en Fibre de Carbone (usiné à la CNC), reliées entre elles par des entretoises horizontales en aluminium.\n*   **Interfaces** : Des blocs massifs (inserts) en Aluminium usiné sont pris en sandwich entre les plaques en haut et en bas pour fournir l'ancrage rigide aux moteurs.\n*   **Avantage** : Ultra-léger, très rigide en torsion, tout en préservant un espace vide central pour le cheminement des câbles.\n\n#### Solution 3 : Squelette Hybride (Alu Iso-grid + PA12-CF)\n\n![Fémur : Solution Hybride Iso-grid](./img_femur_hybride.png)\n\nIl s'agit de la synthèse absolue entre la résistance de l'aluminium et la légèreté de l'impression 3D (PA12-CF) :\n*   **Squelettisation (CNC)** : On part d'une Poutre en U en aluminium 7075-T6 que l'on va évider agressivement (usinage de \"poches\" triangulaires type Iso-grid) sur la C500. Le bloc de ~800g perd 40% à 50% de sa masse pour atteindre ~350g, tout en conservant des interfaces moteurs (haut/bas) massives.\n*   **Hybridation (FDM)** : La perte de rigidité induite par la squelettisation est compensée par l'ajout de **coques structurelles épaisses en PA12-CF** (~150g). Ces coques viennent se visser ou se coller sur le squelette ajouré, fermant la cavité et offrant une rigidité en torsion exceptionnelle.\n*   **Avantage** : Un poids hybride record (~500g), une solidité structurelle rassurante aux points d'ancrage moteurs (aluminium), avec une esthétique et un routage de câbles parfaits (fermés et protégés par le Nylon-Carbone).\n\n#### Dimensions Approximatives & Ingénierie d'Assemblage\n\nPour rendre cet usinage réaliste et efficace sur la C500, voici les dimensions cibles et la méthode d'assemblage recommandée :\n\n**Dimensions (Échelle Humanoïde ~1m40 - 1m50)** :\n- **Longueur totale (Axe Hanche → Axe Genou)** : ~350 mm à 400 mm.\n- **Largeur interne** : ~90 mm minimum (pour englober sans frotter le moteur RS-04 qui fait ~85mm de diamètre extérieur).\n- **Profondeur** : ~60 mm à 80 mm (suffisant pour y loger une carte contrôleur type *Moteus* ou *Odrive* et le passage des gros câbles d'alimentation).\n\n**L'Évolution : \"Le Squelette en Plaques Ajustées\"**\nL'idée de **ne pas usiner un \"U\" massif dans un seul bloc** est la vraie solution d'ingénierie (\"Design for Manufacturing\"). Usiner un bloc de 100x100x400 mm pour faire un U évidé serait un immense gaspillage de matière (80% transformé en copeaux) et d'heures de machine. \n\nLa méthode parfaite pour la C500 consiste à scinder le fémur en **plusieurs pièces plates vissées et collées** :\n1. **Les Interfaces Moteurs (Haut et Bas)** : Deux gros blocs d'Aluminium usinés pour épouser parfaitement les vis des moteurs RS-04. Ces blocs agiront comme les \"bouchons\" structurels du fémur.\n2. **Les Plaques Latérales (Joues)** : Deux plaques plates d'Aluminium 7075-T6 (épaisseur ~4 mm à 5 mm), découpées et évidées (Iso-grid) en 2.5D sur la CNC. C'est extrêmement rapide à usiner.\n3. **L'Assemblage (Goupilles Mécanindus)** : Les plaques latérales s'encastrent précisément (ajustement H7 ou H8) dans des rainures usinées sur les blocs Moteurs. Plutôt que d'utiliser des vis (dont les filetages aluminium s'arracheraient sous les secousses), l'assemblage est verrouillé par des **Goupilles Élastiques (Mécanindus)** traversant l'ensemble de part en part.\n    - *Avantage Mécanique* : Une goupille offre une résistance au cisaillement (translation) infiniment supérieure à une vis et ne craindra jamais les vibrations du robot.\n    - *Règle de Conception* : Les alésages recevant ces goupilles **doivent impérativement être débouchants**. Ainsi, bien que l'assemblage soit extrêmement ferme, il reste 100% démontable en chassant simplement la goupille avec un pointeau (chasse-goupille).\n4. **La Plaque Arrière (Optionnelle)** : Soit une troisième fine plaque d'aluminium usinée, soit directement la coque en PA12-CF qui vient fermer le fond du U pour apporter la rigidité finale en torsion.\n\nCette philosophie d'une structure en **platines assemblées** est exactement celle utilisée sur les bras et les jambes du robot *Optimus* ou du *Unitree G1*.\n\n#### 4. Zoom sur l'Ingénierie des Interfaces (Hanche et Genou)\n\nL'un des défis majeurs évoqués plus haut est la connexion d'un côté au **cluster de hanche** (impliquant 3 moteurs dont le gros RS-04) et de l'autre au **genou** (RS-04). Comment concevoir ces \"Blocs Moteurs\" (les extrémités du fémur) de manière simple et robuste ?\n\nLa solution s'appelle **l'Architecture en \"Sandwich\"** :\n\n**A. L'Interface Supérieure (Côté Hanche RS-04)**\n- Le stator du moteur RS-04 de la hanche (Pitch) est fixé au bassin. C'est son rotor (la cloche tournante) qui entraîne le fémur.\n- Le fémur ne se visse *pas* directement sur le rotor. Il vient \"enserrer\" une pièce intermédiaire.\n- **La Pièce Clé (Le \"Bloc Hanche\")** : C'est une grosse brique d'aluminium usinée (CNC). Une de ses faces possède l'empreinte circulaire des 8 vis M4 du rotor du RS-04. Ses côtés (flancs) sont parfaitement plats et usinés avec des rainures (encoches).\n- **Le Sandwich** : Les deux grandes plaques latérales du fémur (les joues en alu Iso-grid de 5mm) viennent s'emboîter de chaque côté de cette brique. Des goupilles Mécanindus traversent la plaque gauche, la brique d'aluminium, et la plaque droite. L'ensemble est indéformable en torsion.\n\n**B. L'Interface Inférieure (Côté Genou RS-04)**\nLa situation au genou est inversée. Le fémur doit \"porter\" le moteur du genou.\n- **Le Bloc Genou** : Une autre brique d'aluminium massive usinée. Elle agit comme le \"berceau\" du moteur RS-04.\n- Le stator (partie fixe) du RS-04 vient se visser solidement dans ce berceau (souvent via un collier de serrage CNC ou des vis frontales).\n- Comme pour la hanche, les deux grandes plaques du fémur viennent prendre ce berceau \"en sandwich\" de chaque côté, verrouillées par goupilles Mécanindus.\n- *C'est ensuite le tibia (via un autre système) qui viendra se fixer sur le rotor tournant de ce moteur de genou.*\n\n> **Le Bilan Mécanique** : Cette approche découple totalement la complexité. La C500 n'a plus qu'à usiner 2 plaques plates (facile en 2.5D) et 2 petits blocs massifs de fixation (les adaptateurs Hanche et Genou). On n'essaie plus \"d'évader\" un bloc géant pour tout faire d'un coup.\n\n![Architecture Sandwich Fémur Hybride](./img_femur_hybride_sandwich.png)\n\n#### Directives CAO / FAO (C500) pour les Plaques Latérales\n\nPour concevoir les deux plaques d'aluminium (les joues du fémur) de la Solution 3, voici les **dimensions cibles recommandées** pour un robot de taille ~1m40 pesant ~35-40 kg. Ces cotes sont optimisées pour la CNC NestWorks C500 :\n\n1. **Épaisseur brute de la plaque (Alu 6061 ou 7075-T6)** : **5 mm**. C'est le standard dans l'industrie pour un fémur de cette taille (compromis parfait entre robustesse et flexibilité).\n2. **Épaisseur des \"Struts\" (Les branches du treillis)** : **4 mm à 6 mm de large**. \n    - Ne descendez pas en dessous de 4 mm, sinon le fin bras d'aluminium vibrera lors de l'usinage (chatter) et cassera sous la charge dynamique du genou.\n3. **Profondeur de la poche (Pocketing)** : **3.5 mm**. \n    - *Ne transpercez pas la plaque de part en part !* L'erreur classique est de faire des trous complets (0 mm restant). Il faut **laisser une \"toile de fond\" (*Web*) de 1.5 mm** d'épaisseur. Cette très fine toile unifiant tout le treillis ajoute une rigidité en cisaillement stupéfiante (type aile d'avion) pour quasiment 0 gramme supplémentaire. Les coques PA12-CF viendront se coller contre cette toile.\n4. **Angles internes (Congés / Fillets)** : **R > 3.175 mm (soit Ø6.35 mm)**.\n    - Dessinez vos poches triangulaires avec des angles très arrondis (minimum rayon 3.2 mm). Cela permet à la CNC C500 d'usiner la poche à pleine vitesse avec sa grosse fraise d'ébauche de 1/4\" (6.35 mm) sans jamais s'arrêter aux angles, ce qui divise le temps d'usinage par 3.\n\n#### Comparatif Détaillé : Les 3 Architectures de Fémur\n\n| Critère | Poutre en U (Aluminium Plein) | Exosquelette Treillis (Carbone) | Solution Hybride (Alu *Iso-grid* + PA12-CF) |\n| :--- | :--- | :--- | :--- |\n| **Poids estimé** | Lourd : ~700g - 800g | **Ultra-Léger : ~300g - 400g** | **Optimisé : ~500g** (350g Alu + 150g PA12) |\n| **Solidité (Flexion/Choc)** | Excellente. L'alu encaisse les gros chocs. | Excellente dans l'axe. Fragile aux chocs latéraux. | **Excellente**. L'alu prend la force, le PA12 encaisse l'impact. |\n| **Solidité (Torsion / Lacet)** | **Exceptionnelle** (Profilé monobloc). | Bonne (Robe aux vibrations de la visserie). | **Exceptionnelle** (Structure composite fermée). |\n| **Complexité Usinage (C500)** | Moyenne. 2 Setups (intérieur/extérieur). | Simple. Découpe 2D de plaques carbone. | **Haute**. Usinage complexe de poches triangulaires profondes. |\n| **Complexité Assemblage** | **Très simple** (pièce monobloc). | Complexe (beaucoup d'entretoises/vis). | Facile (vissage des coques PA12). |\n| **Intégration Câblage** | Idéale (caché dans la cavité). | Moyenne (câbles visibles entre les piliers). | **Idéale** (cavité étanche). |\n| **Aesthétique** | Industriel, robuste (type Tesla Optimus). | \"Racing\", agressif, filaire. | **Premium, futuriste (type Agility Digit)**. |\n| **Prix Estimé des matières**| Le moins cher : ~50€ (Bloc brut Alu).| Le plus cher : ~120€ (Plaques carbone). | Moyen : ~70€ (Alu brut + Fil PA12-CF). |\n\n**Verdict Fémur** : Le tube carbone rond est inadapté à la cuisse. \n- Si l'objectif principal est le **gain de poids absolu**, concevez le fémur avec le **Treillis Carbone (Solution 2)**.\n- Si le design exige **la simplicité et le prix le plus bas** : privilégiez la **Poutre en U massive en aluminium (Solution 1)**. \n- 🏆 **La Recommandation Ultime** : La **Solution Hybride (Solution 3)** offre le compromis parfait d'ingénierie robotique moderne (répondant exactement à l'ADN du projet C500 + Qidi Plus 4). Elle marie des **ancrages moteurs indestructibles** (aluminium), une **protection parfaite de l'électronique** et un un **gain de poids drastique (-30% vs U-Beam plein)** grâce à la synergie de l'usinage en dentelle et de l'impression 3D composites.\n\n---\n\n## Conclusion\n\n| Membre | Recommandation | Argument principal |\n|---|---|---|\n| **Tibia (Sous Genou)** | **Tube Carbone (approuvé)** | Réduction drastique inertie distale, géométrie tubulaire idéale et efforts rectilignes. |\n| **Bras / Humérus** | **Tube Carbone (très recommandé)** | Réduction du poids en pendule, efforts modérés, brackets CNC simples avec goupille. |\n| **Avant-Bras** | **Tube Carbone (très recommandé)** | Géométrie droite simple (coude → poignet), portage ~2 kg ne stressant pas la goupille. |\n| **Fémur (Cuisse)** | **Déconseillé (Profilé U ou treillis préférable)** | Interfaces de genou/hanche trop larges pour un tube. Impossible d'y loger câbles/électronique proprement. |\n", "Annexes: 26_Compatibilite_IA": "# 25 — Étude : Compatibilité IA & Apprentissage par Renforcement (Isaac Gym)\n\nAvec l'avènement de l'Apprentissage par Renforcement (RL) de bout-en-bout (Sim2Real) propulsé par des simulateurs ultra-rapides comme **NVIDIA Isaac Gym**, **MuJoCo** ou **PyBullet**, concevoir l'architecture cinématique (matérielle) d'un robot de manière \"aléatoire\" est une erreur stratégique. \n\nPour qu'un robot puisse réutiliser des *policies* open-source existantes (générées par les laboratoires de recherche) et s'entraîner rapidement, son fichier physique (`URDF` / `MJCF`) doit correspondre intimement aux standards morphologiques de l'industrie.\n\nCe document analyse les attentes \"standards\" de ces algorithmes pour la totalité du corps humainoïde.\n\n---\n\n## 1. Le Tronc (Waist / Torso) : La Rotation Z (Yaw)\n\n**Question** : *Les algorithmes s'attendent-ils à avoir un degré de liberté en rotation Z juste au-dessus des hanches (Waist Yaw) ?*\n\n### La Réponse Courte : C'est très fréquent, mais pas universel.\n\nPresque tous les algorithmes d'entraînement modernes se basent sur des modèles humanoïdes génériques créés par OpenAI, DeepMind ou NVIDIA. Dans ces modèles, le tronc est l'ancrage central du robot (\"Base Link\").\n\n| Articulation du Tronc | Statut Standard IA | Fonction | Présent sur D-Bot V1 ? |\n| :--- | :---: | :--- | :---: |\n| **Waist Yaw (Rotation Z)** | 🟡 **Standard / Recommandé** | Dissocier la direction du regard/ciblage des bras de la trajectoire des jambes. | ❌ (Mais recommandé V2) |\n| **Waist Pitch (Flexion Y)** | 🟡 Fréquent | Se pencher en avant pour ramasser un objet lourd. | ❌ |\n| **Waist Roll (Torsion X)** | 🔴 Rare | Équilibre asymétrique extrême. | ❌ |\n\n### Faut-il ajouter un Waist Yaw au D-Bot V1 ?\n\n**Pour la Locomotion Pure (marcher/courir)** : Non. L'IA peut parfaitement apprendre à marcher et tourner en utilisant uniquement les 6 DOFs des jambes (dont le *Hip Yaw*). Le robot Tesla Optimus Gen 1 et le Unitree H1 apprennent à marcher ainsi. L'absence de Waist Yaw signifie simplement que le buste et le bassin pointeront toujours dans la même direction.\n\n**Pour la Manipulation Mobile (marcher ET manipuler)** : Oui. Dès que vous entraînez une \"Whole-Body Control Policy\" (WBC) où le robot doit avancer dans un couloir tout en regardant et attrapant un objet sur une table à sa droite, l'IA cherchera l'axe *Waist Yaw*. Sans axe Z au torse, le robot devrait marcher en \"pas chassés\" (crabe) ce qui est énergétiquement inefficace, ou tourner entièrement son corps sans cesse.\n\n> **Verdict D-Bot** : La version actuelle (V1) fait l'impasse sur le Waist Yaw pour des raisons de rigidité structurelle et de simplicité. Mais, comme expliqué plus bas dans la **Section 4 (La Tête et le Cou)**, cette absence est **magistralement compensée par les 2 moteurs du cou (Pan/Tilt)**. En utilisant la Vision Active (Active Vision), le robot peut tourner la tête pour cibler un objet asymétrique, et utiliser les 5 DOFs de ses bras pour l'atteindre, sans avoir besoin de faire pivoter son bassin. L'ajout d'un Waist Yaw reste une piste d'optimisation (V2) pour des postures extrêmes, mais l'IA s'adaptera sans problème à son absence sur la V1 grâce à la tête articulée.\n\n---\n\n## 2. Le Haut du Corps : Épaules et Coudes\n\nPour le haut du corps, les algorithmes de RL (surtout ceux formés sur des données de *Motion Capture* humaine) sont beaucoup plus rigides sur le standard attendu.\n\n### 2.1 Les Épaules (3 DOFs) : Le Standard Absolu\n\nLe bras humain est un système à 7 DOF au total (3 épaule, 1 coude, 3 poignet). L'IA s'attend à une vraie conception sphérique (3 axes concourants) ou quasi-sphérique à l'épaule.\n\n| Axe (Convention) | Action | Statut IA | D-Bot V1 |\n| :--- | :--- | :---: | :---: |\n| **Shoulder Pitch (Y)** | Lever le bras devant soi | 🟢 **Obligatoire** | ✅ RS-03 |\n| **Shoulder Roll (X)** | Écarter le bras sur le côté | 🟢 **Obligatoire** | ✅ RS-03 |\n| **Shoulder Yaw (Z)** | Effectuer une rotation interne du bras | 🟢 **Fortement Recommandé** | ✅ RS-02 |\n\n> **Bonne nouvelle pour le D-Bot** : L'architecture actuelle du bras (Pitch/Roll puissants + Yaw plus léger) correspond **exactement** à la topologie standard URDF utilisée dans Isaac Gym pour l'entraînement à la manipulation (par exemple, le bras du robot PANDA ou ALOHA). L'IA n'aura besoin d'aucun \"hack\".\n\n### 2.2 Le Coude (1 ou 2 DOFs)\n\n| Axe | Action | Statut IA | D-Bot V1 |\n| :--- | :--- | :---: | :---: |\n| **Elbow Pitch (Y)** | Plier le coude | 🟢 **Obligatoire** | ✅ RS-02 |\n| **Elbow Yaw (Z)** | Supination/Pronation de l'avant bras | 🟡 Optionnel | ❌ |\n\nBeaucoup de robots simplifiés transfèrent le Yaw de l'avant-bras directement au niveau du poignet. C'est ce que nous faisons.\n\n---\n\n## 3. L'Extrémité : Le Poignet et la Main (End-Effectors)\n\nDans les environnements comme Isaac Gym, la main est généralement traitée comme un objet terminal appelé **End-Effector**.\n\n### 3.1 Le Poignet (1 à 3 DOFs)\n\nLe minimum viable pour qu'une IA puisse orienter un outil dans l'espace (couplé aux 4 DOFs Épaule+Coude) est l'ajout du \"Poignet Roll\" (Torsion).\n\n| Axe | Action | Statut IA | D-Bot V1 |\n| :--- | :--- | :---: | :---: |\n| **Wrist Roll (Z)** | Tourner la poignée de porte | 🟢 **Obligatoire** | ✅ RS-00 |\n| **Wrist Pitch (Y)** | Casser le poignet bas/haut | 🟡 Recommandé | ❌ |\n| **Wrist Yaw (X)** | Saluer de la main | 🔴 Optionnel | ❌ |\n\nLe D-Bot possède un bras à **5 DOFs** (3 épaule + 1 coude + 1 poignet torsif). C'est le strict minimum canonique pour faire de la manipulation d'objets en RL. Cela couvre 90% de l'espace de travail frontal. \n\n### 3.2 La Main (L'approche IA)\n\nC'est ici que l'approche matérielle dicte l'approche logicielle. Isaac Gym gère la main de deux manières distinctes :\n\n1. **Approche \"Pince Parallel\" (Gripper - 1 DOF)** : L'IA envoie simplement un signal (Ouvrir / Fermer / Force). 90% des challenges RL grand public (ramasser une pomme) utilisent ça.\n2. **Approche \"Dexterous Hand\" (Main Anthropomorphe - >4 DOFs)** : C'est le domaine phare actuel (Shadow Hand, D-Hand). L'IA doit contrôler individuellement les doigts. Isaac Gym excelle dans ce domaine de la *Dexterous Manipulation*.\n\n> **Verdict D-Bot** : L'utilisation de notre **D-Hand Premium (8 moteurs XC330)** oblige à utiliser les \"policies\" de *Dexterous Manipulation* de NVIDIA. L'intégration de la main à 8 axes dans l'URDF va ralentir l'apprentissage global du robot (beaucoup de paramètres).  \n> **Conseil Sim2Real** : Lors de l'entraînement inital du robot (pour lui apprendre à marcher en balançant ses bras), la main D-Hand doit être configurée comme un \"objet solide passif\" de ~250g. Les DOFs des doigts ne doivent être activés dans Isaac Gym que pour des tâches stationnaires (manipulation devant une table). Apprendre la marche ET la manipulation fine simultanément (*Whole-Body Dexterous Control*) est la frontière ultime de la recherche actuelle.\n\n---\n\n## 4. La Tête et le Cou (Active Vision)\n\n**Question** : *Les algorithmes s'attendent-ils à avoir 2 DOFs au niveau du cou ? Le Pan/Tilt de la tête peut-il compenser l'absence de rotation du buste (Waist Yaw) ?*\n\n### 4.1 La Tête dans Isaac Gym (Active Vision)\n\nAbsolument. En Apprentissage par Renforcement, la capacité de la *policy* à orienter ses propres capteurs s'appelle l'**Active Vision** (ou l'Attention Active). Les algorithmes les plus avancés ne se contentent pas de subir un flux vidéo statique découpé au hasard ; ils apprennent à *bouger* la caméra (la tête) pour scanner l'environnement, construire une carte de profondeur efficace (avec l'OAK-D et le LiDAR L2), et \"verrouiller\" visuellement une cible pendant que le corps bouge.\n\n| Axe (Convention) | Action | Statut IA | D-Bot V1 |\n| :--- | :--- | :---: | :---: |\n| **Head Pan (Yaw/Z)** | Dire \"Non\", tourner la tête gauche/droite | 🟢 **Très Important** | ✅ RS-05 |\n| **Head Tilt (Pitch/Y)** | Dire \"Oui\", lever/baisser la tête | 🟢 **Très Important** | ✅ RS-05 |\n\nUne tête articulée à 2 DOFs est la norme absolue pour les robots humanoïdes de nouvelle génération (Figure 01, Optimus, Atlas). Cela permet au robot de regarder où il va poser les pieds sur un sol accidenté sans avoir à incliner tout son torse avec un Waist Pitch.\n\n### 4.2 Le \"Head Pan\" comme Substitut Ultime au \"Waist Yaw\"\n\nC'est là que l'architecture du D-Bot est très élégante et que votre intuition est parfaitement exacte. **Oui, le Pan de la tête (rotation Z du cou) compense la majeure partie des inconvénients liés à l'absence de Waist Yaw (rotation Z du buste).**\n\nSi un robot est dépourvu de Waist Yaw *et* de tête articulée, et qu'il veut manipuler un objet situé à 45° sur sa droite, il a un énorme problème : il ne le voit plus. Il doit donc tourner tout son corps avec ses jambes pour le ramener au centre de son champ de vision.\n\nGrâce à ses **2 moteurs RS-05 au cou**, le D-Bot résout ce problème de ciblage spatial sans impliquer la dynamique complexe du torse :\n1. **Perception Indépendante** : Le D-Bot peut conserver sa dynamique de marche rectiligne (stable) tout en tournant la tête (Head Pan) pour repérer et \"verrouiller\" une cible sur sa gauche ou sa droite.\n2. **Ciblage Asymétrique pour la Manipulation** : Puisque la caméra stéréo (OAK-D) donne les coordonnées XYZ exactes de la cible à l'IA, le contrôleur des bras peut utiliser son **bras à 5 DOFs** (qui est amplement assez articulé) pour aller cueillir l'objet de côté, même si les épaules restent alignées avec les hanches.\n\n> **Verdict D-Bot** : L'intégration des 2 RS-05 au cou n'est pas un simple \"gadget\". C'est un composant fondamental pour la survie du robot dans un environnement RL. Le Pan/Tilt transforme l'absence de rotation du buste d'un véritable goulot d'étranglement (blocage perceptif) en une simple contrainte de \"reachability\" (espace de travail des bras) pour l'IA. Tant que l'objet est dans le champ visuel du cou et physiquement atteignable par les bras, l'absence de Waist Yaw est totalement transparente pour une tâche de manipulation en mouvement.\n\n---\n\n## Bilan Cinématique D-Bot vs Standards RL\n\nLe D-Bot V1 est **parfaitement aligné** sur les standards pour un humanoïde d'apprentissage :\n\n| Région | DOFs D-Bot V1 | DOF Manquant (Évolution V2) | Total DOFs |\n| :--- | :---: | :--- | :---: |\n| **Jambes** | 2 × 6 DOFs | Aucun | 12 |\n| **Torse** | 0 DOF | **Hanche Z (Waist Yaw)** | 0 |\n| **Bras** | 2 × 5 DOFs | Poignet Pitch (Flexion) | 10 |\n| **Mains** | 2 × 8 DOFs | Aucun | 16 |\n| **Tête** | 2 DOFs | Aucun | 2 |\n| **TOTAL** | **40 DOFs* ** | | |\n\n*Note : 40 DOFs avec les mains actives complètes, 24 DOFs pour la locomotion de base.*\n\nIl ne lui manque que 3 DOFs d'ingénierie fine (le Waist Yaw et les Poignets Pitch) pour atteindre les capacités cinématiques exactes d'un Tesla Optimus (lequel en possède 28 + 22 pour les mains). Pour un robot de 40 kg conçu en garage, le D-Bot V1 est une plateforme \"Sim2Real ready\" d'excellence.\n", "Annexes: 27_Bloc_Pelvien_Hanche": "# 26 — Étude : Architecture du Bloc Pelvien (Cardan de Hanche)\n\nSuite à la définition du \"Fémur Hybride\" (qui se connecte en sandwich au dernier moteur de la jambe), il est indispensable d'étudier ce qui se passe *au-dessus* du fémur : le fameux **\"Bloc de Hanche\" à 3 degrés de liberté (DOF)**.\n\nL'**Addendum 11 de la page 15b** montrait l'architecture historique du K-Bot. Comment cette architecture se compare-t-elle aux standards actuels de l'industrie (Tesla Optimus, Unitree G1/H1, Agility Digit) et comment devons-nous concevoir celle du D-Bot ?\n\n---\n\n## 1. La Problématique des Moteurs QDD (Quasi-Direct Drive)\n\nDans le corps humain, la hanche est une articulation sphérique parfaite : les 3 axes de rotation (Yaw, Roll, Pitch) se croisent exactement au même point x,y,z (le centre de la tête du fémur).\n\nEn robotique basée sur des actionneurs cylindriques massifs (les moteurs QDD type RS-03/RS-04), **deux moteurs physiques ne peuvent pas occuper le même espace au même moment**. \nIl est donc géométriquement impossible d'avoir une vraie liaison sphérique concourante. L'industrie résout ce problème en séparant les axes et en *empilant* les moteurs les uns à la suite des autres via de solides équerres structurelles. C'est ce qu'on appelle la **Chaîne Cinématique (Kinematic Chain)**.\n\n---\n\n## 2. Benchmark de l'Industrie\n\n### A. L'approche K-Bot Originale\nLes images du K-Bot montrent une tentative de compacter les 3 moteurs dans un espace très restreint (sorte de grappe entremêlée).\n- *Inconvénient majeur* : Cette conception crée souvent des collisions (auto-intersections) lors de mouvements combinés extrêmes et rend l'usinage des pièces de liaison affreusement complexe en CAO 3D.\n\n### B. L'approche Tesla Optimus : séquentielle A-R-F\n\nTesla a opté pour une chaîne cinématique **A-R-F** (Abduction→Rotation→Flexion), soit Roll→Yaw→Pitch dans notre nomenclature :\n1. **Maillon 1 : Roll (Abduction)** — fixé au bassin, stabilité latérale.\n2. **Maillon 2 : Yaw (Rotation)** — rotation interne/externe.\n3. **Maillon 3 : Pitch (Flexion)** — dans la cuisse, levée et propulsion.\n\n**Avantage** : Le gros moteur Pitch (le plus lourd) est le dernier maillon et ne porte que la cuisse.  \n**Inconvénient** : Architecture \"Gen 1\" — le bassin reste très large et les proportions du torse sont moins naturelles.\n\n### C. L'approche Unitree H1 / H1-2 : Sphérique (Grappe Concentrée)\n\nDe son côté, Unitree adopte une philosophie radicalement différente pour maximiser la dynamique et la vitesse (le H1 détient le record du monde de vitesse humanoïde).\n1. **Concentration des masses** : Les trois moteurs de la hanche (des modèles M107 ultra-compacts et très coupleux développés en interne) sont agglutinés en une **grappe très dense** directement centrée sur le bassin.\n2. **Quasi-concourants** : À l'inverse de Tesla, Unitree s'efforce de faire en sorte que les axes de ces 3 moteurs se croisent *presque* au même point géométrique. L'objectif est d'imiter la vraie articulation \"sur rotule\" du corps humain.\n3. **Bras de levier réduit** : Aucun moteur lourd n'est inséré dans le haut de la cuisse. Toute la puissance est dans le bassin, réduisant l'inertie lors des déplacements rapides.\n\n> ⚠️ L'approche sphérique d'Unitree nécessite des moteurs sur-mesure imbriqués, incompatibles avec nos moyens de production en atelier.\n\n### D. L'approche Gen2 (Figure 02, Unitree G1) : F-A-R\n\nLes robots humanoides de deuxième génération (Figure 02, Unitree G1) ont convergé vers l'ordre **F-A-R** (Flexion→Abduction→Rotation), soit Pitch→Roll→Yaw :\n\n1. **Maillon 1 : Pitch (Flexion)** — fixé au haut du bassin/torse, axe principal.\n2. **Maillon 2 : Roll (Abduction)** — suspendu sous l'axe Pitch.\n3. **Maillon 3 : Yaw (Rotation)** — en bas, vers la cuisse.\n\n**Avantages** :\n- Packaging anatomique — le bassin est plus fin, le torse proportionnellement plus long.\n- Le pivot principal (Pitch) est haut, ce qui donne des proportions humaines naturelles.\n- Standard de l'industrie 2024-2025.\n\n**Inconvénient** :\n- Le moteur Pitch porte les masses des moteurs Roll et Yaw lors du swing de jambe, ce qui augmente théoriquement l'inertie distale. En pratique, les marges de couple des RS-04 rendent cet inconvénient négligeable (voir §4).\n\n---\n\n## 3. L'Architecture D-Bot : Chaîne F-A-R (Méthode Gen2)\n\n**Pour le D-Bot, nous adoptons officiellement l'ordre F-A-R**, en ligne avec les standards de la robotique humanoïde 2024-2025. C'est la seule approche qui soit à la fois réaliste avec des moteurs QDD standards \"off-the-shelf\" (RobStride) et qui offre des proportions anatomiques satisfaisantes.\n\nConcrètement, la liaison entre le Bassin et le Fémur (Cuisse) du robot se décompose ainsi :\n\n![Schéma Éclaté du Cardan de Hanche](./assets/img_hip_kinematic_chain.png)\n\n### Maillon 1 : L'Axe Pitch (Moteur RS-04)\n* **Emplacement** : Fixé au sommet du bassin ou en partie basse du torse (axe Y — horizontal, regarde sur les côtés du robot).\n* **Rôle** : C'est le boss de la motricité. Il encaisse la charge principale pour lever la cuisse, s'accroupir, ou propulser le robot en avant.\n* **Connexion sortante** : Son rotor porte la première équerre (un L-Bracket usiné en alu massif) qui descend vers le moteur Roll.\n* **Motorisation** : RS-04 (120 N.m pic) — le plus fort, justement placé en premier pour encaisser tous les efforts.\n\n### Maillon 2 : L'Axe Roll (Moteur RS-03)\n* **Emplacement** : Fixé horizontalement (axe X) à l'extrémité du L-Bracket venant du moteur Pitch. Il regarde devant ou derrière le robot.\n* **Rôle** : Permettre au robot de faire le grand écart ou d'écarter la jambe sur le côté.\n* **Connexion sortante** : Son rotor porte la deuxième équerre (un U-Bracket ou L-Bracket) vers le Yaw.\n\n### Maillon 3 : L'Axe Yaw (Moteur RS-03)\n* **Emplacement** : Fixé verticalement (axe Z) à l'extrémité de l'équerre du moteur Roll, en haut de la cuisse.\n* **Rôle** : Rotation interne/externe (tourner la pointe du pied vers l'intérieur ou l'extérieur).\n* **Connexion sortante** : Son rotor est la ligne d'arrivée — c'est ici que vient se greffer le **Fémur Hybride en Sandwich**.\n\n### Le Bout de la Chaîne : Le Fémur Hybride\nLes deux épaisses plaques latérales du fémur viennent prendre en sandwich l'interface (cloche/rotor) du moteur Yaw (RS-03). Le fémur ne \"sait pas\" qu'il y a 2 autres moteurs au-dessus de lui. Il n'est attaché qu'au dernier maillon de la chaîne.\n\n---\n\n## 4. Analyse des Marges de Couple en F-A-R\n\nEn F-A-R, le RS-04 Pitch porte les masses des moteurs Roll et Yaw en plus de la jambe entière. Voici l'analyse des couples mis en jeu :\n\n**Masses portées par le Hip Pitch (RS-04) :**\n\n| Composant | Masse |\n|:---|:---:|\n| RS-03 Roll | 880g |\n| RS-03 Yaw | 880g |\n| 2× Brackets de liaison | ~400g |\n| Fémur hybride complet | ~750g |\n| RS-04 Knee (relocalisé en haut de cuisse via GT3) | 1 420g |\n| Tibia + pied | ~800g |\n| **TOTAL porté par le Hip Pitch** | **~5 130g** |\n\n**Couple requis (bras de levier au CdG de la jambe ~0.15m) :**\n```\nτ_statique      = 5.13 × 9.81 × 0.15  ≈  7.5 N.m\nτ_marche normale (×2.5 dyn.)          ≈ 18.8 N.m   → RS-04 (120 N.m) : 16% ✅\nτ_course pic (×4.0 dyn.)             ≈ 30.0 N.m   → RS-04 (120 N.m) : 25% ✅\n```\n\n> [!TIP]\n> **Conclusion** : Même en portant tous les maillons de la chaîne, le RS-04 Hip Pitch ne dépasse jamais 30% de ses capacités lors de la locomotion normale. Les marges sont très confortables. **Aucune amplification GT3 n'est nécessaire à la hanche** (voir §5).\n\n---\n\n## 5. Étude Option GT3 Hip Pitch — Analyse et Rejet\n\nFace aux très bonnes marges du §4, nous avons étudié l'option d'ajouter une réduction GT3 sur le Hip Pitch (en s'inspirant de la Doc 15g pour le genou), afin de délocaliser le RS-04 dans le torse et de réduire encore l'inertie du bassin. L'analyse conclut que cette option, bien que techniquement viable, n'est **pas retenue**.\n\n### Principe étudié\n\nLe RS-04 Hip Pitch serait placé dans la partie basse du torse, et sa puissance transmise à l'axe de pivot de la hanche via une courroie GT3 (ratio 1.5:1 → 180 N.m).\n\n### Avantages identifiés\n- Réduction de la masse suspendue au bassin (RS-04 fixe dans le torse)\n- Légère amplification de couple supplémentaire (180 N.m vs 120 N.m)\n- Inertie de balancement de jambe légèrement réduite\n\n### Raisons du rejet\n\n| Raison | Détail |\n|:---|:---|\n| **Couple déjà suffisant** | Le RS-04 à 120 N.m est sollicité à max 25% en locomotion. La GT3 serait une complexité sans bénéfice mesurable. |\n| **Complexité de routage** | La courroie doit traverser une zone mobile (articulation Pitch). Le passage du brin de courroie est difficile à protéger lors des rotations Roll et Yaw. |\n| **Encombrement torse** | Le torse basse héberge déjà la batterie 48V et la PDB. Ajouter 2 RS-04 (2 840g) dans cet espace est un défi d'intégration important. |\n| **GT3 genou déjà mise en place** | La délocalisation du moteur genou via GT3 (Doc 15g) apporte déjà la réduction d'inertie distale majeure. La GT3 hanche est redondante avec cet effort. |\n\n> [!IMPORTANT]\n> **Décision** : Le RS-04 Hip Pitch reste **directement sur l'axe de la hanche**, en direct drive 1:1. C'est plus simple, plus robuste, et les marges de couple sont largement suffisantes.\n\n---\n\n## 6. Conséquences pour l'Ingénierie (Usinage C500)\n\nL'énorme avantage de l'ordre F-A-R avec chaîne séquentielle, c'est l'usinabilité immédiate.\n\nNous avons réduit la hanche à **seulement 2 pièces mécaniques simples (Brackets)** :\n1. **Le \"Pitch-Roll Bracket\"** : Une équerre reliant l'axe Pitch (RS-04) au moteur Roll (RS-03).\n2. **Le \"Roll-Yaw Bracket\"** : Une seconde équerre reliant le moteur Roll au moteur Yaw.\n\nCes deux pièces sont des usinages simples en aluminium 7075-T6 sur C500. Elles mesurent tout au plus 5 à 10 cm de long chacune, offrant une rigidité exceptionnelle.\n\n| Comparaison des ordres cinématiques | Packaging bassin | Proportions | Standard industrie |\n|:---|:---:|:---:|:---:|\n| R-A-F (Yaw→Roll→Pitch) — **Ancien D-Bot** | Moyen | Peu naturel | Non-standard |\n| A-R-F (Roll→Yaw→Pitch) — **Tesla Optimus** | Bon (Pitch en bas) | Gen1 | Déclinant |\n| **F-A-R (Pitch→Roll→Yaw) — D-Bot V2** | **Excellent** | **Anatomique** | **Gen2 standard** ✅ |\n\n> **Verdict / Action Recommandée** : Toute la modélisation CAO du bloc pelvien doit se concentrer sur le design ultra-rigide des 2 Brackets de liaison (Pitch-Roll et Roll-Yaw). Le RS-04 Pitch est positionné au sommet du bassin/bas du torse, son rotor orienté vers le côté (axe Y), définissant le plan médio-latéral du robot.\n\n---\n\n*Document mis à jour en Avril 2026 — Passage de l'architecture R-A-F à F-A-R suite à l'analyse comparative des standards de l'industrie (Tesla Optimus Gen1 = A-R-F, Figure 02 / Unitree G1 Gen2 = F-A-R). Option GT3 Hip Pitch étudiée et rejetée (couple RS-04 suffisant en direct drive).*\n"};
        
        const navList = document.getElementById('nav-list');
        const view = document.getElementById('view');
        
        function renderDoc(key) {
            view.innerHTML = marked.parse(docs[key]);
            mermaid.run({ nodes: view.querySelectorAll('.language-mermaid') });
            window.scrollTo(0, 0);
            document.querySelectorAll('.nav-item').forEach(el => { el.classList.toggle('active', el.dataset.key === key); });
            history.replaceState(null, null, '#' + encodeURIComponent(key));
        }
        
        let currentGroup = "";
        Object.keys(docs).forEach(label => {
            const [group, name] = label.split(': ');
            if (group !== currentGroup) {
                const groupEl = document.createElement('div');
                groupEl.className = 'nav-group';
                groupEl.innerText = group;
                navList.appendChild(groupEl);
                currentGroup = group;
            }
            const item = document.createElement('a');
            item.className = 'nav-item';
            item.innerText = name.replace(/_/g, ' ');
            item.dataset.key = label;
            item.onclick = () => renderDoc(label);
            navList.appendChild(item);
        });
        
        const hash = decodeURIComponent(window.location.hash.substring(1));
        if (hash && docs[hash]) { renderDoc(hash); } else { renderDoc("Fondations: 00_Index"); }
        
        view.addEventListener('click', (e) => {
            const link = e.target.closest('a');
            if (!link) return;
            const href = link.getAttribute('href');
            if (!href) return;
            if (href.startsWith('./') || href.endsWith('.md')) {
                e.preventDefault();
                const filename = href.replace('./', '').replace('.md', '');
                const match = Object.keys(docs).find(k => k.includes(filename));
                if (match) { renderDoc(match); }
            }
        });
    </script>
