)\n\n### 📊 Architecture Officielle K-Scale\nLe K-Bot standard est un robot humanoïde open-source de taille réelle développé par K-Scale Labs, équipé de **20 moteurs RobStride** pour 20 degrés de liberté. La configuration D-Bot étend cette base avec une tête articulée.\n\n**Source** : [K-Scale Official Documentation](https://docs.kscale.dev/robots/k-bot/motor-id-mapping)\n\n---\n\n### 🦾 BRAS (10 moteurs - 5 par bras)\n\n**Configuration par bras :**\n\n| Articulation | Moteur | IDs<br/>(G/D) | Couple<br/>Pic | Couple<br/>Nom. | Poids | Fonction |\n| :--- | :---: | :---: | :---: | :---: | :---: | :--- |\n| **Épaule Pitch** | **RS-04** | 11 / 21 | 120 N.m | 40 N.m | 1420g | Lever le bras frontalement |\n| **Épaule Roll** | **RS-03** | 12 / 22 | 60 N.m | 20 N.m | 880g | Écarter le bras |\n| **Épaule Yaw** | RS-02 | 13 / 23 | 17 N.m | 6 N.m | 405g | Rotation interne |\n| **Coude Pitch** | RS-02 | 14 / 24 | 17 N.m | 6 N.m | 405g | Flexion |\n| **Poignet Roll** | RS-00 | 15 / 25 | 14 N.m | 5 N.m | 310g | Orientation fine |\n\n**Total par bras** : 3 kg environ  \n**Total 2 bras** : 10 moteurs (4× RS-03 + 4× RS-02 + 2× RS-00)\n\n---\n\n### 🦵 JAMBES (10 moteurs - 5 par jambe)\n\n**Configuration par jambe :**\n\n| Articulation | Moteur | IDs<br/>(G/D) | Couple<br/>Pic | Couple<br/>Nom. | Poids | Fonction |\n| :--- | :---: | :---: | :---: | :---: | :---: | :--- |\n| **Hanche Pitch** | RS-04 | 31 / 41 | 120 N.m | 40 N.m | 1420g | Flexion jambe |\n| **Hanche Roll** | RS-03 | 32 / 42 | 60 N.m | 20 N.m | 880g | Équilibre latéral |\n| **Hanche Yaw** | RS-03 | 33 / 43 | 60 N.m | 20 N.m | 880g | Rotation hanche |\n| **Genou Pitch** | RS-04 | 34 / 44 | 120 N.m | 40 N.m | 1420g | Flexion genou |\n| **Cheville Pitch** | RS-02 | 35 / 45 | 17 N.m | 6 N.m | 405g | Propulsion (via mécanisme tirant) |\n\n**Total par jambe** : 4.6 kg environ  \n**Total 2 jambes** : 10 moteurs (4× RS-04 + 4× RS-03 + 2× RS-02)\n\n---\n\n### 🔢 INVENTAIRE K-BOT STANDARD\n\n| Modèle | Quantité | Poids Unit. | Poids Total | Usage Principal |\n| :---: | :---: | :---: | :---: | :--- |\n| **RS-04** | 6 | 1420g | 8.52 kg | Hanches Pitch + Genoux + **Épaules Pitch** |\n| **RS-03** | 10 | 880g | 8.80 kg | **Épaules Roll** + Rotations hanches + Chevilles Cardan |\n| **RS-06** | 2 | 621g | 1.24 kg | Coudes |\n| **RS-02** | 2 | 405g | 0.81 kg | Yaw épaules |\n| **RS-00** | 2 | 310g | 0.62 kg | Poignets |\n| **RS-05** | 2 | 191g | 0.38 kg | Cou Pan/Tilt |\n| **TOTAL** | **24** | — | **~20.37 kg** | **Ensemble du corps robotisé** |\n\n---\n\n### 🤖 ÉVOLUTION D-BOT (24 DOF — \"D-Bot Performance\")\n\nLe **D-Bot** étend le K-Bot de 20 à **24 DOF** avec trois ajouts. Voir [Analyse Biomécanique](./15_Analyse_Biomecanique.md) pour la justification détaillée de chaque upgrade.\n\n| Ajout D-Bot | Moteur | Quantité | Couple Pic | Fonction |\n| :--- | :---: | :---: | :---: | :--- |\n| **Cou Pan** (Yaw) | RS-05 | 1 | 5.5 N.m | Rotation horizontale tête |\n| **Cou Tilt** (Pitch) | RS-05 | 1 | 5.5 N.m | Inclinaison tête |\n| **Poignet Roll** 🆕 | RS-00 | 2 (ajout) | 14 N.m | **Orientation main** (compact, puissant) |\n\n**Total D-Bot** : 20 (Base) + 2 (Tête) + 2 (Chevilles Roll) = **24 moteurs**.\n\n> [!NOTE]\n> **Mécanisme de cheville D-Bot (Cardan + 2×RS-03)** : La cheville du K-Bot (RS-02) était insuffisante pour la marche dynamique. Le D-Bot la remplace par une architecture de cardan à deux axes concourants (DIN 808) pilotée par deux moteurs RS-03 via des bielles croisées. Ce différentiel mécanique offre 120 N.m en Pitch et Roll sans ajouter de masse distale (les moteurs sont haut dans le tibia).\n\n## 2. Pourquoi choisir les moteurs QDD (Quasi-Direct Drive) ?\n\nLes moteurs QDD tels que les **RobStride** de notre inventaire sont devenus le standard *de facto* pour la robotique agile (bipèdes, quadrupèdes) parce qu'ils réussissent là où les servos traditionnels échouent dans l'interaction avec le monde physique :\n\n1. **La Réversibilité (Backdrivability)** : Le \"Secret Sauce\". Grâce à une très faible réduction (autour de 9:1), le moteur offre peu de résistance s'il est poussé de l'extérieur. Lors d'un impact au sol en courant, la mécanique \"cédera\" souplement au lieu d'exploser les engrenages (contrairement à un servo dynamique bloqué par un ratio de 100:1).\n2. **Contrôle d'Impédance (Transparence)** : L'absence de frottement lourd permet de déduire la force externe simplement en lisant la consommation de courant (sans mettre de capteurs d'efforts coûteux). Le robot peut \"sentir\" le sol.\n3. **Densité de Couple Extraordinaire** : Orientés \"Outrunner\" (le rotor est à l'extérieur tel un volant d'inertie), les RobStride génèrent un couple d'arrachement pharaonique dans une taille de galette plate (ex: 60 N.m pour 880g sur le RS-03).\n4. **Intégration \"Tout-en-un\"** : ESC intégré, doubles encodeurs gérant le \"backlash\", et communication avec un simple bus CAN/Alimentation (seulement 4 fils parcourant la jambe).\n\n> [!WARNING]\n> **Le point faible à maîtriser** : Les servos traditionnels ont un frottement énorme freinant naturellement la chute. Les RobStride n'ayant aucun frein passif, s'ils doivent stabiliser 40 kg à l'arrêt, ils consommeront de l'énergie en courant continu et **chaufferont considérablement**. Une excellente dissipation thermique (interfaces en aluminium usinées à la CNC) est cruciale.\n\n## 3. Spécifications Moteurs RobStride (Gamme Complète)\nVoici les données techniques consolidées pour l'ensemble de la gamme RobStride (Février 2025).  \n*Prix officiels RobStride ou sources vérifiées (OpenELAB, AiFitLab) - Hors taxes/livraison.*\n\n| Modèle | Pic<br/>(N.m) | Nom.<br/>(N.m) | Vmax<br/>(RPM) | Poids<br/>(g) | Dim.<br/>(mm) | Ratio | Prix<br/>($) | Volt.<br/>(V) | Usage D-Bot |\n| :--- | :---: | :---: | :---: | :---: | :---: | :---: | :---: | :---: | :--- |\n| **RS-05** | **5.5** | 1.6 | 480 | **191** | 46×46×44 | 7.75:1 | **$120** | 48V (15-60V) | **Cou**, Doigts (futur) |\n| **RS-00** | **14.0** | 5.0 | 315 | **310** | 57×57×51 | 10:1 | **$135** | 48V (24-60V) | **Poignet** (Compact, fort couple) |\n| **RS-01** | **17.0** | 6.0 | 350 | **380** | 78.5×78.5×40 | 7.75:1 | **$140** | 36V (24-48V) | Alternative RS-02 (36V) |\n| **RS-02** | **17.0** | 6.0 | 410 | **405** | 78.5×78.5×45.5 | 7.75:1 | **$160** | 48V (24-60V) | **Coude**, Biceps, Poignet |\n| **RS-06** | **36.0** | 11.0 | 480 | **621** | 88×88×49 | 9:1 | **$230** | 48V (15-60V) | Entre-deux (Épaule légère) |\n| **RS-03** | **60.0** | 20.0 | 195 | **880** | 106×106×56 | 9:1 | **$250** | 48V (15-60V) | **Épaule**, Hanche rot. |\n| **RS-04** | **120.0** | 40.0 | 200 | **1420** | 120×120×56 | 9:1 | **$280** | 48V (15-60V) | **Hanche**, Genou, Cheville |\n| *Unitree GO-M8* | *23.7* | *~8.0* | *286* | *530* | *96.5×96.5×42.3* | *6.33:1* | *$369* | *24V (12-30V)* | *Alternative (Non CAN)* |\n\n### Analyse Comparative\n\n####  RS-05 vs RS-00 (Petits Moteurs)\n*   **RS-05** : Ultraléger (191g), idéal pour le cou où chaque gramme compte. Couple modeste (5.5 N.m) mais suffisant pour orientation.\n*   **RS-00** : Plus dense (310g, +62%) mais délivre **2,5× plus de couple** (14 N.m). Parfait pour un poignet devant porter des charges sans fléchir.\n\n#### RS-01 vs RS-02 (Moteurs Moyens)\n*   **Même couple** (17 N.m pic), mais **RS-01** optimisé pour **36V** (idéal pour batteries LiPo 8S), plus compact en profondeur (40mm vs 45.5mm).\n*   **RS-02** : Conçu pour **48V**, marginalement plus lourd (+25g). Standard pour D-Bot aux coudes/biceps.\n\n#### RS-06 (Intermédiaire Nouveau)\n*   **Niche** : Entre RS-02 (17 N.m) et RS-03 (60 N.m). Avec **36 N.m** et 621g, c'est un compromis pour des articulations nécessitant plus que du RS-02 sans le poids du RS-03.\n*   **Usage potentiel** : Épaule de petits robots, torse rotation, ou remplacer un RS-03 si l'on veut économiser 260g et 20$.\n\n#### 🆕 Alternative Externe : Unitree GO-M8010-6\n*   **Profil** : Avec **23.7 N.m** pour **530g**, il a d'excellentes caractéristiques qui le placent pile entre le RS-02 (405g) et le RS-06 (621g). Il est back-drivable, avec un ratio de 6.33:1. C'est le moteur réputé du robot chien Unitree Go1.\n*   **Pourquoi il n'est pas retenu pour le D-Bot** :\n    1.  **Protocole de Communication** : Il utilise le bus **RS-485**. Or, l'intégralité du D-Bot est câblée en **CAN 2.0B** (daisy-chain). Introduire du RS-485 casserait l'homogénéité du bus et forcerait l'ajout de contrôleurs/convertisseurs dédiés.\n    2.  **Prix** : À environ **$369**, il est beaucoup plus cher que la gamme RobStride (un RS-06, pourtant 50% plus coupleux, coûte $230).\n*   **Conclusion** : Très bon moteur intrinsèquement, mais **totalement déconseillé** ici pour des raisons d'intégration logicielle/matérielle et de budget.\n\n#### RS-03 vs RS-04 (Gros Moteurs)\n*   **Saut de performance brutal** : RS-03 → 60 N.m (880g) ; RS-04 → **120 N.m** (1420g, +61% poids).\n*   **Usage Épaule D-Bot** : Option Hybride retenue avec un **RS-04 en Pitch** (pour la force frontale) et un **RS-03 en Roll** (suffisant pour le latéral). **Attention** : Peut briser des pièces PLA/PETG standard → Utiliser **PETG-CF (100% remplissage)** ou **Alu 6061 CNC**.\n\n#### Analyse Thermique Statique (Charge de 39 kg)\nPour maintenir le robot de 39 kg debout avec les genoux légèrement fléchis (\"crouch stance\" - posture d'équilibre), chaque hanche et genou requiert environ **20 N.m** de couple de maintien permanent (holding torque). \n*   **Si on utilise le RS-03** (Résistance interne 0.39 Ω, Constante K_t 2.36 N.m/A) : Le moteur demande ~8.5 A continus. La dissipation thermique par effet Joule ($P=R \\cdot I^2$) s'élève à **~28 Watts**. Le moteur est à 100% de son couple nominal et surchauffera rapidement jusqu'à la coupure de sécurité.\n*   **Si on utilise le RS-04** (Résistance interne 0.16 Ω, Constante K_t 2.10 N.m/A) : Le moteur demande ~9.5 A. La dissipation thermique chute à **~14.5 Watts**. Le moteur n'est qu'à 50% de son nominal, dissipe deux fois moins de chaleur et possède 61% de masse métallique en plus pour absorber ces calories.\n**Verdict** : Le **RS-04** est obligatoire pour les hanches et genoux pour prévenir l'effondrement thermique. Le RS-03 (plus léger de 540g) reste le compromis idéal pour les chevilles. (L'utilisation de nos plaques d'interface aluminium fraisées CNC est critique pour ponctionner les 14.5W restants).\n\n#### Concept Futurs : Système de Verrouillage Statique (SVS)\nMême le RS-04 dissipe 14.5W au repos. Puisque les moteurs QDD n'ont pas de friction irréversible (frein passif), ils consument de l'énergie \"juste pour ne pas tomber\". Deux mécanismes anti-effondrement sont étudiés pour la suite du projet (usinables localement via la CNC C500) :\n1.  **SVS Électromagnétique (Solenoid Pin Lock)** : Usinage dans la plaque d'interface en aluminium d'un logement pour un micro-solénoïde tubulaire. Lorsque le robot passe en mode \"Stand-by\" (posture parfaitement définie), le solénoïde pousse une broche de métal (pin) dans un trou borgne du rotor du RS-04. L'articulation est verrouillée mécaniquement. L'alimentation du RS-04 peut être coupée à 0A sans que le robot ne s'effondre.\n2.  **SVS Servo-Cliquet (Ratchet & Pawl)** : Remplacement de la broche par un cliquet hélicoïdal sur la couronne du moteur, engagé par un micro-servo. Ce système plus robuste limite la flexion mais autorise librement le mouvement d'extension (pour se relever).\n\n### Choix pour le D-Bot — Répartition Complète (24 DOF)\n| Zone | Moteur | Quantité | Couple Pic | Justification |\n| :--- | :---: | :---: | :---: | :--- |\n| Cou (Pan/Tilt) | RS-05 | 2 | 5.5 N.m | Légèreté critique (tête avec OAK-D Pro ~100g, LiDAR L2 sur le torse) |\n| Poignet Roll | RS-00 | 2 | 14 N.m | Compact, fort couple pour manipulation fine |\n| Coude Pitch | RS-06 | 2 | 36 N.m | Force intermédiaire pour manipulation bras plié |\n| Épaule Yaw | RS-02 | 2 | 17 N.m | Rotation de l'humérus proximale |\n| Épaule Pitch | **RS-04** | 2 | 120 N.m | Force pour porte-à-faux bras tendu |\n| Épaule Roll | **RS-03** | 2 | 60 N.m | Écartement latéral bras |\n| Hanche Roll/Yaw | RS-03 | 4 | 60 N.m | Équilibre latéral + rotation |\n| Hanche Pitch + Genou | RS-04 | 4 | 120 N.m | Portance totale dynamique |\n| Cheville (Pitch/Roll) | RS-03 | 4 | 120 N.m (Cardan) | Propulsion via bielles et cardan DIN 808 (2× RS-03 par cheville) |\n\n**Total moteurs D-Bot** : 2 (Cou) + 2 (Poignets) + 2 (Coudes) + 2 (Yaws) + 4 (Epaules) + 4 (Hanches R/Y) + 4 (Hanches/Genoux P) + 4 (Chevilles) = **24 moteurs**.\n\n> [!NOTE]\n> **Décisions Architecturales Finales** : Le tableau ci-dessus reflète les conclusions de l'**option de performance maximale** (architecture V2). L'ancienne configuration cheville (RS-02/RS-00) a été remplacée par l'architecture Cardan (2× RS-03), et le coude (RS-02) par le RS-06. (Voir Documents 15 et 16).\n\n## 4. Communication & Alimentation\nTous les moteurs partagent le même protocole :\n*   **Bus** : CAN 2.0B @ 1 Mbps.\n*   **Alimentation** : 48V DC Nominal (Supportent 24V mais avec couple/vitesse réduits). RS-01 optimisé pour 36V.\n*   **Câblage** : Daisy-chain (Chaîne) via connecteurs JST-GH 1.25mm (Data) et XT60 (Power).\n*   **Encodeurs** : Dual 14-bit magnetic encoders (haute précision + redondance).\n*   **Protection** : IP52 standard (IP67 en option sur certains modèles).\n\n> [!WARNING]\n> **Attention au RS-04** : Avec 120 N.m de couple, ce moteur peut briser des pièces imprimées en PLA ou PETG standard en cas de collision. Utilisez impérativement du **PETG-CF** (Remplissage 100%) ou des pièces CNC Alu 6061 pour les brackets de hanches.\n\n> [!NOTE]\n> **Prix et Disponibilité** : Les prix sont issus des sources officielles RobStride et distributeurs agréés (OpenELAB, AiFitLab) en Février 2025. Vérifiez la disponibilité avant commande - certains modèles peuvent avoir des délais variables.\n\n---\n\n## 5. Benchmark Industrie — D-Bot vs Robots Haut de Gamme\n\n### 4.1 Comparatif Global (Corps Entier)\n\n| Robot | DOF | DOF/Jambe | Cheville | Méca. Cheville | Couple max jambe | Poids | Actionneurs | Prix |\n| :--- | :---: | :---: | :---: | :--- | :---: | :---: | :--- | :---: |\n| **D-Bot (notre)** | **24** | **6** | **2 (P+R)** | **Série QDD** | **120 N.m** (RS-04) | ~38 kg | QDD RobStride 9:1 | ~$5k |\n| K-Bot (base) | 20 | 5 | 1 (P) | Tirant (linkage) | 120 N.m (RS-04) | ~34 kg | QDD RobStride 9:1 | ~$4k |\n| **Unitree G1** | 23 | **6** | **2** | **Parallèle RSU** | **120 N.m** | 35-47 kg | QDD propriétaire | ~$16k |\n| **Tesla Optimus** | 28+ | 6 | 2 | **Parallèle SPU** | **180 N.m** rotary / 8000N linéaire | ~73 kg | Harmonic + Linéaire | N/A |\n| **Figure 02** | 28 | 6 | 2 | **Universel + linéaire** | **150 N.m** | ~60 kg | Custom harmonic | N/A |\n| **Fourier GR-2** | 53 | ~8 | 2+ | **Parallèle** (FSA 2.0) | **380 N.m** | 63 kg | FSA 2.0 (7 types) | ~$150k |\n| **Agility Digit** | 28 | 5 | 2 | **SEA** (élastique) | N/A | 65 kg | Series-Elastic | ~$300k+ |\n\n> [!NOTE]\n> **Positionnement D-Bot** : Avec 24 DOF, 6 DOF/jambe et 2 DOF cheville, le D-Bot est au niveau du Unitree G1 en terme d'architecture cinématique, pour un budget 3× inférieur. Le principal écart est le type de mécanisme de cheville (série vs parallèle).\n\n### 4.2 Mécanismes de Cheville — Les 4 Approches\n\n![Comparaison des 3 mécanismes de cheville principaux : Série, Tirant, Parallèle](./assets/ankle_mechanisms_comparison.png)\n\n#### A. Série Direct-Drive (❌ D-Bot V1 Historique — Abandonné)\n\n> ⚠️ **Cette architecture a été abandonnée.** La configuration finale D-Bot utilise le **Cardan DIN 808 + 2×RS-03** (voir §4.5 et [Conclusions Architecture](./16_Conclusions_Architecture_DBot.md)).\n\nLe moteur Pitch (RS-02) est monté **en haut du tibia** avec tirant/bielle (architecture K-Bot conservée). Le Roll (RS-00) est monté **directement à la cheville** en direct-drive.\n\n| Paramètre | Valeur |\n| :--- | :--- |\n| **Moteurs** | RS-02 (Pitch, haut tibia + tirant) + RS-00 (Roll, à la cheville) |\n| **Masse distale** | **~1190g** (880g + 310g) |\n| **Couple Pitch effectif** | ~34 N.m (RS-02 17 N.m × ratio tirant ~2:1) |\n| **Couple Roll effectif** | 14 N.m (= couple RS-00, suffisant corrections fines) |\n| **Complexité** | ⭐ Très faible — assemblage trivial |\n| **Coût mécanique** | ~$0 (juste le bracket en L) |\n\n#### B. Tirant / Linkage (K-Bot Original)\n\nLe moteur RS-02 est monté **en haut du tibia** et actionne le pied via un **pushrod** (barre de poussée). Le ratio de levier multiplie le couple.\n\n| Paramètre | Valeur |\n| :--- | :--- |\n| **Moteurs** | RS-02 (Pitch uniquement), haut dans le tibia |\n| **Masse distale** | **~0g** (moteur en haut) |\n| **Couple Pitch effectif** | ~34 N.m (17 × ratio ~2:1) |\n| **Roll** | ❌ Absent |\n| **Complexité** | ⭐⭐ Moyenne — pushrod + pivot |\n| **Coût mécanique** | ~$20-50 (barre usinée + pivots) |\n\n#### C. 🆕 Hybride Tirant + Roll Direct (Proposition D-Bot V2)\n\n**Combine le meilleur des deux mondes** : Pitch via tirant (moteur haut, couple multiplié) + Roll en direct-drive à la cheville (correction fine, pas besoin de rapport de levier).\n\n| Paramètre | Valeur |\n| :--- | :--- |\n| **Moteur Pitch** | RS-02 → **RS-03** monté **haut dans le tibia** + pushrod |\n| **Moteur Roll** | RS-00 monté **à la cheville** (direct-drive) |\n| **Masse distale** | **~310g** (seulement le RS-00 Roll) |\n| **Couple Pitch effectif** | **~120 N.m** (60 × ratio ~2:1) ⚡ |\n| **Couple Roll effectif** | 14 N.m (suffisant pour correction latérale) |\n| **Complexité** | ⭐⭐⭐ Élevée — pushrod + bracket + pivot |\n| **Coût mécanique** | ~$50-100 (barre, pivots, usinage) |\n\n```\n  ┌─────┐\n  │GENOU│\n  └──┬──┘\n     │\n  ╔══╧══╗ RS-03 Pitch ← Moteur HAUT (880g)\n  ║PITCH║──────┐\n  ╚═════╝      │ Pushrod\n     │ Tibia   │ (barre de poussée)\n     │         │\n     │         │ Ratio levier ~2:1\n     │         │ → 60 × 2 = 120 N.m effectifs !\n     │         │\n     │    ╔════╧═╗\n     └────╢ ROLL ╟── RS-00 (310g) ← Seul moteur EN BAS (compact 57mm)\n          ╚══╤═══╝\n          ┌──┴──┐\n          │PIED │\n          └─────┘\n```\n\n#### D. Parallèle 2 Bielles Rotulées (Unitree G1, LOLA TUM)\n\nDeux moteurs montés **en haut du tibia**, chacun relié au pied par une **bielle avec rotules** (rod end bearings). Mouvements coordonnés = Pitch, différentiels = Roll. **Aucun moteur à la cheville.**\n\n```\n    Moteur A            Moteur B      ← 2 moteurs HAUT dans le tibia\n       │                    │\n       │ Bielle A           │ Bielle B    ← Tiges filetées M4 avec\n       │ (rod end +         │               rod end bearing (rotule)\n       │  tige M4)          │               à chaque extrémité\n       │                    │\n       ╰────────┬───────────╯\n                │\n           ┌────┴────┐\n           │  PIED   │        ← Plateforme mobile (2 DOF)\n           └─────────┘\n\nA↑ + B↑ (même sens)    = PITCH (flexion/extension)\nA↑ + B↓ (sens opposé) = ROLL  (inversion/éversion)\n```\n\n| Paramètre | Valeur |\n| :--- | :--- |\n| **Moteurs** | 2× RS-02 (ou RS-03 pour plus de couple) haut dans le tibia |\n| **Bielles** | 2× tiges filetées M4 inox (60-100mm) + 4× rod end bearings M4 |\n| **Masse distale** | **~0g** (seules les bielles sont en bas, ~20g/bielle) |\n| **Couple Pitch effectif** | ~34 N.m (2× RS-02) ou ~120 N.m (2× RS-03) |\n| **Couple Roll effectif** | ~17 N.m (2× RS-02) ou ~60 N.m (2× RS-03) |\n| **Complexité** | ⭐⭐⭐⭐ Très élevée — cinématique parallèle inverse |\n| **Coût mécanique** | ~$20-50 (bielles RC + brackets imprimés/CNC) |\n\n**Implémentations industrielles :**\n\n| Robot | Type de bielle | Moteur | Particularité |\n| :--- | :--- | :--- | :--- |\n| **Unitree G1** | Bielles rotatives parallèles | QDD propriétaire | Mode AB (moteurs) / PR (Pitch-Roll), cinématique inverse intégrée |\n| **LOLA (TUM)** | Vis à billes (ball-screw) linéaires | Drives linéaires | 2 vis actionnent le pied — même sens = Pitch, sens inverse = Roll |\n| **Tesla Optimus** | SPU (Spherical-Prismatic-Universal) | Actionneurs linéaires custom | Universal joint + prismatic drives, couple >180 N.m (brevet WO2024072984A1) |\n\n> [!WARNING]\n> **Fourier GR-2 : marche arrière sur le parallèle.** En septembre 2024, Fourier Intelligence a **abandonné l'architecture parallèle** au profit du série pour le GR-2. Raisons officielles :\n> - Simplification du **système de contrôle** (cinématique inverse complexe éliminée)\n> - **Débogage** et maintenance facilités  \n> - **Coûts de fabrication** réduits\n> - Meilleur **transfert sim-to-real** (simulation → robot physique)\n>\n> C'est un signal fort : le parallèle n'est optimal que si l'on maîtrise parfaitement la cinématique et si les performances l'exigent. Pour un premier prototype, la configuration série ou hybride est plus prudente.\n\n### 4.3 Composants Pré-Assemblés pour Solution Parallèle (Sourcing)\n\nPour une solution 2-bielles, les composants RC hélicoptère/drone sont **directement réutilisables** :\n\n| Composant | Référence Type | Source | Prix | Note |\n| :--- | :--- | :--- | :---: | :--- |\n| **Rod end bearing M4** (rotule femelle) | Fisheye ball bearing SA4T/K | AliExpress, eBay | **$3-8 / 10pcs** | Acier roulements, ±15° angle |\n| **Tige filetée M4 inox** (bielle) | Tige M4 × 80mm | Quincaillerie | **$2-5** | Longueur réglable (écrou) |\n| **Kit pushrod RC complet** | RJX Hobby M3/M4 swashplate linkage | RJXHobby, AliExpress | **$5-12 / kit** | Tige + 2 rod ends pré-assemblés |\n| **Rod end M4 double filetage** (CW+CCW) | Pour longueur réglable sans démontage | AliExpress | **$5-10 / lot** | Comme les tirants de direction auto |\n| **Rotule industrielle** (Heim joint M4) | M4 male/female rod end | RS Components, Misumi | **$3-8 / pièce** | Qualité supérieure |\n\n> [!NOTE]\n> **Il n'existe PAS de kit \"2-bielles parallèle pour cheville robot\" pré-assemblé clé en main.** Mais les composants individuels (rod ends + tiges) issus du monde RC hélicoptère (plateau cyclique / swashplate) sont **identiques** mécaniquement et coûtent ~$15-25 pour équiper les 2 chevilles. L'assemblage final nécessite un bracket custom (impression 3D ou CNC).\n\n**BOM Estimé — Kit 2 bielles par cheville :**\n\n| Pièce | Qté (×2 chevilles) | Coût |\n| :--- | :---: | :---: |\n| Rod end bearing M4 (rotules) | 8 (4 par cheville) | ~$8 |\n| Tiges filetées M4 × 80mm inox | 4 | ~$5 |\n| Écrous M4 frein (nylstop) | 8 | ~$2 |\n| Brackets pivot (impression 3D PA12-CF) | 4 (2 haut tibia + 2 bas pied) | ~$15 (filament) |\n| Visserie M4 × 12mm inox | 16 | ~$3 |\n| **Total bielles** | | **~$33** |\n\n### 4.4 Impact sur la Marche et la Course\n\n| Critère | A. Tirant+Roll (V1) | B. Tirant seul (K-Bot) | C. Tirant RS-03 (V2) | D. Parallèle (V3) |\n| :--- | :---: | :---: | :---: | :---: |\n| **Masse distale (par jambe)** | 310g | ~0g | **310g** | ~0g |\n| **Couple Pitch effectif** | ~34 N.m | ~34 N.m | **~120 N.m** ⚡ | ~34-120 N.m |\n| **Couple Roll** | 14 N.m (RS-00) | ❌ | 14 N.m (RS-00) | ~60 N.m |\n| **Marche lente (<1 km/h)** | ✅ **OK** (Déroulé pied) | ✅ **OK** (Déroulé pied) | ✅ **Excellent** | ✅ Optimal |\n| **Marche normale (2-3 km/h)** | ❌ Couple insuffisant | ❌ (pas de Roll) | ✅ **Excellent** | ✅ Optimal |\n| **Marche rapide (3-4 km/h)** | ❌ Couple insuffisant | ❌ (pas de Roll) | ⚠️ Roll au pic | ✅ Bon |\n| **Course (>5 km/h)** | ❌ Trop d'inertie | ❌ (1 DOF) | ⚠️ **Possible** | ✅ Optimal |\n| **Terrain irrégulier** | ✅ (2 DOF) | ❌ (1 DOF) | ✅ (2 DOF) | ✅ (2 DOF) |\n| **Simplicité montage** | ⭐ Trivial | ⭐⭐ Moyen | ⭐⭐⭐ Élevé | ⭐⭐⭐⭐ Très élevé |\n| **Coût mécanique** | $0 | $20-50 | $50-100 | $33-100 |\n\n#### Analyse Détaillée de l'Impact Inertiel\n\n```\nMoment d'inertie de la jambe pendant le balancement (swing phase) :\n\nI = Σ(m × r²) où r = distance au pivot (hanche)\n\n                    Masse distale    r (dist. hanche)    Contribution I\nD-Bot V1 (tirant):  310g             ~0.70 m             152 g.m²  ← RS-00 seul en bas\nV2 (RS-03 tirant):  310g             ~0.70 m             152 g.m²  ← Même (RS-00 seul en bas)\nV3 (parallèle):    ~40g             ~0.70 m              ~20 g.m²  ← Optimal\n\n→ V1 et V2 ont la même masse distale (~310g = RS-00 Roll seul) car le Pitch est toujours en haut du tibia.\n→ Le Parallèle (V3) élimine tout moteur à la cheville.\n```\n\n**Conséquences concrètes de l'inertie :**\n- **Marche** : Plus l'inertie est basse, plus la jambe balance vite → pas plus rapides, moins de couple requis aux hanches.\n- **Course** : À >5 km/h, la fréquence de pas monte à ~3 Hz. Avec seulement 310g en bout de jambe (RS-00 Roll), l'inertie oscillante est déjà faible. Le V3 parallèle l'élimine quasi-totalement → la course devient **envisageable**.\n- **Chutes** : Moins d'inertie = réactions de rattrapage plus rapides.\n\n### 4.5 Recommandation Évolutive\n\n| Phase | Config Cheville | Moteurs | Coût additionnel | Pourquoi |\n| :--- | :--- | :--- | :---: | :--- |\n| **V1** (prototype) | **A. Tirant K-Bot** + RS-00 Roll | RS-02 Pitch (tirant) + RS-00 Roll | $0 | Architecture K-Bot éprouvée, **suffisante pour marche V1** |\n| **V2** (optimisation) | **C. Tirant RS-06** + RS-00 Roll | RS-02 → **RS-06** Pitch (tirant) | ~$70 (RS-06 - RS-02) | Couple Pitch ×2 (~72 N.m), **Sweet Spot** poids/couple |\n| **V3** (performances) | **D. Parallèle** 2 bielles | 2× RS-06 (ou RS-03) + bielles | ~$33 bielles | Inertie ~0g, couple Roll par différentiel |\n\n> [!TIP]\n> **Progression V1 → V2** : Le **RS-06** (36 N.m) est l'upgrade parfait. Il double le couple du RS-02 (72 N.m effectif) pour seulement +75g, permettant la marche rapide et l'absorption des chocs. Le RS-03 (V3) est réservé aux usages extrêmes.\n>\n> **Progression V2 → V3** : Remplace le tirant + RS-00 par 2 bielles parallèles rotulées. Les 2 moteurs (RS-02 ou RS-03) en parallèle donnent Pitch + Roll par coordination/différentiel. Aucun moteur à la cheville = inertie minimale.\n\n", "Conception: 15_Hub_Biomecanique": "# 15 — Analyse Biomécanique D-Bot (Hub)\n\nCette section a été restructurée pour plus de clarté. Le contenu est désormais réparti en **4 documents spécialisés** et un **document de conclusions**.\n\n---\n\n## Navigation\n\n| # | Document | Contenu | Lignes |\n| :---: | :--- | :--- | :---: |\n| **15a** | [Locomotion & Portage (Baseline K-Bot)](./15a_Analyse_Locomotion_Baseline.md) | Paramètres physiques, couples requis marche/course/portage, faiblesses initiales | ~200 |\n| **15b** | [Configurations Moteurs & Évolutions](./15b_Configurations_Moteurs.md) | Options A/B/C/D, comparatifs, DOF Roll, stabilité, capteurs FSR, algorithmes | ~900 |\n| **15c** | [Révision Cardan 39 kg](./15c_Revision_Cardan_39kg.md) | Recalcul complet avec masse 39 kg et architecture cheville cardan 2×RS-03 | ~200 |\n| **15d** | [Genou — Analyse & Solution GT3](./15d_Genou_et_Course.md) | **Document principal genou (fusionné 15d+15g)** — S1 à S5 explorées, S6 (GT3 2.5:1, 300 N.m) retenue, compatibilité F-A-R hanche validée | ~300 |\n| **15e** | [Alternatives Moteurs Genou](./15e_Alternatives_Moteurs_Genou.md) | Comparatif RS-02, RS-03, RS-06 pour upgrades | ~150 |\n| **15g** | [→ Redirection vers 15d](./15g_Solution_S6_Courroie_GT3_Genou.md) | Contenu fusionné dans 15d (Avril 2026) | — |\n| **15h** | [Alternatives Transmission Genou](./15h_Alternatives_Transmission_Genou.md) | Archive des débats Vérins Linéaires vs Chaîne vs Courroie vs Pivots Variables | ~70 |\n| **16** | [**Conclusions & Architecture Finale D-Bot**](./16_Conclusions_Architecture_DBot.md) | **Décisions finales par articulation. Lire en premier.** | ~100 |\n\n---\n\n## Logique de Lecture Recommandée\n\n```\nNouveau lecteur :\n  → 16_Conclusions  (résumé décisions)\n  → 15c (recalcul définitif 39 kg)\n  → 15d (course et genou)\n\nAnalyse historique :\n  → 15a (baseline K-Bot)\n  → 15b (toutes les options étudiées)\n\nIngénierie détaillée :\n  → 15b §7-10 (configurations finales, capteurs)\n  → 15d §12.3.1 (cinématique tirant genou)\n```\n\n---\n\n*Document restructuré en Mars 2026 — contenu complet dans les 4 sous-documents ci-dessus.*\n", "Conception: 15c_Cardan_39kg": "# 15c — Re-Analyse Biomécanique : Configuration Cardan (39 kg)\n\n> **Série Biomécanique :**\n> - [15a] [Locomotion Baseline](./15a_Analyse_Locomotion_Baseline.md)\n> - [15b] [Configurations Moteurs & Évolutions](./15b_Configurations_Moteurs.md)\n> - [15c] **Révision Configuration Cardan 39 kg** ← *vous êtes ici*\n> - [15d] [Genou & Course — Solutions](./15d_Genou_et_Course.md)\n> - [16] [**Conclusions & Architecture Finale D-Bot**](./16_Conclusions_Architecture_DBot.md)\n\nCe document recalcule toutes les performances de marche et de portage avec les paramètres définitifs du D-Bot : **masse ~39 kg** et architecture cheville **Cardan DIN 808 + 2× RS-03** (120 N.m par cheville, Pitch ET Roll).\n\n---\n\n## 11. Re-Analyse Biomécanique — Configuration Cardan (Mars 2026)\n\n> *Cette section met à jour l'ensemble des calculs précédents avec les nouveaux paramètres du D-Bot : masse ~39 kg et architecture cheville à Cardan DIN 808 + 2× RS-03 (120 N.m par cheville, Pitch ET Roll).*\n\n### 11.1 Nouveaux Paramètres de Référence\n\n| Paramètre | Ancien (K-Bot base) | Nouveau (D-Bot Cardan) | Δ |\n| :--- | :---: | :---: | :---: |\n| **Masse totale** | 34 kg | **~39 kg** | +5 kg |\n| **Cheville Pitch (couple effectif)** | RS-02+tirant → ~34 N.m | **2× RS-03 cardan → 120 N.m** | **×3.5** |\n| **Cheville Roll (couple effectif)** | RS-00 → 14 N.m | **2× RS-03 cardan différentiel → 120 N.m** | **×8.5** |\n| **Masse distale cheville** | RS-00: 310g en bas du tibia | ~0g (moteurs RS-03 en haut du tibia) | **-310g** |\n| **Architecture cheville** | Série (tirant + direct) | Différentiel (2 bielles) | — |\n\n> [!NOTE]\n> **Paramètres géométriques conservés** : Hauteur 1.40 m, bras de levier pied ~0.10 m, longueurs segments identiques à l'analyse précédente. Seules la masse et les couples de cheville changent.\n\n---\n\n### 11.2 Marche Lente (< 1 km/h) — Recalcul\n\n#### Couple Cheville Pitch requis (statique)\n\n```\nM = 39 kg,  g = 9.81 m/s²,  L_pied = 0.10 m\n\nτ_cheville_Pitch = M × g × L_pied\n                 = 39 × 9.81 × 0.10\n                 = 38.3 N.m  (statique, pied plat)\n                 ≈ 45-55 N.m (dynamique, déroulé du pied)\n```\n\n#### Couples Hanches et Genou (marche lente, appui simple)\n\n```\nPhase appui simple : 1 jambe supporte 39 kg\n\nτ_hanche_Pitch ≈ M × g × 0.13 m (bras de levier horizontal)\n               ≈ 49.7 N.m\n\nτ_genou ≈ M × g × (L_tibia/2 + L_cuisse/2)\n        ≈ 39 × 9.81 × 0.18\n        ≈ 68.8 N.m\n\nτ_hanche_Roll ≈ M × g × 0.05 m (déport latéral CoM)\n              ≈ 19.1 N.m\n```\n\n#### Tableau Récapitulatif — Marche Lente\n\n| Articulation | Moteur | Couple Dispo (Pic) | Couple Requis | Marge | Verdict |\n| :--- | :---: | :---: | :---: | :---: | :---: |\n| **Hanche Pitch** (RS-04) | RS-04 | 120 N.m | **~50 N.m** | **+140%** | ✅ Confortable |\n| **Hanche Roll** (RS-03) | RS-03 | 60 N.m | **~20 N.m** | **+200%** | ✅ Très large |\n| **Hanche Yaw** (RS-03) | RS-03 | 60 N.m | **~15 N.m** | **+300%** | ✅ Surplus |\n| **Genou Pitch** (RS-04) | RS-04 | 120 N.m | **~69 N.m** | **+74%** | ✅ OK ← +15% vs 34 kg |\n| **Cheville Pitch** (2× RS-03) | 2× RS-03 | **120 N.m** | **~45 N.m** | **+167%** | ✅ **EXCELLENT** ← était limite ❌ |\n| **Cheville Roll** (2× RS-03) | 2× RS-03 | **120 N.m** | **~20 N.m** | **+500%** | ✅ **TRÈS LARGE** |\n\n> [!IMPORTANT]\n> **L'ancienne limite critique est résolue.** La cheville Pitch obligeait une marge de ~0% avec le RS-02+tirant (34 N.m vs 33.4 requis). Avec 2× RS-03 (120 N.m), la marge est de +167% pour **39 kg**. Cette marge suffit même pour une masse de 70 kg — le D-Bot a une réserve énorme.\n\n---\n\n### 11.3 Marche Normale (2–3 km/h) — Recalcul\n\nEn marche normale, les forces d'impact doublent par rapport au statique (facteur dynamique ×1.5–2.0 selon l'allure).\n\n```\nCouples dynamiques estimés (facteur ×1.7) :\n\nτ_cheville_Pitch ≈ 38.3 × 1.7 = 65 N.m\nτ_hanche_Pitch   ≈ 49.7 × 1.7 = 84 N.m\nτ_genou          ≈ 68.8 × 1.7 = 117 N.m   ← Proche du pic RS-04 !\nτ_cheville_Roll  ≈ 19.1 × 2.0 = 38 N.m   (corrections latérales plus rapides)\n```\n\n| Articulation | Couple Dispo (Pic) | Couple Requis (Dynamique) | Marge | Verdict |\n| :--- | :---: | :---: | :---: | :---: |\n| **Hanche Pitch** (RS-04) | 120 N.m | **~84 N.m** | +43% | ✅ OK |\n| **Genou Pitch** (RS-04) | 120 N.m | **~117 N.m** | +3% | ⚠️ **AU PIC** (transitoire) |\n| **Cheville Pitch** (2× RS-03) | 120 N.m | **~65 N.m** | **+85%** | ✅ **CONFORTABLE** |\n| **Cheville Roll** (2× RS-03) | 120 N.m | **~38 N.m** | **+216%** | ✅ **Très large** |\n\n> [!WARNING]\n> **Genou RS-04 au pic à 2-3 km/h.** À 39 kg avec facteur dynamique ×1.7, le couple genou atteint ~117 N.m, très proche du pic RS-04 (120 N.m). En pratique, les pics durent < 50 ms et les RS-04 supportent des dépassements transitoires. Mais la marge de confort est réduite. Recommandation : veiller à l'algorithme de marche pour lisser les impacts (ZMP control, courbe de jerk).\n\n> [!NOTE]\n> **Cheville : totalement résolue.** La cheville Pitch (65 N.m requis vs 120 N.m dispo) a désormais +85% de marge même à masse supérieure et en dynamique. C'est un bond qualitatif massif par rapport à l'ancienne configuration (34 N.m = 0% marge statique).\n\n---\n\n### 11.4 Seuil de Course (> 4 km/h) — Estimation\n\nLa course implique une phase de vol (les 2 pieds quittent le sol). Les couples pics sont estimés à ×2.5–3.0 fois le statique sur les articulations propulsives.\n\n```\nτ_cheville_Pitch_course ≈ 38.3 × 2.7 = 103 N.m\nτ_hanche_Pitch_course   ≈ 49.7 × 2.3 = 114 N.m\nτ_genou_course          ≈ 68.8 × 2.5 = 172 N.m  ← Dépasse RS-04 !\n\nFréquence de pas requise (4 km/h) : ~2.5 Hz\nVitesse rotation genou (4 km/h) : ~120-180 RPM\nVitesse max RS-04 : 200 RPM → ✅ Vitesse OK\n```\n\n| Articulation | Couple Dispo | Couple Requis (Course) | Marge | Verdict |\n| :--- | :---: | :---: | :---: | :---: |\n| **Hanche Pitch** (RS-04) | 120 N.m | **~114 N.m** | +5% | ⚠️ **AU PIC** |\n| **Genou Pitch** (RS-04) | 120 N.m | **~172 N.m** | ❌ -30% | ❌ **INSUFFISANT** |\n| **Cheville Pitch** (2× RS-03) | 120 N.m | **~103 N.m** | **+17%** | ✅ **Viable** ← changement majeur ! |\n| **Cheville Roll** (2× RS-03) | 120 N.m | **~50 N.m** | **+140%** | ✅ Large |\n\n> [!IMPORTANT]\n> **Révélation majeure : la cheville n'est plus le goulot d'étranglement pour la course !**\n> Avec 2× RS-03 (120 N.m), la cheville couvre +17% de marge même en phase de course à 4 km/h.\n> Le **genou RS-04 devient le nouveau goulot** (172 N.m requis vs 120 N.m disponible). Pour envisager la course (> 4 km/h), il faudrait :\n> - Un mécanisme **SEA au genou** (ressort en série = récupération d'énergie, puissance effectivement multipliée) — V2/V3.\n> - Ou un **genou à câble linéaire** (comme Optimus/Figure) permettant des actionneurs plus puissants.\n\n---\n\n### 11.5 Vitesse de Marche Maximale Estimée\n\nOn peut estimer la vitesse maximale en marche normale (sans phase de vol) en cherchant la vitesse à laquelle le genou atteint son pic (120 N.m) :\n\n```\nτ_genou(v) = 68.8 × facteur_dynamique(v)\n\nFacteur dynamique(v) ≈ 1 + 0.08 × v (estimation empirique, v en km/h)\nSeuil pic genou : 120 = 68.8 × (1 + 0.08 × v)\n                  1.743 = 1 + 0.08 × v\n                  v_max ≈ 9.3 km/h ← marche rapide large !\n```\n\n> [!TIP]\n> **Vitesse de marche max estimée : ~9 km/h.** C'est la limite théorique avant que le genou RS-04 atteigne son couple de blocage en régime de marche (sans phase de vol). En pratique, la limite réelle sera ~5-6 km/h (marge thermique, contrôle). C'est un résultat très performant, comparable au Unitree G1.\n\n---\n\n### 11.6 Re-Analyse du Portage (Impact de la Masse Supplémentaire)\n\nLe portage dépend principalement de l'épaule et du coude, pas de la masse du robot. L'augmentation de 34→39 kg n'affecte que le couple de **compensation gravitationnelle du bras propre** du robot.\n\n```\nCouple bras seul (épaule, bras tendu) = Masse_bras × g × L_bras/2\n= 3 kg × 9.81 × 0.235 m  = 6.9 N.m   (inchangé, le bras pèse toujours ~3 kg)\n```\n\nLes tableaux de portage précédents (Section 3) **restent valides** → la capacité de portage est inchangée.\n\n| Cas de Portage | Couple Épaule Requis | Couple Dispo (RS-03) | Verdict |\n| :--- | :---: | :---: | :---: |\n| **2 kg bras tendu** (continu) | ~19 N.m | 60 / 20 N.m | ✅ OK |\n| **5 kg bras tendu** (pic) | ~33 N.m | 60 N.m pic | ⚠️ Transitoire |\n| **2 kg bras tendu** (continu) | ~24 N.m | RS-06 coude : 36 N.m | ✅ OK si RS-06 |\n\n---\n\n### 11.7 Synthèse de la Validité — Configuration Cardan 39 kg\n\n| Scénario | Config Précédente (34 kg, RS-02) | Config Cardan (39 kg, 2× RS-03) | Verdict |\n| :--- | :---: | :---: | :---: |\n| **Équilibre statique** | ⚠️ Marge 0% | ✅ **+167%** | 🟢 Résolu |\n| **Marche lente (< 1 km/h)** | ✅ Viable (limite) | ✅ **Très confortable** | 🟢 Amélioré |\n| **Marche normale (2-3 km/h)** | ❌ Cheville bloquante | ✅ **Cheville OK** | 🟢 Résolu |\n| **Marche rapide (3-5 km/h)** | ❌ Impossible | ✅ **Possible (~5 km/h)** | 🟢 Nouveau! |\n| **Vitesse max estimée** | < 2 km/h | **~5-6 km/h pratique, ~9 km/h théorique** | 🟢 Majeur |\n| **Course (> 4 km/h)** | ❌ Impossible | ⚠️ **Genou bloquant** (SEA nécessaire v2) | 🟡 Partiel |\n| **Stabilité latérale (Roll)** | ❌ RS-00 limité | ✅ **120 N.m** (×8 vs avant) | 🟢 Exceptionnel |\n| **Portage bras tendu 2 kg** | ✅ OK | ✅ **Inchangé** | ✅ |\n| **Masse distale jambe** | 310g | **~0g** | 🟢 Inertie réduite |\n\n> [!IMPORTANT]\n> **Conclusion générale** : Les calculs restent valides mais dans un sens très positif. La masse augmentée de 5 kg (+15%) est largement compensée par le gain de couple de cheville (+250%). Le D-Bot avec l'architecture Cardan passe d'un robot capable de marcher lentement à un robot capable de marcher normalement à 3-5 km/h. La course reste hors portée sans SEA au genou, mais la cheville n'est plus le facteur limitant.\n\n> [!NOTE]\n> **Le genou (RS-04) devient le prochain point d'attention.** À 39 kg et 2-3 km/h, il opère à ~97% de son pic. Il n'y a pas de risque immédiat (les Robstride supportent les dépassements transitoires < 100ms), mais le contrôle de marche devra lisser les impacts. C'est un objectif de tuning algorithmique, pas un problème matériel bloquant.\n\n---\n*Section ajoutée en Mars 2026 suite à la révision de l'architecture cheville (Cardan DIN 808 + 2× RS-03) et à la mise à jour de la masse de référence (~39 kg).*\n\n---\n---\n\n", "Conception: 15d_Genou_Course": "# 15d — Étude du Genou : Solutions et Transmission GT3\n\n> **Série Biomécanique :**\n> - [15a] [Locomotion Baseline](./15a_Analyse_Locomotion_Baseline.md)\n> - [15b] [Configurations Moteurs & Évolutions](./15b_Configurations_Moteurs.md)\n> - [15c] [Révision Configuration Cardan 39 kg](./15c_Revision_Cardan_39kg.md)\n> - [15d] **Genou — Analyse & Solution GT3** ← *vous êtes ici*\n> - [15e] [Alternatives Moteurs Genou](./15e_Alternatives_Moteurs_Genou.md)\n> - [15f] [Portage de Charges & Marche](./15f_Portage_Charges_et_Marche.md)\n> - [16] [**Conclusions & Architecture Finale D-Bot**](./16_Conclusions_Architecture_DBot.md)\n\nCe document analyse pourquoi le genou RS-04 (120 N.m) devient le facteur limitant pour la course (172 N.m requis), explore 5 solutions graduelles (S1 à S5), puis détaille la **Solution S6 (Courroie GT3)** retenue comme évolution V2 de référence. La S6 est la seule qui cumule amplification de couple, réduction d'inertie et compatibilité avec l'architecture F-A-R de la hanche.\n\n---\n\n## 1. Le Problème : Couple Genou Insuffisant pour la Course\n\n### 1.1 Analyse des Facteurs Limitants\n\n```\nτ_genou_course = τ_statique × F_dynamique × F_impact\n\nτ_statique  = M × g × bras_levier_cuisse = 39 × 9.81 × 0.18 = 68.8 N.m\nF_dynamique = amplification cinétique (vitesse + accélération angulaire)\nF_impact    = pic à l'atterrissage (contact du pied)\n\nÀ 4 km/h (phase de vol) :\n  F_dynamique ≈ 1.5,  F_impact ≈ 1.7  →  Total = 68.8 × 2.5 ≈ 172 N.m\n```\n\n**Décomposition du problème :**\n\n| Facteur | Contribution | Levier disponible |\n| :--- | :---: | :---: |\n| **Masse du robot** (39 kg) | Élevée | Faible (difficile à réduire) |\n| **Bras de levier cuisse** (0.18 m) | Modérée | Moyen (géométrie fixe) |\n| **Facteur dynamique** (×1.5) | Modérée | Fort (algorithme) |\n| **Facteur d'impact** (×1.7) | Élevée | Fort (mécanique + algorithme) |\n| **Couple disponible RS-04** (120 N.m) | N/A | Moyen (amplification) |\n\n**Déficit à combler : 172 − 120 = 52 N.m** (soit +43% au-dessus de la capacité RS-04)\n\n---\n\n## 2. Solutions Explorées (S1 à S5)\n\n### S1 — Optimisation Algorithmique de la Foulée (Gratuit, immédiat)\n\n**Principe** : Modifier le pattern de marche pour réduire les facteurs dynamique et d'impact, sans aucun changement matériel.\n\n| Stratégie | Réduction τ | Couple résultant | Faisabilité |\n| :--- | :---: | :---: | :---: |\n| A. Foulée courte | ~15% | 146 N.m | ✅ Facile |\n| B. Crouch gait | ~3% | 167 N.m | ✅ Facile |\n| **C. Mid-foot strike** | **~28%** | **124 N.m** | ✅ Facile |\n| **A+C combiné** | **~40%** | **~103 N.m** | ✅ **Sous la limite !** |\n\n> [!TIP]\n> **S1 seul peut suffire pour un V1.** La combinaison foulée courte + mid-foot strike ramène le couple genou à ~103 N.m, sous les 120 N.m du RS-04. Vitesse de course : **4-5 km/h**. C'est la solution zéro coût à implémenter d'abord.\n\n---\n\n### S2 — Mécanisme Tirant au Genou\n\n**Principe** : Déplacer le moteur RS-04 en haut de cuisse et l'accoupler au genou via un **tirant carbone 1.5:1**, amplifiant le couple ET réduisant la masse distale.\n\n```\nτ_genou_effectif = 120 × 1.5 = 180 N.m ✅\n```\n\n**Point critique**: Le couple varie selon l'angle de flexion :\n\n| Angle Genou | Factor sin | Couple Genou Effectif |\n| :---: | :---: | :---: |\n| 0° (tendu) | 1.00 | **180 N.m** |\n| 60° | 0.82 | 148 N.m |\n| 90° (assis) | 0.50 | 90 N.m |\n| **120° (accroupi)** | **0.17** | **31 N.m ⚠️** |\n\n> [!WARNING]\n> **Point mort (Dead Center)** : Quand le bras de manivelle et le tirant sont parfaitement alignés, le couple est nul. Le design du bras de manivelle doit placer ce point mort en dehors de la plage 0-120°. À forte flexion (120°), le couple tombe à 31 N.m — insuffisant pour se relever d'un accroupi profond. Ce défaut a pesé dans le choix final en faveur de la GT3 (voir §3.3).\n\n---\n\n### S3 — SEA (Series Elastic Actuator)\n\n**Principe** : Intercaler un ressort calibré entre la sortie du RS-04 et le pivot du genou. Le ressort stocke l'énergie à l'impact et la restitue en pic de puissance.\n\n| Paramètre | Direct Drive | SEA |\n| :--- | :---: | :---: |\n| Couple moteur max | 120 N.m | 120 N.m |\n| **Couple pic articulaire** | 120 N.m | **~180-250 N.m** |\n| Absorption d'énergie | ❌ | ✅ |\n| Poids ajouté | 0g | +200g |\n| Complexité | ⭐ | ⭐⭐⭐⭐ |\n\n---\n\n### S4 — Double RS-04 en Parallèle\n\n**Principe** : 2× RS-04 sur le même axe.\n\n```\nτ_total = 240 N.m ✅\n+870g / genou, +$400 / genou — solution brute force non retenue.\n```\n\n> [!WARNING]\n> +1.74 kg par genou (×2 = +3.48 kg) aggrave l'inertie et augmente la masse totale, recréant du besoin de couple. Boucle négative.\n\n---\n\n### S5 — Tibia Carbone Flexible (Leg Spring)\n\n**Principe** : Lame carbone à la place du tibia rigide — stockage passif d'énergie à l'impact.\n\n```\nRéduction couple genou : ~22%  (172 → 134 N.m)\nMasse : neutre ou négatif (carbone < PA12-CF)\nCoût : ~50-150€\n\nCombinaison S5 + S1 (mid-foot strike) :\n  172 × 0.78 × 0.72 = ~96 N.m ← sous les 120 N.m ✅\n```\n\n---\n\n### Comparatif S1-S5\n\n| Solution | τ max | Coût | Masse Ajoutée | Complexité |\n| :--- | :---: | :---: | :---: | :---: |\n| **S1. Algo mid-foot + foulée** | ~103 N.m | **0€** | **0g** | ⭐ |\n| **S5+S1. Tibia carbone + algo** | ~96 N.m | ~100€ | **-50g** | ⭐⭐ |\n| **S2. Tirant genou** | ~180 N.m | ~150€ | -670g | ⭐⭐⭐ |\n| **S3. SEA** | ~200 N.m | ~200€ | +200g | ⭐⭐⭐⭐ |\n| **S2+S3. Tirant + SEA** | ~270 N.m | ~350€ | -470g | ⭐⭐⭐⭐⭐ |\n| **S4. 2× RS-04 parallèle** | ~240 N.m | +$400 | +870g | ⭐⭐ |\n\n---\n\n## 3. Solution Retenue — S6 : Courroie GT3\n\n### 3.1 Pourquoi la GT3 et pas le Tirant (S2) ?\n\nMalgré ses qualités, la solution S2 (tirant) présente un problème fondamental : le **point mort géométrique** à forte flexion (31 N.m à 120°) et la fatigue mécanique des pivots rotule. La GT3 résout ces deux problèmes.\n\nPar ailleurs, avec l'adoption de l'architecture **F-A-R pour la hanche** (Pitch→Roll→Yaw), le RS-04 Hip Pitch est maintenant situé **au niveau du bassin/bas du torse**. Il n'est plus adjacent au RS-04 du genou. Cela simplifie considérablement le packaging du haut de cuisse : le RS-04 du genou peut être **relocalisé seul** en haut de cuisse via la GT3 sans interférence avec le RS-04 de la hanche.\n\n> [!IMPORTANT]\n> **En architecture F-A-R**, le seul moteur qui descend dans la cuisse via la courroie GT3 est le **RS-04 Knee**. Le RS-04 Hip Pitch reste fixe dans le bassin (Maillon 1 de la chaîne F-A-R). Les deux RS-04 ne sont donc **pas côte à côte** — ce qui avait été envisagé à tort dans la configuration historique R-A-F.\n\n---\n\n### 3.2 Principe de la Solution S6\n\nAu lieu de laisser le RS-04 directement sur l'axe du genou (1:1), on le **déplace en haut de la cuisse** et on relie sa sortie à l'axe du genou via une **courroie GT3 avec réduction 2.5:1**.\n\n```\nCONFIGURATION DIRECTE (avant GT3) :\n[HANCHE - RS-04 Pitch fixé au bassin] ← Architecture F-A-R\n         │\n     CUISSE (fémur)\n         │\n[GENOU - RS-04 Knee sur l'axe]   ← 120 N.m, 167 RPM\n\n\nCONFIGURATION GT3 (S6) :\n[HANCHE - RS-04 Pitch fixé au bassin] ← Architecture F-A-R, inchangé\n         │\n     CUISSE (haut) : RS-04 Knee RELOCALISÉ + Pignon 20T ←── GT3\n         │\n         │ Courroie GT3 9mm (~650mm de tour)\n         │       Brin moteur : pignon 20T (Ø32mm)\n         │       Brin genou  : pignon 50T (Ø51mm)\n         │\n[GENOU - Grand pignon 50T = AXE GENOU] ← 300 N.m, 67 RPM\n```\n\n**Disposition spatiale dans la cuisse (Vue de face, architecture F-A-R confirmée) :**\n\n```\n┌────────────────────────────────────────┐\n│           BASSIN                       │\n│   RS-04 Hip Pitch ← Maillon 1 F-A-R   │\n│   Axe Pitch (fixe dans bassin)         │\n│       ↓                                │\n│   RS-03 Roll  ← Maillon 2             │\n│   RS-03 Yaw   ← Maillon 3             │\n└──────────────────┬─────────────────────┘\n                   │\n       ╔═══════════╧═════════════╗\n       ║  HAUT CUISSE (fémur)   ║\n       ║                        ║\n       ║  RS-04 Knee (Relocalisé)║ ← Moteur FIXE à la cuisse\n       ║  [||||||] Pignon 20T   ║   via bracket alu CNC\n       ╚══════════╤═════════════╝\n                  │  Courroie GT3 9mm (~400mm d'entraxe)\n                  │\n             ◉───┘ Pignon 50T\n       ══════╪═════════════════ ← Axe Genou Pitch\n             │\n          TIBIA\n```\n\n> [!TIP]\n> **Avantage clé du découplage F-A-R + GT3** : Le RS-04 Hip Pitch (bassin, Maillon 1) et le RS-04 Knee (haut cuisse, via GT3) sont dans deux zones distinctes. Aucun conflit d'encombrement. La cuisse n'abrite que le RS-04 Knee relocalisé, la courroie, et les brackets RS-03 (qui pendent du bassin en Maillons 2-3).\n\n---\n\n### 3.3 Performances Calculées (Ratio 2.5:1)\n\n| Paramètre | Direct Drive (RS-04 1:1) | GT3 2.5:1 (S6) | Δ |\n| :--- | :---: | :---: | :---: |\n| **Couple genou** | 120 N.m | **300 N.m** | **+150%** |\n| **Vitesse max genou** | 167 RPM | **67 RPM** | -60% |\n| **Temps flexion 0→90°** | 0.15 s | **0.36 s** | Acceptable |\n| Marche 2.5 km/h (vide) | 101% ⚠️ | **39%** ✅ | Très confortable |\n| Portage 20 kg marchant | Impossible | **~65%** ✅ | Viable |\n| Course 5 km/h | 143% ❌ | **~57%** ✅ | Très confortable |\n| Course 8 km/h | 185% ❌ | **~73%** ✅ | Confortable |\n\n> [!IMPORTANT]\n> **Pourquoi 2.5:1 et pas 1.5:1 ?** Le genou, contrairement à la hanche, est soumis à des couples énormes (117 N.m en marche normale). Le ratio 2.5:1 amène 300 N.m — une marge qui absorbe aussi bien le portage de 20 kg que les pics de course. Le tirant (S2) plafonnerait à 180 N.m avec son point mort à forte flexion. La GT3 2.5:1 n'a pas ce défaut.\n\n**Alternative ratio 1.5:1 :**\n\n| Paramètre | GT3 1.5:1 |\n| :--- | :---: |\n| Couple genou | **180 N.m** |\n| Vitesse max genou | 111 RPM |\n| Marche avec 10 kg | **~85%** ✅ |\n| Course 5 km/h | **~96%** ⚠️ (limite thermique) |\n| Course 8 km/h | ~122% ❌ |\n\n---\n\n### 3.4 BOM & Masse Ajoutée\n\n| Composant | Spéc. | Qté | Prix | Source |\n| :--- | :--- | :---: | :---: | :--- |\n| **Courroie GT3 fermée** | GT3, 9mm, ~650mm | 2 (D+G) | ~15€ | Amazon / AliExpress |\n| **Pignon moteur** | GT3, 20 dents, alésage Ø8mm alu | 2 | ~8€ | AliExpress |\n| **Pignon genou** | GT3, 50 dents, alésage Ø12mm alu | 2 | ~18€ | AliExpress |\n| **Galet tendeur** | Roulement 625ZZ Ø16 + bras ressort | 2 | ~5€ | AliExpress |\n| **Ressort de tension** | Traction 2N, ~30mm | 2 | ~2€ | Quincaillerie |\n| **Visserie + support** | M4 inox + entretoises CNC | lot | ~5€ | — |\n| **TOTAL (2 jambes)** | | | **~53€** | |\n\n**Masse ajoutée (2 jambes) :**\n\n| Composant | Masse unit. | ×2 jambes |\n| :--- | :---: | :---: |\n| Courroie GT3 9mm × 600mm | ~25g | 50g |\n| Pignon 20T alu | ~15g | 30g |\n| Pignon 50T alu | ~85g | 170g |\n| Galet tendeur + ressort | ~20g | 40g |\n| Visserie + support | ~15g | 30g |\n| **TOTAL** | **~160g/jambe** | **~320g** |\n\n> ✅ **320 grammes pour les deux jambes** — négligeable face aux +2 840g d'un double RS-04 (S4) ou aux +400g d'un tirant (S2).\n\n---\n\n### 3.5 Comparatif GT3 vs Autres Solutions\n\n| Critère | S2 (Tirant) | S4 (2× RS-04) | **S6 (GT3)** |\n| :--- | :---: | :---: | :---: |\n| **Couple max** | 180 N.m | 240 N.m | **300 N.m** |\n| **Masse ajoutée** | ~-670g | **+870g** | **+160g** ⭐ |\n| **Coût** | ~150€ | +$400 | **~53€** ⭐ |\n| **Point mort à forte flexion** | ⚠️ Oui (31 N.m @ 120°) | Non | **Non** ⭐ |\n| **Backlash** | ~0° (rigide) | ~0° | ~0.5-1° |\n| **Backdrivability** | Partielle | ✅ | **✅** |\n| **Réduction inertie distale** | ✅ (moteur en haut) | ❌ | **✅** ⭐ |\n| **Compatibilité F-A-R hanche** | ✅ | ✅ | **✅** ⭐ |\n| **Complexité mécanique** | ⭐⭐⭐ (bielles, pivots) | ⭐⭐ | **⭐** ⭐ |\n\n---\n\n### 3.6 Points de Vigilance\n\n**Backlash (jeu angulaire)**\n- Courroie GT3 : 0.5-1.5° selon tension.\n- **Galet tendeur à ressort permanent** maintient la tension même si la courroie s'allonge avec le temps.\n- **Largeur 9mm minimum** : les courroies 6mm ont plus de jeu.\n- **Pignons aluminium usiné** — pas imprimés 3D.\n\n**Durée de vie**\n- GT3 de qualité (Gates, Continental) : > 10 millions de cycles à 240 N.m.\n- Remplacement en cas de rupture : 5 minutes, 15€.\n\n**Alignement**\n- Les deux pignons doivent être coplanaires à ±1mm.\n- Entretoises CNC ou imprimées PA12-CF pour le calage latéral.\n\n---\n\n### 3.7 Guide de Montage\n\n1. **Fixer le RS-04 Knee** sur un bracket alu en haut de cuisse, arbre de sortie vers le bas (parallèle au fémur).\n2. **Installer le pignon 20T** sur l'arbre RS-04 avec vis de serrage.\n3. **Installer le grand pignon 50T** directement sur l'axe de rotation du genou.\n4. **Enfiler la courroie GT3** autour des deux pignons. Ajuster l'entraxe si nécessaire.\n5. **Monter le galet tendeur** (~5-10N de force) sur le brin mou.\n6. **Vérifier l'alignement** : faire tourner le moteur à la main — la courroie doit rester centrée sans déport latéral.\n\n---\n\n## 4. Roadmap d'Évolution\n\n| Phase | Solution | Vitesse Course | Délai |\n| :--- | :--- | :---: | :---: |\n| **V1 (immédiat)** | S1 algorithmique (mid-foot strike + foulée courte) | ~4 km/h | Logiciel |\n| **V2 (3-6 mois)** | **S6 : GT3 2.5:1 (300 N.m)** | **~8 km/h** | Mécanique |\n| **V3 (1 an)** | GT3 + SEA en torsion (S3) sur le grand pignon | **~10+ km/h** | Avancé |\n| **V4 (ambitieux)** | GT3 + solénoïde switchable Direct/GT3 | Mode vitesse / couple | R&D |\n\n> [!IMPORTANT]\n> **Priorité V1 : l'algorithme de marche.** La stratégie mid-foot strike est gratuite et implémentable en logiciel pur. C'est le chantier n°1 dès que la marche est validée. La GT3 (V2) est le quickwin mécanique le plus rentable pour passer à la course.\n\n---\n\n*Document fusionné en Avril 2026 (anciens 15d + 15g) — Analyse basée sur τ_genou_course = 172 N.m (39 kg, 4 km/h, facteur ×2.5), limite RS-04 = 120 N.m. Architecture hanche F-A-R (Pitch→Roll→Yaw) adoptée — RS-04 Knee et RS-04 Hip Pitch dans des zones distinctes (bassin vs haut cuisse).*\n", "Conception: 16_Conclusions": "# 16 — Conclusions : Architecture Finale du D-Bot\n\nCe document présente uniquement les **décisions définitives** pour le D-Bot. Il synthétise l'ensemble des études et analyses précédentes.\n\n> **Pour comprendre le raisonnement derrière chaque choix**, consultez la [Série Biomécanique 15a→15g](./15_Analyse_Biomecanique.md).\n\n---\n\n## Résumé Exécutif\n\n| Zone | Solution Retenue | Couple / Perf | Statut |\n| :--- | :--- | :---: | :---: |\n| **Cheville Pitch + Roll** | Cardan DIN 808 + **2× RS-03** + bielles | 120 N.m | ✅ V1 |\n| **Genou Pitch** | **RS-04** + Courroie GT3 2.5:1 (S6) | 300 N.m | ✅ V1 |\n| **Hanche Pitch + Yaw** | **RS-04** (pitch) + **RS-03** (roll/yaw) | 120 / 60 N.m | ✅ V1 |\n| **Épaule** | **RS-04** (Pitch) + **RS-03** (Roll) + **RS-02** (Yaw) | 120 / 60 / 17 N.m | ✅ V1 |\n| **Coude** | **RS-06** | 36 N.m | ✅ V1 |\n| **Poignet Roll** | **RS-00** | 14 N.m | ✅ V1 |\n| **Main** | **D-Hand Hybrid** (4× XC430 + 4× XC330 + tactile) | ~175 N grip | ✅ V1 |\n| **Cou** | **RS-05** (×2) | 5.5 N.m | ✅ V1 |\n| **Masse totale** | **~39.4 kg** | Squelette Alu + Hybrid Épaules + D-Hand + GT3 | Référence |\n| **Vitesse marche** | **~5 km/h** (marge XL) | — | Estimé |\n| **Course V1** | **~6-8 km/h** (mid-foot strike) | — | V1 logiciel |\n\n---\n\n## 1. Cheville — Architecture Cardan + 2× RS-03\n\n**Décision : Cardan DIN 808 Série G (acier C45, axe 12mm) + 2× RS-03 (bielles carbone).**\n\n| Paramètre | Valeur |\n| :--- | :--- |\n| Couple Pitch effectif | **120 N.m** (+167% vs besoin statique 38 N.m) |\n| Couple Roll effectif | **120 N.m** (×8 vs l'ancien RS-00 à 14 N.m) |\n| Masse distale ajoutée | **~0g** (moteurs RS-03 logés en haut du tibia) |\n| Débattement Pitch | +30° / −45° |\n| Débattement Roll | ±25° |\n\nFournisseurs : Cardan **Michaud Chailly** A5-473-12, bielles carbone 3K Ø10/8mm, rotules **Igus EBRM-05**.\n\n> Voir : [Étude Cheville Cardan](./20_Etude_Cheville_Cardan.md) | [Analyse 39 kg](./15c_Revision_Cardan_39kg.md)\n\n---\n\n## 2. Genou — RS-04 + Courroie GT3 (S6)\n\n**Décision V1 : RS-04 (120 N.m) + Réduction GT3 2.5:1 = 300 N.m effectifs.**\n\n| Scénario | Couple Requis | Couple Dispo (S6) | Verdict |\n| :--- | :---: | :---: | :---: |\n| Marche lente (< 1 km/h) | ~69 N.m | **300 N.m** | ✅ +330% (Marges XL) |\n| Marche normale (2-3 km/h) | ~117 N.m | **300 N.m** | ✅ +156% (Sécurisé) |\n| Course pic (172 N.m requis) | **172 N.m** | **300 N.m** | ✅ **Sécurisé** (Marge 42%) |\n| Course mid-foot (4 km/h) | **~103 N.m** | **300 N.m** | ✅ **Ultra-Margé** (65%) |\n\n**Évolution planifiée :**\n- **V2** (~6 mois) : Tibia en lame carbone flexible pour absorption passive des chocs.\n- **V3** (~1 an) : Mécanisme \"Atlas\" à tirant haute-vitesse pour course > 10 km/h.\n\n> Voir : [Étude Genou — Analyse & Solution GT3](./15d_Genou_et_Course.md) | [Alternatives Transmission](./15h_Alternatives_Transmission_Genou.md)\n\n---\n\n## 3. Hanches — RS-04 (Pitch) + RS-03 (Roll + Yaw) en F-A-R\n\n**Décision : Architecture séquentielle F-A-R (Pitch→Roll→Yaw) — standard Gen2 (Figure 02, Unitree G1).**\n\n| Maillon | Axe | Moteur | Couple Pic | Couple Requis (39 kg, dyn.) | Marge |\n| :---: | :--- | :---: | :---: | :---: | :---: |\n| **1** | **Hanche Pitch** | RS-04 | 120 N.m | ~19 N.m | **+530%** ✅ |\n| **2** | **Hanche Roll** | RS-03 | 60 N.m | ~20 N.m | **+200%** ✅ |\n| **3** | **Hanche Yaw** | RS-03 | 60 N.m | ~15 N.m | **+300%** ✅ |\n\n**Changement vs architecture antérieure :**\n- Ancien ordre **R-A-F** (Yaw→Roll→Pitch) remplacé par l'ordre **F-A-R** (Pitch→Roll→Yaw).\n- Le RS-04 Pitch est maintenant en **Maillon 1** (fixé au bassin/bas du torse), Roll en 2, Yaw en 3 (vers la cuisse).\n- Packaging anatomique amélioré, bassin plus fin, proportions Gen2.\n- **GT3 étudiée et rejetée** : le RS-04 Pitch en direct drive ne dépasse jamais 25% de ses capacités en locomotion — aucun renfort mécanique nécessaire.\n\n> Voir : [26 — Étude Bloc Pelvien Hanche](./26_Etude_Bloc_Pelvien_Hanche.md)\n\n---\n\n## 4. Bras — RS-04 / RS-03 / RS-06 / RS-02 / RS-00 ⭐ UPGRADE HYBRIDE\n\n**Décision : Épaule Pitch RS-04 + Épaule Roll RS-03 + Coude RS-06 (Option Hybride — Compromis Idéal Max Portage / Masse).**\n\n> 🆕 **Changement vs K-Bot** : L'épaule Pitch passe de RS-03 (60 N.m, 880g) à **RS-04 (120 N.m, 1420g)** pour ×2.5 de portage frontal. L'épaule Roll reste en **RS-03** (suffisant en latéral, économise 1.08 kg sur la paire vs 2× RS-04). Le coude passe de RS-02 (17 N.m) à **RS-06 (36 N.m)** pour ×2 de flexion. \n\n| Articulation | Moteur | Couple Pic | Couple Nom. | Masse |\n| :--- | :---: | :---: | :---: | :---: |\n| Épaule Pitch | **RS-04** | **120 N.m** | 40 N.m | 1420g |\n| Épaule Roll | **RS-03** | 60 N.m | 20 N.m | 880g |\n| Épaule Yaw | RS-02 | 17 N.m | 6 N.m | 405g |\n| Coude Pitch | **RS-06** | **36 N.m** | 11 N.m | 621g |\n| Poignet Roll | RS-00 | 14 N.m | 5 N.m | 310g |\n\n**Capacité de portage (avec D-Hand +850g total, bras = ~3 kg) — 1 bras :**\n\n| Scénario | Couple requis | Moteur limitant | Capacité |\n| :--- | :---: | :---: | :---: |\n| **Bras tendu (frontal), continu** | ~33 N.m | Pitch RS-04 (40 N.m nom.) | ✅ **~5 kg** continu |\n| **Bras tendu (frontal), pic** | ~55 N.m | Pitch RS-04 (120 N.m pic) | ✅ **~10 kg** pic |\n| **Bras plié 90°, sécurité** | ~30 N.m | Coude RS-06 (36 N.m nom.) | ✅ **~8-10 kg** sécurité |\n\n> [!TIP]\n> **Portage à 2 bras (charge symétrique)** : chaque moteur ne porte que la moitié de la charge. Les capacités sont doublées : ~**10 kg continu** bras tendus frontaux, ~**16-20 kg continu** bras pliés à 90°. La limite devient alors l'équilibre du robot (centre de gravité) et la tenue du genou (GT3 → 300 N.m), pas les moteurs de bras.\n\n> ⚠️ **Impact sur la masse du robot** : Cette configuration hybride amène la masse totale à **~40.2 kg** (avant allégement 3D, LiDAR V2 décompté). Le genou RS-04 opère à ~101% de sa capacité à 2-3 km/h, permettant une marche sécurisée à 2 km/h. Voir §9 et §11 pour la stratégie d'allégement 3D.\n\n### 🔮 Évolution Future — GT3 Coude (Non déployée en V1)\n\n> [!NOTE]\n> **Cette évolution n'est pas prévue pour la V1.** Elle est documentée ici pour tracer le cheminement de réflexion et guider une future itération si les besoins opérationnels l'exigent.\n\nPar analogie avec la **Solution S6 GT3 du genou** (RS-04 remonté dans le fémur → 300 N.m), il serait possible d'appliquer le même principe au coude :\n\n**Principe** : Relocaliser le RS-06 depuis le coude vers **l'humérus** (zone entre épaule et coude), et le relier à l'axe du coude par une courroie GT3. L'avant-bras (qui contient les 8 servos Dynamixel de la D-Hand) n'est **pas concerné** par cet encombrement.\n\n```\nARCHITECTURE GT3 COUDE (Évolution V3) :\n\n[ÉPAULE]\n   │\n[HUMÉRUS] — RS-06 Coude RELOCALISÉ + Pignon petit\n   │          ← Courroie GT3 9mm (~200mm entraxe)\n[COUDE]   — Grand pignon = AXE COUDE (remplace RS-06 direct)\n   │\n[AVANT-BRAS] — 8× Dynamixels D-Hand (inchangé)\n```\n\n**Bénéfices calculés (ratio 2:1) :**\n\n| Paramètre | RS-06 Direct (V1) | GT3 2:1 (V3) |\n|:---|:---:|:---:|\n| **Couple coude nominal** | 11 N.m | **22 N.m** (+100%) |\n| **Couple coude pic** | 36 N.m | **72 N.m** |\n| **Portage bras plié, 1 bras** | ~8-10 kg | **~15 kg continu** |\n| **Portage bras plié, 2 bras** | ~16-20 kg | **~30 kg continu** |\n| **Masse retirée du coude** | 0g | −621g (RS-06) + 160g (GT3) = **−461g** distaux ⭐ |\n| **Coût** | 0€ | ~53€ (même BOM que GT3 genou) |\n\n> La réduction de masse distale (−461g au coude) améliore aussi la dynamique des gestes rapides et réduit la sollicitation du RS-04 Pitch lors des accélérations du bras.\n\n**Raison du report en V3** : absence de déficit critique de couple (RS-06 à ~83% en pic pour 10 kg, non problématique en usage courant). La complexité mécanique n'est pas justifiée avant validation des cas d'usage opérationnels concrets.\n\n\n> Voir : [Analyse portage §3](./15a_Analyse_Locomotion_Baseline.md) | [Comparatif Option Hybride](./15b_Configurations_Moteurs.md)\n\n---\n\n## 5. Main — D-Hand Hybrid (4× XC430 + 4× XC330 + eFlesh)\n\n**Décision : Architecture tandem déporté mixte, servos XC430 (force) et XC330 (précision) dans l'avant-bras.**\n\n| Paramètre | Valeur |\n| :--- | :--- |\n| Servos | 4× **Dynamixel XC430-W240-T** (force) + 4× **XC330-T288-T** (précision) |\n| Emplacement | Avant-bras (14.5 cm sur 22 cm dispo), 352g de moteurs |\n| DOF actifs | 8 (Pouce ×2, Index ×2, Majeur, Annulaire, Auriculaire, Paume) |\n| Force grip | **~175 N effectifs** (niveau Tesla Optimus) |\n| Tactile | **Options T2 (eFlesh 3-axes)** sur la pulpe des doigts |\n| Poids total (Main + Avant-bras) | **~785g** |\n| Tendons | Dyneema Ø0.8mm-1.0mm, gaines PTFE, poulies CNC Ø8mm |\n| Coût par main | ~**1 110 €** (Servos + BOM + eFlesh) |\n| Protocole | Dynamixel 2.0 TTL, ROS 2, SDK Python |\n\n**Évolution V4** : Phalanges Alu 7075 CNC (C500) pour durabilité maximale.\n\n> Voir : [Étude Main Robotique](./21_Etude_Main_Robotique.md)\n\n---\n\n## 6. Matériaux — Stratégie Hybride\n\n**Décision : Squelette aluminium CNC pour les zones de force, impression 3D partout ailleurs.**\n\n| Zone | Matériau | Machine |\n| :--- | :--- | :---: |\n| Brackets hanches/genoux (RS-04) | **Alu 6061/7075 CNC** | C500 |\n| Brackets épaules (RS-04/03) | **Alu 6061/7075 CNC** | C500 |\n| Pivot cheville (cardan) | **Acier C45** (DIN 808) | Commerce |\n| Tibia / avant-bras structure | **PA12-CF** ou Alu tube | Qidi/C500 |\n| Pied / semelle | **PA12-CF** 100% | Qidi |\n| Torse (structure interne) | **PA12-CF** 100% | Qidi |\n| Coques extérieures | **PETG-CF** 40% gyroid | Qidi |\n| Tête / boîtier capteurs | **PETG-CF** 60% | Qidi |\n| Phalanges main V1 | **PA12-CF** | Qidi |\n| Phalanges main V4 | **Alu 7075** | C500 |\n\n---\n\n## 7. Performances Globales Estimées\n\n| Métrique | Estimation | Config |\n| :--- | :---: | :---: |\n| **Masse totale** | **~39.4 kg** | Squelette Alu + Hybrid Épaules + D-Hand + GT3 |\n| **DOF total** | 24 corps RobStride + 2×8 mains Dynamixel = **40 DOF actifs** | V1 complet |\n| **Vitesse marche sécurisée** | **~5 km/h** (à vide) | Marge genou 300 N.m |\n| **Vitesse marche max** | **~7 km/h** | Limite physique RS-04 (Vitesse) |\n| **Vitesse course (V1 algo)** | **~6-8 km/h** | Marge couple XL (Course pic OK) |\n| **Vitesse course (V3 tirant genou)** | ~10 km/h | Mécanisme future \"Atlas\" |\n| **Charge utile (Portage marchant)**| **~20 kg** (à 2.5 km/h) | Utilisation genou ~65% (GT3) |\n| **Charge utile (Bras tendu frontal)**| **~5 kg** (en continu) | Limite épaule RS-04 |\n| **Charge utile (Bras plié 90°)** | **~10 kg** (sécurité) | Limite coude RS-06 |\n| **Grip main (force)** | **~175 N effectifs** | Hybrid XC430/XC330 |\n| **Autonomie** | **~1.5h - 3h** | NMC 48V 10Ah (extensible ×2) |\n\n---\n\n## 8. Points d'Attention V1\n\n> [!IMPORTANT]\n> **✅ Genou RS-04 + GT3 (S6) :** L'ajout de la réduction 2.5:1 fait passer le couple de 120 N.m à **300 N.m**. À 2-3 km/h, le moteur n'est sollicité qu'à **~40%** de sa capacité.\n> - **Vitesse sécurisée** : Augmentée à 5 km/h.\n> - **Thermique** : Excellente dissipation prévue (faible courant requis en croisière).\n> - **Stabilité** : Les marges de couple permettent de corriger les perturbations d'équilibre bien plus agressivement.\n\n> [!IMPORTANT]\n> **✅ Coude RS-06 (upgrade RS-02)** : Le coude RS-06 permet un portage bras plié de 8-10 kg en continu (vs ~4.5 kg avec RS-02). C'est l'upgrade complémentaire indispensable aux RS-04 épaules.\n\n> [!TIP]\n> **Démarrer par le gripper.** Un gripper simple (1× STS3215, 30€) permet de valider le bus RS-00 du poignet et l'intégration mécanique de la main **avant** d'investir ~1 110€ dans la D-Hand Hybrid.\n\n---\n\n*Conclusions établies en Mars 2026. Architecture D-Bot V1 stabilisée — **Option Hybride complète** : RS-04 Pitch + RS-03 Roll épaules + RS-06 coude + Cardan DIN 808 + 2×RS-03 chevilles + D-Hand Hybrid. Masse de référence : ~39.4 kg.*\n\n---\n\n## 9. Bilan Masse Détaillé (Moteurs vs Structure)\n\n### 9.1 Masse des Moteurs — Inventaire Complet\n\n| Moteur | Rôle | Qté | Masse unit. | Masse totale |\n| :--- | :--- | :---: | :---: | :---: |\n| **RS-05** | Cou Pan + Tilt | 2 | 191g | **382g** |\n| **RS-04** | Épaule Pitch (×2) + Hanche Pitch (×2) + Genou (×2) | 6 | 1420g | **8 520g** |\n| **RS-03** | Épaule Roll (×2) + Hanche Roll (×2) + Hanche Yaw (×2) + Cheville Cardan (×4) | 10 | 880g | **8 800g** |\n| **RS-06** | Coude (×2) | 2 | 621g | **1 242g** |\n| **RS-02** | Épaule Yaw (×2) | 2 | 405g | **810g** |\n| **RS-00** | Poignet Roll (×2) | 2 | 310g | **620g** |\n| **TOTAL MOTEURS (24)** | | **24** | | **20 374g = 20.37 kg** |\n\n### 9.2 Masse Structurelle Estimée\n\n> La masse structurelle est estimée par déduction depuis la base K-Bot (34 kg total, 15.77 kg de moteurs → **18.23 kg de structure**), ajustée pour les éléments D-Bot spécifiques.\n\n| Poste | Matériau envisagé | Masse estimée | Allégement possible |\n| :--- | :--- | :---: | :---: |\n| Torse + Bassin (Squelette Alu CNC) | Tubes 6060 + Nœuds CNC | **2.36 kg** | ✗ usiné — fixe |\n| Fémurs D+G (cuisse) | PA12-CF sandwich ou carbone | ~1.5 kg | → 1.0-1.2 kg (−25%) |\n| Tibias D+G | Tube carbone 3K Ø30mm | ~0.8 kg | → 0.5 kg (−38%) |\n| Pieds D+G | PA12-CF 100% + semelle TPU | ~0.8 kg | → 0.6 kg (−25%) |\n| Bras (humérus + avant-bras) ×2 | PA12-CF + alu | ~1.5 kg | → 1.2 kg (−20%) |\n| Cardan DIN 808 ×2 + bielles | Acier C45 | ~0.6 kg | ✗ usiné — fixe |\n| Brackets hanches/genoux | Alu 6061/7075 CNC | ~1.5 kg | → 1.1 kg (isogrid) |\n| Transmission Genou (GT3 ×2) | Courroies + Pignons Alu | **0.32 kg** | ✗ fixe |\n| Brackets épaules | Alu 6061/7075 CNC | ~0.7 kg | → 0.5 kg (allégé) |\n| Tête + cou (boîtier capteurs) | PETG-CF | ~0.4 kg | → 0.3 kg |\n| Batterie 48V 10Ah (AT WEY NMC) | — | **2.3 kg** | ✗ fixe |\n| Jetson Orin Nano 8GB | — | 0.3 kg | ✗ fixe |\n| Spresense (Watchdog/IMU/FSR) | — | **0.20 kg** | ✗ fixe |\n| OAK-D Pro FF | — | 0.091 kg | ✗ fixe |\n| ~~Unitree L2 LiDAR~~ | — | ~~0.23 kg~~ | ⚠️ Repoussé **V2** |\n| Audio (ReSpeaker + HP 5W) | — | **0.05 kg** | 🆕 Simplifié |\n| D-Hand Hybrid ×2 | Servos + Dyneema + Structure | **1.57 kg** | ✗ fixe |\n| Câblage, connecteurs, visserie | — | ~0.7 kg | → 0.5 kg (optimisé) |\n| **TOTAL STRUCTUREL (estimé)** | | **~15.96 kg** | **→ ~12.46 kg (optimisé)** |\n\n### 9.3 Masse Totale Robot — 3 Scénarios\n\n| Scénario | Moteurs | Structure | **Total** | Impact genou 2-3 km/h |\n| :--- | :---: | :---: | :---: | :---: |\n| **A — Option D Révisée (2× RS-04 épaules)** | 21.45 kg | ~17.0 kg | **~41.5 kg** | ✅ ~125/300 N.m (42%) |\n| **B — Option Hybride (Adoptée)** | 20.37 kg | ~18.83 kg | **~39.20 kg** | ✅ ~121/300 N.m (~40%) |\n| **C — Scénario B + allégement 3D** | 20.37 kg | ~15.33 kg | **~35.70 kg** | ✅ ~107/300 N.m (35%) — marge XL |\n\n> [!TIP]\n> **Objectif cible réaliste** : Le scénario B + allégement modéré (structure à ~15 kg) amène le robot autour de **35-36 kg**. À cette masse, le genou RS-04 opère avec une réserve de puissance monumentale (>60%) → **marche et course sans aucune contrainte thermique**.\n\n---\n\n## 10. Analyse : Épaule — RS-04 Pitch + RS-03 Roll (Config Hybride)\n\n### 10.1 Justification Biomécanique\n\nLe **Pitch** (lever le bras en avant) est l'axe le plus sollicité car il lutte contre la gravité sur la totalité de la longueur du bras :\n\n```\nτ_pitch (bras tendu + 5 kg payload) :\n= bras seul : 3 kg × 9.81 × 0.30 m = 8.8 N.m\n+ payload   : 5 kg × 9.81 × 0.60 m = 29.4 N.m\n= 38.2 N.m → RS-04 nominal (40 N.m) = +5% marge ✅\n→ RS-03 nominal (20 N.m)            = INSUFFISANT ❌\n```\n\nLe **Roll** (écarter le bras latéralement) est sollicité au maximum uniquement bras horizontal avec charge latérale — un usage moins fréquent :\n\n```\nτ_roll_max (bras écarté 90° + 5 kg) :\n= 38.2 N.m (même calcul)\n→ RS-04 nominal (40 N.m) : confortable ✅\n→ RS-03 nominal (20 N.m) : marginal à 5 kg ⚠️ mais 60 N.m pic largement suffisant ✅\n→ RS-03 : OK pour portage latéral ≤ 2 kg continu, 5 kg en pic\n```\n\n### 10.2 Comparatif des Options Épaule\n\n| Config | Moteur Pitch | Moteur Roll | Portage frontal | Portage latéral | Masse épaules | Coût |\n| :--- | :---: | :---: | :---: | :---: | :---: | :---: |\n| **Option A (Abandonnée)** | RS-04 | RS-04 | 5 kg continu | 5 kg continu | **5 680g** | $560 |\n| **Option B (hybride)** ⭐ | RS-04 | **RS-03** | 5 kg continu | **~2 kg continu, 5 kg pic** | **4 600g** | $530 |\n| K-Bot original | RS-03 | RS-03 | ~2 kg continu | ~2 kg continu | 3 520g | $500 |\n\n> **Économie Option B vs A** : −1 080g par robot, −$30, et la capacité frontale (le cas principal) est identique.\n\n> [!NOTE]\n> **Recommandation** : L'**Option B hybride (RS-04 Pitch + RS-03 Roll)** est le meilleur compromis. La quasi-totalité des tâches de manipulation domestique (saisir, porter, placer un objet) solicite le Pitch frontal. Le Roll latéral n'est sous contrainte maximale que lors de portage bras horizontal X tendus — un geste rare. Économiser 1 kg aux épaules a un impact direct sur le genou.\n\n---\n\n## 11. Stratégie Allégement — Impression 3D & Optimisation\n\nL'objectif est d'atteindre la masse cible de **~35 kg** (±2 kg) pour que le genou RS-04 opère à **< 90%** de son pic à 2-3 km/h, déblocant une marche confortable et une course envisageable.\n\n### 11.1 Leviers d'Allégement par Priorité\n\n| Priorité | Pièce | Approche | Gain estimé | Difficulté |\n| :---: | :--- | :--- | :---: | :---: |\n| 🔴 **1** | **Tibias** | Tube carbone 3K Ø30mm (ou alu 2014) à la place de PA12-CF plein | −300g | Moyen |\n| 🔴 **2** | **Fémurs** | Design sandwich carbone/mousse + isogrid CNC alu | −300-500g | Élevé |\n| 🟠 **3** | **Brackets hanches/genoux** | Alu 7075 ajouré (toile de 5mm + nervures) | −400g | Moyen |\n| 🟠 **4** | **Torse bas + bassin** | Isogrid PA12-CF (40% gyroid adaptatif) | −300g | Faible |\n| 🟡 **5** | **Câblage** | Câbles ultra-flex silicone 26AWG (−30% poids vs silicone standard) | −100g | Faible |\n| 🟡 **6** | **Pieds** | PA12-CF creux 30% gyroid (seule la semelle est pleine) | −150g | Faible |\n| 🟢 **7** | **Visserie M4** | Titane EN 3.7164 pour les boulons moteurs (−60% masse) | −50-80g | Élevé |\n\n> Gain total potentiel avec toutes ces optimisations : **−1.5 à −2.5 kg** sur la structure.\n\n### 11.2 Impact sur les Marges de Marche\n\nEn combinant **Config Hybride B** (RS-03 Roll épaule) + **Allégement 2 kg structure** :\n\n```\nMasse cible : 40.2 - 2.0 = ~38.2 kg\n\nτ_genou à 2-3 km/h :\n= (38.5 / 39) × 117 N.m × 1.7 (dynamique)\n= 0.987 × 117 = 115.5 N.m\n→ Marge RS-04 (avec GT3 300 N.m) : (300 - 115.5) / 300 = **+61%** ← réserve massive\n\nτ_genou à 3-4 km/h (Course pic) :\n= (38.5 / 39) × 68.8 × 2.2 (facteur dynamique rapide)\n= 148 N.m → **✅ Marge GT3 : (300 - 148) / 300 = +50%**\n→ La course est possible même **sans** mid-foot strike (148 < 300 N.m).\n```\n\n**Vitesse de marche maximale théorique à ~38.5 kg :**\n```\nv_max (marche sans phase de vol) ≈ 9.3 × (38.5/39)^-1 → ~9.5 km/h théorique\nEn pratique (marge thermique + contrôle) : ~4-5 km/h → BIEN meilleur que 2-3 km/h actuel\n```\n\n", "Conception: 19_Perception_LiDAR": "# 19. Perception Spatiale & LiDAR — Analyse Complète\n\n> [!IMPORTANT]\n> **Mise à jour Mars 2026** : Le LiDAR Unitree L2 a été retiré de la nomenclature de la V1 (Phase 1/4) pour des raisons de coût et de complexité logicielle initiale. L'architecture décrite ci-dessous (SLAM LiDAR + Odométrie Visuelle) reste totalement valide pour une future implémentation (V2) afin d'accéder à la course tout-terrain. Le D-Bot V1 fonctionnera intégralement sur le SLAM visuel (OAK-D Pro).\n\n> **Objectif** : Doter le D-Bot d'une perception 3D fiable pour la navigation autonome (SLAM), l'évitement d'obstacles et la cartographie en temps réel.\n\n---\n\n## 1. Besoin Fonctionnel\n\nLe D-Bot a besoin de percevoir son environnement en 3D pour :\n- **Localisation** : savoir où il est dans l'espace (SLAM).\n- **Navigation** : planifier un chemin et éviter les obstacles.\n- **Cartographie** : construire une carte de l'environnement.\n- **Sécurité** : détecter les escaliers, les trous, les marches, les objets en hauteur.\n\nPour un **bipède de 1.35 m marchant à 2-3 km/h en intérieur**, les contraintes sont :\n- FOV vertical large (voir le sol ET les obstacles en hauteur).\n- Portée ≥ 10 m (pièces, couloirs).\n- Robustesse aux vibrations de la marche.\n- Poids minimal (monté sur la tête = impact sur l'inertie cervicale).\n\n---\n\n## 2. Retour d'Expérience — Unitree L2\n\n### 2.1 Points Forts\n\n| Avantage | Détail |\n| :--- | :--- |\n| **FOV** | 360° × 96° — le FOV vertical le plus large de sa catégorie |\n| **Zone aveugle** | 0.05 m seulement (excellent pour le near-field) |\n| **Poids** | 230 g (très compact : 75×75×65 mm) |\n| **Prix** | ~$419 — le 3D LiDAR le moins cher du marché |\n| **Anti-éblouissement** | Fonctionne en extérieur (100 klux) |\n| **ROS** | Support ROS1/ROS2 natif, SLAM open-source (Point-LIO) |\n| **Précision** | ≤ 2 cm à 10 m |\n\n### 2.2 Problèmes Identifiés (Retours Communauté)\n\n> [!CAUTION]\n> L'IMU intégrée du L2 est **défectueuse** — c'est un problème confirmé par de multiples utilisateurs et **non corrigé** par Unitree.\n\n| Problème | Gravité | Détail |\n| :--- | :---: | :--- |\n| **IMU timing aléatoire** | 🔴 Critique | Intervalles de données aléatoires (2 µs – 100 ms au lieu de 500 Hz fixe). \"Widespread issue\" non corrigé. |\n| **Drift SLAM** | 🔴 Critique | L'IMU incorrecte provoque une dérive sévère avec Point-LIO sur ROS2. |\n| **Bruit nuage de points** | 🟠 Modéré | Données bruitées sur plateformes mobiles à cause du miroir rotatif. |\n| **Vibrations** | 🟠 Modéré | Le L1 (prédécesseur) était \"très sensible aux vibrations\". Le L2 réduit le problème sans l'éliminer. |\n| **Fréquence de scan** | 🟡 Mineur | 5.55 Hz — insuffisant pour FAST-LIVO2, suffisant pour marche lente. |\n\n> [!NOTE]\n> Le L1 (prédécesseur) n'a PAS ces problèmes d'IMU. C'est un **défaut spécifique au L2**, probablement lié à un changement de firmware.\n\n---\n\n## 3. Benchmark Industrie — Comment les Concurrents Perçoivent l'Espace\n\n| Robot | Stratégie | LiDAR | Caméras | IMU | SLAM |\n| :--- | :--- | :---: | :---: | :---: | :--- |\n| **Unitree G1** | LiDAR + depth cam | **Livox MID-360** | Intel RealSense D435i | Intégrée LiDAR + dédiée | LiDAR-SLAM (FAST-LIO) |\n| **Tesla Optimus** | **Vision pure** (pas de LiDAR) | ❌ | Caméras RGB multiples | IMU torse + capteurs couple | Vision end-to-end NN |\n| **Figure 02** | **Vision pure** (6 caméras) | ❌ | 6× RGB + VLM embarqué | IMU torse | Vision Language Model |\n| **Agility Digit** | LiDAR + caméras | Propriétaire | Multiples | Propriétaire | Fusion capteurs |\n| **Fourier GR-2** | Intel RealSense | ❌ | RealSense D455 + RGB | IMU torse | Visual-Inertial |\n\n**Tendance industrie** : Les robots haut de gamme (Optimus, Figure 02) abandonnent le LiDAR au profit de la vision pure grâce aux progrès de l'IA. Les robots milieu de gamme (G1) combinent LiDAR + depth camera. **Unitree n'utilise PAS le L2 sur son propre G1** — signal fort.\n\n---\n\n## 4. Alternatives Évaluées\n\n### 4.1 LiDARs 3D\n\n| LiDAR 3D | Prix | Points/s | FOV (H×V) | IMU | Poids | IP | Note |\n| :--- | :---: | :---: | :---: | :---: | :---: | :---: | :--- |\n| **Unitree L2** | **~$419** | 64k eff. | 360°×96° | ❌ Défectueuse | **230g** | IP52 | FOV vertical imbattable |\n| **Livox MID-360** | ~$600-900 | 200k | 360°×59° | ✅ | 265g | IP67 | Choix du G1, solid-state |\n| Hesai QT64 | ~$800+ | ~300k | 360°×104° | ❌ | 400g | IP67 | Excellent FOV, cher |\n| Ouster OSDome | ~$1500+ | 5.2M | 360°×180° | ❌ | 470g | IP68 | Trop cher |\n\n### 4.2 LiDARs 2D (paire avant + arrière)\n\n| LiDAR 2D | Prix unité | Portée | Points/s | Poids |\n| :--- | :---: | :---: | :---: | :---: |\n| LD-19 | ~$50 | 12m | 4.5k | 100g |\n| RPLidar A1 | ~$100 | 12m | 8k | 170g |\n| RPLidar A2 | ~$285 | 12m | 16k | 190g |\n| YDLIDAR X4 Pro | ~$80 | 10m | 5k | 115g |\n\n> [!WARNING]\n> **2D LiDAR ❌ inadapté pour un bipède** : un LiDAR 2D scanne un seul plan horizontal. Sur un bipède qui oscille en pitch/roll à chaque pas, le plan de scan bouge en permanence. Zéro information verticale = escaliers, seuils de porte et objets en hauteur invisibles.\n\n### 4.3 Vision Pure (Multi-Caméras)\n\n| Config | Caméras | FOV combiné | GPU Jetson Orin | Faisabilité |\n| :--- | :---: | :---: | :---: | :---: |\n| OAK-D Pro seul | 1 stéréo | ~80° depth | ~15% GPU | ✅ Trivial |\n| OAK-D Pro + 1 cam arrière | 2 unités | ~160° | ~30% GPU | ✅ Réaliste |\n| OAK-D Pro + 2 cam latérales | 3 unités | ~240° | ~50% GPU | ⚠️ Lourd |\n| 4-6 caméras (style Figure 02) | 4-6 | 360° | >70% GPU | ❌ Hors budget GPU |\n\nLa vision pure est insuffisante à notre niveau : pas assez de puissance IA pour du visual SLAM end-to-end, sensible aux conditions de lumière et aux surfaces sans texture.\n\n---\n\n## 5. Solution Retenue — Triple Fusion L2 + OAK-D Pro + BMI270\n\n### 5.1 Principe\n\n> [!IMPORTANT]\n> **La clé de notre solution** : séparer le LiDAR de son IMU défectueuse, le monter sur le **torse** (position stable pour le SLAM), et fusionner avec l'OAK-D Pro sur la **tête** (orientable pour la perception locale). C'est l'approche du G1 (MID-360 sur torse + RealSense en tête), adaptée à notre budget.\n\n```\n                    ┌─────────────────┐\n                    │   TÊTE D-BOT     │    ← 2 DOF (2× RS-05 : Pitch + Yaw)\n                    │   (orientable)   │       Gaze Control actif (VOR)\n                    │  ┌────────────┐  │\n                    │  │ OAK-D Pro  │  │  ← Depth Camera : 80° cone, 640×480 pixels\n                    │  │ (stéréo)   │  │     Nuage de points DENSE (près, 0-10m)\n                    │  └────────────┘  │     Orientation active → regarde où il faut\n                    └────────┬─────────┘\n                             │ Cou (2× RS-05)\n                    ┌────────┴─────────┐\n                    │   TORSE (haut)    │\n                    │                  │\n                    │  ┌────────────┐  │\n                    │  │ Unitree L2 │  │  ← LiDAR 3D : 360°×96°, 64k pts/s\n                    │  │ (sans IMU) │  │     Position FIXE sur torse = TF statique\n                    │  │ [silent bl]│  │     Mouvement prévisible (locomotion)\n                    │  └────────────┘  │\n                    │                  │\n                    │  ┌────────────┐  │\n                    │  │ Spresense  │  │  ← IMU BMI270 : 400 Hz, timing stable\n                    │  │ BMI270     │  │     Co-localisé avec le L2 sur le torse\n                    │  └────────────┘  │     Publie sur /imu/data\n                    └────────┬─────────┘\n                             │ USB3 × 2 + Serial\n                    ┌────────▼─────────┐\n                    │   Jetson Orin     │\n                    │                  │\n                    │  ┌────────────┐  │     ROS2 Topics :\n                    │  │  RTAB-Map  │◀─┼──── /lidar/points  (L2, 64k pts/s)\n                    │  │    ou      │◀─┼──── /oakd/depth     (dense, 80° FOV)\n                    │  │ FAST-LIO   │◀─┼──── /imu/data       (BMI270, 400 Hz)\n                    │  └────────────┘  │\n                    └──────────────────┘\n```\n\n### 5.2 Pourquoi Cette Architecture (L2 Torse / OAK-D Tête)\n\n> [!NOTE]\n> **Choix de placement du L2 sur le torse** : Le positionnement du L2 a fait l'objet d'une analyse approfondie. Le **torse** a été retenu plutôt que la tête pour 5 raisons :\n\n| Critère | L2 sur la **tête** (rejeté) | L2 sur le **torse** (retenu) |\n| :--- | :---: | :---: |\n| **SLAM stabilité** | ⚠️ Mouvements tête imprévisibles → distorsion intra-scan | ✅ Mouvement locomot
