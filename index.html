        const docs = {"Fondations: 00_Index": "# Documentation Projet Robot D-Bot (Évolution 2026)\n\nBienvenue dans la documentation technique du projet de robot humanoïde basé sur le D-Bot open-source, adapté et amélioré pour une impression sur Qidi Plus 4.\n\n## Table des Matières\n\n1.  **[Synthèse du Projet](./01_Synthese_Projet.md)**\n    *   Vision globale et stratégie de développement (Phases).\n    *   Architecture matérielle (Jetson + Spresense + OAK-D).\n    *   Points de vigilance critique (Audit 2026).\n\n2.  **[Liste des Achats (BOM Consolidée)](./02_Liste_Achats.md)**\n    *   Visserie (ISO 7380, DIN 912, Inserts Ruthex).\n    *   Motorisation (RS-00 à RS-05) et PDB Matek.\n    *   Électronique de contrôle et Audio.\n\n3.  **[Guide Mécanique](./03_Montage_Mecanique.md)**\n    *   Paramètres CAO (Chambrages, Tolérances).\n    *   Montage des Roulements 608ZZ.\n    *   Préparation Commande CNC.\n\n4.  **[Électronique & Câblage](./04_Electronique_Cablage.md)**\n    *   Bus CAN (Daisy Chain, GND critique, Stubs).\n    *   Alimentation & Protection (XT60, Matek PDB).\n    *   Sécurité Wanptek (Mode OCP).\n\n5.  **[Installation et Logiciel](./05_Logiciel_Configuration.md)**\n    *   JetPack 6, ROS 2 Humble et micro-ROS.\n    *   Liaison série Jetson/Spresense (UART Pins 8/10).\n    *   Configuration SocketCAN (1 Mbps).\n\n6.  **[Décisions Architecturales](./06_Decisions_Architecturales.md)**\n    *   Choix du Kit Moteur (RS-05).\n    *   Carte d'Extension Sony Spresense.\n    *   Positionnement LiDAR et Matériaux.\n\n7.  **[Vision et IA](./07_Vision_IA.md)**\n    *   OAK-D Pro S2 FF (Encastrement, Tilt, Stéréo Active).\n    *   LiDAR Unitree L2 et Fusion de capteurs Isaac ROS.\n\n8.  **[Audio et Perception](./08_Audio_Perception.md)**\n    *   Spatialisation 8 micros (PDM), Beamforming et TPU isolation.\n    *   Stratégie Double IMU (Stabilisation Regard).\n\n9.  **[Guide Avancé Impression 3D](./09_Guide_Avance_Impression.md)**\n    *   Gestion humidité PA12-CF et Slicer Orca.\n    *   Recuit \"In-Situ\" (PLA+, PETG-CF, PA12-CF) et Macros G-Code.\n\n10. **[Installation Buse Tungstène](./10_Guide_Buse_Tungstene.md)**\n    *   Maintenance buse et sécurité électrique générale (Wanptek).\n    *   Sauvegarde et maintenance préventive.\n\n11. **[Guide SensiEDGE & Sécurité](./11_Guide_SensiEDGE_Watchdog.md)**\n    *   Architecture \"Power Manager\" (Veille/Réveil).\n    *   Code C++ Watchdog et Surveillance Batterie 13S (48V).\n    *   Intégration capteurs environnementaux (CommonSense).\n\n12. **[Guide Pièces Métal (CNC)](./12_Guide_Parties_Metal_CNC.md)**\n    *   Spécifications Alu 6061-T6 et règles de conception.\n    *   Préparation fichiers STEP et astuces commande.\n\n13. **[Sécurité Électrique Essentielle](./13_Securite_Electrique.md)**\n    *   Paramètres alimentation labo (Safe Start).\n    *   Séquence d'allumage/extinction stricte.\n    *   Arrêt d'urgence et sécurité mécanique.\n\n14. **[Cinématique & Choix Moteurs](./14_Cinematique_Moteurs.md)**\n    *   Architecture 24 DOF (Tête + Bras + Jambes).\n    *   Tableau comparatif RobStride (RS-00 à RS-06).\n    *   Couple, Poids, Prix et Applications.\n\n15. **[Analyse Biomécanique & Évolutions](./15_Analyse_Biomecanique.md)**\n    *   Analyse capacités de marche (lente, rapide, course).\n    *   Évaluation portage (bras tendu vs plié).\n    *   Propositions d'upgrade moteurs (RobStride + alternatives).\n\n---\n\n### Annexes\n\n16. **[Annexe — Recherche Batteries NMC](./16_Annexe_Batterie_NMC.md)**\n    *   Packs NMC 21700 48V disponibles en France (AT WEY, B-Volt, OZO).\n    *   Intégration et schéma électrique 48V.\n\n17. **[Annexe — État des Lieux Semi-Solide](./17_Annexe_Batterie_SemiSolide.md)**\n    *   Analyse du marché semi-solide (2026) : aucun pack compact viable.\n    *   Veille technologique 2027+.\n\n18. **[Annexe — Comparatif Batteries & Scénarios](./18_Annexe_Batterie_Comparatif.md)**\n    *   Tableau NMC vs LiFePO4 vs Semi-Solide.\n    *   Scénarios court/moyen/long terme.\n\n19. **[Perception Spatiale & LiDAR](./19_Perception_Spatiale_LiDAR.md)**\n    *   Analyse complète Unitree L2 (points forts et problèmes IMU confirmés).\n    *   Benchmark industrie (G1, Optimus, Figure 02, Digit).\n    *   Alternatives évaluées (Livox MID-360, 2D LiDARs, multi-caméras, vision pure).\n    *   Solution retenue : **Triple fusion L2 + OAK-D Pro + BMI270**.\n\n20. **[Étude & Acquisition CNC Milo](./21_Etude_Usinage_CNC_Milo.md)**\n    *   Choix de la Milo v1.5 face aux alternatives.\n    *   Exigences d'usinage aluminium (tolérances H7, fluage PA-CF).\n    *   Acquisition, outillage et méthodes (Threading Milling).\n\n21. **[Étude Cheville Cardan](./20_Etude_Cheville_Cardan.md)**\n    *   Historique évolutif (GE12UK → Série → RS-06 → **Cardan DIN 808**).\n    *   Architecture retenue : 2× RS-03 + double bielles (type Optimus).\n    *   Achats : cardans Michaud Chailly, bielles carbone, rotules Igus.\n\n22. **[Étude Main Robotique — D-Hand Premium](./21_Etude_Main_Robotique.md)**\n    *   8 DOF, servos **Dynamixel XC330-T288-T** dans l'avant-bras.\n    *   Tendons Dyneema, poulies CNC, grip ~80-100 N.\n    *   Feuille de route et intégration logicielle (Dynamixel SDK + ROS 2).\n\n23. **[Usinage CNC C500](./22_Usinage_CNC_C500.md)**\n    *   Outils métal DLC et règles d'ébavurage (H7).\n    *   Danger des collets : Séparation Impérial vs Métrique.\n    *   Gestion intelligente des porte-outils (RFID).\n\n\n---\n*Documentation exhaustive générée et auditée en Février 2026.*\n", "Fondations: 01_Synthese": "# Synthèse du Projet D-Bot (Évolution)\n\n## 1. Vision et Objectifs\nLe projet consiste à construire un robot humanoïde baptisé **D-Bot**.\nIl s'agit d'une **évolution majeure** de la plateforme open-source **K-Bot**, améliorée avec des actionneurs modernes et une intelligence embarquée avancée. Ce n'est pas un simple fork, mais une refonte complète de l'architecture électronique et motrice.\n\n### Améliorations Clés (vs K-Bot Original)\nLe D-Bot repose sur un système de **24 moteurs RobStride** (20 DOF K-Bot + 2× RS-05 cou + 2× RS-00 cheville Roll), une vision IA **Luxonis OAK-D Pro** et un **LiDAR Unitree L2**, le tout piloté par une **NVIDIA Jetson Orin Nano** et une **Sony Spresense**.\n\n## 2. Feuille de Route (Roadmap)\nLe projet est découpé en 4 phases distinctes pour valider chaque étape critique.\n\n### Phase 1 : Tête et Torse (En Cours)\n*   **Objectif** : Valider l'intelligence perception/audio.\n*   **Matériel** : Jetson Orin Nano, OAK-D Pro, Spresense.\n*   **Moteurs** : Aucun (0).\n\n### Phase 2 : Premier Bras (Focus Actuel)\n*   **Objectif** : Validation mécanique et manipulation.\n*   **Matériel** : + 6 Moteurs Robstride (RS-03 épaule, RS-02 coude, RS-00 poignet).\n*   **Budget Est.** : ~2 000 €.\n\n### Phase 3 : Deuxième Bras\n*   **Objectif** : Coordination bimanuelle.\n\n### Phase 4 : Marche (Jambes)\n*   **Objectif** : Locomotion et équilibre dynamique.\n*   **Matériel** : + 12 Moteurs (RS-04 hanches/genoux, RS-02 cheville Pitch avec tirant, RS-00 cheville Roll).\n*   **Capteurs** : IMU torse (BMI270 Add-on) pour le contrôle d'équilibre + capteurs FSR plantaires.\n\n## 3. Architecture Matérielle\nL'architecture repose sur une séparation claire entre la puissance de calcul (IA) et le contrôle temps réel (Moteurs/Capteurs bas niveau).\n\n```mermaid\ngraph TD\n    A[NVIDIA Jetson Orin Nano] -- \"USB3 (High Speed)\" --> B[Sony Spresense]\n    A -- USB/CAN --> C[\"InnoMaker USB2CAN-C\"]\n    C -- \"Bus CAN (1 Mbps)\" --> D[Moteurs Robstride]\n    A -- USB3 --> E[\"OAK-D Pro (Vision AI)\"]\n    A -- USB --> F[LiDAR Unitree L2]\n\n    subgraph \"Contrôle Moteur\"\n    D --> D1[\"RS-02/03/04 (Membres)\"]\n    D --> D2[\"RS-00/05 (Poignets/Cou)\"]\n    end\n\n    subgraph \"Perception Audio/Sensor\"\n    B --> B1[\"Micros (Beamforming)\"]\n    B --> B2[\"IMU Torse (BMI270)\"]\n    B --> B3[Capteurs I2C/SPI]\n    end\n```\n\n## 4. Plateforme de Fabrication (Stratégie Hybride)\n\nLe D-Bot utilise une approche **Squelette Aluminium CNC + Coque Imprimée 3D** pour combiner la résistance mécanique aux endroits critiques et la facilité de fabrication partout ailleurs.\n\n### Machines Disponibles\n- **Qidi X-Plus 4** : Impression 3D haute température (PA12-CF, PETG-CF).\n- **NestWorks C500** : CNC 4 axes, usinage aluminium avec tolérances H7 (±0.02mm).\n\n### Répartition des Matériaux par Zone\n\n| Zone | Matériau | Machine | Justification |\n| :--- | :--- | :---: | :--- |\n| Brackets hanches/genoux (RS-04) | **Alu 6061/7075 CNC** | C500 | 120 N.m de couple, plastics insuffisants |\n| Brackets épaules (RS-03) | **Alu 6061 CNC** | C500 | Porte-à-faux du bras |\n| Pied / semelle structurelle | **PA12-CF** 100% | Qidi | Résistance aux chocs, rigidité |\n| Tibia / avant-bras | **PA12-CF** ou **Alu tubulaire** | Qidi/C500 | Rigidité en flexion |\n| Torse (structure interne) | **PA12-CF** 100% | Qidi | Grande surface, CNC trop coûteuse |\n| Coques extérieures (torse, bras) | **PETG-CF** 40% gyroid | Qidi | Esthétique carbone, léger |\n| Tête (boîtier capteurs) | **PETG-CF** 60% | Qidi | Masse à minimiser |\n| Phalanges main | **PA12-CF** → Alu 7075 (V2) | Qidi/C500 | Évolutif avec la C500 |\n\n- **Masse totale estimée** : ~**38-40 kg** (configuration cardan, 2× RS-03 par cheville).\n- **Détails Impression** : Voir le **[Guide Avancé Impression 3D](./09_Guide_Avance_Impression.md)**.\n- **Détails CNC** : Voir l'**[Usinage CNC C500](./22_Usinage_CNC_C500.md)**.\n\n## 5. Points de Vigilance Critique (Audit Discussion)\n-   **Motorisation** : Le couple de pointe (Peak Torque) des RS-04 (hanches/genoux) atteint 120 Nm. La structure doit être en PA12-CF ou Aluminium 6061.\n-   **Sécurité Électrique** : Toujours utiliser le mode **OCP** (Overcurrent Protection) sur l'alimentation Wanptek (limite à 1A pour les premiers tests).\n-   **Communication** : Le bus CAN 1 Mbps exige des paires torsadées et une masse commune (GND) entre la Jetson et les moteurs.\n-   **Maintenance** : Utiliser des connecteurs **WAGO 221** dans le cou pour faciliter le démontage rapide de la tête.\n\n---\n**Note** : Ce projet est une évolution active. Les choix techniques documentés ici reflètent l'état des lieux en Février 2026.\n", "Fondations: 02_Liste_Achats": "# Liste des Achats (BOM Consolidée)\n\n## 1. Visserie & Fixations (Hardware)\n**Stratégie** : Utilisation de vis **DIN 912 (Tête Cylindrique)** en Acier Inoxydable A2 (Inox 304) pour la résistance à la corrosion, ou Acier Noir 12.9 pour les axes moteurs de force.\n\n### Quantités Requises (D-Bot + 2x RS-05)\n| Type | Diamètre | Longueur | Quantité Est. | Usage |\n| :--- | :--- | :--- | :--- | :--- |\n| **Vis CHC** | M3 | 6mm - 12mm | ~240 | Fixations électroniques, caches, small motors |\n| **Vis CHC** | M4 | 10mm - 15mm | ~160 | Structure principale, moteurs RS-01-RS-04 |\n| **Vis CHC** | M5 | 12mm - 20mm | ~40 | Hanches, Grosses articulations |\n| **Écrous/Rondelles** | M3/M4/M5 | - | ~150 de chaque | - |\n\n### Liens d'Achat Recommandés\n*   **Protorx (France)** : [Lien vers Boîtes M3/M4 Inox](https://www.protorx.com) - *Idéal pour un stock propre*.\n*   **Vis-Express** : [Lien vers M4 DIN 912 Inox A2](https://www.vis-express.fr) - *Livraison rapide*.\n*   **ScrewsAndMore** : [Lien vers Assortiment 400pcs](https://www.screwsandmore.de) - *Rapport quantité/prix*.\n\n> **Conseil** : Achetez un kit \"Build Complet\" (1225pcs M2-M5) pour avoir du stock, et complétez avec des sachets de 50 vis M4 Acier 12.9 pour les moteurs.\n\n### Inserts Filetés (Heat-set)\n*   **Marque Recommandée** : **Ruthex** (ou CNC Kitchen).\n*   **Modèle** : RX-M3x5.7 (M3) et versions \"Longues\" pour M4.\n*   **Pourquoi ?** Les moletages opposés offrent la meilleure résistance à l'arrachement dans le PETG-CF.\n*   **Acheter chez** : [3DJake France](https://www.3djake.fr) ou Amazon.\n\n---\n\n## 2. Moteurs & Actionneurs (Par Phase)\n\n### Phase 1 : Tête / Torse (Aucun Moteur)\n*   Focus uniquement sur les capteurs et l'intelligence.\n\n### Phase 2 : Premier Bras (5 DOF)\n| Modèle | Quantité | Couple (Peak) | Usage |\n| :--- | :--- | :--- | :--- |\n| **Robstride 03** | 2 | **60 Nm** | Épaule (Force brute - Pitch/Roll) |\n| **Robstride 02** | 2 | **17 Nm** | Épaule Yaw / Coude |\n| **Robstride 00** | 1 | 14 Nm | Poignet Roll |\n\n### Phase 3 : Deuxième Bras (5 DOF identiques)\n*Même configuration que Phase 2, symétriquement.*\n\n### Phase 4 : Jambes + Cou (14 DOF)\n| Modèle | Quantité | Couple (Peak) | Usage |\n| :--- | :--- | :--- | :--- |\n| **Robstride 04** | 4 | **120 Nm** | Hanches Pitch + Genoux |\n| **Robstride 03** | 4 | **60 Nm** | Hanches Roll/Yaw |\n| **Robstride 03** | 4 | **60 Nm** | Chevilles Pitch+Roll (**2× par cheville**, architecture cardan + bielles) |\n| **Robstride 05** | 2 | **5.5 Nm** | Cou Pan/Tilt |\n\n> **Note** : Architecture cheville = Cardan DIN 808 + 2× RS-03 par cheville (différentiel Pitch/Roll). Voir [Étude Cheville](./20_Etude_Cheville_Cardan.md) pour le détail.\n\n### Phase 5 : Mains (16 DOF — 8 par main)\n| Modèle | Quantité | Couple (Peak) | Usage |\n| :--- | :--- | :--- | :--- |\n| **Dynamixel XC330-T288-T** | 16 | **1.0 Nm** | Actionnement par tendons (8 DOF / main) |\n| **U2D2** (USB↔Dynamixel) | 2 | — | Interface bus TTL (1 par main) |\n| **Buck 48V→12V** | 2 | — | Alimentation servos main |\n\n> **Note** : Voir [Étude Main Robotique](./21_Etude_Main_Robotique.md) pour l'architecture D-Hand Premium.\n\n### Autres Composants Électroniques\n| Composant | Modèle | Quantité | Note |\n| :--- | :--- | :--- | :--- |\n| Distribution (PDB) | **Matek PDB-HEX** (Master) + **PDB-XT60-W** (Satellites) | 2 + 4 | Hubs de puissance pro |\n| Connectique Data | **JST-GH 4-pin** (Silicone / Holybro) | 30m | Fils torsadés blindés |\n| Maintenance Tête | **WAGO 221-413 / 415** | 10 | Connecteurs rapides sans soudure |\n| Alimentation Labo | **Wanptek DPS605U** (60V/5A) | 1 | Réglage précis 24V/48V + OCP |\n| Interface CAN | **InnoMaker USB2CAN-C** | 1 | Natif Linux (SocketCAN) |\n\n> **Note** : Vérifiez bien que les moteurs arrivent avec leurs câbles d'alimentation (XT60) et data (JST-GH). Sinon, commander séparément.\n\n---\n\n## 3. Électronique & Cerveau (Détail Phase 1 & 2)\n\n| Composant | Modèle | Note |\n| :--- | :--- | :--- |\n| **Cerveau IA** | NVIDIA Jetson Orin Nano (8GB) | Le modèle Super est un plus, mais le 8GB suffit. |\n| **Vision (Tête)** | Luxonis OAK-D Pro | Version Fixed-Focus (FF) recommandée (vibrations). |\n### Électronique de Contrôle\n- **Sony Spresense** :\n    - *Main Board* + *Extension Board* (Standard).\n    - **Note sémantique** : L'Extension Board Standard est préférée pour ses 8 entrées micro (vs 4 sur la version LTE).\n    - **Connectivité** : Pour la LTE, utilisez un shield tiers (Waveshare SIM7600) via UART pour conserver les 8 micros.\n- **IMU Torse (Équilibre)** : **Bosch BMI270 Add-on Board** (Switch Science) — 6 axes, I2C/SPI, compatible Spresense. **C'est l'IMU principale d'équilibre** du robot (voir [Stratégie IMU](./08_Audio_Perception.md)).\n- ~~**SensiEDGE CommonSense**~~ : ⚠️ **Non disponible au grand public** (réservée aux professionnels). Remplacée par le BMI270 Add-on Board ci-dessus.\n- **Audio** : 8x Microphones numériques MEMS (PDM) + câbles blindés.\n\n### Capteurs d'Équilibre (Phase 4)\n| Composant | Modèle | Quantité | Note |\n| :--- | :--- | :--- | :--- |\n| **IMU Torse** | BMI270 Add-on Board (Spresense) | 1 | IMU primaire d'équilibre — 416 Hz, 6 axes |\n| **Capteurs plantaires** | FSR 402 (Force Sensing Resistor) | 8 (4/pied) | Mesure du Centre de Pression (CoP) — connectés aux ADC Spresense |\n| *Alternative IMU* | *Sony Multi-IMU Add-on Board* | *1* | *16 MEMS, précision classe FOG — si besoin haute précision* |\n\n### Sécurité & Gestion d'Énergie (Power Management)\n| Composant | Référence | Rôle |\n| :--- | :--- | :--- |\n| **Régulateur Veille** | **Mean Well DDR-15G-5** (ou Buck 60V->5V) | Alimente la Spresense en permanence (Always-On). |\n| **Switch Puissance** | **Infineon BTS50085-1TMA** (ou MOSFET Opto) | Coupe le 48V (Jetson/Moteurs) sur ordre de la Spresense. |\n| **Pont Diviseur** | Résistances 150kΩ + 10kΩ | Surveillance de la tension batterie 13S (48V). |\n| **Condensa.** | 1000µF / 63V (Low ESR) | Filtrage des pics de tension au branchement. |\n| **Connecteur** | **Anderson SB50** (anti-spark) ou XT90-S | Connecteur haute puissance pour batterie 13S NMC 48V. |\n| **Batterie (×1 → ×2)** | **[AT WEY NMC 48V 10 Ah](https://atwey.fr/accueil/94-batterie-generique-48v-10ah.html)** | 480 Wh, 2.3 kg, 13S NMC 21700 LG M50LT, BMS 50A, ~€300/pack — Assemblé 🇫🇷. Acheter 1 dès Phase 1, 2ème en Phase 4 (voir [Détails](./04_Electronique_Cablage.md#4-alimentation--batterie)). |\n| **Chargeur 13S** | **54.6V CC/CV 4-5A** | Chargeur dédié Li-ion 13S NMC. Demander à AT WEY ou fournisseur FR. |\n| **LiDAR** | **Unitree L2** | FOV 360°×96°, Portée 30m, 64k pts/s. ⚠️ IMU intégrée défectueuse → utiliser BMI270 Spresense. Montage sur silent blocks. Voir [Analyse complète](./19_Perception_Spatiale_LiDAR.md). |\n| **Alimentation Labo** | **Wanptek DPS605U** | Indispensable Phase 2 (Régler sur 24V / Lim. 1A). |\n\n### Interface CAN & Câbles\n*   **Adaptateur USB-CAN** : **InnoMaker USB2CAN-C**\n    *   *Critique* : Basé sur firmware `gs_usb` (compatible Linux natif).\n*   **Connecteurs Data** : **JST-GH 1.25mm** (Marque Holybro recommandée pour la qualité).\n    *   Acheter des câbles \"tout faits\" si possible pour éviter de sertir du 1.25mm.\n*   **Connecteurs Puissance** : **XT60** (Jaune).\n*   **Câble Bus CAN** : Utiliser impérativement des **paires torsadées** pour CAN_H / CAN_L.\n\n---\n\n## 4. Infrastructure & Connexion\n| Composant | Modèle | Usage |\n| :--- | :--- | :--- |\n| **WiFi Imprimante** | **TP-Link Archer T3U** | AC1300 Mbps, USB 3.0. Connectivité stable pour Qidi Plus 4. |\n\n---\n\n## 5. Consommables & Outils\n*   **Frein Filet** : **Loctite 222** (Faible/Moyen). Indispensable ! Les vibrations des moteurs Robstride desserrent les vis M3 en quelques heures sans cela.\n*   **Clés Allen** : Jeu de clés de précision (Facom ou Wera) pour ne pas foire les têtes de vis.\n", "Conception: 03_Montage_Mecanique": "# Guide Mécanique et Impression 3D\n\n## 1. Paramètres### Visserie Industrielle\nLe projet utilise deux standards principaux :\n1.  **ISO 7380 (Tête Bombée)** : Profil bas, idéal pour l'esthétique et éviter d'accrocher les câbles.\n2.  **DIN 912 (Tête Cylindrique)** : Indispensable pour les zones à fort couple (hanches). Permet un serrage monumental.\n\n#### Paramètres de Chambrage (Fusion 360 - Vis DIN 912)\n| Dimension | Symbole | M3 (DIN 912) | M4 (DIN 912) |\n| :--- | :--- | :--- | :--- |\n| Diamètre Chambrage | Dcb | **6.5 mm** | **8.5 mm** |\n| Profondeur Chambrage | Hcb | **3.5 mm** | **4.5 mm** |\n| Trou Insert (PETG-CF) | dh | 4.2 - 4.5 mm | 5.6 - 5.8 mm |\n| Épaisseur Plancher | T | 3.0 mm min | 4.0 mm min |\n\n---\n\n### Inserts et Roulements\n- **Inserts Ruthex** : Utilisez les versions **Longues (8.1mm)** pour les RS-04. Les versions courtes (5.7mm) suffisent pour les carters.\n- **Roulements 608ZZ** :\n    - Montage : Bague extérieure fixe dans le support, intérieure tournante avec l'axe.\n    - Logement : **22.0 mm** pour press-fit (ajusté au fer).\n    - Butée : Épaulement de **1 mm** (ne doit toucher que la bague extérieure).\n\n### Commande CNC (Aluminium 6061)\n- **Format** : Fichiers `.step` uniquement.\n- **Rayons** : Rayons internes de **2mm minimum** (usinage fraise).\n- **Finition** : \"As Machined\" (le plus économique).\n\n### Chambrages (Counterbore) pour têtes de vis DIN 912\nL'objectif est de noyer la tête de vis pour qu'elle ne dépasse pas, tout en laissant passer la clé Allen.\n| Paramètre | Symbole | M3 | M4 |\n| :--- | :--- | :--- | :--- |\n| **Diamètre Chambrage** | $D_{cb}$ | **6.5 mm** | **8.5 mm** |\n| **Profondeur** | $H_{cb}$ | **3.5 mm** | **4.5 mm** |\n| **Passage de vis** | $d$ | 3.4 mm | 4.5 mm |\n\n> **Astuce Fusion 360** : Utilisez l'outil *Hole (H)* > *Counterbore* > *Simple* > *Flat*.\n\n### Trous pour Inserts (Heat-set)\nCes diamètres sont optimisés pour les inserts Ruthex standards.\n| Paramètre | M3 | M4 |\n| :--- | :--- | :--- | \n| **Diamètre perçage** | **4.2 - 4.5 mm** | **5.6 - 5.8 mm** |\n| **Épaisseur paroi min** | 1.6 mm | 2.0 mm |\n| **Épaisseur fond plan** | **3.0 mm** (Min) | **4.0 mm** (Min) |\n\n---\n\n## 2. Impression 3D (Qidi Plus 4)\n\n### Matériau Recommandé : PETG-CF\nLe PETG renforcé fibre de carbone (PETG-CF) est le meilleur compromis pour le D-Bot sur cette machine.\n*   **Avantages** : Rigidité accrue (moins de flexion que le PETG pur), aspect mat qui cache les couches, bonne tenue en température (vers 80°C).\n*   **Inconvénients** : Abrasif (utilisez une buse acier trempé).\n\n*   **(A) PLA** : Pour le prototypage rapide et validation de forme. **(~20€/kg)**\n*   **(B) PETG-CF** (Recommandé) : Rigide, facile à imprimer, esthétique carbone. Suffisant pour 80% du robot. **(~30€/kg)**\n*   **(C) PA12-CF** (Nylon Carbone) : Performance ultime (Chaleur/Choc). Nécessite enceinte chauffée + séchage pro. Pour les pièces critiques uniquement (Hanches). **(~100€/kg)**\n\n### Comparatif Matériaux\n| Critère | PLA (Proto) | PETG-CF (Standard) | PA12-CF (Pro) |\n| :--- | :--- | :--- | :--- |\n| **Coût (Est.)** | 20€ / kg | **30€ / kg** | 100€ / kg |\n| **Rigidité** | Moyenne | Élevée | Très Élevée |\n| **Résistance Chaleur** | Faible (50°C) | Moyenne (75°C) | Haute (100°C+) |\n| **Facilité Impression** | Très Facile | Facile | Difficile (Warping) |\n| **Usage D-Bot** | Tests de forme | **Coques, Bras, Tête** | Gears, Hanches |\n\n### Paramètres de Slicer (OrcaSlicer / QidiSlicer)\n*   **Matériau** : Creality Hyper **PETG-CF** (Recommandé pour débuter).\n    *   *Alternative Pro* : **PA12-CF** (Nylon Carbone). Plus rigide et résistant à la chaleur, mais nécessite une enceinte chauffée et un séchage parfait. À réserver aux utilisateurs expérimentés.\n*   **Températures** :\n    *   **Buse** : 270°C\n    *   **Plateau** : 80°C\n    *   **Chambre (Active)** : 50°C\n*   **Vitesse** : 200-300 mm/s.\n*   **Hauteur de couche** : 0.20 mm (Standard) ou 0.16 mm (Précision engrenages).\n*   **Périmètres (Walls)** : **4 à 5 murs minimum**. C'est le plus important pour la solidité des filetages/inserts.\n*   **Remplissage (Infill)** :\n    *   **100% (Solid)** pour : Hanches, Épaules, Supports Moteurs.\n    *   **40% (Gyroid)** pour : Coques, avant-bras, tête.\n*   **Séchage** : Obligatoire avant impression (65°C / 6h).\n\n---\n\n## 3. Montage des Moteurs Robstride\n\n### Intégration Robstride 05 (RS-05) - Cou / Poignets\n*   **Ancrage** : Le couple de pointe (5.5 Nm) est élevé pour du plastique.\n    *   Utilisez des **vis M4 x 12mm Acier 12.9 (Noir)** pour fixer le corps moteur au châssis. L'Inox est trop \"mou\" pour ces zones de force pure si vous démontez souvent.\n*   **Longueur de vis** : Règle d'or = Épaisseur pièce plastique + (Profondeur trou moteur - 1mm).\n    *   *Ne forcez jamais* si la vis touche le fond du trou borgne du moteur ! Vous détruiriez le filetage interne du stator.\n\n### Roulements 608ZZ\n*   Utilisés pour les articulations passives.\n*   **Indépendance** : La bague intérieure et extérieure sont indépendantes. Vous pouvez fixer l'une au châssis et l'autre au membre mobile.\n*   **Fichier STEP** : Disponible dans le dossier `Discussions/ou recuperer le modele step...`.\n\n### Positionnement LiDAR Unitree L2\n*   **Emplacement** : **Haut du Torse**, devant le cou (voir [Décisions Architecturales](./06_Decisions_Architecturales.md)).\n*   **Pourquoi ?** Évite le passage de câble dans le cou articulé, tout en gardant un bon FOV.\n*   **Fixation** : Support incliné à **10-20°** vers l'avant.\n*   **Orientation** : Connecteur vers le bas ou l'arrière selon le design du plastron.\n\n---\n\n## 4. Intégration Cheville 2-DOF (Roll + Pitch) [Phase 4]\nPour l'option \"D-Bot Performance\" (24 DOF), la cheville utilise deux moteurs en série.\n\n### Schéma Cinématique (Bracket en L)\nL'objectif est de garder le pied le plus bas possible. Le moteur Roll (RS-00, 57×57 mm) est solidaire du pied en direct-drive, tandis que le moteur Pitch (**RS-02**) est monté **haut dans le tibia** et actionne la cheville via un **mécanisme de tirant/bielle** (architecture K-Bot conservée, ratio ~2:1 → ~34 N.m effectif). Le RS-00 est plus compact que le RS-02 initialement envisagé pour le Roll, facilitant l'intégration dans le pied.\n\n```mermaid\ngraph TD\n    Tibia[\"Structure Tibia\"] -->|Fixe le Stator| Pitch[\"Moteur Pitch RS-02 (haut tibia)\"]\n    Pitch -->|\"Rotor tourne (Y)\"| Bracket[\"Pièce Inter-Moteurs 'L-Shape'\"]\n    Bracket -->|Fixe le Stator| Roll[\"Moteur Roll RS-00\"]\n    Roll -->|\"Rotor tourne (X)\"| Pied[\"Structure du Pied + FSR\"]\n```\n\n### Vue Éclatée de l'Assemblage\n![Schéma de l'assemblage cheville 2-DOF avec Bracket en L](./assets/ankle_2dof_assembly.png)\n\n> **Axes de Rotation** :\n> - **Axe Y** (Pitch) : Horizontal médio-latéral (gauche↔droite). Pied monte/descend.\n> - **Axe X** (Roll) : Horizontal antéro-postérieur (avant↔arrière). Pied penche latéralement.\n\n### Pièces à Imprimer / Usiner\n1.  **Cheville_Inter_Bracket** (Pièce en L) :\n    *   Connecte la sortie du tirant RS-02 (Pitch) au bracket du RS-00 (Roll).\n    *   **Matériau** : PA12-CF ou Alu 6061 (Forte contrainte en torsion).\n    *   **Visserie** : M4 x 10mm (x4 côté Pitch) + M3 x 8mm (x4 côté Roll).\n2.  **Pied_Sole** :\n    *   Accueille le rotor du RS-00.\n    *   Logements pour les 4 capteurs FSR.\n    *   **Surface** : Ajouter un patin en TPU ou caoutchouc 2mm pour le grip.\n", "Conception: 04_Electronique_Cablage": "# Électronique & Câblage\n\n## 1. Schéma Global de Connexion\nL'architecture repose sur un bus CAN centralisé et des liaisons USB High-Speed.\n\n### Cerveau Principal (NVIDIA Jetson Orin Nano)\n*   **Alimentation** : 19V DC (via Jack ou XT60 régulé).\n*   **Rôle** : Orchestrateur ROS2, Vision IA, Planification de mouvement.\n*   **Ports** :\n    *   **USB A** -> **InnoMaker USB2CAN** (Contrôle Moteurs)\n    *   **USB C** -> **OAK-D Pro** (Vision Stéréo + IA)\n    *   **USB A** -> **Sony Spresense** (Audio / Capteurs TR)\n\n---\n\n## 2. Bus CAN (Moteurs Robstride)\nC'est la colonne vertébrale du robot. Une erreur ici rend le robot inerte.\n\n### Adaptateur : InnoMaker USB2CAN-C\n*   **Firmware** : `gs_usb` (Natif Linux).\n*   **Configuration Switch** : Mettre le switch **120 \\Omega** sur **ON** (si l'adaptateur est en début de chaîne).\n*   **Câblage Bornier** :\n    *   **CAN_H** -> Fil Vert (souvent) du moteur.\n    *   **CAN_L** -> Fil Jaune (souvent) du moteur.\n    *   **GND** -> **CRITIQUE**. Relier la masse de l'USB2CAN à la masse commune des moteurs (Batterie -). Sans ça, le signal flotte et crée des erreurs \"Bus Off\".\n\n### Bus de Communication (CAN 1 Mbps)\nLe Bus CAN est le système nerveux du D-Bot. Une erreur de câblage ici rend le robot incontrôlable.\n\n#### Règle d'or du Câblage 3 fils\nBien que différentiel, le CAN exige une référence commune :\n1.  **CAN_H** (Jaune)\n2.  **CAN_L** (Blanc)\n3.  **GND** (Noir) : **CRITIQUE.** Doit relier la borne GND de l'InnoMaker à la masse des moteurs.\n*Note : Le fil rouge (VCC 5V) du Hub Holybro ne doit JAMAIS être connecté aux moteurs alimentés en 48V.*\n\n#### Architecture Daisy Chain\n- **Stubs** : Les dérivations vers les moteurs doivent mesurer moins de **30 cm**.\n- **Terminaison** : Une résistance de **120 Ω** doit être placée à chaque extrémité (Jetson et dernier moteur).\n- **Torsion** : Torsader les fils (33 tours/mètre) pour annuler les EMI.\n\n___\n\n## 3. Sony Spresense & OAK-D Pro\n\n### OAK-D Pro (Vision)\n*   Agit comme un capteur USB3.\n*   Intègre une **IMU (BNO085/BMI270)** — **utilisée uniquement pour la stabilisation du regard**, pas pour l'équilibre du corps (voir [Stratégie IMU](./08_Audio_Perception.md)).\n\n### Sony Spresense (Audio & I/O)\n*   **Carte Extension Choisie** : **Standard Board** (CXD5602PWBEXT1).\n    *   *Raison* : Permet de brancher jusqu'à **8 microphones numériques** pour le Beamforming (localisation de la voix).\n    *   *Évolutabilité* : Headers Arduino compatibles pour ajouter des shields futurs.\n*   **Alternative LTE** : Si le robot doit sortir en extérieur (hors Wi-Fi), une **LTE Extension Board** aurait été préférée, mais la Standard offre plus de flexibilité I/O audio pour un robot social.\n*   **Liaison Jetson** : Via USB (Port principal micro-USB de la Spresense). La Spresense apparaît comme un périphérique série (`/dev/ttyUSBx`) ou Audio USB selon le sketch chargé.\n\n---\n\n### Mise sous tension (Sécurité Wanptek)\nPour les premiers tests moteurs (Banc d'essai) :\n1.  Régler la tension à **24.0V** (ou 48V) à vide.\n2.  Régler la limite de courant à **1.000A** (en court-circuitant les pinces).\n3.  Activer le mode **OCP** (Overcurrent Protection).\n4.  Séquence : Allumer l'alim -> Vérifier tension -> Brancher XT60 -> `Enable` logiciel.\n\n## 4. Alimentation & Batterie\n\n### Spécifications Système\n*   **Tension nominale** : **46.8V** (13S Li-ion NMC) — Standard K-Bot.\n*   **Tension max (charge)** : 54.6V (13S NMC, chargeur CC/CV dédié).\n*   **Connecteur principal** : **Anderson SB50** (anti-spark) ou **XT90-S**.\n*   **Distribution** : **PDB (Power Distribution Board)** type Matek PDB-HEX pour éclater le 48V vers les moteurs.\n*   **Sécurité** :\n    *   Fusible automobile 80A sur la ligne principale.\n    *   Bouton d'arrêt d'urgence (E-Stop) coupant l'alim moteurs mais *pas* la Jetson.\n    *   MOSFET piloté par Spresense pour coupure logicielle (voir [Guide Watchdog](./11_Guide_SensiEDGE_Watchdog.md)).\n\n> [!NOTE]\n> **Pourquoi 13S (48V) et non 12S (44V) ?** Le \"S\" = nombre de cellules en Série. Chaque cellule NMC fait 3.6V nominal. 13 × 3.6V = 46.8V ≈ \"bus 48V\" — c'est le standard des RobStride et du K-Bot officiel. En 12S (43.2V), les moteurs fonctionnent mais avec un couple réduit de ~8%. Le passage en 12S LiPo (3.7V/cellule = 44.4V) serait un compromis acceptable pour du RC, mais pour le D-Bot on suit le standard K-Bot.\n\n### Choix de Batteries — NMC 21700 (Stratégie Progressive)\n\n> [!IMPORTANT]\n> **Stratégie retenue** : Démarrer avec **1× AT WEY NMC 48V 10 Ah** (Phase 1-3), puis **ajouter la 2ème identique en parallèle** en Phase 4 pour doubler l'autonomie et la symétrie. **Même techno du début à la fin, zéro gaspillage.**\n\n#### 🏆 Batterie Recommandée : AT WEY NMC 48V 10 Ah\n\n| Paramètre | Valeur |\n| :--- | :--- |\n| **Modèle** | Batterie générique 48V 10 Ah |\n| **Chimie** | Li-ion NMC 21700, cellules **LG M50LT** |\n| **Tension** | 48V nominale (13S) |\n| **Capacité** | 10 Ah (480 Wh) |\n| **Poids** | **2.3 kg** par pack |\n| **BMS** | 13S NMC intégré, 20-50A continu, 100A pic |\n| **Connectique** | Personnalisable à la commande (demander **Anderson SB50**) |\n| **Fabrication** | 🇫🇷 Assemblé en France |\n| **Prix** | ~250-350 € TTC par pack |\n\n🔗 **Lien d'achat** : [AT WEY — Batterie générique 48V 10Ah](https://atwey.fr/accueil/94-batterie-generique-48v-10ah.html)\n\n> [!TIP]\n> **À la commande, préciser** : connecteur Anderson SB50 (ou QS8 anti-spark), BMS 50A continu minimum, usage robotique haute puissance. Demander aussi un **chargeur 13S (54.6V) 4-5A CC/CV**.\n\n#### Pourquoi NMC plutôt que Semi-Solide ?\n\n| Critère | NMC 21700 (AT WEY) | Semi-Solide (Grepow/Tattu) |\n| :--- | :--- | :--- |\n| **Disponibilité** | ✅ En stock, livraison FR | ❌ Custom, MOQ, délais 4-12 sem. |\n| **Poids (10 Ah)** | 2.3 kg | ~1.5 kg (théorique) |\n| **Capacité** | 10 Ah (480 Wh) | 6 Ah max (265 Wh) — custom requis |\n| **Prix** | ~€300 | ~$400-800 + import |\n| **Courant** | 50A continu, 100A pic | Variable, peu documenté |\n| **Cycles** | 800-1000 | 300-1000 |\n| **Assemblé en FR** | ✅ Oui | ❌ Import Chine |\n| **Risque projet** | ✅ Faible | ⚠️ Élevé (approvisionnement) |\n\n→ Le semi-solide sera réévalué en **2027+** quand des packs robotiques <5 kg existeront. Voir [Annexe Semi-Solide](./17_Annexe_Batterie_SemiSolide.md).\n\n#### Alternatives FR Évaluées\n\n| Fournisseur | Chimie | Avantage | Limite |\n| :--- | :--- | :--- | :--- |\n| [B-Volt](https://www.b-volt.com) | NMC Samsung 35E | Ultra-léger, FR | Moins de capacité |\n| [OZO Industries](https://ozo-industries.com) | NMC/LFP custom | Sur-mesure forme et BMS | Plus cher (~€600+) |\n| [Li-Tech](https://www.li-tech.fr) | LiFePO4 | Très sûr, 6000 cycles | +40% masse (3-4 kg) |\n| [PowerTech](https://www.powertechsystems.eu) | LiFePO4 | Industriel IP65 | Trop lourd pour bipède |\n\n→ Détails dans [Annexe NMC](./16_Annexe_Batterie_NMC.md) et [Annexe Comparatif](./18_Annexe_Batterie_Comparatif.md).\n\n### Positionnement dans le Robot\n\n#### Phase 1-3 : 1 seule batterie (centrée)\n\n```\n┌─────────────────────────┐\n│       TORSE BAS          │\n│                          │\n│    ┌──────────────┐      │\n│    │  AT WEY #1   │      │   ← À plat, centrée\n│    │  480 Wh      │      │      au-dessus du bassin\n│    │  2.3 kg      │      │\n│    └──────────────┘      │\n│      (CdG centré)        │\n└─────────────────────────┘\n```\n\n#### Phase 4 : 2 batteries en parallèle (symétrie)\n\n```\n┌─────────────────────────┐\n│       TORSE BAS          │\n│                          │\n│  ┌──────────┐ ┌──────────┐│\n│  │ AT WEY 1 │ │ AT WEY 2 ││  ← 1 de chaque côté\n│  │ 480 Wh   │ │ 480 Wh   ││     du bassin\n│  │ 2.3 kg   │ │ 2.3 kg   ││\n│  └──────────┘ └──────────┘│\n│   Total: 960 Wh, 4.6 kg   │\n│   Autonomie: ~40-50 min   │\n│   (Symétrie + Redondance) │\n└─────────────────────────┘\n```\n\n> [!WARNING]\n> **Mise en parallèle** : Les 2 packs DOIVENT être identiques (même modèle, même âge). Toujours connecter/déconnecter à SoC proche (~50-60%). Utiliser un ORing MOSFET ou des diodes idéales pour éviter les courants d'équilibrage.\n\n### Sécurité Incendie (NMC)\n\n- ✅ Utiliser uniquement des **packs fermés avec BMS dédié** (jamais de cellules nues)\n- ✅ **Espace d'air** autour de la batterie dans le torse\n- ✅ **Cloisonnement** en matériaux ignifugés (PC/ABS, tôle alu)\n- ✅ **Sortie de dégazage** vers l'arrière (ne pas enfermer hermétiquement)\n- ✅ **Charge** uniquement avec chargeur **54.6V (13S) CC/CV** dédié, en zone ventilée\n- ✅ **Monitoring** température/tension/courant via Spresense (harnais faible puissance du BMS)\n\n### Slot CAD Recommandé\n\nPour accueillir 1 ou 2 packs AT WEY, prévoir dans le torse 3D :\n- **Slot unique (Phase 1-3)** : 200 × 100 × 50 mm (avec marge)\n- **Double slot (Phase 4)** : 200 × 180 × 50 mm (2 packs côte-à-côte)\n- **Fixation** : Rails ou Velcro industriel + connecteur Anderson accessible par trappe arrière\n- **Sangle velcro** + **patin anti-vibration TPU** en fond de slot\n\n### Câblage Batterie → PDB\n\n```\nBatterie(s) 13S NMC (Anderson SB50) ─── [Si 2 : ORing MOSFET parallèle]\n    │\n    ├── Fusible 80A (Automobile, lame)\n    │\n    ├── E-Stop (Bouton d'arrêt d'urgence)\n    │\n    ├── MOSFET Spresense (Pin D13) — Coupure logicielle\n    │\n    └── PDB (Matek PDB-HEX)\n         ├── Moteurs RS-04 Hanches (XT60 ×4)\n         ├── Moteurs RS-03 Épaules/Hanches (XT60 ×8)\n         ├── Moteurs RS-02/00/05 (XT30 ×10)\n         └── DC-DC 48V→5V (Jetson + Spresense)\n```\n\n---\n\n## 5. Capteurs de Force (FSR) - Phase 4\nPour la marche dynamique, chaque pied est équipé de 4 capteurs FSR (Force Sensing Resistor) pour mesurer le Centre de Pression (CoP).\n\n### Schéma de Câblage (Pont Diviseur)\nLes FSR sont des résistances variables (Infini à vide -> ~1kΩ appuyé). La Spresense lit une **tension** (ADC). Il faut donc un circuit diviseur.\n\n```\n      3.3V (Spresense VREF)\n        │\n        │\n       [ ]  FSR (Capteur de force)\n        │\n        ├─── vers Pin Analogique (A0, A1, A2, A3)\n        │\n       [ ]  Résistance Pull-down (R = 10kΩ)\n        │\n       GND\n```\n\n### Connexion Spresense\n*   **Haut de l'Extension Board** : Pins `A0` à `A3` (4 canaux).\n*   **Multiplexage** : Si vous avez 8 FSR (4 par pied) et seulement 4 entrées analogiques libres :\n    *   Option A : Mettre les FSR Avant en parallèle (moyenne) et Arrière en parallèle. = 2 fils par pied.\n    *   Option B : Utiliser un multiplexeur I2C (ex: ADS1115) pour lire 4 canaux supplémentaires.\n    *   *Reco Prototype* : Option A (Suffisant pour savoir si le poids est sur les pointes ou les talons).\n", "Conception: 05_Logiciel_Configuration": "# Logiciel & Configuration\n\n## 1. NVIDIA Jetson (SocketCAN)\nLa configuration du bus CAN est essentielle pour piloter les moteurs Robstride.\n\n### Prérequis Linux\n```bash\nsudo apt-get update\nsudo apt-get install can-utils\n```\n\n### Couche Jetson (Middleware)\nLe D-Bot tourne sous **Ubuntu 22.04 (JetPack 6)** avec **ROS 2 Humble**.\n- **Micro-ROS Agent** : Gère la passerelle avec la Sony Spresense via `/dev/ttyTHS0` (Pins 8/10).\n- **NVIDIA Isaac ROS** : Accélération matérielle pour la vision (OAK-D).\n\n### Couche Spresense (Temps Réel)\nLa Spresense exécute un firmware Arduino/NuttX avec **Micro-ROS Client**.\n- **Topics publiés** :\n    - `/audio/direction` : Angle DoA calculé par beamforming.\n    - `/imu/balance` : Données IMU torse (BMI270 Add-on) pour le contrôle d'équilibre.\n    - `/power/status` : Tension batterie 13S (48V) et température interne.\n- **Fonction Watchdog** : Le firmware surveille le heartbeat de la Jetson et coupe le MOSFET de puissance en cas de freeze.\n- **Liaison Audio** : Flux 8 canaux via **UAC 2.0** (USB) pour une qualité Hi-Res (192 kHz).\n\n### Activation de l'Interface CAN\nL'adaptateur InnoMaker est reconnu comme `can0` (parfois `can1`).\nLe débit standard Robstride est **1 Mbps** (1,000,000 bps).\n\n**Commande d'activation :**\n```bash\nsudo ip link set can0 up type can bitrate 1000000\n```\n\n**Commande de diagnostic (candump) :**\n```bash\ncandump can0\n```\n*Si vous voyez des lignes défiler (ex: `can0 141 [8] ...`), la communication est établie.*\n\n### Dépannage\n*   **Erreur \"Bus-off\"** : Souvent un problème physique (Fils non torsadés, Terminaison 120 Ohm manquante, GND non relié).\n*   **Interface introuvable** : Vérifiez `lsusb` (ID 1d50:606f) et chargez le module si besoin : `sudo modprobe gs_usb`.\n\n---\n\n## 2. Architecture ROS2\nL'objectif est d'avoir un système réactif où la vision influence directement les moteurs.\n\n### Noeuds ROS2 Suggérés\n1.  **kbot_vision** : Wrapper pour l'OAK-D Pro. Publie les objets détectés (`/detections`) et l'odométrie visuelle (`/odom`).\n2.  **kbot_motor_control** : Lit `/cmd_vel` ou `/joint_states` et envoie les trames CAN brutes aux moteurs.\n3.  **kbot_audio** : Interface avec la Spresense. Reçoit la direction du son (x,y,z) et publie une cible pour la tête (`/head_target`).\n4.  **kbot_balance** : Contrôleur d'équilibre. Lit `/imu/balance` (BMI270 torse) + `/joint_states` (encodeurs moteurs) et publie les corrections de couple sur les hanches/chevilles.\n5.  **kbot_joint_states** : Publie les positions/vitesses/couples des 24 moteurs via les encodeurs 14-bit RobStride intégrés (`/joint_states`).\n\n### Idées Algorithmiques\n*   **Beamforming (Audio)** : Utiliser les micros de la Spresense pour orienter la tête vers celui qui parle.\n*   **Équilibre (IMU Torse)** : Lire l'IMU BMI270 du torse (via Spresense) pour le contrôle d'équilibre bipède. **Ne PAS utiliser l'IMU de l'OAK-D** (tête) pour l'équilibre — elle bouge indépendamment du corps.\n*   **Propriöception (Encodeurs)** : Les encodeurs 14-bit doubles de chaque moteur RobStride fournissent la position et la vitesse articulaire en temps réel. L'estimation de couple via le courant moteur peut remplacer des capteurs de force/couple externes.\n\n---\n\n## 3. Outils de Développement\n*   **Fusion 360** : CAO Mécano-Soudée.\n*   **Docker** : Recommandé sur la Jetson pour isoler l'environnement ROS2 Humble/Jazzy.\n", "Conception: 06_Decisions_Architecturales": "# Décisions Architecturales\n\nCe document recense les choix techniques structurants effectués durant la phase de conception (Discussions Février 2026).\n\n## 1. Choix du Kit Moteur\n**Décision** : Ajouter 2 moteurs **Robstride 05 (RS05)** au kit standard.\n*   **Pourquoi ?** Le kit de base manquait de couple au niveau du cou et des poignets pour un humanoïde de cette taille.\n*   **Conséquence** : Nécessite des vis spécifiques (M4 Acier 12.9) et un ancrage châssis renforcé (PETG-CF 100% Infill).\n\n## 2. Carte d'Extension Sony Spresense\n**Choix** : **Extension Board Standard** (vs LTE Extension Board).\n*   **Motif Principal** : Capacités Audio et Évolutivité.\n    *   La carte Standard permet de connecter jusqu'à **8 microphones numériques** (essentiel pour le *beamforming* et l'interaction vocale avancée).\n    *   Elle possède des connecteurs Arduino compatibles, permettant d'ajouter un shield LTE tiers plus tard si nécessaire.\n    *   La carte LTE officielle sacrifie trop d'I/O audios (max 4 micros) pour un usage \"autonome outdoor\" qui n'est pas la priorité immédiate.\n\n## 3. Positionnement LiDAR (Unitree L2)\n**Choix** : **Haut du Torse, devant le cou, incliné 10-20° vers l'avant**.\n*   **Alternatives rejetées** :\n    - *Sommet de la tête* : FOV idéal mais nécessite un câble passant dans le cou articulé (Pan/Tilt RS-05) — risque d'usure et de torsion du câble, poids en hauteur (+CdG).\n    - *Tibia* : Trop bas, ne voit pas les tables ni les obstacles en hauteur.\n    - *Bassin* : Occulté par les jambes lors de la marche.\n*   **Avantage du torse haut** :\n    - Champ de vision 360° dégagé (les bras n'occultent que temporairement lors de manipulation).\n    - Pas de contrainte mécanique de câble articulé.\n    - Position stable (pas de vibrations du cou Pan/Tilt) = meilleur SLAM.\n    - L'inclinaison de 10-20° compense le décalage par rapport au sol.\n*   **Compensation** : L'OAK-D Pro (vision stéréo) dans la tête complète le champ de vision frontal quand les bras sont levés.\n\n## 4. Matériaux et Fixations\n*   **Visserie** : Standardisation sur **DIN 912** (Cylindrique) Inox A2.\n*   **Inserts** : Laiton (type Ruthex) préférés à l'Inox.\n    *   *Raison* : L'Inox conduit mal la chaleur, rendant la pose dans le plastique très risquée (fonte excessive autour de l'insert). La longueur de l'insert prime sur sa matière.\n", "Conception: 14_Cinematique_Moteurs": "# 14 - Cinématique & Choix Moteurs\n\nCe document détaille l'architecture cinématique du D-Bot (**Standard 24 DOF**) et les spécifications techniques des actionneurs **RobStride**.\n\n## 1. Configuration K-Bot Standard (20 DOF)\n\n### 📊 Architecture Officielle K-Scale\nLe K-Bot standard est un robot humanoïde open-source de taille réelle développé par K-Scale Labs, équipé de **20 moteurs RobStride** pour 20 degrés de liberté. La configuration D-Bot étend cette base avec une tête articulée.\n\n**Source** : [K-Scale Official Documentation](https://docs.kscale.dev/robots/k-bot/motor-id-mapping)\n\n---\n\n### 🦾 BRAS (10 moteurs - 5 par bras)\n\n**Configuration par bras :**\n\n| Articulation | Moteur | IDs<br/>(G/D) | Couple<br/>Pic | Couple<br/>Nom. | Poids | Fonction |\n| :--- | :---: | :---: | :---: | :---: | :---: | :--- |\n| **Épaule Pitch** | RS-03 | 11 / 21 | 60 N.m | 20 N.m | 880g | Lever le bras |\n| **Épaule Roll** | RS-03 | 12 / 22 | 60 N.m | 20 N.m | 880g | Écarter le bras |\n| **Épaule Yaw** | RS-02 | 13 / 23 | 17 N.m | 6 N.m | 405g | Rotation interne |\n| **Coude Pitch** | RS-02 | 14 / 24 | 17 N.m | 6 N.m | 405g | Flexion |\n| **Poignet Roll** | RS-00 | 15 / 25 | 14 N.m | 5 N.m | 310g | Orientation fine |\n\n**Total par bras** : 3 kg environ  \n**Total 2 bras** : 10 moteurs (4× RS-03 + 4× RS-02 + 2× RS-00)\n\n---\n\n### 🦵 JAMBES (10 moteurs - 5 par jambe)\n\n**Configuration par jambe :**\n\n| Articulation | Moteur | IDs<br/>(G/D) | Couple<br/>Pic | Couple<br/>Nom. | Poids | Fonction |\n| :--- | :---: | :---: | :---: | :---: | :---: | :--- |\n| **Hanche Pitch** | RS-04 | 31 / 41 | 120 N.m | 40 N.m | 1420g | Flexion jambe |\n| **Hanche Roll** | RS-03 | 32 / 42 | 60 N.m | 20 N.m | 880g | Équilibre latéral |\n| **Hanche Yaw** | RS-03 | 33 / 43 | 60 N.m | 20 N.m | 880g | Rotation hanche |\n| **Genou Pitch** | RS-04 | 34 / 44 | 120 N.m | 40 N.m | 1420g | Flexion genou |\n| **Cheville Pitch** | RS-02 | 35 / 45 | 17 N.m | 6 N.m | 405g | Propulsion (via mécanisme tirant) |\n\n**Total par jambe** : 4.6 kg environ  \n**Total 2 jambes** : 10 moteurs (4× RS-04 + 4× RS-03 + 2× RS-02)\n\n---\n\n### 🔢 INVENTAIRE K-BOT STANDARD\n\n| Modèle | Quantité | Poids Unit. | Poids Total | Usage Principal |\n| :---: | :---: | :---: | :---: | :--- |\n| **RS-04** | 4 | 1420g | 5.68 kg | Hanches Pitch + Genoux |\n| **RS-03** | 8 | 880g | 7.04 kg | Épaules + Rotations hanches |\n| **RS-02** | 6 | 405g | 2.43 kg | Coudes + Yaw épaules + Chevilles |\n| **RS-00** | 2 | 310g | 0.62 kg | Poignets |\n| **TOTAL** | **20** | | **15.77 kg** | Total moteurs K-Bot |\n\n---\n\n### 🤖 ÉVOLUTION D-BOT (24 DOF — \"D-Bot Performance\")\n\nLe **D-Bot** étend le K-Bot de 20 à **24 DOF** avec trois ajouts. Voir [Analyse Biomécanique](./15_Analyse_Biomecanique.md) pour la justification détaillée de chaque upgrade.\n\n| Ajout D-Bot | Moteur | Quantité | Couple Pic | Fonction |\n| :--- | :---: | :---: | :---: | :--- |\n| **Cou Pan** (Yaw) | RS-05 | 1 | 5.5 N.m | Rotation horizontale tête |\n| **Cou Tilt** (Pitch) | RS-05 | 1 | 5.5 N.m | Inclinaison tête |\n| **Cheville Roll** 🆕 | RS-00 | 2 (ajout) | 14 N.m | **Stabilité latérale** (compact, précis) |\n\n**Total D-Bot** : 20 (Base) + 2 (Tête) + 2 (Chevilles Roll) = **24 moteurs**.\n\n> [!NOTE]\n> **Mécanisme de cheville K-Bot conservé (Tirant/Linkage)** : Le RS-02 de cheville n'est **pas en prise directe** sur l'axe de la cheville. Il est monté **haut dans le tibia** et actionne le pied via un **mécanisme de tirant** (connecting rod / pushrod). Ce bras de levier crée un avantage mécanique (~2:1) qui multiplie le couple effectif : 17 N.m × 2 ≈ **34 N.m** à la cheville. **Le D-Bot conserve cette architecture éprouvée** pour le Pitch, et ajoute un RS-00 en direct-drive pour le Roll.\n\n![Mécanisme de cheville K-Bot avec tirant (RS-02 haut dans le tibia)](./assets/kbot_ankle_linkage.png)\n\n## 2. Spécifications Moteurs RobStride (Gamme Complète)\nVoici les données techniques consolidées pour l'ensemble de la gamme RobStride (Février 2025).  \n*Prix officiels RobStride ou sources vérifiées (OpenELAB, AiFitLab) - Hors taxes/livraison.*\n\n| Modèle | Pic<br/>(N.m) | Nom.<br/>(N.m) | Vmax<br/>(RPM) | Poids<br/>(g) | Dim.<br/>(mm) | Ratio | Prix<br/>($) | Volt.<br/>(V) | Usage D-Bot |\n| :--- | :---: | :---: | :---: | :---: | :---: | :---: | :---: | :---: | :--- |\n| **RS-05** | **5.5** | 1.6 | 480 | **191** | 46×46×44 | 7.75:1 | **$120** | 48V (15-60V) | **Cou**, Doigts (futur) |\n| **RS-00** | **14.0** | 5.0 | 315 | **310** | 57×57×51 | 10:1 | **$135** | 48V (24-60V) | **Poignet** (Compact, fort couple) |\n| **RS-01** | **17.0** | 6.0 | 350 | **380** | 78.5×78.5×40 | 7.75:1 | **$140** | 36V (24-48V) | Alternative RS-02 (36V) |\n| **RS-02** | **17.0** | 6.0 | 410 | **405** | 78.5×78.5×45.5 | 7.75:1 | **$160** | 48V (24-60V) | **Coude**, Biceps, Poignet |\n| **RS-06** | **36.0** | 11.0 | 480 | **621** | 88×88×49 | 9:1 | **$230** | 48V (15-60V) | Entre-deux (Épaule légère) |\n| **RS-03** | **60.0** | 20.0 | 195 | **880** | 106×106×56 | 9:1 | **$250** | 48V (15-60V) | **Épaule**, Hanche rot. |\n| **RS-04** | **120.0** | 40.0 | 200 | **1420** | 120×120×56 | 9:1 | **$280** | 48V (15-60V) | **Hanche**, Genou, Cheville |\n\n### Analyse Comparative\n\n####  RS-05 vs RS-00 (Petits Moteurs)\n*   **RS-05** : Ultraléger (191g), idéal pour le cou où chaque gramme compte. Couple modeste (5.5 N.m) mais suffisant pour orientation.\n*   **RS-00** : Plus dense (310g, +62%) mais délivre **2,5× plus de couple** (14 N.m). Parfait pour un poignet devant porter des charges sans fléchir.\n\n#### RS-01 vs RS-02 (Moteurs Moyens)\n*   **Même couple** (17 N.m pic), mais **RS-01** optimisé pour **36V** (idéal pour batteries LiPo 8S), plus compact en profondeur (40mm vs 45.5mm).\n*   **RS-02** : Conçu pour **48V**, marginalement plus lourd (+25g). Standard pour D-Bot aux coudes/biceps.\n\n#### RS-06 (Intermédiaire Nouveau)\n*   **Niche** : Entre RS-02 (17 N.m) et RS-03 (60 N.m). Avec **36 N.m** et 621g, c'est un compromis pour des articulations nécessitant plus que du RS-02 sans le poids du RS-03.\n*   **Usage potentiel** : Épaule de petits robots, torse rotation, ou remplacer un RS-03 si l'on veut économiser 260g et 20$.\n\n#### RS-03 vs RS-04 (Gros Moteurs)\n*   **Saut de performance brutal** : RS-03 → 60 N.m (880g) ; RS-04 → **120 N.m** (1420g, +61% poids).\n*   **RS-03** : Minimum vital pour l'épaule D-Bot (couple nécessaire pour contrer le bras-de-levier).\n*   **RS-04** : Incontournable pour hanches/jambes. **Attention** : Peut briser des pièces PLA/PETG standard → Utiliser **PETG-CF (100% remplissage)** ou **Alu 6061 CNC**.\n\n### Choix pour le D-Bot — Répartition Complète (24 DOF)\n| Zone | Moteur | Quantité | Couple Pic | Justification |\n| :--- | :---: | :---: | :---: | :--- |\n| Cou (Pan/Tilt) | RS-05 | 2 | 5.5 N.m | Légèreté critique (tête avec OAK-D Pro ~100g, LiDAR L2 sur le torse) |\n| Poignet | RS-00 | 2 | 14 N.m | Compact, fort couple pour manipulation fine |\n| Épaule Yaw + Coude | RS-02 | 4 | 17 N.m | Standard polyvalent 48V |\n| Épaule Pitch/Roll | RS-03 | 4 | 60 N.m | Force pour porte-à-faux bras tendu |\n| Hanche Roll/Yaw | RS-03 | 4 | 60 N.m | Équilibre latéral + rotation |\n| Hanche Pitch + Genou | RS-04 | 4 | 120 N.m | Portance totale (~36 kg robot) |\n| **Cheville Pitch** | **RS-02** | **2** | **17 N.m** (×2 avec tirant = ~34 N.m) | **Propulsion via tirant** (architecture K-Bot conservée) |\n| **Cheville Roll** 🆕 | **RS-00** | **2** | **14 N.m** | **Stabilité latérale (compact, ratio 10:1)** |\n\n**Total moteurs D-Bot** : 2 + 2 + 4 + 4 + 4 + 4 + 2 + 2 = **24 moteurs**.\n\n## 3. Communication & Alimentation\nTous les moteurs partagent le même protocole :\n*   **Bus** : CAN 2.0B @ 1 Mbps.\n*   **Alimentation** : 48V DC Nominal (Supportent 24V mais avec couple/vitesse réduits). RS-01 optimisé pour 36V.\n*   **Câblage** : Daisy-chain (Chaîne) via connecteurs JST-GH 1.25mm (Data) et XT60 (Power).\n*   **Encodeurs** : Dual 14-bit magnetic encoders (haute précision + redondance).\n*   **Protection** : IP52 standard (IP67 en option sur certains modèles).\n\n> [!WARNING]\n> **Attention au RS-04** : Avec 120 N.m de couple, ce moteur peut briser des pièces imprimées en PLA ou PETG standard en cas de collision. Utilisez impérativement du **PETG-CF** (Remplissage 100%) ou des pièces CNC Alu 6061 pour les brackets de hanches.\n\n> [!NOTE]\n> **Prix et Disponibilité** : Les prix sont issus des sources officielles RobStride et distributeurs agréés (OpenELAB, AiFitLab) en Février 2025. Vérifiez la disponibilité avant commande - certains modèles peuvent avoir des délais variables.\n\n---\n\n## 4. Benchmark Industrie — D-Bot vs Robots Haut de Gamme\n\n### 4.1 Comparatif Global (Corps Entier)\n\n| Robot | DOF | DOF/Jambe | Cheville | Méca. Cheville | Couple max jambe | Poids | Actionneurs | Prix |\n| :--- | :---: | :---: | :---: | :--- | :---: | :---: | :--- | :---: |\n| **D-Bot (notre)** | **24** | **6** | **2 (P+R)** | **Série QDD** | **120 N.m** (RS-04) | ~38 kg | QDD RobStride 9:1 | ~$5k |\n| K-Bot (base) | 20 | 5 | 1 (P) | Tirant (linkage) | 120 N.m (RS-04) | ~34 kg | QDD RobStride 9:1 | ~$4k |\n| **Unitree G1** | 23 | **6** | **2** | **Parallèle RSU** | **120 N.m** | 35-47 kg | QDD propriétaire | ~$16k |\n| **Tesla Optimus** | 28+ | 6 | 2 | **Parallèle SPU** | **180 N.m** rotary / 8000N linéaire | ~73 kg | Harmonic + Linéaire | N/A |\n| **Figure 02** | 28 | 6 | 2 | **Universel + linéaire** | **150 N.m** | ~60 kg | Custom harmonic | N/A |\n| **Fourier GR-2** | 53 | ~8 | 2+ | **Parallèle** (FSA 2.0) | **380 N.m** | 63 kg | FSA 2.0 (7 types) | ~$150k |\n| **Agility Digit** | 28 | 5 | 2 | **SEA** (élastique) | N/A | 65 kg | Series-Elastic | ~$300k+ |\n\n> [!NOTE]\n> **Positionnement D-Bot** : Avec 24 DOF, 6 DOF/jambe et 2 DOF cheville, le D-Bot est au niveau du Unitree G1 en terme d'architecture cinématique, pour un budget 3× inférieur. Le principal écart est le type de mécanisme de cheville (série vs parallèle).\n\n### 4.2 Mécanismes de Cheville — Les 4 Approches\n\n![Comparaison des 3 mécanismes de cheville principaux : Série, Tirant, Parallèle](./assets/ankle_mechanisms_comparison.png)\n\n#### A. Série Direct-Drive (D-Bot Actuel)\n\nLe moteur Pitch (RS-02) est monté **en haut du tibia** avec tirant/bielle (architecture K-Bot conservée). Le Roll (RS-00) est monté **directement à la cheville** en direct-drive.\n\n| Paramètre | Valeur |\n| :--- | :--- |\n| **Moteurs** | RS-02 (Pitch, haut tibia + tirant) + RS-00 (Roll, à la cheville) |\n| **Masse distale** | **~1190g** (880g + 310g) |\n| **Couple Pitch effectif** | ~34 N.m (RS-02 17 N.m × ratio tirant ~2:1) |\n| **Couple Roll effectif** | 14 N.m (= couple RS-00, suffisant corrections fines) |\n| **Complexité** | ⭐ Très faible — assemblage trivial |\n| **Coût mécanique** | ~$0 (juste le bracket en L) |\n\n#### B. Tirant / Linkage (K-Bot Original)\n\nLe moteur RS-02 est monté **en haut du tibia** et actionne le pied via un **pushrod** (barre de poussée). Le ratio de levier multiplie le couple.\n\n| Paramètre | Valeur |\n| :--- | :--- |\n| **Moteurs** | RS-02 (Pitch uniquement), haut dans le tibia |\n| **Masse distale** | **~0g** (moteur en haut) |\n| **Couple Pitch effectif** | ~34 N.m (17 × ratio ~2:1) |\n| **Roll** | ❌ Absent |\n| **Complexité** | ⭐⭐ Moyenne — pushrod + pivot |\n| **Coût mécanique** | ~$20-50 (barre usinée + pivots) |\n\n#### C. 🆕 Hybride Tirant + Roll Direct (Proposition D-Bot V2)\n\n**Combine le meilleur des deux mondes** : Pitch via tirant (moteur haut, couple multiplié) + Roll en direct-drive à la cheville (correction fine, pas besoin de rapport de levier).\n\n| Paramètre | Valeur |\n| :--- | :--- |\n| **Moteur Pitch** | RS-02 → **RS-03** monté **haut dans le tibia** + pushrod |\n| **Moteur Roll** | RS-00 monté **à la cheville** (direct-drive) |\n| **Masse distale** | **~310g** (seulement le RS-00 Roll) |\n| **Couple Pitch effectif** | **~120 N.m** (60 × ratio ~2:1) ⚡ |\n| **Couple Roll effectif** | 14 N.m (suffisant pour correction latérale) |\n| **Complexité** | ⭐⭐⭐ Élevée — pushrod + bracket + pivot |\n| **Coût mécanique** | ~$50-100 (barre, pivots, usinage) |\n\n```\n  ┌─────┐\n  │GENOU│\n  └──┬──┘\n     │\n  ╔══╧══╗ RS-03 Pitch ← Moteur HAUT (880g)\n  ║PITCH║──────┐\n  ╚═════╝      │ Pushrod\n     │ Tibia   │ (barre de poussée)\n     │         │\n     │         │ Ratio levier ~2:1\n     │         │ → 60 × 2 = 120 N.m effectifs !\n     │         │\n     │    ╔════╧═╗\n     └────╢ ROLL ╟── RS-00 (310g) ← Seul moteur EN BAS (compact 57mm)\n          ╚══╤═══╝\n          ┌──┴──┐\n          │PIED │\n          └─────┘\n```\n\n#### D. Parallèle 2 Bielles Rotulées (Unitree G1, LOLA TUM)\n\nDeux moteurs montés **en haut du tibia**, chacun relié au pied par une **bielle avec rotules** (rod end bearings). Mouvements coordonnés = Pitch, différentiels = Roll. **Aucun moteur à la cheville.**\n\n```\n    Moteur A            Moteur B      ← 2 moteurs HAUT dans le tibia\n       │                    │\n       │ Bielle A           │ Bielle B    ← Tiges filetées M4 avec\n       │ (rod end +         │               rod end bearing (rotule)\n       │  tige M4)          │               à chaque extrémité\n       │                    │\n       ╰────────┬───────────╯\n                │\n           ┌────┴────┐\n           │  PIED   │        ← Plateforme mobile (2 DOF)\n           └─────────┘\n\nA↑ + B↑ (même sens)    = PITCH (flexion/extension)\nA↑ + B↓ (sens opposé) = ROLL  (inversion/éversion)\n```\n\n| Paramètre | Valeur |\n| :--- | :--- |\n| **Moteurs** | 2× RS-02 (ou RS-03 pour plus de couple) haut dans le tibia |\n| **Bielles** | 2× tiges filetées M4 inox (60-100mm) + 4× rod end bearings M4 |\n| **Masse distale** | **~0g** (seules les bielles sont en bas, ~20g/bielle) |\n| **Couple Pitch effectif** | ~34 N.m (2× RS-02) ou ~120 N.m (2× RS-03) |\n| **Couple Roll effectif** | ~17 N.m (2× RS-02) ou ~60 N.m (2× RS-03) |\n| **Complexité** | ⭐⭐⭐⭐ Très élevée — cinématique parallèle inverse |\n| **Coût mécanique** | ~$20-50 (bielles RC + brackets imprimés/CNC) |\n\n**Implémentations industrielles :**\n\n| Robot | Type de bielle | Moteur | Particularité |\n| :--- | :--- | :--- | :--- |\n| **Unitree G1** | Bielles rotatives parallèles | QDD propriétaire | Mode AB (moteurs) / PR (Pitch-Roll), cinématique inverse intégrée |\n| **LOLA (TUM)** | Vis à billes (ball-screw) linéaires | Drives linéaires | 2 vis actionnent le pied — même sens = Pitch, sens inverse = Roll |\n| **Tesla Optimus** | SPU (Spherical-Prismatic-Universal) | Actionneurs linéaires custom | Universal joint + prismatic drives, couple >180 N.m (brevet WO2024072984A1) |\n\n> [!WARNING]\n> **Fourier GR-2 : marche arrière sur le parallèle.** En septembre 2024, Fourier Intelligence a **abandonné l'architecture parallèle** au profit du série pour le GR-2. Raisons officielles :\n> - Simplification du **système de contrôle** (cinématique inverse complexe éliminée)\n> - **Débogage** et maintenance facilités  \n> - **Coûts de fabrication** réduits\n> - Meilleur **transfert sim-to-real** (simulation → robot physique)\n>\n> C'est un signal fort : le parallèle n'est optimal que si l'on maîtrise parfaitement la cinématique et si les performances l'exigent. Pour un premier prototype, la configuration série ou hybride est plus prudente.\n\n### 4.3 Composants Pré-Assemblés pour Solution Parallèle (Sourcing)\n\nPour une solution 2-bielles, les composants RC hélicoptère/drone sont **directement réutilisables** :\n\n| Composant | Référence Type | Source | Prix | Note |\n| :--- | :--- | :--- | :---: | :--- |\n| **Rod end bearing M4** (rotule femelle) | Fisheye ball bearing SA4T/K | AliExpress, eBay | **$3-8 / 10pcs** | Acier roulements, ±15° angle |\n| **Tige filetée M4 inox** (bielle) | Tige M4 × 80mm | Quincaillerie | **$2-5** | Longueur réglable (écrou) |\n| **Kit pushrod RC complet** | RJX Hobby M3/M4 swashplate linkage | RJXHobby, AliExpress | **$5-12 / kit** | Tige + 2 rod ends pré-assemblés |\n| **Rod end M4 double filetage** (CW+CCW) | Pour longueur réglable sans démontage | AliExpress | **$5-10 / lot** | Comme les tirants de direction auto |\n| **Rotule industrielle** (Heim joint M4) | M4 male/female rod end | RS Components, Misumi | **$3-8 / pièce** | Qualité supérieure |\n\n> [!NOTE]\n> **Il n'existe PAS de kit \"2-bielles parallèle pour cheville robot\" pré-assemblé clé en main.** Mais les composants individuels (rod ends + tiges) issus du monde RC hélicoptère (plateau cyclique / swashplate) sont **identiques** mécaniquement et coûtent ~$15-25 pour équiper les 2 chevilles. L'assemblage final nécessite un bracket custom (impression 3D ou CNC).\n\n**BOM Estimé — Kit 2 bielles par cheville :**\n\n| Pièce | Qté (×2 chevilles) | Coût |\n| :--- | :---: | :---: |\n| Rod end bearing M4 (rotules) | 8 (4 par cheville) | ~$8 |\n| Tiges filetées M4 × 80mm inox | 4 | ~$5 |\n| Écrous M4 frein (nylstop) | 8 | ~$2 |\n| Brackets pivot (impression 3D PA12-CF) | 4 (2 haut tibia + 2 bas pied) | ~$15 (filament) |\n| Visserie M4 × 12mm inox | 16 | ~$3 |\n| **Total bielles** | | **~$33** |\n\n### 4.4 Impact sur la Marche et la Course\n\n| Critère | A. Tirant+Roll (V1) | B. Tirant seul (K-Bot) | C. Tirant RS-03 (V2) | D. Parallèle (V3) |\n| :--- | :---: | :---: | :---: | :---: |\n| **Masse distale (par jambe)** | 310g | ~0g | **310g** | ~0g |\n| **Couple Pitch effectif** | ~34 N.m | ~34 N.m | **~120 N.m** ⚡ | ~34-120 N.m |\n| **Couple Roll** | 14 N.m (RS-00) | ❌ | 14 N.m (RS-00) | ~60 N.m |\n| **Marche lente (<1 km/h)** | ✅ **OK** (Déroulé pied) | ✅ **OK** (Déroulé pied) | ✅ **Excellent** | ✅ Optimal |\n| **Marche normale (2-3 km/h)** | ❌ Couple insuffisant | ❌ (pas de Roll) | ✅ **Excellent** | ✅ Optimal |\n| **Marche rapide (3-4 km/h)** | ❌ Couple insuffisant | ❌ (pas de Roll) | ⚠️ Roll au pic | ✅ Bon |\n| **Course (>5 km/h)** | ❌ Trop d'inertie | ❌ (1 DOF) | ⚠️ **Possible** | ✅ Optimal |\n| **Terrain irrégulier** | ✅ (2 DOF) | ❌ (1 DOF) | ✅ (2 DOF) | ✅ (2 DOF) |\n| **Simplicité montage** | ⭐ Trivial | ⭐⭐ Moyen | ⭐⭐⭐ Élevé | ⭐⭐⭐⭐ Très élevé |\n| **Coût mécanique** | $0 | $20-50 | $50-100 | $33-100 |\n\n#### Analyse Détaillée de l'Impact Inertiel\n\n```\nMoment d'inertie de la jambe pendant le balancement (swing phase) :\n\nI = Σ(m × r²) où r = distance au pivot (hanche)\n\n                    Masse distale    r (dist. hanche)    Contribution I\nD-Bot V1 (tirant):  310g             ~0.70 m             152 g.m²  ← RS-00 seul en bas\nV2 (RS-03 tirant):  310g             ~0.70 m             152 g.m²  ← Même (RS-00 seul en bas)\nV3 (parallèle):    ~40g             ~0.70 m              ~20 g.m²  ← Optimal\n\n→ V1 et V2 ont la même masse distale (~310g = RS-00 Roll seul) car le Pitch est toujours en haut du tibia.\n→ Le Parallèle (V3) élimine tout moteur à la cheville.\n```\n\n**Conséquences concrètes de l'inertie :**\n- **Marche** : Plus l'inertie est basse, plus la jambe balance vite → pas plus rapides, moins de couple requis aux hanches.\n- **Course** : À >5 km/h, la fréquence de pas monte à ~3 Hz. Avec seulement 310g en bout de jambe (RS-00 Roll), l'inertie oscillante est déjà faible. Le V3 parallèle l'élimine quasi-totalement → la course devient **envisageable**.\n- **Chutes** : Moins d'inertie = réactions de rattrapage plus rapides.\n\n### 4.5 Recommandation Évolutive\n\n| Phase | Config Cheville | Moteurs | Coût additionnel | Pourquoi |\n| :--- | :--- | :--- | :---: | :--- |\n| **V1** (prototype) | **A. Tirant K-Bot** + RS-00 Roll | RS-02 Pitch (tirant) + RS-00 Roll | $0 | Architecture K-Bot éprouvée, **suffisante pour marche V1** |\n| **V2** (optimisation) | **C. Tirant RS-06** + RS-00 Roll | RS-02 → **RS-06** Pitch (tirant) | ~$70 (RS-06 - RS-02) | Couple Pitch ×2 (~72 N.m), **Sweet Spot** poids/couple |\n| **V3** (performances) | **D. Parallèle** 2 bielles | 2× RS-06 (ou RS-03) + bielles | ~$33 bielles | Inertie ~0g, couple Roll par différentiel |\n\n> [!TIP]\n> **Progression V1 → V2** : Le **RS-06** (36 N.m) est l'upgrade parfait. Il double le couple du RS-02 (72 N.m effectif) pour seulement +75g, permettant la marche rapide et l'absorption des chocs. Le RS-03 (V3) est réservé aux usages extrêmes.\n>\n> **Progression V2 → V3** : Remplace le tirant + RS-00 par 2 bielles parallèles rotulées. Les 2 moteurs (RS-02 ou RS-03) en parallèle donnent Pitch + Roll par coordination/différentiel. Aucun moteur à la cheville = inertie minimale.\n\n", "Conception: 15_Analyse_Biomecanique": "# 15 - Analyse Biomécanique & Propositions d'Évolution\n\nCe document analyse les capacités mécaniques du D-Bot dans sa configuration actuelle et propose des évolutions pour améliorer ses performances en marche, marche rapide et portage de charges.\n\n## 1. Paramètres du Robot (Configuration Actuelle)\n\n### Caractéristiques Physiques\n\n| Paramètre | Valeur |\n| :--- | :--- |\n| **Hauteur** | 1.40 m (K-Bot standard) |\n| **Masse totale (estimée)** | ~34 kg (K-Bot) / ~36 kg (D-Bot avec tête) |\n| **Masse moteurs seuls** | 15.77 kg (K-Bot) + 0.38 kg (cou D-Bot) = 16.15 kg |\n| **Charge utile bras (spec)** | ~10 kg (total 2 bras) |\n| **Autonomie** | ~4h (batterie LiPo échangeable) |\n| **DOF** | 20 (K-Bot) / 24 (D-Bot Performance) |\n\n### Longueurs de Segments Estimées (robot 1.40m)\n\n| Segment | Longueur | Masse Estimée |\n| :--- | :---: | :---: |\n| Cuisse (hanche → genou) | ~35 cm | ~4 kg |\n| Tibia (genou → cheville) | ~35 cm | ~3 kg |\n| Bras (épaule → coude) | ~25 cm | ~2.5 kg |\n| Avant-bras (coude → poignet) | ~22 cm | ~1.5 kg |\n| Torse | ~40 cm | ~12 kg |\n| Tête D-Bot | ~15 cm | ~2 kg |\n\n---\n\n## 2. Analyse des Capacités de Marche\n\n### 2.1 Marche Lente (< 1 km/h)\n\n#### Couples Requis (Analyse Statique)\n\nEn phase d'appui simple, un seul genou supporte toute la masse du robot :\n\n| Articulation | Couple Disponible (Pic) | Couple Requis (Estimé) | Marge | Verdict |\n| :--- | :---: | :---: | :---: | :---: |\n| **Hanche Pitch** (RS-04) | 120 N.m | ~50 N.m | **+140%** | ✅ Confortable |\n| **Hanche Roll** (RS-03) | 60 N.m | ~25 N.m | **+140%** | ✅ Confortable |\n| **Hanche Yaw** (RS-03) | 60 N.m | ~15 N.m | **+300%** | ✅ Surplus |\n| **Genou Pitch** (RS-04) | 120 N.m | ~60 N.m | **+100%** | ✅ OK |\n| **Cheville Pitch** (RS-02) | 17 N.m (×2 tirant = 34) | ~34 N.m | **≈0%** | ⚠️ **VIABLE (Limite)** |\n\n> [!WARNING]\n> **Verdict Révisé : La CHEVILLE est viable mais limite.**\n> Avec un bras de levier de **0.10 m** (pointe du pied), le couple requis est de **~33.4 N.m**.\n> Le D-Bot V1 (34 N.m) couvre juste ce besoin statique.\n> **Conséquence** : La marche lente est possible avec déroulé du pied, mais la marge pour les accélérations brutales (marche rapide) est faible. Le centre de pression devra rester maîtrisé.\n\n> [!NOTE]\n> **⬆️ Ce calcul concerne le mécanisme tirant**. Le ratio ~2:1 du K-Bot est essentiel ici. Sans lui (direct drive 17 N.m), le robot tomberait. L'upgrade V2 (RS-03) reste pertinent pour gagner de la marge de sécurité et permettre la course.\n\n#### Explication du Calcul Cheville\n```\nCouple cheville = Masse × g × Bras de Levier (Axe → Pointe)\n                = 34 kg × 9.81 m/s² × 0.10 m (Pied 10 cm)\n                ≈ 33.4 N.m minimum statique\n                ≈ 50 N.m en dynamique (marche rapide)\n```\n\n**Conclusion marche lente** : Le D-Bot V1 (RS-02) est **capable de marcher**. Le couple de 34 N.m suffit pour l'équilibre statique sur la pointe des pieds (33.4 N.m). C'est une excellente nouvelle pour la Phase 4 V1. La stratégie \"Pied Court\" a payé.\n\n> [!TIP]\n> **Compromis de Conception : Longueur du Pied**\n> *   **Pied Court** = Bras de levier réduit = **Moins de couple moteur requis**. (C'est préférable pour les moteurs faibles).\n> *   **Pied Long** = Grand polygone de sustentation = **Meilleure stabilité**.\n>\n> Pour le D-Bot V1, réduire la distance \"Axe ↔ Pointe\" (ex: 12-15 cm) aiderait le RS-02 à supporter la charge, au prix d'une stabilité statique réduite.\n\n\n---\n\n### 2.2 Marche Rapide (2-3 km/h)\n\n| Paramètre | Requis | Disponible | Verdict |\n| :--- | :---: | :---: | :---: |\n| Couple genou dynamique | ~80 N.m | 120 N.m (RS-04) | ✅ Suffisant |\n| Couple hanche dynamique | ~70 N.m | 120 N.m (RS-04) | ✅ Suffisant |\n| Couple cheville dynamique | ~50 N.m | ~34 N.m (RS-02 + tirant) | ⚠️ **LIMITÉ** |\n\n> [!NOTE]\n> Ces estimations sont pour une marche à **~2-3 km/h**.\n\n> [!WARNING]\n> **La marche rapide est quasi-impossible** dans la configuration K-Bot de base à cause des chevilles RS-02. Le robot ne peut pas se propulser efficacement. Il est limité à un mode \"shuffle\" < 1 km/h.\n\n> [!NOTE]\n> **⬆️ Config K-Bot de base analysée ici.** Le D-Bot conserve le RS-02 avec **tirant (~34 N.m effectif)**. Pour la marche lente (<2 km/h), c'est suffisant. La marche rapide nécessite une optimisation du tirant ou un upgrade RS-03 (V2).\n\n---\n\n### 2.3 Course (> 4 km/h)\n\nLa course est **impossible** dans la configuration K-Bot de base :\n- Les chevilles (RS-02 + tirant) ont ~34 N.m vs ~100 N.m requis pour la course pour la phase de vol\n- Les genoux (RS-04, 200 RPM) sont trop lents pour la fréquence de pas requise\n- Pas de compliance élastique dans le système actuel\n\n> [!NOTE]\n> **⬆️ Config K-Bot de base.** Avec le RS-02 + tirant (~34 N.m), la course reste hors portée V1. Il faudrait un upgrade RS-03 (V2) + mécanismes SEA (Series Elastic Actuator) — voir section 10.\n\n---\n\n## 3. Analyse de la Capacité de Portage\n\n### 3.1 Portage à Bout de Bras (Bras Tendu Horizontal)\n\nC'est le **cas le plus défavorable** car le bras-de-levier est maximal.\n\n#### Modèle Mécanique (Bras Tendu)\n```\nBras total ≈ 47 cm (25 cm bras + 22 cm avant-bras)\n\nCouple épaule = (Masse_bras × g × L/2) + (Masse_charge × g × L_total)\n```\n\n| Charge Portée | Couple Épaule Requis | Couple Dispo (RS-03) | Verdict |\n| :---: | :---: | :---: | :---: |\n| **0 kg** (bras seul) | ~10 N.m | 60 N.m pic / 20 N.m nom. | ✅ OK |\n| **1 kg** | ~15 N.m | 60 / 20 N.m | ✅ OK |\n| **2 kg** | ~19 N.m | 60 / 20 N.m | ⚠️ Limite nominale |\n| **3 kg** | ~24 N.m | 60 / 20 N.m | ⚠️ Au-dessus nominal |\n| **5 kg** | ~33 N.m | 60 / 20 N.m | ❌ > 1.5× nominal |\n| **10 kg** | ~55 N.m | 60 / 20 N.m | ❌ Presque pic, **dangereux** |\n\n> [!IMPORTANT]\n> **Limite de portage à bout de bras** : ~**2 kg en continu** (couple nominal) et ~**5 kg momentanément** (pic). Les 10 kg annoncés par K-Scale ne sont possibles que **bras plié** (coude fléchi à 90°) ce qui divise le bras-de-levier par 2.\n\n### 3.2 Portage Bras Plié (Coude 90°)\n\n| Charge Portée | Couple Épaule Requis | Couple Coude Requis | Verdict |\n| :---: | :---: | :---: | :---: |\n| **5 kg** | ~24 N.m | ~11 N.m | ✅ Faisable |\n| **10 kg** | ~38 N.m | ~22 N.m | ⚠️ Coude au pic (RS-02: 17 N.m) |\n\n> [!WARNING]\n> **Le coude (RS-02, 17 N.m pic) est un goulot d'étranglement** pour le portage lourd. Porter 10 kg bras plié nécessite ~22 N.m au coude, ce qui dépasse le pic du RS-02.\n\n---\n\n## 4. Synthèse des Faiblesses\n\n| Zone | Moteur Actuel | Problème | Sévérité |\n| :--- | :---: | :--- | :---: |\n| **Cheville** | RS-02 tirant (34 N.m) | Suffisant statique (33 N.m) | ✅ **OK (Marche)** |\n| **Coude** | RS-02 (17 N.m) | Limite pour portage > 5 kg | 🟡 **MOYEN** |\n| **Épaule Pitch** | RS-03 (60 N.m) | Limite pour portage > 3 kg bras tendu | 🟡 **MOYEN** |\n| **Cheville Roll** | Aucun | Pas de DOF d'adaptation au sol | 🟠 **IMPORTANT** |\n\n---\n\n## 5. Propositions d'Évolution\n\n### Option A : Upgrade RobStride (Restant dans l'écosystème)\n\n#### A1. Chevilles Pitch : upgrade V2 envisageable (RS-02 → RS-03 avec tirant)\n\n| Paramètre | Avant (RS-02) | Après (RS-03) | Gain |\n| :--- | :---: | :---: | :---: |\n| Couple Pic | ~34 N.m | 120 N.m | **×3.5** |\n| Couple Nominal | 6 N.m | 20 N.m | **×3.3** |\n| Poids | 405g | 880g | +475g/cheville |\n| Surpoids total | - | +950g (2 chevilles) | |\n| Prix unitaire | $160 | $250 | +$180 total |\n\n**Verdict** : ✅ **RECOMMANDÉ**. Résout le problème critique de propulsion. +950g est acceptable sur des chevilles (position basse = faible impact inertiel).\n\n#### A2. Épaules RS-03 → RS-04\n\n| Paramètre | Avant (RS-03) | Après (RS-04) | Gain |\n| :--- | :---: | :---: | :---: |\n| Couple Pic | 60 N.m | 120 N.m | **×2** |\n| Couple Nominal | 20 N.m | 40 N.m | **×2** |\n| Poids | 880g | 1420g | +540g/épaule |\n| Surpoids total | - | +2160g (4 épaules) | |\n| Prix unitaire | $250 | $280 | +$120 total |\n| Portage bras tendu | ~2 kg continu | ~5 kg continu | **×2.5** |\n\n**Verdict** : ⚠️ **À ÉVALUER**. Gain de portage significatif mais +2.16 kg en hauteur (épaules) = fort impact sur le centre de gravité et l'inertie. Recommandé uniquement si le portage lourd est une priorité.\n\n#### A3. Coudes RS-02 → RS-06\n\n| Paramètre | Avant (RS-02) | Après (RS-06) | Gain |\n| :--- | :---: | :---: | :---: |\n| Couple Pic | 17 N.m | 36 N.m | **×2.1** |\n| Couple Nominal | 6 N.m | 11 N.m | **×1.8** |\n| Poids | 405g | 621g | +216g/coude |\n| Surpoids total | - | +432g (2 coudes) | |\n| Prix unitaire | $160 | $230 | +$140 total |\n| Portage bras plié | ~5 kg pic | ~10 kg pic | **×2** |\n\n**Verdict** : ✅ **RECOMMANDÉ** si portage important. Le RS-06 est un excellent intermédiaire : double le couple au coude pour seulement +216g. Compatible dimensionnellement (88mm vs 78.5mm, à vérifier clearance).\n\n---\n\n### Option B : Moteurs Alternatifs (Hors RobStride)\n\n#### B1. CubeMars AK10-9 V3 (pour Épaules)\n\n| Paramètre | RS-03 (actuel) | AK10-9 V3 | Comparaison |\n| :--- | :---: | :---: | :---: |\n| Couple Pic | 60 N.m | 53 N.m | -12% |\n| Couple Nominal | 20 N.m | 18 N.m | -10% |\n| Poids | 880g | 940g | +7% |\n| Densité couple | 68 N.m/kg | 56 N.m/kg | -18% |\n| Prix | ~$250 | ~$860-970 | **×3.5** |\n\n**Verdict** : ❌ **NON RECOMMANDÉ**. Moins performant et 3-4× plus cher que le RS-03. Le RobStride est supérieur sur tous les critères.\n\n#### B2. CubeMars AK80-9 V3 (pour Chevilles)\n\n| Paramètre | RS-02 (actuel) | AK80-9 V3 | Comparaison |\n| :--- | :---: | :---: | :---: |\n| Couple Pic | 17 N.m | 22 N.m | +29% |\n| Couple Nominal | 6 N.m | 9 N.m | +50% |\n| Poids | 405g | 480g | +19% |\n| Prix | ~$160 | ~$480-580 | **×3** |\n\n**Verdict** : ⚠️ **PEU UTILE**. Le RS-02 suffit pour la marche. Gain marginal. des chevilles (besoin minimum ~67 N.m). Et coûte 3× plus cher qu'un RS-02. Passer à un RS-03 avec tirant (V2) est meilleur et moins cher.\n\n#### B3. MyActuator RMD-X10 V3 (pour Chevilles)\n\n| Paramètre | RS-02 (actuel) | RMD-X10 V3 | Comparaison |\n| :--- | :---: | :---: | :---: |\n| Couple Pic | 17 N.m | 50 N.m | **+194%** |\n| Couple Nominal | 6 N.m | 12 N.m | +100% |\n| Poids | 405g | 1150g | +184% |\n| Prix | ~$160 | ~$890 | **×5.5** |\n\n**Verdict** : ⚠️ **POSSIBLE mais coûteux**. Couple (50 N.m pic) confortable vs 33 N.m requis, très lourd (1.15 kg) et très cher ($890). Le RS-03 RobStride avec tirant ferait mieux (60 N.m × 2 = 120 N.m effectif, $250).\n\n#### B4. Comparatif Stratégique Cheville Pitch (RS-02 vs RS-06 vs RS-03)\n\nAvec le mécanisme de tirant (ratio ~2:1) :\n\n| Moteur | Couple Moteur | Couple Effectif | Poids | Coût | Marge (vs 33 N.m) | Verdict |\n| :--- | :---: | :---: | :---: | :---: | :---: | :--- |\n| **RS-02** (V1) | 17 N.m | **~34 N.m** | 405g | $160 | +2% | ✅ **Viable (Limite)**. Suffisant pour marche <2km/h. |\n| **RS-06** (Upgrade) | 36 N.m | **~72 N.m** | 480g | $230 | **+115%** | ⭐ **IDEAL**. Couple doublé pour seulement +75g ! |\n| **RS-03** (V3) | 60 N.m | **~120 N.m** | 880g | $250 | +260% | **Puissant mais Lourd** (+475g). Pour sauts/course. |\n\n> [!TIP]\n> **Le RS-06 est le \"Sweet Spot\"**. Il offre une marge de sécurité énorme (>100%) pour la marche dynamique sans l'inconvénient de masse du RS-03. C'est le meilleur choix pour une **V2 équilibrée** à la place du RS-03.\n\n---\n\n### Option C : Configuration \"D-Bot Performance\" (Recommandée)\n\nCombinaison optimale des upgrades identifiés :\n\n| Zone | Avant | Après | Changement | Surcoût |\n| :--- | :---: | :---: | :--- | :---: |\n| **Cheville Pitch** | 2× RS-02 (tirant) | **V2 : 2× RS-03** (tirant) | ~34→~120 N.m (×3.5) | +$180 |\n| **Coude** | 2× RS-02 | **2× RS-06** | 17→36 N.m (×2.1) | +$140 |\n| **Épaule Yaw** | 2× RS-02 | 2× RS-02 | Inchangé | $0 |\n| Reste | Inchangé | Inchangé | Inchangé | $0 |\n\n#### Bilan de l'Option C\n\n| Impact | Détail |\n| :--- | :--- |\n| **Surpoids** | +950g (chevilles) +432g (coudes) = **+1.38 kg** → 37.4 kg total |\n| **Surcoût** | +$320 total |\n| **Marche** | Chevilles 60 N.m → **Marche stable et propulsée** ✅ |\n| **Marche rapide** | 2-3 km/h devient **réalisable** ✅ |\n| **Portage bras tendu** | 2 kg → **3 kg** (coude amélioré) |\n| **Portage bras plié** | 5 kg → **10 kg** (coude 36 N.m) ✅ |\n| **Compatibilité** | Mêmes protocoles (CAN), mêmes connecteurs |\n\n### Option D : Configuration \"D-Bot Maximal\" (Performance Maximale)\n\nPour un portage lourd et une marche dynamique :\n\n| Zone | Avant | Après | Changement | Surcoût |\n| :--- | :---: | :---: | :--- | :---: |\n| **Cheville Pitch** | 2× RS-02 (tirant) | **2× RS-03** (tirant) | ~34→~120 N.m (×3.5) | +$180 |\n| **Épaule Pitch** | 2× RS-03 | **2× RS-04** | 60→120 N.m (×2) | +$60 |\n| **Épaule Roll** | 2× RS-03 | **2× RS-04** | 60→120 N.m (×2) | +$60 |\n| **Coude** | 2× RS-02 | **2× RS-06** | 17→36 N.m (×2.1) | +$140 |\n\n#### Bilan de l'Option D\n\n| Impact | Détail |\n| :--- | :--- |\n| **Surpoids** | +950g +2160g +432g = **+3.54 kg** → 39.5 kg total |\n| **Surcoût** | +$440 total |\n| **Marche** | Chevilles 60 N.m → **Marche stable** ✅ |\n| **Portage bras tendu** | 2 kg → **5 kg continu** ✅ |\n| **Portage bras plié** | 5 kg → **15+ kg théorique** ✅ |\n| **CdG** | Plus haut (+2.16 kg aux épaules) — **compensé par le Roll cheville** |\n\n> [!NOTE]\n> **Clarification sur l'impact CdG** : L'Option D ajoute 3.5 kg dont 2.16 kg aux épaules. Cela élève le CdG mais **l'ajout du Roll cheville (voir Section 7) compense largement** ce handicap en fournissant des corrections latérales rapides. **Les deux options C et D nécessitent un re-tuning des algorithmes de marche** (masse différente, nouveaux DOF, nouvelles limites de couple). La difficulté de re-tuning de l'Option D est seulement **marginalement supérieure** à celle de l'Option C. Le surcoût D vs C n'est que de +$120 et +1.35 kg.\n\n---\n\n## 6. Recommandation Finale (Initiale — voir Section 8 pour version révisée)\n\n### Analyse historique (avant ajout du Roll cheville)\n\n*Cette section reflète l'analyse initiale, **avant** la prise en compte du Roll cheville. La recommandation a évolué — voir Section 8 pour les configurations révisées et Section 9 pour le comparatif final.*\n\n**Raisonnement initial** : L'Option C était recommandée pour son rapport performance/impact. Cependant, l'ajout du Roll cheville dans les deux options change la donne :\n\n- **Les deux options nécessitent un re-tuning** des algorithmes de marche (c'est inévitable dès qu'on modifie la configuration moteur)\n- Le Roll cheville **compense le CdG plus haut** de l'Option D\n- Le surcoût D vs C n'est que de **+$120 et +1.35 kg** pour un gain de portage **considérable**\n\n### À retenir sur les moteurs alternatifs\n\nLes alternatives étudiées (CubeMars AK, MyActuator RMD) ne sont PAS compétitives face à RobStride pour ce projet :\n- **3 à 5× plus chers** à performances équivalentes\n- **Densité de couple inférieure** dans la plupart des cas\n- **Écosystème incompatible** (drivers différents, protocoles différents)\n- Le seul intérêt serait une **personnalisation extrême** ou un besoin de backdrivabilité supérieure (AK80-9)\n\n**RobStride offre le meilleur rapport couple/poids/prix** sur le marché des QDD en 2024-2025.\n\n---\n---\n\n## 7. ADDENDUM — Analyse du DOF Cheville Roll Manquant\n\n> *Ajouté suite à l'identification d'un problème structurel dans la configuration K-Bot standard.*\n\n### 7.1 Le Problème : 1 DOF Cheville vs 2 DOF\n\nLa configuration K-Bot standard n'a qu'**un seul DOF de cheville** (Pitch) — pas de Roll. Cela signifie que le pied ne peut que basculer avant/arrière, mais **pas se pencher latéralement**.\n\n| Config Cheville | K-Bot Actuel | Humain | Robots Avancés |\n| :--- | :---: | :---: | :---: |\n| **Pitch** (avant/arrière) | ✅ RS-02 | ✅ | ✅ |\n| **Roll** (latéral) | ❌ Absent | ✅ | ✅ (2 DOF standard) |\n| **Yaw** (rotation) | ❌ | ✅ (via hanche) | Rare |\n\n### 7.2 Pourquoi c'est un VRAI Problème\n\nLa recherche académique (IEEE, MDPI) confirme que l'absence de Roll cheville a des conséquences majeures :\n\n#### Impact sur la stabilité latérale\n\n```\nSans Roll cheville :\n┌─────────────────────────────────────┐\n│  Le robot ne peut PAS ajuster       │\n│  l'inclinaison latérale du pied.    │\n│                                     │\n│  → Le Centre de Pression (CoP)      │\n│    ne peut se déplacer que sur       │\n│    l'axe avant/arrière du pied.     │\n│                                     │\n│  → Stabilité latérale = uniquement  │\n│    via les hanches (Roll + Yaw)     │\n│    = mouvements amples et lents.    │\n└─────────────────────────────────────┘\n\nAvec Roll cheville :\n┌─────────────────────────────────────┐\n│  Le pied s'adapte au sol et         │\n│  le CoP se déplace librement        │\n│  sur TOUTE la surface du pied.      │\n│                                     │\n│  → Corrections rapides et fines     │\n│  → Consommation énergie réduite     │\n│  → Marche sur terrain irrégulier    │\n└─────────────────────────────────────┘\n```\n\n#### Conséquences Concrètes\n\n| Situation | Sans Roll Cheville | Avec Roll Cheville |\n| :--- | :--- | :--- |\n| **Sol plat** | ⚠️ Fonctionnel mais corrections par hanches uniquement | ✅ Corrections fines et rapides |\n| **Sol incliné latéralement** | ❌ Pied ne s'adapte pas, risque ch
