ire.\n\n## 4. Paramètres Slicer (QIDI Print / Orca)\nIl n'y a pas de case \"Tungstène\". Modifiez vos profils existants :\n\n| Paramètre | Ajustement vs Acier Trempé | Pourquoi ? |\n| :--- | :--- | :--- |\n| **Température** | **-5°C à -10°C** | Le tungstène conduit mieux la chaleur. |\n| **Flow Ratio (Débit)** | **-1% à -2%** | Ça glisse mieux ! Surveillez la sur-extrusion. |\n| **Volumetric Speed** | **+2 à +3 mm³/s** | Permet d'imprimer plus vite sans sous-extrusion. |\n\n**Exemple PA12-CF** : Passez de 300°C à **290°C**.\n\n## 5.## Maintenance et Sécurité Électrique (Audit Fév. 2026)\n\n### Maintenance Rapide\n- **Tête/Cou** : L'utilisation de borniers **WAGO 221-413 (3 entrées)** ou **415 (5 entrées)** est recommandée pour les liaisons LiDAR et moteurs de cou. Cela permet de remplacer un capteur en 30 secondes sans soudure.\n- **Sauvegarde** : Toujours créer un **clone de la carte SD** Jetson sur un SSD externe (ex: Hynix P310) avant chaque mise à jour majeure (`sudo dd if=/dev/sdX of=backup.img`).\n\n### Sécurité Alimentation Wanptek\nLe modèle DPS605U nécessite une procédure stricte car il ne possède pas de bouton \"Output ON/OFF\" physique :\n1.  Allumer l'alimentation à vide.\n2.  Vérifier la tension (**24.0V** ou **48.0V**).\n3.  Calculer la limite (ex: 1A). Court-circuiter les pinces pour régler le courant si besoin.\n4.  Activer le mode **OCP** (Overcurrent Protection) : l'alimentation coupera d'elle-même en cas d'appel de courant anormal (branchement inversé).\n5.  Brancher seulement ensuite le moteur RobStride.\n*   **Nettoyage** : Le plastique n'adhère pas au tungstène. Un coup de brosse laiton à chaud suffit.\n*   **Durée de vie** : Virtuellement infinie pour ce projet.\n\n> **Conseil D-Bot** : Installez-la **AVANT** de lancer la production massive des pièces critiques (Hanches RS-04, Fémurs) pour garantir une extrusion constante sur 40h+ d'impression.\n", "Fabrication: 12_Guide_Parties_Metal_CNC": "# Guide Préparation Fichiers CNC\n\nCe guide détaille la procédure pour commander les pièces structurelles en aluminium (Alu 6061) auprès de services d'usinage en ligne (JLCPCB, PCBWay, Xometry).\n\n## 1. Spécifications Techniques\n*   **Matériau** : **Aluminium 6061-T6** (Standard aérospatial, bon compromis résistance/poids).\n*   **Finition de surface** : **\"As Machined\"** (Brut d'usinage).\n    *   *Conseil* : Ne demandez pas de \"Bead Blasting\" (Microbillage) ou d'Anodisation pour les prototypes (Phase 2). Cela réduit le coût de 20% à 30%.\n*   **Tolérances** : Standard **ISO 2768-m** (+/- 0.1mm) suffisant pour le D-Bot.\n\n## 2. Préparation des Fichiers 3D\n*   **Format** : Exportez uniquement en **STEP (.stp / .step)**. Le STL n'est pas accepté pour l'usinage CNC.\n*   **Nettoyage CAO** :\n    *   Supprimez tous les textes gravés, logos ou décorations en relief. L'usinage de ces détails minuscules explose le temps machine et le prix.\n    *   Vérifiez les **rayons internes**. Un outil de fraiseuse est rond. Évitez les angles internes à 90° parfaits, mettez un rayon de 2mm ou 3mm là où c'est possible.\n\n## 3. Points de Contrôle D-Bot\n### Alésages (Trous précis)\n*   **Dowel Pins** : Les trous pour les goupilles de centrage (3mm et 4mm) doivent être précis (H7 si possible, sinon standard).\n*   **Interfaces Moteurs** : Les surfaces de contact avec les moteurs Robstride doivent être parfaitement planes pour dissiper la chaleur du moteur vers le châssis.\n\n## 4. Astuces de Commande\n*   **Regroupement** : Commandez toutes les pièces d'un coup (Bras Droit + Gauche).\n*   **Symétrie** : Vérifiez si vos pièces sont identiques (x2) ou symétriques (Miroir). En CNC, une pièce miroir est une référence différente.\n*   **Taraudage** : Indiquez clairement sur les plans 2D (PDF associés) quels trous doivent être taraudés (M3, M4). Sinon, ils seront livrés en trous lisses.\n", "Securite: 11_Guide_SensiEDGE_Watchdog": "# 11 - Guide IMU & Watchdog (Sécurité & Équilibre)\n\nCe guide détaille l'intégration de l'**IMU torse** (BMI270 Add-on Board) et la mise en place de l'architecture de **Sécurité Active** (Watchdog + Power Management) pilotée par la Sony Spresense.\n\n> [!WARNING]\n> **Migration SensiEDGE → BMI270** : La carte SensiEDGE CommonSense initialement prévue **n'est pas disponible au grand public** (réservée aux professionnels). Ce guide a été mis à jour pour utiliser le **BMI270 Add-on Board** (Switch Science) comme IMU principale.\n\n## 1. Matériel : IMU Torse\n\n### Option Recommandée : BMI270 Add-on Board (Switch Science)\n*   **Connexion** : S'enfiche sur les headers I2C/SPI de la **Spresense Extension Board**.\n*   **Capteur** : **Bosch BMI270** — Accéléromètre + Gyroscope 6 axes.\n*   **Fréquence** : Jusqu'à **416 Hz** (accéléromètre) / **6.4 kHz** (gyroscope).\n*   **Rôle primaire** : **IMU d'équilibre** du robot — contrôle du centre de masse en temps réel.\n*   **Rôle secondaire** : Détection de chute quand la Jetson est éteinte (Watchdog).\n*   **Bibliothèque Arduino** : `Arduino_BMI270_BMM150` ou `BMI270-Sensor-API`.\n\n### Alternative Haute Précision : Sony Spresense Multi-IMU Add-on Board\n*   **Sortie** : Février 2025.\n*   **Principe** : 16 MEMS IMUs fusionnées pour une précision comparable aux **gyroscopes à fibre optique (FOG)**.\n*   **Quand l'utiliser** : Si la marche dynamique sur terrain complexe nécessite une précision angulaire extrême.\n*   **Interface** : SPI.\n\n### ~~SensiEDGE CommonSense~~ (Indisponible)\n*   ⚠️ **Non disponible au grand public** — réservée aux clients professionnels.\n*   Contenait : IMU (LSM6DSOX), Magnétomètre (LIS2MDL), Temp/Humidité (HTS221), Pression (LPS22HH), Qualité d'air (SGP40).\n*   Les capteurs environnementaux ne sont **pas critiques** pour le prototype V1. Si nécessaire, ajouter des thermistances ($1) sur les moteurs RS-04.\n\n### Montage Mécanique\nL'empilement (Stack) se fait verticalement dans le torse :\n1.  **Base** : Spresense Extension Board (Arduino form factor).\n2.  **Milieu** : Spresense Main Board.\n3.  **Haut** : **BMI270 Add-on Board** (se connecte sur les headers I2C/SPI).\n\n---\n\n## 2. Architecture \"Power Manager\" (Veille & Réveil)\nLa Spresense est le seul composant \"Always-On\" du robot. Elle contrôle l'alimentation de puissance (48V) via un **MOSFET**.\n\n### Schéma de Câblage (Protection 13S NMC)\n*   **Entrée Batterie** : 13S NMC 21700 (46.8V Nominal / 54.6V Max).\n*   **Pont Diviseur (Surveillance Tension)** :\n    *   Connecté à la **Pin A0** de la Spresense.\n    *   **R1** (Côté Batterie) : **150 kΩ**\n    *   **R2** (Côté Masse) : **10 kΩ**\n    *   *Ratio* : 55V en entrée donne ~3.44V en lecture (Compatible 3.3V avec marge).\n*   **Commande Puissance (MOSFET)** :\n    *   Connecté à la **Pin D13**.\n    *   Composant recommandé : **Infineon BTS50085** (Smart High-Side Switch) ou Module MOSFET 100V opto-isolé.\n    *   Rôle : Coupe physiquement l'alimentation de la Jetson et des Moteurs RobStride.\n*   **Heartbeat (Watchdog)** :\n    *   Connecté à la **Pin D12**.\n    *   Signal : La Jetson envoie une impulsion \"Vivant\" toutes les 100ms.\n\n---\n\n## 3. Code Spresense (C++)\nVoici le code complet pour gérer la sécurité, la batterie et le réveil.\n\n### Gestionnaire d'Alimentation & Watchdog\nCe code surveille la batterie (protection décharge profonde) et la Jetson (anti-freeze).\n\n```cpp\n/*\n * D-Bot Power Manager & Watchdog\n * Matériel : Sony Spresense + BMI270 Add-on (IMU Équilibre)\n */\n\n#include <RTC.h> // Pour la gestion du temps\n\nconst int PIN_MOSFET = 13;    // Commande du Relais/MOSFET Puissance\nconst int PIN_HEARTBEAT = 12; // Entrée signal vie Jetson\nconst int PIN_WAKEUP = 11;    // Bouton de Test (ou Trigger Vocal)\nconst int PIN_BATTERY = A0;   // Pont diviseur\n\n// Paramètres Batterie 13S NMC (Sécurité)\nconst float R1 = 150000.0; \nconst float R2 = 10000.0;\nconst float VOLTAGE_THRESHOLD = 39.0; // Seuil critique (3.0V / cellule × 13S)\n\n// Paramètres Watchdog\nunsigned long lastHeartbeat = 0;\nconst unsigned long WATCHDOG_TIMEOUT = 5000; // 5 secondes sans signal = Crash\nbool isRobotAwake = false;\n\n// Lecture sécurisée de la tension batterie\nfloat readBatteryVoltage() {\n  int raw = analogRead(PIN_BATTERY);\n  // Conversion ADC (Ref 3.3V ou 5V selon jumper Extension Board)\n  float vOut = (raw * 5.0) / 1023.0; // Assumes 5V ref on Extension Board ADC\n  float vBat = vOut * ((R1 + R2) / R2);\n  return vBat;\n}\n\nvoid setup() {\n  pinMode(PIN_MOSFET, OUTPUT);\n  pinMode(PIN_HEARTBEAT, INPUT);\n  pinMode(PIN_WAKEUP, INPUT_PULLUP);\n  \n  digitalWrite(PIN_MOSFET, LOW); // Sécurité : Tout éteint au démarrage\n  Serial.begin(115200);\n  Serial.println(\"--- D-Bot Security Sentinel Started ---\");\n}\n\nvoid loop() {\n  // 1. Surveillance Batterie (Priorité Absolue)\n  float voltage = readBatteryVoltage();\n  if (voltage < VOLTAGE_THRESHOLD && voltage > 5.0) { // >5V pour éviter faux positif si pas branché\n    Serial.print(\"CRITIQUE : Batterie faible (\");\n    Serial.print(voltage);\n    Serial.println(\"V). Arrêt d'urgence.\");\n    emergencyShutdown();\n    return; // On ne fait rien d'autre\n  }\n\n  // 2. Gestion du Réveil (Si éteint)\n  if (!isRobotAwake) {\n    if (digitalRead(PIN_WAKEUP) == LOW) { // Ou détection vocale\n       if (voltage > VOLTAGE_THRESHOLD) {\n          wakeupRobot();\n       } else {\n          Serial.println(\"Refus d'allumage : Batterie trop faible.\");\n       }\n    }\n  }\n\n  // 3. Watchdog (Si allumé)\n  if (isRobotAwake) {\n    if (digitalRead(PIN_HEARTBEAT) == HIGH) {\n      lastHeartbeat = millis();\n    }\n    \n    if (millis() - lastHeartbeat > WATCHDOG_TIMEOUT) {\n      Serial.println(\"ALERTE : Perte signal Jetson (Freeze). Reboot...\");\n      emergencyShutdown();\n      // Optionnel : Tentative de redémarrage après 5s\n    }\n  }\n  \n  delay(100);\n}\n\nvoid wakeupRobot() {\n  Serial.println(\"Réveil du D-Bot...\");\n  digitalWrite(PIN_MOSFET, HIGH);\n  isRobotAwake = true;\n  lastHeartbeat = millis(); \n  delay(2000); // Laisser le temps à l'alim de se stabiliser\n}\n\nvoid emergencyShutdown() {\n  digitalWrite(PIN_MOSFET, LOW);\n  isRobotAwake = false;\n  Serial.println(\"Système mis en sécurité.\");\n}\n```\n\n### Intégration des Capteurs SensiEDGE\nPour lire l'IMU BMI270 (remplacement de la SensiEDGE), utilisez :\n- **IMU** : `Arduino_BMI270_BMM150` (Bosch officiel) ou `BMI270-Sensor-API`\n\nSi des capteurs environnementaux sont ajoutés ultérieurement :\n- **Température** : Thermistance NTC sur ADC Spresense\n- **Note** : Les bibliothèques SensiEDGE (`Arduino_LSM6DSOX`, `Arduino_HTS221`, etc.) ne sont plus nécessaires.\n\n*Note : Le BMI270 Add-on utilise le bus I2C ou SPI standard. Aucune électronique additionnelle n'est requise.*\n", "Securite: 13_Securite_Electrique": "# Sécurité et Procédures de Mise en Marche\n\n> [!DANGER]\n> **RISQUE ÉLECTRIQUE ET MÉCANIQUE MAJEUR**\n> Les moteurs Robstride sont puissants et peuvent causer des blessures physiques ou brûler l'électronique s'ils sont mal utilisés.\n\n## 1. Configuration de l'Alimentation (Laboratoire)\nPour les premiers tests (Banc d'essai ou Bras seul), utilisez une alimentation de labo réglable (ex: Wanptek).\n\n### Paramètres \"Safe Start\"\n1.  **Tension (Voltage)** : **24.00V** (Vérifier au multimètre à vide avant de brancher quoi que ce soit).\n2.  **Courant (Current Limit)** : **1.000A** (1 Ampère).\n    *   *Méthode* : Faites un court-circuit des sondes (si l'alim le supporte) ou réglez via le menu OCP.\n3.  **Protection** : Activez le mode **OCP** (Over Current Protection). Si le moteur tire trop (blocage), l'alim coupe tout.\n\n## 2. Séquence d'Allumage (Power-Up Sequence)\nRespectez **toujours** cet ordre pour éviter de griller la carte de contrôle du moteur ou l'USB2CAN.\n\n1.  **ALLUMER** l'alimentation (Câble moteur DÉBRANCHÉ).\n2.  **VÉRIFIER** que la tension affiche bien 24V.\n3.  **BRANCHER** le connecteur XT60 du moteur (ou du robot).\n4.  **CONNECTER** l'USB (Data) à l'ordinateur/Jetson.\n5.  **LOGICIEL** : Lancer le script de contrôle ou le \"Enable\" moteur.\n\n> **INTERDIT** : Ne jamais modifier la tension (Voltage d'alim) alors que le moteur est branché et activé (Enabled). Les fluctuations peuvent détruire les MOSFETs internes.\n\n## 3. Arrêt d'Urgence (E-Stop)\n*   En phase de développement (Phase 2), ayez toujours la main sur l'interrupteur de l'alimentation.\n*   Si le robot fait un mouvement violent ou un bruit strident (\"singing\"), **COUPEZ L'ALIM DIRECTEMENT**. Ne cherchez pas à l'arrêter par logiciel.\n\n## 4. Sécurité Mécanique\n*   **Zone d'évolution** : Lors des tests de bras, assurez-vous que le rayon d'action est vide.\n*   **Pincement** : Ne pas mettre les doigts dans les articulations (Coude/Poignet) lorsque les moteurs sont sous tension, même à l'arrêt (Holding Torque actif).\n", "Annexes: 16_Annexe_Batterie_NMC": "# Annexe — Recherche Batteries NMC 21700 pour K-Bot/D-Bot\n\n> **Source** : Recherche Perplexity AI — Février 2026\n> **Objectif** : Identifier les meilleurs packs Li-ion NMC 21700 48V disponibles depuis la France pour un robot humanoïde type K-Bot.\n\n---\n\n## 1. Cible Énergétique et Topologie\n\nLes specs K-Scale parlent d'un pack hot-swappable 48V 15 Ah (~720 Wh). Pour le D-Bot :\n- **Cible** : 2 × 48V 10 Ah ≃ 960 Wh total\n- **Masse** : ~4.5–5 kg avec du 21700 NMC de qualité\n- **Topologie** : Bus 48V (13S Li-ion), DC-DC pour 24V/12V/5V\n- **Usage des 2 packs** :\n  - 1 en service + 1 spare hot-swappable, ou\n  - 2 en parallèle via ORing MOSFET\n\n## 2. Chimies Comparées\n\n### NMC/NCA (21700) — ✅ Recommandé\n- Densité : 200–220 Wh/kg → masse minimale\n- Sécurité correcte avec cellules de marque (LG/Samsung) + BMS sérieux\n- **Exemple** : AT WEY 48V 10 Ah = 480 Wh pour 2.3 kg\n\n### LiFePO4 — ⚠️ Trop lourd\n- Densité 130–160 Wh/kg → 30-40% plus lourd\n- Pack 48V 10 Ah LFP ≃ 3–4 kg (vs 2.3 kg NMC)\n- Usage : prototypage stationnaire uniquement\n\n## 3. Option Recommandée : AT WEY NMC 48V 10 Ah\n\n| Paramètre | Valeur |\n| :--- | :--- |\n| **Chimie** | Li-ion NMC 21700 LG M50LT |\n| **Tension** | 48V nominale (13S) |\n| **Capacité** | 10 Ah (480 Wh) |\n| **Poids** | 2.3 kg par pack |\n| **BMS** | 13S NMC, 20-50A continu, 100A pic |\n| **Connectique** | Personnalisable (Anderson SB50, XT, etc.) |\n| **Usage** | Robotique, industrie, modélisme |\n| **Fabrication** | Assemblé en France |\n| **Lien** | [atwey.fr](https://atwey.fr/accueil/94-batterie-generique-48v-10ah.html) |\n\n### Configuration Robot (2 packs)\n- **Énergie totale** : 960 Wh\n- **Masse totale** : ~4.6 kg\n- **Courant** : 40–100A continu selon BMS (vérifier avec AT WEY)\n\n### Topologies possibles\n1. **1 pack en service + 1 spare** : Trappe batterie, connecteur Anderson SB50, fusible 80A\n2. **2 packs en parallèle** : Packs identiques, même âge, ORing MOSFET, connecteur/déconnexion à SoC ~50-60%\n\n## 4. Autres Fournisseurs NMC FR\n\n| Fournisseur | Modèle | Chimie | Capacité | Note |\n| :--- | :--- | :--- | :--- | :--- |\n| **Smolt & Co** | Li-ion 48V 10 Ah | Samsung/LG | 10 Ah | Bonne qualité, BMS avec sonde temp. |\n| **B-Volt** | Custom 48V | Samsung 35E | Variable | Ultra-léger, fabrication FR, Anderson |\n| **CMBatteries** | 48V 20 Ah | Samsung 50E | 20 Ah | Haute densité mais BMS limité à 30A |\n| **OZO** | Custom 48V | Sur mesure | Variable | Bureau d'étude FR, custom forme/BMS |\n| **Li-Tech** | Standard 48V LFP | LiFePO4 | 30-40 Ah | Sécurité max, mais très lourd |\n\n## 5. Sur-Mesure FR (Meilleur Compromis)\n\nStratégie recommandée :\n1. Partir du pack **AT WEY NMC 48V 10 Ah** comme base\n2. Contacter AT WEY pour **2 modules plus fins** montables de chaque côté du torse\n3. Connecteur Anderson SB50/QS8 + câble vers powerboard centrale\n\n## 6. Intégration (Schéma Électrique 48V)\n\n- **Par pack** : BMS interne 13S → Fusible 60-80A → Connecteur Anderson SB50\n- **Bus robot** : Powerboard 48V + CAN vers membres, buck vers compute\n- **Sécurité** :\n  - Packs fermés avec BMS dédié (jamais de cellules nues)\n  - Espace d'air autour de la batterie\n  - Cloisonnement en matériaux ignifugés (PC/ABS, alu)\n  - Sortie de dégazage \"vers l'arrière\"\n  - Charge avec chargeur 54.6V (13S) CC/CV dédié\n\n## 7. Résumé Achats\n\n1. **2 × AT WEY 48V 10 Ah NMC 21700** (~€300/pack) — [Lien](https://atwey.fr/accueil/94-batterie-generique-48v-10ah.html)\n2. **1 × Chargeur 48V Li-ion 13S (54.6V) 4-5A**\n3. **Connectique** : Anderson SB50 + fusibles 60-80A\n4. **Optionnel** : Contact OZO/AT WEY pour double pack sur-mesure\n\n---\n\n> **Sources principales** : [AT WEY](https://atwey.fr), [B-Volt](https://www.b-volt.com), [CMBatteries](https://cmbatteries.com), [OZO Industries](https://ozo-industries.com), [Li-Tech](https://www.li-tech.fr), [K-Scale Docs](https://docs.kscale.dev/robots/k-bot/electrical/)\n", "Annexes: 17_Annexe_SemiSolide": "# Annexe — État des Lieux Batteries Semi-Solides (Février 2026)\n\n> **Source** : Recherche Perplexity AI — Février 2026\n> **Objectif** : Évaluer la viabilité des batteries semi-solides / solides pour un robot humanoïde type K-Bot.\n\n---\n\n## 1. Situation du Marché\n\n**Conclusion directe** : Pour un humanoïde type K-Bot (48V, <1 kWh, <5 kg), **aucun pack semi-solide compact et léger n'est disponible à l'achat** en février 2026. Les options existantes sont :\n\n- Des **gros modules 48V de 5+ kWh** pour solaire/bateau (40-50 kg)\n- Des **stations énergie AC plug-and-play** (Zendure, Indevolt)\n- Des **cellules B2B** à intégrer soi-même (MOQ élevé, aucune documentation maker)\n\n## 2. Produits Semi-Solides Disponibles depuis la France\n\n### 2.1 Modules 48V Stationnaires\n\n| Produit | Techno | Capacité | Poids | Usage | Pertinence Robot |\n| :--- | :--- | :--- | :---: | :--- | :---: |\n| **Moteurs-Verts 48V 100Ah** | LFP solid-state | 5.12 kWh | 45 kg | Bateau/solaire | ❌ |\n| **Energy Eco 48V 5.12 kWh** | Semi-solid | 5.12 kWh | ~40 kg | Off-grid/marine | ❌ |\n\n→ Absolument inutilisables à bord d'un humanoïde.\n\n### 2.2 Stations Énergie Grand Public\n\n| Produit | Techno | Capacité | Usage | Pertinence Robot |\n| :--- | :--- | :--- | :--- | :---: |\n| **Indevolt SolidFlex 2000** | LFP semi-solide | 2 kWh extensible | Autoconsommation, onduleur AC | ❌ embarqué / ✅ alim labo |\n| **Zendure SuperBase V** | Semi-solid 228 Wh/kg | 6.4-64 kWh | Backup, camping | ❌ embarqué / ✅ alim labo |\n\n→ Trop massifs pour l'embarqué, mais utiles comme **alimentation de développement**.\n\n### 2.3 Cellules B2B (Import)\n\n| Fournisseur | Densité | Cycles | Accès |\n| :--- | :--- | :--- | :--- |\n| **HereWin** | 275-300 Wh/kg | MOQ industriel | Contact B2B |\n| **Welion** | 350 Wh/kg (annoncé) | 6000+ | Contact B2B |\n\n→ Nécessite conception pack complet (13S, BMS, mécanique, sécurité). Trop ambitieux pour un projet DIY.\n\n## 3. Pertinence pour le D-Bot\n\n### ❌ Pourquoi ça ne colle pas (aujourd'hui)\n\n- **Poids** : Les modules commerciaux font 40-50 kg\n- **Format** : Conçus pour rester au sol (IP65, coffret métal)\n- **BMS** : Dimensionnés pour stationnaire, pas pour les pointes de courant brutales d'un bipède\n- **Aucun pack \"robotique légère\"** n'existe en semi-solide dans le format 48V / 500-1000 Wh / <10 kg\n\n### ✅ Usage pertinent : Alimentation de Labo\n\nUtiliser une **Indevolt SolidFlex 2000** ou **Zendure SuperBase V** comme grosse batterie externe :\n- Robot en \"fil à la patte\" (umbilical 48V) pendant le développement\n- Sécurité extrême (tests de perçage OK, 8000 cycles)\n- Et garder des packs NMC classiques pour l'embarqué autonome\n\n## 4. Perspectives 2027+\n\nLe marché évolue rapidement :\n- Apparition prévisible de **modules 48V semi-solides 1-2 kWh** (15-20 kg) pour RV/camping-car\n- Puis éventuellement des **versions robotique** (AGV, AMR) avec BMS haute puissance\n- Densité cellule prévue : +35%, prix : /2\n\n**Action** : Réévaluer en 2027 quand des packs <5 kg existeront.\n\n---\n\n> **Sources** : [HereWin](https://www.herewinpower.com), [Welion](https://welion-energy.com), [Indevolt](https://fr.indevolt.com), [Zendure](https://zendure.com), [Moteurs-Verts](https://moteurs-verts.fr), [Energy Eco](https://www.energyeco.com.au)\n", "Annexes: 18_Annexe_Comparatif": "# Annexe — Comparatif Batteries et Scénarios d'Usage\n\n> **Source** : Recherche Perplexity AI — Février 2026\n> **Contexte** : Robot bipède D-Bot (48V bus, ~24 RobStride + Jetson Orin Nano, 200-400W moyen, pics ~1 kW, autonomie cible 20-30 min)\n\n---\n\n## 1. Tableau Comparatif (48V / 10 Ah)\n\n| Batterie | Chimie | Densité (Wh/kg) | Cycles (80% DoD) | Prix (€) | Autonomie | Avantages | Inconvénients |\n| :--- | :--- | :---: | :---: | :---: | :---: | :--- | :--- |\n| **AT WEY 48V 10Ah** | NMC 21700 | 200-220 | 800-1000 | 250-350 | 20-25 min | Léger (2.3 kg), 50A cont., robot-ready | Sensible au feu si mal intégré |\n| **PowerTech 48V** | LiFePO4 | 130-160 | 4000-6000 | 400-500 | 20-25 min | Très sûr, robuste industriel | +30-40% masse (3-4 kg) |\n| **Indevolt SolidFlex** | LFP semi-solide | 180-230 | 6000-8000 | 800-1200 | 20-25 min | Sécurité max, endurance | 40-50 kg/module, pas léger |\n| **Tattu HD Semi-Solid 6S** | NMC semi-solide | 275-350 | 300-1000 | 500-650 | 30-40 min | Ultra-léger, zéro gonflement | Pas natif 48V, stock limité |\n\n> **Note autonomie** : Basée sur ~300 Wh/h conso moyenne. Doubler les packs pour 40-60 min.\n\n## 2. Scénarios d'Usage\n\n### Court-terme (1-6 mois) — Test/Prototype\n✅ **NMC 21700** (AT WEY 2 × 10 Ah, ~600€ total)\n- Masse mini (4.6 kg total)\n- Courant OK pour pics\n- Facile à intégrer\n- Budget test bas, scalable en parallèle\n\n### Moyen-terme (6-24 mois) — Marche Stable\n✅ **LiFePO4 industriel** (PowerTech ou Li-Tech custom, ~900€ total)\n- Équilibre masse/sécurité\n- 4× plus de cycles que NMC\n- Masse +1-2 kg tolérable\n\n### Long-terme (2027+)\n⏳ **Semi-solide** quand modules <10 kg arriveront\n- Autonomie + endurance pour runs longues\n- Surveiller Indevolt/Tattu évolutions (~1500€ total prévu)\n\n## 3. Recommandation Immédiate\n\n> **Démarrer avec 2 × AT WEY NMC 48V 10 Ah** (~600€)\n> - Connecteur Anderson SB50 (à préciser à la commande)\n> - BMS 60A + fusibles 80A\n> - Tester runtime réel via monitoring courant/volt sur Jetson\n> - Upgrade semi-solide en 2027 quand les packs robotiques apparaîtront\n\n**Lien d'achat** : [AT WEY — Batterie générique 48V 10Ah](https://atwey.fr/accueil/94-batterie-generique-48v-10ah.html)\n\nSi >30 min d'autonomie visé dès maintenant → custom LiFePO4 chez [OZO Industries](https://ozo-industries.com/prestation/batteries/) (~1000€).\n\n---\n\n> **Sources** : [AT WEY](https://atwey.fr), [PowerTech](https://www.powertechsystems.eu), [Indevolt](https://fr.indevolt.com), [OZO](https://ozo-industries.com), [Li-Tech](https://www.li-tech.fr)\n", "Annexes: 20_Etude_Cheville": "# Étude Cheville D-Bot — Historique Évolutif & Architecture Cardan\n\nCe document retrace l'évolution des solutions envisagées pour la cheville du D-Bot, puis détaille l'architecture finale retenue : un **cardan central DIN 808** couplé à un **système différentiel à 2 bielles** (type Optimus), actionné par **2× RS-03 par cheville**.\n\n---\n\n## 1. Historique des Solutions Étudiées\n\nL'architecture de la cheville a traversé cinq itérations avant d'aboutir au design final.\n\n### Étape 1 — K-Bot Standard (Architecture de Base)\nLe K-Bot original utilise un seul **RS-02 monté en haut du tibia**, actionné via un mécanisme de **tirant (pushrod)** avec un ratio de levier ~2:1.\n- **Couple effectif** : ~34 N.m (17 N.m × 2)\n- **DOF** : 1 seul (Pitch)\n- **Roll** : ❌ Absent\n- **Problème** : Pas de stabilité latérale, marche uniquement sur sol plat.\n\n### Étape 2 — Rotule GE12UK (Premier Pivot Envisagé)\nTentative d'ajout d'un pivot central avec une **rotule radiale GE12UK** (roulement lisse sphérique).\n- **Débattement** : ±15° seulement\n- **Problème** : Débattement insuffisant pour marcher sur des pentes, s'accroupir ou absorber les chocs. Le mécanisme arrive en butée mécanique rapidement, risquant de casser les pièces PA12-CF ou de griller les moteurs.\n- **Verdict** : ❌ Écarté — limite cinématique trop basse.\n\n### Étape 3 — Ajout RS-00 Roll Direct-Drive (D-Bot V1)\nAjout d'un **RS-00** (14 N.m, 310g) monté directement à la cheville pour le Roll, en conservant le RS-02+tirant pour le Pitch.\n- **DOF** : 2 (Pitch + Roll)\n- **Avantage** : Simple à implémenter, assemblage trivial.\n- **Problème** : 310g de masse distale (inertie oscillante), RS-02+tirant toujours limité à ~34 N.m pour le Pitch (marche rapide impossible).\n- **Analyse** : Voir [Analyse Biomécanique §7](./15_Analyse_Biomecanique.md).\n\n### Étape 4 — RS-06 \"Sweet Spot\" avec Tirant (D-Bot V2)\nRemplacement du RS-02 par un **RS-06** (36 N.m, 621g) dans le tibia, avec tirant.\n- **Couple Pitch effectif** : ~72 N.m (36 × 2)\n- **Avantage** : Double le couple pour seulement +75g, marche rapide possible.\n- **RS-00 Roll conservé** (14 N.m).\n- **Analyse** : Voir [Cinématique §4.5](./14_Cinematique_Moteurs.md).\n- **Verdict** : ⚠️ Solution correcte mais le Roll reste au pic en marche rapide.\n\n### Étape 5 — Architecture Cardan + Double Bielles (RETENUE ✅)\nAbandon du tirant au profit d'un **cardan central** (DIN 808, acier C45) + **2 bielles rotulées** actionnées par **2× RS-03** par cheville.\n- **Couple Pitch** : 120 N.m (2× 60 N.m en mode synchrone)\n- **Couple Roll** : 120 N.m (2× 60 N.m en mode différentiel)\n- **Masse distale** : ~0g (moteurs en haut du tibia)\n- **Inspiré de** : Tesla Optimus (mécanisme à bielles parallèles)\n- **Verdict** : ✅ **Architecture finale du D-Bot.**\n\n---\n\n## 2. Architecture Retenue — Cheville Différentielle à Cardan\n\n### Principe de Fonctionnement\n\nLa cheville fonctionne en \"trépied\" :\n- Le **Cardan Central** : Supporte 100% du poids du robot (~38-40 kg). Il permet un débattement très élevé (+30°/−45° en Pitch, ±25° en Roll) sans butée structurelle.\n- Les **2 Bielles (Pushrods) à l'Arrière** : Reliées chacune à un RS-03 monté en haut du tibia.\n\n```\n      ┌─────┐\n      │GENOU│\n      └──┬──┘\n         │\n    ╔════╧════╗   ╔════╧════╗\n    ║ RS-03 A ║   ║ RS-03 B ║  ← 2 moteurs HAUT du tibia\n    ╚════╤════╝   ╚════╤════╝    (chacun 60 N.m pic, 880g)\n         │             │\n         │ Bielle A    │ Bielle B    ← Tubes carbone 3K\n         │ (rotule M5) │ (rotule M5)   Ø10/8mm\n         │             │\n         ╰──────┬──────╯\n                │\n           ╔════╧════╗\n           ║ CARDAN  ║  ← DIN 808, Série G, Acier C45\n           ║ (pivot) ║    Supporte 100% du poids\n           ╚════╤════╝\n           ┌────┴────┐\n           │  PIED   │\n           └─────────┘\n\n    A↓ + B↓ (même sens)    = PITCH (flexion/extension)\n    A↓ + B↑ (sens opposé) = ROLL  (inversion/éversion)\n```\n\n### Bilan des Performances\n\n| Paramètre | Valeur |\n| :--- | :--- |\n| **Couple Pitch effectif** | 120 N.m (2× RS-03 synchrones) |\n| **Couple Roll effectif** | 120 N.m (2× RS-03 différentiels) |\n| **Marge vs besoin statique (33 N.m)** | **+260%** |\n| **Masse distale** | ~0g (moteurs haut du tibia) |\n| **Débattement Pitch** | +30° / −45° |\n| **Débattement Roll** | ±25° |\n| **DOF total jambe** | 6 (Hanche P/R/Y + Genou + Cheville P/R) |\n| **Moteurs par jambe** | 6 (2× RS-04 + 2× RS-03 hanche + 2× RS-03 cheville) |\n\n---\n\n## 3. Achats et Montage\n\n### A. Joint de Cardan Central\nJoint de cardan simple **Série G** (douilles lisses, résistantes aux chocs), norme DIN 808, acier C45, axe 12 mm.\n- **Mouvement** : la transmission de couple se fait par montage à **rainure de clavette (Keyway)** de 4 mm.\n- **Fournisseurs France** :\n  - **Michaud Chailly** : Réf. A5-473-12 (qualité premium, option rainure).\n  - **HPC Europe** : Réf. UJ-12.\n\n### B. Fixation et Maintien Axial\nL'axe en acier rectifié (12mm h6) doit être immobilisé axialement :\n- **Bagues d'arrêt (Shaft Collars)** en acier, 2 parties (fendues), de chaque côté du cardan.\n  - **HPC Europe** : BAG2-012 ou **Michaud Chailly / Ruland** : F2-39-12. Vis de classe 12.9.\n\n### C. Bielles (Pushrods) et Rotules\n- **Bielles** : Tubes carbone 3K (Ø ext 10mm / Ø int 8mm) — rigidité maximale, pas de flambement.\n- **Rotules d'extrémité** : Embouts M5.\n  - **Igus EBRM-05** (polymère, ultra léger)\n  - **SAK 5 C** (acier/PTFE, sur 123Roulement).\n\n### D. Protection (Soufflet)\nSoufflet de protection en néoprène (vendu en option avec le cardan chez RS, Michaud ou HPC). Indispensable pour protéger l'articulation de la poussière.\n\n---\n\n## 4. Impact sur la Configuration Globale\n\nL'adoption de cette architecture modifie la configuration moteur des jambes :\n\n| Articulation | Moteur | Qté (×2 jambes) | Couple | Note |\n| :--- | :---: | :---: | :---: | :--- |\n| Hanche Pitch | RS-04 | 2 | 120 N.m | Inchangé (K-Bot) |\n| Hanche Roll | RS-03 | 2 | 60 N.m | Inchangé |\n| Hanche Yaw | RS-03 | 2 | 60 N.m | Inchangé |\n| Genou Pitch | RS-04 | 2 | 120 N.m | Inchangé |\n| **Cheville A** | **RS-03** | **2** | **60 N.m** | **NOUVEAU** (remplace RS-02 tirant) |\n| **Cheville B** | **RS-03** | **2** | **60 N.m** | **NOUVEAU** (remplace RS-00 Roll) |\n\n**Total moteurs jambes** : 12 (au lieu de 10 pour K-Bot + 2 RS-00 Roll précédents)\n**Surpoids** : +2× (880g − 405g) + 2× (880g − 310g) = +950g + 1140g = **+2.09 kg** vs V1.\n**Surcoût** : +2× ($250 − $160) + 2× ($250 − $135) = +$180 + $230 = **+$410** vs V1.\n\n> [!IMPORTANT]\n> **Ce surpoids est en position BASSE (tibia)**, donc l'impact sur le centre de gravité est minimal. L'avantage de couple (+260% de marge) et la suppression de toute masse distale (~0g vs 310g/cheville) compensent largement.\n\n---\n*Étude réalisée en Février 2026. Basée sur les analyses biomécaniques documentées dans les Annexes 14 et 15.*\n", "Annexes: 21_Etude_Usinage_CNC_Milo": "# 21 - Étude et Acquisition CNC Milo (Usinage Aluminium)\n\n## 1. Contexte et Nécessité d'une CNC Aluminium\n\nPour les robots de la gamme k-bot (actionneurs quasi-direct drive à fort couple) et d-bot (cinématique rapide), l'impression 3D montre ses limites physiques :\n- **Fluage (Creep) des plastiques** : Même avec des matériaux haute performance comme le PA-CF (Nylon Carbone) ou le PC, les logements de roulements soumis à une tension radiale ou thermique constante finissent par se dilater (ovalisation), créant un jeu inacceptable.\n- **Tolérances H7** : Pour des liaisons mécaniques sans jeu (ajustement glissant \"juste\" pour un roulement), l'impression FDM nécessite des ajustements empiriques lourds (*Hole Expansion*) et manque de la fiabilité offerte par le métal.\n\n**Impact direct sur l'étude** : \n> [!IMPORTANT]\n> À partir de cette étape du projet, il est acté que **certaines pièces critiques structurelles et de transmission (supports moteurs, jonctions de bras) devront impérativement être usinées en aluminium** (nuance 6061-T6 ou 7075).\n> **La conception de ces pièces sous CAO doit dès à présent intégrer les contraintes d'usinage sur CNC 3 axes** (dégagements d'outils, évidements accessibles par le haut, surfaçage). \n\n## 2. Le Choix Matériel : Millennium Milo v1.5\n\nFace aux options du marché (Carbide Nomad 3, Shapeoko), le projet **Millennium Machines Milo v1.5** (Open-Source) s'impose comme la solution idéale pour la robotique DIY avancée :\n\n- **Rigidité Industrielle** : Architecture renforcée (Mod FMJ - Full Metal Jacket) conçue spécifiquement pour absorber les vibrations (chatter) lors de l'usinage du métal.\n- **Puissance de Broche** : Broche de 1.5 kW avec pince ER16 (permet de monter des fraises jusqu'à 9mm) contre 130W ER11 pour une Nomad 3. Cela autorise des passes d'ébauche significatives dans l'aluminium 6061.\n- **Micro-précision intégrée** : Le kit officiel (LDO Motors) inclut le \"Long John\" (palpeur automatique de longueur d'outil pour recalibrer l'axe Z au micron près) et la \"Fixtated Plate\" (plaque continentale taraudée M5 pour un bridage répétable indispensable).\n- **Synergie Impression 3D / CNC** : Construire la Milo nécessitera ~3 kg d'impressions 3D en **ASA / ABS** (le PLA fluant sous la chaleur des moteurs), tâche qui sera confiée à la **Qidi Plus 4** du d-Bot.\n\n## 3. Stratégie d'Achat (Milo v1.5 / v2.0)\n\nLa Milo étant produite par \"batches\" (lots de production LDO Motors), elle est fréquemment en rupture de stock.\n*Budget estimé (Machine finie)* : ~1 600€ (Kit LDO à ~1 350€ + Étau de précision à ~150€ + Consommables Alu/Fraises).\n\n### 3.1. Comment acquérir la machine dans les mois à venir :\n\n1. **Surveillance du Discord Officiel Millennium Machines** :\n   - [Lien Discord: discord.gg/dhBHRfws6G](https://discord.gg/dhBHRfws6G)\n   - C'est le point névralgique pour être notifié des **restocks** et des **annonces concernant la future V2.0**.\n   - Canaux clés : `#announcements` (informations officielles), `#milo-v_1_5`, et utiliser la recherche sur le mot \"restock\".\n\n2. **Revendeurs Européens Prioritaires (Éviter les frais de douane US)** :\n   - **3DJake** : Partenaire historique LDO, très fiable, activer l'alerte de réapprovisionnement.\n   - **Desktop Machine Shop (UK)** : Revendeur très impliqué, vend souvent la broche et l'électronique en pack.\n   - À défaut (USA) : Fabreeko (si le budget permet l'import).\n\n3. **La question de la V2** : Vérifier sur Discord l'imminence de la V2 avant l'achat d'un kit v1.5. Si les délais de la V2 sont trop longs, la v1.5 reste parfaitement dimensionnée et évolutive (upgrade possible en ré-usinant les nouvelles pièces).\n\n### 3.2. Comparatif V1.5 vs Future V2.0\n\nL'attente pour la V2.0 (ou la recherche des restocks de kits V1.5) dépendra de votre niveau d'urgence. La V2.0 passe d'une machine \"bricolée de passionnés\" à un produit beaucoup plus abouti, professionnel et facile à calibrer.\n\nVoici les évolutions majeures annoncées pour la V2.0 :\n- **Volume d'usinage agrandi** et introduction d'une variante compacte \"Miley v2.0\" (axe X fixe).\n- **Ajustement automatique du jeu** : Écrous Anti-Backlash auto-ajustables (correction d'un point noir de la V1.5).\n- **Protection accrue** : Couvertures magnétiques (Way Covers) pour protéger les rails des copeaux d'aluminium.\n- **Ergonomie (\"Quality of Life\")** : Alignement de la machine (Tramming) ultra-simplifié grâce à de nouvelles plaques \"Easy tram plates\".\n- **Électronique dédiée** : Nouvelle carte (partenariat BigTreeTech) intégrant directement les drivers (jusqu'à 4.75A) et la commande du VFD, éliminant le besoin de cartes filles.\n\n> [!NOTE]\n> À cause des énormes changements structurels, il n'est pas possible d'upgrader directement et totalement une v1.5 en v2.0. Cependant, un kit d'amélioration \"v1.6\" sera proposé pour apporter certaines améliorations de confort de la V2 aux possesseurs actuels de V1.5.\n\n### 3.3. Alternatives Commerciales et Capacité de Tournage\n\nLa Milo est une fraiseuse 3 axes pure, puissante (1500W) mais exigeante. L'étude a exploré d'autres machines \"Desktop CNC\" prêtes à l'emploi (notamment la gamme **Makera Carvera**) pour évaluer d'autres philosophies d'atelier et les capacités de **tournage CNC** (ex: pour la cheville).\n\n**La particularité du Tournage sur Fraiseuse CNC :**\n- Réaliser un filetage extérieur long sur une fraiseuse limite la pièce à cause de la course en axe Z (120mm max sur Milo). L'axe doit tenir debout dans l'étau, interdisant les bras longs.\n- Pour des pièces de révolution, contourner le problème se fait par taraudage intérieur + ajout de goujons en acier, ou en utilisant un vrai **4ème Axe Rotatif**.\n\n**Les Alternatives \"Prêtes à l'emploi\" :**\n- **Makera Carvera Air (~2500€) :** La reine de la propreté de bureau. Entièrement fermée, palpage automatique, changement rapide d'outil. Elle propose un **4ème Axe Rotatif** permettant de tourner/fileter des axes jusqu'à 200 mm de long. *Le compromis :* Sa fine broche de 200 Watts limite les outils à 1/8\" et interdit les passes profondes dans un aluminium dur, allongeant dramatiquement les temps d'usinage face à une Milo.\n- **Makera Carvera classique (~5500€) :** Guidages industriels, changeur d'outil 100% automatique. Elle résout les problèmes de rigidité de la version Air, mais conserve la même broche de 200 Watts.\n- **Bantam Tools Desktop CNC (~4000€) :** Spécialisée aluminium, fermée, 28 000 tr/min. Extrêmement aboutie logiciellement pour l'usinage rapide sans erreur, mais sans 4ème axe natif.\n- **Le verdict (La Milo \"Moddée\") :** Pour le D-Bot (pièces de 35 kg épaisses), la puissance d'ébauche de la Milo (1500W / outils 8mm) est irremplaçable. Le meilleur \"compromis\" consistera à prendre la Milo, puis de l'équiper plus tard d'une broche ATC (Automatic Tool Changer) et d'un caisson DIY pour mimer l'expérience d'une machine premium.\n\n### 3.4. CAO Adaptative (Spécifique Carvera) : Squelette Alu et Habillage PA12-CF\n\nSi le choix se porte sur une **Makera Carvera** (pour bénéficier de sa propreté de bureau, de son automatisation, de son palpage 3D sans fil natif et du 4ème axe pour le tournage des chevilles), la CAO du robot doit s'adapter drastiquement au \"Mur de la Physique\" de sa broche :\n\n1. **La limite des poches profondes :** La Carvera est livrée avec des pinces (collets) de 1/8\". Même en achetant la pince optionnelle de 6 mm (qui réduit la vibration de l'outil), la broche de 200W n'aura jamais le couple nécessaire pour enfoncer une fraise de 6 mm profondément dans de l'aluminium aérospatial sans caler. L'usinage \"dans la masse\" de pièces monolithiques épaisses est donc proscrit.\n2. **Architecture en \"Squelette Hybride\" :** Pour contourner ce déficit de puissance, la conception CAO doit migrer vers la création d'un **\"Squelette interne\" en Aluminium**. Ce squelette est usiné (2D/2.5D) dans des plaques fines (5 à 10 mm) superposées et vissées. C'est long à manufacturer sur la Carvera, mais sans effort pour son petit moteur. Ce \"plate assembly\" garantira l'alignement mécanique parfait des roulements (H7) et axes.\n3. **L'habillage Volumineux FDM :** Les volumes géométriquement profonds ou complexes (protection moteur, carrosserie pelvienne épaisse) seront sous-traités à l'imprimante 3D **Qidi Plus 4** en utilisant des polymères techniques (comme le **PA12-CF**). Les pièces plastiques épaisses viendront chapeauter le fin squelette en aluminium usiné. C'est le mariage optimal des deux écosystèmes makers, contournant brillement les contraintes temporelles et de rigidité de la Carvera.\n\n### 3.5. Étude de l'Opportunité : Carvera d'Occasion vs Milo\n\nLe marché de l'occasion peut rebattre drastiquement les cartes de la décision d'achat. Une opportunité d'acquérir une **Makera Carvera classique (avec Changeur d'Outil ATC) autour de 3 700 €** modifie profondément l'analyse :\n\n- **Le gain de Temps (L'ATC) :** Face à une Milo (dont le coût moddé avec caisson et broche pneumatique ATC avoisinerait les 2 700 € et plus de 80h de montage/configuration), la Carvera d'occasion exige un budget supplémentaire de ~1 000 €, mais fait gagner des semaines entières et offre une précision \"Out-of-the-box\" (rails industriels rectifiés et palpeur 3D sans fil natif de série).\n- **L'absence du 4ème Axe :** Si cette occasion n'inclut pas le module *4th Axis Rotary*, la Carvera redevient mécaniquement une machine 3 Axes (X,Y,Z). Elle est alors soumise à la même restriction que la Milo : l'impossibilité d'usiner un axe long debout dont la verticalité dépasserait le Z-Clearance (130mm max).\n- **Stratégie de fabrication :** À 3 700 €, l'achat reste incontestablement justifié pour produire l'immense majorité (95%) du \"squelette\" du robot (en traitant des plaques). L'absence provisoire du 4ème axe se compense en achetant le module Makera séparément plus tard (environ 500 €), ou en achetant les 5% de pièces purement cylindriques (Tiges en acier rectifié de 12mm standard) pour les tarauder et goujonner manuellement (contournement CNC 3 axes).\n\n## 4. Équipements Indispensables et Méthodes d'Atelier\n\nL'usinage de pièces de k-bot en aluminium ne s'improvise pas sans méthodologie. Oubliez la fonderie artisanale (problèmes de porosité et retrait de 1 à 2%) et misez sur l'usinage dans la masse (Billet 6061-T6 depuis *Blockenstock* ou *Matière Détail*).\n\n### 4.1. L'Outillage de Fraisage\n- **Fraises Spécifiques** : Utiliser impérativement des fraises à **1 dent (Single Flute) pour l'aluminium** (ex: diamètres 6mm, 3.175mm, 2mm). Cela garantit l'évacuation rapide du copeau avant qu'il ne fonde.\n- **Lubrification** : Adjonction d'un système \"Mist Coolant\" ou à minima lubrification manuelle (Huile de coupe/WD-40). L'alu à sec a tendance à coller sur la fraise (gummification) et à la détruire.\n\n### 4.2. Les Taraudages (M3, M4, M5)\nLa Milo n'a pas de couple à base vitesse pour du taraudage mécanique classique (Rigid Tapping).\n- **Méthode Hybride (Débutants)** : Percer précisément avec la CNC (ex: 2.5mm pour M3), puis tarauder manuellement avec des tarauds HSS-E Cobalt machine (Gühring ou Format) lubrifiés.\n- **Méthode Thread Milling (Pro)** : Utiliser une fraise à fileter universelle (carbure) qui tourne en hélice dans le trou CNC. Plus délicat sur le CAM mais infiniment plus fiable (pas de taraud cassé dans la pièce).\n\n### 4.3. L'Acquisition du H7 (Logements Roulements)\n- On ne génère pas un H7 à la fraiseuse du premier coup : l'aluminium fléchit sous l'effort de la broche.\n- **La méthode reine** : Ébauche à la fraiseuse (ex: percage à 7.8mm), passe de finition (*spring pass*), puis passage final avec un **Alésoir Machine** (ex: 8.00 mm) pour obtenir un trou géométriquement parfait sans ovalisation, où le roulement s'insèrera \"press-fit\" sans besoin de bridage.\n\n### 4.4. Chaîne Logicielle CAM : FreeCAD vs Fusion 360\nPour piloter la Milo (sous RepRapFirmware) :\n- **FreeCAD (Atelier Path)** : Entièrement gratuit, il lève les limites des changements d'outils automatiques. Idéal avec le palpeur \"Long John\" pour enchaîner perçage / ébauche / filetage en un seul lancement de fichier.\n- **Fusion 360 (Licence gratuite)** : Très puissant, mais bride l'export complet : il faut exporter un programme (Gcode) par outil (soit plusieurs fichiers à lancer consécutivement).\n", "Annexes: 21_Etude_Main_Robotique": "# Étude Main Robotique : D-Hand Premium\n\nCette annexe détaille la conception de la main articulée anthropomorphe du D-Bot, basée sur une architecture à **tendons déportés** et des servos **Dynamixel XC330-T288-T** (qualité recherche académique).\n\n## 1. Philosophie de Conception\n\n### Objectif\nObtenir une main de dextérité intermédiaire (8 DOF, ~80 N de grip) permettant la manipulation d'objets courants (outils, bouteilles, poignées de porte), tout en restant réparable, évolutive, et compatible avec l'apprentissage par renforcement (sim-to-real).\n\n### Principe : Actionnement Déporté à Tendons (comme la main humaine)\n\nDans la main humaine, les muscles responsables de la flexion des doigts sont situés dans l'**avant-bras**, pas dans les doigts eux-mêmes. Des tendons transmettent la force sur de longues distances. La D-Hand reproduit ce principe :\n\n```\n┌──────────────────────────────┐\n│       AVANT-BRAS D-BOT      │ ← 8 servos XC330 logés ici\n│    (structure PA12-CF/Alu)   │ ← Masse moteur : 184g seulement\n│                              │\n│  Servos → Poulies → Tendons ─┼──→ vers le poignet (RS-00)\n└──────────────────────────────┘\n                                    │\n                               ┌────┴────┐\n                               │  MAIN   │ ← Aucun moteur !\n                               │  ~250g  │ ← Phalanges PA12-CF\n                               └─────────┘    + ressorts de rappel\n```\n\n**Avantages** :\n- La main est **légère** (~250g) car seules les structures passives s'y trouvent.\n- L'inertie au bout du bras est **minimale** → meilleure dynamique de manipulation.\n- Les servos dans l'avant-bras sont **facilement accessibles** pour la maintenance.\n\n---\n\n## 2. Choix du Servo : Dynamixel XC330-T288-T\n\n### Pourquoi ce servo ?\nC'est le **standard de facto** de la robotique de recherche (Carnegie Mellon LEAP Hand, AGIBOT, Shadow Robot). Il combine compacité extrême, engrenages métaux, et un écosystème logiciel mature.\n\n### Fiche Technique\n\n| Paramètre | Valeur |\n| :--- | :--- |\n| **Dimensions** | 20 × 34 × 26 mm |\n| **Poids** | 23 g |\n| **Couple de blocage (12V)** | 1.00 N.m (10.2 kg.cm) |\n| **Couple nominal (continu)** | ~0.40 N.m |\n| **Vitesse à vide** | 71 RPM (à 12V) |\n| **Résolution** | 4096 pas / tour (0.088°) |\n| **Encodeur** | Magnétique absolu, sans contact, 12 bits |\n| **Réducteur** | Ratio 288:1, engrenages **métaux** |\n| **Moteur** | Coreless DC (très faible inertie) |\n| **Modes de contrôle** | Position, Vitesse, Courant, PWM, Position+Courant |\n| **Protocole** | Dynamixel Protocol 2.0 (TTL, daisy-chain, 4 Mbps) |\n| **Tension** | 6.5 – 12V (recommandé 11.1V) |\n| **Prix unitaire (EU)** | ~130 € |\n| **Backdrivability** | ✅ Mode courant → compliance passive (sécurité) |\n\n### Comparaison avec les Alternatives Écartées\n\n| Critère | XC330-T288-T | Feetech STS3215 | CubeMars GL30+Cyclo |\n| :--- | :--- | :--- | :--- |\n| Couple | 1.0 N.m | 3.0 N.m | 0.28 N.m (×15 = 4.2 en théorie) |\n| Poids | **23g** | 55g | ~50g + réducteur |\n| Engrenages | **Métal** | Nylon | Cycloïdal usiné (120+ pièces) |\n| Durabilité | Industrielle | Hobby | Expérimental |\n| Backdrivability | ✅ Excellente | ⚠️ Limitée | ✅ (si usiné parfait) |\n| Écosystème | **Dynamixel SDK, ROS** | SDK basique | FOC custom |\n| Coût / main (8×) | ~1 040€ | ~150€ | ~700€ (optimiste) |\n| Risque projet | 🟢 Faible | 🟢 Faible | 🔴 Très élevé |\n\n**Verdict** : Le XC330 compense son couple inférieur par l'amplification mécanique des poulies et une fiabilité supérieure. Le STS3215 reste une option V1 budget si le coût est prioritaire.\n\n---\n\n## 3. Architecture — Configuration 8 DOF\n\n### 3.1 Affectation des Servos\n\n| # | Doigt | Mouvement | Tendon |\n| :---: | :--- | :--- | :--- |\n| 1 | **Pouce** | Flexion/Extension (Curl) | Dyneema Ø0.8mm |\n| 2 | **Pouce** | Abduction/Adduction (Opposition) | Dyneema Ø0.8mm |\n| 3 | **Index** | Flexion (Curl) | Dyneema Ø0.8mm |\n| 4 | **Index** | Abduction (Écartement) | Dyneema Ø0.8mm |\n| 5 | **Majeur** | Flexion (Curl) | Dyneema Ø0.8mm |\n| 6 | **Annulaire** | Flexion (couplé mécaniquement à #7) | Dyneema Ø0.8mm |\n| 7 | **Auriculaire** | Flexion (couplé mécaniquement à #6) | Dyneema Ø0.8mm |\n| 8 | **Paume** | Curl palmaire global (prise de force) | Dyneema Ø1.0mm |\n\n### 3.2 Implantation dans l'Avant-Bras\n\nL'avant-bras du D-Bot mesure ~22 cm de l'articulation coude à l'articulation poignet (RS-00), avec un diamètre de ~90 mm au coude et ~50 mm au poignet.\n\n```\nVUE LONGITUDINALE — AVANT-BRAS (coupe latérale)\n\n  COUDE (RS-02)                              POIGNET (RS-00)\n    ←───── 22 cm ──────────────────────────────→\n    │                                           │\n    │  ┌──────────────────┐                     │\n    │  │  8× XC330         │   Espace libre     │\n    │  │  3 rangées        │   pour câblage,    │\n    │  │  (10 cm)          │   buck 48V→12V,    │\n    │  │                   │   U2D2 controller  │\n    │  └──────────────────┘                     │\n    │  ← 10 cm →            ← 12 cm →          │\n```\n\n```\nVUE EN COUPE TRANSVERSALE (section au niveau des servos)\n\n              ← ~60 mm →\n    ┌────────────────────────────┐\n    │  ╔═══════╗ ╔═══════╗      │\n    │  ║ XC330 ║ ║ XC330 ║      │  Rangée 1 (Pouce + Index curl)\n    │  ║ 20×34 ║ ║ 20×34 ║      │  20mm large × 34mm haut\n    │  ╚═══════╝ ╚═══════╝      │\n    │  ╔═══════╗ ╔═══════╗      │\n    │  ║ XC330 ║ ║ XC330 ║      │  Rangée 2 (décalée 26mm)\n    │  ╚═══════╝ ╚═══════╝      │  (Pouce abd. + Index abd.)\n    │  ╔═══════╗ ╔═══════╗      │\n    │  ║ XC330 ║ ║ XC330 ║      │  Rangée 3\n    │  ╚═══════╝ ╚═══════╝      │  (Majeur + Annulaire/Auriculaire)\n    │       ╔═══════╗           │\n    │       ║ XC330 ║           │  Rangée 4 (Paume)\n    │       ╚═══════╝           │\n    └────────────────────────────┘\n\n    Encombrement : 60mm largeur × 60mm profondeur × 102mm longueur\n    Total : 8 × 23g = 184g de servos\n```\n\n### 3.3 Système de Tendons et Guidage\n\n| Composant | Spécification |\n| :--- | :--- |\n| **Tendon** | Tresse Dyneema Ø0.8mm (résistance 40 lbs / 18 kg) |\n| **Gaine de guidage** | Tube PTFE Ø1.5mm intérieur (friction quasi nulle) |\n| **Poulie de sortie** | Ø8mm aluminium 6061, usinée CNC (C500) |\n| **Poulies de renvoi** | Ø6mm dans la paume, PA12-CF imprimé 3D |\n| **Retour passif** | Ressort de torsion 0.05 N.m par articulation |\n| **Fixation tendon** | Nœud + goutte de cyanoacrylate sur la phalange distale |\n\n**Parcours du tendon (exemple : Index, Curl) :**\n```\nXC330 #3 → Poulie Ø8mm CNC → Tendon Dyneema dans gaine PTFE\n  → Traverse le poignet (RS-00 creux) → Renvoi base de la main\n  → Phalange proximale (MCP) → Phalange médiale (PIP)\n  → Attache sur phalange distale (DIP)\n\nRetour : 3 ressorts de torsion miniatures (MCP + PIP + DIP)\n         ramènent le doigt en position ouverte\n```\n\n---\n\n## 4. Performances Estimées\n\n### 4.1 Force de Grip\n\n| Mesure | Calcul | Résultat |\n| :--- | :--- | :--- |\n| **Tension max tendon** | 1.0 N.m × 0.80 (rendement) / 0.004 m (rayon poulie) | **200 N** |\n| **Force pointe du doigt (tendu)** | Effet de levier sur 90mm de doigt | **~20 N** (2 kg) |\n| **Pince pouce+index** | 2 tendons en opposition | **~50 N** (5 kg) |\n| **Grip global (5 doigts)** | Somme avec angle d'approche | **~80-100 N** (8-10 kg) |\n| **Force paume (servo #8)** | Tendon Ø1.0mm, poulie Ø10mm | **~30 N** additionnel |\n\n### 4.2 Comparaison\n\n| Main | Force Grip | DOF | Poids | Coût /main | Servos |\n| :--- | :---: | :---: | :---: | :---: | :--- |\n| **D-Hand Premium** | **~80-100 N** | **8** | **~250g** | **~1 220€** | 8× XC330 |\n| LEAP Hand v2 (CMU) | ~80 N | 17 | ~400g | ~4 000€ | 17× Dynamixel |\n| Main humaine | ~300-400 N | 27 | ~400g | N/A | — |\n| K-Bot Gripper | ~50 N | 1 | ~100g | ~30€ | 1× STS3215 |\n\n### 4.3 Vitesse\n\n| Métrique | D-Hand Premium | Main Humaine |\n| :--- | :---: | :---: |\n| Temps de fermeture | ~0.5 s | ~0.3 s |\n| Temps de prise de force | ~0.7 s | ~0.5 s |\n\n---\n\n## 5. BOM — D-Hand Premium (par main)\n\n| Composant | Qté | Prix Unit. | Total |\n| :--- | :---: | :---: | :---: |\n| Dynamixel XC330-T288-T | 8 | 130 € | 1 040 € |\n| U2D2 (USB↔Dynamixel) | 1 | 35 € | 35 € |\n| U2D2 Power Hub | 1 | 25 € | 25 € |\n| Buck Converter 48V→12V (5A) | 1 | 15 € | 15 € |\n| Tendons Dyneema (bobine 50m) | 1 | 15 € | 15 € |\n| Tubes PTFE Ø1.5mm (10m) | 1 | 8 € | 8 € |\n| Ressorts de torsion miniatures | 16 | 0.50 € | 8 € |\n| Roulements MR52ZZ (2×5×2.5mm) | 16 | 1 € | 16 € |\n| Structure main (PA12-CF, impr. 3D) | 1 lot | — | 20 € |\n| Poulies Ø8mm alu CNC (C500) | 8 | 5 € | 40 € |\n| Visserie M2/M2.5 inox | lot | — | 10 € |\n| **TOTAL par main** | | | **~1 230 €** |\n\n**Pour les 2 mains : ~2 460 €.**\n\n### Alimentation\nLes XC330 fonctionnent à 12V. Le D-Bot utilise du 48V. Un **Buck Converter 48V→12V 5A** (~15€) sera intégré dans le châssis avant-bras. Courant total max des 8 servos : 8 × 0.88A = 7A (stall), ~3A en usage normal — le buck suffit largement.\n\n---\n\n## 6. Intégration Logicielle\n\n| Couche | Technologie |\n| :--- | :--- |\n| **Interface physique** | U2D2 (USB) → Jetson Orin Nano |\n| **SDK** | Dynamixel SDK Python / C++ (officiel ROBOTIS) |\n| **Middleware** | ROS 2 Humble — `dynamixel_workbench` |\n| **Contrôle** | Position+Courant (mode #5) pour grip adaptatif |\n| **Simulation** | MuJoCo / Isaac Gym (modèle URDF disponible) |\n| **Apprentissage** | Compatible sim-to-real (RL policy transfer) |\n\nLe protocole Dynamixel 2.0 permet de lire en temps réel : position, vitesse, courant, température et charge de chaque servo à 200 Hz sur le bus TTL — suffisant pour un contrôle de grip adaptatif.\n\n---\n\n## 7. Note Historique — Concepts Écartés\n\n### CubeMars GL30 + Réducteur Cycloïdal (étude initiale)\nL'approche initiale envisageait 6 moteurs CubeMars GL30 (gimbal, 0.28 N.m) couplés à des réducteurs cycloïdaux 15:1 usinés en aluminium 7075-T6. Cette solution a été écartée car :\n- Usinage de 6 profils cycloïdaux 15 lobes à ±0.02mm → à la **limite de la C500**\n- ~120 pièces de précision par main → **assemblage irréaliste** pour un prototype\n- Aucun projet open-source n'a validé cette combinaison\n- Ratio coût/performance défavorable (~700-800€ pour un résultat incertain)\n\n### Feetech STS3215 (alternative budget)\nOption intermédiaire (6× STS3215, ~230€/main) offrant 3 N.m et 55g par servo. Engrenages nylon (usure), backdrivability limitée. Reste une **option de secours budget** valide mais ne correspond pas à l'ambition \"haut de gamme\" du projet.\n\n---\n*Étude réalisée en Février 2026. Les prix et spécifications sont basés sur les sources officielles ROBOTIS et distributeurs européens.*\n", "Annexes: 22_Usinage_CNC_C500": "# Usinage CNC C500 - Consignes pour le D-Bot\n\nAfin d'usiner les composants vitaux du robot humainoïde D-Bot (y compris l'avant-bras et la série d'actuateurs cycloïdaux de la *D-Hand*), nous nous appuyons sur la **CNC NestWorks C500**.\nCette annexe recense les consignes clés issues de l'analyse initiale pour préserver la machine, garantir la précision vitale du H7 exigée par le montage moteur, et maximiser l'emploi des fournitures existantes.\n\n## 1. Outils Métal (Professional Metal Tool Kit)\n\nLe choix du kit professionnel orienté métal avec revêtement **DLC (Diamond-Like Carbon)** est le pilier de tous nos développements sur de l'Aluminium 7075-T6.\nCe revêtement réduit drastiquement les frictions et empêche le métal \"de coller\" à la fraise naissant d'alliages tendres (arête rapportée).\n\n### Application des outils à la fabrication du robot :\n\n| Nom Fourni | Traduction / Type | Utilisation sur le D-Bot |\n| :--- | :--- | :--- |\n| **O-Type End Mill** | Fraise \"O-Flute\" à 1 dent | Évacuation très rapide des copeaux. Outil idéal pour creuser dans les blocs pleins de 30mm dédiés aux châssis. |\n| **Flat End Mill (1/4\")** | Fraise plate à 2 dents (6.35 mm) | L'outil \"de force\". Principalement utilisé pour retirer massivement (ébauche) de la surface de travail sur les pièces larges. |\n| **Chamfer Cutter** | Fraise à chanfreiner (90°) | **Indispensable pour nos tolérances H7.** Permet de casser les angles une fois alésés. Sans cet ébavurage CNC, les insertions de micro-roulements seront bloquées ou rayées. |\n| **Taper Ball Nose / Ball Nose** | Fraises hémisphériques (divers angles) | Utilisées pour les congés afin d'arrondir les arrêtes internes des phalanges/pièces 3D pour prévenir les ruptures sous charge. |\n| **V-Shape Engraving Bit** | Fraise à graver (30°) | Pour les gravures des numéros de série de pièces (indexage lors de l'assemblage complexe). |\n\n*Note de précision* : En usinage H7, une passe d'ébauche avec une Flat End Mill usée, suivie impérativement d'une passe terminale micrométrique avec un des outils DLC neufs est systématiquement recommandée.\n\n## 2. Attention Particulière aux Collets (Pinces de Serrage ER11) : Impérial vs Métrique\n\nC'est ici que se trouve le plus grand risque de casse matérielle si les standards sont confondus.\nL'équipement livré avec la fraiseuse NestWorks se repose intégralement sur le système impérial américain (fraises de *1/4 pouce* soit $6.35\\text{ mm}$ et de *1/8 pouce* soit $3.175\\text{ mm}$). \n\n**Règle absolue :**\n1.  **NE JAMAIS** insérer une fraise métrique de dimension proche (exemple : une fraise européenne de $6\\text{ mm}$) dans une pince ER11 impériale de $1/4\\text{ pouce}$ ($6.35\\text{ mm}$), même si cela semble possible \"en forçant sur l'écrou\".\n2. Cela engendre un \"runout\" (voile) asymétrique. Un battement de juste $0.02\\text{ mm}$ suffit à ruiner un fraisage pour roulement H7, et abîme de façon permanente la broche principale.\n\n**Gestion de l'Atelier :**\n- Les outils NestWorks et leurs collets respectifs ($1/4$ et $1/8$) sont marqués et rangés séparément sur le râtelier A (Impérial).\n- À l'achat de fraises complémentaires sur le marché européen ($6\\text{ mm}$, $4\\text{ mm}$, $3\\text{ mm}$), **nous devrons commander avec les collets ER11 métriques stricts correspondants** (Râtelier B - Métriques).\n\n## 3. Gestion ATC et durabilité des Puces RFID\n\nLe système ATC (Automatic Tool Changer) opère avec **20 Puces RFID** fournies, agissant comme identifiants incontestables auprès de NestWorks Studio afin de sécuriser le changement automatique d'outils et ses spécifications métiers.\n\n*   Elles ne se posent **pas** sur la surface coupante, mais se collent sur les *Bit RFID Tool Holders* dédiés à ce système râtelier, protégeant ainsi la puce des vibrations et de la chaleur d'usinage.\n*   **Réaffectation Libre :** Si une fraise est détériorée ou vient à céder, extraire seulement son corps cassé. Conserver la partie supérieure (le *Bit Tool Holder*) : la puce conserve sa lisibilité absolue !\n*   Dans l'interface logicielle de la C500, elle peut être effacée numériquement, ou réassignée à un nouvel outil instantanément. C'est un stock permanent de clés numériques sécurisant le process.\n"};
        
        const navList = document.getElementById('nav-list');
        const view = document.getElementById('view');
        
        function renderDoc(key) {
            view.innerHTML = marked.parse(docs[key]);
            mermaid.run({ nodes: view.querySelectorAll('.language-mermaid') });
            window.scrollTo(0, 0);
            document.querySelectorAll('.nav-item').forEach(el => { el.classList.toggle('active', el.dataset.key === key); });
            history.replaceState(null, null, '#' + encodeURIComponent(key));
        }
        
        let currentGroup = "";
        Object.keys(docs).forEach(label => {
            const [group, name] = label.split(': ');
            if (group !== currentGroup) {
                const groupEl = document.createElement('div');
                groupEl.className = 'nav-group';
                groupEl.innerText = group;
                navList.appendChild(groupEl);
                currentGroup = group;
            }
            const item = document.createElement('a');
            item.className = 'nav-item';
            item.innerText = name.replace(/_/g, ' ');
            item.dataset.key = label;
            item.onclick = () => renderDoc(label);
            navList.appendChild(item);
        });
        
        const hash = decodeURIComponent(window.location.hash.substring(1));
        if (hash && docs[hash]) { renderDoc(hash); } else { renderDoc("Fondations: 00_Index"); }
        
        view.addEventListener('click', (e) => {
            const link = e.target.closest('a');
            if (!link) return;
            const href = link.getAttribute('href');
            if (!href) return;
            if (href.startsWith('./') || href.endsWith('.md')) {
                e.preventDefault();
                const filename = href.replace('./', '').replace('.md', '');
                const match = Object.keys(docs).find(k => k.includes(filename));
                if (match) { renderDoc(match); }
            }
        });
    </script>
