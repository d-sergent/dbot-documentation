  <!-- Canvas Background -->
  <rect width="1400" height="860" fill="#0f172a"/>
  <rect width="1400" height="860" fill="url(#grid)"/>

  <!-- Title Banner -->
  <rect x="20" y="15" width="1360" height="65" rx="8" fill="url(#headerGrad)" stroke="#38bdf8" stroke-width="1.5"/>
  <text x="700" y="43" fill="#f8fafc" font-family="SF Pro Display, Inter, Arial, sans-serif" font-size="20" font-weight="bold" text-anchor="middle">ARCHITECTURE SYSTÈME — ÉCOSYSTÈME MCP ROBOTIQUE HUMANOÏDE D-BOT (43 DOF)</text>
  <text x="700" y="66" fill="#94a3b8" font-family="SF Mono, Menlo, monospace" font-size="13" text-anchor="middle">Orchestration Agentique Antigravity : CAO Fusion 360 / FreeCAD • FEA CalculiX • Simulation MuJoCo / Isaac • EDA KiCad • ROS 2 Jetson</text>

  <!-- Central Orchestrator Hub -->
  <rect x="440" y="100" width="520" height="125" rx="10" fill="url(#coreGrad)" stroke="#38bdf8" stroke-width="2"/>
  <text x="700" y="128" fill="#38bdf8" font-family="SF Pro Display, Inter, Arial, sans-serif" font-size="16" font-weight="bold" text-anchor="middle">ORCHESTRATEUR AGENTIQUE ANTIGRAVITY (macOS M1 Pro/Max 64 Go)</text>
  <text x="700" y="150" fill="#e2e8f0" font-family="SF Mono, Menlo, monospace" font-size="12" text-anchor="middle">mcp_config.json • Transport Stdio (uvx isolé) &amp; Streamable HTTP (127.0.0.1)</text>

  <!-- Active Core Services Inside Hub -->
  <rect x="460" y="165" width="230" height="46" rx="6" fill="#0f172a" stroke="#22d3ee" stroke-width="1.2"/>
  <text x="575" y="185" fill="#22d3ee" font-family="SF Mono, Menlo, monospace" font-size="12" font-weight="bold" text-anchor="middle">MCP dbot-rag [ACTIF]</text>
  <text x="575" y="202" fill="#94a3b8" font-family="SF Pro Display, Arial, sans-serif" font-size="11" text-anchor="middle">LightRAG + Graphe + Reranker BGE</text>

  <rect x="710" y="165" width="230" height="46" rx="6" fill="#0f172a" stroke="#34d399" stroke-width="1.2"/>
  <text x="825" y="185" fill="#34d399" font-family="SF Mono, Menlo, monospace" font-size="12" font-weight="bold" text-anchor="middle">Plugin Robotics [ACTIF]</text>
  <text x="825" y="202" fill="#94a3b8" font-family="SF Pro Display, Arial, sans-serif" font-size="11" text-anchor="middle">MuJoCo Studio, MJX, Audit &amp; Sim2Real</text>

  <!-- PANEL 1: CAO & METROLOGIE (Top Left) -->
  <rect x="25" y="265" width="660" height="235" rx="8" fill="url(#cadGrad)" stroke="#60a5fa" stroke-width="1.5"/>
  <rect x="25" y="265" width="660" height="32" rx="8" fill="#1e3a8a"/>
  <text x="355" y="286" fill="#f8fafc" font-family="SF Pro Display, Arial, sans-serif" font-size="14" font-weight="bold" text-anchor="middle">1. PÔLE CAO PARAMÉTRIQUE, MÉTROLOGIE &amp; SAUVEGARDE SOUVERAINE</text>

  <!-- Fusion 360 Box -->
  <rect x="45" y="312" width="300" height="170" rx="6" fill="#0f172a" stroke="#38bdf8" stroke-width="1.5"/>
  <text x="195" y="334" fill="#38bdf8" font-family="SF Mono, Menlo, monospace" font-size="13" font-weight="bold" text-anchor="middle">MCP Autodesk Fusion [ACTIF]</text>
  <text x="195" y="352" fill="#cbd5e1" font-family="SF Mono, Menlo, monospace" font-size="11" text-anchor="middle">http://127.0.0.1:27182/mcp</text>
  <text x="58" y="376" fill="#e2e8f0" font-family="SF Pro Display, Arial, sans-serif" font-size="11.5">• Lecture directe Torse-123 v49 (18,390 kg)</text>
  <text x="58" y="396" fill="#e2e8f0" font-family="SF Pro Display, Arial, sans-serif" font-size="11.5">• Audit santé timeline (28 défauts / 1478)</text>
  <text x="58" y="416" fill="#e2e8f0" font-family="SF Pro Display, Arial, sans-serif" font-size="11.5">• Snapshots PNG viewport pour schémas SVG</text>
  <text x="58" y="436" fill="#e2e8f0" font-family="SF Pro Display, Arial, sans-serif" font-size="11.5">• Recoupement BOM McMaster-Carr (627 occ.)</text>
  <text x="58" y="456" fill="#34d399" font-family="SF Mono, Menlo, monospace" font-size="10.5">Mode : readOnly=true par défaut</text>

