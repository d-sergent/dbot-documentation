  <text x="378" y="706" fill="#e2e8f0" font-family="SF Pro Display, Arial, sans-serif" font-size="11.5">• Validation couples crête Hip Pitch (120 Nm)</text>
  <text x="378" y="726" fill="#6ee7b7" font-family="SF Mono, Menlo, monospace" font-size="10.5">Pont Socket OmniGraph / PhysX</text>

