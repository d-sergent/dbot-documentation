  <text x="1068" y="376" fill="#e2e8f0" font-family="SF Pro Display, Arial, sans-serif" font-size="11.5">• Schémas PDB 48V Hot-Swap Oring (LTC4359)</text>
  <text x="1068" y="396" fill="#e2e8f0" font-family="SF Pro Display, Arial, sans-serif" font-size="11.5">• Audit ERC / DRC pistes fort courant 60A</text>
  <text x="1068" y="416" fill="#e2e8f0" font-family="SF Pro Display, Arial, sans-serif" font-size="11.5">• Adaptation impédance 120 Ohms CAN-FD</text>
