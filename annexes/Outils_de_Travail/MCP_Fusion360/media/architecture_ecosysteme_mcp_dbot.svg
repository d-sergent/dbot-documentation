  <text x="515" y="334" fill="#93c5fd" font-family="SF Mono, Menlo, monospace" font-size="13" font-weight="bold" text-anchor="middle">MCP FreeCAD (Open-Source)</text>
  <text x="515" y="352" fill="#cbd5e1" font-family="SF Mono, Menlo, monospace" font-size="11" text-anchor="middle">sandraschi / theosib / sathyavikram</text>
  <text x="378" y="376" fill="#e2e8f0" font-family="SF Pro Display, Arial, sans-serif" font-size="11.5">• Pérennité souveraine STEP AP214 -&gt; FCStd</text>
  <text x="378" y="396" fill="#e2e8f0" font-family="SF Pro Display, Arial, sans-serif" font-size="11.5">• Inspection topologique B-Rep &amp; volumes</text>
  <text x="378" y="416" fill="#e2e8f0" font-family="SF Pro Display, Arial, sans-serif" font-size="11.5">• Passerelle directe Atelier FEM / CalculiX</text>
