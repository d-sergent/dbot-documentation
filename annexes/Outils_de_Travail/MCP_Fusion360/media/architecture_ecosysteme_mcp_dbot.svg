  <text x="195" y="622" fill="#cbd5e1" font-family="SF Mono, Menlo, monospace" font-size="11" text-anchor="middle">Plugin Robotics + mjlab-mcp-server</text>
  <text x="58" y="646" fill="#e2e8f0" font-family="SF Pro Display, Arial, sans-serif" font-size="11.5">• Conversion &amp; audit URDF -&gt; MJCF (10 tests)</text>
