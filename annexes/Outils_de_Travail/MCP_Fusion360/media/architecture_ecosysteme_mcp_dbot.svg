  <text x="378" y="646" fill="#e2e8f0" font-family="SF Pro Display, Arial, sans-serif" font-size="11.5">• Jumeau numérique photoréaliste Omniverse</text>
  <text x="378" y="666" fill="#e2e8f0" font-family="SF Pro Display, Arial, sans-serif" font-size="11.5">• Simulation caméra stéréo OAK-D Pro FF</text>
