  <text x="748" y="396" fill="#e2e8f0" font-family="SF Pro Display, Arial, sans-serif" font-size="11.5">• Statique linéaire Von Mises (Alu 7075-T6)</text>
  <text x="748" y="416" fill="#e2e8f0" font-family="SF Pro Display, Arial, sans-serif" font-size="11.5">• Analyse modale tronc complet (f0 &gt; 30 Hz)</text>
  <text x="748" y="436" fill="#e2e8f0" font-family="SF Pro Display, Arial, sans-serif" font-size="11.5">• Flambement colonnes 20x20 &amp; chocs 2,5 g</text>
  <text x="748" y="456" fill="#c084fc" font-family="SF Mono, Menlo, monospace" font-size="10.5">Entrée : STEP + Contrats physiques</text>

