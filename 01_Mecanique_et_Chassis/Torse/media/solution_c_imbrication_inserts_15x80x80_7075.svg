<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 500" font-family="'Consolas', 'Courier New', monospace">
  <defs>
    <pattern id="grid" width="10" height="10" patternUnits="userSpaceOnUse">
      <path d="M 10 0 L 0 0 0 10" fill="none" stroke="#2a324b" stroke-width="0.3"/>
    </pattern>
    <marker id="arrow" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6" fill="#60a5fa"/>
    </marker>
    <marker id="arrow-rev" markerWidth="8" markerHeight="6" refX="0" refY="3" orient="auto">
      <path d="M8,0 L0,3 L8,6" fill="#60a5fa"/>
    </marker>
    <marker id="arrow-green" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6" fill="#4ade80"/>
    </marker>
    <marker id="arrow-green-rev" markerWidth="8" markerHeight="6" refX="0" refY="3" orient="auto">
      <path d="M8,0 L0,3 L8,6" fill="#4ade80"/>
    </marker>
  </defs>

  <!-- Background -->
  <rect width="1200" height="500" fill="#0f172a"/>
  <rect width="1200" height="500" fill="url(#grid)"/>

  <!-- Title -->
  <text x="600" y="30" text-anchor="middle" fill="#f8fafc" font-size="16" font-weight="bold">IMBRICATION INSERTS COLONNE — BRUT 15×80×80 mm ALU 7075-T6 (Révision V2.1)</text>

  <!-- ============ PANEL 1: Imbrication 2D ============ -->
  <rect x="20" y="45" width="370" height="440" rx="6" fill="#1e293b" stroke="#334155" stroke-width="1"/>
  <text x="205" y="68" text-anchor="middle" fill="#93c5fd" font-size="12" font-weight="bold">PANEL 1 — Imbrication 2D dans Brut 80×80 mm</text>

  <!-- Brut block outline -->
  <rect x="80" y="100" width="240" height="240" fill="none" stroke="#60a5fa" stroke-width="2" stroke-dasharray="6,3"/>
  <text x="200" y="95" text-anchor="middle" fill="#60a5fa" font-size="10">Brut Blockenstock 80 × 80 mm</text>

  <!-- Insert outline (centered in brut) -->
  <rect x="116" y="136" width="168" height="168" rx="4" fill="#1e3a5f" stroke="#fbbf24" stroke-width="2"/>
  <text x="200" y="230" text-anchor="middle" fill="#fbbf24" font-size="11" font-weight="bold">Insert 55,8 × 55,8 mm</text>
  <text x="200" y="245" text-anchor="middle" fill="#94a3b8" font-size="9">(h = 15,0 mm, R = 3 mm)</text>

  <!-- Poche centrale -->
  <rect x="148" y="168" width="104" height="104" rx="6" fill="#0f172a" stroke="#f97316" stroke-width="1.5" stroke-dasharray="4,2"/>
  <text x="200" y="225" text-anchor="middle" fill="#f97316" font-size="9">Poche 44×44 R5</text>
  <text x="200" y="237" text-anchor="middle" fill="#94a3b8" font-size="8">Prof. 10 mm</text>

  <!-- Vis M5 hole -->
  <circle cx="200" cy="170" r="4" fill="none" stroke="#ef4444" stroke-width="1.5"/>
  <circle cx="200" cy="170" r="1.5" fill="#ef4444"/>
  <text x="215" y="165" fill="#ef4444" font-size="8">Ø5,3 mm</text>
  <text x="215" y="175" fill="#ef4444" font-size="8">X = 7,5 mm</text>

  <!-- 4 FHC M4 holes -->
  <circle cx="160" cy="178" r="3" fill="none" stroke="#a78bfa" stroke-width="1"/>
  <circle cx="240" cy="178" r="3" fill="none" stroke="#a78bfa" stroke-width="1"/>
  <circle cx="160" cy="258" r="3" fill="none" stroke="#a78bfa" stroke-width="1"/>
  <circle cx="240" cy="258" r="3" fill="none" stroke="#a78bfa" stroke-width="1"/>
  <text x="200" y="285" text-anchor="middle" fill="#a78bfa" font-size="8">4× FHC M4 (42×42 mm)</text>

  <!-- Dimension lines — Left margin -->
  <line x1="75" y1="136" x2="75" y2="100" stroke="#4ade80" stroke-width="0.8" marker-start="url(#arrow-green-rev)" marker-end="url(#arrow-green)"/>
  <text x="70" y="122" text-anchor="end" fill="#4ade80" font-size="9">12,1</text>

  <!-- Dimension lines — Right margin -->
  <line x1="325" y1="136" x2="325" y2="100" stroke="#4ade80" stroke-width="0.8" marker-start="url(#arrow-green-rev)" marker-end="url(#arrow-green)"/>
  <text x="337" y="122" fill="#4ade80" font-size="9">12,1</text>

  <!-- Bottom margin -->
  <line x1="116" y1="345" x2="80" y2="345" stroke="#4ade80" stroke-width="0.8" marker-start="url(#arrow-green-rev)" marker-end="url(#arrow-green)"/>
  <text x="98" y="358" text-anchor="middle" fill="#4ade80" font-size="9">12,1</text>

  <!-- Brut width dimension -->
  <line x1="80" y1="365" x2="320" y2="365" stroke="#60a5fa" stroke-width="0.8" marker-start="url(#arrow-rev)" marker-end="url(#arrow)"/>
  <text x="200" y="380" text-anchor="middle" fill="#60a5fa" font-size="10" font-weight="bold">80,0 mm</text>

  <!-- Insert width dimension -->
  <line x1="116" y1="395" x2="284" y2="395" stroke="#fbbf24" stroke-width="0.8" marker-start="url(#arrow-rev)" marker-end="url(#arrow)"/>
  <text x="200" y="410" text-anchor="middle" fill="#fbbf24" font-size="10">55,8 mm</text>

  <!-- Sourcing info -->
  <rect x="55" y="420" width="300" height="55" rx="4" fill="#1a2744" stroke="#4ade80" stroke-width="1"/>
  <text x="205" y="438" text-anchor="middle" fill="#4ade80" font-size="10" font-weight="bold">1 bloc / insert → 2 blocs requis</text>
  <text x="205" y="453" text-anchor="middle" fill="#f8fafc" font-size="10">Blockenstock 15×80×80 mm 7075-T6</text>
  <text x="205" y="468" text-anchor="middle" fill="#fbbf24" font-size="11" font-weight="bold">7,20 € TTC / bloc → 14,40 € total</text>

  <!-- ============ PANEL 2: Coupe en épaisseur ============ -->
  <rect x="410" y="45" width="370" height="440" rx="6" fill="#1e293b" stroke="#334155" stroke-width="1"/>
  <text x="595" y="68" text-anchor="middle" fill="#93c5fd" font-size="12" font-weight="bold">PANEL 2 — Cotation Insert 15,0 mm (Coupe axiale)</text>

  <!-- Insert cross-section (side view) -->
  <rect x="460" y="120" width="260" height="100" rx="3" fill="#1e3a5f" stroke="#fbbf24" stroke-width="2"/>

  <!-- Poche cutout -->
  <rect x="524" y="120" width="130" height="66" rx="4" fill="#0f172a" stroke="#f97316" stroke-width="1.5"/>
  <text x="589" y="155" text-anchor="middle" fill="#f97316" font-size="9">Poche 44×44</text>
  <text x="589" y="167" text-anchor="middle" fill="#94a3b8" font-size="8">Prof. 10 mm</text>

  <!-- Plancher -->
  <line x1="524" y1="186" x2="654" y2="186" stroke="#f97316" stroke-width="0.5" stroke-dasharray="3,2"/>
  <text x="589" y="203" text-anchor="middle" fill="#94a3b8" font-size="8">Plancher 5,0 mm</text>

  <!-- Insert height dimension (left) -->
  <line x1="445" y1="120" x2="445" y2="220" stroke="#fbbf24" stroke-width="0.8" marker-start="url(#arrow-rev)" marker-end="url(#arrow)"/>
  <text x="438" y="175" text-anchor="end" fill="#fbbf24" font-size="11" font-weight="bold">15,0</text>

  <!-- Poche depth dimension (right) -->
  <line x1="735" y1="120" x2="735" y2="186" stroke="#f97316" stroke-width="0.8" marker-start="url(#arrow-rev)" marker-end="url(#arrow)"/>
  <text x="752" y="158" fill="#f97316" font-size="9">10,0</text>

  <!-- Plancher dimension -->
  <line x1="735" y1="186" x2="735" y2="220" stroke="#94a3b8" stroke-width="0.8" marker-start="url(#arrow-rev)" marker-end="url(#arrow)"/>
  <text x="752" y="208" fill="#94a3b8" font-size="9">5,0</text>

  <!-- Vis M5 hole -->
  <line x1="489" y1="115" x2="489" y2="225" stroke="#ef4444" stroke-width="1.5" stroke-dasharray="4,2"/>
  <circle cx="489" cy="115" r="3" fill="#ef4444"/>
  <text x="489" y="240" text-anchor="middle" fill="#ef4444" font-size="9">Vis M5×70</text>
  <text x="489" y="252" text-anchor="middle" fill="#ef4444" font-size="9">X = 7,5 mm</text>

  <!-- Pince dimension -->
  <line x1="460" y1="260" x2="489" y2="260" stroke="#4ade80" stroke-width="0.8" marker-start="url(#arrow-green-rev)" marker-end="url(#arrow-green)"/>
  <text x="474" y="275" text-anchor="middle" fill="#4ade80" font-size="8">7,5</text>

  <!-- Pince annotations -->
  <line x1="460" y1="282" x2="487" y2="282" stroke="#4ade80" stroke-width="0.5"/>
  <text x="474" y="295" text-anchor="middle" fill="#4ade80" font-size="7">Pince = 4,85 mm</text>

  <!-- Width dimension -->
  <line x1="460" y1="310" x2="720" y2="310" stroke="#fbbf24" stroke-width="0.8" marker-start="url(#arrow-rev)" marker-end="url(#arrow)"/>
  <text x="590" y="325" text-anchor="middle" fill="#fbbf24" font-size="10">55,8 mm</text>

  <!-- Comparison table -->
  <rect x="435" y="345" width="320" height="130" rx="4" fill="#1a2744" stroke="#334155" stroke-width="1"/>
  <text x="595" y="365" text-anchor="middle" fill="#93c5fd" font-size="10" font-weight="bold">Comparatif Insert V2 → V2.1</text>

  <text x="445" y="385" fill="#94a3b8" font-size="9">Paramètre</text>
  <text x="590" y="385" text-anchor="middle" fill="#94a3b8" font-size="9">V2 (20 mm)</text>
  <text x="720" y="385" text-anchor="end" fill="#4ade80" font-size="9">V2.1 (15 mm)</text>
  <line x1="440" y1="390" x2="750" y2="390" stroke="#334155" stroke-width="0.5"/>

  <text x="445" y="405" fill="#f8fafc" font-size="9">Masse unitaire</text>
  <text x="590" y="405" text-anchor="middle" fill="#f8fafc" font-size="9">34,0 g</text>
  <text x="720" y="405" text-anchor="end" fill="#4ade80" font-size="9" font-weight="bold">25,5 g (-25%)</text>

  <text x="445" y="422" fill="#f8fafc" font-size="9">Brut (coût)</text>
  <text x="590" y="422" text-anchor="middle" fill="#f8fafc" font-size="9">16,80 €</text>
  <text x="720" y="422" text-anchor="end" fill="#4ade80" font-size="9" font-weight="bold">14,40 € (-14%)</text>

  <text x="445" y="439" fill="#f8fafc" font-size="9">Sf torsion</text>
  <text x="590" y="439" text-anchor="middle" fill="#f8fafc" font-size="9">> 150</text>
  <text x="720" y="439" text-anchor="end" fill="#4ade80" font-size="9" font-weight="bold">> 100 ✅</text>

  <text x="445" y="456" fill="#f8fafc" font-size="9">Sf flexion</text>
  <text x="590" y="456" text-anchor="middle" fill="#f8fafc" font-size="9">> 30</text>
  <text x="720" y="456" text-anchor="end" fill="#4ade80" font-size="9" font-weight="bold">> 72 ✅</text>

  <text x="445" y="473" fill="#f8fafc" font-size="9">Vis M5 position</text>
  <text x="590" y="473" text-anchor="middle" fill="#f8fafc" font-size="9">X = 10,0 mm</text>
  <text x="720" y="473" text-anchor="end" fill="#4ade80" font-size="9" font-weight="bold">X = 7,5 mm</text>

  <!-- ============ PANEL 3: Récapitulatif global ============ -->
  <rect x="800" y="45" width="380" height="440" rx="6" fill="#1e293b" stroke="#334155" stroke-width="1"/>
  <text x="990" y="68" text-anchor="middle" fill="#93c5fd" font-size="12" font-weight="bold">PANEL 3 — Récapitulatif Matière 100% 7075-T6</text>

  <!-- BOM lines -->
  <rect x="820" y="85" width="340" height="28" rx="3" fill="#1e3a5f" stroke="#fbbf24" stroke-width="1"/>
  <text x="830" y="103" fill="#fbbf24" font-size="10" font-weight="bold">Inserts Colonne (×2)</text>
  <text x="1145" y="103" text-anchor="end" fill="#f8fafc" font-size="10">15×80×80 mm → 14,40 €</text>

  <rect x="820" y="120" width="340" height="28" rx="3" fill="#1e3a5f" stroke="#60a5fa" stroke-width="1"/>
  <text x="830" y="138" fill="#60a5fa" font-size="10" font-weight="bold">Brides Monoblocs (×2)</text>
  <text x="1145" y="138" text-anchor="end" fill="#f8fafc" font-size="10">Ø120×50 mm → 60,00 €</text>

  <rect x="820" y="155" width="340" height="28" rx="3" fill="#1e3a5f" stroke="#60a5fa" stroke-width="1"/>
  <text x="830" y="173" fill="#60a5fa" font-size="10" font-weight="bold">Semelles Éclisses (×2)</text>
  <text x="1145" y="173" text-anchor="end" fill="#f8fafc" font-size="10">5×160×160 mm → 19,20 €</text>

  <rect x="820" y="190" width="340" height="28" rx="3" fill="#1e3a5f" stroke="#60a5fa" stroke-width="1"/>
  <text x="830" y="208" fill="#60a5fa" font-size="10" font-weight="bold">Colonne Sagittale</text>
  <text x="1145" y="208" text-anchor="end" fill="#f8fafc" font-size="10">5×100×495 mm → 18,16 €</text>

  <rect x="820" y="225" width="340" height="28" rx="3" fill="#1e3a5f" stroke="#a78bfa" stroke-width="1"/>
  <text x="830" y="243" fill="#a78bfa" font-size="10" font-weight="bold">Tube Carré 6060-T6</text>
  <text x="1145" y="243" text-anchor="end" fill="#f8fafc" font-size="10">60×2×500 mm → 12,80 €</text>

  <!-- Total matière -->
  <rect x="820" y="270" width="340" height="35" rx="4" fill="#1a2744" stroke="#4ade80" stroke-width="1.5"/>
  <text x="830" y="292" fill="#4ade80" font-size="11" font-weight="bold">TOTAL MATIÈRE ALU</text>
  <text x="1145" y="292" text-anchor="end" fill="#4ade80" font-size="13" font-weight="bold">124,56 € TTC</text>

  <!-- Mass summary -->
  <rect x="820" y="320" width="340" height="155" rx="4" fill="#1a2744" stroke="#fbbf24" stroke-width="1"/>
  <text x="990" y="342" text-anchor="middle" fill="#fbbf24" font-size="11" font-weight="bold">BILAN DE MASSE V2.1</text>

  <text x="830" y="362" fill="#f8fafc" font-size="9">2× Brides monoblocs</text>
  <text x="1145" y="362" text-anchor="end" fill="#f8fafc" font-size="9">176,0 g</text>

  <text x="830" y="379" fill="#f8fafc" font-size="9">2× Tubes carrés 60×60</text>
  <text x="1145" y="379" text-anchor="end" fill="#f8fafc" font-size="9">210,0 g</text>

  <text x="830" y="396" fill="#4ade80" font-size="9" font-weight="bold">2× Inserts 15 mm</text>
  <text x="1145" y="396" text-anchor="end" fill="#4ade80" font-size="9" font-weight="bold">51,0 g (was 68 g)</text>

  <text x="830" y="413" fill="#f8fafc" font-size="9">2× Semelles éclisses</text>
  <text x="1145" y="413" text-anchor="end" fill="#f8fafc" font-size="9">112,0 g</text>

  <text x="830" y="430" fill="#f8fafc" font-size="9">Colonne sagittale évidée</text>
  <text x="1145" y="430" text-anchor="end" fill="#f8fafc" font-size="9">315,0 g</text>

  <line x1="825" y1="438" x2="1155" y2="438" stroke="#fbbf24" stroke-width="0.5"/>
  <text x="830" y="455" fill="#fbbf24" font-size="10" font-weight="bold">SQUELETTE COMPLET</text>
  <text x="1145" y="455" text-anchor="end" fill="#fbbf24" font-size="12" font-weight="bold">1 124 g</text>
  <text x="1145" y="470" text-anchor="end" fill="#4ade80" font-size="9">(-17 g vs V2)</text>
</svg>
