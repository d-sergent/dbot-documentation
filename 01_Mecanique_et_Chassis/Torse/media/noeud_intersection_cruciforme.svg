<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 440" width="100%" height="100%">
  <defs>
    <pattern id="grid" width="20" height="20" patternUnits="userSpaceOnUse">
      <path d="M 20 0 L 0 0 0 20" fill="none" stroke="#2a324b" stroke-width="0.8"/>
    </pattern>

    <linearGradient id="aluMale" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#e2e8f0"/>
      <stop offset="50%" stop-color="#94a3b8"/>
      <stop offset="100%" stop-color="#475569"/>
    </linearGradient>

    <linearGradient id="aluFemale" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#cbd5e0"/>
      <stop offset="50%" stop-color="#64748b"/>
      <stop offset="100%" stop-color="#334155"/>
    </linearGradient>

    <linearGradient id="carbonGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="50%" stop-color="#334155"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>

    <linearGradient id="plateGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#0284c7"/>
    </linearGradient>
  </defs>

  <rect width="100%" height="100%" fill="#0f172a"/>
  <rect width="100%" height="100%" fill="url(#grid)"/>

  <!-- Main Title -->
  <text x="430" y="26" fill="#f8fafc" font-family="system-ui, sans-serif" font-size="14" font-weight="bold" text-anchor="middle">
    NŒUD D'INTERSECTION CRUCIFORME CNC — DÉTAIL DU TROU Ø38mm DANS LA PLAQUE 5mm
  </text>

  <!-- Left Panel: Exploded 3D Assembly View with Hole Ø38mm -->
  <g transform="translate(30, 45)">
    <rect width="500" height="370" rx="8" fill="#1e293b" stroke="#334155" stroke-width="1.5"/>
    <text x="250" y="24" fill="#38bdf8" font-family="system-ui, sans-serif" font-size="12" font-weight="bold" text-anchor="middle">
      1. Vue éclatée 3D avec Trou Traversant Ø38mm
    </text>

    <!-- Center Axis Line -->
    <line x1="20" y1="210" x2="480" y2="210" stroke="#00f2fe" stroke-width="1.5" stroke-dasharray="6,3"/>

    <!-- 1. Bride Mâle (Side A - Left) -->
    <g transform="translate(100, 110)">
      <rect width="60" height="150" rx="4" fill="url(#aluMale)" stroke="#ffffff" stroke-width="1"/>
      <rect x="60" y="20" width="16" height="170" rx="3" fill="url(#aluMale)" stroke="#ffffff" stroke-width="1.5"/>
      <text x="68" y="202" fill="#cbd5e0" font-family="system-ui, sans-serif" font-size="8" font-weight="bold" text-anchor="middle">Rebord Mâle</text>

      <!-- Male Centering Spigot Ø38mm -->
      <rect x="76" y="45" width="24" height="120" rx="2" fill="url(#aluMale)" stroke="#f59e0b" stroke-width="1.5"/>
      <text x="88" y="40" fill="#f59e0b" font-family="system-ui, sans-serif" font-size="8" font-weight="bold" text-anchor="middle">Fût Mâle Ø38mm</text>

      <!-- Vertical Slit Side A -->
      <rect x="0" y="10" width="60" height="4" fill="#0f172a"/>

      <!-- 2 Pinch Screws Side A -->
      <line x1="18" y1="-5" x2="18" y2="25" stroke="#ef4444" stroke-width="3"/>
      <line x1="42" y1="-5" x2="42" y2="25" stroke="#ef4444" stroke-width="3"/>
      <circle cx="18" cy="-5" r="3.5" fill="#ef4444"/>
      <circle cx="42" cy="-5" r="3.5" fill="#ef4444"/>
      <text x="30" y="-12" fill="#ef4444" font-family="system-ui, sans-serif" font-size="8" font-weight="bold" text-anchor="middle">2× Vis M4 Side A</text>
      <text x="30" y="90" fill="#ffffff" font-family="system-ui, sans-serif" font-size="9" font-weight="bold">BRIDE MÂLE</text>
    </g>

    <!-- 2. Spine Plate 5mm with CLEAR CUTOUT HOLE Ø38mm -->
    <g transform="translate(230, 70)">
      <!-- Top Part of Plate -->
      <path d="M 0 0 L 16 0 L 16 95 L 0 95 Z" fill="url(#plateGrad)" stroke="#ffffff" stroke-width="1.5"/>
      <!-- Hole Ø38.1mm Boundary Cutout (Visible Gap) -->
      <ellipse cx="8" cy="135" rx="10" ry="40" fill="none" stroke="#f59e0b" stroke-width="2" stroke-dasharray="4,2"/>
      <!-- Bottom Part of Plate -->
      <path d="M 0 175 L 16 175 L 16 270 L 0 270 Z" fill="url(#plateGrad)" stroke="#ffffff" stroke-width="1.5"/>

      <text x="8" y="-10" fill="#38bdf8" font-family="system-ui, sans-serif" font-size="9" font-weight="bold" text-anchor="middle">Plaque 5mm</text>
      <text x="8" y="285" fill="#f59e0b" font-family="system-ui, sans-serif" font-size="9" font-weight="bold" text-anchor="middle">Trou Ø38,1mm</text>
    </g>

    <!-- 3. Bride Femelle (Side B - Right) -->
    <g transform="translate(285, 110)">
      <rect x="0" y="20" width="16" height="170" rx="3" fill="url(#aluFemale)" stroke="#ffffff" stroke-width="1.5"/>
      <text x="8" y="202" fill="#cbd5e0" font-family="system-ui, sans-serif" font-size="8" font-weight="bold" text-anchor="middle">Rebord Femelle</text>
      <rect x="16" y="0" width="60" height="150" rx="4" fill="url(#aluFemale)" stroke="#ffffff" stroke-width="1"/>

      <!-- Vertical Slit Side B -->
      <rect x="16" y="10" width="60" height="4" fill="#0f172a"/>

      <!-- 2 Pinch Screws Side B -->
      <line x1="34" y1="-5" x2="34" y2="25" stroke="#ef4444" stroke-width="3"/>
      <line x1="58" y1="-5" x2="58" y2="25" stroke="#ef4444" stroke-width="3"/>
      <circle cx="34" cy="-5" r="3.5" fill="#ef4444"/>
      <circle cx="58" cy="-5" r="3.5" fill="#ef4444"/>
      <text x="46" y="-12" fill="#ef4444" font-family="system-ui, sans-serif" font-size="8" font-weight="bold" text-anchor="middle">2× Vis M4 Side B</text>
      <text x="45" y="90" fill="#ffffff" font-family="system-ui, sans-serif" font-size="9" font-weight="bold">BRIDE FEMELLE</text>
    </g>

    <!-- 4 Screws Clamping Sandwich -->
    <g transform="translate(50, 110)">
      <line x1="0" y1="30" x2="320" y2="30" stroke="#38bdf8" stroke-width="2.5"/>
      <line x1="0" y1="180" x2="320" y2="180" stroke="#38bdf8" stroke-width="2.5"/>
      <circle cx="-5" cy="30" r="5" fill="#38bdf8"/>
      <circle cx="-5" cy="180" r="5" fill="#38bdf8"/>
      <text x="160" y="22" fill="#38bdf8" font-family="system-ui, sans-serif" font-size="8" font-weight="bold" text-anchor="middle">4× Vis M4 d'Assemblage Sandwich (Haut &amp; Bas)</text>
    </g>

    <!-- Carbon Tube Ø30mm passing through the Ø38mm Hole -->
    <rect x="20" y="195" width="460" height="30" rx="3" fill="url(#carbonGrad)" stroke="#00f2fe" stroke-width="1.5" opacity="0.95"/>
    <text x="40" y="214" fill="#00f2fe" font-family="system-ui, sans-serif" font-size="9" font-weight="bold">Tube Carbone Ø30mm traversant le Trou Ø38mm</text>
  </g>

  <!-- Right Panel: Cross-Section Detail Section A-A -->
  <g transform="translate(550, 45)">
    <rect width="280" height="370" rx="8" fill="#1e293b" stroke="#334155" stroke-width="1.5"/>
    <text x="140" y="24" fill="#38bdf8" font-family="system-ui, sans-serif" font-size="12" font-weight="bold" text-anchor="middle">
      2. Coupe A-A Trou Ø38mm &amp; Fût
    </text>

    <!-- Longitudinal Section View -->
    <g transform="translate(20, 40)">
      <rect width="240" height="170" rx="6" fill="#0f172a" stroke="#475569" stroke-width="1"/>
      <text x="120" y="18" fill="#cbd5e0" font-family="system-ui, sans-serif" font-size="9" font-weight="bold" text-anchor="middle">Emboîtement Fût / Trou Ø38mm</text>

      <!-- Spine Plate Top Part -->
      <rect x="114" y="25" width="12" height="40" fill="#38bdf8" stroke="#ffffff" stroke-width="1"/>
      <!-- Spine Plate Bottom Part -->
      <rect x="114" y="105" width="12" height="40" fill="#38bdf8" stroke="#ffffff" stroke-width="1"/>

      <!-- Tube Carbone Ø30mm -->
      <rect x="10" y="75" width="220" height="20" fill="url(#carbonGrad)" stroke="#00f2fe" stroke-width="1"/>

      <!-- Bride Mâle Top & Bottom (Left) -->
      <rect x="50" y="35" width="52" height="100" fill="url(#aluMale)" stroke="#ffffff" stroke-width="1"/>
      <rect x="102" y="25" width="12" height="120" fill="url(#aluMale)" stroke="#ffffff" stroke-width="1"/>

      <!-- Male Spigot passing through hole Ø38mm -->
      <rect x="114" y="45" width="24" height="20" fill="url(#aluMale)" stroke="#f59e0b" stroke-width="1"/>
      <rect x="114" y="105" width="24" height="20" fill="url(#aluMale)" stroke="#f59e0b" stroke-width="1"/>

      <!-- Bride Femelle Top & Bottom (Right) -->
      <rect x="126" y="25" width="12" height="120" fill="url(#aluFemale)" stroke="#ffffff" stroke-width="1"/>
      <rect x="138" y="35" width="52" height="100" fill="url(#aluFemale)" stroke="#ffffff" stroke-width="1"/>

      <text x="120" y="160" fill="#f59e0b" font-family="system-ui, sans-serif" font-size="8" font-weight="bold" text-anchor="middle">Fût Mâle ajusté dans Trou Ø38.1mm</text>
    </g>

    <!-- Key Advantages List -->
    <g transform="translate(20, 230)">
      <text x="0" y="15" fill="#f8fafc" font-family="system-ui, sans-serif" font-size="10" font-weight="bold">Lumière / Perçage Plaque 5mm :</text>
      <text x="10" y="35" fill="#cbd5e0" font-family="system-ui, sans-serif" font-size="9">✓ Trou circulaire ouvert de **Ø38,1 mm**</text>
      <text x="10" y="55" fill="#cbd5e0" font-family="system-ui, sans-serif" font-size="9">✓ Le fût mâle Ø38mm traverse le trou</text>
      <text x="10" y="75" fill="#38bdf8" font-family="system-ui, sans-serif" font-size="9" font-weight="bold">✓ Le tube Ø30mm passe librement au centre</text>
    </g>
  </g>
</svg>
