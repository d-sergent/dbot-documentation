<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 360" width="100%" height="100%">
  <defs>
    <pattern id="grid" width="20" height="20" patternUnits="userSpaceOnUse">
      <path d="M 20 0 L 0 0 0 20" fill="none" stroke="#2a324b" stroke-width="0.8"/>
    </pattern>
    <linearGradient id="aluGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#cbd5e0"/>
      <stop offset="100%" stop-color="#64748b"/>
    </linearGradient>
    <linearGradient id="plateGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#0284c7"/>
    </linearGradient>
  </defs>

  <rect width="100%" height="100%" fill="#0f172a"/>
  <rect width="100%" height="100%" fill="url(#grid)"/>

  <!-- Title -->
  <text x="400" y="28" fill="#f8fafc" font-family="system-ui, sans-serif" font-size="14" font-weight="bold" text-anchor="middle">
    SOLUTION DE LIAISON HAUTE ET BASSE — ÉQUERRES CNC EN SANDWICH (L-BRACKETS)
  </text>

  <!-- Left Panel: Section View -->
  <g transform="translate(40, 50)">
    <rect width="340" height="270" rx="8" fill="#1e293b" stroke="#334155" stroke-width="1.5"/>
    <text x="170" y="25" fill="#38bdf8" font-family="system-ui, sans-serif" font-size="12" font-weight="bold" text-anchor="middle">
      Vue en Coupe Transversale
    </text>

    <!-- Horizontal Base Plate (Waist / Neck Plate Alu 5-6mm) -->
    <rect x="30" y="220" width="280" height="20" fill="url(#aluGrad)" stroke="#e2e8f0" stroke-width="1"/>
    <text x="170" y="254" fill="#cbd5e0" font-family="system-ui, sans-serif" font-size="9" text-anchor="middle">
      Plaque Circulaire Alu (Cou ou Taille)
    </text>

    <!-- Vertical Spine Plate 5mm -->
    <rect x="160" y="40" width="20" height="180" fill="url(#plateGrad)" stroke="#38bdf8" stroke-width="1"/>
    <text x="170" y="110" fill="#0f172a" font-family="system-ui, sans-serif" font-size="9" font-weight="bold" text-anchor="middle" transform="rotate(-90 170 110)">
      Colonne Vertébrale (5 mm)
    </text>

    <!-- Left L-Bracket CNC Alu -->
    <path d="M 100 220 L 160 220 L 160 140 L 130 140 L 130 190 L 100 190 Z" fill="#94a3b8" stroke="#ffffff" stroke-width="1.5"/>

    <!-- Right L-Bracket CNC Alu -->
    <path d="M 240 220 L 180 220 L 180 140 L 210 140 L 210 190 L 240 190 Z" fill="#94a3b8" stroke="#ffffff" stroke-width="1.5"/>

    <!-- Transverse Screw M4 (Sandwich Clamping) -->
    <line x1="90" y1="165" x2="250" y2="165" stroke="#ef4444" stroke-width="3"/>
    <circle cx="95" cy="165" r="5" fill="#ef4444"/>
    <circle cx="245" cy="165" r="5" fill="#ef4444"/>
    <text x="170" y="158" fill="#f8fafc" font-family="system-ui, sans-serif" font-size="8" font-weight="bold" text-anchor="middle">Vis Traversante M4 (Pincement)</text>

    <!-- Vertical Screws M5 (Fixation Plaque Circulaire) -->
    <line x1="115" y1="180" x2="115" y2="250" stroke="#f59e0b" stroke-width="3"/>
    <line x1="225" y1="180" x2="225" y2="250" stroke="#f59e0b" stroke-width="3"/>
    <text x="115" y="260" fill="#f59e0b" font-family="system-ui, sans-serif" font-size="8" font-weight="bold" text-anchor="middle">Vis M5</text>
    <text x="225" y="260" fill="#f59e0b" font-family="system-ui, sans-serif" font-size="8" font-weight="bold" text-anchor="middle">Vis M5</text>
  </g>

  <!-- Right Panel: Isometric Assembly Principle -->
  <g transform="translate(420, 50)">
    <rect width="340" height="270" rx="8" fill="#1e293b" stroke="#334155" stroke-width="1.5"/>
    <text x="170" y="25" fill="#38bdf8" font-family="system-ui, sans-serif" font-size="12" font-weight="bold" text-anchor="middle">
      Principe du Pincement en Sandwich
    </text>

    <text x="20" y="60" fill="#f8fafc" font-family="system-ui, sans-serif" font-size="10" font-weight="bold">1. Équerres CNC Alu 6061-T6 (G + D) :</text>
    <text x="35" y="80" fill="#cbd5e0" font-family="system-ui, sans-serif" font-size="9">• 2 cornières en L enserrent la tôle de 5 mm</text>
    <text x="35" y="98" fill="#cbd5e0" font-family="system-ui, sans-serif" font-size="9">• 3 à 4 vis M4 traversent la tôle de 5 mm</text>

    <text x="20" y="130" fill="#f8fafc" font-family="system-ui, sans-serif" font-size="10" font-weight="bold">2. Zéro Taraudage dans la Tranche :</text>
    <text x="35" y="150" fill="#cbd5e0" font-family="system-ui, sans-serif" font-size="9">• Transmission des efforts par cisaillement pur</text>
    <text x="35" y="168" fill="#cbd5e0" font-family="system-ui, sans-serif" font-size="9">• Surface de contact multipliée par x20</text>

    <text x="20" y="200" fill="#f8fafc" font-family="system-ui, sans-serif" font-size="10" font-weight="bold">3. Rigidité &amp; Démontabilité :</text>
    <text x="35" y="220" fill="#38bdf8" font-family="system-ui, sans-serif" font-size="9" font-weight="bold">• Écrous frein Nylostop sur vis M4</text>
    <text x="35" y="238" fill="#38bdf8" font-family="system-ui, sans-serif" font-size="9" font-weight="bold">• Plaquage parfait sur la embase circulaire</text>
  </g>
</svg>
