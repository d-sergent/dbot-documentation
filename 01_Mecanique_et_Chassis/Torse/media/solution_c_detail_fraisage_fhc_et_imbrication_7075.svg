<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 960" width="100%" height="100%">
  <defs>
    <!-- Background Grid Pattern -->
    <pattern id="grid-pattern-fhc" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#1e293b" stroke-width="1" />
      <path d="M 200 0 L 0 0 0 200" fill="none" stroke="#2a324b" stroke-width="1.5" />
    </pattern>

    <!-- Gradients -->
    <linearGradient id="grad-sky-fhc" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#0284c7" />
    </linearGradient>
    <linearGradient id="grad-amber-fhc" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f59e0b" />
      <stop offset="100%" stop-color="#b45309" />
    </linearGradient>
    <linearGradient id="grad-emerald-fhc" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981" />
      <stop offset="100%" stop-color="#047857" />
    </linearGradient>
    <linearGradient id="grad-card-fhc" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" stop-opacity="0.95" />
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0.95" />
    </linearGradient>

    <!-- Drop Shadow Filter -->
    <filter id="drop-shadow-fhc" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#000000" flood-opacity="0.6" />
    </filter>
  </defs>

  <!-- Background Base -->
  <rect width="1400" height="960" fill="#0b1120" />
  <rect width="1400" height="960" fill="url(#grid-pattern-fhc)" />

  <!-- HEADER -->
  <g transform="translate(40, 30)">
    <rect width="1320" height="70" rx="8" fill="#1e293b" stroke="#334155" stroke-width="1.5" filter="url(#drop-shadow-fhc)" />
    <circle cx="35" cy="35" r="18" fill="url(#grad-sky-fhc)" />
    <path d="M 26 35 L 44 35 M 35 26 L 35 44" stroke="#ffffff" stroke-width="2.5" stroke-linecap="round" />
    <text x="68" y="32" font-family="'Segoe UI', sans-serif" font-size="20" font-weight="700" fill="#f8fafc">
      IMBRICATION BRUT 7075 (160×160 mm) &amp; DÉTAIL D'INSERTION DES VIS FRAISÉES FHC M4
    </text>
    <text x="68" y="54" font-family="'Segoe UI', sans-serif" font-size="13" font-weight="500" fill="#94a3b8">
      Découpe C500 dans la plaque Blockenstock 5×160×160 mm (9.60 €) · Fraisure à 90° et taraudages d'angles M4
    </text>
    <rect x="1130" y="20" width="165" height="30" rx="6" fill="#0284c7" fill-opacity="0.2" stroke="#38bdf8" stroke-width="1" />
    <text x="1212" y="40" text-anchor="middle" font-family="'Segoe UI', sans-serif" font-size="12" font-weight="700" fill="#38bdf8">
      DÉTAIL D'USINAGE
    </text>
  </g>

  <!-- ========================================================================= -->
  <!-- PANEL 1: IMBRICATION 2D DANS LE BRUT BLOCKENSTOCK 5x160x160 mm (9.60 €) -->
  <!-- ========================================================================= -->
  <g transform="translate(40, 120)">
    <rect width="640" height="420" rx="10" fill="url(#grad-card-fhc)" stroke="#334155" stroke-width="1.5" filter="url(#drop-shadow-fhc)" />
    <rect x="15" y="15" width="370" height="26" rx="4" fill="#0f172a" stroke="#475569" stroke-width="1" />
    <text x="25" y="32" font-family="'Segoe UI', sans-serif" font-size="12" font-weight="700" fill="#38bdf8">
      1. IMBRICATION DANS LE BRUT 5 × 160 × 160 mm (C500)
    </text>

    <g transform="translate(35, 60)">
      <!-- Plaque Brute 160x160 mm (Alu 7075-T6) -->
      <rect x="20" y="20" width="260" height="260" rx="4" fill="#334155" fill-opacity="0.3" stroke="#94a3b8" stroke-width="1.5" stroke-dasharray="6,4" />
      <text x="150" y="12" text-anchor="middle" font-family="'Segoe UI', sans-serif" font-size="11" font-weight="700" fill="#cbd5e1">BRUT 160 × 160 mm (9.60 € TTC)</text>

      <!-- Pièce Usinée : Semelle Éclisse 80x130 mm (Cyan) -->
      <rect x="35" y="35" width="130" height="210" rx="6" fill="#0284c7" fill-opacity="0.5" stroke="#38bdf8" stroke-width="2" />
      <text x="100" y="145" text-anchor="middle" font-family="'Segoe UI', sans-serif" font-size="11" font-weight="700" fill="#ffffff">SEMELLE ÉCLISSE</text>
      <text x="100" y="160" text-anchor="middle" font-family="'Segoe UI', sans-serif" font-size="9" fill="#93c5fd">80 × 130 mm (Alu 7075)</text>

      <!-- 4 Trous M5 Colonne (Haut & Bas) -->
      <circle cx="65" cy="55" r="4.5" fill="#f8fafc" stroke="#0f172a" />
      <circle cx="135" cy="55" r="4.5" fill="#f8fafc" stroke="#0f172a" />
      <circle cx="65" cy="225" r="4.5" fill="#f8fafc" stroke="#0f172a" />
      <circle cx="135" cy="225" r="4.5" fill="#f8fafc" stroke="#0f172a" />

      <!-- 4 Trous Fraisés M4 Insert (Centre) -->
      <circle cx="70" cy="115" r="3.5" fill="#f59e0b" stroke="#0f172a" />
      <circle cx="130" cy="115" r="3.5" fill="#f59e0b" stroke="#0f172a" />
      <circle cx="70" cy="165" r="3.5" fill="#f59e0b" stroke="#0f172a" />
      <circle cx="130" cy="165" r="3.5" fill="#f59e0b" stroke="#0f172a" />

      <!-- Chutes Réutilisables (Vert) -->
      <!-- Chute Droite (80 x 160 mm) -->
      <rect x="175" y="35" width="95" height="230" rx="4" fill="#10b981" fill-opacity="0.15" stroke="#34d399" stroke-width="1.5" stroke-dasharray="4,2" />
      <text x="222" y="145" text-anchor="middle" font-family="'Segoe UI', sans-serif" font-size="9" font-weight="700" fill="#34d399" transform="rotate(-90,222,145)">CHUTE RÉUTILISABLE (60×160)</text>

      <!-- Spécifications d'Achat -->
      <g transform="translate(300, 20)">
        <rect width="260" height="260" rx="6" fill="#0f172a" stroke="#334155" stroke-width="1" />
        <text x="15" y="25" font-family="'Segoe UI', sans-serif" font-size="11" font-weight="700" fill="#f59e0b">APPROVISIONNEMENT :</text>
        <text x="15" y="48" font-family="'Segoe UI', sans-serif" font-size="10" fill="#cbd5e1">• Commander : <tspan font-weight="700" fill="#34d399">2 plaques</tspan> 5×160×160</text>
        <text x="15" y="68" font-family="'Segoe UI', sans-serif" font-size="10" fill="#cbd5e1">• Coût total : <tspan font-weight="700" fill="#f8fafc">19.20 € TTC (2 × 9.60 €)</tspan></text>
        <text x="15" y="88" font-family="'Segoe UI', sans-serif" font-size="10" fill="#cbd5e1">• Plaque 1 : <tspan font-weight="700" fill="#38bdf8">Semelle Gauche</tspan> (80×130)</text>
        <text x="15" y="108" font-family="'Segoe UI', sans-serif" font-size="10" fill="#cbd5e1">• Plaque 2 : <tspan font-weight="700" fill="#38bdf8">Semelle Droite</tspan> (80×130)</text>
        
        <rect x="15" y="130" width="230" height="110" rx="4" fill="#0284c7" fill-opacity="0.15" stroke="#38bdf8" stroke-width="1" />
        <text x="25" y="150" font-family="'Segoe UI', sans-serif" font-size="10" font-weight="700" fill="#38bdf8">RÉUTILISATION DES CHUTES :</text>
        <text x="25" y="170" font-family="'Segoe UI', sans-serif" font-size="9" fill="#e2e8f0">• 2 bandes 7075 de 60 × 160 mm</text>
        <text x="25" y="188" font-family="'Segoe UI', sans-serif" font-size="9" fill="#e2e8f0">• Idéal pour : Équerres de renfort,</text>
        <text x="25" y="206" font-family="'Segoe UI', sans-serif" font-size="9" fill="#e2e8f0">  supports de cartes IMU / CAN,</text>
        <text x="25" y="224" font-family="'Segoe UI', sans-serif" font-size="9" fill="#e2e8f0">  ou platines d'attache batterie.</text>
      </g>
    </g>
  </g>

  <!-- ========================================================================= -->
  <!-- PANEL 2: VUE EN COUPE MACRO — SENS D'INSERTION DES VIS FRAISÉES FHC M4 -->
  <!-- ========================================================================= -->
  <g transform="translate(710, 120)">
    <rect width="650" height="420" rx="10" fill="url(#grad-card-fhc)" stroke="#334155" stroke-width="1.5" filter="url(#drop-shadow-fhc)" />
    <rect x="15" y="15" width="390" height="26" rx="4" fill="#0f172a" stroke="#475569" stroke-width="1" />
    <text x="25" y="32" font-family="'Segoe UI', sans-serif" font-size="12" font-weight="700" fill="#38bdf8">
      2. SENS D'INSERTION DES VIS FHC M4 (PAR L'ARRIÈRE)
    </text>

    <g transform="translate(40, 60)">
      <!-- Sens d'insertion : Tournevis vient de la gauche -->
      <g transform="translate(0, 70)">
        <path d="M 20 60 L 60 60" stroke="#10b981" stroke-width="2.5" marker-end="url(#arrow)" />
        <text x="40" y="45" text-anchor="middle" font-family="'Segoe UI', sans-serif" font-size="9" font-weight="700" fill="#34d399">Insertion par</text>
        <text x="40" y="56" text-anchor="middle" font-family="'Segoe UI', sans-serif" font-size="9" font-weight="700" fill="#34d399">la face arrière</text>
      </g>

      <!-- 1. Semelle 5 mm en Coupe (Face Arrière à Gauche, Face Avant à Droite) -->
      <rect x="80" y="20" width="30" height="260" rx="2" fill="#0284c7" stroke="#38bdf8" stroke-width="2" />
      <text x="95" y="270" text-anchor="middle" font-family="'Segoe UI', sans-serif" font-size="9" font-weight="700" fill="#ffffff" transform="rotate(-90,95,270)">Semelle 5 mm</text>

      <!-- Fraisure conique à 90° (Ø 8.4 mm -> Ø 4.3 mm) -->
      <!-- Trou Haut -->
      <polygon points="80,50 92,60 110,60 110,70 92,70 80,80" fill="#0b1120" stroke="#38bdf8" stroke-width="1.5" />
      <!-- Vis FHC M4x12 engagée (Tête conique à fleur de la face gauche) -->
      <polygon points="80,52 90,61 80,78" fill="#f8fafc" stroke="#0f172a" />
      <rect x="90" y="61" width="45" height="8" fill="#f8fafc" stroke="#0f172a" />
      <line x1="80" y1="52" x2="80" y2="78" stroke="#34d399" stroke-width="2" />
      <text x="65" y="68" font-family="'Segoe UI', sans-serif" font-size="8" font-weight="700" fill="#34d399">0.0 mm</text>

      <!-- Trou Bas -->
      <polygon points="80,180 92,190 110,190 110,200 92,200 80,210" fill="#0b1120" stroke="#38bdf8" stroke-width="1.5" />
      <polygon points="80,182 90,191 80,208" fill="#f8fafc" stroke="#0f172a" />
      <rect x="90" y="191" width="45" height="8" fill="#f8fafc" stroke="#0f172a" />
      <line x1="80" y1="182" x2="80" y2="208" stroke="#34d399" stroke-width="2" />
      <text x="65" y="198" font-family="'Segoe UI', sans-serif" font-size="8" font-weight="700" fill="#34d399">0.0 mm</text>

      <!-- 2. Insert Mâle 22 mm en Coupe (Plaqué contre la face droite) -->
      <rect x="110" y="40" width="130" height="220" rx="3" fill="#0369a1" stroke="#38bdf8" stroke-width="2" />
      <text x="175" y="145" text-anchor="middle" font-family="'Segoe UI', sans-serif" font-size="11" font-weight="700" fill="#f8fafc">INSERT 22 mm</text>

      <!-- Taraudages borgnes M4 dans l'insert (Foret Ø3.3 mm, Taraud M4) -->
      <rect x="110" y="60" width="45" height="10" fill="#0f172a" stroke="#38bdf8" stroke-width="1" stroke-dasharray="3,2" />
      <rect x="110" y="190" width="45" height="10" fill="#0f172a" stroke="#38bdf8" stroke-width="1" stroke-dasharray="3,2" />

      <!-- Poche d'Allègement Centrale Ø35 mm (Au centre de l'insert) -->
      <rect x="155" y="85" width="85" height="130" rx="3" fill="#0b1120" stroke="#f59e0b" stroke-width="1.5" />
      <text x="197" y="155" text-anchor="middle" font-family="'Segoe UI', sans-serif" font-size="9" font-weight="700" fill="#fcd34d">Évidement</text>
      <text x="197" y="168" text-anchor="middle" font-family="'Segoe UI', sans-serif" font-size="9" font-weight="700" fill="#fcd34d">Ø35 mm</text>

      <!-- Légende Explicative -->
      <g transform="translate(260, 20)">
        <rect width="270" height="260" rx="6" fill="#0f172a" stroke="#334155" stroke-width="1" />
        <text x="15" y="25" font-family="'Segoe UI', sans-serif" font-size="11" font-weight="700" fill="#34d399">POURQUOI ZÉRO SAILLIE ?</text>
        <text x="15" y="48" font-family="'Segoe UI', sans-serif" font-size="10" fill="#cbd5e1">• La vis FHC a une <tspan font-weight="700" fill="#f8fafc">tête conique 90°</tspan></text>
        <text x="15" y="68" font-family="'Segoe UI', sans-serif" font-size="10" fill="#cbd5e1">• Elle s'enfonce dans la <tspan font-weight="700" fill="#38bdf8">fraisure</tspan></text>
        <text x="15" y="88" font-family="'Segoe UI', sans-serif" font-size="10" fill="#cbd5e1">• La face gauche reste <tspan font-weight="700" fill="#34d399">100% plane</tspan></text>
        <text x="15" y="108" font-family="'Segoe UI', sans-serif" font-size="10" fill="#cbd5e1">• Plaquage parfait sur la colonne 5mm</text>
        
        <rect x="15" y="130" width="240" height="110" rx="4" fill="#064e3b" fill-opacity="0.3" stroke="#10b981" stroke-width="1" />
        <text x="25" y="150" font-family="'Segoe UI', sans-serif" font-size="10" font-weight="700" fill="#34d399">PAS D'OUTIL DANS L'ÉVIDEMENT :</text>
        <text x="25" y="170" font-family="'Segoe UI', sans-serif" font-size="9" fill="#e2e8f0">On ne visse RIEN depuis l'intérieur !</text>
        <text x="25" y="188" font-family="'Segoe UI', sans-serif" font-size="9" fill="#e2e8f0">Le tournevis accède librement par la</text>
        <text x="25" y="206" font-family="'Segoe UI', sans-serif" font-size="9" fill="#e2e8f0">face arrière de la semelle sur l'établi.</text>
        <text x="25" y="224" font-family="'Segoe UI', sans-serif" font-size="9" font-weight="700" fill="#34d399">➔ Assemblage en 30 secondes chrono.</text>
      </g>
    </g>
  </g>

  <!-- ========================================================================= -->
  <!-- PANEL 3: VUE DE FACE DU PLAN DE PERÇAGE DE L'INSERT (55.8 x 55.8 mm) -->
  <!-- ========================================================================= -->
  <g transform="translate(40, 560)">
    <rect width="1320" height="360" rx="10" fill="url(#grad-card-fhc)" stroke="#334155" stroke-width="1.5" filter="url(#drop-shadow-fhc)" />
    <rect x="20" y="20" width="460" height="26" rx="4" fill="#0f172a" stroke="#475569" stroke-width="1" />
    <text x="30" y="37" font-family="'Segoe UI', sans-serif" font-size="12" font-weight="700" fill="#38bdf8">
      3. DISPOSITION GÉOMÉTRIQUE : ÉVIDEMENT Ø35 mm &amp; LES 4 TARAUDAGES M4
    </text>

    <g transform="translate(30, 60)">
      <!-- Face d'appui de l'Insert 55.8 x 55.8 mm -->
      <g transform="translate(50, 15)">
        <rect x="0" y="0" width="220" height="220" rx="12" fill="#1e293b" stroke="#38bdf8" stroke-width="2" />
        <text x="110" y="-8" text-anchor="middle" font-family="'Segoe UI', sans-serif" font-size="11" font-weight="700" fill="#f8fafc">55.80 × 55.80 mm</text>

        <!-- Rayon R=3mm aux 4 coins -->
        <path d="M 0 12 C 0 0, 12 0, 12 0" stroke="#f59e0b" stroke-width="2" />
        <text x="-5" y="30" font-family="'Segoe UI', sans-serif" font-size="9" font-weight="700" fill="#fcd34d">R3 mm</text>

        <!-- Évidement Central d'Allègement Ø35.0 mm -->
        <circle cx="110" cy="110" r="68" fill="#0b1120" stroke="#f59e0b" stroke-width="2" stroke-dasharray="4,2" />
        <text x="110" y="114" text-anchor="middle" font-family="'Segoe UI', sans-serif" font-size="12" font-weight="700" fill="#fcd34d">ÉVIDEMENT Ø 35 mm</text>
        <text x="110" y="130" text-anchor="middle" font-family="'Segoe UI', sans-serif" font-size="9" fill="#94a3b8">Poche traversante (-55 g)</text>

        <!-- 4x Taraudages Borgnes M4 aux 4 Coins (Entraxe 42 x 42 mm) -->
        <!-- Coin Haut Gauche -->
        <circle cx="32" cy="32" r="7" fill="#f8fafc" stroke="#0284c7" stroke-width="2" />
        <circle cx="32" cy="32" r="3" fill="#0284c7" />
        <!-- Coin Haut Droit -->
        <circle cx="188" cy="32" r="7" fill="#f8fafc" stroke="#0284c7" stroke-width="2" />
        <circle cx="188" cy="32" r="3" fill="#0284c7" />
        <!-- Coin Bas Gauche -->
        <circle cx="32" cy="188" r="7" fill="#f8fafc" stroke="#0284c7" stroke-width="2" />
        <circle cx="32" cy="188" r="3" fill="#0284c7" />
        <!-- Coin Bas Droit -->
        <circle cx="188" cy="188" r="7" fill="#f8fafc" stroke="#0284c7" stroke-width="2" />
        <circle cx="188" cy="188" r="3" fill="#0284c7" />

        <!-- Lignes de cotation entraxe 42 mm -->
        <line x1="32" y1="235" x2="188" y2="235" stroke="#94a3b8" stroke-width="1" />
        <text x="110" y="250" text-anchor="middle" font-family="'Segoe UI', sans-serif" font-size="10" font-weight="700" fill="#f8fafc">Entraxe Δ = 42.0 mm</text>
      </g>

      <!-- Cartouche Explicatif Synthèse -->
      <g transform="translate(360, 15)">
        <rect width="880" height="245" rx="6" fill="#0f172a" stroke="#334155" stroke-width="1" />
        <text x="25" y="30" font-family="'Segoe UI', sans-serif" font-size="13" font-weight="700" fill="#38bdf8">
          ANALYSE GÉOMÉTRIQUE : ZÉRO CONFLIT ENTRE VIS FHC ET ÉVIDEMENT Ø35 mm
        </text>
        
        <text x="25" y="60" font-family="'Segoe UI', sans-serif" font-size="11" fill="#cbd5e1">
          1. <tspan font-weight="700" fill="#f8fafc">Positionnement des taraudages M4</tspan> : Les 4 trous sont placés sur les diagonales à un entraxe carré de 42,0 × 42,0 mm (rayon R = 29,7 mm).
        </text>
        <text x="25" y="85" font-family="'Segoe UI', sans-serif" font-size="11" fill="#cbd5e1">
          2. <tspan font-weight="700" fill="#fcd34d">Rayon de l'évidement central</tspan> : Le cercle central a un rayon de R = 17,5 mm (Ø 35,0 mm).
        </text>
        <text x="25" y="110" font-family="'Segoe UI', sans-serif" font-size="11" fill="#cbd5e1">
          3. <tspan font-weight="700" fill="#34d399">Pince de matière de sécurité</tspan> : La distance entre le bord de l'évidement et le centre des taraudages M4 est de :
        </text>
        <text x="50" y="130" font-family="'Segoe UI', sans-serif" font-size="11" font-weight="700" fill="#34d399">
          d = R_vis - R_trou = 29.7 mm - 17.5 mm = 12.2 mm de matière pleine en Alu massif !
        </text>
        
        <rect x="25" y="150" width="830" height="75" rx="4" fill="#0284c7" fill-opacity="0.15" stroke="#38bdf8" stroke-width="1.5" />
        <text x="40" y="175" font-family="'Segoe UI', sans-serif" font-size="11" font-weight="700" fill="#38bdf8">
          RÉSUMÉ POUR L'USINAGE SUR LA NESTWORKS C500 :
        </text>
        <text x="40" y="195" font-family="'Segoe UI', sans-serif" font-size="10" fill="#e2e8f0">
          • Aucun outil ni vis ne passe à l'intérieur de l'évidement. L'évidement est une simple poche 2D évidée au centre.
        </text>
        <text x="40" y="212" font-family="'Segoe UI', sans-serif" font-size="10" fill="#e2e8f0">
          • Les 4 taraudages M4 borgnes (profondeur 10 mm) reçoivent les vis FHC vissées depuis la face arrière de la semelle.
        </text>
      </g>
    </g>
  </g>
</svg>
