<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 350" width="100%" height="100%">
  <defs>
    <pattern id="grid" width="20" height="20" patternUnits="userSpaceOnUse">
      <path d="M 20 0 L 0 0 0 20" fill="none" stroke="#2a324b" stroke-width="0.8"/>
    </pattern>

    <linearGradient id="steelGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#64748b"/>
      <stop offset="50%" stop-color="#475569"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>

    <linearGradient id="aluGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#94a3b8"/>
      <stop offset="100%" stop-color="#64748b"/>
    </linearGradient>

    <linearGradient id="carbonGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#334155"/>
      <stop offset="50%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
  </defs>

  <rect width="100%" height="100%" fill="#0f172a"/>
  <rect width="100%" height="100%" fill="url(#grid)"/>

  <text x="400" y="25" fill="#f8fafc" font-family="system-ui, sans-serif" font-size="13" font-weight="bold" text-anchor="middle">
    COUPE AXIALE A-A — ANCRAGE D'ÉPAULE V1 (BRIDE FENDUE + GOUPILLE Ø4mm + PLUG ANTI-ÉCRASEMENT)
  </text>

  <g transform="translate(50, 40)">
    <rect width="700" height="280" rx="8" fill="#1e293b" stroke="#334155" stroke-width="1.5"/>

    <!-- Axis Centerline -->
    <line x1="50" y1="140" x2="650" y2="140" stroke="#00f2fe" stroke-width="1" stroke-dasharray="8,4"/>

    <!-- Steel Casing (Support RS-04 E470 Flange / Socket Port 35mm) -->
    <rect x="100" y="40" width="220" height="200" rx="4" fill="url(#steelGrad)" stroke="#94a3b8" stroke-width="1.2"/>
    <text x="210" y="32" fill="#38bdf8" font-family="system-ui, sans-serif" font-size="10" font-weight="bold" text-anchor="middle">Socket Carter Acier E470 (Portée 35 mm / Ø30.05 mm H7)</text>

    <!-- Carbon Tube (Ø30mm ext / Ø26mm int) -->
    <rect x="200" y="80" width="380" height="120" fill="url(#carbonGrad)" stroke="#475569" stroke-width="1.2"/>
    <rect x="200" y="95" width="380" height="90" fill="#0f172a"/>
    <text x="450" y="70" fill="#f59e0b" font-family="system-ui, sans-serif" font-size="10" font-weight="bold" text-anchor="middle">Tube Carbone Traverse Ø 30 mm × 2 mm</text>

    <!-- Internal Aluminium Anti-Crush Plug (Ø26mm ext / Ø18mm int, 35mm Long) -->
    <rect x="200" y="95" width="220" height="15" fill="url(#aluGrad)" stroke="#cbd5e1" stroke-width="1"/>
    <rect x="200" y="170" width="220" height="15" fill="url(#aluGrad)" stroke="#cbd5e1" stroke-width="1"/>
    <text x="310" y="144" fill="#e2e8f0" font-family="system-ui, sans-serif" font-size="9" font-weight="bold" text-anchor="middle">Bouchon Alu 6061-T6 Anti-Écrasement (Ø 26/18 mm × 35 mm)</text>

    <!-- Unified Stainless Elastic Pin (Ø4.0mm x 35mm, Axis Z Vertical) -->
    <rect x="290" y="40" width="20" height="200" rx="2" fill="#ef4444" stroke="#ffffff" stroke-width="1.2"/>
    <text x="300" y="258" fill="#ef4444" font-family="system-ui, sans-serif" font-size="10" font-weight="bold" text-anchor="middle">Goupille Élastique Inox Ø 4,0 mm × 35 mm (Axe Z)</text>
    <text x="300" y="270" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="8" text-anchor="middle">(BOM Unifiée avec Nœud Central)</text>

    <!-- Clamping Screws M4 (2x M4 Clamping Fente Axiale) -->
    <circle cx="160" cy="55" r="5" fill="#f59e0b" stroke="#ffffff" stroke-width="1"/>
    <circle cx="250" cy="55" r="5" fill="#f59e0b" stroke="#ffffff" stroke-width="1"/>
    <text x="120" y="20" fill="#f59e0b" font-family="system-ui, sans-serif" font-size="9" font-weight="bold">2× Vis M4 Pincement Bride</text>

    <!-- Dimension Arrow for 35mm Port -->
    <line x1="200" y1="215" x2="420" y2="215" stroke="#00f2fe" stroke-width="1"/>
    <line x1="200" y1="210" x2="200" y2="220" stroke="#00f2fe" stroke-width="1"/>
    <line x1="420" y1="210" x2="420" y2="220" stroke="#00f2fe" stroke-width="1"/>
    <text x="310" y="230" fill="#00f2fe" font-family="system-ui, sans-serif" font-size="9" font-weight="bold" text-anchor="middle">Longueur de Serrage / Portée : 35,0 mm</text>
  </g>
</svg>
