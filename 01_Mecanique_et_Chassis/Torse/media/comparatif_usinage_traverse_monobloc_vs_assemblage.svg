<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 960" width="100%" height="100%">
  <defs>
    <pattern id="grid-pattern" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#1e293b" stroke-width="1" />
      <path d="M 200 0 L 0 0 0 200" fill="none" stroke="#2a324b" stroke-width="1.5" />
    </pattern>

    <linearGradient id="grad-sky" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#0284c7" />
    </linearGradient>
    <linearGradient id="grad-amber" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f59e0b" />
      <stop offset="100%" stop-color="#b45309" />
    </linearGradient>
    <linearGradient id="grad-emerald" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981" />
      <stop offset="100%" stop-color="#047857" />
    </linearGradient>
    <linearGradient id="grad-rose" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f43f5e" />
      <stop offset="100%" stop-color="#be123c" />
    </linearGradient>
    <linearGradient id="grad-card" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" stop-opacity="0.95" />
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0.95" />
    </linearGradient>

    <filter id="drop-shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#000000" flood-opacity="0.6" />
    </filter>
  </defs>

  <!-- Background Base -->
  <rect width="1400" height="960" fill="#0b1120" />
  <rect width="1400" height="960" fill="url(#grid-pattern)" />

  <!-- HEADER -->
  <g transform="translate(40, 30)">
    <rect width="1320" height="70" rx="8" fill="#1e293b" stroke="#334155" stroke-width="1.5" filter="url(#drop-shadow)" />
    <circle cx="35" cy="35" r="18" fill="url(#grad-sky)" />
    <path d="M 26 35 L 44 35 M 35 26 L 35 44" stroke="#ffffff" stroke-width="2.5" stroke-linecap="round" />
    <text x="68" y="32" font-family="'Segoe UI', sans-serif" font-size="20" font-weight="700" fill="#f8fafc">
      STRATÉGIES DE FABRICATION CNC C500 : MONOBLOC vs ASSEMBLAGE 2D vs TUBE CARRÉ 60×60
    </text>
    <text x="68" y="54" font-family="'Segoe UI', sans-serif" font-size="13" font-weight="500" fill="#94a3b8">
      Comparatif des procédés d'atelier, taux de copeaux, coûts et rigidité torsionnelle (120 N.m RS-04)
    </text>
  </g>

  <!-- ========================================================================= -->
  <!-- OPTION 1: MONOBLOC DANS LA MASSE (BRUT ÉPAIS) -->
  <!-- ========================================================================= -->
  <g transform="translate(40, 120)">
    <rect width="420" height="490" rx="10" fill="url(#grad-card)" stroke="#f43f5e" stroke-width="1.5" filter="url(#drop-shadow)" />
    <rect x="15" y="15" width="260" height="26" rx="4" fill="#881337" fill-opacity="0.4" stroke="#f43f5e" stroke-width="1" />
    <text x="25" y="32" font-family="'Segoe UI', sans-serif" font-size="12" font-weight="700" fill="#fca5a5">
      OPTION A : USINAGE DANS LA MASSE
    </text>

    <!-- Dessin Brut vs Pièce Finie -->
    <g transform="translate(30, 60)">
      <rect x="20" y="20" width="320" height="190" rx="4" fill="#334155" fill-opacity="0.3" stroke="#f43f5e" stroke-width="2" stroke-dasharray="6,4" />
      <text x="180" y="40" text-anchor="middle" font-family="'Segoe UI', sans-serif" font-size="11" font-weight="700" fill="#fda4af">BRUT 50 × 130 × 140 mm (Alu 7075-T6)</text>
      <text x="180" y="56" text-anchor="middle" font-family="'Segoe UI', sans-serif" font-size="10" fill="#cbd5e1">Masse brute : ~2.45 kg par côté</text>

      <rect x="30" y="65" width="30" height="135" rx="3" fill="#0284c7" stroke="#38bdf8" stroke-width="1.5" />
      <path d="M 60 90 L 250 90 L 250 115 L 90 115 L 90 150 L 250 150 L 250 175 L 60 175 Z" fill="#38bdf8" stroke="#0284c7" stroke-width="1.5" />
      <rect x="250" y="45" width="30" height="155" rx="3" fill="#0284c7" stroke="#38bdf8" stroke-width="1.5" />

      <rect x="90" y="115" width="160" height="35" fill="#f43f5e" fill-opacity="0.2" />
      <text x="170" y="138" text-anchor="middle" font-family="'Segoe UI', sans-serif" font-size="10" font-weight="700" fill="#f87171">88% COPEAUX PERDUS</text>
    </g>

    <g transform="translate(25, 290)">
      <rect width="370" height="180" rx="6" fill="#0f172a" stroke="#334155" stroke-width="1" />
      <text x="15" y="25" font-family="'Segoe UI', sans-serif" font-size="12" font-weight="700" fill="#fca5a5">Bilan Économique &amp; Atelier :</text>
      <text x="15" y="52" font-family="'Segoe UI', sans-serif" font-size="11" fill="#cbd5e1">• Coût matière : ~45 à 60 € / brut 7075-T6</text>
      <text x="15" y="74" font-family="'Segoe UI', sans-serif" font-size="11" fill="#cbd5e1">• Taux de copeaux : <tspan font-weight="700" fill="#f87171">88% (2.2 kg de copeaux)</tspan></text>
      <text x="15" y="96" font-family="'Segoe UI', sans-serif" font-size="11" fill="#cbd5e1">• Temps usinage C500 : ~1h45 par côté</text>
      <text x="15" y="118" font-family="'Segoe UI', sans-serif" font-size="11" fill="#cbd5e1">• Reprises / Étau : 2 opérations (Flip Z)</text>
      <text x="15" y="145" font-family="'Segoe UI', sans-serif" font-size="11" font-weight="700" fill="#fca5a5">Verdict : Rigide mais lourd et coûteux</text>
    </g>
  </g>

  <!-- ========================================================================= -->
  <!-- OPTION 2: ASSEMBLAGE 2D EMBOÎTÉ -->
  <!-- ========================================================================= -->
  <g transform="translate(490, 120)">
    <rect width="420" height="490" rx="10" fill="url(#grad-card)" stroke="#334155" stroke-width="1.5" filter="url(#drop-shadow)" />
    <rect x="15" y="15" width="280" height="26" rx="4" fill="#0f172a" stroke="#475569" stroke-width="1" />
    <text x="25" y="32" font-family="'Segoe UI', sans-serif" font-size="12" font-weight="700" fill="#cbd5e1">
      OPTION B : ASSEMBLAGE 2D EMBOÎTÉ
    </text>

    <g transform="translate(25, 55)">
      <rect x="270" y="35" width="14" height="175" rx="3" fill="#38bdf8" stroke="#0284c7" stroke-width="1.5" />
      <rect x="270" y="65" width="14" height="15" fill="#f59e0b" />
      <rect x="270" y="160" width="14" height="15" fill="#f59e0b" />
      <text x="325" y="125" font-family="'Segoe UI', sans-serif" font-size="10" font-weight="700" fill="#38bdf8">Plaque 5mm</text>

      <path d="M 60 65 L 80 65 L 80 55 L 260 55 L 260 65 L 284 65 L 284 80 L 260 80 L 260 90 L 80 90 L 80 80 L 60 80 Z" fill="#0284c7" fill-opacity="0.7" stroke="#38bdf8" stroke-width="1.5" />
      <text x="170" y="75" text-anchor="middle" font-family="'Segoe UI', sans-serif" font-size="10" font-weight="700" fill="#f8fafc">Nervure Haute</text>

      <path d="M 60 160 L 80 160 L 80 150 L 260 150 L 260 160 L 284 160 L 284 175 L 260 175 L 260 185 L 80 185 L 80 175 L 60 175 Z" fill="#0284c7" fill-opacity="0.7" stroke="#38bdf8" stroke-width="1.5" />
      <text x="170" y="170" text-anchor="middle" font-family="'Segoe UI', sans-serif" font-size="10" font-weight="700" fill="#f8fafc">Nervure Basse</text>

      <rect x="66" y="45" width="14" height="155" rx="3" fill="#38bdf8" stroke="#0284c7" stroke-width="1.5" />
      <text x="30" y="125" font-family="'Segoe UI', sans-serif" font-size="10" font-weight="700" fill="#38bdf8" transform="rotate(-90,30,125)">Semelle 5mm</text>

      <line x1="60" y1="120" x2="284" y2="120" stroke="#f59e0b" stroke-width="2" stroke-dasharray="4,2" />
      <circle cx="66" cy="120" r="3" fill="#f59e0b" />
      <circle cx="277" cy="120" r="3" fill="#f59e0b" />
    </g>

    <g transform="translate(25, 290)">
      <rect width="370" height="180" rx="6" fill="#0f172a" stroke="#334155" stroke-width="1" />
      <text x="15" y="25" font-family="'Segoe UI', sans-serif" font-size="12" font-weight="700" fill="#cbd5e1">Bilan Économique &amp; Atelier :</text>
      <text x="15" y="52" font-family="'Segoe UI', sans-serif" font-size="11" fill="#cbd5e1">• Coût matière : Chute de tôle 5 mm</text>
      <text x="15" y="74" font-family="'Segoe UI', sans-serif" font-size="11" fill="#cbd5e1">• Taux de copeaux : &lt; 18% (Découpe 2D)</text>
      <text x="15" y="96" font-family="'Segoe UI', sans-serif" font-size="11" fill="#cbd5e1">• Temps usinage C500 : ~18 min total</text>
      <text x="15" y="118" font-family="'Segoe UI', sans-serif" font-size="11" fill="#cbd5e1">• Reprise : 0 flip Z</text>
      <text x="15" y="145" font-family="'Segoe UI', sans-serif" font-size="11" font-weight="700" fill="#38bdf8">Verdict : Économique mais montage délicat</text>
    </g>
  </g>

  <!-- ========================================================================= -->
  <!-- OPTION 3: TUBE CARRÉ COMMERCIAL 60x60x2 mm (⭐ SOLUTION RETENUE V2) -->
  <!-- ========================================================================= -->
  <g transform="translate(940, 120)">
    <rect width="420" height="490" rx="10" fill="url(#grad-card)" stroke="#10b981" stroke-width="2" filter="url(#drop-shadow)" />
    <rect x="15" y="15" width="350" height="26" rx="4" fill="#064e3b" fill-opacity="0.5" stroke="#10b981" stroke-width="1" />
    <text x="25" y="32" font-family="'Segoe UI', sans-serif" font-size="12" font-weight="700" fill="#6ee7b7">
      OPTION C (⭐ RETENUE V2) : TUBE CARRÉ 60×60×2
    </text>

    <!-- Dessin Tube Carré 60x60x2 mm -->
    <g transform="translate(25, 55)">
      <rect x="80" y="50" width="180" height="140" rx="6" fill="#1e293b" stroke="#38bdf8" stroke-width="2" />
      <rect x="90" y="60" width="160" height="120" rx="4" fill="#0f172a" stroke="#0284c7" stroke-width="1.5" />
      <text x="170" y="115" text-anchor="middle" font-family="'Segoe UI', sans-serif" font-size="12" font-weight="700" fill="#38bdf8">TUBE 60 × 60 × 2 mm</text>
      <text x="170" y="132" text-anchor="middle" font-family="'Segoe UI', sans-serif" font-size="10" fill="#94a3b8">Alu 6060-T6 (L = 85 mm · 106 g)</text>

      <!-- Inserts / Brides -->
      <rect x="55" y="40" width="25" height="160" rx="3" fill="#0284c7" stroke="#38bdf8" stroke-width="1" />
      <rect x="260" y="40" width="25" height="160" rx="3" fill="#0284c7" stroke="#38bdf8" stroke-width="1" />

      <!-- Vis traversantes M5x70 -->
      <line x1="100" y1="30" x2="100" y2="210" stroke="#f8fafc" stroke-width="3" stroke-linecap="round" />
      <line x1="240" y1="30" x2="240" y2="210" stroke="#f8fafc" stroke-width="3" stroke-linecap="round" />
      <circle cx="100" cy="35" r="4.5" fill="#f8fafc" stroke="#0284c7" />
      <circle cx="240" cy="35" r="4.5" fill="#f8fafc" stroke="#0284c7" />
    </g>

    <g transform="translate(25, 290)">
      <rect width="370" height="180" rx="6" fill="#0f172a" stroke="#10b981" stroke-width="1" />
      <text x="15" y="25" font-family="'Segoe UI', sans-serif" font-size="12" font-weight="700" fill="#34d399">Bilan Économique &amp; Atelier :</text>
      <text x="15" y="52" font-family="'Segoe UI', sans-serif" font-size="11" fill="#cbd5e1">• Coût matière : Barre 500mm 6060-T6 = <tspan font-weight="700" fill="#f8fafc">12.80 €</tspan></text>
      <text x="15" y="74" font-family="'Segoe UI', sans-serif" font-size="11" fill="#cbd5e1">• Taux de copeaux : <tspan font-weight="700" fill="#34d399">&lt; 5% (Coupe scie + 2 perçages)</tspan></text>
      <text x="15" y="96" font-family="'Segoe UI', sans-serif" font-size="11" fill="#cbd5e1">• Temps CNC : ~5 min (perçages Ø5.3 mm)</text>
      <text x="15" y="118" font-family="'Segoe UI', sans-serif" font-size="11" fill="#cbd5e1">• Rigidité torsion : <tspan font-weight="700" fill="#34d399">Sf = ×9.75 (Theta = 0.058°)</tspan></text>
      <text x="15" y="145" font-family="'Segoe UI', sans-serif" font-size="11" font-weight="700" fill="#34d399">Verdict : L'optimum absolu coût / rigidité / simplicité</text>
    </g>
  </g>

  <!-- ========================================================================= -->
  <!-- FOOTER : TABLEAU COMPARATIF FINAL -->
  <!-- ========================================================================= -->
  <g transform="translate(40, 630)">
    <rect width="1320" height="290" rx="10" fill="url(#grad-card)" stroke="#334155" stroke-width="1.5" filter="url(#drop-shadow)" />
    <rect x="20" y="20" width="380" height="26" rx="4" fill="#0f172a" stroke="#475569" stroke-width="1" />
    <text x="30" y="37" font-family="'Segoe UI', sans-serif" font-size="12" font-weight="700" fill="#38bdf8">
      TABLEAU DE DÉCISION FABRICATION D-BOT V2
    </text>

    <g transform="translate(20, 65)">
      <rect width="1280" height="195" rx="6" fill="#0f172a" stroke="#334155" stroke-width="1" />
      <text x="30" y="30" font-family="'Segoe UI', sans-serif" font-size="11" font-weight="700" fill="#64748b">CRITÈRE D'INGÉNIERIE</text>
      <text x="350" y="30" font-family="'Segoe UI', sans-serif" font-size="11" font-weight="700" fill="#fca5a5">A. MONOBLOC MASSE</text>
      <text x="670" y="30" font-family="'Segoe UI', sans-serif" font-size="11" font-weight="700" fill="#cbd5e1">B. ASSEMBLAGE 2D</text>
      <text x="990" y="30" font-family="'Segoe UI', sans-serif" font-size="11" font-weight="700" fill="#34d399">C. TUBE CARRÉ 60×60×2 ⭐</text>

      <line x1="20" y1="45" x2="1260" y2="45" stroke="#334155" stroke-width="1" />

      <text x="30" y="75" font-family="'Segoe UI', sans-serif" font-size="11" fill="#cbd5e1">Coût Appro matière</text>
      <text x="350" y="75" font-family="'Segoe UI', sans-serif" font-size="11" fill="#fca5a5">~100 € (2 gros bruts)</text>
      <text x="670" y="75" font-family="'Segoe UI', sans-serif" font-size="11" fill="#cbd5e1">0 € (sur tôle 5mm)</text>
      <text x="990" y="75" font-family="'Segoe UI', sans-serif" font-size="11" font-weight="700" fill="#34d399">12.80 € (barre 500mm)</text>

      <text x="30" y="105" font-family="'Segoe UI', sans-serif" font-size="11" fill="#cbd5e1">Temps CNC C500</text>
      <text x="350" y="105" font-family="'Segoe UI', sans-serif" font-size="11" fill="#fca5a5">~3h30 (2 faces)</text>
      <text x="670" y="105" font-family="'Segoe UI', sans-serif" font-size="11" fill="#cbd5e1">~18 min</text>
      <text x="990" y="105" font-family="'Segoe UI', sans-serif" font-size="11" font-weight="700" fill="#34d399">~5 min (scie + perçages)</text>

      <text x="30" y="135" font-family="'Segoe UI', sans-serif" font-size="11" fill="#cbd5e1">Rigidité Torsion 120 N.m</text>
      <text x="350" y="135" font-family="'Segoe UI', sans-serif" font-size="11" fill="#f8fafc">100% Monolithique</text>
      <text x="670" y="135" font-family="'Segoe UI', sans-serif" font-size="11" fill="#cbd5e1">98% (Tenons H7)</text>
      <text x="990" y="135" font-family="'Segoe UI', sans-serif" font-size="11" font-weight="700" fill="#34d399">99.5% (Section fermée Bredt)</text>

      <text x="30" y="165" font-family="'Segoe UI', sans-serif" font-size="11" fill="#cbd5e1">Gaspillage copeaux</text>
      <text x="350" y="165" font-family="'Segoe UI', sans-serif" font-size="11" fill="#fca5a5">88% de perte</text>
      <text x="670" y="165" font-family="'Segoe UI', sans-serif" font-size="11" fill="#cbd5e1">&lt; 18%</text>
      <text x="990" y="165" font-family="'Segoe UI', sans-serif" font-size="11" font-weight="700" fill="#34d399">&lt; 5%</text>
    </g>
  </g>
</svg>
