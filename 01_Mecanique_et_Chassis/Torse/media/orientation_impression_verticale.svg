<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 360" width="100%" height="100%">
  <defs>
    <pattern id="grid" width="20" height="20" patternUnits="userSpaceOnUse">
      <path d="M 20 0 L 0 0 0 20" fill="none" stroke="#2a324b" stroke-width="0.8"/>
    </pattern>
    <linearGradient id="bed" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#3b82f6"/>
      <stop offset="100%" stop-color="#1d4ed8"/>
    </linearGradient>
    <linearGradient id="part" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#475569"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
  </defs>

  <rect width="100%" height="100%" fill="#0f172a"/>
  <rect width="100%" height="100%" fill="url(#grid)"/>

  <text x="380" y="28" fill="#f8fafc" font-family="system-ui, sans-serif" font-size="14" font-weight="bold" text-anchor="middle">
    ORIENTATION D'IMPRESSION FDM VERTICALE (PA12-CF — QIDI PLUS 4)
  </text>

  <!-- Abdomen Panel (Left) -->
  <g transform="translate(40, 50)">
    <rect width="320" height="270" rx="8" fill="#1e293b" stroke="#334155" stroke-width="1.5"/>
    <text x="160" y="25" fill="#38bdf8" font-family="system-ui, sans-serif" font-size="12" font-weight="bold" text-anchor="middle">
      1. Coque Abdominale (Bas)
    </text>

    <!-- Part Printed Vertically -->
    <path d="M 80 80 L 240 80 L 220 220 L 100 220 Z" fill="url(#part)" stroke="#94a3b8" stroke-width="1.5"/>
    <text x="160" y="150" fill="#ffffff" font-family="system-ui, sans-serif" font-size="11" font-weight="bold" text-anchor="middle">Abdomen PA12-CF</text>
    <text x="160" y="165" fill="#cbd5e0" font-family="system-ui, sans-serif" font-size="9" text-anchor="middle">Z = ~216 mm</text>

    <!-- Build Bed -->
    <rect x="50" y="220" width="220" height="12" rx="2" fill="url(#bed)"/>
    <text x="160" y="250" fill="#93c5fd" font-family="system-ui, sans-serif" font-size="10" font-weight="bold" text-anchor="middle">Plateau Qidi (Taille à plat)</text>
  </g>

  <!-- Thorax Panel (Right) -->
  <g transform="translate(400, 50)">
    <rect width="320" height="270" rx="8" fill="#1e293b" stroke="#334155" stroke-width="1.5"/>
    <text x="160" y="25" fill="#38bdf8" font-family="system-ui, sans-serif" font-size="12" font-weight="bold" text-anchor="middle">
      2. Thorax (Haut)
    </text>

    <!-- Part Printed Vertically -->
    <path d="M 100 80 L 220 80 L 250 140 L 220 220 L 100 220 L 70 140 Z" fill="url(#part)" stroke="#94a3b8" stroke-width="1.5"/>
    <text x="160" y="150" fill="#ffffff" font-family="system-ui, sans-serif" font-size="11" font-weight="bold" text-anchor="middle">Thorax PA12-CF</text>

    <!-- Short Tree Supports under Shoulder Flanges -->
    <rect x="70" y="140" width="25" height="80" fill="#f59e0b" fill-opacity="0.3" stroke="#f59e0b" stroke-width="1" stroke-dasharray="2,2"/>
    <rect x="225" y="140" width="25" height="80" fill="#f59e0b" fill-opacity="0.3" stroke="#f59e0b" stroke-width="1" stroke-dasharray="2,2"/>
    <text x="160" y="170" fill="#fbd38d" font-family="system-ui, sans-serif" font-size="9" text-anchor="middle">Supports courts (~100mm)</text>

    <!-- Build Bed -->
    <rect x="50" y="220" width="220" height="12" rx="2" fill="url(#bed)"/>
    <text x="160" y="250" fill="#93c5fd" font-family="system-ui, sans-serif" font-size="10" font-weight="bold" text-anchor="middle">Plateau Qidi (Plan de coupe à plat)</text>
  </g>
</svg>
