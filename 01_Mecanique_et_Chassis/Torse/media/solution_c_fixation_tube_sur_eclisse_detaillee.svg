<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 960" width="100%" height="100%">
  <defs>
    <!-- Background Grid Pattern -->
    <pattern id="grid-pattern-tube-eclisse" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#1e293b" stroke-width="1" />
      <path d="M 200 0 L 0 0 0 200" fill="none" stroke="#2a324b" stroke-width="1.5" />
    </pattern>

    <!-- Gradients -->
    <linearGradient id="grad-sky-te" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#0284c7" />
    </linearGradient>
    <linearGradient id="grad-amber-te" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f59e0b" />
      <stop offset="100%" stop-color="#b45309" />
    </linearGradient>
    <linearGradient id="grad-emerald-te" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981" />
      <stop offset="100%" stop-color="#047857" />
    </linearGradient>
    <linearGradient id="grad-card-te" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" stop-opacity="0.95" />
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0.95" />
    </linearGradient>

    <!-- Drop Shadow Filter -->
    <filter id="drop-shadow-te" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#000000" flood-opacity="0.6" />
    </filter>
  </defs>

  <!-- Background Base -->
  <rect width="1400" height="960" fill="#0b1120" />
  <rect width="1400" height="960" fill="url(#grid-pattern-tube-eclisse)" />

  <!-- HEADER -->
  <g transform="translate(40, 30)">
    <rect width="1320" height="70" rx="8" fill="#1e293b" stroke="#334155" stroke-width="1.5" filter="url(#drop-shadow-te)" />
    <circle cx="35" cy="35" r="18" fill="url(#grad-sky-te)" />
    <path d="M 26 35 L 44 35 M 35 26 L 35 44" stroke="#ffffff" stroke-width="2.5" stroke-linecap="round" />
    <text x="68" y="32" font-family="'Segoe UI', sans-serif" font-size="20" font-weight="700" fill="#f8fafc">
      DÉTAIL DE FIXATION DU TUBE CARRÉ SUR LA SEMELLE ÉCLISSE CENTRALE (V2)
    </text>
    <text x="68" y="54" font-family="'Segoe UI', sans-serif" font-size="13" font-weight="500" fill="#94a3b8">
      Liaison complète : 4 Vis FHC M4 noyées à fleur + Insert Mâle 20 mm + 1 Vis Traversante Unique CHC M5×70 mm (Axe Z)
    </text>
    <rect x="1130" y="20" width="165" height="30" rx="6" fill="#0284c7" fill-opacity="0.2" stroke="#38bdf8" stroke-width="1" />
    <text x="1212" y="40" text-anchor="middle" font-family="'Segoe UI', sans-serif" font-size="12" font-weight="700" fill="#38bdf8">
      PLAN DE FIXATION V2
    </text>
  </g>

  <!-- ========================================================================= -->
  <!-- PANEL 1: ÉCLATÉ 3D DE LA FIXATION DU TUBE SUR LA SEMELLE ÉCLISSE -->
  <!-- ========================================================================= -->
  <g transform="translate(40, 120)">
    <rect width="640" height="420" rx="10" fill="url(#grad-card-te)" stroke="#334155" stroke-width="1.5" filter="url(#drop-shadow-te)" />
    <rect x="15" y="15" width="370" height="26" rx="4" fill="#0f172a" stroke="#475569" stroke-width="1" />
    <text x="25" y="32" font-family="'Segoe UI', sans-serif" font-size="12" font-weight="700" fill="#38bdf8">
      1. PERSPECTIVE ÉCLATÉE 3D DE L'ASSEMBLAGE (CÔTÉ DROIT)
    </text>

    <g transform="translate(30, 60)">
      <!-- 1. Colonne Centrale 5 mm (Gauche) -->
      <g transform="translate(10, 40)">
        <polygon points="10,20 30,10 30,250 10,260" fill="url(#grad-amber-te)" stroke="#f59e0b" stroke-width="1.5" />
        <text x="5" y="280" font-family="'Segoe UI', sans-serif" font-size="10" font-weight="700" fill="#fcd34d">Colonne 5 mm</text>
      </g>

      <!-- 2. Vis FHC M4 noyées à fleur (Passent de la colonne vers l'insert) -->
      <g transform="translate(40, 95)">
        <line x1="10" y1="30" x2="35" y2="30" stroke="#f8fafc" stroke-width="2.5" stroke-linecap="round" />
        <polygon points="10,27 10,33 16,30" fill="#f8fafc" />
        <line x1="10" y1="130" x2="35" y2="130" stroke="#f8fafc" stroke-width="2.5" stroke-linecap="round" />
        <polygon points="10,127 10,133 16,130" fill="#f8fafc" />
        <text x="25" y="15" text-anchor="middle" font-family="'Segoe UI', sans-serif" font-size="9" font-weight="700" fill="#f8fafc">4x Vis FHC M4</text>
        <text x="25" y="170" text-anchor="middle" font-family="'Segoe UI', sans-serif" font-size="8" fill="#94a3b8">Noyées à fleur</text>
      </g>

      <!-- 3. Semelle Éclisse 5 mm (80 x 130 mm) -->
      <g transform="translate(75, 20)">
        <polygon points="10,20 35,5 35,280 10,295" fill="#0284c7" stroke="#38bdf8" stroke-width="1.5" />
        <text x="22" y="315" text-anchor="middle" font-family="'Segoe UI', sans-serif" font-size="10" font-weight="700" fill="#38bdf8">Semelle 5 mm</text>
        <!-- Trous M5 sandwich colonne (Haut & Bas) -->
        <circle cx="22" cy="40" r="4" fill="#f8fafc" stroke="#0f172a" />
        <circle cx="22" cy="265" r="4" fill="#f8fafc" stroke="#0f172a" />
        <!-- Trous fraisés M4 insert (Centre) -->
        <circle cx="22" cy="120" r="3" fill="#f59e0b" stroke="#0f172a" />
        <circle cx="22" cy="180" r="3" fill="#f59e0b" stroke="#0f172a" />
      </g>

      <!-- 4. Insert Mâle Carré 55.8x55.8x20 mm -->
      <g transform="translate(130, 80)">
        <polygon points="10,30 35,15 35,150 10,165" fill="#0369a1" stroke="#38bdf8" stroke-width="1.5" />
        <polygon points="35,15 85,15 85,150 35,150" fill="#0284c7" stroke="#38bdf8" stroke-width="1.5" />
        <polygon points="10,30 60,30 85,15 35,15" fill="#075985" stroke="#38bdf8" stroke-width="1.5" />
        <!-- Trou Vis Traversante 1 (Axe Z, vertical Ø5.3 mm) -->
        <ellipse cx="48" cy="22" rx="3.5" ry="5" fill="#f8fafc" stroke="#0f172a" />
        <text x="50" y="185" text-anchor="middle" font-family="'Segoe UI', sans-serif" font-size="9" font-weight="700" fill="#93c5fd">Insert 20 mm</text>
      </g>

      <!-- 5. Tube Carré 60x60x2 mm (L=85 mm) -->
      <g transform="translate(240, 65)">
        <polygon points="15,40 45,20 45,170 15,190" fill="#475569" stroke="#38bdf8" stroke-width="1.5" />
        <polygon points="45,20 170,20 170,170 45,170" fill="#334155" stroke="#38bdf8" stroke-width="1.5" />
        <polygon points="15,40 140,40 170,20 45,20" fill="#64748b" stroke="#38bdf8" stroke-width="1.5" />
        <!-- Cavité creuse intérieure -->
        <polygon points="20,43 42,27 42,162 20,178" fill="#0b1120" stroke="#38bdf8" stroke-width="1" />
        <text x="105" y="105" text-anchor="middle" font-family="'Segoe UI', sans-serif" font-size="11" font-weight="700" fill="#f8fafc">TUBE 60×60×2</text>
        <!-- Perçage traversant vertical dans le tube -->
        <ellipse cx="60" cy="30" rx="4" ry="6" fill="#f8fafc" stroke="#0f172a" />
      </g>

      <!-- 6. Vis Traversante Unique CHC M5 x 70 mm + Nylstop -->
      <g transform="translate(300, 20)">
        <!-- Vis 1 Verticale Z -->
        <line x1="5" y1="20" x2="5" y2="280" stroke="#f8fafc" stroke-width="3" stroke-linecap="round" />
        <circle cx="5" cy="22" r="5" fill="#f8fafc" stroke="#0284c7" />
        <circle cx="5" cy="278" r="5" fill="#10b981" stroke="#0284c7" />
        <text x="5" y="10" text-anchor="middle" font-family="'Segoe UI', sans-serif" font-size="9" font-weight="700" fill="#38bdf8">Vis Traversante M5×70 (Z)</text>
      </g>
    </g>
  </g>

  <!-- ========================================================================= -->
  <!-- PANEL 2: VUE EN COUPE AXIALE (Plan X-Z) — TRAJET DE TOUTE LA VISSERIE -->
  <!-- ========================================================================= -->
  <g transform="translate(710, 120)">
    <rect width="650" height="420" rx="10" fill="url(#grad-card-te)" stroke="#334155" stroke-width="1.5" filter="url(#drop-shadow-te)" />
    <rect x="15" y="15" width="370" height="26" rx="4" fill="#0f172a" stroke="#475569" stroke-width="1" />
    <text x="25" y="32" font-family="'Segoe UI', sans-serif" font-size="12" font-weight="700" fill="#38bdf8">
      2. COUPE AXIALE (Plan X-Z) — DÉTAIL DES LIAISONS
    </text>

    <g transform="translate(30, 55)">
      <!-- Colonne Centrale (Jaune/Ambre - 5 mm) -->
      <rect x="20" y="30" width="10" height="270" rx="2" fill="url(#grad-amber-te)" stroke="#f59e0b" stroke-width="1.5" />

      <!-- Semelle Éclisse 5 mm (Bleu ciel) -->
      <rect x="30" y="55" width="10" height="220" rx="2" fill="#0284c7" stroke="#38bdf8" stroke-width="1.5" />

      <!-- Insert Mâle 20 mm usiné (Alu 7075-T6) -->
      <rect x="40" y="105" width="40" height="120" rx="2" fill="#0369a1" stroke="#38bdf8" stroke-width="1.5" />
      <circle cx="60" cy="165" r="18" fill="#0b1120" stroke="#38bdf8" stroke-width="1" />

      <!-- Tube Carré 60x60x2 mm -->
      <rect x="40" y="102" width="180" height="126" rx="4" fill="none" stroke="#38bdf8" stroke-width="2" />
      <text x="130" y="168" text-anchor="middle" font-family="'Segoe UI', sans-serif" font-size="11" font-weight="700" fill="#f8fafc">TUBE 60×60×2</text>

      <!-- Vis FHC M4 noyée à fleur (De la semelle vers l'insert) -->
      <polygon points="30,118 36,114 36,122" fill="#f8fafc" />
      <line x1="36" y1="118" x2="55" y2="118" stroke="#f8fafc" stroke-width="2.5" />
      <text x="58" y="112" font-family="'Segoe UI', sans-serif" font-size="8" fill="#f8fafc">FHC M4</text>

      <!-- Vis Traversante M5x70 en Z (Passant dans le tube et l'insert) -->
      <line x1="60" y1="75" x2="60" y2="255" stroke="#f8fafc" stroke-width="3" stroke-linecap="round" />
      <circle cx="60" cy="80" r="4.5" fill="#f8fafc" stroke="#0284c7" />
      <circle cx="60" cy="250" r="4.5" fill="#10b981" stroke="#0284c7" />
      <text x="60" y="68" text-anchor="middle" font-family="'Segoe UI', sans-serif" font-size="9" font-weight="700" fill="#38bdf8">CHC M5×70 (Z)</text>
      <text x="60" y="270" text-anchor="middle" font-family="'Segoe UI', sans-serif" font-size="9" font-weight="700" fill="#34d399">Nylstop M5</text>

      <!-- Vis Sandwich Colonne M5x25 (Haut et Bas) -->
      <line x1="5" y1="70" x2="45" y2="70" stroke="#f8fafc" stroke-width="3" stroke-linecap="round" />
      <circle cx="10" cy="70" r="4" fill="#f8fafc" stroke="#0f172a" />
      <circle cx="40" cy="70" r="4" fill="#10b981" stroke="#0f172a" />
      <text x="50" y="65" font-family="'Segoe UI', sans-serif" font-size="9" font-weight="700" fill="#fcd34d">M5×25 Sandwich</text>

      <line x1="5" y1="260" x2="45" y2="260" stroke="#f8fafc" stroke-width="3" stroke-linecap="round" />
      <circle cx="10" cy="260" r="4" fill="#f8fafc" stroke="#0f172a" />
      <circle cx="40" cy="260" r="4" fill="#10b981" stroke="#0f172a" />
    </g>
  </g>
</svg>
