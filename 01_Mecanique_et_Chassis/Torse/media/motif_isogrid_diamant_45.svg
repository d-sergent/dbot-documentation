<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 340" width="100%" height="100%">
  <defs>
    <pattern id="grid" width="20" height="20" patternUnits="userSpaceOnUse">
      <path d="M 20 0 L 0 0 0 20" fill="none" stroke="#2a324b" stroke-width="0.8"/>
    </pattern>
    <linearGradient id="aluPlate" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#475569"/>
      <stop offset="50%" stop-color="#334155"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
    <linearGradient id="ribGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#0284c7"/>
    </linearGradient>
  </defs>

  <rect width="100%" height="100%" fill="#0f172a"/>
  <rect width="100%" height="100%" fill="url(#grid)"/>

  <text x="390" y="28" fill="#f8fafc" font-family="system-ui, sans-serif" font-size="14" font-weight="bold" text-anchor="middle">
    PLAQUE ISOGRID SAGITTALE — COUPE SYMÉTRIQUE DOUBLE FACE (PROFIL EN I)
  </text>

  <!-- Main Plate View (Left) -->
  <g transform="translate(30, 45)">
    <rect width="380" height="240" rx="6" fill="url(#aluPlate)" stroke="#64748b" stroke-width="1.5"/>

    <!-- Diamond Pattern Lines +45 deg -->
    <path d="M 20 0 L 250 240 M 70 0 L 300 240 M 120 0 L 350 240 M 170 0 L 380 210 M 220 0 L 380 160 M 270 0 L 380 110" 
          stroke="url(#ribGrad)" stroke-width="3" stroke-linecap="round"/>
    <!-- Diamond Pattern Lines -45 deg -->
    <path d="M 360 0 L 130 240 M 310 0 L 80 240 M 260 0 L 30 240 M 210 0 L 0 210 M 160 0 L 0 160 M 110 0 L 0 110" 
          stroke="url(#ribGrad)" stroke-width="3" stroke-linecap="round"/>

    <!-- Force Vectors -->
    <path d="M 190 60 L 240 110" stroke="#f59e0b" stroke-width="2.5"/>
    <text x="220" y="75" fill="#f59e0b" font-family="system-ui, sans-serif" font-size="10" font-weight="bold">+45° Traction (σ+)</text>

    <path d="M 190 180 L 140 130" stroke="#ef4444" stroke-width="2.5"/>
    <text x="100" y="165" fill="#ef4444" font-family="system-ui, sans-serif" font-size="10" font-weight="bold">-45° Compression (σ-)</text>
  </g>

  <!-- Cross-Section Panel Double-Face (Right) -->
  <g transform="translate(440, 45)">
    <rect width="310" height="240" rx="6" fill="#1e293b" stroke="#334155" stroke-width="1.5"/>
    <text x="155" y="25" fill="#38bdf8" font-family="system-ui, sans-serif" font-size="12" font-weight="bold" text-anchor="middle">
      Coupe Double Face Symétrique
    </text>

    <!-- Central Web (Voile résiduel 1.5mm) -->
    <rect x="25" y="115" width="260" height="15" fill="#38bdf8" stroke="#0284c7" stroke-width="1"/>
    <text x="155" y="126" fill="#0f172a" font-family="system-ui, sans-serif" font-size="9" font-weight="bold" text-anchor="middle">
      Voile Central Résiduel (1.5 mm)
    </text>

    <!-- Top Ribs (Face A) -->
    <rect x="40" y="65" width="30" height="50" fill="#0284c7" stroke="#38bdf8" stroke-width="1"/>
    <rect x="140" y="65" width="30" height="50" fill="#0284c7" stroke="#38bdf8" stroke-width="1"/>
    <rect x="240" y="65" width="30" height="50" fill="#0284c7" stroke="#38bdf8" stroke-width="1"/>
    <text x="285" y="90" fill="#cbd5e0" font-family="system-ui, sans-serif" font-size="8">Face A</text>

    <!-- Bottom Ribs (Face B - Symmetric) -->
    <rect x="40" y="130" width="30" height="50" fill="#0284c7" stroke="#38bdf8" stroke-width="1"/>
    <rect x="140" y="130" width="30" height="50" fill="#0284c7" stroke="#38bdf8" stroke-width="1"/>
    <rect x="240" y="130" width="30" height="50" fill="#0284c7" stroke="#38bdf8" stroke-width="1"/>
    <text x="285" y="155" fill="#cbd5e0" font-family="system-ui, sans-serif" font-size="8">Face B</text>

    <!-- Dimensions -->
    <!-- Top Pocket Depth -->
    <line x1="15" y1="65" x2="15" y2="115" stroke="#f59e0b" stroke-width="1"/>
    <text x="10" y="92" fill="#f59e0b" font-family="system-ui, sans-serif" font-size="8" font-weight="bold" text-anchor="end">1.75 mm (tôle 5mm)</text>
    <text x="10" y="102" fill="#f59e0b" font-family="system-ui, sans-serif" font-size="8" font-weight="bold" text-anchor="end">ou 3.5 mm (tôle 8.5mm)</text>

    <!-- Bottom Pocket Depth -->
    <line x1="15" y1="130" x2="15" y2="180" stroke="#f59e0b" stroke-width="1"/>
    <text x="10" y="157" fill="#f59e0b" font-family="system-ui, sans-serif" font-size="8" font-weight="bold" text-anchor="end">Idem Face B</text>

    <!-- Rib Width -->
    <text x="155" y="55" fill="#38bdf8" font-family="system-ui, sans-serif" font-size="9" font-weight="bold" text-anchor="middle">Nervures : Larg. 3 mm</text>
    <!-- Pitch -->
    <text x="155" y="200" fill="#a855f7" font-family="system-ui, sans-serif" font-size="9" font-weight="bold" text-anchor="middle">Pas du motif : 20 - 25 mm</text>
  </g>

  <!-- Footnote -->
  <text x="390" y="315" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="9" text-anchor="middle">
    ⚠️ L'usinage double-face garantit l'alignement de la fibre neutre au centre et empêche tout gauchissement de la tôle.
  </text>
</svg>
