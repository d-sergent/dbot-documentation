<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1360 780" width="1360" height="780">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090d16"/>
      <stop offset="55%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#0b1120"/>
    </linearGradient>
    <linearGradient id="panelGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" stop-opacity="0.96"/>
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0.96"/>
    </linearGradient>
    <linearGradient id="aluOrange" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#c2410c"/>
      <stop offset="50%" stop-color="#ea580c"/>
      <stop offset="100%" stop-color="#f97316"/>
    </linearGradient>
    <linearGradient id="aluAmber" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#b45309"/>
      <stop offset="50%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#d97706"/>
    </linearGradient>
    <linearGradient id="aluBlue" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#1e3a8a"/>
      <stop offset="50%" stop-color="#2563eb"/>
      <stop offset="100%" stop-color="#1d4ed8"/>
    </linearGradient>
    <linearGradient id="steelGreen" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#15803d"/>
      <stop offset="50%" stop-color="#22c55e"/>
      <stop offset="100%" stop-color="#16a34a"/>
    </linearGradient>
    <linearGradient id="paViolet" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#5b21b6"/>
      <stop offset="50%" stop-color="#7c3aed"/>
      <stop offset="100%" stop-color="#6d28d9"/>
    </linearGradient>
    <linearGradient id="motorSlate" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#334155"/>
      <stop offset="50%" stop-color="#475569"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
    <pattern id="gridPat" width="30" height="30" patternUnits="userSpaceOnUse">
      <path d="M 30 0 L 0 0 0 30" fill="none" stroke="#334155" stroke-width="0.55" stroke-opacity="0.28"/>
    </pattern>
    <pattern id="hatchWaste" width="10" height="10" patternTransform="rotate(45 0 0)" patternUnits="userSpaceOnUse">
      <line x1="0" y1="0" x2="0" y2="10" stroke="#ef4444" stroke-width="1.6" stroke-opacity="0.55"/>
    </pattern>
    <marker id="arrCyan" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <polygon points="0 1, 8 4, 0 7" fill="#38bdf8"/>
    </marker>
    <marker id="arrRed" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <polygon points="0 1, 8 4, 0 7" fill="#ef4444"/>
    </marker>
    <marker id="arrAmber" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <polygon points="0 1, 8 4, 0 7" fill="#f59e0b"/>
    </marker>
    <marker id="arrGreen" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <polygon points="0 1, 8 4, 0 7" fill="#10b981"/>
    </marker>
    <filter id="cardShadow" x="-8%" y="-8%" width="116%" height="116%">
      <feDropShadow dx="0" dy="5" stdDeviation="6" flood-color="#000000" flood-opacity="0.55"/>
    </filter>
  </defs>
  <rect width="1360" height="780" fill="url(#bgGrad)"/>
  <rect width="1360" height="780" fill="url(#gridPat)"/>
  <g transform="translate(30, 22)">
    <rect width="1300" height="74" rx="12" fill="#1e293b" stroke="#3b82f6" stroke-width="1.5" filter="url(#cardShadow)"/>
    <circle cx="42" cy="37" r="20" fill="#38bdf8" fill-opacity="0.18" stroke="#38bdf8" stroke-width="2"/>
    <text x="42" y="44" font-family="Arial, sans-serif" font-size="19" font-weight="bold" fill="#38bdf8" text-anchor="middle">+</text>
    <text x="76" y="31" font-family="Arial, sans-serif" font-size="18" font-weight="bold" fill="#f8fafc">INTÉGRATION ROTOR ROBSTRIDE RS-04 — ROULEMENT CROISÉ &amp; GOUPILLES CALIBRÉES</text>
    <text x="76" y="54" font-family="Arial, sans-serif" font-size="12" fill="#94a3b8">Chaîne cinématique Hanche &amp; Épaule — Roulement croisé intégré (150–200 N.m) + protection cisaillement ISO 8734</text>
    <rect x="1036" y="19" width="240" height="36" rx="8" fill="#0f172a" stroke="#38bdf8" stroke-width="1.3"/>
    <text x="1156" y="42" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#38bdf8" text-anchor="middle">DOC-ENG-RS04-RT</text>
  </g>

  <!-- PANEL 1 : AXIAL CUTAWAY -->
  <g transform="translate(30, 114)">
    <rect width="465" height="636" rx="12" fill="url(#panelGrad)" stroke="#38bdf8" stroke-width="1.3" filter="url(#cardShadow)"/>
    <text x="18" y="30" font-family="Arial, sans-serif" font-size="12.5" font-weight="bold" fill="#38bdf8">1. COUPE AXIALE ROULEMENT CROISÉ INTERNE</text>

    <!-- Clean Cutaway -->
    <rect x="64" y="64" width="166" height="58" rx="4" fill="url(#aluAmber)" stroke="#fde68a" stroke-width="1.5"/>
    <text x="147" y="88" font-family="Arial, sans-serif" font-size="11" font-weight="bold" fill="#fff" text-anchor="middle">STATOR FIXE (Ø 120)</text>
    <text x="147" y="106" font-family="Arial, sans-serif" font-size="10" fill="#fef3c7" text-anchor="middle">Arbre plein / Carter fermé</text>

    <rect x="64" y="294" width="166" height="58" rx="4" fill="url(#aluAmber)" stroke="#fde68a" stroke-width="1.5"/>

    <!-- Crossed roller bearing squares top/bottom -->
    <rect x="134" y="132" width="38" height="32" rx="3" fill="#0f172a" stroke="#ef4444" stroke-width="2"/>
    <line x1="138" y1="136" x2="168" y2="160" stroke="#ef4444" stroke-width="1.8"/>
    <line x1="168" y1="136" x2="138" y2="160" stroke="#ef4444" stroke-width="1.8"/>

    <rect x="134" y="252" width="38" height="32" rx="3" fill="#0f172a" stroke="#ef4444" stroke-width="2"/>
    <line x1="138" y1="256" x2="168" y2="280" stroke="#ef4444" stroke-width="1.8"/>
    <line x1="168" y1="256" x2="138" y2="280" stroke="#ef4444" stroke-width="1.8"/>

    <!-- Rotor hub -->
    <rect x="108" y="170" width="96" height="76" rx="4" fill="url(#aluBlue)" stroke="#93c5fd" stroke-width="1.8"/>
    <text x="156" y="204" font-family="Arial, sans-serif" font-size="11.5" font-weight="bold" fill="#fff" text-anchor="middle">ROTOR</text>
    <text x="156" y="222" font-family="Arial, sans-serif" font-size="10" fill="#bfdbfe" text-anchor="middle">PCD Ø 36 mm</text>

    <!-- L-Bracket Cuisse/Bras Alu 7075 -->
    <path d="M 210 144 L 246 144 L 246 310 L 210 310 L 210 264 L 224 264 L 224 190 L 210 190 Z" fill="url(#motorSlate)" stroke="#e2e8f0" stroke-width="1.8"/>
    <!-- Pin + M5 bolt lines -->
    <line x1="184" y1="156" x2="262" y2="156" stroke="#38bdf8" stroke-width="2.2"/>
    <line x1="184" y1="286" x2="262" y2="286" stroke="#facc15" stroke-width="2.6"/>

    <!-- Non-overlapping callouts strictly on RIGHT (x=270..448) -->
    <line x1="256" y1="156" x2="278" y2="128" stroke="#38bdf8" stroke-width="1.2"/>
    <text x="282" y="124" font-family="Arial, sans-serif" font-size="10.5" font-weight="bold" fill="#38bdf8">Vis M5 cl. 12.9</text>
    <text x="282" y="140" font-family="Arial, sans-serif" font-size="10" fill="#cbd5e1">(9× traction pure)</text>

    <line x1="172" y1="148" x2="278" y2="196" stroke="#ef4444" stroke-width="1.2"/>
    <text x="282" y="192" font-family="Arial, sans-serif" font-size="10.5" font-weight="bold" fill="#fca5a5">ROULEMENT CROISÉ</text>
    <text x="282" y="208" font-family="Arial, sans-serif" font-size="10" fill="#cbd5e1">C_basc = 150–200 N.m</text>

    <text x="282" y="246" font-family="Arial, sans-serif" font-size="10.5" font-weight="bold" fill="#f8fafc">BRACKET 7075</text>
    <text x="282" y="262" font-family="Arial, sans-serif" font-size="10" fill="#cbd5e1">(Fémur / Bras)</text>

    <line x1="256" y1="286" x2="278" y2="306" stroke="#facc15" stroke-width="1.2"/>
    <text x="282" y="302" font-family="Arial, sans-serif" font-size="10.5" font-weight="bold" fill="#facc15">Goupilles Ø 5 / Ø 6</text>
    <text x="282" y="318" font-family="Arial, sans-serif" font-size="10" fill="#fde68a">100 % cisaillement 120 N.m</text>

    <text x="232" y="384" font-family="Arial, sans-serif" font-size="10.5" font-weight="bold" fill="#34d399" text-anchor="middle">Moment hanche M_dyn = 50–90 N.m -&gt; repris par palier interne</text>

    <!-- Bottom Box y=412..618 -->
    <rect x="18" y="412" width="429" height="206" rx="8" fill="#0f172a" stroke="#334155"/>
    <text x="32" y="438" font-family="Arial, sans-serif" font-size="11.5" font-weight="bold" fill="#38bdf8">ANATOMIE DU RS-04 : ROULEAU CROISÉ INTÉGRÉ</text>
    <text x="32" y="466" font-family="Arial, sans-serif" font-size="11" fill="#cbd5e1">• Roulement à rouleaux croisés Ø 80 mm intégré d'usine.</text>
    <text x="32" y="492" font-family="Arial, sans-serif" font-size="11" fill="#cbd5e1">• Capacité au basculement : M_0 = 150 à 200 N.m.</text>
    <text x="32" y="518" font-family="Arial, sans-serif" font-size="11" fill="#cbd5e1">• Moment réel max hanche bipède (35 kg) : 50 à 90 N.m.</text>
    <text x="32" y="544" font-family="Arial, sans-serif" font-size="11" font-weight="bold" fill="#34d399">• Facteur sécurité Sf ~ 1,8 à 2,2 SANS palier externe.</text>
    <text x="32" y="572" font-family="Arial, sans-serif" font-size="11" fill="#94a3b8">• Bilan : supprimer le palier externe économise ~300 g / côté.</text>
  </g>

  <!-- PANEL 2 : ROTOR BOLT & PIN PATTERN -->
  <g transform="translate(515, 114)">
    <rect width="465" height="636" rx="12" fill="url(#panelGrad)" stroke="#10b981" stroke-width="1.3" filter="url(#cardShadow)"/>
    <text x="18" y="30" font-family="Arial, sans-serif" font-size="12.5" font-weight="bold" fill="#10b981">2. MOTIF ROTOR : 9× VIS M5 + 5 GOUPILLES ISO 8734</text>

    <!-- Concentric Rotor at cx=232, cy=224 -->
    <circle cx="232" cy="224" r="106" fill="none" stroke="#64748b" stroke-width="1.5" stroke-dasharray="5,4"/>
    <circle cx="232" cy="224" r="78" fill="#1e293b" stroke="#3b82f6" stroke-width="2.5"/>
    <circle cx="232" cy="224" r="24" fill="#090e1a" stroke="#64748b" stroke-width="1.5"/>
    <text x="232" y="220" font-family="Arial, sans-serif" font-size="9.5" font-weight="bold" fill="#94a3b8" text-anchor="middle">CENTRE</text>
    <text x="232" y="232" font-family="Arial, sans-serif" font-size="9" fill="#64748b" text-anchor="middle">BORGNE</text>

    <!-- 9 M5 bolts on r=56 -->
    <circle cx="232" cy="168" r="5.5" fill="#38bdf8" stroke="#fff" stroke-width="1"/>
    <circle cx="268" cy="181" r="5.5" fill="#38bdf8" stroke="#fff" stroke-width="1"/>
    <circle cx="287" cy="214" r="5.5" fill="#38bdf8" stroke="#fff" stroke-width="1"/>
    <circle cx="281" cy="252" r="5.5" fill="#38bdf8" stroke="#fff" stroke-width="1"/>
    <circle cx="251" cy="276" r="5.5" fill="#38bdf8" stroke="#fff" stroke-width="1"/>
    <circle cx="213" cy="276" r="5.5" fill="#38bdf8" stroke="#fff" stroke-width="1"/>
    <circle cx="183" cy="252" r="5.5" fill="#38bdf8" stroke="#fff" stroke-width="1"/>
    <circle cx="177" cy="214" r="5.5" fill="#38bdf8" stroke="#fff" stroke-width="1"/>
    <circle cx="196" cy="181" r="5.5" fill="#38bdf8" stroke="#fff" stroke-width="1"/>

    <!-- 5 Dowel pins on r=56 (2x Ø 5 + 3x Ø 6) -->
    <circle cx="232" cy="280" r="7" fill="#facc15" stroke="#fff" stroke-width="1.3"/>
    <circle cx="179" cy="197" r="7" fill="#facc15" stroke="#fff" stroke-width="1.3"/>
    <circle cx="285" cy="197" r="7" fill="#facc15" stroke="#fff" stroke-width="1.3"/>
    <circle cx="204" cy="171" r="6" fill="#fde047" stroke="#fff" stroke-width="1.2"/>
    <circle cx="260" cy="171" r="6" fill="#fde047" stroke="#fff" stroke-width="1.2"/>

    <!-- External labels well outside circle -->
    <line x1="204" y1="166" x2="156" y2="104" stroke="#fde047" stroke-width="1.3"/>
    <text x="150" y="96" font-family="Arial, sans-serif" font-size="11" font-weight="bold" fill="#fde047" text-anchor="end">2× Goupilles Ø 5,0</text>
    <text x="150" y="112" font-family="Arial, sans-serif" font-size="10" fill="#cbd5e1" text-anchor="end">PCD Ø 35,86 mm</text>

    <line x1="287" y1="197" x2="338" y2="128" stroke="#38bdf8" stroke-width="1.3"/>
    <text x="342" y="124" font-family="Arial, sans-serif" font-size="11" font-weight="bold" fill="#38bdf8">9× Vis M5 cl. 12.9</text>
    <text x="342" y="140" font-family="Arial, sans-serif" font-size="10" fill="#cbd5e1">PCD Ø 36,0 mm</text>

    <line x1="179" y1="197" x2="128" y2="254" stroke="#facc15" stroke-width="1.3"/>
    <text x="122" y="256" font-family="Arial, sans-serif" font-size="11" font-weight="bold" fill="#facc15" text-anchor="end">3× Goupilles Ø 6,0</text>
    <text x="122" y="272" font-family="Arial, sans-serif" font-size="10" fill="#cbd5e1" text-anchor="end">ISO 8734 trempées</text>

    <text x="232" y="368" font-family="Arial, sans-serif" font-size="11" font-weight="bold" fill="#94a3b8" text-anchor="middle">Couronne Rotor RS-04 Ø 90 mm — Entraxe goupilles/vis calibré H7</text>

    <rect x="18" y="412" width="429" height="206" rx="8" fill="#0f172a" stroke="#10b981"/>
    <text x="32" y="438" font-family="Arial, sans-serif" font-size="11.5" font-weight="bold" fill="#34d399">RÈGLE RDM : DÉCOUPLAGE TRACTION / CISAILLEMENT</text>
    <text x="32" y="466" font-family="Arial, sans-serif" font-size="11" font-weight="bold" fill="#f8fafc">• COUPLE DE CRÊTE (120 N.m) :</text>
    <text x="44" y="486" font-family="Arial, sans-serif" font-size="10.5" fill="#cbd5e1">Les vis M5 ne doivent JAMAIS encaisser le cisaillement seul.</text>
    <text x="32" y="514" font-family="Arial, sans-serif" font-size="11" font-weight="bold" fill="#fde68a">• 5 GOUPILLES TREMPÉES ISO 8734 (2× Ø5 + 3× Ø6) :</text>
    <text x="44" y="534" font-family="Arial, sans-serif" font-size="10.5" fill="#cbd5e1">Reprennent 100 % du cisaillement tangentiel sans micro-jeu.</text>
    <text x="32" y="562" font-family="Arial, sans-serif" font-size="11" font-weight="bold" fill="#38bdf8">• RÔLE DES 9 VIS M5 : Plaquage axial (5,5 N.m + Loctite 243).</text>
    <text x="32" y="592" font-family="Arial, sans-serif" font-size="11" font-weight="bold" fill="#34d399">→ Liaison indesserrable sous chocs cycliques de marche.</text>
  </g>

  <!-- PANEL 3 : DECISION MATRIX -->
  <g transform="translate(1000, 114)">
    <rect width="330" height="636" rx="12" fill="url(#panelGrad)" stroke="#334155" stroke-width="1.3" filter="url(#cardShadow)"/>
    <text x="18" y="30" font-family="Arial, sans-serif" font-size="12.5" font-weight="bold" fill="#38bdf8">3. MATRICE DE DÉCISION</text>

    <rect x="18" y="52" width="294" height="126" rx="8" fill="#0f172a" stroke="#38bdf8"/>
    <text x="30" y="76" font-family="Arial, sans-serif" font-size="11.5" font-weight="bold" fill="#38bdf8">1. ÉPAULE PITCH (RS-04)</text>
    <text x="30" y="100" font-family="Arial, sans-serif" font-size="11" fill="#cbd5e1">• Moment max bras : 24 à 73 N.m</text>
    <text x="30" y="122" font-family="Arial, sans-serif" font-size="11" font-weight="bold" fill="#34d399">• Roulement externe : AUCUN</text>
    <text x="30" y="142" font-family="Arial, sans-serif" font-size="10.5" fill="#94a3b8">Palier interne RS-04 suffisant</text>
    <text x="30" y="162" font-family="Arial, sans-serif" font-size="10.5" fill="#a7f3d0">Gain masse : ~360 g / bras</text>

    <rect x="18" y="194" width="294" height="128" rx="8" fill="#0f172a" stroke="#10b981"/>
    <text x="30" y="218" font-family="Arial, sans-serif" font-size="11.5" font-weight="bold" fill="#34d399">2. HANCHE PITCH (RS-04)</text>
    <text x="30" y="242" font-family="Arial, sans-serif" font-size="11" fill="#cbd5e1">• Moment choc : 50 à 90 N.m</text>
    <text x="30" y="264" font-family="Arial, sans-serif" font-size="11" font-weight="bold" fill="#34d399">• Roulement externe : AUCUN</text>
    <text x="30" y="284" font-family="Arial, sans-serif" font-size="10.5" fill="#fde68a">• Goupilles ISO 8734 : OBLIGATOIRES</text>
    <text x="30" y="304" font-family="Arial, sans-serif" font-size="10.5" fill="#94a3b8">Protègent les vis M5 au cisaillement</text>

    <rect x="18" y="338" width="294" height="126" rx="8" fill="#0f172a" stroke="#f59e0b"/>
    <text x="30" y="362" font-family="Arial, sans-serif" font-size="11.5" font-weight="bold" fill="#fde68a">3. GENOU KNEE (RS-04 + GT3)</text>
    <text x="30" y="386" font-family="Arial, sans-serif" font-size="11" fill="#cbd5e1">• Transmission courroie GT3 2,5:1</text>
    <text x="30" y="408" font-family="Arial, sans-serif" font-size="11" font-weight="bold" fill="#34d399">• Tension courroie seule (~50 N)</text>
    <text x="30" y="428" font-family="Arial, sans-serif" font-size="10.5" fill="#94a3b8">Zéro choc direct sur rotor RS-04</text>
    <text x="30" y="448" font-family="Arial, sans-serif" font-size="10.5" fill="#cbd5e1">Palier dédié sur axe genou 50T</text>

    <rect x="18" y="480" width="294" height="138" rx="8" fill="#0f172a" stroke="#a855f7"/>
    <text x="30" y="504" font-family="Arial, sans-serif" font-size="11.5" font-weight="bold" fill="#d8b4fe">4. TAILLE YAW (RS-06 + RB8016)</text>
    <text x="30" y="528" font-family="Arial, sans-serif" font-size="11" fill="#cbd5e1">• Moment basculement : 56–220 N.m</text>
    <text x="30" y="550" font-family="Arial, sans-serif" font-size="11" font-weight="bold" fill="#facc15">• RB8016 (633,41 g) : INDISPENSABLE</text>
    <text x="30" y="570" font-family="Arial, sans-serif" font-size="10.5" fill="#cbd5e1">Capacité 520 N.m (RS-06 ne prend</text>
    <text x="30" y="588" font-family="Arial, sans-serif" font-size="10.5" fill="#cbd5e1">que la torsion pure via Moyeu 7075)</text>
  </g>
</svg>