<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 980" width="1440" height="980">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090d16"/>
      <stop offset="55%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#0b1120"/>
    </linearGradient>
    <linearGradient id="panelGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" stop-opacity="0.96"/>
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0.96"/>
    </linearGradient>
    <linearGradient id="aluOrange" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#c2410c"/>
      <stop offset="50%" stop-color="#ea580c"/>
      <stop offset="100%" stop-color="#f97316"/>
    </linearGradient>
    <linearGradient id="aluAmber" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#b45309"/>
      <stop offset="50%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#d97706"/>
    </linearGradient>
    <linearGradient id="aluBlue" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#1e3a8a"/>
      <stop offset="50%" stop-color="#2563eb"/>
      <stop offset="100%" stop-color="#1d4ed8"/>
    </linearGradient>
    <linearGradient id="steelGreen" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#15803d"/>
      <stop offset="50%" stop-color="#22c55e"/>
      <stop offset="100%" stop-color="#16a34a"/>
    </linearGradient>
    <linearGradient id="paViolet" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#5b21b6"/>
      <stop offset="50%" stop-color="#7c3aed"/>
      <stop offset="100%" stop-color="#6d28d9"/>
    </linearGradient>
    <linearGradient id="motorSlate" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#334155"/>
      <stop offset="50%" stop-color="#475569"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
    <pattern id="gridPat" width="30" height="30" patternUnits="userSpaceOnUse">
      <path d="M 30 0 L 0 0 0 30" fill="none" stroke="#334155" stroke-width="0.55" stroke-opacity="0.28"/>
    </pattern>
    <pattern id="hatchWaste" width="10" height="10" patternTransform="rotate(45 0 0)" patternUnits="userSpaceOnUse">
      <line x1="0" y1="0" x2="0" y2="10" stroke="#ef4444" stroke-width="1.6" stroke-opacity="0.55"/>
    </pattern>
    <marker id="arrCyan" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <polygon points="0 1, 8 4, 0 7" fill="#38bdf8"/>
    </marker>
    <marker id="arrRed" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <polygon points="0 1, 8 4, 0 7" fill="#ef4444"/>
    </marker>
    <marker id="arrAmber" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <polygon points="0 1, 8 4, 0 7" fill="#f59e0b"/>
    </marker>
    <marker id="arrGreen" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <polygon points="0 1, 8 4, 0 7" fill="#10b981"/>
    </marker>
    <filter id="cardShadow" x="-8%" y="-8%" width="116%" height="116%">
      <feDropShadow dx="0" dy="5" stdDeviation="6" flood-color="#000000" flood-opacity="0.55"/>
    </filter>
  </defs>
  <rect width="1440" height="980" fill="url(#bgGrad)"/>
  <rect width="1440" height="980" fill="url(#gridPat)"/>
  <g transform="translate(30, 22)">
    <rect width="1380" height="74" rx="12" fill="#1e293b" stroke="#3b82f6" stroke-width="1.5" filter="url(#cardShadow)"/>
    <circle cx="42" cy="37" r="20" fill="#38bdf8" fill-opacity="0.18" stroke="#38bdf8" stroke-width="2"/>
    <text x="42" y="44" font-family="Arial, sans-serif" font-size="19" font-weight="bold" fill="#38bdf8" text-anchor="middle">+</text>
    <text x="76" y="31" font-family="Arial, sans-serif" font-size="18" font-weight="bold" fill="#f8fafc">DÉTAIL FIXATION TUBE CARRÉ 60×60×2 SUR SEMELLE ÉCLISSE CENTRALE (v42)</text>
    <text x="76" y="54" font-family="Arial, sans-serif" font-size="12" fill="#94a3b8">4× Vis FHC M4×30 [92125A220] à fleur + Insert 15° (85,71 g) + Vis M5×70 [91290A272] + Sandwich Colonne [90348A023]</text>
    <rect x="1106" y="19" width="250" height="36" rx="8" fill="#0f172a" stroke="#38bdf8" stroke-width="1.3"/>
    <text x="1231" y="42" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#38bdf8" text-anchor="middle">PLAN DE FIXATION v42</text>
  </g>

  <!-- PANEL 1 : 3D EXPLODED VIEW -->
  <g transform="translate(30, 114)">
    <rect width="675" height="486" rx="12" fill="url(#panelGrad)" stroke="#334155" stroke-width="1.3" filter="url(#cardShadow)"/>
    <text x="18" y="30" font-family="Arial, sans-serif" font-size="13" font-weight="bold" fill="#38bdf8">1. PERSPECTIVE ÉCLATÉE 3D DE L'EMPILEMENT COMPLET (CÔTÉ DROIT)</text>

    <!-- Slanted Isometric plates cleanly spaced -->
    <polygon points="82,126 106,112 106,368 82,382" fill="url(#aluAmber)" stroke="#fde68a" stroke-width="1.6"/>
    <polygon points="154,132 178,118 178,362 154,376" fill="url(#aluOrange)" stroke="#fdba74" stroke-width="1.6"/>
    <polygon points="228,176 286,158 286,294 228,312" fill="url(#steelGreen)" stroke="#86efac" stroke-width="1.8"/>
    <polygon points="348,164 568,144 568,312 348,332" fill="url(#aluBlue)" stroke="#38bdf8" stroke-width="2"/>
    <polygon points="568,144 596,158 596,298 568,312" fill="#0f172a" stroke="#38bdf8" stroke-width="1.6"/>

    <!-- Axis guide arrows -->
    <line x1="48" y1="176" x2="254" y2="176" stroke="#34d399" stroke-width="1.5" stroke-dasharray="4,3" marker-end="url(#arrGreen)"/>
    <line x1="48" y1="306" x2="254" y2="306" stroke="#34d399" stroke-width="1.5" stroke-dasharray="4,3" marker-end="url(#arrGreen)"/>
    <!-- Vertical M5x70 axis -->
    <line x1="430" y1="92" x2="430" y2="378" stroke="#ef4444" stroke-width="2" stroke-dasharray="4,3"/>
    <rect x="424" y="84" width="12" height="10" fill="#ef4444"/>
    <rect x="424" y="378" width="12" height="10" fill="#facc15"/>

    <!-- Clean external labels -->
    <text x="86" y="408" font-family="Arial, sans-serif" font-size="10.5" font-weight="bold" fill="#fde68a" text-anchor="middle">Colonne 5 mm</text>
    <text x="174" y="408" font-family="Arial, sans-serif" font-size="10.5" font-weight="bold" fill="#fdba74" text-anchor="middle">Semelle 5 mm</text>
    <text x="257" y="338" font-family="Arial, sans-serif" font-size="11" font-weight="bold" fill="#86efac" text-anchor="middle">Insert 15°</text>
    <text x="257" y="356" font-family="Arial, sans-serif" font-size="10" fill="#a7f3d0" text-anchor="middle">(85,71 g | Ø 35)</text>
    <text x="458" y="232" font-family="Arial, sans-serif" font-size="13" font-weight="bold" fill="#f8fafc" text-anchor="middle">TUBE 60×60×2</text>
    <text x="458" y="252" font-family="Arial, sans-serif" font-size="11" fill="#bfdbfe" text-anchor="middle">Alu 6060-T6 (100,04 g)</text>
    <text x="458" y="270" font-family="Arial, sans-serif" font-size="10.5" fill="#93c5fd" text-anchor="middle">L = 80,07 / 81,08 mm</text>

    <text x="64" y="88" font-family="Arial, sans-serif" font-size="10.5" font-weight="bold" fill="#34d399">4× FHC M4×30 [92125A220]</text>
    <text x="430" y="72" font-family="Arial, sans-serif" font-size="10.5" font-weight="bold" fill="#fca5a5" text-anchor="middle">CHC M5×70 [91290A272] + Nylstop M5</text>
    <text x="338" y="458" font-family="Arial, sans-serif" font-size="10.5" fill="#94a3b8" text-anchor="middle">4× CHC M5×25 [90348A023] + 4× Nylstop [90631A113] + 4× Goupilles Ø 3×14 [91585A374]</text>
  </g>

  <!-- PANEL 2 : AXIAL SECTION X-Z -->
  <g transform="translate(735, 114)">
    <rect width="675" height="486" rx="12" fill="url(#panelGrad)" stroke="#10b981" stroke-width="1.3" filter="url(#cardShadow)"/>
    <text x="18" y="30" font-family="Arial, sans-serif" font-size="13" font-weight="bold" fill="#10b981">2. COUPE AXIALE (PLAN X-Z) — TRAJET DES VISSERIES</text>

    <!-- Central Sandwich -->
    <rect x="208" y="96" width="16" height="290" fill="url(#aluAmber)" stroke="#fde68a" stroke-width="1.5"/>
    <rect x="224" y="96" width="16" height="290" fill="url(#aluOrange)" stroke="#fdba74" stroke-width="1.5"/>
    <rect x="192" y="96" width="16" height="290" fill="url(#aluOrange)" stroke="#fdba74" stroke-width="1.5"/>

    <!-- Right Insert + Tube -->
    <rect x="240" y="162" width="52" height="158" fill="url(#steelGreen)" stroke="#86efac" stroke-width="1.5"/>
    <rect x="292" y="156" width="220" height="170" fill="url(#aluBlue)" stroke="#38bdf8" stroke-width="2"/>
    <text x="402" y="236" font-family="Arial, sans-serif" font-size="12.5" font-weight="bold" fill="#fff" text-anchor="middle">TUBE 60×60×2</text>
    <text x="402" y="256" font-family="Arial, sans-serif" font-size="10.5" fill="#bfdbfe" text-anchor="middle">Emboîtement 15,0 mm sur Insert</text>

    <!-- Bolts in section -->
    <line x1="176" y1="122" x2="258" y2="122" stroke="#facc15" stroke-width="2.6"/>
    <line x1="176" y1="360" x2="258" y2="360" stroke="#facc15" stroke-width="2.6"/>
    <line x1="214" y1="184" x2="310" y2="184" stroke="#34d399" stroke-width="2.4"/>
    <line x1="214" y1="296" x2="310" y2="296" stroke="#34d399" stroke-width="2.4"/>
    <line x1="340" y1="118" x2="340" y2="364" stroke="#ef4444" stroke-width="2.6"/>
    <rect x="334" y="110" width="12" height="10" fill="#ef4444"/>
    <rect x="334" y="362" width="12" height="10" fill="#facc15"/>

    <!-- Clean Callouts outside geometry -->
    <line x1="258" y1="122" x2="302" y2="86" stroke="#facc15"/>
    <text x="308" y="88" font-family="Arial, sans-serif" font-size="11" font-weight="bold" fill="#facc15">4× M5×25 [90348A023] (Sandwich Colonne)</text>

    <line x1="214" y1="184" x2="156" y2="162" stroke="#34d399"/>
    <text x="150" y="156" font-family="Arial, sans-serif" font-size="10" font-weight="bold" fill="#34d399" text-anchor="end">FHC M4×30</text>
    <text x="150" y="170" font-family="Arial, sans-serif" font-size="10" font-weight="bold" fill="#34d399" text-anchor="end">[92125A220]</text>
    <text x="150" y="186" font-family="Arial, sans-serif" font-size="9.5" fill="#a7f3d0" text-anchor="end">Fraisure 90° à fleur</text>

    <line x1="340" y1="114" x2="404" y2="128" stroke="#ef4444"/>
    <text x="410" y="132" font-family="Arial, sans-serif" font-size="11" font-weight="bold" fill="#fca5a5">CHC M5×70 [91290A272]</text>
    <text x="410" y="148" font-family="Arial, sans-serif" font-size="10" fill="#cbd5e1">Centré X = 7,5 mm (e=15 mm)</text>

    <line x1="258" y1="360" x2="386" y2="396" stroke="#facc15"/>
    <text x="392" y="400" font-family="Arial, sans-serif" font-size="10.5" font-weight="bold" fill="#fde68a">Nylstop M5 [90631A113] (5,5 N.m)</text>
    <text x="338" y="458" font-family="Arial, sans-serif" font-size="10.5" fill="#94a3b8" text-anchor="middle">Appui plan Insert / Tube garanti sans surépaisseur de vis FHC</text>
  </g>

  <!-- PANEL 3 : 4-STEP WORKSHOP PROTOCOL (MATCHING CAPTION!) -->
  <g transform="translate(30, 620)">
    <rect width="1380" height="330" rx="12" fill="url(#panelGrad)" stroke="#10b981" stroke-width="1.3" filter="url(#cardShadow)"/>
    <text x="20" y="30" font-family="Arial, sans-serif" font-size="13.5" font-weight="bold" fill="#34d399">3. PROTOCOLE CHRONOLOGIQUE D'ATELIER EN 4 ÉTAPES</text>

    <rect x="20" y="50" width="320" height="256" rx="8" fill="#0f172a" stroke="#38bdf8"/>
    <rect x="34" y="64" width="90" height="24" rx="4" fill="#1e3a8a"/>
    <text x="79" y="80" font-family="Arial, sans-serif" font-size="11" font-weight="bold" fill="#fff" text-anchor="middle">ÉTAPE 1</text>
    <text x="34" y="114" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#f8fafc">Pré-assemblage Insert</text>
    <text x="34" y="142" font-family="Arial, sans-serif" font-size="11" fill="#cbd5e1">• Assembler Insert 15° sur Semelle.</text>
    <text x="34" y="164" font-family="Arial, sans-serif" font-size="11" fill="#cbd5e1">• 4× Vis FHC M4×30 [92125A220]</text>
    <text x="44" y="182" font-family="Arial, sans-serif" font-size="11" fill="#cbd5e1">+ Nylstop M4 [93625A150].</text>
    <text x="34" y="210" font-family="Arial, sans-serif" font-size="11" fill="#cbd5e1">• Serrage 3,0 N.m (+ Loctite 243).</text>
    <text x="34" y="250" font-family="Arial, sans-serif" font-size="10.5" font-weight="bold" fill="#34d399">✓ Face arrière semelle lisse 0,0 mm</text>

    <rect x="360" y="50" width="320" height="256" rx="8" fill="#0f172a" stroke="#38bdf8"/>
    <rect x="374" y="64" width="90" height="24" rx="4" fill="#1e3a8a"/>
    <text x="419" y="80" font-family="Arial, sans-serif" font-size="11" font-weight="bold" fill="#fff" text-anchor="middle">ÉTAPE 2</text>
    <text x="374" y="114" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#f8fafc">Emboîtement Tubes &amp; Brides</text>
    <text x="374" y="142" font-family="Arial, sans-serif" font-size="11" fill="#cbd5e1">• Glisser Tube 60×60 (80,07/81,08).</text>
    <text x="374" y="164" font-family="Arial, sans-serif" font-size="11" fill="#cbd5e1">• Insérer bossage Bride v87 (202,3 g).</text>
    <text x="374" y="186" font-family="Arial, sans-serif" font-size="11" fill="#cbd5e1">• Brocher 4× CHC M5×70 [91290A272].</text>
    <text x="374" y="210" font-family="Arial, sans-serif" font-size="11" fill="#cbd5e1">• Serrer Nylstop M5 [93625A200] 5,5 N.m.</text>
    <text x="374" y="250" font-family="Arial, sans-serif" font-size="10.5" font-weight="bold" fill="#34d399">✓ Demi-traverses 100 % rigides</text>

    <rect x="700" y="50" width="320" height="256" rx="8" fill="#0f172a" stroke="#f59e0b"/>
    <rect x="714" y="64" width="90" height="24" rx="4" fill="#92400e"/>
    <text x="759" y="80" font-family="Arial, sans-serif" font-size="11" font-weight="bold" fill="#fff" text-anchor="middle">ÉTAPE 3</text>
    <text x="714" y="114" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#f8fafc">Fixation Stators RS-04</text>
    <text x="714" y="142" font-family="Arial, sans-serif" font-size="11" fill="#cbd5e1">• Centrer stator sur Ø 97,00 H7.</text>
    <text x="714" y="164" font-family="Arial, sans-serif" font-size="11" fill="#cbd5e1">• 10× M4 sur PCD Ø 106 mm +</text>
    <text x="724" y="182" font-family="Arial, sans-serif" font-size="11" fill="#cbd5e1">Nord-Lock M4 [91812A252].</text>
    <text x="714" y="210" font-family="Arial, sans-serif" font-size="11" fill="#cbd5e1">• Couple croisé 3,0 N.m (garde &gt;= 0,8).</text>
    <text x="714" y="250" font-family="Arial, sans-serif" font-size="10.5" font-weight="bold" fill="#fde68a">✓ Face avant RS-04 dégagée</text>

    <rect x="1040" y="50" width="320" height="256" rx="8" fill="#064e3b" fill-opacity="0.45" stroke="#10b981"/>
    <rect x="1054" y="64" width="90" height="24" rx="4" fill="#065f46"/>
    <text x="1099" y="80" font-family="Arial, sans-serif" font-size="11" font-weight="bold" fill="#fff" text-anchor="middle">ÉTAPE 4</text>
    <text x="1054" y="114" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#f8fafc">Sandwich Central Colonne</text>
    <text x="1054" y="142" font-family="Arial, sans-serif" font-size="11" fill="#e2e8f0">• Poser 4× Goupilles [91585A374].</text>
    <text x="1054" y="164" font-family="Arial, sans-serif" font-size="11" fill="#e2e8f0">• Prendre colonne en sandwich par</text>
    <text x="1064" y="182" font-family="Arial, sans-serif" font-size="11" fill="#e2e8f0">4× CHC M5×25 [90348A023].</text>
    <text x="1054" y="210" font-family="Arial, sans-serif" font-size="11" fill="#e2e8f0">• Serrer [90631A113] à 5,5 N.m.</text>
    <text x="1054" y="250" font-family="Arial, sans-serif" font-size="10.5" font-weight="bold" fill="#34d399">✓ Démontage 1 épaule en &lt; 60 s</text>
  </g>
</svg>