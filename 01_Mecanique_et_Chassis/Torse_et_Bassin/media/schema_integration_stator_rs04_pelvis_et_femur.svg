<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1360 780" width="1360" height="780">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090d16"/>
      <stop offset="55%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#0b1120"/>
    </linearGradient>
    <linearGradient id="panelGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" stop-opacity="0.96"/>
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0.96"/>
    </linearGradient>
    <linearGradient id="aluOrange" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#c2410c"/>
      <stop offset="50%" stop-color="#ea580c"/>
      <stop offset="100%" stop-color="#f97316"/>
    </linearGradient>
    <linearGradient id="aluAmber" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#b45309"/>
      <stop offset="50%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#d97706"/>
    </linearGradient>
    <linearGradient id="aluBlue" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#1e3a8a"/>
      <stop offset="50%" stop-color="#2563eb"/>
      <stop offset="100%" stop-color="#1d4ed8"/>
    </linearGradient>
    <linearGradient id="steelGreen" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#15803d"/>
      <stop offset="50%" stop-color="#22c55e"/>
      <stop offset="100%" stop-color="#16a34a"/>
    </linearGradient>
    <linearGradient id="paViolet" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#5b21b6"/>
      <stop offset="50%" stop-color="#7c3aed"/>
      <stop offset="100%" stop-color="#6d28d9"/>
    </linearGradient>
    <linearGradient id="motorSlate" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#334155"/>
      <stop offset="50%" stop-color="#475569"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
    <pattern id="gridPat" width="30" height="30" patternUnits="userSpaceOnUse">
      <path d="M 30 0 L 0 0 0 30" fill="none" stroke="#334155" stroke-width="0.55" stroke-opacity="0.28"/>
    </pattern>
    <pattern id="hatchWaste" width="10" height="10" patternTransform="rotate(45 0 0)" patternUnits="userSpaceOnUse">
      <line x1="0" y1="0" x2="0" y2="10" stroke="#ef4444" stroke-width="1.6" stroke-opacity="0.55"/>
    </pattern>
    <marker id="arrCyan" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <polygon points="0 1, 8 4, 0 7" fill="#38bdf8"/>
    </marker>
    <marker id="arrRed" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <polygon points="0 1, 8 4, 0 7" fill="#ef4444"/>
    </marker>
    <marker id="arrAmber" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <polygon points="0 1, 8 4, 0 7" fill="#f59e0b"/>
    </marker>
    <marker id="arrGreen" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <polygon points="0 1, 8 4, 0 7" fill="#10b981"/>
    </marker>
    <filter id="cardShadow" x="-8%" y="-8%" width="116%" height="116%">
      <feDropShadow dx="0" dy="5" stdDeviation="6" flood-color="#000000" flood-opacity="0.55"/>
    </filter>
  </defs>
  <rect width="1360" height="780" fill="url(#bgGrad)"/>
  <rect width="1360" height="780" fill="url(#gridPat)"/>
  <g transform="translate(30, 22)">
    <rect width="1300" height="74" rx="12" fill="#1e293b" stroke="#3b82f6" stroke-width="1.5" filter="url(#cardShadow)"/>
    <circle cx="42" cy="37" r="20" fill="#f59e0b" fill-opacity="0.18" stroke="#f59e0b" stroke-width="2"/>
    <text x="42" y="44" font-family="Arial, sans-serif" font-size="19" font-weight="bold" fill="#f59e0b" text-anchor="middle">+</text>
    <text x="76" y="31" font-family="Arial, sans-serif" font-size="18" font-weight="bold" fill="#f8fafc">INTÉGRATION STATOR ROBSTRIDE RS-04 — FIXATION ARRIÈRE &amp; DISSIPATION THERMIQUE</text>
    <text x="76" y="54" font-family="Arial, sans-serif" font-size="12" fill="#94a3b8">Bride Epaule v87 (202,30 g | Ø 97 H7) : Fixation monoface 10× M4 (PCD Ø 106 mm) + garde fond &lt;= 6,0 mm + Heat Sink &gt; 1,5 kg</text>
    <rect x="1036" y="19" width="240" height="36" rx="8" fill="#0f172a" stroke="#f59e0b" stroke-width="1.3"/>
    <text x="1156" y="42" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#f59e0b" text-anchor="middle">DOC-ENG-RS04-ST</text>
  </g>

  <!-- PANEL 1 : AXIAL SECTION -->
  <g transform="translate(30, 114)">
    <rect width="465" height="636" rx="12" fill="url(#panelGrad)" stroke="#38bdf8" stroke-width="1.3" filter="url(#cardShadow)"/>
    <text x="18" y="30" font-family="Arial, sans-serif" font-size="12.5" font-weight="bold" fill="#38bdf8">1. COUPE AXIALE X-Z DE LA LIAISON STATOR</text>

    <!-- Flasque Bride 7075 (Zone 1 5mm / Zone 2 18,2mm) -->
    <rect x="110" y="92" width="30" height="236" rx="3" fill="url(#aluBlue)" stroke="#38bdf8" stroke-width="1.8"/>
    <rect x="82" y="138" width="28" height="144" rx="2" fill="url(#aluAmber)" stroke="#fde68a" stroke-width="1.5"/>

    <!-- Stator RS-04 (Ø 120, L=39.0) + Rear boss -->
    <rect x="142" y="92" width="136" height="236" rx="5" fill="url(#aluOrange)" stroke="#fb923c" stroke-width="2"/>
    <rect x="128" y="132" width="14" height="156" rx="2" fill="#f59e0b" fill-opacity="0.45" stroke="#fde68a"/>
    <rect x="278" y="114" width="26" height="192" rx="3" fill="url(#aluBlue)" stroke="#93c5fd" stroke-width="1.6"/>
    <!-- Thermal paste film -->
    <line x1="141" y1="96" x2="141" y2="324" stroke="#34d399" stroke-width="2.5"/>

    <!-- Stator blind hole + M4 bolt -->
    <rect x="142" y="106" width="34" height="10" fill="#090e1a" stroke="#ef4444" stroke-width="1.2"/>
    <line x1="94" y1="111" x2="170" y2="111" stroke="#38bdf8" stroke-width="2.6"/>

    <!-- Labels placed cleanly around, ZERO clipping -->
    <text x="210" y="200" font-family="Arial, sans-serif" font-size="12.5" font-weight="bold" fill="#fff" text-anchor="middle">STATOR RS-04</text>
    <text x="210" y="220" font-family="Arial, sans-serif" font-size="10.5" fill="#fef3c7" text-anchor="middle">Ø 120 mm × L = 39,0 mm</text>
    <text x="210" y="236" font-family="Arial, sans-serif" font-size="10" fill="#fde68a" text-anchor="middle">Bobinages &amp; Roulement</text>

    <text x="291" y="210" font-family="Arial, sans-serif" font-size="9.5" font-weight="bold" fill="#fff" text-anchor="middle" transform="rotate(-90 291 210)">ROTOR DE SORTIE</text>

    <!-- Top callouts y=58..82 -->
    <line x1="125" y1="92" x2="125" y2="66" stroke="#93c5fd"/>
    <text x="125" y="60" font-family="Arial, sans-serif" font-size="10.5" font-weight="bold" fill="#93c5fd" text-anchor="middle">Bride v87 (5 mm / 18,2 mm)</text>
    <line x1="141" y1="92" x2="215" y2="68" stroke="#34d399"/>
    <text x="220" y="70" font-family="Arial, sans-serif" font-size="10.5" font-weight="bold" fill="#34d399">Pâte Thermique (-40 % R_th)</text>

    <!-- Bottom & right callouts -->
    <line x1="170" y1="111" x2="314" y2="111" stroke="#fde68a" stroke-dasharray="3,2"/>
    <text x="316" y="106" font-family="Arial, sans-serif" font-size="9.5" font-weight="bold" fill="#fde68a">Trou borgne 6,0 MAX</text>
    <text x="316" y="122" font-family="Arial, sans-serif" font-size="9.5" fill="#a7f3d0">Prise 5,0–5,2 (garde &gt;= 0,8)</text>

    <line x1="132" y1="286" x2="72" y2="338" stroke="#facc15"/>
    <text x="36" y="352" font-family="Arial, sans-serif" font-size="10.5" font-weight="bold" fill="#facc15">Alésage Ø 97 H7 / Ø 95</text>

    <!-- Off-axis Cable corridor (bottom) -->
    <path d="M 102 250 L 66 250 L 66 312 L 26 312" fill="none" stroke="#34d399" stroke-width="2.5" stroke-dasharray="4,2"/>
    <rect x="12" y="196" width="66" height="44" rx="5" fill="#0f172a" stroke="#34d399" stroke-width="1"/>
    <text x="45" y="211" font-family="Arial, sans-serif" font-size="9.5" font-weight="bold" fill="#34d399" text-anchor="middle">Corridor</text>
    <text x="45" y="223" font-family="Arial, sans-serif" font-size="9.5" font-weight="bold" fill="#34d399" text-anchor="middle">Déporté</text>
    <text x="45" y="235" font-family="Arial, sans-serif" font-size="8.2" fill="#cbd5e1" text-anchor="middle">Zéro creux</text>

    <!-- Bottom Rule Box y=382..618 -->
    <rect x="18" y="382" width="429" height="236" rx="8" fill="#0f172a" stroke="#ef4444" stroke-width="1.2"/>
    <text x="32" y="408" font-family="Arial, sans-serif" font-size="11.5" font-weight="bold" fill="#fca5a5">RÈGLE CONSTRUCTEUR : ZÉRO TALONNAGE BORGNE</text>
    <text x="32" y="436" font-family="Arial, sans-serif" font-size="10.5" fill="#cbd5e1">• Taraudages arrière stator : profondeur utile 6,0 mm MAX.</text>
    <text x="32" y="464" font-family="Arial, sans-serif" font-size="10.5" fill="#e2e8f0">• Zone 2 (hub 18,2 mm + Nord-Lock 1,8 mm) :</text>
    <text x="44" y="482" font-family="Arial, sans-serif" font-size="10.5" fill="#34d399">TB M4×25 [92855A422] -&gt; engagement 5,0 mm (garde 1,0 mm).</text>
    <text x="32" y="510" font-family="Arial, sans-serif" font-size="10.5" fill="#e2e8f0">• Zone 1 (oreille 5,0 mm + Nord-Lock 1,8 mm) :</text>
    <text x="44" y="528" font-family="Arial, sans-serif" font-size="10.5" fill="#fde68a">Atelier : CHC M4×12 [91290A154] -&gt; 5,2 mm (garde 0,8 mm).</text>
    <text x="32" y="558" font-family="Arial, sans-serif" font-size="10.5" font-weight="bold" fill="#ef4444">⚠ VIGILANCE : [90128A214] (M4×16 CAO) exige entretoise</text>
    <text x="44" y="576" font-family="Arial, sans-serif" font-size="10.5" fill="#fca5a5">4 mm en Zone 1 pour éviter le talonnage à 9,2 mm !</text>
  </g>

  <!-- PANEL 2 : REAR VIEW STATOR -->
  <g transform="translate(515, 114)">
    <rect width="465" height="636" rx="12" fill="url(#panelGrad)" stroke="#f59e0b" stroke-width="1.3" filter="url(#cardShadow)"/>
    <text x="18" y="30" font-family="Arial, sans-serif" font-size="12.5" font-weight="bold" fill="#f59e0b">2. VUE ARRIÈRE STATOR : PCD Ø 106,0 mm (10× M4)</text>

    <!-- Concentric Stator at cx=232, cy=224 -->
    <circle cx="232" cy="224" r="112" fill="url(#aluAmber)" stroke="#fde68a" stroke-width="2.2"/>
    <circle cx="232" cy="224" r="96" fill="none" stroke="#fff" stroke-width="1.4" stroke-dasharray="5,4"/>
    <circle cx="232" cy="224" r="76" fill="url(#aluOrange)" stroke="#fff" stroke-width="1.4"/>
    <circle cx="232" cy="224" r="56" fill="#0f172a" stroke="#64748b" stroke-width="1.5"/>

    <!-- 10 bolts on r=96 every 36 deg -->
    <circle cx="328.0" cy="224.0" r="5.5" fill="#090e1a" stroke="#fff" stroke-width="1.4"/><circle cx="309.7" cy="280.4" r="5.5" fill="#090e1a" stroke="#fff" stroke-width="1.4"/><circle cx="261.7" cy="315.3" r="5.5" fill="#090e1a" stroke="#fff" stroke-width="1.4"/><circle cx="202.3" cy="315.3" r="5.5" fill="#090e1a" stroke="#fff" stroke-width="1.4"/><circle cx="154.3" cy="280.4" r="5.5" fill="#090e1a" stroke="#fff" stroke-width="1.4"/><circle cx="136.0" cy="224.0" r="5.5" fill="#090e1a" stroke="#fff" stroke-width="1.4"/><circle cx="154.3" cy="167.6" r="5.5" fill="#090e1a" stroke="#fff" stroke-width="1.4"/><circle cx="202.3" cy="132.7" r="5.5" fill="#090e1a" stroke="#fff" stroke-width="1.4"/><circle cx="261.7" cy="132.7" r="5.5" fill="#090e1a" stroke="#fff" stroke-width="1.4"/><circle cx="309.7" cy="167.6" r="5.5" fill="#090e1a" stroke="#fff" stroke-width="1.4"/>

    <!-- CAN-FD & 48V connectors -->
    <rect x="206" y="196" width="52" height="18" rx="3" fill="#2563eb" stroke="#93c5fd"/>
    <text x="232" y="209" font-family="Arial, sans-serif" font-size="9.5" font-weight="bold" fill="#fff" text-anchor="middle">CAN-FD</text>
    <rect x="202" y="232" width="60" height="20" rx="3" fill="#dc2626" stroke="#fca5a5"/>
    <text x="232" y="246" font-family="Arial, sans-serif" font-size="9.5" font-weight="bold" fill="#fff" text-anchor="middle">48V PWR</text>

    <!-- Silicone Cable Outlet outside ring -->
    <rect x="214" y="330" width="36" height="14" rx="2" fill="#facc15" stroke="#fff"/>
    <path d="M 232 344 L 232 362" stroke="#facc15" stroke-width="3"/>

    <!-- Clean EXTERNAL annotations -->
    <line x1="232" y1="112" x2="232" y2="74" stroke="#f8fafc"/>
    <text x="232" y="66" font-family="Arial, sans-serif" font-size="11" font-weight="bold" fill="#f8fafc" text-anchor="middle">Stator Extérieur Ø 120,0 mm</text>
    <line x1="310" y1="168" x2="352" y2="116" stroke="#fde68a"/>
    <text x="356" y="114" font-family="Arial, sans-serif" font-size="10.5" font-weight="bold" fill="#fde68a">PCD Ø 106,0 mm</text>
    <text x="356" y="128" font-family="Arial, sans-serif" font-size="10" fill="#cbd5e1">(10× M4 à 36°)</text>
    <line x1="164" y1="186" x2="116" y2="122" stroke="#fdba74"/>
    <text x="112" y="114" font-family="Arial, sans-serif" font-size="10" font-weight="bold" fill="#fdba74" text-anchor="end">Bossage</text>
    <text x="112" y="128" font-family="Arial, sans-serif" font-size="10" font-weight="bold" fill="#fdba74" text-anchor="end">Ø 94/95 mm</text>
    <text x="232" y="376" font-family="Arial, sans-serif" font-size="10.5" font-weight="bold" fill="#facc15" text-anchor="middle">SORTIE SILICONE DÉPORTÉE (Corridor latéral)</text>

    <rect x="18" y="394" width="429" height="224" rx="8" fill="#0f172a" stroke="#334155"/>
    <text x="32" y="420" font-family="Arial, sans-serif" font-size="11.5" font-weight="bold" fill="#fde68a">SPÉCIFICATIONS D'USINAGE BRIDE RÉCEPTRICE v87 :</text>
    <text x="32" y="448" font-family="Arial, sans-serif" font-size="10.5" fill="#cbd5e1">• Alésage pilote de centrage : Ø 97,00 mm H7 (reprise tranchant).</text>
    <text x="32" y="474" font-family="Arial, sans-serif" font-size="10.5" fill="#cbd5e1">• 10 perçages lisses Ø 4,30 mm débouchants sur PCD Ø 106,0 mm.</text>
    <text x="32" y="500" font-family="Arial, sans-serif" font-size="10.5" fill="#cbd5e1">• Chanfreins 0,5 mm × 45° sous rondelles Nord-Lock M4 [91812A252].</text>
    <text x="32" y="526" font-family="Arial, sans-serif" font-size="10.5" fill="#cbd5e1">• Lumières en croissant latérales : échappement thermique stator.</text>
    <text x="32" y="552" font-family="Arial, sans-serif" font-size="10.5" font-weight="bold" fill="#34d399">• Zéro arbre creux : faisceau déporté sans pliure ni cisaillement.</text>
  </g>

  <!-- PANEL 3 : RDM & THERMAL -->
  <g transform="translate(1000, 114)">
    <rect width="330" height="636" rx="12" fill="url(#panelGrad)" stroke="#10b981" stroke-width="1.3" filter="url(#cardShadow)"/>
    <text x="18" y="30" font-family="Arial, sans-serif" font-size="12.5" font-weight="bold" fill="#10b981">3. RDM &amp; DISSIPATION</text>

    <rect x="18" y="52" width="294" height="134" rx="8" fill="#0f172a" stroke="#10b981"/>
    <text x="30" y="76" font-family="Arial, sans-serif" font-size="11.5" font-weight="bold" fill="#34d399">TENUE TORSION (10× M4)</text>
    <text x="30" y="102" font-family="Arial, sans-serif" font-size="11" fill="#cbd5e1">• Précharge axiale totale : ~41 kN</text>
    <text x="30" y="124" font-family="Arial, sans-serif" font-size="11" fill="#cbd5e1">• Couple friction : ~326 N.m &gt;&gt; 120 N.m</text>
    <text x="30" y="148" font-family="Arial, sans-serif" font-size="11.5" font-weight="bold" fill="#a7f3d0">• Marge glissement : Sf ~ 2,7</text>
    <text x="30" y="168" font-family="Arial, sans-serif" font-size="10.5" fill="#94a3b8">(Serrage croisé 3,0 N.m + Nord-Lock)</text>

    <rect x="18" y="200" width="294" height="120" rx="8" fill="#0f172a" stroke="#38bdf8"/>
    <text x="30" y="224" font-family="Arial, sans-serif" font-size="11.5" font-weight="bold" fill="#38bdf8">REPRISE EFFORT TRANCHANT</text>
    <text x="30" y="250" font-family="Arial, sans-serif" font-size="11" fill="#cbd5e1">• Choc vertical (35 kg × 2,5g) ~ 860 N</text>
    <text x="30" y="272" font-family="Arial, sans-serif" font-size="11" fill="#cbd5e1">• Repris par alésage pilote / épaulement</text>
    <text x="30" y="294" font-family="Arial, sans-serif" font-size="11.5" font-weight="bold" fill="#93c5fd">• Cisaillement vis M4 = 0 N</text>

    <rect x="18" y="334" width="294" height="148" rx="8" fill="#0f172a" stroke="#f59e0b"/>
    <text x="30" y="358" font-family="Arial, sans-serif" font-size="11.5" font-weight="bold" fill="#fde68a">BILAN THERMIQUE PELVIS</text>
    <text x="30" y="384" font-family="Arial, sans-serif" font-size="10.5" fill="#cbd5e1">Manuel RS-04 : plaque 345×345 mm</text>
    <text x="30" y="404" font-family="Arial, sans-serif" font-size="10.5" fill="#cbd5e1">requise pour 40 N.m continu.</text>
    <text x="30" y="428" font-family="Arial, sans-serif" font-size="11" font-weight="bold" fill="#a7f3d0">Squelette Pelvis Alu &gt; 1,5 kg</text>
    <text x="30" y="448" font-family="Arial, sans-serif" font-size="10.5" fill="#cbd5e1">2× Bride + Selle + Traverse + Tube 60×60</text>
    <text x="30" y="468" font-family="Arial, sans-serif" font-size="10.5" fill="#34d399">+ Film Pâte Noctua NT-H1</text>

    <rect x="18" y="496" width="294" height="122" rx="8" fill="#064e3b" stroke="#10b981"/>
    <text x="30" y="520" font-family="Arial, sans-serif" font-size="11.5" font-weight="bold" fill="#34d399">VERDICT MONOFACE VALIDÉ</text>
    <text x="30" y="544" font-family="Arial, sans-serif" font-size="10.5" fill="#e2e8f0">✓ Zéro cage H-bracket (-700 g bassin)</text>
    <text x="30" y="566" font-family="Arial, sans-serif" font-size="10.5" fill="#e2e8f0">✓ Ventilation frontale 100 % libre</text>
    <text x="30" y="588" font-family="Arial, sans-serif" font-size="10.5" fill="#e2e8f0">✓ 4× Brides v87 identiques (202,30 g/u)</text>
  </g>
</svg>