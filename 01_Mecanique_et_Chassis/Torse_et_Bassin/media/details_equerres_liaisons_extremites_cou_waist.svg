<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 940" width="100%" height="100%">
  <defs>
    <pattern id="gridBp" width="20" height="20" patternUnits="userSpaceOnUse">
      <path d="M 20 0 L 0 0 0 20" fill="none" stroke="#1e293b" stroke-width="0.7"/>
    </pattern>
    <linearGradient id="aluGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#eab308"/>
      <stop offset="100%" stop-color="#a16207"/>
    </linearGradient>
    <linearGradient id="aluPlate" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#0284c7" stop-opacity="0.25"/>
    </linearGradient>
    <filter id="shd" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="4" stdDeviation="5" flood-color="#000" flood-opacity="0.5"/>
    </filter>
    <marker id="arB" markerWidth="7" markerHeight="7" refX="3.5" refY="3.5" orient="auto">
      <path d="M1,1 L6,3.5 L1,6 Z" fill="#38bdf8"/>
    </marker>
    <marker id="arBrev" markerWidth="7" markerHeight="7" refX="3.5" refY="3.5" orient="auto-start-reverse">
      <path d="M1,1 L6,3.5 L1,6 Z" fill="#38bdf8"/>
    </marker>
    <marker id="arY" markerWidth="7" markerHeight="7" refX="3.5" refY="3.5" orient="auto">
      <path d="M1,1 L6,3.5 L1,6 Z" fill="#facc15"/>
    </marker>
    <marker id="arYrev" markerWidth="7" markerHeight="7" refX="3.5" refY="3.5" orient="auto-start-reverse">
      <path d="M1,1 L6,3.5 L1,6 Z" fill="#facc15"/>
    </marker>
  </defs>

  <rect width="1440" height="940" fill="#0f172a"/>
  <rect width="1440" height="940" fill="url(#gridBp)"/>

  <!-- Header -->
  <g transform="translate(24, 18)">
    <rect width="1392" height="66" rx="8" fill="#1e293b" stroke="#38bdf8" stroke-width="1.5" filter="url(#shd)"/>
    <text x="24" y="30" font-family="system-ui, sans-serif" font-size="18.5" font-weight="bold" fill="#f8fafc">
      BLUEPRINT CAO v42 : ÉQUERRES DE LIAISON (COU &amp; WAIST) ET PLAQUE CIRCULAIRE DE COU Ø 100 mm
    </text>
    <text x="24" y="51" font-family="system-ui, sans-serif" font-size="12" fill="#94a3b8">
      Fidèle aux Snapshots Fusion 360 (Torse-123 v42) · Cou : Paire opposée 46,57 g (Rectangle 30×50 mm) · Plaque Ø 100,02×4,70 mm (89,63 g) + EL05 / RS-05 · Waist 9,02 mm
    </text>
    <rect x="1210" y="17" width="160" height="32" rx="6" fill="#0284c7" fill-opacity="0.2" stroke="#38bdf8"/>
    <text x="1290" y="37" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11.5" font-weight="bold" fill="#38bdf8">TORSE-123 v42</text>
  </g>

  <!-- PANEL 1 : ÉQUERRES COU (PAIRE OPPOSÉE 50×65×30 mm = 46,57 g) -->
  <g transform="translate(24, 100)">
    <rect width="448" height="816" rx="10" fill="#1e293b" stroke="#38bdf8" stroke-width="1.5" filter="url(#shd)"/>
    <rect width="448" height="38" rx="10" fill="#0284c7" fill-opacity="0.22"/>
    <text x="224" y="24" text-anchor="middle" font-family="system-ui, sans-serif" font-size="13" font-weight="bold" fill="#38bdf8">
      1. ÉQUERRES COU — PAIRE OPPOSÉE (46,57 g)
    </text>

    <!-- Vue de dessus (2 L-wings opposées enserrant la colonne 5 mm) -->
    <text x="22" y="64" font-family="system-ui, sans-serif" font-size="11" font-weight="bold" fill="#f8fafc">
      VUE DE DESSUS (X-Y) — EMPATTEMENT 50,0 × 65,0 mm
    </text>
    <g transform="translate(224, 182)">
      <!-- Colonne centrale 5 mm (1 mm = 3.2 px -> L=50mm=160px, e=5mm=16px, aile=30mm=96px) -->
      <rect x="-85" y="-8" width="170" height="16" fill="#334155" stroke="#94a3b8" stroke-dasharray="4,3"/>
      <text x="0" y="3" text-anchor="middle" font-family="system-ui, sans-serif" font-size="8.5" font-weight="bold" fill="#cbd5e1">COLONNE 5,0 mm</text>

      <!-- Équerre Arrière / Haut Y+ (-80..+80, -104..-8) -->
      <path d="M -80,-8 L -80,-92 Q -80,-104 -68,-104 L 68,-104 Q 80,-104 80,-92 L 80,-8 Z" fill="url(#aluGold)" fill-opacity="0.88" stroke="#fef08a" stroke-width="1.5"/>
      <!-- Équerre Avant / Bas Y- (-80..+80, +8..+104) -->
      <path d="M -80,8 L -80,92 Q -80,104 -68,104 L 68,104 Q 80,104 80,92 L 80,8 Z" fill="url(#aluGold)" fill-opacity="0.88" stroke="#fef08a" stroke-width="1.5"/>

      <!-- 4 perçages Ø 4.3 mm en rectangle 30 x 50 mm (X=±15mm=±48px, Y=±25mm=±80px) -->
      <circle cx="-48" cy="-80" r="7" fill="#0f172a" stroke="#ffffff" stroke-width="1.8"/>
      <circle cx="48" cy="-80" r="7" fill="#0f172a" stroke="#ffffff" stroke-width="1.8"/>
      <circle cx="-48" cy="80" r="7" fill="#0f172a" stroke="#ffffff" stroke-width="1.8"/>
      <circle cx="48" cy="80" r="7" fill="#0f172a" stroke="#ffffff" stroke-width="1.8"/>

      <!-- Cotations 30,0 mm x 50,0 mm -->
      <line x1="-48" y1="122" x2="48" y2="122" stroke="#38bdf8" stroke-width="1.3" marker-start="url(#arBrev)" marker-end="url(#arB)"/>
      <text x="0" y="138" text-anchor="middle" font-family="system-ui, sans-serif" font-size="10.5" font-weight="bold" fill="#38bdf8">Entraxe X = 30,0 mm</text>
      <line x1="-115" y1="-80" x2="-115" y2="80" stroke="#facc15" stroke-width="1.3" marker-start="url(#arYrev)" marker-end="url(#arY)"/>
      <text x="-125" y="4" text-anchor="end" font-family="system-ui, sans-serif" font-size="10.5" font-weight="bold" fill="#facc15">DY = 50,0 mm</text>
      <text x="105" y="-50" font-family="system-ui, sans-serif" font-size="9.5" font-weight="bold" fill="#fde047">L = 50,0 mm</text>
      <text x="105" y="-36" font-family="system-ui, sans-serif" font-size="9" fill="#cbd5e1">Hors-tout Y = 65,0 mm</text>
      <text x="105" y="-22" font-family="system-ui, sans-serif" font-size="9" fill="#4ade80">4× CHC M4×16</text>
      <text x="105" y="-10" font-family="system-ui, sans-serif" font-size="8.5" fill="#86efac">(Réf. 92290A154)</text>
    </g>

    <!-- Vue de face aile verticale (pincement colonne par 2 vis M4) -->
    <text x="22" y="346" font-family="system-ui, sans-serif" font-size="11" font-weight="bold" fill="#f8fafc">
      AILE VERTICALE (30 mm) — 2× TROUS RONDS Ø 4,3 mm
    </text>
    <g transform="translate(74, 366)">
      <rect width="160" height="96" rx="4" fill="url(#aluGold)" fill-opacity="0.88" stroke="#fef08a" stroke-width="1.5"/>
      <rect width="160" height="12" fill="#ca8a04" stroke="#fef08a" stroke-width="1"/>
      <circle cx="32" cy="52" r="7.5" fill="#0f172a" stroke="#ffffff" stroke-width="1.8"/>
      <circle cx="128" cy="52" r="7.5" fill="#0f172a" stroke="#ffffff" stroke-width="1.8"/>
      <line x1="32" y1="112" x2="128" y2="112" stroke="#38bdf8" stroke-width="1.3" marker-start="url(#arBrev)" marker-end="url(#arB)"/>
      <text x="80" y="128" text-anchor="middle" font-family="system-ui, sans-serif" font-size="10" font-weight="bold" fill="#38bdf8">Entraxe X = 30,0 mm (Butée Z)</text>
      <text x="180" y="36" font-family="system-ui, sans-serif" font-size="9.5" font-weight="bold" fill="#f8fafc">ZÉRO oblong</text>
      <text x="180" y="54" font-family="system-ui, sans-serif" font-size="9" fill="#cbd5e1">• 2× CHC M4×20 [92290A168]</text>
      <text x="180" y="70" font-family="system-ui, sans-serif" font-size="9" fill="#cbd5e1">• 4× DIN 125A [93475A230]</text>
      <text x="180" y="86" font-family="system-ui, sans-serif" font-size="9" fill="#4ade80">• 2× Nylstop [93625A150]</text>
    </g>

    <!-- Spécifications & Quincaillerie -->
    <rect x="20" y="505" width="408" height="292" rx="8" fill="#0f172a" stroke="#334155"/>
    <text x="36" y="530" font-family="system-ui, sans-serif" font-size="11.5" font-weight="bold" fill="#38bdf8">
      SPÉCIFICATIONS CAO v42 — LIAISON COU (RS-05 / EL05)
    </text>
    <text x="36" y="555" font-family="system-ui, sans-serif" font-size="10" fill="#cbd5e1">
      <tspan x="36" dy="0">• Composant CAO : <tspan font-weight="bold" fill="#ffffff">Equerre cou</tspan> (2 ailes opposées)</tspan>
      <tspan x="36" dy="20">• Bbox paire v42 : <tspan font-weight="bold" fill="#facc15">50,04 × 65,03 × 30,04 mm</tspan></tspan>
      <tspan x="36" dy="20">• Masse réelle v42 : <tspan font-weight="bold" fill="#4ade80">46,57 g la paire</tspan> (23,28 g × 2)</tspan>
      <tspan x="36" dy="20">• Plaque de Cou : <tspan font-weight="bold" fill="#ffffff">4× CHC M4×16 [92290A154]</tspan></tspan>
      <tspan x="44" dy="18">+ 4× Nylstop M4 [93625A150] (Rectangle 30 × 50 mm)</tspan>
      <tspan x="36" dy="20">• Pincement colonne : <tspan font-weight="bold" fill="#ffffff">2× CHC M4×20 [92290A168]</tspan></tspan>
      <tspan x="44" dy="18">+ rondelles DIN 125A M4 + Nylstop (Couple 3,0 N.m)</tspan>
      <tspan x="36" dy="20">• Couloir libre entre axes : 50 mm (zéro conflit RS-05).</tspan>
      <tspan x="36" dy="20">• Chanfreins d'ébavurage : 0,3 mm × 45° sur 2 faces.</tspan>
      <tspan x="36" dy="22" font-weight="bold" fill="#34d399">✔ Arbre RS-05 plein : faisceau déporté dans la lumière.</tspan>
    </text>
  </g>

  <!-- PANEL 2 : ÉQUERRES WAIST (2× 90×30×30 mm = 84,22 g) -->
  <g transform="translate(496, 100)">
    <rect width="448" height="816" rx="10" fill="#1e293b" stroke="#4ade80" stroke-width="1.5" filter="url(#shd)"/>
    <rect width="448" height="38" rx="10" fill="#16a34a" fill-opacity="0.22"/>
    <text x="224" y="24" text-anchor="middle" font-family="system-ui, sans-serif" font-size="13" font-weight="bold" fill="#4ade80">
      2. ÉQUERRES WAIST — 2× 90 mm (42,11 g / u)
    </text>

    <!-- Vue aile horizontale -->
    <text x="22" y="64" font-family="system-ui, sans-serif" font-size="11" font-weight="bold" fill="#f8fafc">
      AILE HORIZONTALE (30 mm) — 2× Ø 4,50 mm MOYEU
    </text>
    <g transform="translate(44, 86)">
      <!-- Contour 90 x 30 mm (1 mm = 3.8 px -> 342 x 114 px) -->
      <rect width="342" height="106" rx="16" fill="url(#aluGold)" fill-opacity="0.88" stroke="#fef08a" stroke-width="1.5"/>
      <rect width="342" height="14" fill="#ca8a04" stroke="#fef08a" stroke-width="1"/>
      <!-- 2 trous alignés PCD Moyeu Waist (Entraxe 48,08 mm, Déport 17,86 mm) -->
      <circle cx="80" cy="64" r="8" fill="#0f172a" stroke="#ffffff" stroke-width="2"/>
      <circle cx="262" cy="64" r="8" fill="#0f172a" stroke="#ffffff" stroke-width="2"/>
      <line x1="80" y1="124" x2="262" y2="124" stroke="#38bdf8" stroke-width="1.3" marker-start="url(#arBrev)" marker-end="url(#arB)"/>
      <text x="171" y="140" text-anchor="middle" font-family="system-ui, sans-serif" font-size="10.5" font-weight="bold" fill="#38bdf8">Entraxe 48,08 mm (Carré Moyeu)</text>
      <text x="171" y="92" text-anchor="middle" font-family="system-ui, sans-serif" font-size="9" font-weight="bold" fill="#0f172a">Déport Y = 17,86 mm · Rayon bouts R = 5 mm</text>
    </g>

    <!-- Vue aile verticale (4 trous M4 colonne) -->
    <text x="22" y="274" font-family="system-ui, sans-serif" font-size="11" font-weight="bold" fill="#f8fafc">
      AILE VERTICALE (30 mm) — 4× Ø 4,3 mm COLONNE
    </text>
    <g transform="translate(44, 294)">
      <rect width="342" height="96" rx="10" fill="url(#aluGold)" fill-opacity="0.88" stroke="#fef08a" stroke-width="1.5"/>
      <rect width="342" height="12" fill="#ca8a04" stroke="#fef08a" stroke-width="1"/>
      <!-- 4 trous pas 18 mm -> x = 68, 136, 206, 274 -->
      <circle cx="68" cy="56" r="7.5" fill="#0f172a" stroke="#ffffff" stroke-width="1.8"/>
      <circle cx="136" cy="56" r="7.5" fill="#0f172a" stroke="#ffffff" stroke-width="1.8"/>
      <circle cx="206" cy="56" r="7.5" fill="#0f172a" stroke="#ffffff" stroke-width="1.8"/>
      <circle cx="274" cy="56" r="7.5" fill="#0f172a" stroke="#ffffff" stroke-width="1.8"/>
      <line x1="68" y1="112" x2="274" y2="112" stroke="#facc15" stroke-width="1.3" marker-start="url(#arYrev)" marker-end="url(#arY)"/>
      <text x="171" y="128" text-anchor="middle" font-family="system-ui, sans-serif" font-size="10" font-weight="bold" fill="#facc15">3 × Pas 18,0 mm = 54,0 mm</text>
      <text x="171" y="144" text-anchor="middle" font-family="system-ui, sans-serif" font-size="9" fill="#4ade80">L = 90,02 mm · 4× CHC M4×20 traversantes</text>
    </g>

    <!-- Spécifications Waist -->
    <rect x="20" y="465" width="408" height="332" rx="8" fill="#0f172a" stroke="#334155"/>
    <text x="36" y="490" font-family="system-ui, sans-serif" font-size="11.5" font-weight="bold" fill="#4ade80">
      SYNTHÈSE LIAISON BASSE WAIST (TORSE-123 v42)
    </text>
    <text x="36" y="514" font-family="system-ui, sans-serif" font-size="10" fill="#cbd5e1">
      <tspan x="36" dy="0">• Composants : <tspan font-weight="bold" fill="#ffffff">Equerre waist</tspan> + <tspan font-weight="bold" fill="#ffffff">Symétrie miroir</tspan></tspan>
      <tspan x="36" dy="20">• Bbox unitaire v42 : <tspan font-weight="bold" fill="#facc15">90,02 × 30,02 × 30,02 mm</tspan></tspan>
      <tspan x="36" dy="20">• Masse réelle v42 : <tspan font-weight="bold" fill="#4ade80">42,11 g / pièce (84,22 g paire)</tspan></tspan>
      <tspan x="36" dy="22" font-weight="bold" fill="#38bdf8">Empilement Sandwich Moyeu / Waist Plate :</tspan>
      <tspan x="36" dy="19">• Traversée : Équerre (3 mm) + <tspan fill="#ffffff" font-weight="bold">Waist_Plate (9,02 mm)</tspan></tspan>
      <tspan x="44" dy="18">➔ Taraudage M4 dans <tspan font-weight="bold" fill="#ffffff">Moyeu_Waist_Sandwich_7075</tspan>.</tspan>
      <tspan x="36" dy="20">• Visserie : <tspan font-weight="bold" fill="#ffffff">4× CHC M4×25 [91292A122]</tspan> + Nord-Lock.</tspan>
      <tspan x="36" dy="22" font-weight="bold" fill="#38bdf8">Pincement Bas de Colonne (Équerre G + Col + Équerre D) :</tspan>
      <tspan x="36" dy="19">• 4× CHC M4×20 [92290A168] + 8× DIN 125A + Nylstop M4.</tspan>
      <tspan x="36" dy="20">• Couple de serrage : 2,8 à 3,0 N.m (Loctite 243).</tspan>
      <tspan x="36" dy="22" font-weight="bold" fill="#fde047">Note : Butée ±95° = Modif. CAO prévue avant usinage.</tspan>
    </text>
  </g>

  <!-- PANEL 3 : PLAQUE CIRCULAIRE DE COU Ø 100,02 mm (FIDELE AU PNG) -->
  <g transform="translate(968, 100)">
    <rect width="448" height="816" rx="10" fill="#1e293b" stroke="#facc15" stroke-width="1.5" filter="url(#shd)"/>
    <rect width="448" height="38" rx="10" fill="#ca8a04" fill-opacity="0.22"/>
    <text x="224" y="24" text-anchor="middle" font-family="system-ui, sans-serif" font-size="13" font-weight="bold" fill="#facc15">
      3. PLAQUE DE COU CIRCULAIRE Ø 100 mm (89,63 g)
    </text>

    <text x="224" y="64" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11" font-weight="bold" fill="#f8fafc">
      VUE DE DESSUS (X-Y) — CONFORME SNAPSHOT FUSION 360
    </text>

    <!-- Disque Ø 100,02 mm (1 mm = 2.8 px -> R = 140 px) -->
    <!-- Centre = (224, 248) -->
    <g transform="translate(224, 248)">
      <!-- Axes -->
      <line x1="-165" y1="0" x2="165" y2="0" stroke="#475569" stroke-dasharray="5,4"/>
      <line x1="0" y1="-165" x2="0" y2="165" stroke="#475569" stroke-dasharray="5,4"/>

      <!-- Disque extérieur Ø 100 mm -->
      <circle cx="0" cy="0" r="140" fill="url(#aluPlate)" stroke="#38bdf8" stroke-width="2.2"/>

      <!-- Ailes horizontales fantômes des Equerres cou (30x50 mm) -->
      <rect x="-70" y="34" width="140" height="72" rx="10" fill="#eab308" fill-opacity="0.18" stroke="#facc15" stroke-dasharray="4,3"/>
      <rect x="-70" y="-106" width="140" height="72" rx="10" fill="#eab308" fill-opacity="0.18" stroke="#facc15" stroke-dasharray="4,3"/>

      <!-- Rectangle 4x CHC M4 (30 x 50 mm -> ±15 x ±25 mm = ±42 x ±70 px) -->
      <circle cx="-42" cy="-70" r="6.5" fill="#0f172a" stroke="#facc15" stroke-width="2"/>
      <circle cx="42" cy="-70" r="6.5" fill="#0f172a" stroke="#facc15" stroke-width="2"/>
      <circle cx="-42" cy="70" r="6.5" fill="#0f172a" stroke="#facc15" stroke-width="2"/>
      <circle cx="42" cy="70" r="6.5" fill="#0f172a" stroke="#facc15" stroke-width="2"/>

      <!-- Cercle primitif 6 trous Ø 5.03 mm Collet / Plastron (PCD Ø 85,1 mm -> r = 119.1 px) -->
      <circle cx="0" cy="0" r="119.1" fill="none" stroke="#94a3b8" stroke-width="0.9" stroke-dasharray="3,4"/>
      <circle cx="0" cy="-119.1" r="7" fill="#0f172a" stroke="#38bdf8" stroke-width="1.8"/>
      <circle cx="0" cy="119.1" r="7" fill="#0f172a" stroke="#38bdf8" stroke-width="1.8"/>
      <circle cx="-103.2" cy="-59.5" r="7" fill="#0f172a" stroke="#38bdf8" stroke-width="1.8"/>
      <circle cx="103.2" cy="-59.5" r="7" fill="#0f172a" stroke="#38bdf8" stroke-width="1.8"/>
      <circle cx="-103.2" cy="59.5" r="7" fill="#0f172a" stroke="#38bdf8" stroke-width="1.8"/>
      <circle cx="103.2" cy="59.5" r="7" fill="#0f172a" stroke="#38bdf8" stroke-width="1.8"/>

      <!-- 4 trous fraisés FHC M3x8 pour EL05 / RS-05 rotatif (PCD Ø 38,5 mm -> r = 53.9 px, indexés ~37°) -->
      <circle cx="0" cy="0" r="53.9" fill="none" stroke="#f472b6" stroke-width="1" stroke-dasharray="3,2"/>
      <circle cx="32.4" cy="-43.0" r="5" fill="#be185d" stroke="#fbcfe8" stroke-width="1.6"/>
      <circle cx="43.0" cy="32.4" r="5" fill="#be185d" stroke="#fbcfe8" stroke-width="1.6"/>
      <circle cx="-32.4" cy="43.0" r="5" fill="#be185d" stroke="#fbcfe8" stroke-width="1.6"/>
      <circle cx="-43.0" cy="-32.4" r="5" fill="#be185d" stroke="#fbcfe8" stroke-width="1.6"/>

      <!-- Large lumière oblongue droite de routage faisceau (+X latéral) -->
      <rect x="76" y="-34" width="44" height="72" rx="10" fill="#0f172a" stroke="#4ade80" stroke-width="2.2"/>
      <text x="98" y="2" text-anchor="middle" font-family="system-ui, sans-serif" font-size="8.5" font-weight="bold" fill="#4ade80" transform="rotate(-90,98,2)">LUMIÈRE CÂBLES</text>

      <!-- Cotation Ø 100 mm & 30 x 50 mm -->
      <line x1="-140" y1="158" x2="140" y2="158" stroke="#38bdf8" stroke-width="1.3" marker-start="url(#arBrev)" marker-end="url(#arB)"/>
      <text x="0" y="175" text-anchor="middle" font-family="system-ui, sans-serif" font-size="10.5" font-weight="bold" fill="#38bdf8">Ø 100,02 mm (Ép. 4,70 mm)</text>
      <text x="0" y="-8" text-anchor="middle" font-family="system-ui, sans-serif" font-size="9.5" font-weight="bold" fill="#f472b6">4× FHC M3×8</text>
      <text x="0" y="6" text-anchor="middle" font-family="system-ui, sans-serif" font-size="8.5" fill="#fbcfe8">EL05 / RS-05 (PCD Ø 38,5)</text>
    </g>

    <!-- Résumé CAO Plaque de Cou & EL05 -->
    <rect x="20" y="465" width="408" height="332" rx="8" fill="#0f172a" stroke="#334155"/>
    <text x="36" y="490" font-family="system-ui, sans-serif" font-size="11.5" font-weight="bold" fill="#facc15">
      COORDINATIONS &amp; QUINCAILLERIE PLAQUE DE COU
    </text>
    <text x="36" y="514" font-family="system-ui, sans-serif" font-size="10" fill="#cbd5e1">
      <tspan x="36" dy="0">• Composant : <tspan font-weight="bold" fill="#ffffff">Plaque_de_Cou_7075</tspan> (89,63 g, 31,90 cm³)</tspan>
      <tspan x="36" dy="20">• Géométrie : <tspan font-weight="bold" fill="#38bdf8">Disque Ø 100,02 mm × ép. 4,70 mm</tspan></tspan>
      <tspan x="36" dy="22" font-weight="bold" fill="#facc15">4 Groupes de Perçages Validés v42 :</tspan>
      <tspan x="36" dy="19">1. <tspan font-weight="bold" fill="#ffffff">Rectangle 30 × 50 mm</tspan> : 4× Ø 4,3 mm (CHC M4×16</tspan>
      <tspan x="48" dy="17">[92290A154] vers Équerres cou, zéro fraisure).</tspan>
      <tspan x="36" dy="19">2. <tspan font-weight="bold" fill="#ffffff">Couronne 6× Ø 5,03 mm</tspan> (PCD Ø 85 mm) : 6× CHC</tspan>
      <tspan x="48" dy="17">M5×50 [91290A242] (Collet PA12-CF + Plastron).</tspan>
      <tspan x="36" dy="19">3. <tspan font-weight="bold" fill="#f472b6">4× Fraisures Ø 3,2 / Ø 6,5×90°</tspan> (PCD Ø 38,5 mm) :</tspan>
