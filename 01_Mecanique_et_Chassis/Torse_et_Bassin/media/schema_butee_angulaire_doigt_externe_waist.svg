<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1680 1060" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090d16"/>
      <stop offset="55%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#0b1120"/>
    </linearGradient>
    <linearGradient id="panelGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" stop-opacity="0.96"/>
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0.96"/>
    </linearGradient>
    <linearGradient id="aluOrange" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#c2410c"/>
      <stop offset="50%" stop-color="#ea580c"/>
      <stop offset="100%" stop-color="#f97316"/>
    </linearGradient>
    <linearGradient id="aluAmber" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#b45309"/>
      <stop offset="50%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#d97706"/>
    </linearGradient>
    <linearGradient id="aluBlue" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#1e3a8a"/>
      <stop offset="50%" stop-color="#2563eb"/>
      <stop offset="100%" stop-color="#1d4ed8"/>
    </linearGradient>
    <linearGradient id="steelGreen" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#15803d"/>
      <stop offset="50%" stop-color="#22c55e"/>
      <stop offset="100%" stop-color="#16a34a"/>
    </linearGradient>
    <linearGradient id="motorSlate" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#334155"/>
      <stop offset="50%" stop-color="#475569"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
    <pattern id="gridPat" width="30" height="30" patternUnits="userSpaceOnUse">
      <path d="M 30 0 L 0 0 0 30" fill="none" stroke="#334155" stroke-width="0.55" stroke-opacity="0.28"/>
    </pattern>
    <marker id="arrCyan" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <polygon points="0 1, 8 4, 0 7" fill="#38bdf8"/>
    </marker>
    <marker id="arrRed" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <polygon points="0 1, 8 4, 0 7" fill="#ef4444"/>
    </marker>
    <marker id="arrAmber" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <polygon points="0 1, 8 4, 0 7" fill="#f59e0b"/>
    </marker>
    <marker id="arrGreen" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <polygon points="0 1, 8 4, 0 7" fill="#10b981"/>
    </marker>
    <filter id="cardShadow" x="-8%" y="-8%" width="116%" height="116%">
      <feDropShadow dx="0" dy="5" stdDeviation="6" flood-color="#000000" flood-opacity="0.55"/>
    </filter>
  </defs>
  <rect width="1680" height="1060" fill="url(#bgGrad)"/>
  <rect width="1680" height="1060" fill="url(#gridPat)"/>
  <g transform="translate(30, 22)">
    <rect width="1620" height="74" rx="12" fill="#1e293b" stroke="#3b82f6" stroke-width="1.5" filter="url(#cardShadow)"/>
    <circle cx="42" cy="37" r="20" fill="#ef4444" fill-opacity="0.18" stroke="#ef4444" stroke-width="2"/>
    <text x="42" y="44" font-family="Arial, sans-serif" font-size="20" font-weight="bold" fill="#ef4444" text-anchor="middle">!</text>
    <text x="78" y="32" font-family="Arial, sans-serif" font-size="19" font-weight="bold" fill="#f8fafc">BUTÉE MÉCANIQUE EXTERNE ±95° (R = 83,0 MM) — TORSE-123 V42</text>
    <text x="78" y="55" font-family="Arial, sans-serif" font-size="13" fill="#94a3b8">Protection ultime du harnais dorsal/ventral et de l'actionneur RS-06 contre le survirage en cas de crash logiciel</text>
    <rect x="1300" y="19" width="290" height="36" rx="8" fill="#0f172a" stroke="#f87171" stroke-width="1.2"/>
    <text x="1445" y="42" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#f87171" text-anchor="middle">MODIFICATION CAO PRÉVUE AVANT CNC</text>
  </g>

  <!-- Prominent Banner -->
  <g transform="translate(30, 108)">
    <rect width="1620" height="44" rx="8" fill="#450a0a" stroke="#ef4444" stroke-width="1.5"/>
    <text x="810" y="28" font-family="Arial, sans-serif" font-size="13.5" font-weight="bold" fill="#fca5a5" text-anchor="middle">STATUT CAO TORSE-123 V42 : CETTE BUTÉE MÉCANIQUE N'EST PAS ENCORE MODÉLISÉE — MODIFICATION CAO PRÉVUE AVANT LANCEMENT USINAGE CNC</text>
  </g>

  <!-- PANEL 1 : TOP KINEMATIC VIEW -->
  <g transform="translate(30, 168)">
    <rect width="790" height="862" rx="12" fill="url(#panelGrad)" stroke="#334155" stroke-width="1.5" filter="url(#cardShadow)"/>
    <text x="24" y="32" font-family="Arial, sans-serif" font-size="15" font-weight="bold" fill="#38bdf8">1. CINÉMATIQUE ±95° À R = 83,0 MM (VUE DE DESSUS)</text>
    <text x="24" y="52" font-family="Arial, sans-serif" font-size="11.5" fill="#94a3b8">Pivot Yaw [49,23 ; 9,36] | Traverse (174,90×174,84) fixe vs Waist_Plate (176,11×173,05) mobile</text>

    <g transform="translate(395, 420)">
      <line x1="-290" y1="0" x2="290" y2="0" stroke="#475569" stroke-dasharray="6,4"/>
      <line x1="0" y1="-260" x2="0" y2="260" stroke="#475569" stroke-dasharray="6,4"/>
      <text x="-270" y="-12" font-family="Arial, sans-serif" font-size="11" font-weight="bold" fill="#94a3b8">-X (Dorsal)</text>
      <text x="220" y="-12" font-family="Arial, sans-serif" font-size="11" font-weight="bold" fill="#facc15">+X (Ventral)</text>

      <!-- Traverse base -->
      <rect x="-195" y="-195" width="390" height="390" rx="16" fill="#1e3a8a" fill-opacity="0.35" stroke="#60a5fa" stroke-width="2"/>
      <!-- Waist Plate contour -->
      <rect x="-198" y="-192" width="396" height="384" rx="22" fill="#c2410c" fill-opacity="0.16" stroke="#fb923c" stroke-width="2" stroke-dasharray="7,4"/>

      <!-- RB8016 -->
      <circle cx="0" cy="0" r="134" fill="none" stroke="#4ade80" stroke-width="1.6"/>
      <circle cx="0" cy="0" r="89" fill="none" stroke="#4ade80" stroke-width="1.6"/>

      <!-- R = 83.0 mm pitch circle (r = 186 px) -->
      <circle cx="0" cy="0" r="186" fill="none" stroke="#ef4444" stroke-width="1.5" stroke-dasharray="5,4"/>

      <!-- Rear -X arc -->
      <path d="M -110 -122 A 164 164 0 0 0 -110 122" fill="none" stroke="#10b981" stroke-width="28" stroke-linecap="round" stroke-opacity="0.65"/>

      <!-- Planned Finger on +X front (+0 deg nominal) -->
      <rect x="172" y="-12" width="28" height="24" rx="5" fill="#fbbf24" stroke="#ffffff" stroke-width="1.5"/>
      <text x="206" y="26" font-family="Arial, sans-serif" font-size="11" font-weight="bold" fill="#fbbf24">Doigt mobile (0°)</text>

      <!-- Planned Stops at ±95 deg (around -16 px X, ±185 px Y) -->
      <rect x="-28" y="-198" width="26" height="26" rx="5" fill="#ef4444" stroke="#fecaca" stroke-width="1.5"/>
      <rect x="-28" y="172" width="26" height="26" rx="5" fill="#ef4444" stroke="#fecaca" stroke-width="1.5"/>
      <text x="-15" y="-212" font-family="Arial, sans-serif" font-size="11.5" font-weight="bold" fill="#fca5a5" text-anchor="middle">Plot fixe +95° (Traverse)</text>
      <text x="-15" y="220" font-family="Arial, sans-serif" font-size="11.5" font-weight="bold" fill="#fca5a5" text-anchor="middle">Plot fixe -95° (Traverse)</text>

      <!-- Sweep arc -->
      <path d="M 186 -16 A 186 186 0 0 0 4 -186" fill="none" stroke="#f59e0b" stroke-width="3" marker-end="url(#arrAmber)"/>
      <path d="M 186 16 A 186 186 0 0 1 4 186" fill="none" stroke="#f59e0b" stroke-width="3" marker-end="url(#arrAmber)"/>

      <text x="92" y="-128" font-family="Arial, sans-serif" font-size="11" font-weight="bold" fill="#f59e0b" text-anchor="middle">Course +95° max</text>
      <text x="92" y="138" font-family="Arial, sans-serif" font-size="11" font-weight="bold" fill="#f59e0b" text-anchor="middle">Course -95° max</text>
      <text x="-80" y="0" font-family="Arial, sans-serif" font-size="11" font-weight="bold" fill="#34d399" text-anchor="middle">Arcs -X protégés</text>
    </g>

    <rect x="24" y="710" width="742" height="128" rx="8" fill="#0f172a" stroke="#475569"/>
    <text x="40" y="736" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#fb923c">LOI CINÉMATIQUE DE SÉCURITÉ À 2 ÉTAGES</text>
    <text x="40" y="760" font-family="Arial, sans-serif" font-size="11" fill="#e2e8f0">1. Butée logicielle CAN-FD (Odrive/RobStride) : ±80 deg (décélération contrôlée)</text>
    <text x="40" y="782" font-family="Arial, sans-serif" font-size="11" fill="#fca5a5">2. Butée mécanique physique (prévue avant CNC) : ±95 deg à R = 83,0 mm</text>
    <text x="40" y="804" font-family="Arial, sans-serif" font-size="11" fill="#34d399">3. Limite cisaillement câble dans arcs -X / U +X : &gt; ±115 deg (marge 20 deg pure)</text>
  </g>

  <!-- PANEL 2 : COUPE & CALCUL CHOC -->
  <g transform="translate(845, 168)">
    <rect width="805" height="862" rx="12" fill="url(#panelGrad)" stroke="#334155" stroke-width="1.5" filter="url(#cardShadow)"/>
    <text x="24" y="32" font-family="Arial, sans-serif" font-size="15" font-weight="bold" fill="#fbbf24">2. ARCHITECTURE D'IMPACT &amp; CALCUL RDM (R = 83,0 MM)</text>
    <text x="24" y="52" font-family="Arial, sans-serif" font-size="11.5" fill="#94a3b8">Reprise directe du choc sur Traverse 7075 (jamais sur le RB8016 ni sur les brides)</text>

    <!-- Sectional diagram of finger vs pin -->
    <g transform="translate(65, 95)">
      <rect x="0" y="30" width="675" height="32" rx="3" fill="url(#aluOrange)" stroke="#fb923c"/>
      <text x="338" y="51" font-family="Arial, sans-serif" font-size="11.5" font-weight="bold" fill="#fff" text-anchor="middle">Waist_Plate_7075 (9,02 mm | 433,53 g)</text>

      <!-- Finger hanging down to Traverse plane -->
      <rect x="145" y="62" width="44" height="58" rx="4" fill="#fbbf24" stroke="#fde047"/>
      <text x="167" y="96" font-family="Arial, sans-serif" font-size="10.5" font-weight="bold" fill="#0f172a" text-anchor="middle">Doigt</text>

      <!-- Fixed bumper pin on Traverse -->
      <rect x="275" y="74" width="38" height="46" rx="6" fill="#ef4444" stroke="#fecaca"/>
      <text x="294" y="102" font-family="Arial, sans-serif" font-size="10.5" font-weight="bold" fill="#fff" text-anchor="middle">Plot</text>
      <rect x="235" y="84" width="36" height="26" rx="4" fill="#10b981" fill-opacity="0.7" stroke="#34d399"/>
      <text x="253" y="101" font-family="Arial, sans-serif" font-size="9.5" font-weight="bold" fill="#fff" text-anchor="middle">TPU</text>

      <line x1="194" y1="97" x2="230" y2="97" stroke="#f87171" stroke-width="2.5" marker-end="url(#arrRed)"/>

      <rect x="0" y="120" width="675" height="38" rx="3" fill="url(#aluBlue)" stroke="#60a5fa"/>
      <text x="338" y="144" font-family="Arial, sans-serif" font-size="11.5" font-weight="bold" fill="#fff" text-anchor="middle">Traverse_Renfort_Bassin (12,51 mm | 566,74 g)</text>

      <text x="338" y="182" font-family="Arial, sans-serif" font-size="11" font-weight="bold" fill="#34d399" text-anchor="middle">Zone d'amortissement TPU 95A / élastomère : limite le pic de décélération sur l'étage planétaire RS-06</text>
    </g>

    <rect x="24" y="308" width="757" height="258" rx="10" fill="#0f172a" stroke="#fbbf24" stroke-width="1.2"/>
    <text x="42" y="336" font-family="Arial, sans-serif" font-size="12.5" font-weight="bold" fill="#fbbf24">DIMENSIONNEMENT MÉCANIQUE AU RAYON R = 83,0 MM</text>
    <text x="42" y="364" font-family="Arial, sans-serif" font-size="11.5" fill="#e2e8f0">• Couple pic moteur RS-06 : M_max = 36 N.m (crête blocage)</text>
    <text x="42" y="388" font-family="Arial, sans-serif" font-size="11.5" fill="#e2e8f0">• Force tangentielle statique à R = 0,083 m : F = 36 / 0,083 = 434 N</text>
    <text x="42" y="412" font-family="Arial, sans-serif" font-size="11.5" fill="#e2e8f0">• Choc dynamique d'inertie torse (facteur 2,5×) : F_dyn ~ 1 100 N</text>
    <text x="42" y="436" font-family="Arial, sans-serif" font-size="11.5" fill="#34d399">• Cisaillement vis épaulement Acier 12.9 Ø 6 mm (Section ~28 mm2) : Tau ~ 39 MPa &lt;&lt; 600 MPa (Sf &gt; 15)</text>
    <text x="42" y="460" font-family="Arial, sans-serif" font-size="11.5" fill="#34d399">• Contrainte matage Alu 7075 (ep. 9,02 mm / 12,51 mm) : Sigma ~ 20 MPa &lt;&lt; 505 MPa</text>
    <text x="42" y="488" font-family="Arial, sans-serif" font-size="11" fill="#cbd5e1">• L'implantation à R = 83,0 mm double le bras de levier par rapport à l'arbre moteur (divise par 2</text>
    <text x="42" y="508" font-family="Arial, sans-serif" font-size="11" fill="#cbd5e1">  les efforts locaux sur les filets M5/M6 et éloigne tout choc du chemin de billes du RB8016).</text>
    <text x="42" y="538" font-family="Arial, sans-serif" font-size="11" font-weight="bold" fill="#f87171">• NE JAMAIS réduire R sous 75 mm (collision immédiate avec brides L [92290A154] et RB8016).</text>

    <rect x="24" y="586" width="757" height="252" rx="10" fill="#450a0a" fill-opacity="0.35" stroke="#ef4444" stroke-width="1.3"/>
    <text x="42" y="614" font-family="Arial, sans-serif" font-size="12.5" font-weight="bold" fill="#f87171">PLAN D'ACTION CAO À VALIDER AVANT FRESAGE C500</text>
    <text x="42" y="644" font-family="Arial, sans-serif" font-size="11.5" fill="#e2e8f0">1. Ajouter 2 taraudages (ou lamages) sur Traverse_Renfort_Bassin à R = 83,0 mm (±95°).</text>
    <text x="42" y="668" font-family="Arial, sans-serif" font-size="11.5" fill="#e2e8f0">2. Ajouter le pion / vis butoir sur la face inférieure de Waist_Plate_7075 à 0 deg (+X).</text>
    <text x="42" y="692" font-family="Arial, sans-serif" font-size="11.5" fill="#e2e8f0">3. Vérifier dans l'espace 3D de Torse-123 v42 : zéro contact avec les têtes [92290A154]</text>
    <text x="58" y="712" font-family="Arial, sans-serif" font-size="11.5" fill="#cbd5e1">et les écrous Nylstop M4 [93625A150] sur toute la plage -95° .. +95°.</text>
    <text x="42" y="738" font-family="Arial, sans-serif" font-size="11.5" fill="#34d399">4. Ré-exporter les fichiers DXF/STEP CNC uniquement après intégration de cette butée.</text>
    <text x="42" y="772" font-family="Arial, sans-serif" font-size="11" fill="#94a3b8">• Référence BOM réservée : WST-07 (Doigt_Butee_Arriere &amp; Plots ±95°) / VIS-W14.</text>
    <text x="42" y="794" font-family="Arial, sans-serif" font-size="11" fill="#94a3b8">• Aucune référence McMaster inventée avant validation géométrique 3D finale sous Fusion 360.</text>
  </g>
</svg>