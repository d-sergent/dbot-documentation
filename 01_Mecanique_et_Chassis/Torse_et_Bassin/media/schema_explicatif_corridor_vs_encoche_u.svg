<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 560" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b1120"/>
      <stop offset="50%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#080d1a"/>
    </linearGradient>

    <linearGradient id="panelGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>

    <linearGradient id="traverseGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#047857" stop-opacity="0.10"/>
    </linearGradient>

    <linearGradient id="waistGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0284c7" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#0369a1" stop-opacity="0.10"/>
    </linearGradient>

    <pattern id="grid" width="20" height="20" patternUnits="userSpaceOnUse">
      <path d="M 20 0 L 0 0 0 20" fill="none" stroke="#1e293b" stroke-width="0.8" stroke-opacity="0.6"/>
    </pattern>
  </defs>

  <style>
    .title-main { font-family: 'Segoe UI', system-ui, sans-serif; font-size: 16px; font-weight: 800; fill: #f8fafc; }
    .subtitle { font-family: 'Segoe UI', system-ui, sans-serif; font-size: 11px; fill: #94a3b8; }
    .panel-title { font-family: 'Segoe UI', system-ui, sans-serif; font-size: 12px; font-weight: 700; fill: #38bdf8; text-transform: uppercase; letter-spacing: 0.6px; }
    .label-green { font-family: 'SF Mono', monospace; font-size: 9.5px; font-weight: 700; fill: #34d399; }
    .label-blue { font-family: 'SF Mono', monospace; font-size: 9.5px; font-weight: 700; fill: #38bdf8; }
    .card-border { stroke: #334155; stroke-width: 1.5; }
    .axis-line { stroke: #475569; stroke-width: 0.8; stroke-dasharray: 4 3; }
  </style>

  <!-- Fond -->
  <rect width="1280" height="560" fill="url(#bgGrad)"/>
  <rect width="1280" height="560" fill="url(#grid)"/>

  <!-- BANDEAU SUPÉRIEUR -->
  <g transform="translate(30, 20)">
    <rect x="0" y="0" width="1220" height="46" fill="#1e293b" rx="6" class="card-border"/>
    <rect x="0" y="0" width="6" height="46" fill="#38bdf8" rx="3"/>
    <text x="20" y="22" class="title-main">ARCHITECTURE CINÉMATIQUE DU HARNAIS : FENTES EN ARC CONCENTRIQUES (TRAVERSE 69° vs WAIST PLATE 125°)</text>
    <text x="20" y="38" class="subtitle">Conception certifiée CAO Torse v105 • Fente en zone dorsale (-X) • Congés convexes R = 1,5 mm • Recouvrement 22,2 mm à +/- 80° • Zéro cisaillement</text>
  </g>

  <!-- ========================================================================================= -->
  <!-- PANNEAU 1 : LA PIÈCE DU BAS (FIXE) — TRAVERSE BASSIN -->
  <!-- ========================================================================================= -->
  <g transform="translate(30, 80)">
    <rect x="0" y="0" width="390" height="455" fill="url(#panelGrad)" rx="8" class="card-border"/>
    <rect x="14" y="14" width="350" height="24" fill="#0f172a" rx="4" stroke="#334155"/>
    <text x="22" y="30" class="panel-title">1. PIÈCE DU BAS : TRAVERSE BASSIN (STATOR FIXE)</text>

    <!-- Dessin Pièce Bas (cx=195, cy=220) -->
    <g transform="translate(195, 220)">
      <!-- Contour Traverse 175 × 175 mm (228 × 228 px) -->
      <rect x="-114" y="-114" width="228" height="228" rx="16" fill="url(#traverseGrad)" stroke="#10b981" stroke-width="2"/>
      
      <!-- Siège roulement Ø 120 mm (r=78 px) -->
      <circle cx="0" cy="0" r="78" fill="#0f172a" stroke="#64748b" stroke-width="1.5"/>
      <circle cx="0" cy="0" r="52" fill="#0b1120" stroke="#475569" stroke-dasharray="3 3"/>
      
      <!-- Axes -->
      <line x1="-125" y1="0" x2="125" y2="0" class="axis-line"/>
      <line x1="0" y1="-125" x2="0" y2="125" class="axis-line"/>
      <text x="0" y="-118" font-family="'SF Mono', monospace" font-size="8.5" fill="#38bdf8" text-anchor="middle">+X (Ventral)</text>
      <text x="0" y="132" font-family="'SF Mono', monospace" font-size="8.5" fill="#ef4444" text-anchor="middle">-X (Dorsal)</text>

      <!-- Fente Stator 69,0° en zone dorsale (-X / bas) -->
      <path d="M 47.71 69.35 A 84.17 84.17 0 0 1 -47.71 69.35 A 13.00 13.00 0 0 0 -62.44 90.77 A 110.17 110.17 0 0 0 62.44 90.77 A 13.00 13.00 0 0 0 47.71 69.35 Z" fill="#10b981" fill-opacity="0.4" stroke="#34d399" stroke-width="2"/>
      
      <!-- Faisceau traversant neutre -->
      <circle cx="0" cy="97.17" r="9.5" fill="#0f172a" stroke="#fbbf24" stroke-width="1.5"/>
      <text x="0" y="100.17" font-family="'SF Mono', monospace" font-size="6.5" font-weight="700" fill="#fbbf24" text-anchor="middle">Ø15</text>

      <!-- Carte de titre au centre dégagée -->
      <rect x="-75" y="-35" width="150" height="32" rx="4" fill="#0f172a" fill-opacity="0.9" stroke="#334155" stroke-width="0.8"/>
      <text x="0" y="-21" class="label-green" text-anchor="middle">FENTE STATOR 69,0°</text>
      <text x="0" y="-8" font-family="'SF Mono', monospace" font-size="8" fill="#cbd5e1" text-anchor="middle">Masse réelle : 567,7 g</text>
      
      <!-- Cotes ponts latérales -->
      <rect x="-108" y="88" width="68" height="28" rx="3" fill="#0f172a" fill-opacity="0.9" stroke="#334155" stroke-width="0.6"/>
      <text x="-74" y="99" font-family="'SF Mono', monospace" font-size="7.5" fill="#f43f5e" text-anchor="middle">Pont: 4,75 mm</text>
      <text x="-74" y="111" font-family="'SF Mono', monospace" font-size="7.5" fill="#c084fc" text-anchor="middle">Arrière: 3,3 mm</text>
    </g>

    <g transform="translate(14, 395)">
      <rect x="0" y="0" width="362" height="46" fill="#0f172a" rx="4" stroke="#334155"/>
      <text x="10" y="18" font-family="'Segoe UI', sans-serif" font-size="9.5" fill="#34d399" font-weight="700">✔ Plaque d'Aluminium 7075 FIXE (Pelvis)</text>
      <text x="10" y="34" font-family="'Segoe UI', sans-serif" font-size="9" fill="#94a3b8">Fente de 69° en bas • Congés convexes R = 1,5 mm sur arêtes.</text>
    </g>
  </g>

  <!-- ========================================================================================= -->
  <!-- PANNEAU 2 : LA PIÈCE DU HAUT (MOBILE) — WAIST PLATE 7075 -->
  <!-- ========================================================================================= -->
  <g transform="translate(445, 80)">
    <rect x="0" y="0" width="390" height="455" fill="url(#panelGrad)" rx="8" class="card-border"/>
    <rect x="14" y="14" width="350" height="24" fill="#0f172a" rx="4" stroke="#334155"/>
    <text x="22" y="30" class="panel-title">2. PIÈCE DU HAUT : WAIST PLATE (ROTOR MOBILE)</text>

    <!-- Dessin Pièce Haut (cx=195, cy=220) -->
    <g transform="translate(195, 220)">
      <!-- Contour Waist Plate avec grands congés avant -->
      <path d="M -114 -65 C -114 -100, -95 -114, -60 -114 L 60 -114 C 95 -114, 114 -100, 114 -65 L 114 92 C 114 108, 106 114, 90 114 L -90 114 C -106 114, -114 108, -114 92 Z" fill="url(#waistGrad)" stroke="#0ea5e9" stroke-width="2"/>
      
      <!-- Alésage Ø 80 mm (r=52 px) -->
      <circle cx="0" cy="0" r="52" fill="#0f172a" stroke="#38bdf8" stroke-width="1.8"/>
      <circle cx="0" cy="0" r="40" fill="#0b1120" stroke="#60a5fa" stroke-dasharray="3 3"/>
      
      <!-- Axes -->
      <line x1="-125" y1="0" x2="125" y2="0" class="axis-line"/>
      <line x1="0" y1="-125" x2="0" y2="125" class="axis-line"/>
      <text x="0" y="-118" font-family="'SF Mono', monospace" font-size="8.5" fill="#38bdf8" text-anchor="middle">+X (Ventral)</text>
      <text x="0" y="132" font-family="'SF Mono', monospace" font-size="8.5" fill="#ef4444" text-anchor="middle">-X (Dorsal)</text>

      <!-- Fente Rotor Élargie 125,0° en zone dorsale (-X / bas) -->
      <path d="M 74.68 38.84 A 84.17 84.17 0 0 1 -74.68 38.84 A 13.00 13.00 0 0 0 -97.75 50.83 A 110.17 110.17 0 0 0 97.75 50.83 A 13.00 13.00 0 0 0 74.68 38.84 Z" fill="#0284c7" fill-opacity="0.4" stroke="#38bdf8" stroke-width="2"/>

      <!-- Faisceau coulissant -->
      <circle cx="0" cy="97.17" r="9.5" fill="#0f172a" stroke="#fbbf24" stroke-width="1.5"/>
      <text x="0" y="100.17" font-family="'SF Mono', monospace" font-size="6.5" font-weight="700" fill="#fbbf24" text-anchor="middle">Ø15</text>

      <!-- Carte titre au centre -->
      <rect x="-75" y="-35" width="150" height="32" rx="4" fill="#0f172a" fill-opacity="0.9" stroke="#334155" stroke-width="0.8"/>
      <text x="0" y="-21" class="label-blue" text-anchor="middle">FENTE ROTOR 125,0°</text>
      <text x="0" y="-8" font-family="'SF Mono', monospace" font-size="8" fill="#cbd5e1" text-anchor="middle">Masse réelle : 434,7 g</text>
      
      <text x="-110" y="35" font-family="'SF Mono', monospace" font-size="7.5" fill="#34d399">Flanc: 14,9 mm</text>
      <text x="50" y="35" font-family="'SF Mono', monospace" font-size="7.5" fill="#34d399">Flanc: 14,9 mm</text>
    </g>

    <g transform="translate(14, 395)">
      <rect x="0" y="0" width="362" height="46" fill="#0f172a" rx="4" stroke="#334155"/>
      <text x="10" y="18" font-family="'Segoe UI', sans-serif" font-size="9.5" fill="#38bdf8" font-weight="700">✔ Plaque d'Alu 7075 TOURNANTE (Torse)</text>
      <text x="10" y="34" font-family="'Segoe UI', sans-serif" font-size="9" fill="#94a3b8">Fente élargie à 125° pour balayer sans cisaillement à +/- 80°.</text>
    </g>
  </g>

  <!-- ========================================================================================= -->
  <!-- PANNEAU 3 : COMPORTEMENT CINÉMATIQUE DYNAMIQUE (+/- 80°) -->
  <!-- ========================================================================================= -->
  <g transform="translate(860, 80)">
    <rect x="0" y="0" width="390" height="455" fill="url(#panelGrad)" rx="8" class="card-border"/>
    <rect x="14" y="14" width="350" height="24" fill="#0f172a" rx="4" stroke="#334155"/>
    <text x="22" y="30" class="panel-title">3. COMPORTEMENT CINÉMATIQUE (+/- 80°)</text>

    <!-- Dessin Cinématique Dynamique -->
    <g transform="translate(195, 215)">
      <!-- Schéma Comparatif 1 : Neutre 0° -->
      <g transform="translate(0, -75)">
        <rect x="-160" y="-32" width="320" height="65" rx="6" fill="#0f172a" stroke="#334155"/>
        <text x="-148" y="-14" font-family="'SF Mono', monospace" font-size="9" font-weight="700" fill="#f8fafc">A. POSITION NEUTRE (0° LACET)</text>
        
        <!-- Traverse 69° -> 90 px -->
        <rect x="-45" y="5" width="90" height="12" rx="4" fill="#10b981" fill-opacity="0.5" stroke="#34d399"/>
        <!-- Waist 125° -> 160 px -->
        <rect x="-80" y="5" width="160" height="12" rx="4" fill="none" stroke="#38bdf8" stroke-width="1.8" stroke-dasharray="4 2"/>
        
        <!-- Faisceau au centre -->
        <circle cx="0" cy="11" r="5" fill="#fbbf24"/>
        <text x="-148" y="28" font-family="'SF Mono', monospace" font-size="8" font-weight="700" fill="#34d399">Recouvrement max = 90,0 mm (faisceau 100% libre)</text>
      </g>

      <!-- Schéma Comparatif 2 : Rotation Maximale (+80°) -->
      <g transform="translate(0, 60)">
        <rect x="-160" y="-32" width="320" height="95" rx="6" fill="#0f172a" stroke="#334155"/>
        <text x="-148" y="-14" font-family="'SF Mono', monospace" font-size="9" font-weight="700" fill="#fbbf24">B. ROTATION MAXIMALE (+80° LACET)</text>
        
        <!-- Traverse fixe au centre -->
        <rect x="-45" y="5" width="90" height="12" rx="4" fill="#10b981" fill-opacity="0.5" stroke="#34d399"/>
        
        <!-- Waist Plate tournée de 80° (décalée vers la droite de 55 px) -->
        <rect x="10" y="5" width="160" height="12" rx="4" fill="none" stroke="#38bdf8" stroke-width="1.8" stroke-dasharray="4 2"/>
        
        <!-- Fenêtre commune de recouvrement : de x = +10 à x = +45 -> 35 px (~22,2 mm) -->
        <rect x="10" y="5" width="35" height="12" rx="2" fill="#c084fc" fill-opacity="0.7" stroke="#e879f9" stroke-width="1.5"/>
        
        <!-- Faisceau dans la fenêtre -->
        <circle cx="27" cy="11" r="5" fill="#fbbf24" stroke="#ffffff" stroke-width="0.8"/>

        <text x="-148" y="35" font-family="'SF Mono', monospace" font-size="8" font-weight="700" fill="#c084fc">Fenêtre commune : 17,05° d'arc = 22,24 mm</text>
        <text x="-148" y="48" font-family="'SF Mono', monospace" font-size="8" fill="#34d399">Faisceau Ø 15,0 mm ➔ Marge saine = +7,24 mm</text>
      </g>
    </g>

    <g transform="translate(14, 395)">
      <rect x="0" y="0" width="362" height="46" fill="#0f172a" rx="4" stroke="#334155"/>
      <text x="10" y="18" font-family="'Segoe UI', sans-serif" font-size="9.5" fill="#c084fc" font-weight="700">✔ Torsion Hélicoïdale Douce (0,50° / mm)</text>
      <text x="10" y="34" font-family="'Segoe UI', sans-serif" font-size="9" fill="#94a3b8">Glissement fluide • Zéro cisaillement métal/métal.</text>
    </g>
  </g>
</svg>