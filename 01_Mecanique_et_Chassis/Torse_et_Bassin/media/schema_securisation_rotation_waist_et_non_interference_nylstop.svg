<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1620 1040" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090d16"/>
      <stop offset="55%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#0b1120"/>
    </linearGradient>
    <linearGradient id="panelGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" stop-opacity="0.96"/>
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0.96"/>
    </linearGradient>
    <linearGradient id="aluOrange" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#c2410c"/>
      <stop offset="50%" stop-color="#ea580c"/>
      <stop offset="100%" stop-color="#f97316"/>
    </linearGradient>
    <linearGradient id="aluAmber" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#b45309"/>
      <stop offset="50%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#d97706"/>
    </linearGradient>
    <linearGradient id="aluBlue" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#1e3a8a"/>
      <stop offset="50%" stop-color="#2563eb"/>
      <stop offset="100%" stop-color="#1d4ed8"/>
    </linearGradient>
    <linearGradient id="steelGreen" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#15803d"/>
      <stop offset="50%" stop-color="#22c55e"/>
      <stop offset="100%" stop-color="#16a34a"/>
    </linearGradient>
    <linearGradient id="motorSlate" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#334155"/>
      <stop offset="50%" stop-color="#475569"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
    <pattern id="gridPat" width="30" height="30" patternUnits="userSpaceOnUse">
      <path d="M 30 0 L 0 0 0 30" fill="none" stroke="#334155" stroke-width="0.55" stroke-opacity="0.28"/>
    </pattern>
    <marker id="arrCyan" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <polygon points="0 1, 8 4, 0 7" fill="#38bdf8"/>
    </marker>
    <marker id="arrRed" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <polygon points="0 1, 8 4, 0 7" fill="#ef4444"/>
    </marker>
    <marker id="arrAmber" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <polygon points="0 1, 8 4, 0 7" fill="#f59e0b"/>
    </marker>
    <marker id="arrGreen" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <polygon points="0 1, 8 4, 0 7" fill="#10b981"/>
    </marker>
    <filter id="cardShadow" x="-8%" y="-8%" width="116%" height="116%">
      <feDropShadow dx="0" dy="5" stdDeviation="6" flood-color="#000000" flood-opacity="0.55"/>
    </filter>
  </defs>
  <rect width="1620" height="1040" fill="url(#bgGrad)"/>
  <rect width="1620" height="1040" fill="url(#gridPat)"/>
  <g transform="translate(30, 22)">
    <rect width="1560" height="74" rx="12" fill="#1e293b" stroke="#3b82f6" stroke-width="1.5" filter="url(#cardShadow)"/>
    <circle cx="42" cy="37" r="20" fill="#34d399" fill-opacity="0.18" stroke="#34d399" stroke-width="2"/>
    <text x="42" y="44" font-family="Arial, sans-serif" font-size="20" font-weight="bold" fill="#34d399" text-anchor="middle">S</text>
    <text x="78" y="32" font-family="Arial, sans-serif" font-size="19" font-weight="bold" fill="#f8fafc">SÉCURISATION ROTATION WAIST YAW &amp; NON-INTERFÉRENCE NYLSTOP — V42</text>
    <text x="78" y="55" font-family="Arial, sans-serif" font-size="13" fill="#94a3b8">Couronnes d'exclusion géométrique, dégagements visserie [92290A154 / 92290A168 / 93625A150] &amp; butée ±95° prévue</text>
    <rect x="1240" y="19" width="290" height="36" rx="8" fill="#0f172a" stroke="#fbbf24" stroke-width="1.2"/>
    <text x="1385" y="42" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#fbbf24" text-anchor="middle">TORSE-123 V42 | BUTÉE PRÉVUE</text>
  </g>

  <!-- PANEL 1 : POLAR EXCLUSION -->
  <g transform="translate(30, 114)">
    <rect width="580" height="896" rx="12" fill="url(#panelGrad)" stroke="#334155" stroke-width="1.5" filter="url(#cardShadow)"/>
    <text x="22" y="32" font-family="Arial, sans-serif" font-size="14.5" font-weight="bold" fill="#38bdf8">1. CERCLES D'EXCLUSION (VUE POLAIRE)</text>
    <text x="22" y="52" font-family="Arial, sans-serif" font-size="11.5" fill="#94a3b8">Zéro collision entre vis, brides L, harnais et plots de butée ±95°</text>

    <g transform="translate(290, 422)">
      <rect x="-175" y="-175" width="350" height="350" rx="16" fill="#1e3a8a" fill-opacity="0.32" stroke="#60a5fa" stroke-width="2"/>
      <!-- RB8016 Ø 120 (r=120) -->
      <circle cx="0" cy="0" r="120" fill="none" stroke="#4ade80" stroke-width="2"/>
      <circle cx="0" cy="0" r="80" fill="none" stroke="#4ade80" stroke-width="1.5"/>

      <!-- 4x Brides L circle (r ~ 138) -->
      <circle cx="0" cy="0" r="138" fill="none" stroke="#fbbf24" stroke-width="1" stroke-dasharray="4,4"/>
      <circle cx="98" cy="-98" r="16" fill="#f59e0b" fill-opacity="0.55" stroke="#fbbf24"/>
      <circle cx="98" cy="98" r="16" fill="#f59e0b" fill-opacity="0.55" stroke="#fbbf24"/>
      <circle cx="-98" cy="-98" r="16" fill="#f59e0b" fill-opacity="0.55" stroke="#fbbf24"/>
      <circle cx="-98" cy="98" r="16" fill="#f59e0b" fill-opacity="0.55" stroke="#fbbf24"/>

      <!-- Harnais arc -X (r = 150, 69.05 deg Traverse) -->
      <path d="M -130 -74 A 150 150 0 0 0 -130 74" fill="none" stroke="#10b981" stroke-width="26" stroke-linecap="round" stroke-opacity="0.55"/>

      <!-- Hard stop radius R=80.50 mm -> r=161 (Doigt +X 0 deg, Plots ±109.86 deg) -->
      <circle cx="0" cy="0" r="161" fill="none" stroke="#ef4444" stroke-width="1.8" stroke-dasharray="6,3"/>
      <rect x="151" y="-18" width="20" height="36" rx="3" fill="#ef4444" fill-opacity="0.85" stroke="#fecaca" stroke-width="1.5"/>
      <text x="183" y="4" font-family="Arial, sans-serif" font-size="10.5" font-weight="bold" fill="#fca5a5">Doigt +X (0°)</text>
      <circle cx="-55" cy="-151" r="9" fill="#ef4444" stroke="#fecaca"/>
      <circle cx="-55" cy="151" r="9" fill="#ef4444" stroke="#fecaca"/>

      <!-- Labels strictly outside -->
      <text x="0" y="-196" font-family="Arial, sans-serif" font-size="11.5" font-weight="bold" fill="#f87171" text-anchor="middle">Couronne prévue butée ±95,0° : R = 80,50 mm (Plots ±109,86°)</text>
      <text x="0" y="206" font-family="Arial, sans-serif" font-size="11.5" font-weight="bold" fill="#f87171" text-anchor="middle">Doigt +X (0°) sous Waist + 2 Plots Traverse (Modif. CAO)</text>
      <text x="0" y="226" font-family="Arial, sans-serif" font-size="11.5" font-weight="bold" fill="#fbbf24" text-anchor="middle">Cercle Brides L RB8016 (4× à 45° — Modélisées v42)</text>
      <text x="0" y="-4" font-family="Arial, sans-serif" font-size="11" font-weight="bold" fill="#34d399" text-anchor="middle">RB8016</text>
      <text x="0" y="14" font-family="Arial, sans-serif" font-size="10.5" fill="#cbd5e1" text-anchor="middle">Ø 120 / Ø 80</text>
    </g>

    <rect x="22" y="675" width="536" height="196" rx="8" fill="#0f172a" stroke="#475569"/>
    <text x="38" y="702" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#34d399">ZONES D'EXCLUSION VALIDÉES</text>
    <text x="38" y="728" font-family="Arial, sans-serif" font-size="11" fill="#e2e8f0">• Anneau R = 40..60 mm : Roulement RB8016 + 4× Brides L (Z = 1017..1033)</text>
    <text x="38" y="750" font-family="Arial, sans-serif" font-size="11" fill="#e2e8f0">• Anneau R = 64,75..84,75 mm (-X) : Arc dorsal 69,05° / 125,05° libre</text>
    <text x="38" y="772" font-family="Arial, sans-serif" font-size="11" fill="#e2e8f0">• Secteur +X (0 deg) : Pleine matière Alu 7075-T6 (Doigt butée R = 80,50 mm)</text>
    <text x="38" y="794" font-family="Arial, sans-serif" font-size="11" fill="#fca5a5">• Rayon R = 80,50 mm (doigt +X 0°, plots ±109,86°) : Butée ±95,0° avant CNC</text>
    <text x="38" y="822" font-family="Arial, sans-serif" font-size="11" fill="#94a3b8">• Vis coins Traverse : 4× FHC M5×18 [92125A213] affleurantes (zéro saillie)</text>
  </g>

  <!-- PANEL 2 : Z INTERFERENCE CHECK -->
  <g transform="translate(635, 114)">
    <rect width="500" height="896" rx="12" fill="url(#panelGrad)" stroke="#334155" stroke-width="1.5" filter="url(#cardShadow)"/>
    <text x="22" y="32" font-family="Arial, sans-serif" font-size="14.5" font-weight="bold" fill="#fbbf24">2. CHAÎNE DE COTES AXIALE (Z)</text>
    <text x="22" y="52" font-family="Arial, sans-serif" font-size="11.5" fill="#94a3b8">Vérification anti-collision têtes CHC &amp; Nylstop sous Waist Plate</text>

    <rect x="22" y="76" width="456" height="430" rx="10" fill="#0f172a" stroke="#334155"/>
    <text x="38" y="106" font-family="Arial, sans-serif" font-size="12.5" font-weight="bold" fill="#fb923c">ALTITUDES RÉELLES TORSE-123 V42 (MM)</text>
    <text x="38" y="136" font-family="Arial, sans-serif" font-size="11.5" fill="#e2e8f0">• Face sup. Waist_Plate_7075 : Z = 1042,43 mm</text>
    <text x="38" y="160" font-family="Arial, sans-serif" font-size="11.5" fill="#e2e8f0">• Face inf. Waist_Plate_7075 : Z = 1033,41 mm (ep. 9,02 mm)</text>
    <text x="38" y="184" font-family="Arial, sans-serif" font-size="11.5" fill="#34d399">• Face sup. RB8016 / Moyeu : Z = 1033,44 / 1033,03 mm</text>
    <text x="38" y="208" font-family="Arial, sans-serif" font-size="11.5" fill="#34d399">  ➔ Jeu fonctionnel garanti : 0,38 mm</text>
    <text x="38" y="232" font-family="Arial, sans-serif" font-size="11.5" fill="#e2e8f0">• Face sup. Traverse_Renfort : Z = 1020,41 mm</text>
    <text x="38" y="256" font-family="Arial, sans-serif" font-size="11.5" fill="#e2e8f0">• Face inf. Traverse_Renfort : Z = 1007,90 mm (ep. 12,51 mm)</text>
    <text x="38" y="280" font-family="Arial, sans-serif" font-size="11.5" fill="#fbbf24">• Garde Traverse / Waist : 13,00 mm (moyeu) / 16,01 mm (aile ext.)</text>
    <text x="38" y="314" font-family="Arial, sans-serif" font-size="11.5" fill="#e2e8f0">• Têtes vis FHC M5×18 [92125A213] (Traverse) :</text>
    <text x="50" y="334" font-family="Arial, sans-serif" font-size="11" fill="#34d399">Fraisées à Z = 1020,4 mm (0,0 mm de saillie)</text>
    <text x="38" y="362" font-family="Arial, sans-serif" font-size="11.5" fill="#e2e8f0">• Nylstop M4 [93625A150] (Equerres / Brides / Plastron) :</text>
    <text x="50" y="382" font-family="Arial, sans-serif" font-size="11" fill="#34d399">Logés côté externe / coins — zéro passage sous Waist mobile</text>
    <text x="38" y="410" font-family="Arial, sans-serif" font-size="11.5" fill="#e2e8f0">• Têtes vis Brides L [92290A154] (M4×16) :</text>
    <text x="50" y="430" font-family="Arial, sans-serif" font-size="11" fill="#cbd5e1">Z_tête max = 1032,0 mm &lt; 1033,41 mm (marge &gt; 1,4 mm)</text>
    <text x="38" y="464" font-family="Arial, sans-serif" font-size="11" font-weight="bold" fill="#f87171">• Règle butée ±95° : Plots 11,5 mm sur Traverse (+4,51 mm sous</text>
    <text x="50" y="484" font-family="Arial, sans-serif" font-size="11" fill="#fecaca">aile ext. Waist 1036,42 mm) à R = 80,50 mm (±109,86°).</text>

    <rect x="22" y="528" width="456" height="344" rx="10" fill="#0f172a" stroke="#10b981" stroke-width="1.2"/>
    <text x="38" y="556" font-family="Arial, sans-serif" font-size="12.5" font-weight="bold" fill="#34d399">VÉRIFICATIONS MCMASTER-CARR V42</text>
    <text x="38" y="586" font-family="Arial, sans-serif" font-size="11.5" fill="#e2e8f0">• [92290A168] CHC M4×20 : serrage Moyeu + Equerre waist</text>
    <text x="38" y="610" font-family="Arial, sans-serif" font-size="11.5" fill="#e2e8f0">• [92290A154] CHC M4×16 : 4× Brides retenue RB8016</text>
    <text x="38" y="634" font-family="Arial, sans-serif" font-size="11.5" fill="#e2e8f0">• [92125A213] FHC M5×18 : 4× coins Traverse ➔ Inserts</text>
    <text x="38" y="658" font-family="Arial, sans-serif" font-size="11.5" fill="#e2e8f0">• [91290A150] CHC M4×14 : 4× Corniere basse ➔ Waist</text>
    <text x="38" y="682" font-family="Arial, sans-serif" font-size="11.5" fill="#fbbf24">• [92855A313] CHC M3×12 : Stator RS-06 (1/8 en v42)</text>
    <text x="38" y="706" font-family="Arial, sans-serif" font-size="11.5" fill="#e2e8f0">• [93625A150] / [93625A200] : Écrous frein Nylstop M4 / M5</text>
    <text x="38" y="730" font-family="Arial, sans-serif" font-size="11.5" fill="#e2e8f0">• [93475A230] / [93475A240] : Rondelles DIN 125A M4 / M5</text>
    <text x="38" y="766" font-family="Arial, sans-serif" font-size="11" fill="#34d399" font-weight="bold">• Toutes ces références sont exactes et issues de Torse-123 v42.</text>
    <text x="38" y="792" font-family="Arial, sans-serif" font-size="11" fill="#94a3b8">• Orientation obligatoire Nylstop : dôme polyamide vers l'extérieur.</text>
  </g>

  <!-- PANEL 3 : 3 FICHES -->
  <g transform="translate(1160, 114)">
    <rect width="430" height="896" rx="12" fill="url(#panelGrad)" stroke="#334155" stroke-width="1.5" filter="url(#cardShadow)"/>
    <text x="22" y="32" font-family="Arial, sans-serif" font-size="14.5" font-weight="bold" fill="#34d399">3. FICHES DE SÉCURISATION</text>

    <!-- Fiche 1 -->
    <rect x="20" y="60" width="390" height="250" rx="10" fill="#450a0a" fill-opacity="0.45" stroke="#ef4444" stroke-width="1.3"/>
    <text x="36" y="88" font-family="Arial, sans-serif" font-size="12.5" font-weight="bold" fill="#f87171">FICHE 1 : BUTÉE MÉCANIQUE ±95°</text>
    <text x="36" y="116" font-family="Arial, sans-serif" font-size="11" fill="#fecaca">STATUT : MODIFICATION CAO PRÉVUE AVANT CNC</text>
    <text x="36" y="142" font-family="Arial, sans-serif" font-size="11" fill="#e2e8f0">• Double rôle : limite logicielle ±80° (Odrive)</text>
    <text x="48" y="162" font-family="Arial, sans-serif" font-size="11" fill="#e2e8f0">puis blocage dur physique à ±95° (R = 80,50 mm).</text>
    <text x="36" y="188" font-family="Arial, sans-serif" font-size="11" fill="#e2e8f0">• Prévient l'arrachement du faisceau 48V/CAN-FD</text>
    <text x="48" y="208" font-family="Arial, sans-serif" font-size="11" fill="#e2e8f0">en cas de dérive codeur ou impact au sol.</text>
    <text x="36" y="236" font-family="Arial, sans-serif" font-size="11" fill="#34d399">• Amortissement TPU 95A sur plots fixes pour</text>
    <text x="48" y="256" font-family="Arial, sans-serif" font-size="11" fill="#34d399">absorber le pic d'énergie cinétique torse.</text>

    <!-- Fiche 2 -->
    <rect x="20" y="330" width="390" height="260" rx="10" fill="#0f172a" stroke="#fbbf24" stroke-width="1.2"/>
    <text x="36" y="358" font-family="Arial, sans-serif" font-size="12.5" font-weight="bold" fill="#fbbf24">FICHE 2 : FREINAGE &amp; ANTI-DESSERRAGE</text>
    <text x="36" y="386" font-family="Arial, sans-serif" font-size="11" fill="#e2e8f0">• 100% des liaisons traversantes du bassin et de la</text>
    <text x="48" y="406" font-family="Arial, sans-serif" font-size="11" fill="#e2e8f0">colonne utilisent des Nylstop [93625A150 / A200]</text>
    <text x="48" y="426" font-family="Arial, sans-serif" font-size="11" fill="#e2e8f0">ou des rondelles Nord-Lock [91812A252] (RS-04).</text>
    <text x="36" y="454" font-family="Arial, sans-serif" font-size="11" fill="#e2e8f0">• Les vis dans taraudage borgne Alu 7075</text>
    <text x="48" y="474" font-family="Arial, sans-serif" font-size="11" fill="#e2e8f0">([92290A168], [92290A154], [92855A313])</text>
    <text x="48" y="494" font-family="Arial, sans-serif" font-size="11" fill="#e2e8f0">sont systématiquement montées au Loctite 243.</text>
    <text x="36" y="526" font-family="Arial, sans-serif" font-size="11" fill="#34d399">• Dégagement minimum vérifié : &gt;= 1,4 mm sous</text>
    <text x="48" y="546" font-family="Arial, sans-serif" font-size="11" fill="#34d399">Waist_Plate en rotation continue 360 deg.</text>

    <!-- Fiche 3 -->
    <rect x="20" y="610" width="390" height="262" rx="10" fill="#0f172a" stroke="#10b981" stroke-width="1.2"/>
    <text x="36" y="638" font-family="Arial, sans-serif" font-size="12.5" font-weight="bold" fill="#34d399">FICHE 3 : TEST ENVELOPPE FUSION 360</text>
    <text x="36" y="666" font-family="Arial, sans-serif" font-size="11" fill="#e2e8f0">• Avant usinage : activer Motion Study / Drive Joint</text>
    <text x="48" y="686" font-family="Arial, sans-serif" font-size="11" fill="#e2e8f0">sur J4 (RS-06) de -95 deg à +95 deg.</text>
    <text x="36" y="714" font-family="Arial, sans-serif" font-size="11" fill="#e2e8f0">• Exécuter Inspect &gt; Interference sur l'ensemble</text>
    <text x="48" y="734" font-family="Arial, sans-serif" font-size="11" fill="#e2e8f0">Torse + Bassin_Pelvis + visserie McMaster.</text>
    <text x="36" y="762" font-family="Arial, sans-serif" font-size="11" fill="#fbbf24">• Vérifier que les 8 pièces ASV1_200 hanches</text>
    <text x="48" y="782" font-family="Arial, sans-serif" font-size="11" fill="#fbbf24">(WIP) ne réduisent pas la boucle de service</text>
    <text x="48" y="802" font-family="Arial, sans-serif" font-size="11" fill="#fbbf24">faisceau ni le débattement angulaire ±95°.</text>
  </g>
</svg>