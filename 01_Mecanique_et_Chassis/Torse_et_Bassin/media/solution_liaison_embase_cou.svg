<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1240 740" width="100%" height="100%">
  <defs>
    <pattern id="gridSol" width="20" height="20" patternUnits="userSpaceOnUse">
      <path d="M 20 0 L 0 0 0 20" fill="none" stroke="#1e293b" stroke-width="0.7"/>
    </pattern>
    <filter id="shdSol" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="4" stdDeviation="5" flood-color="#000" flood-opacity="0.5"/>
    </filter>
  </defs>

  <rect width="1240" height="740" fill="#0f172a"/>
  <rect width="1240" height="740" fill="url(#gridSol)"/>

  <!-- Header -->
  <g transform="translate(20, 16)">
    <rect width="1200" height="64" rx="8" fill="#1e293b" stroke="#38bdf8" stroke-width="1.5" filter="url(#shdSol)"/>
    <text x="600" y="29" text-anchor="middle" font-family="system-ui, sans-serif" font-size="17" font-weight="bold" fill="#f8fafc">
      LIAISONS D'EXTRÉMITÉS (COU &amp; TAILLE) — PROTOCOLE D'ATELIER INVERSÉ (TORSE-123 v42)
    </text>
    <text x="600" y="50" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11.5" fill="#94a3b8">
      Trous Ronds Ø 4,3 mm (Zéro Oblong) · Plaque de Cou Ø 100×4,70 mm (30×50 mm) + RS-05 (EL05) Rotatif · Équerres Waist 90 mm (Waist Plate 9,02 mm)
    </text>
  </g>

  <!-- PANEL A : COUPE DE LA LIAISON HAUTE (COU) -->
  <g transform="translate(20, 96)">
    <rect width="380" height="624" rx="10" fill="#1e293b" stroke="#38bdf8" stroke-width="1.5" filter="url(#shdSol)"/>
    <text x="190" y="28" text-anchor="middle" font-family="system-ui, sans-serif" font-size="13" font-weight="bold" fill="#38bdf8">
      A. COUPE LIAISON HAUTE (COU)
    </text>
    <text x="190" y="46" text-anchor="middle" font-family="system-ui, sans-serif" font-size="10" fill="#94a3b8">
      Double Cornière 30×30×3 mm + Trous Ronds Ø 4,3 mm
    </text>

    <!-- Schéma en T inversé superposé proprement -->
    <g transform="translate(190, 128)">
      <text x="0" y="-58" text-anchor="middle" font-family="system-ui, sans-serif" font-size="9.5" font-weight="bold" fill="#4ade80">
        4× CHC M4×16 [92290A154] + Nylstop (30×50 mm)
      </text>
      <text x="0" y="-44" text-anchor="middle" font-family="system-ui, sans-serif" font-size="9" fill="#facc15">
        Perçages lisses Ø 4,3 mm (Zéro Fraisure)
      </text>

      <!-- Plaque de cou 4.70 mm (Ø 100 mm) -->
      <rect x="-140" y="-12" width="280" height="18" rx="4" fill="#cbd5e1" stroke="#38bdf8" stroke-width="1.8"/>
      <text x="0" y="-27" text-anchor="middle" font-family="system-ui, sans-serif" font-size="9.5" font-weight="bold" fill="#38bdf8">
        PLAQUE DE COU Ø 100 × 4,70 mm (89,63 g)
      </text>

      <!-- Equerre G & D -->
      <path d="M -88,6 L -12,6 L -12,96 L -22,96 L -22,16 L -88,16 Z" fill="#f59e0b" stroke="#fde047" stroke-width="1.4"/>
      <path d="M 88,6 L 12,6 L 12,96 L 22,96 L 22,16 L 88,16 Z" fill="#f59e0b" stroke="#fde047" stroke-width="1.4"/>

      <!-- Colonne sagittale 5,0 mm -->
      <rect x="-11" y="8" width="22" height="190" fill="#0284c7" stroke="#7dd3fc" stroke-width="1.6"/>
      <text x="0" y="135" text-anchor="middle" font-family="system-ui, sans-serif" font-size="9" font-weight="bold" fill="#ffffff" transform="rotate(-90,0,135)">
        Colonne 5,0 mm
      </text>

      <!-- Vis verticales Plaque -> Equerres -->
      <rect x="-66" y="-24" width="8" height="44" fill="#38bdf8"/>
      <rect x="58" y="-24" width="8" height="44" fill="#38bdf8"/>
      <rect x="-69" y="16" width="14" height="8" rx="2" fill="#22c55e"/>
      <rect x="55" y="16" width="14" height="8" rx="2" fill="#22c55e"/>

      <!-- Vis horizontale pince colonne -->
      <rect x="-36" y="48" width="72" height="8" fill="#4ade80"/>
      <rect x="-42" y="45" width="7" height="14" rx="1" fill="#fde047"/>
      <rect x="35" y="45" width="8" height="14" rx="2" fill="#22c55e"/>
      <text x="-125" y="56" text-anchor="middle" font-family="system-ui, sans-serif" font-size="8.5" font-weight="bold" fill="#4ade80">
        2× CHC M4×20
      </text>
      <text x="-125" y="68" text-anchor="middle" font-family="system-ui, sans-serif" font-size="8" fill="#cbd5e1">
        + DIN 125A + Nylstop
      </text>
      <text x="110" y="74" text-anchor="middle" font-family="system-ui, sans-serif" font-size="8.5" font-weight="bold" fill="#facc15">
        Trous Ronds Ø 4,3
      </text>
      <text x="110" y="86" text-anchor="middle" font-family="system-ui, sans-serif" font-size="8" fill="#cbd5e1">
        (Butée Z rigide)
      </text>
      <text x="0" y="208" text-anchor="middle" font-family="system-ui, sans-serif" font-size="9.5" fill="#94a3b8">
        ▼ Vers Nœud d'Épaules &amp; Waist (H_tot = 427,03 mm)
      </text>
    </g>

    <!-- Points RDM -->
    <rect x="16" y="346" width="348" height="260" rx="8" fill="#0f172a" stroke="#334155"/>
    <text x="30" y="370" font-family="system-ui, sans-serif" font-size="11" font-weight="bold" fill="#facc15">
      POURQUOI LA FOURCHE RIGIDE v42 ?
    </text>
    <text x="30" y="392" font-family="system-ui, sans-serif" font-size="9.5" fill="#cbd5e1">
      <tspan x="30" dy="0" font-weight="bold" fill="#38bdf8">1. Fin du découplage V1 par oblongs :</tspan>
      <tspan x="38" dy="16">• Colonne 7075-T6 usinée C500 à ±0,02 mm.</tspan>
      <tspan x="38" dy="16">• Trous ronds Ø 4,3 mm : zéro glissement sous choc.</tspan>
      <tspan x="30" dy="22" font-weight="bold" fill="#4ade80">2. Intégration Actionneurs Cou RS-05 (EL05) :</tspan>
      <tspan x="38" dy="16">• Pan rotatif (EL05_ASM, 210,44 g) sur Plaque Cou</tspan>
      <tspan x="38" dy="16">  par 4× FHC M3×8 [91294A112] sur PCD Ø 38,5 mm.</tspan>
      <tspan x="38" dy="16">• Tilt associé dans 02_Tete_et_Cou (2e RS-05).</tspan>
      <tspan x="30" dy="22" font-weight="bold" fill="#f472b6">3. Routage Faisceau Déporté (Arbre Plein) :</tspan>
      <tspan x="38" dy="16">• Lumière latérale oblongue intégrée à la Plaque.</tspan>
      <tspan x="38" dy="16">• Dégagement garanti du carter EL05 (46×46 mm).</tspan>
    </text>
  </g>

  <!-- PANEL B : PROTOCOLE D'ATELIER INVERSÉ (5 ÉTAPES) -->
  <g transform="translate(420, 96)">
    <rect width="400" height="624" rx="10" fill="#1e293b" stroke="#4ade80" stroke-width="1.5" filter="url(#shdSol)"/>
    <text x="200" y="28" text-anchor="middle" font-family="system-ui, sans-serif" font-size="13" font-weight="bold" fill="#4ade80">
      B. PROTOCOLE D'ATELIER INVERSÉ
    </text>
    <text x="200" y="46" text-anchor="middle" font-family="system-ui, sans-serif" font-size="10" fill="#94a3b8">
      Montage Haut sur Établi &amp; Verrouillage Central Dégagé
    </text>

    <!-- Étape 1..5 -->
    <g transform="translate(18, 66)">
      <rect width="364" height="94" rx="6" fill="#0f172a" stroke="#38bdf8"/>
      <circle cx="24" cy="24" r="13" fill="#0284c7"/>
      <text x="24" y="29" text-anchor="middle" font-family="system-ui, sans-serif" font-size="12" font-weight="bold" fill="#fff">1</text>
      <text x="46" y="28" font-family="system-ui, sans-serif" font-size="10.5" font-weight="bold" fill="#f8fafc">Fixation Equerres Cou sur Colonne</text>
      <text x="46" y="46" font-family="system-ui, sans-serif" font-size="9" fill="#cbd5e1">
        <tspan x="46" dy="0">Pincer sommet colonne 5 mm (2× L=50 mm = 46,57 g).</tspan>
        <tspan x="46" dy="15">Serrer 2× CHC M4×20 [92290A168] + Nylstop à 3,0 N.m.</tspan>
        <tspan x="46" dy="15" fill="#4ade80" font-weight="bold">➔ Accès 360° sur établi, alignement Z exact.</tspan>
      </text>

      <rect y="106" width="364" height="94" rx="6" fill="#0f172a" stroke="#38bdf8"/>
      <circle cx="24" cy="130" r="13" fill="#0284c7"/>
      <text x="24" y="135" text-anchor="middle" font-family="system-ui, sans-serif" font-size="12" font-weight="bold" fill="#fff">2</text>
      <text x="46" y="134" font-family="system-ui, sans-serif" font-size="10.5" font-weight="bold" fill="#f8fafc">Pose Plaque de Cou &amp; Moteur RS-05 (EL05)</text>
      <text x="46" y="152" font-family="system-ui, sans-serif" font-size="9" fill="#cbd5e1">
        <tspan x="46" dy="0">Boulonner Plaque Ø 100×4,70 mm (89,63 g) par 4× CHC</tspan>
        <tspan x="46" dy="15">M4×16 [92290A154] (30×50 mm) + 4× Nylstop à 3,0 N.m.</tspan>
        <tspan x="46" dy="15">Fixer stator EL05 / RS-05 par 4× FHC M3×8 [91294A112].</tspan>
      </text>

      <rect y="212" width="364" height="94" rx="6" fill="#0f172a" stroke="#38bdf8"/>
      <circle cx="24" cy="236" r="13" fill="#0284c7"/>
      <text x="24" y="241" text-anchor="middle" font-family="system-ui, sans-serif" font-size="12" font-weight="bold" fill="#fff">3</text>
      <text x="46" y="240" font-family="system-ui, sans-serif" font-size="10.5" font-weight="bold" fill="#f8fafc">Fixation Basse Waist_Plate_7075 (9,02 mm)</text>
      <text x="46" y="258" font-family="system-ui, sans-serif" font-size="9" fill="#cbd5e1">
        <tspan x="46" dy="0">Boulonner 2× Equerre waist (L=90 mm, 42,11 g/u) via</tspan>
        <tspan x="46" dy="15">4× CHC M4×20 traversants colonne + 4× CHC M4×25</tspan>
        <tspan x="46" dy="15">[91292A122] dans Moyeu_Waist_Sandwich_7075.</tspan>
      </text>

      <rect y="318" width="364" height="98" rx="6" fill="#0f172a" stroke="#f59e0b"/>
      <circle cx="24" cy="342" r="13" fill="#d97706"/>
      <text x="24" y="347" text-anchor="middle" font-family="system-ui, sans-serif" font-size="12" font-weight="bold" fill="#fff">4</text>
      <text x="46" y="346" font-family="system-ui, sans-serif" font-size="10.5" font-weight="bold" fill="#fde047">Verrouillage Nœud Central d'Épaules (FINAL)</text>
      <text x="46" y="364" font-family="system-ui, sans-serif" font-size="9" fill="#cbd5e1">
        <tspan x="46" dy="0">Emmancher les tubes carrés 60×60 sur les 2 Inserts 15°.</tspan>
        <tspan x="46" dy="15">Serrer les 4× CHC M5×70 [91290A272] traversantes à 6 N.m.</tspan>
        <tspan x="46" dy="15" fill="#4ade80" font-weight="bold">✔ Zone médiane 100% accessible : zéro contorsion !</tspan>
      </text>

      <rect y="428" width="364" height="72" rx="6" fill="#0f172a" stroke="#334155"/>
      <circle cx="24" cy="452" r="13" fill="#475569"/>
      <text x="24" y="457" text-anchor="middle" font-family="system-ui, sans-serif" font-size="12" font-weight="bold" fill="#fff">5</text>
      <text x="46" y="456" font-family="system-ui, sans-serif" font-size="10.5" font-weight="bold" fill="#f8fafc">Collet PA12-CF &amp; Fermeture Plastron</text>
      <text x="46" y="474" font-family="system-ui, sans-serif" font-size="9" fill="#cbd5e1">
        <tspan x="46" dy="0">6× CHC M5×50 [91290A242] fixent Cou - Tube collet</tspan>
        <tspan x="46" dy="15">(51,90 g brut) + sommet Plastron sur PCD Ø 85 mm.</tspan>
      </text>

      <text x="182" y="524" text-anchor="middle" font-family="system-ui, sans-serif" font-size="9.5" font-weight="bold" fill="#4ade80">
        Séquence Naturelle : Cou &amp; Waist sur Établi ➔ Sandwich Épaules
      </text>
    </g>
  </g>

  <!-- PANEL C : COMPARATIF & RÉFÉRENCES BOM v42 -->
  <g transform="translate(840, 96)">
    <rect width="380" height="624" rx="10" fill="#1e293b" stroke="#facc15" stroke-width="1.5" filter="url(#shdSol)"/>
    <text x="190" y="28" text-anchor="middle" font-family="system-ui, sans-serif" font-size="13" font-weight="bold" fill="#facc15">
      C. COMPARATIF &amp; NOMENCLATURE v42
    </text>
    <text x="190" y="46" text-anchor="middle" font-family="system-ui, sans-serif" font-size="10" fill="#94a3b8">
      Trous Ronds Ø 4,3 mm vs Anciens Oblongs V1
    </text>

    <!-- Mini Tableau Comparatif -->
    <g transform="translate(16, 66)">
      <rect width="348" height="24" rx="4" fill="#0f172a"/>
      <text x="10" y="16" font-family="system-ui, sans-serif" font-size="9" font-weight="bold" fill="#94a3b8">Critère</text>
      <text x="145" y="16" font-family="system-ui, sans-serif" font-size="9" font-weight="bold" fill="#4ade80">Trous Ronds v42</text>
      <text x="255" y="16" font-family="system-ui, sans-serif" font-size="9" font-weight="bold" fill="#f87171">Oblongs V1</text>

      <rect y="28" width="348" height="26" fill="#0f172a" fill-opacity="0.5"/>
      <text x="10" y="45" font-family="system-ui, sans-serif" font-size="9" fill="#e2e8f0">Tenue Z sous choc</text>
      <text x="145" y="45" font-family="system-ui, sans-serif" font-size="9" font-weight="bold" fill="#4ade80">Butée 0 mm ✔</text>
      <text x="255" y="45" font-family="system-ui, sans-serif" font-size="9" fill="#fca5a5">Friction 1 mm ✘</text>

      <rect y="58" width="348" height="26" fill="#0f172a" fill-opacity="0.25"/>
      <text x="10" y="75" font-family="system-ui, sans-serif" font-size="9" fill="#e2e8f0">Couloir RS-05</text>
      <text x="145" y="75" font-family="system-ui, sans-serif" font-size="9" font-weight="bold" fill="#4ade80">Rect. 30×50 ✔</text>
      <text x="255" y="75" font-family="system-ui, sans-serif" font-size="9" fill="#fca5a5">30 mm étriqué ✘</text>

      <rect y="88" width="348" height="26" fill="#0f172a" fill-opacity="0.5"/>
      <text x="10" y="105" font-family="system-ui, sans-serif" font-size="9" fill="#e2e8f0">Rigidité roulis</text>
      <text x="145" y="105" font-family="system-ui, sans-serif" font-size="9" font-weight="bold" fill="#4ade80">+50% (Base 50) ✔</text>
      <text x="255" y="105" font-family="system-ui, sans-serif" font-size="9" fill="#fca5a5">Base 30 mm</text>

      <rect y="118" width="348" height="26" fill="#0f172a" fill-opacity="0.25"/>
      <text x="10" y="135" font-family="system-ui, sans-serif" font-size="9" fill="#e2e8f0">Usinage CNC C500</text>
      <text x="145" y="135" font-family="system-ui, sans-serif" font-size="9" font-weight="bold" fill="#4ade80">Perçage 1 passe ✔</text>
      <text x="255" y="135" font-family="system-ui, sans-serif" font-size="9" fill="#fca5a5">Fraisage 2D ✘</text>
    </g>

    <!-- Nomenclature McMaster v42 -->
    <rect x="16" y="232" width="348" height="374" rx="8" fill="#0f172a" stroke="#334155"/>
    <text x="30" y="256" font-family="system-ui, sans-serif" font-size="11" font-weight="bold" fill="#facc15">
      INVENTAIRE CERTIFIÉ TORSE-123 v42
    </text>
    <text x="30" y="280" font-family="system-ui, sans-serif" font-size="9.3" fill="#cbd5e1">
      <tspan x="30" dy="0" font-weight="bold" fill="#38bdf8">1. Liaisons Hautes (Cou — Alu 7075) :</tspan>
      <tspan x="30" dy="16">• <tspan font-weight="bold" fill="#fff">Plaque_de_Cou_7075</tspan> : Ø 100×4,70 (89,63 g)</tspan>
      <tspan x="30" dy="16">• <tspan font-weight="bold" fill="#fff">Equerre cou</tspan> (paire L=50 mm) : 46,57 g</tspan>
      <tspan x="30" dy="16">• 4× CHC M4×16 <tspan fill="#facc15">[92290A154]</tspan> + 4× Nylstop <tspan fill="#facc15">[93625A150]</tspan></tspan>
      <tspan x="30" dy="16">• 2× CHC M4×20 <tspan fill="#facc15">[92290A168]</tspan> (colonne)</tspan>
      <tspan x="30" dy="16">• 6× CHC M5×50 <tspan fill="#facc15">[91290A242]</tspan> (collet + plastron)</tspan>
      <tspan x="30" dy="16">• 4× FHC M3×8 <tspan fill="#facc15">[91294A112]</tspan> ➔ EL05 / RS-05</tspan>
      <tspan x="30" dy="22" font-weight="bold" fill="#4ade80">2. Liaisons Basses (Waist — Alu 7075) :</tspan>
      <tspan x="30" dy="16">• <tspan font-weight="bold" fill="#fff">Equerre waist</tspan> (2× L=90 mm) : 84,22 g paire</tspan>
      <tspan x="30" dy="16">• <tspan font-weight="bold" fill="#fff">Waist_Plate_7075</tspan> : 176,1×173,1×9,02 (433,53 g)</tspan>
      <tspan x="30" dy="16">• 4× CHC M4×20 <tspan fill="#facc15">[92290A168]</tspan> + 8× DIN 125A</tspan>
      <tspan x="30" dy="16">• 4× CHC M4×25 <tspan fill="#facc15">[91292A122]</tspan> ➔ Moyeu Sandwich</tspan>
      <tspan x="30" dy="22" font-weight="bold" fill="#f472b6">3. Note R&amp;D Butée Lacet ±95° :</tspan>
      <tspan x="30" dy="16">Modification CAO prévue avant usinage CNC.</tspan>
      <tspan x="30" dy="18" font-weight="bold" fill="#ffffff">Serrage M4 : 2,8–3,0 N.m · M3 : 1,2–1,4 N.m</tspan>
    </text>
  </g>
</svg>