<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1000" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090d16"/>
      <stop offset="55%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#0b1120"/>
    </linearGradient>
    <linearGradient id="panelGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" stop-opacity="0.96"/>
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0.96"/>
    </linearGradient>
    <linearGradient id="aluOrange" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#c2410c"/>
      <stop offset="50%" stop-color="#ea580c"/>
      <stop offset="100%" stop-color="#f97316"/>
    </linearGradient>
    <linearGradient id="aluAmber" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#b45309"/>
      <stop offset="50%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#d97706"/>
    </linearGradient>
    <linearGradient id="aluBlue" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#1e3a8a"/>
      <stop offset="50%" stop-color="#2563eb"/>
      <stop offset="100%" stop-color="#1d4ed8"/>
    </linearGradient>
    <linearGradient id="steelGreen" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#15803d"/>
      <stop offset="50%" stop-color="#22c55e"/>
      <stop offset="100%" stop-color="#16a34a"/>
    </linearGradient>
    <linearGradient id="paViolet" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#5b21b6"/>
      <stop offset="50%" stop-color="#7c3aed"/>
      <stop offset="100%" stop-color="#6d28d9"/>
    </linearGradient>
    <linearGradient id="motorSlate" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#334155"/>
      <stop offset="50%" stop-color="#475569"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
    <pattern id="gridPat" width="30" height="30" patternUnits="userSpaceOnUse">
      <path d="M 30 0 L 0 0 0 30" fill="none" stroke="#334155" stroke-width="0.55" stroke-opacity="0.28"/>
    </pattern>
    <marker id="arrCyan" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <polygon points="0 1, 8 4, 0 7" fill="#38bdf8"/>
    </marker>
    <marker id="arrRed" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <polygon points="0 1, 8 4, 0 7" fill="#ef4444"/>
    </marker>
    <marker id="arrAmber" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <polygon points="0 1, 8 4, 0 7" fill="#f59e0b"/>
    </marker>
    <marker id="arrGreen" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <polygon points="0 1, 8 4, 0 7" fill="#10b981"/>
    </marker>
    <filter id="cardShadow" x="-8%" y="-8%" width="116%" height="116%">
      <feDropShadow dx="0" dy="5" stdDeviation="6" flood-color="#000000" flood-opacity="0.55"/>
    </filter>
  </defs>
  <rect width="1600" height="1000" fill="url(#bgGrad)"/>
  <rect width="1600" height="1000" fill="url(#gridPat)"/>
  <g transform="translate(30, 22)">
    <rect width="1540" height="74" rx="12" fill="#1e293b" stroke="#3b82f6" stroke-width="1.5" filter="url(#cardShadow)"/>
    <circle cx="42" cy="37" r="20" fill="#38bdf8" fill-opacity="0.18" stroke="#38bdf8" stroke-width="2"/>
    <text x="42" y="44" font-family="Arial, sans-serif" font-size="20" font-weight="bold" fill="#38bdf8" text-anchor="middle">H</text>
    <text x="78" y="32" font-family="Arial, sans-serif" font-size="18.5" font-weight="bold" fill="#f8fafc">D-BOT V1 — ARCHITECTURE HYBRIDE BASSIN &amp; STANDARDISATION BRIDES RS-04</text>
    <text x="78" y="55" font-family="Arial, sans-serif" font-size="12.5" fill="#94a3b8">Squelette métallique Pont de Hanches (1 114,87 g) + Coque PA12-CF calibrée 0,700 g/cm3 (441,36 g) — Torse-123 v42</text>
    <rect x="1220" y="19" width="290" height="36" rx="8" fill="#0f172a" stroke="#34d399" stroke-width="1.2"/>
    <text x="1365" y="42" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#34d399" text-anchor="middle">CONVERGENCE CAO V42</text>
  </g>

  <!-- PANEL 1 : SQUELETTE MÉTALLIQUE -->
  <g transform="translate(30, 114)">
    <rect width="510" height="860" rx="12" fill="url(#panelGrad)" stroke="#334155" stroke-width="1.5" filter="url(#cardShadow)"/>
    <text x="22" y="32" font-family="Arial, sans-serif" font-size="14.5" font-weight="bold" fill="#38bdf8">1. SQUELETTE MÉTALLIQUE PORTANT (100% ALU)</text>

    <g transform="translate(255, 225)">
      <!-- Waist Plate & RB8016 & Traverse -->
      <rect x="-110" y="-158" width="220" height="22" rx="3" fill="url(#aluOrange)" stroke="#fb923c"/>
      <text x="0" y="-143" font-family="Arial, sans-serif" font-size="10" font-weight="bold" fill="#fff" text-anchor="middle">Waist_Plate (9,02 mm | 433,53 g)</text>

      <rect x="-85" y="-134" width="170" height="26" rx="3" fill="url(#steelGreen)" stroke="#4ade80"/>
      <text x="0" y="-117" font-family="Arial, sans-serif" font-size="10" font-weight="bold" fill="#fff" text-anchor="middle">RB8016 (Ø 120×80 | 633,41 g)</text>

      <rect x="-115" y="-104" width="230" height="26" rx="3" fill="url(#aluBlue)" stroke="#60a5fa"/>
      <text x="0" y="-87" font-family="Arial, sans-serif" font-size="10" font-weight="bold" fill="#fff" text-anchor="middle">Traverse_Renfort (12,51 mm | 566,74 g)</text>

      <!-- 4 Montants 20x20 around RS-06 -->
      <rect x="-88" y="-78" width="22" height="100" rx="2" fill="#64748b" stroke="#cbd5e1"/>
      <rect x="66" y="-78" width="22" height="100" rx="2" fill="#64748b" stroke="#cbd5e1"/>
      <rect x="-54" y="-74" width="108" height="58" rx="4" fill="url(#motorSlate)" stroke="#94a3b8"/>
      <text x="0" y="-42" font-family="Arial, sans-serif" font-size="10.5" font-weight="bold" fill="#f8fafc" text-anchor="middle">RS-06 (550,97 g)</text>

      <!-- Selle en H -->
      <rect x="-105" y="22" width="210" height="28" rx="3" fill="url(#aluOrange)" stroke="#fb923c"/>
      <text x="0" y="40" font-family="Arial, sans-serif" font-size="10" font-weight="bold" fill="#fff" text-anchor="middle">Selle en H (140×145×22 | 338,98 g)</text>

      <!-- Brides Hanches + Tube 60x60 + RS-04 -->
      <rect x="-126" y="52" width="38" height="82" rx="4" fill="url(#aluAmber)" stroke="#fde047"/>
      <rect x="88" y="52" width="38" height="82" rx="4" fill="url(#aluAmber)" stroke="#fde047"/>
      <rect x="-88" y="64" width="176" height="58" rx="3" fill="#1d4ed8" stroke="#60a5fa"/>
      <text x="0" y="90" font-family="Arial, sans-serif" font-size="10.5" font-weight="bold" fill="#fff" text-anchor="middle">Tube 60×60 (L = 46,33 mm)</text>
      <text x="0" y="108" font-family="Arial, sans-serif" font-size="9.5" fill="#dbeafe" text-anchor="middle">57,67 g | 2× CHC M5×80 [91290A276]</text>

      <rect x="-215" y="44" width="84" height="98" rx="8" fill="#0c4a6e" stroke="#38bdf8" stroke-width="1.6"/>
      <text x="-173" y="90" font-family="Arial, sans-serif" font-size="11" font-weight="bold" fill="#e0f2fe" text-anchor="middle">RS-04 G</text>
      <text x="-173" y="108" font-family="Arial, sans-serif" font-size="9.5" fill="#7dd3fc" text-anchor="middle">120 N.m pic</text>

      <rect x="131" y="44" width="84" height="98" rx="8" fill="#0c4a6e" stroke="#38bdf8" stroke-width="1.6"/>
      <text x="173" y="90" font-family="Arial, sans-serif" font-size="11" font-weight="bold" fill="#e0f2fe" text-anchor="middle">RS-04 D</text>
      <text x="173" y="108" font-family="Arial, sans-serif" font-size="9.5" fill="#7dd3fc" text-anchor="middle">120 N.m pic</text>

      <text x="0" y="164" font-family="Arial, sans-serif" font-size="10.5" font-weight="bold" fill="#34d399" text-anchor="middle">Entraxe 4× Montants 20×20 : L = 65,77 mm (102,84 g) + 8× Inserts</text>
    </g>

    <rect x="22" y="432" width="466" height="404" rx="10" fill="#0f172a" stroke="#334155"/>
    <text x="38" y="460" font-family="Arial, sans-serif" font-size="12.5" font-weight="bold" fill="#38bdf8">CARACTÉRISTIQUES DU SQUELETTE V42</text>
    <text x="38" y="490" font-family="Arial, sans-serif" font-size="11" fill="#e2e8f0">• Interface Waist haute : Traverse 7075 (566,74 g) + RB8016 + Moyeu</text>
    <text x="38" y="514" font-family="Arial, sans-serif" font-size="11" fill="#e2e8f0">• Portance rigide : Pont de Hanches tout-métal (1 114,87 g visserie incl.)</text>
    <text x="38" y="538" font-family="Arial, sans-serif" font-size="11" fill="#e2e8f0">• Brides Epaule v87 identiques (202,30 g/u) aux 2 épaules &amp; 2 hanches</text>
    <text x="38" y="562" font-family="Arial, sans-serif" font-size="11" fill="#e2e8f0">• Tenue chocs marche 2g (1 200 N) : Sigma_max &lt; 35 MPa (Sf &gt; 14)</text>
    <text x="38" y="586" font-family="Arial, sans-serif" font-size="11" fill="#e2e8f0">• Vis brides hanches : 8× [90128A214] + 12× [92855A422] + Nord-Lock</text>
    <text x="38" y="616" font-family="Arial, sans-serif" font-size="11" font-weight="bold" fill="#34d399">• Squelette Pont de Hanches : 1 114,87 g (hors 2× RS-04 hanches)</text>
    <text x="38" y="646" font-family="Arial, sans-serif" font-size="11" font-weight="bold" fill="#f87171">• Butée mécanique ±95° (R=83,0 mm) : Modif. CAO prévue avant CNC</text>
    <text x="38" y="676" font-family="Arial, sans-serif" font-size="11" fill="#f59e0b">• Habillages latéraux (8× ASV1_200) : en cours de définition côté CAO</text>
  </g>

  <!-- PANEL 2 : COQUE PA12-CF & CABLAGE -->
  <g transform="translate(560, 114)">
    <rect width="510" height="860" rx="12" fill="url(#panelGrad)" stroke="#334155" stroke-width="1.5" filter="url(#cardShadow)"/>
    <text x="22" y="32" font-family="Arial, sans-serif" font-size="14.5" font-weight="bold" fill="#c084fc">2. COQUE PA12-CF CALIBRÉE &amp; CÂBLAGE DÉPORTÉ</text>

    <!-- Stylized decoupling card diagram -->
    <g transform="translate(30, 60)">
      <rect x="0" y="0" width="450" height="270" rx="16" fill="#2e1065" fill-opacity="0.45" stroke="#a855f7" stroke-width="2" stroke-dasharray="6,3"/>
      <text x="225" y="28" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#e9d5ff" text-anchor="middle">Chassis_Structurel_Bassin_Last (PA12-CF Calibré)</text>
      <text x="225" y="48" font-family="Arial, sans-serif" font-size="11" font-weight="bold" fill="#34d399" text-anchor="middle">Masse CAO v42 : 441,36 g (rho_eff = 0,700 g/cm3 | 630,52 cm3)</text>

      <rect x="45" y="72" width="360" height="62" rx="8" fill="#1e3a8a" stroke="#60a5fa"/>
      <text x="225" y="98" font-family="Arial, sans-serif" font-size="11" font-weight="bold" fill="#fff" text-anchor="middle">Emboîture Pont de Hanches (Zéro reprise d'efforts)</text>
      <text x="225" y="118" font-family="Arial, sans-serif" font-size="10" fill="#dbeafe" text-anchor="middle">8× CHC M4×25 [91292A122] + Nylstop M4 [93625A150]</text>

      <rect x="45" y="154" width="360" height="88" rx="8" fill="#0f172a" stroke="#facc15" stroke-width="1.4"/>
      <text x="225" y="180" font-family="Arial, sans-serif" font-size="11.5" font-weight="bold" fill="#facc15" text-anchor="middle">CORRIDOR DÉPORTÉ 48V / CAN-FD (ARBRE RS-04/06 PLEIN)</text>
      <text x="225" y="202" font-family="Arial, sans-serif" font-size="10.5" fill="#e2e8f0" text-anchor="middle">• Passage par encoche U ventrale + arcs dorsaux -X</text>
      <text x="225" y="222" font-family="Arial, sans-serif" font-size="10.5" fill="#34d399" text-anchor="middle">• Boucle de service libre hanches (-90° .. +45° Pitch)</text>
    </g>

    <rect x="22" y="352" width="466" height="484" rx="10" fill="#0f172a" stroke="#a855f7" stroke-width="1.2"/>
    <text x="38" y="380" font-family="Arial, sans-serif" font-size="12.5" font-weight="bold" fill="#c084fc">PRINCIPE DE DÉCOUPLAGE MÉCANIQUE</text>
    <text x="38" y="410" font-family="Arial, sans-serif" font-size="11" font-weight="bold" fill="#38bdf8">1. Flux d'efforts 100% métallique</text>
    <text x="48" y="432" font-family="Arial, sans-serif" font-size="10.5" fill="#e2e8f0">• Les chocs de marche (1 200 N) et couples (120 N.m) transitent</text>
    <text x="48" y="452" font-family="Arial, sans-serif" font-size="10.5" fill="#e2e8f0">exclusivement dans l'Alu 7075/6060 — zéro fluage polymère !</text>

    <text x="38" y="486" font-family="Arial, sans-serif" font-size="11" font-weight="bold" fill="#34d399">2. Rôle pur de Chassis_Structurel_Bassin_Last (441,36 g)</text>
    <text x="48" y="508" font-family="Arial, sans-serif" font-size="10.5" fill="#e2e8f0">• Carénage anti-poussière &amp; guidage du faisceau 48V/CAN-FD.</text>
    <text x="48" y="528" font-family="Arial, sans-serif" font-size="10.5" fill="#e2e8f0">• Gain direct de -3 350,6 g vs ancien bloc usiné Alu (3,79 kg).</text>

    <text x="38" y="562" font-family="Arial, sans-serif" font-size="11" font-weight="bold" fill="#f59e0b">3. 8 Occurrences ASV1_200 Hanches (Statut WIP)</text>
    <text x="48" y="584" font-family="Arial, sans-serif" font-size="10.5" fill="#fde68a">• Support_Hanche_G/D (06C/08C) &amp; Liaison_Hanche_G/D (07C/09C)</text>
    <text x="48" y="604" font-family="Arial, sans-serif" font-size="10.5" fill="#fde68a">• Capot_Lateral_G/D (04B/05B) &amp; Capot_Frontal_G/D (02A/03A)</text>
    <text x="48" y="624" font-family="Arial, sans-serif" font-size="10.5" fill="#fde68a">➔ Toutes explicitement en cours de définition côté CAO (v42).</text>

    <text x="38" y="658" font-family="Arial, sans-serif" font-size="11" font-weight="bold" fill="#f87171">4. Règle RobStride : Arbre Plein Obligatoire</text>
    <text x="48" y="680" font-family="Arial, sans-serif" font-size="10.5" fill="#e2e8f0">• Aucun moteur RS-04 / RS-06 / RS-05 n'a d'arbre creux traversant.</text>
    <text x="48" y="700" font-family="Arial, sans-serif" font-size="10.5" fill="#e2e8f0">• Routage latéral/ventral systématique avec boucles de service.</text>

    <rect x="38" y="744" width="434" height="68" rx="6" fill="#1e293b" stroke="#34d399"/>
    <text x="255" y="774" font-family="Arial, sans-serif" font-size="11.5" font-weight="bold" fill="#34d399" text-anchor="middle">RÉSULTAT : RIGIDITÉ MÉTAL + LÉGÈRETÉ PA12-CF CALIBRÉ</text>
    <text x="255" y="796" font-family="Arial, sans-serif" font-size="10.5" fill="#cbd5e1" text-anchor="middle">Squelette Pont de Hanches (1 114,87 g) + Coque Bassin (441,36 g)</text>
  </g>

  <!-- PANEL 3 : BILAN & STANDARDISATION -->
  <g transform="translate(1090, 114)">
    <rect width="480" height="860" rx="12" fill="url(#panelGrad)" stroke="#334155" stroke-width="1.5" filter="url(#cardShadow)"/>
    <text x="22" y="32" font-family="Arial, sans-serif" font-size="14.5" font-weight="bold" fill="#34d399">3. BILAN MASSE V42 &amp; STANDARDISATION</text>

    <rect x="22" y="56" width="436" height="250" rx="10" fill="#0f172a" stroke="#34d399" stroke-width="1.2"/>
    <text x="38" y="84" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#34d399">COMPARAISON MASSE BASSIN (TORSE-123 V42)</text>
    <text x="38" y="114" font-family="Arial, sans-serif" font-size="11" fill="#e2e8f0">• Coque Bassin PA12-CF (0,700) : 441,36 g (-3,35 kg vs bloc Alu)</text>
    <text x="38" y="138" font-family="Arial, sans-serif" font-size="11" fill="#e2e8f0">• Pont de Hanches complet (visserie incl.) : 1 114,87 g</text>
    <text x="38" y="162" font-family="Arial, sans-serif" font-size="11" fill="#e2e8f0">• Interface Waist (Traverse+Waist+Moyeu+Brides+Equ.) : 1 264,91 g</text>
    <text x="38" y="186" font-family="Arial, sans-serif" font-size="11" fill="#e2e8f0">• RB8016 (633,41 g) + RS-06 (550,97 g) : 1 184,38 g</text>
    <text x="38" y="210" font-family="Arial, sans-serif" font-size="11" fill="#f59e0b">• 8× ASV1_200 Hanches (brut WIP) : 1 349,19 g (~745 g calibrés)</text>
    <text x="38" y="246" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#ffffff">• TORSE-123 V42 : 18,32 kg brut ➔ ~16,1–16,2 kg calibré</text>
    <text x="38" y="272" font-family="Arial, sans-serif" font-size="11" fill="#34d399">• Robot complet Phase 4 estimé : ~35,2–36,0 kg (&lt; 42,0 kg cible)</text>

    <rect x="22" y="324" width="436" height="512" rx="10" fill="#0f172a" stroke="#38bdf8" stroke-width="1.2"/>
    <text x="38" y="352" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#38bdf8">AVANTAGES MAJEURS D'ATELIER (CNC C500)</text>
    <text x="38" y="382" font-family="Arial, sans-serif" font-size="11.5" font-weight="bold" fill="#fbbf24">1. Standardisation des 4 Brides Epaule v87</text>
    <text x="48" y="404" font-family="Arial, sans-serif" font-size="10.5" fill="#e2e8f0">• 2× Épaules + 2× Hanches strictement identiques (202,30 g/u).</text>
    <text x="48" y="424" font-family="Arial, sans-serif" font-size="10.5" fill="#e2e8f0">• Un seul programme G-Code C500 pour les 4 pièces (zero réglage).</text>

    <text x="38" y="458" font-family="Arial, sans-serif" font-size="11.5" font-weight="bold" fill="#fbbf24">2. Quincaillerie McMaster Unifiée &amp; Vérifiée</text>
    <text x="48" y="480" font-family="Arial, sans-serif" font-size="10.5" fill="#e2e8f0">• Hanches : [90128A214] (M4×16) + [92855A422] (M4×25 Tête Basse)</text>
    <text x="48" y="500" font-family="Arial, sans-serif" font-size="10.5" fill="#e2e8f0">  + rondelles Nord-Lock M4 [91812A252] (respecter prise &lt;= 6,0 mm).</text>
    <text x="48" y="520" font-family="Arial, sans-serif" font-size="10.5" fill="#e2e8f0">• Pont de Hanches : [91290A276] (M5×80) + [91290A661] (M5×35)</text>
    <text x="48" y="540" font-family="Arial, sans-serif" font-size="10.5" fill="#e2e8f0">  + [92290A242] (M5×20) + [92125A213] (FHC M5×18) + [91292A122].</text>

    <text x="38" y="574" font-family="Arial, sans-serif" font-size="11.5" font-weight="bold" fill="#fbbf24">3. Géométrie angulaire sans cale</text>
    <text x="48" y="596" font-family="Arial, sans-serif" font-size="10.5" fill="#e2e8f0">• Aux hanches (0 deg horizontal) : bridage direct des 2 brides sur</text>
    <text x="48" y="616" font-family="Arial, sans-serif" font-size="10.5" fill="#e2e8f0">  le Tube 60×60 L = 46,33 mm (aux épaules : Insert 15 deg).</text>

    <text x="38" y="652" font-family="Arial, sans-serif" font-size="11.5" font-weight="bold" fill="#f87171">4. Pré-requis avant usinage CNC C500</text>
    <text x="48" y="674" font-family="Arial, sans-serif" font-size="10.5" fill="#fecaca">• Modéliser butée mécanique ±95° (R = 83,0 mm) sur Waist / Traverse.</text>
    <text x="48" y="694" font-family="Arial, sans-serif" font-size="10.5" fill="#fecaca">• Compléter les 7× vis stator RS-06 [92855A313] (1/8 en v42).</text>
    <text x="48" y="714" font-family="Arial, sans-serif" font-size="10.5" fill="#fde68a">• Valider la géométrie finale des 8 habillages ASV1_200 hanches.</text>

    <rect x="38" y="748" width="404" height="64" rx="6" fill="#064e3b" stroke="#10b981"/>
    <text x="240" y="776" font-family="Arial, sans-serif" font-size="11.5" font-weight="bold" fill="#d1fae5" text-anchor="middle">SYNTHÈSE V42 : CALIBRATION BASSIN OK (-3,35 KG)</text>
    <text x="240" y="796" font-family="Arial, sans-serif" font-size="10.5" fill="#a7f3d0" text-anchor="middle">Pont de Hanches validé RDM — Sf &gt; 5,9 sur Brides &amp; Sf &gt; 14 Bassin</text>
  </g>
</svg>