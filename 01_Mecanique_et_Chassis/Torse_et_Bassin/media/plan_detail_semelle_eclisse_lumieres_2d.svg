<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 960" width="100%" height="100%">
  <defs>
    <pattern id="gridSem" width="20" height="20" patternUnits="userSpaceOnUse">
      <path d="M 20 0 L 0 0 0 20" fill="none" stroke="#1e293b" stroke-width="0.7"/>
    </pattern>
    <linearGradient id="aluSem" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0284c7" stop-opacity="0.32"/>
      <stop offset="100%" stop-color="#0369a1" stop-opacity="0.22"/>
    </linearGradient>
    <filter id="shdSem" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="4" stdDeviation="5" flood-color="#000" flood-opacity="0.5"/>
    </filter>
    <marker id="arS" markerWidth="7" markerHeight="7" refX="3.5" refY="3.5" orient="auto">
      <path d="M1,1 L6,3.5 L1,6 Z" fill="#38bdf8"/>
    </marker>
    <marker id="arSrev" markerWidth="7" markerHeight="7" refX="3.5" refY="3.5" orient="auto-start-reverse">
      <path d="M1,1 L6,3.5 L1,6 Z" fill="#38bdf8"/>
    </marker>
    <marker id="arY2" markerWidth="7" markerHeight="7" refX="3.5" refY="3.5" orient="auto">
      <path d="M1,1 L6,3.5 L1,6 Z" fill="#facc15"/>
    </marker>
    <marker id="arY2rev" markerWidth="7" markerHeight="7" refX="3.5" refY="3.5" orient="auto-start-reverse">
      <path d="M1,1 L6,3.5 L1,6 Z" fill="#facc15"/>
    </marker>
  </defs>

  <rect width="1440" height="960" fill="#0f172a"/>
  <rect width="1440" height="960" fill="url(#gridSem)"/>

  <!-- Header -->
  <g transform="translate(24, 18)">
    <rect width="1392" height="66" rx="8" fill="#1e293b" stroke="#38bdf8" stroke-width="1.5" filter="url(#shdSem)"/>
    <text x="24" y="30" font-family="system-ui, sans-serif" font-size="18.5" font-weight="bold" fill="#f8fafc">
      SEMELLE ÉCLISSE 7075-T6 (100,02 × 130,02 × 5,02 mm — 158,32 g) : PLAN 2D CONFORME FUSION 360
    </text>
    <text x="24" y="51" font-family="system-ui, sans-serif" font-size="12" fill="#94a3b8">
      Calibration 1:1 sur Snapshot semelle_éclisse_face.png (Torse-123 v42) · 2 Échancrures gauches R=12 mm · 2 Lumières 22×14 mm · 4× M5 · 4× Ø3 H7 · 4× FHC M4 (15°)
    </text>
    <rect x="1210" y="17" width="160" height="32" rx="6" fill="#0284c7" fill-opacity="0.2" stroke="#38bdf8"/>
    <text x="1290" y="37" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11.5" font-weight="bold" fill="#38bdf8">PLAN CNC v42</text>
  </g>

  <!-- PANEL 1 : PLAN 2D COTÉ CONFORME SNAPSHOT -->
  <g transform="translate(24, 100)">
    <rect width="676" height="836" rx="10" fill="#1e293b" stroke="#38bdf8" stroke-width="1.5" filter="url(#shdSem)"/>
    <rect width="676" height="38" rx="10" fill="#0284c7" fill-opacity="0.2"/>
    <text x="338" y="24" text-anchor="middle" font-family="system-ui, sans-serif" font-size="13" font-weight="bold" fill="#38bdf8">
      1. PLAN 2D COTÉ (FACE +Y CONFORME À semelle_éclisse_face.png)
    </text>

    <!-- Centre plan = (300, 380) | Échelle : 1 mm = 3.8 px -> 100 mm = 380 px (±190 px), 130 mm = 494 px (±247 px) -->
    <g transform="translate(278, 375)">
      <!-- Axes -->
      <line x1="-225" y1="0" x2="235" y2="0" stroke="#475569" stroke-dasharray="6,4"/>
      <line x1="0" y1="-275" x2="0" y2="275" stroke="#475569" stroke-dasharray="6,4"/>
      <text x="235" y="-6" text-anchor="end" font-family="system-ui, sans-serif" font-size="9.5" fill="#94a3b8">Axe X (+Avant)</text>
      <text x="8" y="-262" font-family="system-ui, sans-serif" font-size="9.5" fill="#94a3b8">Axe Z (+Haut)</text>

      <!-- Contour exact semelle éclisse :
           X in [-190, +190] (100 mm), Z in [-247, +247] (130 mm)
           4 chanfreins d'angles 6 mm = 22.8 px
           Sur flanc gauche (x = -190) : 2 arcs concaves R=12 mm (45.6 px) centrés à z = -20 mm (+76 px) et +20 mm (-76 px)!
           (Note : z CAO +20 -> SVG -76 ; z CAO -20 -> SVG +76)
      -->
      <path d="
        M -167.2,-247
        L 167.2,-247
        L 190,-224.2
        L 190,224.2
        L 167.2,247
        L -167.2,247
        L -190,224.2
        L -190,121.6
        A 45.6 45.6 0 0 0 -190,30.4
        L -190,-30.4
        A 45.6 45.6 0 0 0 -190,-121.6
        L -190,-224.2
        Z
      " fill="url(#aluSem)" stroke="#38bdf8" stroke-width="2.4"/>

      <!-- Fantôme Insert (carré 55,8×55,8 incliné 15°, centre X=+8.25 mm = +31.35 px) -->
      <g transform="translate(31.4, 0) rotate(-15)">
        <rect x="-106" y="-106" width="212" height="212" rx="14" fill="none" stroke="#4ade80" stroke-width="1.3" stroke-dasharray="5,4"/>
        <circle cx="0" cy="0" r="66.5" fill="#0f172a" fill-opacity="0.35" stroke="#4ade80" stroke-width="1.2" stroke-dasharray="4,3"/>
        <rect x="-88" y="-16" width="176" height="32" rx="4" fill="#0f172a" fill-opacity="0.88" stroke="#4ade80" stroke-width="0.8"/>
        <text x="0" y="-3" text-anchor="middle" font-family="system-ui, sans-serif" font-size="9" font-weight="bold" fill="#4ade80">
          Insert Ø 35 mm (fantôme)
        </text>
        <text x="0" y="10" text-anchor="middle" font-family="system-ui, sans-serif" font-size="8" fill="#86efac">
          Semelle PLEINE dessous
        </text>
      </g>

      <!-- 2 Lumières horizontales 22×14 mm (R=4 -> 83.6 x 53.2 px, rx=15.2) centrées à X_rel = -3 mm (-11.4 px), Z_rel = ±45 mm (±171 px) -->
      <rect x="-53.2" y="-197.6" width="83.6" height="53.2" rx="15.2" fill="#0f172a" stroke="#38bdf8" stroke-width="2"/>
      <text x="-11.4" y="-168" text-anchor="middle" font-family="system-ui, sans-serif" font-size="9" font-weight="bold" fill="#38bdf8">22 × 14 mm</text>
      <rect x="-53.2" y="144.4" width="83.6" height="53.2" rx="15.2" fill="#0f172a" stroke="#38bdf8" stroke-width="2"/>
      <text x="-11.4" y="174" text-anchor="middle" font-family="system-ui, sans-serif" font-size="9" font-weight="bold" fill="#38bdf8">22 × 14 mm</text>

      <!-- 4 trous M5 sandwich (Ø 5.3 -> r=10.1 px) à X_rel = -28 mm (-106.4 px) & +22 mm (+83.6 px), Z_rel = ±45 mm (±171 px) -->
      <circle cx="-106.4" cy="-171" r="10.1" fill="#0f172a" stroke="#ffffff" stroke-width="2"/>
      <circle cx="83.6" cy="-171" r="10.1" fill="#0f172a" stroke="#ffffff" stroke-width="2"/>
      <circle cx="-106.4" cy="171" r="10.1" fill="#0f172a" stroke="#ffffff" stroke-width="2"/>
      <circle cx="83.6" cy="171" r="10.1" fill="#0f172a" stroke="#ffffff" stroke-width="2"/>

      <!-- 4 trous goupilles Ø 3.0 mm H7 (carré 80x80 -> ±40 mm = ±152 px) -->
      <circle cx="-152" cy="-152" r="5.7" fill="#10b981" stroke="#ffffff" stroke-width="1.5"/>
      <circle cx="152" cy="-152" r="5.7" fill="#10b981" stroke="#ffffff" stroke-width="1.5"/>
      <circle cx="-152" cy="152" r="5.7" fill="#10b981" stroke="#ffffff" stroke-width="1.5"/>
      <circle cx="152" cy="152" r="5.7" fill="#10b981" stroke="#ffffff" stroke-width="1.5"/>

      <!-- 4 trous fraisés FHC M4 (Ø 4.5 + Ø 8.4) aux coords CAO exactes relatives au centre (71.81, 1340.35) * 3.8 px :
           #1 (54.22, 1325.43) -> rel (-17.59, -14.92) -> (-66.8, +56.7)
           #2 (65.14, 1366.19) -> rel (-6.67, +25.84) -> (-25.3, -98.2)
           #3 (105.90, 1355.27) -> rel (+34.09, +14.92) -> (+129.5, -56.7)
           #4 (94.98, 1314.51) -> rel (+23.17, -25.84) -> (+88.0, +98.2)
      -->
      <g>
        <circle cx="-66.8" cy="56.7" r="15" fill="none" stroke="#facc15" stroke-width="1.4" stroke-dasharray="3,2"/>
        <circle cx="-66.8" cy="56.7" r="8.5" fill="#0f172a" stroke="#facc15" stroke-width="2"/>
        <circle cx="-25.3" cy="-98.2" r="15" fill="none" stroke="#facc15" stroke-width="1.4" stroke-dasharray="3,2"/>
        <circle cx="-25.3" cy="-98.2" r="8.5" fill="#0f172a" stroke="#facc15" stroke-width="2"/>
        <circle cx="129.5" cy="-56.7" r="15" fill="none" stroke="#facc15" stroke-width="1.4" stroke-dasharray="3,2"/>
        <circle cx="129.5" cy="-56.7" r="8.5" fill="#0f172a" stroke="#facc15" stroke-width="2"/>
        <circle cx="88.0" cy="98.2" r="15" fill="none" stroke="#facc15" stroke-width="1.4" stroke-dasharray="3,2"/>
        <circle cx="88.0" cy="98.2" r="8.5" fill="#0f172a" stroke="#facc15" stroke-width="2"/>
      </g>

      <!-- Callouts hors contour sans aucun chevauchement -->
      <!-- Gauche : 2 échancrures R=12 + goupille -->
      <line x1="-144.4" y1="-76" x2="-205" y2="-76" stroke="#f472b6" stroke-width="1.3"/>
      <text x="-204" y="-82" text-anchor="end" font-family="system-ui, sans-serif" font-size="9.5" font-weight="bold" fill="#f472b6">2× Arcs R=12</text>
      <text x="-204" y="-68" text-anchor="end" font-family="system-ui, sans-serif" font-size="8.5" fill="#fbcfe8">Flanc X = -50</text>
      <text x="-204" y="-56" text-anchor="end" font-family="system-ui, sans-serif" font-size="8.5" fill="#fbcfe8">(Z = ±20 mm)</text>

      <line x1="-152" y1="-152" x2="-205" y2="-165" stroke="#10b981" stroke-width="1.2"/>
      <text x="-204" y="-170" text-anchor="end" font-family="system-ui, sans-serif" font-size="9" font-weight="bold" fill="#34d399">4× Ø 3,0 H7</text>
      <text x="-204" y="-158" text-anchor="end" font-family="system-ui, sans-serif" font-size="8.5" fill="#a7f3d0">Carré 80×80</text>

      <!-- Droite : FHC M4 + M5 -->
      <line x1="138" y1="-56.7" x2="242" y2="-70" stroke="#facc15" stroke-width="1.2"/>
      <text x="246" y="-76" font-family="system-ui, sans-serif" font-size="9.5" font-weight="bold" fill="#facc15">4× FHC M4×30</text>
      <text x="246" y="-63" font-family="system-ui, sans-serif" font-size="8.5" fill="#fef08a">Ø4,5 + Fr. Ø8,4×90°</text>
      <text x="246" y="-50" font-family="system-ui, sans-serif" font-size="8.5" fill="#4ade80">(Insert incliné 15°)</text>

      <line x1="93" y1="-171" x2="242" y2="-185" stroke="#ffffff" stroke-width="1.2"/>
      <text x="246" y="-190" font-family="system-ui, sans-serif" font-size="9.5" font-weight="bold" fill="#ffffff">4× Ø 5,30 mm</text>
      <text x="246" y="-177" font-family="system-ui, sans-serif" font-size="8.5" fill="#cbd5e1">CHC M5×70 (50×90)</text>

      <!-- Cote largeur 100,02 mm (bas) -->
      <line x1="-190" y1="278" x2="190" y2="278" stroke="#38bdf8" stroke-width="1.5" marker-start="url(#arSrev)" marker-end="url(#arS)"/>
      <text x="0" y="296" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11" font-weight="bold" fill="#38bdf8">
        Largeur X = 100,02 mm (4 chanfreins 45°)
      </text>

      <!-- Cote hauteur 130,02 mm (droite lointaine) -->
      <line x1="205" y1="-247" x2="205" y2="247" stroke="#facc15" stroke-width="1.4" marker-start="url(#arY2rev)" marker-end="url(#arY2)"/>
      <text x="219" y="4" font-family="system-ui, sans-serif" font-size="10.5" font-weight="bold" fill="#facc15" transform="rotate(90,219,4)">
        Hauteur Z = 130,02 mm (v42 : 158,32 g)
      </text>
    </g>

    <!-- Note légende bas Panel 1 -->
    <rect x="20" y="726" width="636" height="92" rx="6" fill="#0f172a" stroke="#334155"/>
    <text x="34" y="748" font-family="system-ui, sans-serif" font-size="10.5" font-weight="bold" fill="#4ade80">
      RÈGLES CAO VÉRIFIÉES SUR Torse-123 v42 :
    </text>
    <text x="34" y="766" font-family="system-ui, sans-serif" font-size="9.5" fill="#cbd5e1">
      <tspan x="34" dy="0">• Deux encoches semi-circulaires R = 12,0 mm sur le flanc gauche (Z = ±20 mm), préservant un talon central.</tspan>
      <tspan x="34" dy="16">• Entraxes sandwich : 4× Ø 5,3 mm en 50×90 mm + 4× goupilles Ø 3,0 mm H7 [91585A374] en carré 80×80 mm.</tspan>
      <tspan x="34" dy="16">• Masse auditée : <tspan font-weight="bold" fill="#facc15">158,32 g / pièce (316,64 g la paire)</tspan> · Matériau : Alu 7075-T651 ép. 5,02 mm.</tspan>
    </text>
  </g>

  <!-- PANEL 2 : COUPE FRAISURE FHC M4 & RDM -->
  <g transform="translate(720, 100)">
    <rect width="696" height="270" rx="10" fill="#1e293b" stroke="#facc15" stroke-width="1.5" filter="url(#shdSem)"/>
    <rect width="696" height="36" rx="10" fill="#ca8a04" fill-opacity="0.2"/>
    <text x="348" y="23" text-anchor="middle" font-family="system-ui, sans-serif" font-size="12.5" font-weight="bold" fill="#facc15">
      2. COUPE FRAISURE FHC M4 À FLEUR (0,0 mm) &amp; DÉCOMPOSITION RDM (120 N.m)
    </text>

    <!-- Mini coupe -->
    <g transform="translate(24, 56)">
      <rect width="265" height="196" rx="6" fill="#0f172a" stroke="#334155"/>
      <text x="132" y="22" text-anchor="middle" font-family="system-ui, sans-serif" font-size="10" font-weight="bold" fill="#38bdf8">COUPE FHC M4×30 [92125A220]</text>
      <polygon points="82,70 112,70 112,92 102,92 82,70" fill="#0284c7" stroke="#38bdf8"/>
      <polygon points="182,70 152,70 152,92 162,92 182,70" fill="#0284c7" stroke="#38bdf8"/>
      <rect x="82" y="92" width="30" height="38" fill="#0284c7" stroke="#38bdf8"/>
      <rect x="152" y="92" width="30" height="38" fill="#0284c7" stroke="#38bdf8"/>
      <polygon points="108,70 156,70 139,92 125,92" fill="#facc15"/>
      <rect x="125" y="92" width="14" height="52" fill="#facc15"/>
      <text x="132" y="56" text-anchor="middle" font-family="system-ui, sans-serif" font-size="9" fill="#facc15">Ø 8,40 mm × 90° (à fleur 0,0 mm)</text>
      <text x="132" y="168" text-anchor="middle" font-family="system-ui, sans-serif" font-size="9.5" font-weight="bold" fill="#4ade80">✔ Zéro saillie contre la colonne</text>
      <text x="132" y="184" text-anchor="middle" font-family="system-ui, sans-serif" font-size="8.5" fill="#94a3b8">Perçage Ø 4,50 mm · Ép. 5,02 mm</text>
    </g>

    <!-- Bloc RDM -->
    <g transform="translate(306, 56)">
      <rect width="370" height="196" rx="6" fill="#0f172a" stroke="#334155"/>
      <text x="16" y="24" font-family="system-ui, sans-serif" font-size="11" font-weight="bold" fill="#4ade80">DÉCOMPOSITION COUPLE (120 N.m @ 15°)</text>
      <text x="16" y="48" font-family="system-ui, sans-serif" font-size="9.5" fill="#cbd5e1">
        <tspan x="16" dy="0">• <tspan font-weight="bold" fill="#fff">Roll (Sagittal)</tspan> : 120 × cos(15°) = <tspan fill="#38bdf8" font-weight="bold">115,9 N.m</tspan></tspan>
        <tspan x="24" dy="16">Repris par appui plan insert 55,8 × 55,8 mm + FHC M4.</tspan>
        <tspan x="16" dy="22">• <tspan font-weight="bold" fill="#fff">Yaw (Transversal)</tspan> : 120 × sin(15°) = <tspan fill="#38bdf8" font-weight="bold">31,1 N.m</tspan></tspan>
        <tspan x="24" dy="16">Repris par 4× CHC M5×70 + goupilles Ø 3 (Sf &gt; 6).</tspan>
        <tspan x="16" dy="22">• <tspan font-weight="bold" fill="#fff">Flexion Pitch Chute (275 N.m)</tspan> : Delta Z = 90 mm</tspan>
        <tspan x="24" dy="16">Traction 3 055 N / vis M5 ➔ <tspan fill="#4ade80" font-weight="bold">Sf = ×6,28 ✔</tspan></tspan>
      </text>
    </g>
  </g>

  <!-- PANEL 3 : TABLEAU COORDONNÉES & PANEL 4 : ÉBAVURAGE -->
  <g transform="translate(720, 386)">
    <rect width="696" height="550" rx="10" fill="#1e293b" stroke="#4ade80" stroke-width="1.5" filter="url(#shdSem)"/>
    <rect width="696" height="36" rx="10" fill="#16a34a" fill-opacity="0.2"/>
    <text x="348" y="23" text-anchor="middle" font-family="system-ui, sans-serif" font-size="12.5" font-weight="bold" fill="#4ade80">
      3. TABLEAU MÉTROLOGIQUE v42 (X, Z) &amp; PROTOCOLE D'ÉBAVURAGE C500
    </text>

    <!-- Tableau -->
    <g transform="translate(20, 52)">
      <rect width="656" height="24" rx="4" fill="#0f172a"/>
      <text x="14" y="16" font-family="system-ui, sans-serif" font-size="9.5" font-weight="bold" fill="#38bdf8">Entité / Perçage</text>
      <text x="235" y="16" font-family="system-ui, sans-serif" font-size="9.5" font-weight="bold" fill="#38bdf8">Coords Relatives (ΔX ; ΔZ)</text>
      <text x="455" y="16" font-family="system-ui, sans-serif" font-size="9.5" font-weight="bold" fill="#38bdf8">Spécification Usinage</text>

      <rect y="28" width="656" height="24" fill="#0f172a" fill-opacity="0.5"/>
      <text x="14" y="44" font-family="system-ui, sans-serif" font-size="9.3" fill="#fff">4× Vis Sandwich CHC M5×70</text>
      <text x="235" y="44" font-family="system-ui, sans-serif" font-size="9.3" fill="#cbd5e1">-28,0 / +22,0 ; ±45,0 mm</text>
      <text x="455" y="44" font-family="system-ui, sans-serif" font-size="9.3" fill="#4ade80">Ø 5,30 mm (91290A272)</text>

      <rect y="56" width="656" height="24" fill="#0f172a" fill-opacity="0.25"/>
      <text x="14" y="72" font-family="system-ui, sans-serif" font-size="9.3" fill="#fff">4× Goupilles Alignement Ø 3</text>
      <text x="235" y="72" font-family="system-ui, sans-serif" font-size="9.3" fill="#cbd5e1">±40,0 ; ±40,0 mm (Carré 80)</text>
      <text x="455" y="72" font-family="system-ui, sans-serif" font-size="9.3" fill="#4ade80">Ø 3,00 H7 (91585A374)</text>

      <rect y="84" width="656" height="24" fill="#0f172a" fill-opacity="0.5"/>
      <text x="14" y="100" font-family="system-ui, sans-serif" font-size="9.3" fill="#facc15">4× Vis FHC M4×30 (Insert 15°)</text>
      <text x="235" y="100" font-family="system-ui, sans-serif" font-size="9.3" fill="#cbd5e1">Centre (+8,25 ; 0), carré 42,2 @ 15°</text>
      <text x="455" y="100" font-family="system-ui, sans-serif" font-size="9.3" fill="#facc15">Ø 4,5 + Fr. Ø 8,4 (92125A220)</text>

      <rect y="112" width="656" height="24" fill="#0f172a" fill-opacity="0.25"/>
      <text x="14" y="128" font-family="system-ui, sans-serif" font-size="9.3" fill="#38bdf8">2× Lumières Horizontales</text>
      <text x="235" y="128" font-family="system-ui, sans-serif" font-size="9.3" fill="#cbd5e1">-3,0 ; ±45,0 mm (22 × 14 mm)</text>
      <text x="455" y="128" font-family="system-ui, sans-serif" font-size="9.3" fill="#38bdf8">Congés R = 4,0 mm</text>

      <rect y="140" width="656" height="24" fill="#0f172a" fill-opacity="0.5"/>
      <text x="14" y="156" font-family="system-ui, sans-serif" font-size="9.3" fill="#f472b6">2× Échancrures Gauches</text>
      <text x="235" y="156" font-family="system-ui, sans-serif" font-size="9.3" fill="#cbd5e1">-50,0 ; ±20,0 mm (flanc -X)</text>
      <text x="455" y="156" font-family="system-ui, sans-serif" font-size="9.3" fill="#f472b6">R = 12,0 mm (talon central)</text>
    </g>

    <!-- Protocole C500 & Ébavurage -->
    <rect x="20" y="236" width="656" height="294" rx="8" fill="#0f172a" stroke="#334155"/>
    <text x="36" y="262" font-family="system-ui, sans-serif" font-size="11.5" font-weight="bold" fill="#38bdf8">
      4. GAMME D'USINAGE NESTWORKS C500 &amp; ÉBAVURAGE 2 FACES
    </text>
    <text x="36" y="286" font-family="system-ui, sans-serif" font-size="10" fill="#cbd5e1">
      <tspan x="36" dy="0" font-weight="bold" fill="#fff">1. Trous M5 &amp; Goupilles H7 :</tspan>
      <tspan x="44" dy="18">• Avant-trou + Alésoir Ø 3,00 H7 (4×) · Perçages lisses Ø 5,30 mm (4×).</tspan>
      <tspan x="44" dy="18">• Chanfrein 0,5 × 45° sur les 2 faces pour appui plan sans bavure contre colonne.</tspan>
      <tspan x="36" dy="24" font-weight="bold" fill="#facc15">2. Trous Fraisés FHC M4 (Ø 4,50 mm + 90°) :</tspan>
      <tspan x="44" dy="18">• Fraisure 90° à Ø 8,40 mm côté colonne (0,0 mm affleurant obligatoire).</tspan>
      <tspan x="44" dy="18">• Ébavurage 0,3 × 45° côté Insert (appui mécanique 55,8 × 55,8 mm).</tspan>
      <tspan x="36" dy="24" font-weight="bold" fill="#4ade80">3. Lumières 22 × 14 mm &amp; Contour Extérieur :</tspan>
      <tspan x="44" dy="18">• Fraise carbure Ø 6 mm DLC · Chanfrein d'ébavurage 0,5 × 45° sur les 2 faces.</tspan>
      <tspan x="36" dy="24" font-weight="bold" fill="#f472b6">4. Quincaillerie Paire d'Épaules v42 :</tspan>
