<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 980" width="1440" height="980">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090d16"/>
      <stop offset="55%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#0b1120"/>
    </linearGradient>
    <linearGradient id="panelGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" stop-opacity="0.96"/>
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0.96"/>
    </linearGradient>
    <linearGradient id="aluOrange" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#c2410c"/>
      <stop offset="50%" stop-color="#ea580c"/>
      <stop offset="100%" stop-color="#f97316"/>
    </linearGradient>
    <linearGradient id="aluAmber" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#b45309"/>
      <stop offset="50%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#d97706"/>
    </linearGradient>
    <linearGradient id="aluBlue" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#1e3a8a"/>
      <stop offset="50%" stop-color="#2563eb"/>
      <stop offset="100%" stop-color="#1d4ed8"/>
    </linearGradient>
    <linearGradient id="steelGreen" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#15803d"/>
      <stop offset="50%" stop-color="#22c55e"/>
      <stop offset="100%" stop-color="#16a34a"/>
    </linearGradient>
    <linearGradient id="paViolet" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#5b21b6"/>
      <stop offset="50%" stop-color="#7c3aed"/>
      <stop offset="100%" stop-color="#6d28d9"/>
    </linearGradient>
    <linearGradient id="motorSlate" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#334155"/>
      <stop offset="50%" stop-color="#475569"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
    <pattern id="gridPat" width="30" height="30" patternUnits="userSpaceOnUse">
      <path d="M 30 0 L 0 0 0 30" fill="none" stroke="#334155" stroke-width="0.55" stroke-opacity="0.28"/>
    </pattern>
    <pattern id="hatchWaste" width="10" height="10" patternTransform="rotate(45 0 0)" patternUnits="userSpaceOnUse">
      <line x1="0" y1="0" x2="0" y2="10" stroke="#ef4444" stroke-width="1.6" stroke-opacity="0.55"/>
    </pattern>
    <marker id="arrCyan" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <polygon points="0 1, 8 4, 0 7" fill="#38bdf8"/>
    </marker>
    <marker id="arrRed" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <polygon points="0 1, 8 4, 0 7" fill="#ef4444"/>
    </marker>
    <marker id="arrAmber" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <polygon points="0 1, 8 4, 0 7" fill="#f59e0b"/>
    </marker>
    <marker id="arrGreen" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <polygon points="0 1, 8 4, 0 7" fill="#10b981"/>
    </marker>
    <filter id="cardShadow" x="-8%" y="-8%" width="116%" height="116%">
      <feDropShadow dx="0" dy="5" stdDeviation="6" flood-color="#000000" flood-opacity="0.55"/>
    </filter>
  </defs>
  <rect width="1440" height="980" fill="url(#bgGrad)"/>
  <rect width="1440" height="980" fill="url(#gridPat)"/>
  <g transform="translate(30, 22)">
    <rect width="1380" height="74" rx="12" fill="#1e293b" stroke="#3b82f6" stroke-width="1.5" filter="url(#cardShadow)"/>
    <circle cx="42" cy="37" r="20" fill="#38bdf8" fill-opacity="0.18" stroke="#38bdf8" stroke-width="2"/>
    <text x="42" y="44" font-family="Arial, sans-serif" font-size="19" font-weight="bold" fill="#38bdf8" text-anchor="middle">+</text>
    <text x="76" y="31" font-family="Arial, sans-serif" font-size="18" font-weight="bold" fill="#f8fafc">STRATÉGIES FABRICATION CNC C500 : MONOBLOC vs ASSEMBLAGE 2D vs TUBE 60×60</text>
    <text x="76" y="54" font-family="Arial, sans-serif" font-size="12" fill="#94a3b8">Comparatif procédés d&#x27;atelier, taux de copeaux, coûts matière et rigidité torsionnelle (120 N.m crête RS-04)</text>
    <rect x="1046" y="19" width="310" height="36" rx="8" fill="#0f172a" stroke="#10b981" stroke-width="1.3"/>
    <text x="1201" y="42" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#10b981" text-anchor="middle">OPTION C VALIDÉE (Torse-123 v42)</text>
  </g>

  <!-- OPTION A -->
  <g transform="translate(30, 114)">
    <rect width="440" height="536" rx="12" fill="url(#panelGrad)" stroke="#ef4444" stroke-width="1.3" filter="url(#cardShadow)"/>
    <rect x="16" y="16" width="408" height="32" rx="6" fill="#0f172a" stroke="#ef4444" stroke-width="1"/>
    <text x="220" y="37" font-family="Arial, sans-serif" font-size="13.5" font-weight="bold" fill="#fca5a5" text-anchor="middle">OPTION A : USINAGE DANS LA MASSE</text>

    <!-- Drawing Zone y=62..265 -->
    <rect x="24" y="62" width="392" height="206" rx="8" fill="#090e1a" stroke="#334155"/>
    <text x="220" y="84" font-family="Arial, sans-serif" font-size="11.5" font-weight="bold" fill="#e2e8f0" text-anchor="middle">BRUT 50 × 130 × 140 mm (Alu 7075-T6) | ~2,45 kg / côté</text>
    <rect x="64" y="98" width="312" height="122" rx="4" fill="url(#hatchWaste)" stroke="#ef4444" stroke-width="1.6" stroke-dasharray="5,3"/>
    <path d="M 64 114 L 114 114 L 114 146 L 326 146 L 326 114 L 376 114 L 376 204 L 326 204 L 326 172 L 114 172 L 114 204 L 64 204 Z" fill="url(#aluBlue)" stroke="#38bdf8" stroke-width="1.8"/>
    <rect x="136" y="148" width="168" height="22" rx="3" fill="#090e1a" stroke="#ef4444" stroke-width="1"/>
    <text x="220" y="163" font-family="Arial, sans-serif" font-size="11" font-weight="bold" fill="#fca5a5" text-anchor="middle">88 % DE COPEAUX PERDUS</text>
    <text x="220" y="248" font-family="Arial, sans-serif" font-size="10.5" fill="#94a3b8" text-anchor="middle">Surfaçage bilatéral + poches profondes Z hors limite C500</text>

    <!-- Bullets y=282..520 -->
    <rect x="24" y="282" width="392" height="238" rx="8" fill="#0f172a" stroke="#334155"/>
    <text x="42" y="308" font-family="Arial, sans-serif" font-size="13" font-weight="bold" fill="#f8fafc">Bilan Économique &amp; Atelier :</text>
    <text x="42" y="336" font-family="Arial, sans-serif" font-size="12" fill="#cbd5e1">• Coût matière : ~45 à 60 EUR / brut épais 7075-T6</text>
    <text x="42" y="362" font-family="Arial, sans-serif" font-size="12" fill="#cbd5e1">• Taux de copeaux : 88 % (2,2 kg d'alu détruits)</text>
    <text x="42" y="388" font-family="Arial, sans-serif" font-size="12" fill="#cbd5e1">• Temps usinage C500 : ~1h45 par demi-traverse</text>
    <text x="42" y="414" font-family="Arial, sans-serif" font-size="12" fill="#cbd5e1">• Reprises / Étau : 2 retournements critiques (Flip Z)</text>
    <line x1="42" y1="436" x2="398" y2="436" stroke="#334155"/>
    <text x="42" y="466" font-family="Arial, sans-serif" font-size="12.5" font-weight="bold" fill="#ef4444">Verdict : Rigide mais lent, coûteux et fragile</text>
    <text x="42" y="488" font-family="Arial, sans-serif" font-size="11.5" fill="#94a3b8">au dégauchissage lors des retournements en étau.</text>
  </g>

  <!-- OPTION B -->
  <g transform="translate(500, 114)">
    <rect width="440" height="536" rx="12" fill="url(#panelGrad)" stroke="#f59e0b" stroke-width="1.3" filter="url(#cardShadow)"/>
    <rect x="16" y="16" width="408" height="32" rx="6" fill="#0f172a" stroke="#f59e0b" stroke-width="1"/>
    <text x="220" y="37" font-family="Arial, sans-serif" font-size="13.5" font-weight="bold" fill="#fde68a" text-anchor="middle">OPTION B : ASSEMBLAGE 2D EMBOÎTÉ</text>

    <rect x="24" y="62" width="392" height="206" rx="8" fill="#090e1a" stroke="#334155"/>
    <text x="220" y="84" font-family="Arial, sans-serif" font-size="11.5" font-weight="bold" fill="#e2e8f0" text-anchor="middle">TÔLE 5 mm DÉCOUPÉE 2D + TENONS / MORTAISES</text>
    <!-- Upper & Lower 5mm ribs -->
    <rect x="90" y="112" width="210" height="16" rx="2" fill="url(#aluBlue)" stroke="#38bdf8" stroke-width="1.5"/>
    <rect x="90" y="182" width="210" height="16" rx="2" fill="url(#aluBlue)" stroke="#38bdf8" stroke-width="1.5"/>
    <!-- Vertical ribs -->
    <rect x="125" y="128" width="14" height="54" fill="url(#aluAmber)" stroke="#fde68a" stroke-width="1.2"/>
    <rect x="245" y="128" width="14" height="54" fill="url(#aluAmber)" stroke="#fde68a" stroke-width="1.2"/>
    <!-- Right end plate 5mm -->
    <rect x="300" y="98" width="16" height="114" rx="2" fill="url(#aluOrange)" stroke="#fb923c" stroke-width="1.5"/>
    <text x="195" y="106" font-family="Arial, sans-serif" font-size="10.5" fill="#93c5fd" text-anchor="middle">Nervure Haute (tôle 5 mm)</text>
    <text x="195" y="216" font-family="Arial, sans-serif" font-size="10.5" fill="#93c5fd" text-anchor="middle">Nervure Basse (tôle 5 mm)</text>
    <text x="330" y="158" font-family="Arial, sans-serif" font-size="10.5" fill="#fdba74">Flasque 5 mm</text>
    <text x="220" y="248" font-family="Arial, sans-serif" font-size="10.5" fill="#94a3b8" text-anchor="middle">Tenons H7 + jeu d'assemblage sensible au matage sous choc</text>

    <rect x="24" y="282" width="392" height="238" rx="8" fill="#0f172a" stroke="#334155"/>
    <text x="42" y="308" font-family="Arial, sans-serif" font-size="13" font-weight="bold" fill="#f8fafc">Bilan Économique &amp; Atelier :</text>
    <text x="42" y="336" font-family="Arial, sans-serif" font-size="12" fill="#cbd5e1">• Coût matière : Chute de tôle 7075 ép. 5 mm</text>
    <text x="42" y="362" font-family="Arial, sans-serif" font-size="12" fill="#cbd5e1">• Taux de copeaux : &lt; 18 % (Découpe 2D simple)</text>
    <text x="42" y="388" font-family="Arial, sans-serif" font-size="12" fill="#cbd5e1">• Temps usinage C500 : ~18 min total (tôles)</text>
    <text x="42" y="414" font-family="Arial, sans-serif" font-size="12" fill="#cbd5e1">• Reprises : 0 Flip Z, mais 6 tenons à ajuster</text>
    <line x1="42" y1="436" x2="398" y2="436" stroke="#334155"/>
    <text x="42" y="466" font-family="Arial, sans-serif" font-size="12.5" font-weight="bold" fill="#f59e0b">Verdict : Économique mais caisson ouvert</text>
    <text x="42" y="488" font-family="Arial, sans-serif" font-size="11.5" fill="#94a3b8">Assemblage multi-pièces et micro-jeux sous 120 N.m.</text>
  </g>

  <!-- OPTION C RETENUE -->
  <g transform="translate(970, 114)">
    <rect width="440" height="536" rx="12" fill="url(#panelGrad)" stroke="#10b981" stroke-width="2" filter="url(#cardShadow)"/>
    <rect x="16" y="16" width="408" height="32" rx="6" fill="#064e3b" stroke="#10b981" stroke-width="1.2"/>
    <text x="220" y="37" font-family="Arial, sans-serif" font-size="13" font-weight="bold" fill="#a7f3d0" text-anchor="middle">OPTION C (RETENUE v42) : TUBE 60×60×2 + BRIDE v87</text>

    <rect x="24" y="62" width="392" height="206" rx="8" fill="#090e1a" stroke="#334155"/>
    <!-- Semelle + Insert + Tube 60x60 + Bride -->
    <rect x="52" y="106" width="12" height="106" rx="2" fill="url(#aluOrange)" stroke="#fb923c" stroke-width="1.4"/>
    <rect x="64" y="106" width="12" height="106" rx="2" fill="url(#aluOrange)" stroke="#fb923c" stroke-width="1.4"/>
    <rect x="76" y="128" width="26" height="62" rx="2" fill="url(#steelGreen)" stroke="#86efac" stroke-width="1.4"/>
    <rect x="102" y="124" width="144" height="70" rx="3" fill="url(#aluBlue)" stroke="#38bdf8" stroke-width="1.8"/>
    <rect x="226" y="128" width="20" height="62" rx="2" fill="url(#aluAmber)" stroke="#fde68a" stroke-width="1.4"/>
    <rect x="246" y="102" width="16" height="114" rx="3" fill="url(#aluAmber)" stroke="#fde68a" stroke-width="1.8"/>
    <!-- External Callouts with clear space -->
    <text x="58" y="92" font-family="Arial, sans-serif" font-size="9.5" fill="#fdba74" text-anchor="middle">Colonne + Semelle</text>
    <text x="174" y="155" font-family="Arial, sans-serif" font-size="11" font-weight="bold" fill="#f8fafc" text-anchor="middle">TUBE 60×60×2 (6060-T6)</text>
    <text x="174" y="172" font-family="Arial, sans-serif" font-size="10.5" fill="#bfdbfe" text-anchor="middle">L = 80,07 / 81,08 mm | 100,04 g</text>
    <line x1="254" y1="102" x2="290" y2="86" stroke="#facc15" stroke-width="1.2"/>
    <text x="295" y="90" font-family="Arial, sans-serif" font-size="10.5" font-weight="bold" fill="#fde68a">Bride v87 (202,30 g)</text>
    <line x1="254" y1="196" x2="290" y2="210" stroke="#93c5fd" stroke-width="1.2"/>
    <text x="295" y="214" font-family="Arial, sans-serif" font-size="10" fill="#93c5fd">Ø 97 H7 | PCD 106 mm</text>
    <text x="89" y="214" font-family="Arial, sans-serif" font-size="10" fill="#86efac" text-anchor="middle">Insert 85,71 g</text>
    <text x="220" y="250" font-family="Arial, sans-serif" font-size="10.5" fill="#34d399" text-anchor="middle">2× CHC M5×70 [91290A272] + 8× FHC M4×30 [92125A220]</text>

    <rect x="24" y="282" width="392" height="238" rx="8" fill="#0f172a" stroke="#10b981" stroke-width="1.1"/>
    <text x="42" y="308" font-family="Arial, sans-serif" font-size="13" font-weight="bold" fill="#f8fafc">Bilan Économique &amp; Atelier (v42) :</text>
    <text x="42" y="336" font-family="Arial, sans-serif" font-size="12" fill="#cbd5e1">• Coût tube : Barre 500 mm 6060-T6 = ~12,80 EUR</text>
    <text x="42" y="362" font-family="Arial, sans-serif" font-size="12" fill="#cbd5e1">• Taux de copeaux tube : &lt; 5 % (coupe + 2 perçages)</text>
    <text x="42" y="388" font-family="Arial, sans-serif" font-size="12" fill="#cbd5e1">• Bride Epaule v87 : 202,30 g | FEA 85 MPa (Sf = 5,92)</text>
    <text x="42" y="414" font-family="Arial, sans-serif" font-size="12" fill="#cbd5e1">• Section fermée : Sf_tube = 9,75 sous 120 N.m</text>
    <line x1="42" y1="436" x2="398" y2="436" stroke="#334155"/>
    <text x="42" y="466" font-family="Arial, sans-serif" font-size="12.5" font-weight="bold" fill="#34d399">Verdict : Optimum absolu coût / rigidité / masse</text>
    <text x="42" y="488" font-family="Arial, sans-serif" font-size="11.5" fill="#a7f3d0">1 seule gamme C500 identique pour 4 Brides (Épaules + Hanches).</text>
  </g>

  <!-- BOTTOM TABLE -->
  <g transform="translate(30, 668)">
    <rect width="1380" height="286" rx="12" fill="url(#panelGrad)" stroke="#3b82f6" stroke-width="1.3" filter="url(#cardShadow)"/>
    <text x="24" y="34" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#38bdf8">TABLEAU DE DÉCISION FABRICATION D-BOT V2 (TORSE-123 v42)</text>
    <line x1="24" y1="48" x2="1356" y2="48" stroke="#334155" stroke-width="1.2"/>

    <text x="28" y="76" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#94a3b8">CRITÈRE D'INGÉNIERIE</text>
    <text x="410" y="76" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#fca5a5">A. MONOBLOC MASSE</text>
    <text x="740" y="76" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#fde68a">B. ASSEMBLAGE 2D</text>
    <text x="1050" y="76" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#34d399">C. TUBE 60×60 + BRIDE v87 (RETENUE)</text>
    <line x1="24" y1="90" x2="1356" y2="90" stroke="#334155"/>

    <text x="28" y="122" font-family="Arial, sans-serif" font-size="12.5" fill="#f8fafc">Coût Appro Matière (Traverses)</text>
    <text x="410" y="122" font-family="Arial, sans-serif" font-size="12.5" fill="#cbd5e1">~100 EUR (2 gros bruts 50 mm)</text>
    <text x="740" y="122" font-family="Arial, sans-serif" font-size="12.5" fill="#cbd5e1">Chute tôle 5 mm (~15 EUR)</text>
    <text x="1050" y="122" font-family="Arial, sans-serif" font-size="12.5" font-weight="bold" fill="#34d399">12,80 EUR (barre 500 mm 6060-T6)</text>
    <line x1="24" y1="138" x2="1356" y2="138" stroke="#1e293b"/>

    <text x="28" y="168" font-family="Arial, sans-serif" font-size="12.5" fill="#f8fafc">Temps CNC C500 (Tubes seuls)</text>
    <text x="410" y="168" font-family="Arial, sans-serif" font-size="12.5" fill="#cbd5e1">~3h30 (2 faces + retournement)</text>
    <text x="740" y="168" font-family="Arial, sans-serif" font-size="12.5" fill="#cbd5e1">~18 min (découpe 2D)</text>
    <text x="1050" y="168" font-family="Arial, sans-serif" font-size="12.5" font-weight="bold" fill="#34d399">~5 min / tube (80,07 / 81,08 mm)</text>
    <line x1="24" y1="184" x2="1356" y2="184" stroke="#1e293b"/>

    <text x="28" y="214" font-family="Arial, sans-serif" font-size="12.5" fill="#f8fafc">Rigidité Torsion &amp; Tenue FEA (120 N.m)</text>
    <text x="410" y="214" font-family="Arial, sans-serif" font-size="12.5" fill="#cbd5e1">100 % Monolithique</text>
    <text x="740" y="214" font-family="Arial, sans-serif" font-size="12.5" fill="#cbd5e1">98 % (jeu tenons possible)</text>
    <text x="1050" y="214" font-family="Arial, sans-serif" font-size="12.5" font-weight="bold" fill="#34d399">Tube Sf = 9,75 | Bride v87 Sf = 5,92 (85 MPa)</text>
    <line x1="24" y1="230" x2="1356" y2="230" stroke="#1e293b"/>

    <text x="28" y="260" font-family="Arial, sans-serif" font-size="12.5" fill="#f8fafc">Masse Structurelle Auditée v42</text>
    <text x="410" y="260" font-family="Arial, sans-serif" font-size="12.5" fill="#fca5a5">&gt; 650 g / bras</text>
    <text x="740" y="260" font-family="Arial, sans-serif" font-size="12.5" fill="#fde68a">~490 g / bras</text>
    <text x="1050" y="260" font-family="Arial, sans-serif" font-size="12.5" font-weight="bold" fill="#34d399">Tube 100,04 g + Insert 85,71 g + Bride 202,30 g</text>
  </g>
</svg>