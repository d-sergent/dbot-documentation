<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1000" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090d16"/>
      <stop offset="55%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#0b1120"/>
    </linearGradient>
    <linearGradient id="panelGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" stop-opacity="0.96"/>
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0.96"/>
    </linearGradient>
    <linearGradient id="aluOrange" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#c2410c"/>
      <stop offset="50%" stop-color="#ea580c"/>
      <stop offset="100%" stop-color="#f97316"/>
    </linearGradient>
    <linearGradient id="aluAmber" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#b45309"/>
      <stop offset="50%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#d97706"/>
    </linearGradient>
    <linearGradient id="aluBlue" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#1e3a8a"/>
      <stop offset="50%" stop-color="#2563eb"/>
      <stop offset="100%" stop-color="#1d4ed8"/>
    </linearGradient>
    <linearGradient id="steelGreen" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#15803d"/>
      <stop offset="50%" stop-color="#22c55e"/>
      <stop offset="100%" stop-color="#16a34a"/>
    </linearGradient>
    <linearGradient id="motorSlate" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#334155"/>
      <stop offset="50%" stop-color="#475569"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
    <pattern id="gridPat" width="30" height="30" patternUnits="userSpaceOnUse">
      <path d="M 30 0 L 0 0 0 30" fill="none" stroke="#334155" stroke-width="0.55" stroke-opacity="0.28"/>
    </pattern>
    <marker id="arrCyan" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <polygon points="0 1, 8 4, 0 7" fill="#38bdf8"/>
    </marker>
    <marker id="arrRed" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <polygon points="0 1, 8 4, 0 7" fill="#ef4444"/>
    </marker>
    <marker id="arrAmber" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <polygon points="0 1, 8 4, 0 7" fill="#f59e0b"/>
    </marker>
    <marker id="arrGreen" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <polygon points="0 1, 8 4, 0 7" fill="#10b981"/>
    </marker>
    <filter id="cardShadow" x="-8%" y="-8%" width="116%" height="116%">
      <feDropShadow dx="0" dy="5" stdDeviation="6" flood-color="#000000" flood-opacity="0.55"/>
    </filter>
  </defs>
  <rect width="1600" height="1000" fill="url(#bgGrad)"/>
  <rect width="1600" height="1000" fill="url(#gridPat)"/>
  <g transform="translate(30, 22)">
    <rect width="1540" height="74" rx="12" fill="#1e293b" stroke="#3b82f6" stroke-width="1.5" filter="url(#cardShadow)"/>
    <circle cx="42" cy="37" r="20" fill="#22c55e" fill-opacity="0.18" stroke="#22c55e" stroke-width="2"/>
    <text x="42" y="44" font-family="Arial, sans-serif" font-size="20" font-weight="bold" fill="#22c55e" text-anchor="middle">B</text>
    <text x="78" y="32" font-family="Arial, sans-serif" font-size="19" font-weight="bold" fill="#f8fafc">MAINTIEN BAGUE EXTÉRIEURE RB8016 : 4× BRIDE_RETENUE_RB8016_L (TORSE-123 V42)</text>
    <text x="78" y="55" font-family="Arial, sans-serif" font-size="13" fill="#94a3b8">Système modélisé en CAO (4 brides étagées en L à 45° — 4,12 g/u) &amp; vis CHC M4×16 [92290A154]</text>
    <rect x="1220" y="19" width="290" height="36" rx="8" fill="#0f172a" stroke="#4ade80" stroke-width="1.2"/>
    <text x="1365" y="42" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#4ade80" text-anchor="middle">MODÉLISÉ &amp; VALIDÉ V42</text>
  </g>

  <!-- PANEL 1 : VUE DE DESSUS -->
  <g transform="translate(30, 114)">
    <rect width="500" height="860" rx="12" fill="url(#panelGrad)" stroke="#334155" stroke-width="1.5" filter="url(#cardShadow)"/>
    <text x="22" y="32" font-family="Arial, sans-serif" font-size="14.5" font-weight="bold" fill="#38bdf8">1. IMPLANTATION POLAIRE À 45° (VUE DESSUS)</text>
    <text x="22" y="52" font-family="Arial, sans-serif" font-size="11.5" fill="#94a3b8">Coins Traverse (174,90 × 174,84 mm) — Zéro interférence arcs</text>

    <g transform="translate(250, 390)">
      <!-- Traverse square (174.9 x 174.84 -> ±175 px at 2 px/mm) -->
      <rect x="-175" y="-175" width="350" height="350" rx="16" fill="#1e3a8a" fill-opacity="0.4" stroke="#60a5fa" stroke-width="2"/>
      <!-- Corner FHC M5 [92125A213] -->
      <circle cx="-154" cy="-154" r="7" fill="#38bdf8"/>
      <circle cx="154" cy="-154" r="7" fill="#38bdf8"/>
      <circle cx="-154" cy="154" r="7" fill="#38bdf8"/>
      <circle cx="154" cy="154" r="7" fill="#38bdf8"/>

      <!-- RB8016 outer Ø 120 (r=120), inner Ø 80 (r=80) -->
      <circle cx="0" cy="0" r="120" fill="none" stroke="#22c55e" stroke-width="40" stroke-opacity="0.35"/>
      <circle cx="0" cy="0" r="120" fill="none" stroke="#4ade80" stroke-width="2"/>
      <circle cx="0" cy="0" r="80" fill="none" stroke="#4ade80" stroke-width="2"/>

      <!-- 4x Bride_Retenue_RB8016_L at 45 deg -->
      <rect x="74" y="-114" width="34" height="34" rx="4" fill="url(#aluAmber)" stroke="#fde047" stroke-width="1.6" transform="rotate(45, 91, -97)"/>
      <rect x="74" y="80" width="34" height="34" rx="4" fill="url(#aluAmber)" stroke="#fde047" stroke-width="1.6" transform="rotate(45, 91, 97)"/>
      <rect x="-108" y="-114" width="34" height="34" rx="4" fill="url(#aluAmber)" stroke="#fde047" stroke-width="1.6" transform="rotate(45, -91, -97)"/>
      <rect x="-108" y="80" width="34" height="34" rx="4" fill="url(#aluAmber)" stroke="#fde047" stroke-width="1.6" transform="rotate(45, -91, 97)"/>

      <!-- 4x bolt holes on brides -->
      <circle cx="96" cy="-102" r="5" fill="#fff"/>
      <circle cx="96" cy="102" r="5" fill="#fff"/>
      <circle cx="-96" cy="-102" r="5" fill="#fff"/>
      <circle cx="-96" cy="102" r="5" fill="#fff"/>

      <!-- Rear arc Traverse 69.05 deg (-X) -->
      <path d="M -123 -84 A 149 149 0 0 0 -123 84" fill="none" stroke="#10b981" stroke-width="28" stroke-linecap="round" stroke-opacity="0.65"/>

      <text x="0" y="-194" font-family="Arial, sans-serif" font-size="11.5" font-weight="bold" fill="#60a5fa" text-anchor="middle">Traverse_Renfort_Bassin (174,90 × 174,84 mm)</text>
      <text x="0" y="198" font-family="Arial, sans-serif" font-size="11.5" font-weight="bold" fill="#38bdf8" text-anchor="middle">4× Vis coins FHC M5×18 [92125A213] (dégagées des brides)</text>
      <text x="0" y="218" font-family="Arial, sans-serif" font-size="11.5" font-weight="bold" fill="#fbbf24" text-anchor="middle">4× Brides L à 45° : 21,95 × 21,95 × 15,02 mm (4,12 g/u)</text>
      <text x="0" y="5" font-family="Arial, sans-serif" font-size="11" font-weight="bold" fill="#4ade80" text-anchor="middle">RB8016 Ø 120 / Ø 80</text>
    </g>

    <rect x="22" y="650" width="456" height="186" rx="8" fill="#0f172a" stroke="#4ade80" stroke-width="1.2"/>
    <text x="38" y="676" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#4ade80">AVANTAGES DE LA DISPOSITION À 45° (V42)</text>
    <text x="38" y="700" font-family="Arial, sans-serif" font-size="11" fill="#e2e8f0">• Laisse le couloir dorsal -X (69,05°) intégralement libre.</text>
    <text x="38" y="722" font-family="Arial, sans-serif" font-size="11" fill="#e2e8f0">• Laisse le secteur ventral +X (encoche U) intégralement libre.</text>
    <text x="38" y="744" font-family="Arial, sans-serif" font-size="11" fill="#e2e8f0">• Aucune interférence avec les 4× FHC M5 des coins [92125A213].</text>
    <text x="38" y="766" font-family="Arial, sans-serif" font-size="11" fill="#e2e8f0">• Vis CHC M4×16 [92290A154] accessibles verticalement avant Waist.</text>
    <text x="38" y="794" font-family="Arial, sans-serif" font-size="11" font-weight="bold" fill="#fbbf24">• Matériau : Aluminium 7075-T6 (CNC) | Statut : Modélisé OK en v42</text>
  </g>

  <!-- PANEL 2 : COUPE RADIALE BRIDE L -->
  <g transform="translate(555, 114)">
    <rect width="530" height="860" rx="12" fill="url(#panelGrad)" stroke="#334155" stroke-width="1.5" filter="url(#cardShadow)"/>
    <text x="22" y="32" font-family="Arial, sans-serif" font-size="14.5" font-weight="bold" fill="#fbbf24">2. COUPE RADIALE : ÉPAULEMENT &amp; SERRAGE</text>
    <text x="22" y="52" font-family="Arial, sans-serif" font-size="11.5" fill="#94a3b8">Prise en sandwich de la bague extérieure RB8016 sur Traverse</text>

    <g transform="translate(24, 120)">
      <!-- Waist Plate above with safe axial clearance -->
      <rect x="20" y="30" width="320" height="36" rx="3" fill="url(#aluOrange)" stroke="#fb923c" stroke-width="1.5"/>
      <text x="180" y="53" font-family="Arial, sans-serif" font-size="11.5" font-weight="bold" fill="#fff" text-anchor="middle">Waist_Plate_7075 (9,02 mm)</text>

      <!-- Clearance -->
      <text x="180" y="84" font-family="Arial, sans-serif" font-size="10.5" font-weight="bold" fill="#34d399" text-anchor="middle">Garde axiale sous Waist_Plate (&gt;= 1,0 mm)</text>

      <!-- Bride L profile -->
      <path d="M 155 100 L 295 100 L 295 210 L 245 210 L 245 140 L 155 140 Z" fill="url(#aluAmber)" stroke="#fde047" stroke-width="1.8"/>
      <text x="202" y="125" font-family="Arial, sans-serif" font-size="10.5" font-weight="bold" fill="#0f172a" text-anchor="middle">Bride L</text>

      <!-- Bolt M4x16 [92290A154] -->
      <rect x="262" y="86" width="16" height="18" rx="2" fill="#e2e8f0" stroke="#94a3b8"/>
      <rect x="265" y="104" width="10" height="142" fill="#cbd5e1" stroke="#64748b"/>
      <text x="312" y="126" font-family="Arial, sans-serif" font-size="10.5" font-weight="bold" fill="#e2e8f0">CHC M4×16 [92290A154]</text>
      <text x="312" y="142" font-family="Arial, sans-serif" font-size="10" fill="#94a3b8">+ Rondelle [93475A230]</text>
      <text x="312" y="160" font-family="Arial, sans-serif" font-size="10" fill="#fbbf24">Bride L : 21,95×21,95×15,02</text>

      <!-- RB8016 outer ring & inner ring -->
      <rect x="115" y="140" width="90" height="100" rx="3" fill="url(#steelGreen)" stroke="#4ade80" stroke-width="1.5"/>
      <text x="160" y="194" font-family="Arial, sans-serif" font-size="11" font-weight="bold" fill="#fff" text-anchor="middle">Bague Ext.</text>
      <text x="160" y="210" font-family="Arial, sans-serif" font-size="10.5" fill="#dcfce7" text-anchor="middle">RB8016</text>

      <rect x="40" y="140" width="68" height="100" rx="3" fill="#15803d" stroke="#4ade80" stroke-width="1.2"/>
      <text x="74" y="194" font-family="Arial, sans-serif" font-size="10.5" font-weight="bold" fill="#fff" text-anchor="middle">Bague Int.</text>

      <!-- Traverse seat -->
      <path d="M 30 240 L 205 240 L 205 210 L 340 210 L 340 295 L 30 295 Z" fill="url(#aluBlue)" stroke="#60a5fa" stroke-width="1.5"/>
      <text x="185" y="274" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#fff" text-anchor="middle">Traverse_Renfort_Bassin (12,51 mm | 566,74 g)</text>

      <rect x="16" y="340" width="450" height="350" rx="10" fill="#0f172a" stroke="#334155"/>
      <text x="34" y="368" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#38bdf8">PRÉCISION CRITIQUE DE SERRAGE SANS JEU</text>
      <text x="34" y="396" font-family="Arial, sans-serif" font-size="11" fill="#e2e8f0">• La hauteur d'épaulement du pied de bride est réglée pour être</text>
      <text x="34" y="416" font-family="Arial, sans-serif" font-size="11" fill="#34d399">  0,05 à 0,10 mm inférieure au dépassement de la bague RB8016.</text>
      <text x="34" y="442" font-family="Arial, sans-serif" font-size="11" fill="#e2e8f0">• Lors du serrage M4 à 3,0 N.m, le bec appuie fermement</text>
      <text x="34" y="462" font-family="Arial, sans-serif" font-size="11" fill="#e2e8f0">  sur la bague extérieure acier (jamais de contact sur le joint UU).</text>
      <text x="34" y="490" font-family="Arial, sans-serif" font-size="11" fill="#e2e8f0">• Cotes exactes mesurées du RB8016 livré (Luoyang EFANT) :</text>
      <text x="46" y="510" font-family="Arial, sans-serif" font-size="11" fill="#4ade80">B = 15,965 mm | D = 119,995 mm | d = 79,996 mm</text>
      <text x="34" y="542" font-family="Arial, sans-serif" font-size="11" fill="#fbbf24">• Effort axial admissible des 4× M4 cl. A4/316 : &gt; 14 000 N</text>
      <text x="34" y="566" font-family="Arial, sans-serif" font-size="11" fill="#cbd5e1">• Marge anti-arrachement sous marche dynamique 2g : Sf &gt; 20</text>
      <text x="34" y="598" font-family="Arial, sans-serif" font-size="11" font-weight="bold" fill="#f87171">• Rappel : Butée mécanique ±95° (R=83,0 mm) = Modif. CAO prévue</text>
      <text x="46" y="618" font-family="Arial, sans-serif" font-size="10.5" fill="#fecaca">  placée hors zone des 4× Brides L (zéro conflit avec [92290A154]).</text>
    </g>
  </g>

  <!-- PANEL 3 : VÉRIF & PROCÉDURE ATELIER -->
  <g transform="translate(1110, 114)">
    <rect width="460" height="860" rx="12" fill="url(#panelGrad)" stroke="#334155" stroke-width="1.5" filter="url(#cardShadow)"/>
    <text x="22" y="32" font-family="Arial, sans-serif" font-size="14.5" font-weight="bold" fill="#34d399">3. BOM BRIDES &amp; MONTAGE ATELIER</text>

    <rect x="22" y="60" width="416" height="270" rx="10" fill="#0f172a" stroke="#fbbf24" stroke-width="1.2"/>
    <text x="38" y="88" font-family="Arial, sans-serif" font-size="12.5" font-weight="bold" fill="#fbbf24">NOMENCLATURE V42 VALIDÉE</text>
    <text x="38" y="116" font-family="Arial, sans-serif" font-size="11.5" fill="#e2e8f0">• Pièce : Bride_Retenue_RB8016_L (×4)</text>
    <text x="38" y="138" font-family="Arial, sans-serif" font-size="11.5" fill="#e2e8f0">• Matériau : Aluminium 7075-T6 (2,81 g/cm3)</text>
    <text x="38" y="160" font-family="Arial, sans-serif" font-size="11.5" fill="#e2e8f0">• Encombrement : 21,95 × 21,95 × 15,02 mm</text>
    <text x="38" y="182" font-family="Arial, sans-serif" font-size="11.5" fill="#e2e8f0">• Masse unitaire : 4,12 g (16,48 g les 4)</text>
    <text x="38" y="204" font-family="Arial, sans-serif" font-size="11.5" fill="#38bdf8">• Visserie : 4× CHC M4×16 [92290A154]</text>
    <text x="38" y="226" font-family="Arial, sans-serif" font-size="11.5" fill="#38bdf8">• Rondelles : 4× DIN 125A M4 [93475A230]</text>
    <text x="38" y="248" font-family="Arial, sans-serif" font-size="11.5" fill="#34d399">• Couple serrage : 2,8 à 3,0 N.m (+ Loctite 243)</text>
    <text x="38" y="276" font-family="Arial, sans-serif" font-size="11" fill="#94a3b8">• Taraudage M4 × 0,7 dans Traverse Alu 7075</text>
    <text x="38" y="298" font-family="Arial, sans-serif" font-size="11" fill="#94a3b8">  sur 12,51 mm (trou débouchant, filet ~10 mm).</text>

    <rect x="22" y="352" width="416" height="240" rx="10" fill="#0f172a" stroke="#10b981" stroke-width="1.2"/>
    <text x="38" y="380" font-family="Arial, sans-serif" font-size="12.5" font-weight="bold" fill="#34d399">CONTRÔLE USINAGE CARVERA C500</text>
    <text x="38" y="408" font-family="Arial, sans-serif" font-size="11" fill="#e2e8f0">1. Usiner les 4 brides sur une même plaque Alu 7075</text>
    <text x="50" y="428" font-family="Arial, sans-serif" font-size="11" fill="#cbd5e1">épaisseur 15,5–16 mm (2 faces : épaulement puis perçage Ø 4,5).</text>
    <text x="38" y="456" font-family="Arial, sans-serif" font-size="11" fill="#e2e8f0">2. Tester le montage à blanc sur le RB8016 réel :</text>
    <text x="50" y="476" font-family="Arial, sans-serif" font-size="11" fill="#cbd5e1">rotation fluide à la main + aucun flottement axial bague ext.</text>
    <text x="38" y="504" font-family="Arial, sans-serif" font-size="11" fill="#e2e8f0">3. Vérifier passage sous Waist_Plate_7075 (Z = 1033,41)</text>
    <text x="50" y="524" font-family="Arial, sans-serif" font-size="11" fill="#cbd5e1">sur 360 deg complets avant blocage au frein-filet.</text>
    <text x="38" y="556" font-family="Arial, sans-serif" font-size="11" font-weight="bold" fill="#4ade80">• STATUT CAO : Entièrement modélisé dans Torse-123 v42.</text>

    <rect x="22" y="614" width="416" height="222" rx="10" fill="#0f172a" stroke="#475569"/>
    <text x="38" y="642" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#60a5fa">COHÉRENCE MULTI-DOCUMENTS</text>
    <text x="38" y="670" font-family="Arial, sans-serif" font-size="11" fill="#e2e8f0">• Documentée dans DOSSIER_TECHNIQUE_Waist_et_Bassin_D-Bot_V2</text>
    <text x="38" y="692" font-family="Arial, sans-serif" font-size="11" fill="#e2e8f0">• Référencée dans FINAL_BOM_Torse_et_Waist_D-Bot (WST-04)</text>
    <text x="38" y="714" font-family="Arial, sans-serif" font-size="11" fill="#e2e8f0">• Quantité McMaster [92290A154] : 4 Waist + 4 Cou = 8 total v42</text>
    <text x="38" y="742" font-family="Arial, sans-serif" font-size="11" fill="#94a3b8">• Remplace définitivement l'ancienne architecture Platine Ø 140.</text>
  </g>
</svg>