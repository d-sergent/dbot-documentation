<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1000" width="1600" height="1000">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090d16"/>
      <stop offset="55%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#0b1120"/>
    </linearGradient>
    <linearGradient id="panelGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" stop-opacity="0.96"/>
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0.96"/>
    </linearGradient>
    <linearGradient id="aluOrange" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#c2410c"/>
      <stop offset="50%" stop-color="#ea580c"/>
      <stop offset="100%" stop-color="#f97316"/>
    </linearGradient>
    <linearGradient id="aluAmber" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#b45309"/>
      <stop offset="50%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#d97706"/>
    </linearGradient>
    <linearGradient id="aluBlue" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#1e3a8a"/>
      <stop offset="50%" stop-color="#2563eb"/>
      <stop offset="100%" stop-color="#1d4ed8"/>
    </linearGradient>
    <linearGradient id="steelGreen" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#15803d"/>
      <stop offset="50%" stop-color="#22c55e"/>
      <stop offset="100%" stop-color="#16a34a"/>
    </linearGradient>
    <linearGradient id="paViolet" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#5b21b6"/>
      <stop offset="50%" stop-color="#7c3aed"/>
      <stop offset="100%" stop-color="#6d28d9"/>
    </linearGradient>
    <linearGradient id="motorSlate" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#334155"/>
      <stop offset="50%" stop-color="#475569"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
    <pattern id="gridPat" width="30" height="30" patternUnits="userSpaceOnUse">
      <path d="M 30 0 L 0 0 0 30" fill="none" stroke="#334155" stroke-width="0.55" stroke-opacity="0.28"/>
    </pattern>
    <pattern id="hatchWaste" width="10" height="10" patternTransform="rotate(45 0 0)" patternUnits="userSpaceOnUse">
      <line x1="0" y1="0" x2="0" y2="10" stroke="#ef4444" stroke-width="1.6" stroke-opacity="0.55"/>
    </pattern>
    <marker id="arrCyan" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <polygon points="0 1, 8 4, 0 7" fill="#38bdf8"/>
    </marker>
    <marker id="arrRed" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <polygon points="0 1, 8 4, 0 7" fill="#ef4444"/>
    </marker>
    <marker id="arrAmber" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <polygon points="0 1, 8 4, 0 7" fill="#f59e0b"/>
    </marker>
    <marker id="arrGreen" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <polygon points="0 1, 8 4, 0 7" fill="#10b981"/>
    </marker>
    <filter id="cardShadow" x="-8%" y="-8%" width="116%" height="116%">
      <feDropShadow dx="0" dy="5" stdDeviation="6" flood-color="#000000" flood-opacity="0.55"/>
    </filter>
  </defs>
  <rect width="1600" height="1000" fill="url(#bgGrad)"/>
  <rect width="1600" height="1000" fill="url(#gridPat)"/>
  <g transform="translate(30, 22)">
    <rect width="1540" height="74" rx="12" fill="#1e293b" stroke="#3b82f6" stroke-width="1.5" filter="url(#cardShadow)"/>
    <circle cx="42" cy="37" r="20" fill="#10b981" fill-opacity="0.18" stroke="#10b981" stroke-width="2"/>
    <text x="42" y="44" font-family="Arial, sans-serif" font-size="19" font-weight="bold" fill="#10b981" text-anchor="middle">+</text>
    <text x="76" y="31" font-family="Arial, sans-serif" font-size="18" font-weight="bold" fill="#f8fafc">GABARIT DE PERÇAGE 3D POUR PIED CORNIÈRE BASSE (MÉTHODE 1)</text>
    <text x="76" y="54" font-family="Arial, sans-serif" font-size="12" fill="#94a3b8">Centrage auto-isostatique sans traçage sur Corniere basse 7075-T6 (H = 191,10 mm) — Perçage tandem d = 12,0 mm</text>
    <rect x="1206" y="19" width="310" height="36" rx="8" fill="#0f172a" stroke="#10b981" stroke-width="1.3"/>
    <text x="1361" y="42" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#10b981" text-anchor="middle">ZÉRO COLLISION MANDRIN | PETG</text>
  </g>

  <!-- PANNEAU 1 -->
  <g transform="translate(30, 114)">
    <rect width="755" height="856" rx="12" fill="url(#panelGrad)" stroke="#334155" stroke-width="1.3" filter="url(#cardShadow)"/>
    <text x="20" y="30" font-family="Arial, sans-serif" font-size="13.5" font-weight="bold" fill="#38bdf8">PANNEAU 1 : ARCHITECTURE DU GABARIT 3D &amp; CENTRAGE SUR CORNIÈRE</text>

    <!-- Corniere basse L-foot vertical drawing cleanly offset in center-left -->
    <!-- Vertical dimension far left x=84 -->
    <line x1="94" y1="90" x2="94" y2="540" stroke="#94a3b8" stroke-width="1.4" marker-end="url(#arrCyan)"/>
    <text x="72" y="315" font-family="Arial, sans-serif" font-size="11.5" font-weight="bold" fill="#f8fafc" text-anchor="middle" transform="rotate(-90 72 315)">Corniere basse H = 191,10 mm (Alu 7075)</text>

    <!-- Corniere profile at x=165..385 -->
    <path d="M 165 90 L 185 90 L 185 280 L 210 340 L 210 518 L 378 518 L 378 540 L 188 540 L 188 348 L 165 288 Z" fill="url(#aluBlue)" stroke="#38bdf8" stroke-width="1.8"/>

    <!-- 3D Printed PETG Jig sleeve seated over bottom foot (x=188..398, y=452..546) -->
    <rect x="212" y="454" width="176" height="64" rx="5" fill="#10b981" fill-opacity="0.28" stroke="#10b981" stroke-width="2" stroke-dasharray="5,3"/>
    <!-- Two Drill Bushing Canons H=25 mm -->
    <rect x="262" y="454" width="22" height="64" fill="#0f172a" stroke="#facc15" stroke-width="1.5"/>
    <rect x="318" y="454" width="22" height="64" fill="#0f172a" stroke="#facc15" stroke-width="1.5"/>
    <line x1="273" y1="350" x2="273" y2="554" stroke="#facc15" stroke-width="1.5" stroke-dasharray="4,3"/>
    <line x1="329" y1="350" x2="329" y2="554" stroke="#facc15" stroke-width="1.5" stroke-dasharray="4,3"/>

    <!-- Chuck clearly ABOVE jig far right of vertical wall -->
    <circle cx="301" cy="256" r="46" fill="#064e3b" fill-opacity="0.45" stroke="#34d399" stroke-width="1.8" stroke-dasharray="5,3"/>
    <text x="301" y="252" font-family="Arial, sans-serif" font-size="11" font-weight="bold" fill="#34d399" text-anchor="middle">Mandrin Ø 45 mm</text>
    <text x="301" y="270" font-family="Arial, sans-serif" font-size="10.5" fill="#a7f3d0" text-anchor="middle">Garde &gt; 15 mm</text>

    <!-- Canons callout card strictly right x=435..730 -->
    <rect x="435" y="378" width="296" height="106" rx="8" fill="#0f172a" stroke="#10b981" stroke-width="1.4"/>
    <text x="583" y="404" font-family="Arial, sans-serif" font-size="11.5" font-weight="bold" fill="#34d399" text-anchor="middle">CANONS DE GUIDAGE 3D</text>
    <text x="583" y="428" font-family="Arial, sans-serif" font-size="11" fill="#e2e8f0" text-anchor="middle">Hauteur guidage H = 25,0 mm</text>
    <text x="583" y="448" font-family="Arial, sans-serif" font-size="11" fill="#e2e8f0" text-anchor="middle">Alésages Ø 4,55 mm | d = 12,0 mm</text>
    <text x="583" y="468" font-family="Arial, sans-serif" font-size="10.5" fill="#a7f3d0" text-anchor="middle">Réhausse mécanique -&gt; zéro frottement</text>
    <line x1="388" y1="478" x2="435" y2="434" stroke="#10b981" stroke-width="1.4"/>

    <text x="301" y="566" font-family="Arial, sans-serif" font-size="11" font-weight="bold" fill="#facc15" text-anchor="middle">Entraxe d = 12,00 mm (Pied Corniere basse 4 mm)</text>

    <!-- Bottom benefits card y=600..836 -->
    <rect x="20" y="596" width="715" height="240" rx="8" fill="#0f172a" stroke="#38bdf8" stroke-width="1.1"/>
    <text x="36" y="624" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#38bdf8">POURQUOI LE GABARIT 3D SÉCURISE LE PERÇAGE PORTATIF :</text>
    <text x="36" y="656" font-family="Arial, sans-serif" font-size="11.5" font-weight="bold" fill="#f8fafc">1. Ratio de guidage rigide (L / D = 25 / 4,55 = 5,5) :</text>
    <text x="50" y="676" font-family="Arial, sans-serif" font-size="11" fill="#cbd5e1">La cheminée bloque le foret à 90° (+/- 0,1°) sans amorce de pointage.</text>
    <text x="36" y="710" font-family="Arial, sans-serif" font-size="11.5" font-weight="bold" fill="#f8fafc">2. Rehausse mécanique du mandrin (Zéro rayure sur Corniere 7075) :</text>
    <text x="50" y="730" font-family="Arial, sans-serif" font-size="11" fill="#cbd5e1">Le cône du mandrin reste surélevé de 25 mm au-dessus du pied.</text>
    <text x="36" y="764" font-family="Arial, sans-serif" font-size="11.5" font-weight="bold" fill="#f8fafc">3. Centrage isostatique par emboîtement :</text>
    <text x="50" y="784" font-family="Arial, sans-serif" font-size="11" fill="#cbd5e1">Épouse la tranche et les 2 joues latérales (20,02 mm), tolérance d'entraxe +/- 0,05 mm.</text>
  </g>

  <!-- PANNEAU 2 : SECTION -->
  <g transform="translate(815, 114)">
    <rect width="755" height="500" rx="12" fill="url(#panelGrad)" stroke="#10b981" stroke-width="1.3" filter="url(#cardShadow)"/>
    <text x="20" y="30" font-family="Arial, sans-serif" font-size="13.5" font-weight="bold" fill="#10b981">PANNEAU 2 : COUPE TRANSVERSALE &amp; COTES D'ATELIER</text>

    <!-- Cross section at center y=90..440 -->
    <rect x="130" y="88" width="22" height="310" fill="url(#aluBlue)" stroke="#38bdf8" stroke-width="1.6"/>
    <rect x="152" y="370" width="430" height="28" fill="url(#aluBlue)" stroke="#38bdf8" stroke-width="1.8"/>
    <text x="114" y="242" font-family="Arial, sans-serif" font-size="11" fill="#93c5fd" text-anchor="middle" transform="rotate(-90 114 242)">Montant 191,10 mm</text>

    <!-- Jig block -->
    <rect x="180" y="190" width="380" height="180" rx="5" fill="#10b981" fill-opacity="0.22" stroke="#10b981" stroke-width="2"/>
    <!-- 2 guide holes -->
    <rect x="278" y="190" width="28" height="180" fill="#090e1a" stroke="#facc15" stroke-width="1.5"/>
    <rect x="424" y="190" width="28" height="180" fill="#090e1a" stroke="#facc15" stroke-width="1.5"/>
    <text x="292" y="176" font-family="Arial, sans-serif" font-size="11" font-weight="bold" fill="#facc15" text-anchor="middle">Ø 4,55 mm</text>
    <text x="438" y="176" font-family="Arial, sans-serif" font-size="11" font-weight="bold" fill="#facc15" text-anchor="middle">Ø 4,55 mm</text>

    <line x1="590" y1="190" x2="590" y2="370" stroke="#34d399" stroke-width="1.5"/>
    <text x="606" y="284" font-family="Arial, sans-serif" font-size="11.5" font-weight="bold" fill="#34d399">H_canon = 25,0 mm</text>

    <line x1="292" y1="430" x2="438" y2="430" stroke="#facc15" stroke-width="2"/>
    <text x="365" y="454" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#facc15" text-anchor="middle">Entraxe d = 12,0 mm (+/- 0,05 mm)</text>
    <text x="365" y="478" font-family="Arial, sans-serif" font-size="11" fill="#cbd5e1" text-anchor="middle">Semelle Alu 7075 ép. 4,0 mm -> Vis [91290A150] CHC M4×14</text>
  </g>

  <!-- PANNEAU 3 : SLICER & PROTOCOL -->
  <g transform="translate(815, 634)">
    <rect width="755" height="336" rx="12" fill="url(#panelGrad)" stroke="#38bdf8" stroke-width="1.3" filter="url(#cardShadow)"/>
    <text x="20" y="30" font-family="Arial, sans-serif" font-size="13.5" font-weight="bold" fill="#38bdf8">PANNEAU 3 : FICHE SLICER &amp; PROTOCOLE DE PERÇAGE (4 ÉTAPES)</text>

    <rect x="20" y="48" width="348" height="156" rx="8" fill="#0f172a" stroke="#334155"/>
    <text x="34" y="72" font-family="Arial, sans-serif" font-size="11.5" font-weight="bold" fill="#fde68a">PARAMÈTRES SLICER (QIDI PLUS 4)</text>
    <text x="34" y="98" font-family="Arial, sans-serif" font-size="11" fill="#cbd5e1">• Matériau : PETG-CF ou PLA-CF (rigide)</text>
    <text x="34" y="122" font-family="Arial, sans-serif" font-size="11" fill="#cbd5e1">• Périmètres : 5 parois (canons massifs)</text>
    <text x="34" y="146" font-family="Arial, sans-serif" font-size="11" fill="#cbd5e1">• Remplissage : 100 % plein</text>
    <text x="34" y="170" font-family="Arial, sans-serif" font-size="11" fill="#cbd5e1">• Hauteur couche : 0,16 mm</text>

    <rect x="386" y="48" width="349" height="156" rx="8" fill="#0f172a" stroke="#334155"/>
    <text x="400" y="72" font-family="Arial, sans-serif" font-size="11.5" font-weight="bold" fill="#34d399">CONDITIONS D'USINAGE FORAGE</text>
    <text x="400" y="98" font-family="Arial, sans-serif" font-size="11" fill="#cbd5e1">• Foret HSS-G affûté Ø 4,50 mm</text>
    <text x="400" y="122" font-family="Arial, sans-serif" font-size="11" fill="#cbd5e1">• Vitesse : 800 à 1 200 tr/min (sans choc)</text>
    <text x="400" y="146" font-family="Arial, sans-serif" font-size="11" fill="#cbd5e1">• Lubrification : 1 goutte WD-40 / Alcool</text>
    <text x="400" y="170" font-family="Arial, sans-serif" font-size="11" fill="#cbd5e1">• Temps d'exécution : &lt; 30 s par trou</text>

    <rect x="20" y="218" width="715" height="98" rx="8" fill="#064e3b" stroke="#10b981"/>
    <text x="36" y="244" font-family="Arial, sans-serif" font-size="11.5" font-weight="bold" fill="#a7f3d0">SÉQUENCE OPÉRATOIRE D'ATELIER (4 ÉTAPES) :</text>
    <text x="36" y="268" font-family="Arial, sans-serif" font-size="11" fill="#e2e8f0">1. Emboîter le gabarit sur le pied de cornière -&gt; 2. Bridage ferme par serre-joint.</text>
    <text x="36" y="290" font-family="Arial, sans-serif" font-size="11" fill="#e2e8f0">3. Percer les 2 trous Ø 4,5 mm en 1 passe -&gt; 4. Ébavurer &amp; serrer [91290A150] M4×14 à 3,0 N.m.</text>
  </g>
</svg>