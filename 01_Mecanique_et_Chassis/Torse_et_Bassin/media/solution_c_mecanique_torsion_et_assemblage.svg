<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 820" width="1200" height="820" style="background:#0f172a; font-family:system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;">
  <defs>
    <!-- Grilles et motifs -->
    <pattern id="grid2" width="30" height="30" patternUnits="userSpaceOnUse">
      <path d="M 30 0 L 0 0 0 30" fill="none" stroke="#1e293b" stroke-width="0.8"/>
    </pattern>

    <!-- Dégradés -->
    <linearGradient id="gradAlu2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#0284c7"/>
    </linearGradient>
    <linearGradient id="gradPA12_2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#c084fc"/>
      <stop offset="100%" stop-color="#7e22ce"/>
    </linearGradient>
    <linearGradient id="gradPlastron2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#60a5fa"/>
      <stop offset="100%" stop-color="#1d4ed8"/>
    </linearGradient>
    <linearGradient id="gradShear" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#f43f5e"/>
      <stop offset="100%" stop-color="#fb7185"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="820" fill="#0f172a"/>
  <rect width="1200" height="820" fill="url(#grid2)"/>

  <!-- En-tête -->
  <g transform="translate(30, 24)">
    <rect width="1140" height="60" rx="8" fill="#1e293b" stroke="#334155" stroke-width="1.2"/>
    <text x="24" y="36" fill="#38bdf8" font-size="20" font-weight="700" letter-spacing="0.5">D-BOT — SOLUTION C : FLUX DE TORSION &amp; MODULARITÉ DU PLASTRON BLEU</text>
    <text x="24" y="52" fill="#94a3b8" font-size="12">Complémentarité Ceinture Alu 3 mm / Plastron Pectoral &amp; Découpage bi-blocs pour impression Qidi Plus 4</text>
    <rect x="980" y="16" width="140" height="28" rx="6" fill="#10b981" fill-opacity="0.2" stroke="#10b981" stroke-width="1"/>
    <text x="1050" y="34" fill="#10b981" font-size="11" font-weight="700" text-anchor="middle">RDM VALIDÉE</text>
  </g>

  <!-- ========================================== -->
  <!-- PANEL 1 : ANALYSE MÉCANIQUE DE TORSION (GAUCHE) -->
  <!-- ========================================== -->
  <g transform="translate(30, 100)">
    <rect width="380" height="680" rx="10" fill="#1e293b" stroke="#334155" stroke-width="1.2"/>
    <rect width="380" height="36" rx="10" fill="#334155" fill-opacity="0.6"/>
    <text x="16" y="24" fill="#f8fafc" font-size="13" font-weight="700">PANEL 1 : RÔLE ANTI-TORSION COMPLÉMENTAIRE</text>

    <!-- Schéma du flux de Bredt dans la cellule fermée -->
    <g transform="translate(25, 55)">
      <!-- Bloc Haut C1 (ouvert à l'avant si pas de plastron) -->
      <rect x="20" y="30" width="290" height="150" rx="6" fill="#0f172a" stroke="#c084fc" stroke-width="1.5"/>
      <text x="35" y="55" fill="#e9d5ff" font-size="12" font-weight="700">Demi-Fût C1 (H = 215 mm)</text>
      
      <!-- Flèches de flux de cisaillement si plastron présent -->
      <rect x="40" y="70" width="250" height="90" rx="4" fill="url(#gradPlastron2)" fill-opacity="0.3" stroke="#60a5fa" stroke-width="1.5"/>
      <text x="165" y="105" fill="#93c5fd" font-size="12" font-weight="700" text-anchor="middle">PLASTRON PECTORAL BLEU</text>
      <text x="165" y="122" fill="#bfdbfe" font-size="10" text-anchor="middle">Ferme la cellule en membrane de cisaillement</text>
      
      <!-- Flèches de flux Bredt q_vertical -->
      <path d="M 50,75 L 280,75 L 280,150 L 50,150 Z" fill="none" stroke="#f43f5e" stroke-width="2" stroke-dasharray="6,4"/>
      <text x="165" y="142" fill="#fb7185" font-size="10" font-weight="700" text-anchor="middle">Flux de Bredt vertical q = 0.39 N/mm</text>

      <!-- Ceinture Aluminium 3 mm au milieu -->
      <g transform="translate(10, 195)">
        <rect x="0" y="0" width="310" height="24" rx="4" fill="url(#gradAlu2)" stroke="#f0f9ff" stroke-width="1.2"/>
        <text x="155" y="16" fill="#0f172a" font-size="11" font-weight="800" text-anchor="middle">CEINTURE ALUMINIUM 3 MM (Z = 1235 mm)</text>
        <!-- Flèches de flux horizontal Q = 78 N -->
        <line x1="20" y1="12" x2="60" y2="12" stroke="#0f172a" stroke-width="2"/>
        <line x1="290" y1="12" x2="250" y2="12" stroke="#0f172a" stroke-width="2"/>
      </g>
      <text x="165" y="235" fill="#38bdf8" font-size="10" font-weight="700" text-anchor="middle">Reprend le cisaillement d'interface (Q_total = 78 N)</text>

      <!-- Bloc Bas C2 -->
      <rect x="20" y="250" width="290" height="150" rx="6" fill="#0f172a" stroke="#c084fc" stroke-width="1.5"/>
      <text x="35" y="275" fill="#e9d5ff" font-size="12" font-weight="700">Demi-Fût C2 (H = 193 mm)</text>
      <rect x="40" y="290" width="250" height="90" rx="4" fill="#1e293b" stroke="#f59e0b" stroke-dasharray="4,3" stroke-width="1.2"/>
      <text x="165" y="330" fill="#fbbf24" font-size="11" font-weight="700" text-anchor="middle">Baie Batterie / Plastron Abdominal</text>
      <text x="165" y="348" fill="#cbd5e1" font-size="9" text-anchor="middle">Ferme la cellule inférieure C2</text>
    </g>

    <!-- Fiche de démonstration Panel 1 -->
    <g transform="translate(16, 480)">
      <rect width="348" height="184" rx="6" fill="#0f172a" stroke="#334155" stroke-width="1"/>
      <text x="14" y="22" fill="#38bdf8" font-size="11" font-weight="700">POURQUOI LE PLASTRON BLEU RESTE VITAL :</text>
      <text x="14" y="42" fill="#cbd5e1" font-size="10">• La ceinture alu agit dans le plan horizontal Z = 1235 mm.</text>
      <text x="14" y="58" fill="#cbd5e1" font-size="10">• Mais C1 mesure 215 mm de haut au-dessus de la ceinture !</text>
      <text x="14" y="76" fill="#f43f5e" font-size="10" font-weight="700">❌ SANS PLASTRON BLEU :</text>
      <text x="14" y="92" fill="#cbd5e1" font-size="10">  C1 reste ouvert en C ➔ vrille sous 36 N.m de hanche.</text>
      <text x="14" y="112" fill="#10b981" font-size="10" font-weight="700">✓ AVEC PLASTRON BLEU :</text>
      <text x="14" y="128" fill="#cbd5e1" font-size="10">  C1 devient un caisson tubulaire fermé hyper-rigide.</text>
      <text x="14" y="144" fill="#cbd5e1" font-size="10">  La torsion transite continûment de la taille aux épaules.</text>
      <text x="14" y="166" fill="#38bdf8" font-size="10" font-weight="700">➔ CEINTURE = MEMBRURE | PLASTRON = PEAU TRAVAILLANTE</text>
    </g>
  </g>

  <!-- ========================================== -->
  <!-- PANEL 2 : DÉCOUPAGE MODULAIRE DU PLASTRON (CENTRE) -->
  <!-- ========================================== -->
  <g transform="translate(430, 100)">
    <rect width="380" height="680" rx="10" fill="#1e293b" stroke="#334155" stroke-width="1.2"/>
    <rect width="380" height="36" rx="10" fill="#334155" fill-opacity="0.6"/>
    <text x="16" y="24" fill="#f8fafc" font-size="13" font-weight="700">PANEL 2 : IMPRESSION 3D PLASTRON EN 2 BLOCS</text>

    <!-- Dessin du plastron scindé en 2 parties -->
    <g transform="translate(30, 50)">
      <!-- Bloc Pectoral Haut P1 -->
      <path d="M 30,30 L 290,30 L 280,195 L 40,195 Z" 
            fill="url(#gradPlastron2)" stroke="#93c5fd" stroke-width="1.5" fill-opacity="0.85"/>
      <text x="160" y="85" fill="#ffffff" font-size="14" font-weight="800" text-anchor="middle">PLASTRON PECTORAL (P1)</text>
      <text x="160" y="105" fill="#e0f2fe" font-size="11" font-weight="600" text-anchor="middle">Partie Haute Poitrine</text>
      <text x="160" y="125" fill="#f8fafc" font-size="10" text-anchor="middle">Hauteur : 215 mm | Rentre debout sur Qidi (&lt; 270)</text>

      <!-- Vis de fixation périphériques de P1 -->
      <circle cx="50" cy="50" r="3.5" fill="#0f172a" stroke="#f8fafc" stroke-width="1.2"/>
      <circle cx="270" cy="50" r="3.5" fill="#0f172a" stroke="#f8fafc" stroke-width="1.2"/>
      <circle cx="45" cy="175" r="3.5" fill="#0f172a" stroke="#f8fafc" stroke-width="1.2"/>
      <circle cx="275" cy="175" r="3.5" fill="#0f172a" stroke="#f8fafc" stroke-width="1.2"/>

      <!-- LIGNE DE COUPE / FEUILLURE À Z = 1235 (ou 1285) -->
      <g transform="translate(25, 200)">
        <rect x="0" y="0" width="270" height="12" rx="2" fill="#0284c7" stroke="#38bdf8" stroke-width="1"/>
        <text x="135" y="9" fill="#f8fafc" font-size="8" font-weight="700" text-anchor="middle">FEUILLURE SHIPLAP 2.0 mm (3x Vis M4 de liaison)</text>
        <circle cx="30" cy="6" r="2.5" fill="#f8fafc"/>
        <circle cx="135" cy="6" r="2.5" fill="#f8fafc"/>
        <circle cx="240" cy="6" r="2.5" fill="#f8fafc"/>
      </g>

      <!-- Bloc Abdominal Bas P2 -->
      <path d="M 40,218 L 280,218 L 265,370 L 55,370 Z" 
            fill="url(#gradPlastron2)" stroke="#93c5fd" stroke-width="1.5" fill-opacity="0.85"/>
      <text x="160" y="275" fill="#ffffff" font-size="13" font-weight="800" text-anchor="middle">PLASTRON ABDOMINAL (P2)</text>
      <text x="160" y="295" fill="#e0f2fe" font-size="10" font-weight="600" text-anchor="middle">Trappe d'Accès Batterie / PDB</text>
      <text x="160" y="315" fill="#f8fafc" font-size="10" text-anchor="middle">Hauteur : 171 mm | Rentre à plat ou debout</text>

      <!-- Découpe rectangulaire existante pour connectique -->
      <rect x="90" y="330" width="140" height="30" rx="3" fill="#0f172a" stroke="#64748b" stroke-width="0.8"/>
      <text x="160" y="348" fill="#94a3b8" font-size="9" text-anchor="middle">Fenêtre Connectique Facade</text>
    </g>

    <!-- Fiche impression 3D Panel 2 -->
    <g transform="translate(16, 480)">
      <rect width="348" height="184" rx="6" fill="#0f172a" stroke="#334155" stroke-width="1"/>
      <text x="14" y="22" fill="#38bdf8" font-size="11" font-weight="700">PARAMÈTRES D'IMPRESSION QIDI PLUS 4 :</text>
      <text x="14" y="42" fill="#cbd5e1" font-size="10">• Pièce initiale monobloc : H = 385.2 mm (Ne rentre pas en Z !)</text>
      <text x="14" y="60" fill="#10b981" font-size="10" font-weight="700">✓ SOLUTION 2 MORCEAUX (P1 + P2) :</text>
      <text x="14" y="78" fill="#cbd5e1" font-size="10">  - P1 Pectoral : H = 215 mm (Imprimable debout sans support)</text>
      <text x="14" y="94" fill="#cbd5e1" font-size="10">  - P2 Abdominal : H = 171 mm (Imprimable en 4 heures)</text>
      <text x="14" y="114" fill="#fbbf24" font-size="10" font-weight="700">ÉPAISSEURS OPTIMISÉES :</text>
      <text x="14" y="130" fill="#cbd5e1" font-size="10">  - Peau courante : 2,5 mm (Résistance aux chocs &amp; anti-vibration)</text>
      <text x="14" y="146" fill="#cbd5e1" font-size="10">  - Bordure de vissage : 3,5 à 4,0 mm (Lamages et assise vis M4)</text>
      <text x="14" y="162" fill="#cbd5e1" font-size="10">  - Languette de feuillure : 2,0 mm d'épaisseur</text>
    </g>
  </g>

  <!-- ========================================== -->
  <!-- PANEL 3 : TABLEAU COMPARATIF & GAINS (DROITE) -->
  <!-- ========================================== -->
  <g transform="translate(830, 100)">
    <rect width="340" height="680" rx="10" fill="#1e293b" stroke="#334155" stroke-width="1.2"/>
    <rect width="340" height="36" rx="10" fill="#334155" fill-opacity="0.6"/>
    <text x="16" y="24" fill="#f8fafc" font-size="13" font-weight="700">PANEL 3 : SYNTHÈSE &amp; AVANTAGES SOLUTION C</text>

    <!-- Tableau synthétique des métriques -->
    <g transform="translate(16, 50)">
      <!-- Ligne 1 -->
      <rect x="0" y="0" width="308" height="60" rx="6" fill="#0f172a" stroke="#334155" stroke-width="1"/>
      <text x="12" y="20" fill="#38bdf8" font-size="11" font-weight="700">RIGIDITÉ EN LACET (ROBOT FERMÉ)</text>
      <text x="12" y="38" fill="#10b981" font-size="13" font-weight="800">0,03 deg sous 36 N.m (Optimal)</text>
      <text x="12" y="52" fill="#94a3b8" font-size="9">Tube fermé équivalent monocoque de Bredt</text>

      <!-- Ligne 2 -->
      <rect x="0" y="70" width="308" height="60" rx="6" fill="#0f172a" stroke="#334155" stroke-width="1"/>
      <text x="12" y="20" fill="#38bdf8" font-size="11" font-weight="700">BILAN MASSIQUE AJOUTÉ</text>
      <text x="12" y="38" fill="#fbbf24" font-size="13" font-weight="800">+115 g (Ceinture) + 40 g (Vis)</text>
      <text x="12" y="52" fill="#94a3b8" font-size="9">2x plus léger que ceinture 6 mm (233 g)</text>

      <!-- Ligne 3 -->
      <rect x="0" y="140" width="308" height="60" rx="6" fill="#0f172a" stroke="#334155" stroke-width="1"/>
      <text x="12" y="20" fill="#38bdf8" font-size="11" font-weight="700">FABRICATION &amp; ATELIER</text>
      <text x="12" y="38" fill="#f8fafc" font-size="12" font-weight="700">Zéro taraudage | Trous lisses</text>
      <text x="12" y="52" fill="#cbd5e1" font-size="9">Jet d'eau 2D + Hex pocket Nylstop M4</text>

      <!-- Ligne 4 -->
      <rect x="0" y="210" width="308" height="60" rx="6" fill="#0f172a" stroke="#334155" stroke-width="1"/>
      <text x="12" y="20" fill="#38bdf8" font-size="11" font-weight="700">ESTHÉTIQUE EXTÉRIEURE</text>
      <text x="12" y="38" fill="#10b981" font-size="12" font-weight="700">100 % Invisible de l'extérieur</text>
      <text x="12" y="52" fill="#94a3b8" font-size="9">Joint parfait affleurant sans vis apparente</text>

      <!-- Ligne 5 -->
      <rect x="0" y="280" width="308" height="60" rx="6" fill="#0f172a" stroke="#334155" stroke-width="1"/>
      <text x="12" y="20" fill="#38bdf8" font-size="11" font-weight="700">MAINTENABILITÉ / BATTERIE</text>
      <text x="12" y="38" fill="#f8fafc" font-size="12" font-weight="700">Dépose P2 seule pour batterie</text>
      <text x="12" y="52" fill="#cbd5e1" font-size="9">P1 Pectoral reste vissé lors du swap batterie</text>
    </g>

    <!-- Checklist finale Panel 3 -->
    <g transform="translate(16, 410)">
      <rect width="308" height="254" rx="6" fill="#0f172a" stroke="#10b981" stroke-width="1.2"/>
      <text x="14" y="24" fill="#10b981" font-size="12" font-weight="800">CHECKLIST VALIDATION CAO :</text>
      <text x="14" y="50" fill="#f8fafc" font-size="10">☑ Découper le berceau violet à Z = 1235 mm</text>
      <text x="14" y="72" fill="#f8fafc" font-size="10">☑ Intégrer les 6 œillets internes dans C1 &amp; C2</text>
      <text x="14" y="94" fill="#f8fafc" font-size="10">☑ Modéliser les Hex Pockets 7 mm sous C2</text>
      <text x="14" y="116" fill="#f8fafc" font-size="10">☑ Découper la ceinture alu 3 mm (DXF 2D)</text>
      <text x="14" y="138" fill="#f8fafc" font-size="10">☑ Scinder Plastron bleu en P1 (haut) &amp; P2 (bas)</text>
      <text x="14" y="160" fill="#f8fafc" font-size="10">☑ Épaissir la peau du plastron à 2,5 mm</text>
      <text x="14" y="182" fill="#f8fafc" font-size="10">☑ Cadre de feuillure 3,5 mm avec vis BHC M4</text>
      <text x="14" y="204" fill="#f8fafc" font-size="10">☑ Vérifier passage du tiroir batterie avant</text>
      <text x="14" y="230" fill="#38bdf8" font-size="10" font-weight="700">➔ ARCHITECTURE 100% INDUSTRIELLE</text>
    </g>
  </g>
</svg>
