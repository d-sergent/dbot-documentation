<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 980" width="1440" height="980">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090d16"/>
      <stop offset="55%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#0b1120"/>
    </linearGradient>
    <linearGradient id="panelGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" stop-opacity="0.96"/>
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0.96"/>
    </linearGradient>
    <linearGradient id="aluOrange" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#c2410c"/>
      <stop offset="50%" stop-color="#ea580c"/>
      <stop offset="100%" stop-color="#f97316"/>
    </linearGradient>
    <linearGradient id="aluAmber" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#b45309"/>
      <stop offset="50%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#d97706"/>
    </linearGradient>
    <linearGradient id="aluBlue" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#1e3a8a"/>
      <stop offset="50%" stop-color="#2563eb"/>
      <stop offset="100%" stop-color="#1d4ed8"/>
    </linearGradient>
    <linearGradient id="steelGreen" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#15803d"/>
      <stop offset="50%" stop-color="#22c55e"/>
      <stop offset="100%" stop-color="#16a34a"/>
    </linearGradient>
    <linearGradient id="paViolet" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#5b21b6"/>
      <stop offset="50%" stop-color="#7c3aed"/>
      <stop offset="100%" stop-color="#6d28d9"/>
    </linearGradient>
    <linearGradient id="motorSlate" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#334155"/>
      <stop offset="50%" stop-color="#475569"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
    <pattern id="gridPat" width="30" height="30" patternUnits="userSpaceOnUse">
      <path d="M 30 0 L 0 0 0 30" fill="none" stroke="#334155" stroke-width="0.55" stroke-opacity="0.28"/>
    </pattern>
    <pattern id="hatchWaste" width="10" height="10" patternTransform="rotate(45 0 0)" patternUnits="userSpaceOnUse">
      <line x1="0" y1="0" x2="0" y2="10" stroke="#ef4444" stroke-width="1.6" stroke-opacity="0.55"/>
    </pattern>
    <marker id="arrCyan" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <polygon points="0 1, 8 4, 0 7" fill="#38bdf8"/>
    </marker>
    <marker id="arrRed" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <polygon points="0 1, 8 4, 0 7" fill="#ef4444"/>
    </marker>
    <marker id="arrAmber" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <polygon points="0 1, 8 4, 0 7" fill="#f59e0b"/>
    </marker>
    <marker id="arrGreen" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <polygon points="0 1, 8 4, 0 7" fill="#10b981"/>
    </marker>
    <filter id="cardShadow" x="-8%" y="-8%" width="116%" height="116%">
      <feDropShadow dx="0" dy="5" stdDeviation="6" flood-color="#000000" flood-opacity="0.55"/>
    </filter>
  </defs>
  <rect width="1440" height="980" fill="url(#bgGrad)"/>
  <rect width="1440" height="980" fill="url(#gridPat)"/>
  <g transform="translate(30, 22)">
    <rect width="1380" height="74" rx="12" fill="#1e293b" stroke="#3b82f6" stroke-width="1.5" filter="url(#cardShadow)"/>
    <circle cx="42" cy="37" r="20" fill="#38bdf8" fill-opacity="0.18" stroke="#38bdf8" stroke-width="2"/>
    <text x="42" y="44" font-family="Arial, sans-serif" font-size="19" font-weight="bold" fill="#38bdf8" text-anchor="middle">+</text>
    <text x="76" y="31" font-family="Arial, sans-serif" font-size="18" font-weight="bold" fill="#f8fafc">SEMELLE ÉCLISSE &amp; INSERT 15° : IMBRICATION 7075 &amp; FHC M4×30 [92125A220]</text>
    <text x="76" y="54" font-family="Arial, sans-serif" font-size="12" fill="#94a3b8">Option B validée : Semelle 100 % pleine (158,32 g) + Insert Ø 35 traversant (85,71 g) + 4× FHC M4×30 + Nylstop [93625A150]</text>
    <rect x="1086" y="19" width="270" height="36" rx="8" fill="#0f172a" stroke="#10b981" stroke-width="1.3"/>
    <text x="1221" y="42" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#10b981" text-anchor="middle">OPTION B VALIDÉE (v42)</text>
  </g>

  <!-- PANEL 1 : 2D NESTING 160x160 -->
  <g transform="translate(30, 114)">
    <rect width="675" height="400" rx="12" fill="url(#panelGrad)" stroke="#334155" stroke-width="1.3" filter="url(#cardShadow)"/>
    <text x="18" y="30" font-family="Arial, sans-serif" font-size="13" font-weight="bold" fill="#38bdf8">1. DÉCOUPE 2D DANS BRUT 5×160×160 mm (SEMELLE PLEINE)</text>

    <!-- Left Drawing x=48..290 -->
    <rect x="44" y="64" width="244" height="288" rx="4" fill="#090e1a" stroke="#64748b" stroke-dasharray="5,3" stroke-width="1.4"/>
    <text x="166" y="56" font-family="Arial, sans-serif" font-size="10.5" fill="#94a3b8" text-anchor="middle">Brut 5 × 160 × 160 mm Alu 7075-T6</text>

    <!-- Semelle shape matching semelle_eclisse_face.png (chamfered corners, left semi-circles, 2 slots, 4 FHC M4, 4 M5) -->
    <path d="M 102 82 L 236 82 L 258 104 L 258 310 L 236 332 L 102 332 L 80 310 L 80 264 A 18 18 0 0 0 80 228 L 80 186 A 18 18 0 0 0 80 150 L 80 104 Z" fill="url(#aluBlue)" stroke="#38bdf8" stroke-width="2"/>
    <!-- 2 rectangular cable cutouts -->
    <rect x="148" y="96" width="38" height="24" rx="5" fill="#090e1a" stroke="#38bdf8"/>
    <rect x="148" y="294" width="38" height="24" rx="5" fill="#090e1a" stroke="#38bdf8"/>
    <!-- 4 FHC M4 holes tilted -->
    <circle cx="150" cy="154" r="5" fill="#facc15" stroke="#fff"/>
    <circle cx="218" cy="176" r="5" fill="#facc15" stroke="#fff"/>
    <circle cx="122" cy="238" r="5" fill="#facc15" stroke="#fff"/>
    <circle cx="192" cy="258" r="5" fill="#facc15" stroke="#fff"/>
    <text x="168" y="206" font-family="Arial, sans-serif" font-size="10.5" font-weight="bold" fill="#fff" text-anchor="middle">SEMELLE ÉCLISSE</text>
    <text x="168" y="222" font-family="Arial, sans-serif" font-size="9.5" fill="#bfdbfe" text-anchor="middle">100×130×5 (158,32 g)</text>
    <text x="166" y="374" font-family="Arial, sans-serif" font-size="10.5" font-weight="bold" fill="#34d399" text-anchor="middle">Semelle 100 % PLEINE sous l'insert</text>

    <!-- Right Text Box x=316..655 -->
    <rect x="316" y="54" width="340" height="324" rx="8" fill="#0f172a" stroke="#334155"/>
    <text x="332" y="80" font-family="Arial, sans-serif" font-size="11.5" font-weight="bold" fill="#34d399">AVANTAGES SEMELLE PLEINE :</text>
    <text x="332" y="106" font-family="Arial, sans-serif" font-size="11" fill="#cbd5e1">• Plan d'appui continu 100 % rigide.</text>
    <text x="332" y="130" font-family="Arial, sans-serif" font-size="11" fill="#cbd5e1">• Obture naturellement l'alésage Ø 35 de l'insert.</text>
    <text x="332" y="154" font-family="Arial, sans-serif" font-size="11" fill="#cbd5e1">• Zéro affaiblissement au droit des vis FHC M4.</text>
    <text x="332" y="178" font-family="Arial, sans-serif" font-size="11" fill="#cbd5e1">• 4 fraisures coniques 90° à fleur (Face AR).</text>
    <line x1="332" y1="198" x2="640" y2="198" stroke="#334155"/>
    <text x="332" y="224" font-family="Arial, sans-serif" font-size="11.5" font-weight="bold" fill="#38bdf8">RÉSUMÉ USINAGE CNC C500 :</text>
    <text x="332" y="250" font-family="Arial, sans-serif" font-size="11" fill="#cbd5e1">• 4× Trous lisses M5 [90348A023] + 4× Goupilles Ø 3</text>
    <text x="332" y="274" font-family="Arial, sans-serif" font-size="11" fill="#cbd5e1">• 4× Trous FHC M4 fraisés 90° [92125A220]</text>
    <text x="332" y="298" font-family="Arial, sans-serif" font-size="11" fill="#cbd5e1">• 2× Lumières câbles oblongues 22×14 mm</text>
    <text x="332" y="322" font-family="Arial, sans-serif" font-size="11" fill="#cbd5e1">• Contournage 100×130 mm + dégagements M5</text>
  </g>

  <!-- PANEL 2 : CROSS SECTION -->
  <g transform="translate(735, 114)">
    <rect width="675" height="400" rx="12" fill="url(#panelGrad)" stroke="#10b981" stroke-width="1.3" filter="url(#cardShadow)"/>
    <text x="18" y="30" font-family="Arial, sans-serif" font-size="13" font-weight="bold" fill="#10b981">2. COUPE : INSERT 15° + Ø 35 TRAVERSANT + 4× FHC M4×30</text>

    <!-- Vertical Stack Diagram x=60..280 -->
    <!-- Semelle 5mm -->
    <rect x="82" y="82" width="24" height="256" rx="2" fill="url(#aluBlue)" stroke="#38bdf8" stroke-width="1.8"/>
    <!-- Insert 15mm (upper & lower solid walls around Ø 35mm through bore) -->
    <rect x="106" y="106" width="66" height="58" rx="2" fill="url(#aluAmber)" stroke="#fde68a" stroke-width="1.6"/>
    <rect x="106" y="254" width="66" height="58" rx="2" fill="url(#aluAmber)" stroke="#fde68a" stroke-width="1.6"/>
    <!-- Bore center -->
    <rect x="106" y="164" width="66" height="90" fill="#090e1a" stroke="#facc15" stroke-dasharray="4,3"/>
    <text x="208" y="202" font-family="Arial, sans-serif" font-size="11" font-weight="bold" fill="#facc15">ALÉSAGE TRAVERSANT</text>
    <text x="208" y="220" font-family="Arial, sans-serif" font-size="11.5" font-weight="bold" fill="#fde68a">Ø 35,0 mm (Insert 15 mm)</text>
    <line x1="172" y1="208" x2="202" y2="208" stroke="#facc15"/>

    <!-- Top & bottom FHC M4x30 bolts [92125A220] + Nylstop [93625A150] -->
    <polygon points="82,126 94,132 82,138" fill="#34d399"/>
    <line x1="88" y1="132" x2="196" y2="132" stroke="#34d399" stroke-width="2.4"/>
    <rect x="172" y="124" width="12" height="16" rx="2" fill="#facc15"/>
    <line x1="88" y1="286" x2="196" y2="286" stroke="#34d399" stroke-width="2.4"/>
    <rect x="172" y="278" width="12" height="16" rx="2" fill="#facc15"/>

    <!-- Clean Callouts outside geometry -->
    <text x="94" y="72" font-family="Arial, sans-serif" font-size="10.5" fill="#93c5fd" text-anchor="middle">Semelle 5 mm</text>
    <text x="150" y="96" font-family="Arial, sans-serif" font-size="10.5" fill="#fde68a" text-anchor="middle">Insert 85,71 g</text>
    <line x1="184" y1="132" x2="210" y2="104" stroke="#34d399"/>
    <text x="214" y="102" font-family="Arial, sans-serif" font-size="10.5" font-weight="bold" fill="#34d399">Nylstop M4 [93625A150]</text>
    <line x1="82" y1="286" x2="52" y2="318" stroke="#34d399"/>
    <text x="24" y="362" font-family="Arial, sans-serif" font-size="10.5" font-weight="bold" fill="#34d399">Vis FHC M4×30 [92125A220] (à fleur 0,0 mm)</text>

    <!-- Right Text Box x=362..655 -->
    <rect x="362" y="54" width="294" height="324" rx="8" fill="#0f172a" stroke="#10b981"/>
    <text x="378" y="80" font-family="Arial, sans-serif" font-size="11.5" font-weight="bold" fill="#34d399">BILAN GÉOMÉTRIQUE OPTION B :</text>
    <text x="378" y="108" font-family="Arial, sans-serif" font-size="10.5" fill="#cbd5e1">• Semelle Éclisse : 5,0 mm PLEINE</text>
    <text x="378" y="130" font-family="Arial, sans-serif" font-size="10.5" fill="#cbd5e1">• Alésage Insert : Ø 35,0 mm traversant</text>
    <text x="378" y="152" font-family="Arial, sans-serif" font-size="10.5" font-weight="bold" fill="#34d399">• Masse Insert v42 : 85,71 g/u</text>
    <text x="378" y="174" font-family="Arial, sans-serif" font-size="10.5" fill="#cbd5e1">• Portée Nylstop : +8,20 mm métal plein</text>
    <text x="378" y="196" font-family="Arial, sans-serif" font-size="10.5" fill="#cbd5e1">• Visserie : 4× FHC M4×30 [92125A220]</text>
    <text x="388" y="214" font-family="Arial, sans-serif" font-size="10.5" fill="#cbd5e1">+ 4× Écrous Nylstop M4 [93625A150]</text>
    <line x1="378" y1="234" x2="640" y2="234" stroke="#334155"/>
    <text x="378" y="258" font-family="Arial, sans-serif" font-size="11.5" font-weight="bold" fill="#38bdf8">USINAGE C500 EN 1 PASSE :</text>
    <text x="378" y="284" font-family="Arial, sans-serif" font-size="10.5" fill="#cbd5e1">• Contournage 55,8×55,8 (encombr. 67,01)</text>
    <text x="378" y="306" font-family="Arial, sans-serif" font-size="10.5" fill="#cbd5e1">• Alésage débouchant Ø 35 mm</text>
    <text x="378" y="328" font-family="Arial, sans-serif" font-size="10.5" fill="#cbd5e1">• 4 perçages Ø 4,5 + 1 vertical Ø 5,3</text>
    <text x="378" y="350" font-family="Arial, sans-serif" font-size="10.5" font-weight="bold" fill="#34d399">• Zéro fond de poche à surfacer !</text>
  </g>

  <!-- PANEL 3 : BOTTOM FULL WIDTH INSERT FACE + PROOF -->
  <g transform="translate(30, 534)">
    <rect width="1380" height="416" rx="12" fill="url(#panelGrad)" stroke="#f59e0b" stroke-width="1.3" filter="url(#cardShadow)"/>
    <text x="20" y="30" font-family="Arial, sans-serif" font-size="13" font-weight="bold" fill="#f59e0b">3. INSERT 15° (55,8×55,8 mm / BBOX 67,01×67,01 mm) : PORTÉE 100 % NYLSTOP</text>

    <!-- Left 15 deg rotated Insert matching Insert_face.png -->
    <g transform="translate(220, 224) rotate(15)">
      <rect x="-112" y="-112" width="224" height="224" rx="12" fill="url(#steelGreen)" fill-opacity="0.32" stroke="#86efac" stroke-width="2.2"/>
      <circle cx="0" cy="0" r="70" fill="#090e1a" stroke="#facc15" stroke-width="2.2"/>
      <circle cx="-84" cy="-84" r="10" fill="#0f172a" stroke="#34d399" stroke-width="2"/>
      <circle cx="84" cy="-84" r="10" fill="#0f172a" stroke="#34d399" stroke-width="2"/>
      <circle cx="-84" cy="84" r="10" fill="#0f172a" stroke="#34d399" stroke-width="2"/>
      <circle cx="84" cy="84" r="10" fill="#0f172a" stroke="#34d399" stroke-width="2"/>
      <text x="0" y="-8" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#facc15" text-anchor="middle">ALÉSAGE Ø 35,0 mm</text>
      <text x="0" y="14" font-family="Arial, sans-serif" font-size="10.5" fill="#fde68a" text-anchor="middle">Paroi min. = 10,40 mm</text>
    </g>
    <text x="220" y="72" font-family="Arial, sans-serif" font-size="11" font-weight="bold" fill="#86efac" text-anchor="middle">Incliné 15° (Insert_face.png)</text>
    <text x="220" y="392" font-family="Arial, sans-serif" font-size="11" font-weight="bold" fill="#cbd5e1" text-anchor="middle">Entraxe FHC M4 = 42 × 42 mm | M5×70 vertical centré</text>

    <!-- Right geometric proof card x=450..1356 -->
    <rect x="450" y="54" width="906" height="338" rx="8" fill="#0f172a" stroke="#10b981"/>
    <text x="472" y="84" font-family="Arial, sans-serif" font-size="12.5" font-weight="bold" fill="#34d399">VÉRIFICATION GÉOMÉTRIQUE OPTION B : APPUI 100 % MASSIF DES ÉCROUS NYLSTOP</text>
    <text x="472" y="116" font-family="Arial, sans-serif" font-size="11.5" fill="#e2e8f0">1. Distance radiale des 4 vis M4 : R_vis = sqrt(21^2 + 21^2) = 29,70 mm.</text>
    <text x="472" y="144" font-family="Arial, sans-serif" font-size="11.5" fill="#e2e8f0">2. Rayon de l'alésage traversant Ø 35 mm : R_trou = 17,50 mm.</text>
    <text x="472" y="172" font-family="Arial, sans-serif" font-size="11.5" fill="#e2e8f0">3. Distance nette bord du trou -&gt; axe vis : 29,70 - 17,50 = 12,20 mm.</text>
    <text x="472" y="200" font-family="Arial, sans-serif" font-size="11.5" font-weight="bold" fill="#a7f3d0">4. Portée nette sous écrou Nylstop M4 (rayon 4,0 mm) : 12,20 - 4,00 = +8,20 mm d'Alu 7075-T6 continu !</text>
    <text x="472" y="228" font-family="Arial, sans-serif" font-size="11.5" fill="#e2e8f0">5. Épaisseur minimale de paroi aux 4 faces : 27,90 - 17,50 = 10,40 mm (reprise 120 N.m par contact carré).</text>

    <rect x="470" y="258" width="866" height="114" rx="6" fill="#064e3b" stroke="#10b981"/>
    <text x="488" y="284" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#a7f3d0">RÉSUMÉ QUINCAILLERIE &amp; SOURCING CERTIFIÉ (TORSE-123 v42) :</text>
    <text x="488" y="310" font-family="Arial, sans-serif" font-size="11.5" fill="#e2e8f0">• Vis (8× total Torse G+D) : FHC M4 × 30 mm (ISO 10642) — McMaster [92125A220] (couple 3,0 N.m + Loctite 243).</text>
    <text x="488" y="334" font-family="Arial, sans-serif" font-size="11.5" fill="#e2e8f0">• Écrous autofreinés M4 (DIN 985) — McMaster [93625A150] (pénétration engagée 10 mm au-dessus semelle).</text>
    <text x="488" y="358" font-family="Arial, sans-serif" font-size="11.5" fill="#fde68a">• Verrouillage Tube 60×60×2 : Vis CHC M5 × 70 mm [91290A272] + Nylstop M5 [93625A200].</text>
  </g>
</svg>