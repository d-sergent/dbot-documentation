<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1380 680" width="1380" height="680">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090d16"/>
      <stop offset="55%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#0b1120"/>
    </linearGradient>
    <linearGradient id="panelGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" stop-opacity="0.96"/>
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0.96"/>
    </linearGradient>
    <linearGradient id="aluOrange" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#c2410c"/>
      <stop offset="50%" stop-color="#ea580c"/>
      <stop offset="100%" stop-color="#f97316"/>
    </linearGradient>
    <linearGradient id="aluAmber" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#b45309"/>
      <stop offset="50%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#d97706"/>
    </linearGradient>
    <linearGradient id="aluBlue" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#1e3a8a"/>
      <stop offset="50%" stop-color="#2563eb"/>
      <stop offset="100%" stop-color="#1d4ed8"/>
    </linearGradient>
    <linearGradient id="steelGreen" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#15803d"/>
      <stop offset="50%" stop-color="#22c55e"/>
      <stop offset="100%" stop-color="#16a34a"/>
    </linearGradient>
    <linearGradient id="paViolet" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#5b21b6"/>
      <stop offset="50%" stop-color="#7c3aed"/>
      <stop offset="100%" stop-color="#6d28d9"/>
    </linearGradient>
    <linearGradient id="motorSlate" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#334155"/>
      <stop offset="50%" stop-color="#475569"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
    <pattern id="gridPat" width="30" height="30" patternUnits="userSpaceOnUse">
      <path d="M 30 0 L 0 0 0 30" fill="none" stroke="#334155" stroke-width="0.55" stroke-opacity="0.28"/>
    </pattern>
    <pattern id="hatchWaste" width="10" height="10" patternTransform="rotate(45 0 0)" patternUnits="userSpaceOnUse">
      <line x1="0" y1="0" x2="0" y2="10" stroke="#ef4444" stroke-width="1.6" stroke-opacity="0.55"/>
    </pattern>
    <marker id="arrCyan" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <polygon points="0 1, 8 4, 0 7" fill="#38bdf8"/>
    </marker>
    <marker id="arrRed" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <polygon points="0 1, 8 4, 0 7" fill="#ef4444"/>
    </marker>
    <marker id="arrAmber" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <polygon points="0 1, 8 4, 0 7" fill="#f59e0b"/>
    </marker>
    <marker id="arrGreen" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <polygon points="0 1, 8 4, 0 7" fill="#10b981"/>
    </marker>
    <filter id="cardShadow" x="-8%" y="-8%" width="116%" height="116%">
      <feDropShadow dx="0" dy="5" stdDeviation="6" flood-color="#000000" flood-opacity="0.55"/>
    </filter>
  </defs>
  <rect width="1380" height="680" fill="url(#bgGrad)"/>
  <rect width="1380" height="680" fill="url(#gridPat)"/>
  <g transform="translate(30, 22)">
    <rect width="1320" height="74" rx="12" fill="#1e293b" stroke="#3b82f6" stroke-width="1.5" filter="url(#cardShadow)"/>
    <circle cx="42" cy="37" r="20" fill="#f59e0b" fill-opacity="0.18" stroke="#f59e0b" stroke-width="2"/>
    <text x="42" y="44" font-family="Arial, sans-serif" font-size="19" font-weight="bold" fill="#f59e0b" text-anchor="middle">+</text>
    <text x="76" y="31" font-family="Arial, sans-serif" font-size="18" font-weight="bold" fill="#f8fafc">IMBRICATION INSERTS 15° DANS BRUT 15×80×80 mm ALU 7075-T6 (OPTION B)</text>
    <text x="76" y="54" font-family="Arial, sans-serif" font-size="12" fill="#94a3b8">Alésage traversant Ø 35,0 mm (Insert 85,71 g/u | Section 55,8×55,8 mm | BBox 67,01×67,01 mm à 15°)</text>
    <rect x="1026" y="19" width="270" height="36" rx="8" fill="#0f172a" stroke="#f59e0b" stroke-width="1.3"/>
    <text x="1161" y="42" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#f59e0b" text-anchor="middle">2× BRUTS 15×80×80 | 7,20 EUR/u</text>
  </g>

  <!-- PANEL 1 : 2D NESTING -->
  <g transform="translate(30, 114)">
    <rect width="420" height="536" rx="12" fill="url(#panelGrad)" stroke="#f59e0b" stroke-width="1.3" filter="url(#cardShadow)"/>
    <text x="18" y="30" font-family="Arial, sans-serif" font-size="13" font-weight="bold" fill="#38bdf8">1. IMBRICATION DANS BRUT 80×80 mm</text>

    <text x="210" y="64" font-family="Arial, sans-serif" font-size="11" fill="#94a3b8" text-anchor="middle">Brut Blockenstock 15 × 80 × 80 mm</text>
    <!-- 240x240 outer square centered at (210, 210) -->
    <rect x="90" y="84" width="240" height="240" rx="4" fill="#090e1a" stroke="#64748b" stroke-dasharray="5,3" stroke-width="1.5"/>
    <!-- 168x168 inner insert centered at (210, 204) -->
    <rect x="126" y="120" width="168" height="168" rx="8" fill="url(#aluAmber)" fill-opacity="0.28" stroke="#fde68a" stroke-width="2.2"/>
    <circle cx="210" cy="204" r="54" fill="#090e1a" stroke="#facc15" stroke-width="2"/>
    <text x="210" y="198" font-family="Arial, sans-serif" font-size="11" font-weight="bold" fill="#facc15" text-anchor="middle">Alésage Ø 35,0 mm</text>
    <text x="210" y="216" font-family="Arial, sans-serif" font-size="10" fill="#fde68a" text-anchor="middle">Traversant</text>

    <!-- 4 corner FHC holes -->
    <circle cx="146" cy="140" r="6" fill="#34d399" stroke="#fff"/>
    <circle cx="274" cy="140" r="6" fill="#34d399" stroke="#fff"/>
    <circle cx="146" cy="268" r="6" fill="#34d399" stroke="#fff"/>
    <circle cx="274" cy="268" r="6" fill="#34d399" stroke="#fff"/>

    <!-- Margin callouts OUTSIDE insert -->
    <text x="108" y="208" font-family="Arial, sans-serif" font-size="10" fill="#94a3b8" text-anchor="middle">12,1</text>
    <text x="312" y="208" font-family="Arial, sans-serif" font-size="10" fill="#94a3b8" text-anchor="middle">12,1</text>

    <!-- Clean bottom dimension bars -->
    <line x1="126" y1="346" x2="294" y2="346" stroke="#fde68a" stroke-width="1.5"/>
    <text x="210" y="364" font-family="Arial, sans-serif" font-size="11" font-weight="bold" fill="#fde68a" text-anchor="middle">Insert 55,8 × 55,8 mm (BBox 15° = 67,01 mm)</text>
    <line x1="90" y1="382" x2="330" y2="382" stroke="#94a3b8" stroke-width="1.5"/>
    <text x="210" y="400" font-family="Arial, sans-serif" font-size="11" fill="#cbd5e1" text-anchor="middle">Brut 80,0 × 80,0 mm (marge bridage OK)</text>

    <rect x="24" y="424" width="372" height="90" rx="8" fill="#0f172a" stroke="#34d399"/>
    <text x="210" y="454" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#34d399" text-anchor="middle">1 bloc / insert — 2 blocs requis (Épaules)</text>
    <text x="210" y="478" font-family="Arial, sans-serif" font-size="11" fill="#e2e8f0" text-anchor="middle">Blockenstock 15×80×80 mm Alu 7075-T6</text>
    <text x="210" y="498" font-family="Arial, sans-serif" font-size="11" font-weight="bold" fill="#fde68a" text-anchor="middle">~7,20 EUR / bloc -&gt; ~14,40 EUR total</text>
  </g>

  <!-- PANEL 2 : CUT 15.0 + COMPARISON TABLE -->
  <g transform="translate(470, 114)">
    <rect width="440" height="536" rx="12" fill="url(#panelGrad)" stroke="#38bdf8" stroke-width="1.3" filter="url(#cardShadow)"/>
    <text x="18" y="30" font-family="Arial, sans-serif" font-size="13" font-weight="bold" fill="#38bdf8">2. COTATION 15,0 mm &amp; COMPARATIF A vs B</text>

    <!-- Section rectangle 240x84 centered -->
    <rect x="100" y="84" width="240" height="84" rx="4" fill="url(#aluAmber)" fill-opacity="0.35" stroke="#fde68a" stroke-width="2"/>
    <line x1="158" y1="84" x2="158" y2="168" stroke="#facc15" stroke-dasharray="4,3"/>
    <line x1="282" y1="84" x2="282" y2="168" stroke="#facc15" stroke-dasharray="4,3"/>
    <text x="220" y="120" font-family="Arial, sans-serif" font-size="11.5" font-weight="bold" fill="#facc15" text-anchor="middle">ALÉSAGE Ø 35,0 mm</text>
    <text x="220" y="140" font-family="Arial, sans-serif" font-size="10.5" fill="#fde68a" text-anchor="middle">(Traversant h = 15,0 mm)</text>

    <!-- Vertical thickness dimension left -->
    <line x1="74" y1="84" x2="74" y2="168" stroke="#f8fafc" stroke-width="1.5"/>
    <text x="58" y="130" font-family="Arial, sans-serif" font-size="11" font-weight="bold" fill="#f8fafc" text-anchor="end">15,0</text>

    <!-- M5x70 hole on left/right axis placed cleanly BELOW box -->
    <line x1="220" y1="68" x2="220" y2="188" stroke="#ef4444" stroke-width="2" stroke-dasharray="4,2"/>
    <text x="220" y="206" font-family="Arial, sans-serif" font-size="10.5" font-weight="bold" fill="#fca5a5" text-anchor="middle">Vis M5×70 [91290A272] à X = 7,5 mm (paroi Ø 5,3)</text>
    <text x="220" y="230" font-family="Arial, sans-serif" font-size="10.5" fill="#94a3b8" text-anchor="middle">Cotation brute = 55,8 × 15,0 mm (aucun surfaçage Z)</text>

    <!-- Proper SVG Table (y=260..512) -->
    <rect x="20" y="256" width="400" height="258" rx="8" fill="#0f172a" stroke="#334155"/>
    <text x="34" y="282" font-family="Arial, sans-serif" font-size="11.5" font-weight="bold" fill="#f8fafc">Comparatif Insert Option A vs Option B</text>
    <line x1="30" y1="294" x2="408" y2="294" stroke="#334155"/>
    <text x="34" y="316" font-family="Arial, sans-serif" font-size="10.5" font-weight="bold" fill="#94a3b8">Paramètre</text>
    <text x="166" y="316" font-family="Arial, sans-serif" font-size="10.5" font-weight="bold" fill="#fca5a5">Opt A (Borgne)</text>
    <text x="292" y="316" font-family="Arial, sans-serif" font-size="10.5" font-weight="bold" fill="#34d399">Opt B (Ø 35)</text>
    <line x1="30" y1="326" x2="408" y2="326" stroke="#1e293b"/>

    <text x="34" y="354" font-family="Arial, sans-serif" font-size="11" fill="#e2e8f0">Masse unitaire</text>
    <text x="166" y="354" font-family="Arial, sans-serif" font-size="11" fill="#cbd5e1">~99 g</text>
    <text x="292" y="354" font-family="Arial, sans-serif" font-size="11" font-weight="bold" fill="#34d399">85,71 g (v42)</text>

    <text x="34" y="388" font-family="Arial, sans-serif" font-size="11" fill="#e2e8f0">Usinage fond</text>
    <text x="166" y="388" font-family="Arial, sans-serif" font-size="11" fill="#cbd5e1">Poche 10 mm</text>
    <text x="292" y="388" font-family="Arial, sans-serif" font-size="11" font-weight="bold" fill="#34d399">Débouchant 1 pas</text>

    <text x="34" y="422" font-family="Arial, sans-serif" font-size="11" fill="#e2e8f0">Sf torsion (120 N.m)</text>
    <text x="166" y="422" font-family="Arial, sans-serif" font-size="11" fill="#cbd5e1">&gt; 10</text>
    <text x="292" y="422" font-family="Arial, sans-serif" font-size="11" font-weight="bold" fill="#34d399">&gt; 10 (Paroi 10,4)</text>

    <text x="34" y="456" font-family="Arial, sans-serif" font-size="11" fill="#e2e8f0">Portée Nylstop</text>
    <text x="166" y="456" font-family="Arial, sans-serif" font-size="11" fill="#cbd5e1">+8,20 mm</text>
    <text x="292" y="456" font-family="Arial, sans-serif" font-size="11" font-weight="bold" fill="#34d399">+8,20 mm plein</text>

    <text x="34" y="490" font-family="Arial, sans-serif" font-size="11" fill="#e2e8f0">Fond fermé par</text>
    <text x="166" y="490" font-family="Arial, sans-serif" font-size="11" fill="#cbd5e1">Plancher 5 mm</text>
    <text x="292" y="490" font-family="Arial, sans-serif" font-size="11" font-weight="bold" fill="#34d399">Semelle 5 mm</text>
  </g>

  <!-- PANEL 3 : SYNTHESE -->
  <g transform="translate(930, 114)">
    <rect width="420" height="536" rx="12" fill="url(#panelGrad)" stroke="#10b981" stroke-width="1.3" filter="url(#cardShadow)"/>
    <text x="18" y="30" font-family="Arial, sans-serif" font-size="13" font-weight="bold" fill="#10b981">3. SYNTHÈSE MATIÈRE &amp; USINAGE C500</text>

    <rect x="20" y="52" width="380" height="148" rx="8" fill="#0f172a" stroke="#10b981"/>
    <text x="34" y="78" font-family="Arial, sans-serif" font-size="11.5" font-weight="bold" fill="#34d399">AVANTAGES OPTION B (Ø 35 TRAVERSANT)</text>
    <text x="34" y="104" font-family="Arial, sans-serif" font-size="11" fill="#cbd5e1">• Zéro fond de poche à surfacer sur C500.</text>
    <text x="34" y="128" font-family="Arial, sans-serif" font-size="11" fill="#cbd5e1">• Découpe 2D directe par interpolation hélicoïdale.</text>
    <text x="34" y="152" font-family="Arial, sans-serif" font-size="11" fill="#cbd5e1">• Allègement : 85,71 g/u (171,42 g la paire v42).</text>
    <text x="34" y="176" font-family="Arial, sans-serif" font-size="11" fill="#cbd5e1">• Obturation totale par semelle éclisse 5 mm.</text>

    <rect x="20" y="216" width="380" height="148" rx="8" fill="#0f172a" stroke="#38bdf8"/>
    <text x="34" y="242" font-family="Arial, sans-serif" font-size="11.5" font-weight="bold" fill="#38bdf8">INTÉGRITÉ STRUCTURALE GARANTIE</text>
    <text x="34" y="268" font-family="Arial, sans-serif" font-size="11" fill="#cbd5e1">• Colonne vertébrale : 100 % pleine (489,50 g).</text>
    <text x="34" y="292" font-family="Arial, sans-serif" font-size="11" fill="#cbd5e1">• Écrous Nylstop [93625A150] : portée +8,2 mm.</text>
    <text x="34" y="316" font-family="Arial, sans-serif" font-size="11" fill="#cbd5e1">• Paroi résiduelle : 10,40 mm sur les 4 faces.</text>
    <text x="34" y="340" font-family="Arial, sans-serif" font-size="11" fill="#cbd5e1">• Transmission torsion 120 N.m sans fluage.</text>

    <rect x="20" y="380" width="380" height="134" rx="8" fill="#0f172a" stroke="#f59e0b"/>
    <text x="34" y="406" font-family="Arial, sans-serif" font-size="11.5" font-weight="bold" fill="#fde68a">SOURCING BLOCKENSTOCK 7075-T6</text>
    <text x="34" y="432" font-family="Arial, sans-serif" font-size="11" fill="#cbd5e1">• 2× Blocs 15×80×80 mm Alu 7075 (~14,40 EUR)</text>
    <text x="34" y="456" font-family="Arial, sans-serif" font-size="11" fill="#cbd5e1">• 2× Plaques 5×160×160 mm (~19,20 EUR)</text>
    <text x="34" y="480" font-family="Arial, sans-serif" font-size="11" fill="#cbd5e1">• 1× Plat 5×100×495 mm Colonne (~18,16 EUR)</text>
  </g>
</svg>