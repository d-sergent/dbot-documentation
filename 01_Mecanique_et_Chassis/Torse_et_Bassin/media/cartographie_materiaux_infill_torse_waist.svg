<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1620 1020" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090d16"/>
      <stop offset="55%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#0b1120"/>
    </linearGradient>
    <linearGradient id="panelGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" stop-opacity="0.96"/>
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0.96"/>
    </linearGradient>
    <linearGradient id="aluOrange" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#c2410c"/>
      <stop offset="50%" stop-color="#ea580c"/>
      <stop offset="100%" stop-color="#f97316"/>
    </linearGradient>
    <linearGradient id="aluAmber" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#b45309"/>
      <stop offset="50%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#d97706"/>
    </linearGradient>
    <linearGradient id="aluBlue" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#1e3a8a"/>
      <stop offset="50%" stop-color="#2563eb"/>
      <stop offset="100%" stop-color="#1d4ed8"/>
    </linearGradient>
    <linearGradient id="steelGreen" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#15803d"/>
      <stop offset="50%" stop-color="#22c55e"/>
      <stop offset="100%" stop-color="#16a34a"/>
    </linearGradient>
    <linearGradient id="paViolet" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#5b21b6"/>
      <stop offset="50%" stop-color="#7c3aed"/>
      <stop offset="100%" stop-color="#6d28d9"/>
    </linearGradient>
    <linearGradient id="motorSlate" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#334155"/>
      <stop offset="50%" stop-color="#475569"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
    <pattern id="gridPat" width="30" height="30" patternUnits="userSpaceOnUse">
      <path d="M 30 0 L 0 0 0 30" fill="none" stroke="#334155" stroke-width="0.55" stroke-opacity="0.28"/>
    </pattern>
    <marker id="arrCyan" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <polygon points="0 1, 8 4, 0 7" fill="#38bdf8"/>
    </marker>
    <marker id="arrRed" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <polygon points="0 1, 8 4, 0 7" fill="#ef4444"/>
    </marker>
    <marker id="arrAmber" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <polygon points="0 1, 8 4, 0 7" fill="#f59e0b"/>
    </marker>
    <marker id="arrGreen" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <polygon points="0 1, 8 4, 0 7" fill="#10b981"/>
    </marker>
    <filter id="cardShadow" x="-8%" y="-8%" width="116%" height="116%">
      <feDropShadow dx="0" dy="5" stdDeviation="6" flood-color="#000000" flood-opacity="0.55"/>
    </filter>
  </defs>
  <rect width="1620" height="1020" fill="url(#bgGrad)"/>
  <rect width="1620" height="1020" fill="url(#gridPat)"/>
  <g transform="translate(30, 22)">
    <rect width="1560" height="74" rx="12" fill="#1e293b" stroke="#3b82f6" stroke-width="1.5" filter="url(#cardShadow)"/>
    <circle cx="42" cy="37" r="20" fill="#38bdf8" fill-opacity="0.18" stroke="#38bdf8" stroke-width="2"/>
    <text x="42" y="44" font-family="Arial, sans-serif" font-size="20" font-weight="bold" fill="#38bdf8" text-anchor="middle">M</text>
    <text x="78" y="32" font-family="Arial, sans-serif" font-size="18.5" font-weight="bold" fill="#f8fafc">CARTOGRAPHIE MATÉRIAUX, INFILL PA12-CF &amp; BILAN MASSE — TORSE-123 V42</text>
    <text x="78" y="55" font-family="Arial, sans-serif" font-size="12.5" fill="#94a3b8">Alu 7075-T6 / 6060-T6 (3,60 kg) + PA12-CF (0,700 g/cm3 calibré Bassin vs 1,015 g/cm3 brut Torse) + Actionneurs</text>
    <rect x="1240" y="19" width="290" height="36" rx="8" fill="#0f172a" stroke="#34d399" stroke-width="1.2"/>
    <text x="1385" y="42" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#34d399" text-anchor="middle">18,32 KG BRUT | ~16,1 KG CAL.</text>
  </g>

  <!-- PANEL 1 : CARTE SPATIALE Z -->
  <g transform="translate(30, 114)">
    <rect width="740" height="878" rx="12" fill="url(#panelGrad)" stroke="#334155" stroke-width="1.5" filter="url(#cardShadow)"/>
    <text x="24" y="32" font-family="Arial, sans-serif" font-size="15" font-weight="bold" fill="#38bdf8">1. RÉPARTITION SPATIALE DES MATÉRIAUX (AXE Z : 714..1547 MM)</text>
    <text x="24" y="52" font-family="Arial, sans-serif" font-size="11.5" fill="#94a3b8">Séparation stricte : Alu 7075/6060 (portance primaire) vs PA12-CF (coques &amp; carénages)</text>

    <!-- Schematic Stack on Left (x=70..320) and crisp leader labels on Right (x=355..715) -->
    <!-- Center axis -->
    <line x1="195" y1="80" x2="195" y2="835" stroke="#475569" stroke-dasharray="6,4"/>

    <!-- Neck EL05 + Plaque Cou -->
    <rect x="165" y="95" width="60" height="34" rx="4" fill="url(#paViolet)" stroke="#c084fc"/>
    <text x="195" y="116" font-family="Arial, sans-serif" font-size="10" font-weight="bold" fill="#fff" text-anchor="middle">Collet</text>
    <rect x="155" y="133" width="80" height="36" rx="4" fill="url(#motorSlate)" stroke="#94a3b8"/>
    <text x="195" y="155" font-family="Arial, sans-serif" font-size="10.5" font-weight="bold" fill="#f8fafc" text-anchor="middle">EL05 (RS-05)</text>
    <rect x="135" y="173" width="120" height="16" rx="2" fill="url(#aluOrange)" stroke="#fb923c"/>
    <text x="350" y="114" font-family="Arial, sans-serif" font-size="11.5" font-weight="bold" fill="#c084fc">Cou - Tube collet (51,90 g brut | PA12-CF 1,015)</text>
    <text x="350" y="148" font-family="Arial, sans-serif" font-size="11.5" font-weight="bold" fill="#f8fafc">EL05_ASM_1_ASM : 1× RS-05 Pan (210,44 g nu)</text>
    <text x="350" y="178" font-family="Arial, sans-serif" font-size="11.5" fill="#fb923c">Plaque_de_Cou_7075 (89,63 g) + 2× Equerre cou (46,57 g)</text>
    <line x1="256" y1="181" x2="342" y2="176" stroke="#fb923c" stroke-width="1"/>

    <!-- Shoulders & Colonne -->
    <rect x="75" y="218" width="46" height="62" rx="5" fill="url(#motorSlate)" stroke="#94a3b8"/>
    <rect x="269" y="218" width="46" height="62" rx="5" fill="url(#motorSlate)" stroke="#94a3b8"/>
    <rect x="121" y="226" width="148" height="44" rx="4" fill="#1d4ed8" stroke="#60a5fa"/>
    <rect x="172" y="205" width="46" height="225" rx="3" fill="url(#aluOrange)" fill-opacity="0.85" stroke="#fb923c" stroke-width="1.4"/>
    <text x="195" y="340" font-family="Arial, sans-serif" font-size="10.5" font-weight="bold" fill="#fff" text-anchor="middle" transform="rotate(-90, 195, 340)">Colonne 7075 (489,50 g)</text>
    <text x="350" y="226" font-family="Arial, sans-serif" font-size="11.5" font-weight="bold" fill="#60a5fa">Épaules : 2× Brides (202,30 g/u) + 2× Traverses 60×60</text>
    <text x="350" y="246" font-family="Arial, sans-serif" font-size="11" fill="#e2e8f0">+ 2× Semelles (158,32 g/u) + 2× Inserts 15° (85,71 g/u)</text>
    <text x="350" y="266" font-family="Arial, sans-serif" font-size="11" fill="#94a3b8">+ 2× RS-04 Épaules (1 420 g/u réels | 1 559,43 g CAO)</text>

    <!-- Torse PA12-CF Carénages & Batteries -->
    <rect x="108" y="294" width="52" height="108" rx="6" fill="url(#paViolet)" fill-opacity="0.7" stroke="#a855f7" stroke-dasharray="4,2"/>
    <rect x="230" y="294" width="52" height="108" rx="6" fill="url(#paViolet)" fill-opacity="0.7" stroke="#a855f7" stroke-dasharray="4,2"/>
    <rect x="92" y="340" width="206" height="14" rx="2" fill="url(#aluOrange)" stroke="#fb923c"/>
    <text x="195" y="351" font-family="Arial, sans-serif" font-size="9.5" font-weight="bold" fill="#fff" text-anchor="middle">Ceinture Alu 3 mm (45,43 g)</text>
    <text x="350" y="308" font-family="Arial, sans-serif" font-size="11.5" font-weight="bold" fill="#c084fc">Coques PA12-CF non calibrées (rho = 1,015 g/cm3 brut) :</text>
    <text x="350" y="328" font-family="Arial, sans-serif" font-size="11" fill="#e2e8f0">• Plastron_Ventral_Torse (6 corps : 2 804,56 g bruts)</text>
    <text x="350" y="348" font-family="Arial, sans-serif" font-size="11" fill="#e2e8f0">• Paniers Batteries G/D (307,4 g/u) + Capots (115,1 g)</text>
    <text x="350" y="368" font-family="Arial, sans-serif" font-size="11" fill="#e2e8f0">• Carenage_Pectoral (203,8 g) &amp; Lombaire (206,7 g)</text>
    <text x="350" y="388" font-family="Arial, sans-serif" font-size="11" fill="#fb923c">• 2× Corniere haute (22,54 g/u) + 2× Corniere basse (70,34 g/u)</text>

    <!-- Waist Zone (Z=958..1042) -->
    <line x1="42" y1="436" x2="710" y2="436" stroke="#facc15" stroke-width="1.2" stroke-dasharray="6,3"/>
    <text x="36" y="428" font-family="Arial, sans-serif" font-size="10" font-weight="bold" fill="#facc15">WAIST YAW (Z ~ 1033 mm)</text>

    <rect x="95" y="446" width="200" height="22" rx="3" fill="url(#aluOrange)" stroke="#fb923c"/>
    <text x="195" y="461" font-family="Arial, sans-serif" font-size="10" font-weight="bold" fill="#fff" text-anchor="middle">Waist_Plate (9,02 mm | 433,53 g)</text>
    <rect x="115" y="472" width="160" height="26" rx="3" fill="url(#steelGreen)" stroke="#4ade80"/>
    <text x="195" y="489" font-family="Arial, sans-serif" font-size="10" font-weight="bold" fill="#fff" text-anchor="middle">RB8016 (633,41 g) + Moyeu (163,94 g)</text>
    <rect x="95" y="502" width="200" height="24" rx="3" fill="url(#aluOrange)" stroke="#fb923c"/>
    <text x="195" y="518" font-family="Arial, sans-serif" font-size="10" font-weight="bold" fill="#fff" text-anchor="middle">Traverse_Renfort (12,51 mm | 566,74 g)</text>
    <rect x="145" y="530" width="100" height="44" rx="4" fill="url(#motorSlate)" stroke="#94a3b8"/>
    <text x="195" y="556" font-family="Arial, sans-serif" font-size="10.5" font-weight="bold" fill="#fff" text-anchor="middle">RS-06 (550,97 g)</text>

    <text x="350" y="460" font-family="Arial, sans-serif" font-size="11.5" font-weight="bold" fill="#fb923c">100% Aluminium 7075-T6 sur l'étage Waist Yaw :</text>
    <text x="350" y="480" font-family="Arial, sans-serif" font-size="11" fill="#e2e8f0">• Waist_Plate (433,53 g) + Moyeu (163,94 g) + 4× Brides L (16,48 g)</text>
    <text x="350" y="500" font-family="Arial, sans-serif" font-size="11" fill="#e2e8f0">• Traverse_Renfort_Bassin (566,74 g) + 2× Equerre waist (84,22 g)</text>
    <text x="350" y="524" font-family="Arial, sans-serif" font-size="11" font-weight="bold" fill="#f87171">• Butée mécanique ±95° (R=83,0 mm) : Modif. CAO prévue avant CNC</text>

    <!-- Pont de Hanches + Coque Calibrée + 8 WIP -->
    <rect x="68" y="590" width="254" height="125" rx="8" fill="#1e293b" stroke="#38bdf8" stroke-width="1.4"/>
    <text x="195" y="616" font-family="Arial, sans-serif" font-size="11" font-weight="bold" fill="#38bdf8" text-anchor="middle">PONT DE HANCHES (1 114,87 g)</text>
    <text x="195" y="636" font-family="Arial, sans-serif" font-size="10" fill="#e2e8f0" text-anchor="middle">Selle (338,98) + 4× Montants 20×20</text>
    <text x="195" y="654" font-family="Arial, sans-serif" font-size="10" fill="#e2e8f0" text-anchor="middle">8× Inserts + Tube 60×60 + 2× Brides</text>
    <text x="195" y="678" font-family="Arial, sans-serif" font-size="10.5" font-weight="bold" fill="#34d399" text-anchor="middle">Coque Bassin calibrée : 441,36 g</text>
    <text x="195" y="698" font-family="Arial, sans-serif" font-size="10" font-weight="bold" fill="#f59e0b" text-anchor="middle">+ 8× ASV1_200 (WIP CAO)</text>

    <text x="350" y="614" font-family="Arial, sans-serif" font-size="11.5" font-weight="bold" fill="#34d399">Chassis_Structurel_Bassin_Last (SEULE pièce calibrée) :</text>
    <text x="350" y="634" font-family="Arial, sans-serif" font-size="11" fill="#d1fae5">• PA12-CF Infill Gyroïde 15% : rho = 0,700 g/cm3 (441,36 g / 630,5 cm3)</text>
    <text x="350" y="660" font-family="Arial, sans-serif" font-size="11.5" font-weight="bold" fill="#f59e0b">8 occurrences ASV1_200 Hanches (1 349,19 g bruts) :</text>
    <text x="350" y="680" font-family="Arial, sans-serif" font-size="11" fill="#fde68a">• 02A/03A, 04B/05B, 06C/08C, 07C/09C : en cours de définition CAO</text>
    <text x="350" y="704" font-family="Arial, sans-serif" font-size="11" fill="#94a3b8">• 2× RS-04 Hanches Pitch inclus dans Bassin (1 420 g/u réels)</text>

    <!-- Legend Bottom -->
    <rect x="24" y="742" width="692" height="114" rx="8" fill="#0f172a" stroke="#475569"/>
    <text x="40" y="768" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#f8fafc">LÉGENDE DES MATÉRIAUX TORSE-123 V42</text>
    <rect x="40" y="784" width="18" height="14" rx="2" fill="url(#aluOrange)"/>
    <text x="66" y="796" font-family="Arial, sans-serif" font-size="11" fill="#fb923c">Alu 7075-T6 (2,81 g/cm3 — CNC C500)</text>
    <rect x="330" y="784" width="18" height="14" rx="2" fill="#1d4ed8"/>
    <text x="356" y="796" font-family="Arial, sans-serif" font-size="11" fill="#60a5fa">Alu 6060-T6 (2,70 g/cm3 — Tubes 60×60 &amp; 20×20)</text>
    <rect x="40" y="814" width="18" height="14" rx="2" fill="#10b981"/>
    <text x="66" y="826" font-family="Arial, sans-serif" font-size="11" fill="#34d399">PA12-CF Calibré (0,700 g/cm3 — Bassin)</text>
    <rect x="330" y="814" width="18" height="14" rx="2" fill="url(#paViolet)"/>
    <text x="356" y="826" font-family="Arial, sans-serif" font-size="11" fill="#c084fc">PA12-CF Brut (1,015 g/cm3 — 20 occ. à calibrer)</text>
  </g>

  <!-- PANEL 2 : MATRICE DES DENSITÉS & RDM -->
  <g transform="translate(795, 114)">
    <rect width="795" height="440" rx="12" fill="url(#panelGrad)" stroke="#334155" stroke-width="1.5" filter="url(#cardShadow)"/>
    <text x="24" y="32" font-family="Arial, sans-serif" font-size="15" font-weight="bold" fill="#fbbf24">2. JUSTIFICATION RDM &amp; CALIBRATION DENSITÉS PA12-CF</text>

    <rect x="24" y="54" width="747" height="118" rx="8" fill="#0f172a" stroke="#10b981" stroke-width="1.2"/>
    <text x="40" y="78" font-family="Arial, sans-serif" font-size="12.5" font-weight="bold" fill="#34d399">PA12-CF CALIBRÉ EN V42 : rho_eff = 0,700 g/cm3 (Chassis_Structurel_Bassin_Last)</text>
    <text x="40" y="102" font-family="Arial, sans-serif" font-size="11.5" fill="#e2e8f0">• Coque 5 mm + remplissage 15% Gyroïde : volume CAO 630,52 cm3 ➔ masse calibrée exacte 441,36 g.</text>
    <text x="40" y="124" font-family="Arial, sans-serif" font-size="11.5" fill="#e2e8f0">• Remplace l'ancien bloc Alu 7075 massif (3 792 g) : économie directe de -3 350,6 g grâce au découplage</text>
    <text x="52" y="144" font-family="Arial, sans-serif" font-size="11" fill="#cbd5e1">sur le squelette métallique « Pont de Hanches » (1 114,87 g) qui reprend 100% des chocs 2g de marche.</text>

    <rect x="24" y="186" width="747" height="122" rx="8" fill="#0f172a" stroke="#a855f7" stroke-width="1.2"/>
    <text x="40" y="210" font-family="Arial, sans-serif" font-size="12.5" font-weight="bold" fill="#c084fc">20 OCCURRENCES PA12-CF ENCORE EN BRUT COSMÉTIQUE (rho = 1,015 g/cm3)</text>
    <text x="40" y="234" font-family="Arial, sans-serif" font-size="11.5" fill="#e2e8f0">• Plastron (2 804,6 g) + Carénages + Paniers + Collet + 8× ASV1_200 (1 349,2 g) totalisent ~5 232 g bruts.</text>
    <text x="40" y="256" font-family="Arial, sans-serif" font-size="11.5" fill="#e2e8f0">• Avec calibration gyroïde réelle (0,55 à 0,70 g/cm3 selon parois/infill 15–30%), masse réelle estimée</text>
    <text x="52" y="276" font-family="Arial, sans-serif" font-size="11" fill="#34d399">à ~3 585 – 3 685 g (économie latente de -1 550 à -1 700 g sur le bilan Torse-123 v42).</text>

    <rect x="24" y="322" width="747" height="98" rx="8" fill="#0f172a" stroke="#fb923c" stroke-width="1.2"/>
    <text x="40" y="346" font-family="Arial, sans-serif" font-size="12.5" font-weight="bold" fill="#fb923c">ALU 7075-T6 MASSIF OBLIGATOIRE SUR LES PIÈCES SOLLICITÉES</text>
    <text x="40" y="370" font-family="Arial, sans-serif" font-size="11.5" fill="#e2e8f0">• Interdiction formelle de PA12-CF sur : Waist_Plate (9,02 mm), Moyeu Sandwich (22 kN précharge),</text>
    <text x="52" y="390" font-family="Arial, sans-serif" font-size="11" fill="#e2e8f0">Brides Epaule/Hanches v87 (conduction thermique 130 W/m.K + Sf = 5,92), Traverse, Colonne &amp; Selle.</text>
  </g>

  <!-- PANEL 3 : BILAN GLOBAL V42 & AUDIT -->
  <g transform="translate(795, 574)">
    <rect width="795" height="418" rx="12" fill="url(#panelGrad)" stroke="#334155" stroke-width="1.5" filter="url(#cardShadow)"/>
    <text x="24" y="32" font-family="Arial, sans-serif" font-size="15" font-weight="bold" fill="#34d399">3. BILAN DE MASSE CONSOLIDÉ TORSE-123 V42 (614 INSTANCES / 125 RÉF.)</text>

    <rect x="24" y="54" width="747" height="236" rx="8" fill="#0f172a" stroke="#475569"/>
    <text x="40" y="80" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#38bdf8">CATÉGORIE                           |  MASSE BRUTE V42  |  ESTIM. CALIBRÉE  | OBSERVATION</text>
    <line x1="38" y1="90" x2="754" y2="90" stroke="#334155"/>
    <text x="40" y="112" font-family="Arial, sans-serif" font-size="11.5" fill="#fb923c">Structures Alu 7075 &amp; 6060-T6       |     3 599,5 g     |     3 599,5 g     | Définitif CNC</text>
    <text x="40" y="136" font-family="Arial, sans-serif" font-size="11.5" fill="#e2e8f0">Actionneurs + RB8016 (4×RS04,RS06,EL05) |  ~7 650,2 g  |    ~7 092,5 g     | RS-04 : 1 420 g réels</text>
    <text x="40" y="160" font-family="Arial, sans-serif" font-size="11.5" fill="#34d399">PA12-CF Calibré (Coque Bassin)      |       441,4 g     |       441,4 g     | 0,700 g/cm3 validé</text>
    <text x="40" y="184" font-family="Arial, sans-serif" font-size="11.5" fill="#c084fc">PA12-CF Brut (20 occ. + Plastron)   |    ~5 232,0 g     |  ~3 585 - 3 685 g | Incl. 8 ASV1_200 WIP</text>
    <text x="40" y="208" font-family="Arial, sans-serif" font-size="11.5" fill="#cbd5e1">Visserie McMaster (316 pcs / 28 réf.) |  ~1 393,3 g     |     ~1 393,3 g    | Sous-ens. + quincaill.</text>
    <line x1="38" y1="222" x2="754" y2="222" stroke="#38bdf8"/>
    <text x="40" y="246" font-family="Arial, sans-serif" font-size="12.5" font-weight="bold" fill="#ffffff">TOTAL TORSE-123 V42 (HORS BATTERIES) |  18 316,38 g   |   ~16,1 - 16,2 kg | Écart : -2,1 à -2,3 kg</text>
    <text x="40" y="270" font-family="Arial, sans-serif" font-size="11" fill="#94a3b8">Note : Robot complet Phase 4 (+ 2× batteries + 10 DoF jambes + bras + tête Tilt) ~ 35,2 - 36,0 kg (&lt; 42 kg).</text>

    <rect x="24" y="304" width="747" height="94" rx="8" fill="#1e293b" stroke="#fbbf24" stroke-width="1.2"/>
    <text x="40" y="328" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#fbbf24">POINTS OUVERTS TRAÇABILITÉ CAO (SYNCHRONISÉS)</text>
    <text x="40" y="352" font-family="Arial, sans-serif" font-size="11" fill="#e2e8f0">1. Butée mécanique ±95° (R = 83,0 mm) : Modification CAO prévue avant lancement usinage CNC.</text>
    <text x="40" y="374" font-family="Arial, sans-serif" font-size="11" fill="#e2e8f0">2. 8 occurrences ASV1_200 hanches (02A..09C) : En cours de définition côté CAO (non définitives).</text>
  </g>
</svg>