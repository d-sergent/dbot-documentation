<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1300 850" width="100%" height="100%">
  <defs>
    <!-- Grille de fond technique -->
    <pattern id="grid" width="25" height="25" patternUnits="userSpaceOnUse">
      <path d="M 25 0 L 0 0 0 25" fill="none" stroke="#1e293b" stroke-width="0.8"/>
    </pattern>
    <pattern id="subgrid" width="100" height="100" patternUnits="userSpaceOnUse">
      <rect width="100" height="100" fill="none" stroke="#334155" stroke-width="1.2"/>
    </pattern>

    <!-- Gradients matériaux -->
    <linearGradient id="gradAlu" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#0284c7"/>
    </linearGradient>
    <linearGradient id="gradTirant" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#f59e0b"/>
      <stop offset="50%" stop-color="#fbbf24"/>
      <stop offset="100%" stop-color="#d97706"/>
    </linearGradient>
    <linearGradient id="gradBattery" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#fef08a"/>
      <stop offset="100%" stop-color="#eab308"/>
    </linearGradient>
    <linearGradient id="gradPA12" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#c084fc"/>
      <stop offset="100%" stop-color="#7e22ce"/>
    </linearGradient>
    <linearGradient id="gradMagnet" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f43f5e"/>
      <stop offset="100%" stop-color="#be123c"/>
    </linearGradient>

    <!-- Filtres d'ombrage et de relief -->
    <filter id="cardShadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#000000" flood-opacity="0.6"/>
    </filter>
  </defs>

  <!-- Fond général sombre Blueprint -->
  <rect width="1300" height="850" fill="#0f172a"/>
  <rect width="1300" height="850" fill="url(#grid)"/>
  <rect width="1300" height="850" fill="url(#subgrid)"/>

  <!-- BANDEAU TITRE PRINCIPAL -->
  <g transform="translate(40, 30)">
    <rect width="1220" height="70" rx="10" fill="#1e293b" stroke="#38bdf8" stroke-width="2" filter="url(#cardShadow)"/>
    <text x="25" y="32" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="20" font-weight="bold" fill="#f8fafc">
      ARCHITECTURE STRUCTURALE : PORTIQUE 7075-T6 ANTI-TORSION &amp; CARÉNAGES AIMANTÉS
    </text>
    <text x="25" y="55" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" fill="#94a3b8">
      Robot Humanoïde D-Bot V1 | Système Squelette Indépendant (100% Métallique) + Trappe Lombaire Quick-Swap par Aimants N52
    </text>
    <rect x="1060" y="18" width="135" height="34" rx="6" fill="#0369a1" stroke="#38bdf8" stroke-width="1"/>
    <text x="1127" y="40" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="bold" fill="#ffffff" text-anchor="middle">
      CONFIRMÉ RDM
    </text>
  </g>

  <!-- ========================================================================= -->
  <!-- PANNEAU 1 : VUE ARRIÈRE DU PORTIQUE SPATIAL & DÉGAGEMENT BATTERIE -->
  <!-- ========================================================================= -->
  <g transform="translate(40, 120)">
    <rect width="680" height="690" rx="10" fill="#1e293b" stroke="#334155" stroke-width="1.5" filter="url(#cardShadow)"/>
    <rect x="0" y="0" width="680" height="42" rx="10" fill="#0f172a" fill-opacity="0.6"/>
    <text x="20" y="27" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="15" font-weight="bold" fill="#38bdf8">
      1. Vue Postérieure : Portique Anti-Torsion 7075-T6 &amp; Dégagement Batterie
    </text>

    <!-- Axe vertical médian Z -->
    <line x1="340" y1="50" x2="340" y2="660" stroke="#64748b" stroke-width="1" stroke-dasharray="8 4"/>
    <text x="345" y="70" font-family="monospace" font-size="11" fill="#64748b">Axe Z (Médian Y = 0)</text>

    <!-- TUBE TRANSVERSE SUPÉRIEUR ÉPAULES (Z = 1340 mm) -->
    <rect x="160" y="90" width="360" height="35" rx="4" fill="url(#gradAlu)" stroke="#f8fafc" stroke-width="1.5"/>
    <text x="340" y="112" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="bold" fill="#0f172a" text-anchor="middle">
      TUBE TRANSVERSE ÉPAULES (Aluminium 6060-T6)
    </text>

    <!-- BRIDES D'ÉPAULES (Gauche & Droite) -->
    <!-- Bride Droite (Y négatif) -->
    <rect x="110" y="80" width="60" height="85" rx="6" fill="#0284c7" stroke="#38bdf8" stroke-width="2"/>
    <circle cx="140" cy="122" r="18" fill="#0f172a" stroke="#38bdf8" stroke-width="1.5"/>
    <text x="140" y="126" font-family="sans-serif" font-size="9" fill="#38bdf8" text-anchor="middle" font-weight="bold">RS-04</text>
    <text x="140" y="72" font-family="sans-serif" font-size="11" fill="#94a3b8" text-anchor="middle">Bride Épaule D</text>

    <!-- Bride Gauche (Y positif) -->
    <rect x="510" y="80" width="60" height="85" rx="6" fill="#0284c7" stroke="#38bdf8" stroke-width="2"/>
    <circle cx="540" cy="122" r="18" fill="#0f172a" stroke="#38bdf8" stroke-width="1.5"/>
    <text x="540" y="126" font-family="sans-serif" font-size="9" fill="#38bdf8" text-anchor="middle" font-weight="bold">RS-04</text>
    <text x="540" y="72" font-family="sans-serif" font-size="11" fill="#94a3b8" text-anchor="middle">Bride Épaule G</text>

    <!-- COLONNE VERTÉBRALE CENTRALE (Plaque 100 x 5 mm) -->
    <rect x="333" y="125" width="14" height="420" rx="2" fill="#64748b" stroke="#94a3b8" stroke-width="1.5"/>
    <text x="355" y="320" font-family="sans-serif" font-size="11" fill="#cbd5e1" transform="rotate(90, 355, 320)">
      Colonne 7075-T6 (Ép. 5 mm)
    </text>

    <!-- PANIER BATTERIE COULISSANT (Z = 1138 à 1278 mm) -->
    <g transform="translate(205, 185)">
      <!-- Boîte englobante panier -->
      <rect x="0" y="0" width="270" height="230" rx="8" fill="#eab308" fill-opacity="0.15" stroke="#facc15" stroke-width="2" stroke-dasharray="6 3"/>
      <!-- Compartiments gauche et droit -->
      <rect x="15" y="15" width="105" height="200" rx="6" fill="url(#gradBattery)" stroke="#ca8a04" stroke-width="1.5" fill-opacity="0.85"/>
      <rect x="150" y="15" width="105" height="200" rx="6" fill="url(#gradBattery)" stroke="#ca8a04" stroke-width="1.5" fill-opacity="0.85"/>
      <!-- Motif nid d'abeille stylisé -->
      <circle cx="67" cy="65" r="14" fill="none" stroke="#713f12" stroke-width="1.5"/>
      <circle cx="67" cy="115" r="14" fill="none" stroke="#713f12" stroke-width="1.5"/>
      <circle cx="67" cy="165" r="14" fill="none" stroke="#713f12" stroke-width="1.5"/>
      <circle cx="202" cy="65" r="14" fill="none" stroke="#713f12" stroke-width="1.5"/>
      <circle cx="202" cy="115" r="14" fill="none" stroke="#713f12" stroke-width="1.5"/>
      <circle cx="202" cy="165" r="14" fill="none" stroke="#713f12" stroke-width="1.5"/>
      <!-- Rainure centrale pour passage colonne -->
      <rect x="127" y="10" width="16" height="210" fill="#0f172a" stroke="#ca8a04" stroke-width="1"/>
      <text x="135" y="130" font-family="sans-serif" font-size="12" font-weight="bold" fill="#facc15" text-anchor="middle">
        PANIER BATTERIE COULISSANT
      </text>
      <text x="135" y="148" font-family="monospace" font-size="10" fill="#fef08a" text-anchor="middle">
        Largeur 206,8 mm (Y = -94,7 à +112,1)
      </text>
    </g>

    <!-- LES DEUX TIRANTS ARRIÈRE ANTI-TORSION 7075-T6 (L = 46 mm) -->
    <!-- Tirant Droit -->
    <g transform="translate(130, 165)">
      <rect x="0" y="0" width="18" height="195" rx="4" fill="url(#gradTirant)" stroke="#fef08a" stroke-width="2" filter="url(#cardShadow)"/>
      <circle cx="9" cy="15" r="4" fill="#0f172a" stroke="#fef08a" stroke-width="1.5"/>
      <circle cx="9" cy="180" r="4" fill="#0f172a" stroke="#fef08a" stroke-width="1.5"/>
      <text x="-12" y="105" font-family="sans-serif" font-size="11" font-weight="bold" fill="#fbbf24" text-anchor="end">
        Tirant Droit
      </text>
      <text x="-12" y="120" font-family="monospace" font-size="10" fill="#cbd5e1" text-anchor="end">
        Plat 20x4 mm
      </text>
    </g>

    <!-- Tirant Gauche -->
    <g transform="translate(532, 165)">
      <rect x="0" y="0" width="18" height="195" rx="4" fill="url(#gradTirant)" stroke="#fef08a" stroke-width="2" filter="url(#cardShadow)"/>
      <circle cx="9" cy="15" r="4" fill="#0f172a" stroke="#fef08a" stroke-width="1.5"/>
      <circle cx="9" cy="180" r="4" fill="#0f172a" stroke="#fef08a" stroke-width="1.5"/>
      <text x="30" y="105" font-family="sans-serif" font-size="11" font-weight="bold" fill="#fbbf24" text-anchor="start">
        Tirant Gauche
      </text>
      <text x="30" y="120" font-family="monospace" font-size="10" fill="#cbd5e1" text-anchor="start">
        Plat 20x4 mm
      </text>
    </g>

    <!-- LA CEINTURE INTERMÉDIAIRE ALU 7075-T6 (Z = 1235 mm) -->
    <g transform="translate(75, 360)">
      <!-- Profil C en vue arrière : montre les deux ailes et l'ouverture arrière -->
      <path d="M 0 0 L 73 0 L 73 22 L 35 22 L 35 40 L 0 40 Z" fill="url(#gradAlu)" stroke="#f8fafc" stroke-width="1.5"/>
      <path d="M 530 0 L 457 0 L 457 22 L 495 22 L 495 40 L 530 40 Z" fill="url(#gradAlu)" stroke="#f8fafc" stroke-width="1.5"/>
      <!-- Trait d'ouverture centrale arrière -->
      <line x1="73" y1="10" x2="457" y2="10" stroke="#ef4444" stroke-width="2" stroke-dasharray="6 4"/>
      <!-- Fixation tirant sur oreille ceinture -->
      <circle cx="64" cy="11" r="5" fill="#fef08a" stroke="#0f172a" stroke-width="1.5"/>
      <circle cx="466" cy="11" r="5" fill="#fef08a" stroke="#0f172a" stroke-width="1.5"/>
      <text x="265" y="32" font-family="sans-serif" font-size="12" font-weight="bold" fill="#ef4444" text-anchor="middle">
        OUVERTURE ARRIÈRE CEINTURE : 202 mm (Passage Libre Batterie)
      </text>
    </g>

    <!-- WAIST PLATE & CHÂSSIS BASSIN (En bas) -->
    <rect x="180" y="560" width="320" height="35" rx="5" fill="url(#gradAlu)" stroke="#f8fafc" stroke-width="1.5"/>
    <text x="340" y="582" font-family="sans-serif" font-size="12" font-weight="bold" fill="#0f172a" text-anchor="middle">
      WAIST PLATE (Aluminium 7075-T6, Z = 1042 mm)
    </text>

    <!-- COTES DIMENSIONNELLES & DÉGAGEMENTS -->
    <!-- Cote Dégagement Droit : 27,9 mm -->
    <g transform="translate(148, 250)">
      <line x1="0" y1="0" x2="57" y2="0" stroke="#38bdf8" stroke-width="1.5"/>
      <path d="M 0 -4 L 0 4 M 57 -4 L 57 4" stroke="#38bdf8" stroke-width="1.5"/>
      <text x="28" y="-7" font-family="monospace" font-size="11" font-weight="bold" fill="#38bdf8" text-anchor="middle">
        27,9 mm
      </text>
    </g>

    <!-- Cote Dégagement Gauche : 27,9 mm -->
    <g transform="translate(475, 250)">
      <line x1="0" y1="0" x2="57" y2="0" stroke="#38bdf8" stroke-width="1.5"/>
      <path d="M 0 -4 L 0 4 M 57 -4 L 57 4" stroke="#38bdf8" stroke-width="1.5"/>
      <text x="28" y="-7" font-family="monospace" font-size="11" font-weight="bold" fill="#38bdf8" text-anchor="middle">
        27,9 mm
      </text>
    </g>

    <!-- Cote Entraxe Tirants : 262 mm -->
    <g transform="translate(139, 440)">
      <line x1="0" y1="0" x2="402" y2="0" stroke="#fbbf24" stroke-width="2"/>
      <path d="M 0 -6 L 0 6 M 402 -6 L 402 6" stroke="#fbbf24" stroke-width="2"/>
      <text x="201" y="-8" font-family="sans-serif" font-size="13" font-weight="bold" fill="#fbbf24" text-anchor="middle">
        ENTRAXE PORTIQUE ANTI-TORSION : D = 262,5 mm (Bras de levier R = 131 mm)
      </text>
    </g>

    <!-- Callout validation cinématique -->
    <rect x="35" y="615" width="610" height="55" rx="6" fill="#0f172a" stroke="#22c55e" stroke-width="1.5"/>
    <text x="50" y="636" font-family="sans-serif" font-size="12" font-weight="bold" fill="#22c55e">
      VALIDATION CINÉMATIQUE SANS INTERFÉRENCE :
    </text>
    <text x="50" y="654" font-family="sans-serif" font-size="11" fill="#f8fafc">
      Le panier batterie coulisse librement par l'arrière entre les deux tirants avec près de 28 mm d'aisance latérale.
    </text>
  </g>

  <!-- ========================================================================= -->
  <!-- PANNEAU 2 : CARÉNAGE LOMBAIRE AIMANTÉ (QUICK-SWAP TOOL-FREE) -->
  <!-- ========================================================================= -->
  <g transform="translate(740, 120)">
    <rect width="520" height="370" rx="10" fill="#1e293b" stroke="#334155" stroke-width="1.5" filter="url(#cardShadow)"/>
    <rect x="0" y="0" width="520" height="42" rx="10" fill="#0f172a" fill-opacity="0.6"/>
    <text x="20" y="27" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="15" font-weight="bold" fill="#f43f5e">
      2. Trappe Lombaire Aimantée : Déconnexion de Torsion
    </text>

    <!-- Vue de Profil Décrochage Carénage -->
    <!-- Silhouette Berceau Torse Fixe (PA12-CF C2) -->
    <path d="M 80 75 Q 50 140 50 220 Q 50 280 80 320 L 105 320 Q 80 270 80 220 Q 80 150 105 75 Z" fill="url(#gradPA12)" stroke="#c084fc" stroke-width="1.5"/>
    <text x="75" y="340" font-family="sans-serif" font-size="11" fill="#c084fc" text-anchor="middle">
      Berceau C2 Fixe
    </text>

    <!-- Panier Batterie à l'intérieur -->
    <rect x="110" y="115" width="130" height="175" rx="6" fill="url(#gradBattery)" stroke="#ca8a04" stroke-width="1.5" fill-opacity="0.4"/>
    <text x="175" y="205" font-family="sans-serif" font-size="11" font-weight="bold" fill="#facc15" text-anchor="middle">
      Batterie
    </text>

    <!-- Flèche d'extraction de la batterie -->
    <g transform="translate(250, 195)">
      <line x1="0" y1="0" x2="80" y2="0" stroke="#facc15" stroke-width="3" stroke-dasharray="6 3"/>
      <polygon points="80,-6 95,0 80,6" fill="#facc15"/>
      <text x="45" y="-10" font-family="sans-serif" font-size="11" font-weight="bold" fill="#facc15" text-anchor="middle">
        Coulissement Sortie
      </text>
    </g>

    <!-- Carénage Lombaire Arrière Démontable (Décroché vers l'arrière) -->
    <g transform="translate(370, 0)">
      <path d="M 0 75 Q 30 140 30 220 Q 30 280 0 320 L 20 320 Q 50 270 50 220 Q 50 150 20 75 Z" fill="#22c55e" fill-opacity="0.4" stroke="#22c55e" stroke-width="2"/>
      <text x="45" y="340" font-family="sans-serif" font-size="11" font-weight="bold" fill="#22c55e" text-anchor="middle">
        Capot Lombaire Aimanté
      </text>

      <!-- Flèche de retrait sans outil -->
      <g transform="translate(60, 195)">
        <line x1="0" y1="0" x2="45" y2="0" stroke="#22c55e" stroke-width="2.5"/>
        <polygon points="45,-5 55,0 45,5" fill="#22c55e"/>
        <text x="25" y="-10" font-family="sans-serif" font-size="10" font-weight="bold" fill="#22c55e" text-anchor="middle">
          Retrait Main
        </text>
      </g>
    </g>

    <!-- PLOTS MAGNÉTIQUES NÉODYME N52 (Rouge) -->
    <!-- Plot Haut -->
    <g transform="translate(100, 95)">
      <rect x="0" y="0" width="10" height="16" rx="2" fill="url(#gradMagnet)" stroke="#f8fafc" stroke-width="1"/>
      <circle cx="5" cy="8" r="2" fill="#f8fafc"/>
      <text x="20" y="12" font-family="monospace" font-size="10" font-weight="bold" fill="#f43f5e">Plot N52 (Ø10x3)</text>
    </g>
    <!-- Plot Milieu -->
    <g transform="translate(85, 205)">
      <rect x="0" y="0" width="10" height="16" rx="2" fill="url(#gradMagnet)" stroke="#f8fafc" stroke-width="1"/>
      <circle cx="5" cy="8" r="2" fill="#f8fafc"/>
      <text x="20" y="12" font-family="monospace" font-size="10" font-weight="bold" fill="#f43f5e">Plot N52 (Ø10x3)</text>
    </g>
    <!-- Plot Bas -->
    <g transform="translate(100, 300)">
      <rect x="0" y="0" width="10" height="16" rx="2" fill="url(#gradMagnet)" stroke="#f8fafc" stroke-width="1"/>
      <circle cx="5" cy="8" r="2" fill="#f8fafc"/>
      <text x="20" y="12" font-family="monospace" font-size="10" font-weight="bold" fill="#f43f5e">Plot N52 (Ø10x3)</text>
    </g>

    <!-- Note technique déconnexion torsion -->
    <rect x="25" y="325" width="470" height="32" rx="4" fill="#0f172a" stroke="#f43f5e" stroke-width="1"/>
    <text x="260" y="346" font-family="sans-serif" font-size="10.5" fill="#f8fafc" text-anchor="middle">
      <tspan fill="#f43f5e" font-weight="bold">RÈGLE RDM :</tspan> Les aimants transmettent 0 N.m de torsion. Le squelette 7075-T6 reprend 100% du lacet.
    </text>
  </g>

  <!-- ========================================================================= -->
  <!-- PANNEAU 3 : SYNTHÈSE DES CALCULS RDM & COEFFICIENTS DE SÉCURITÉ -->
  <!-- ========================================================================= -->
  <g transform="translate(740, 510)">
    <rect width="520" height="300" rx="10" fill="#1e293b" stroke="#334155" stroke-width="1.5" filter="url(#cardShadow)"/>
    <rect x="0" y="0" width="520" height="42" rx="10" fill="#0f172a" fill-opacity="0.6"/>
    <text x="20" y="27" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="15" font-weight="bold" fill="#22c55e">
      3. Bilan RDM Rigoureux : Validation Mathématique
    </text>

    <!-- Tableau synthétique des calculs -->
    <g transform="translate(25, 60)" font-family="sans-serif" font-size="11.5">
      <!-- Ligne 1 -->
      <rect x="0" y="0" width="470" height="32" rx="4" fill="#0f172a"/>
      <text x="15" y="21" fill="#94a3b8">Couple de lacet maximal (RS-06 crête) :</text>
      <text x="455" y="21" font-family="monospace" font-weight="bold" fill="#38bdf8" text-anchor="end">T_z = 40,0 N.m</text>

      <!-- Ligne 2 -->
      <rect x="0" y="38" width="470" height="32" rx="4" fill="#1e293b" stroke="#334155" stroke-width="1"/>
      <text x="15" y="59" fill="#94a3b8">Effort axial maximal par tirant (D = 262 mm) :</text>
      <text x="455" y="59" font-family="monospace" font-weight="bold" fill="#fbbf24" text-anchor="end">F = 153,8 N (15,7 kgf)</text>

      <!-- Ligne 3 -->
      <rect x="0" y="76" width="470" height="32" rx="4" fill="#0f172a"/>
      <text x="15" y="97" fill="#94a3b8">Contrainte normale dans plat 7075-T6 (20x4 mm) :</text>
      <text x="455" y="97" font-family="monospace" font-weight="bold" fill="#22c55e" text-anchor="end">sigma = 1,92 MPa (Re = 480 MPa)</text>

      <!-- Ligne 4 -->
      <rect x="0" y="114" width="470" height="32" rx="4" fill="#1e293b" stroke="#334155" stroke-width="1"/>
      <text x="15" y="135" fill="#94a3b8">Coefficient de sécurité élastique (s = Re / sigma) :</text>
      <text x="455" y="135" font-family="monospace" font-weight="bold" fill="#22c55e" text-anchor="end">s = 250 (Marge absolue)</text>

      <!-- Ligne 5 -->
      <rect x="0" y="152" width="470" height="32" rx="4" fill="#0f172a"/>
      <text x="15" y="173" fill="#94a3b8">Déformation angulaire du torse en lacet :</text>
      <text x="455" y="173" font-family="monospace" font-weight="bold" fill="#22c55e" text-anchor="end">theta &lt; 0,02° (Nominal 15 N.m)</text>

      <!-- Ligne 6 -->
      <rect x="0" y="190" width="470" height="32" rx="4" fill="#1e293b" stroke="#334155" stroke-width="1"/>
      <text x="15" y="211" fill="#94a3b8">Force de maintien par 6 aimants N52 (Ø10x3) :</text>
      <text x="455" y="211" font-family="monospace" font-weight="bold" fill="#f43f5e" text-anchor="end">F_totale = 129 N (~13,2 kgf)</text>
    </g>
  </g>
</svg>
