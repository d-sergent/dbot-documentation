<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 650" font-family="'Consolas', 'Monaco', monospace">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0a1628"/>
      <stop offset="100%" stop-color="#0f1f3a"/>
    </linearGradient>
    <linearGradient id="aluGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#8899aa"/>
      <stop offset="100%" stop-color="#667788"/>
    </linearGradient>
    <linearGradient id="aluLightGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#99aabb"/>
      <stop offset="100%" stop-color="#778899"/>
    </linearGradient>
    <linearGradient id="pocketGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1a2a40"/>
      <stop offset="100%" stop-color="#0f1f35"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="2" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <pattern id="gridPattern" width="20" height="20" patternUnits="userSpaceOnUse">
      <rect width="20" height="20" fill="none"/>
      <path d="M 20 0 L 0 0 0 20" fill="none" stroke="#1a2a45" stroke-width="0.3"/>
    </pattern>
    <!-- Hachures pour les poches -->
    <pattern id="hatch" width="6" height="6" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <line x1="0" y1="0" x2="0" y2="6" stroke="#2a4a6a" stroke-width="0.8"/>
    </pattern>
  </defs>

  <!-- Background -->
  <rect width="1200" height="650" fill="url(#bgGrad)"/>
  <rect width="1200" height="650" fill="url(#gridPattern)" opacity="0.5"/>

  <!-- Title bar -->
  <rect x="0" y="0" width="1200" height="50" fill="#0d1a30" stroke="#2a4a7a" stroke-width="1"/>
  <text x="600" y="33" text-anchor="middle" fill="#4fc3f7" font-size="18" font-weight="bold">CONTOURNAGE FESTONNÉ — BRIDE D'ÉPAULE MONOBLOC D-BOT (Alu 7075-T6)</text>

  <!-- ===== PANEL 1 : BRIDE ACTUELLE (PLEINE) ===== -->
  <rect x="20" y="60" width="560" height="530" rx="8" fill="#111d33" stroke="#2a4a7a" stroke-width="1"/>
  <text x="300" y="88" text-anchor="middle" fill="#ff8a65" font-size="14" font-weight="bold">PANNEAU 1 — FLASQUE ACTUEL (100% PLEIN)</text>
  <text x="300" y="106" text-anchor="middle" fill="#90a4ae" font-size="11">Masse flasque : ~216 g (Ø120 / Ø95 × 18,2 mm plein)</text>

  <!-- Bride pleine - vue de face (face stator) -->
  <g transform="translate(300, 340)">
    <!-- Disque extérieur Ø120 -->
    <circle cx="0" cy="0" r="150" fill="url(#aluGrad)" stroke="#aabbcc" stroke-width="2"/>
    <!-- Alésage central Ø95 -->
    <circle cx="0" cy="0" r="118" fill="url(#pocketGrad)" stroke="#556677" stroke-width="1.5"/>
    <!-- PCD Ø106 -->
    <circle cx="0" cy="0" r="132" fill="none" stroke="#4fc3f7" stroke-width="0.6" stroke-dasharray="4,4" opacity="0.5"/>

    <!-- 10 trous M4 sur PCD Ø106 (espacement 36°) -->
    <g fill="#1a2a40" stroke="#556677" stroke-width="1">
      <circle cx="0"     cy="-132" r="6.7"/>  <!-- 0° -->
      <circle cx="77.6"  cy="-106.8" r="6.7"/>  <!-- 36° -->
      <circle cx="125.7" cy="-40.7"  r="6.7"/>  <!-- 72° -->
      <circle cx="125.7" cy="40.7"   r="6.7"/>  <!-- 108° -->
      <circle cx="77.6"  cy="106.8"  r="6.7"/>  <!-- 144° -->
      <circle cx="0"     cy="132"    r="6.7"/>  <!-- 180° -->
      <circle cx="-77.6" cy="106.8"  r="6.7"/>  <!-- 216° -->
      <circle cx="-125.7" cy="40.7"  r="6.7"/>  <!-- 252° -->
      <circle cx="-125.7" cy="-40.7" r="6.7"/>  <!-- 288° -->
      <circle cx="-77.6" cy="-106.8" r="6.7"/>  <!-- 324° -->
    </g>

    <!-- Annotations -->
    <text x="0" y="5" text-anchor="middle" fill="#90a4ae" font-size="10">Alésage</text>
    <text x="0" y="18" text-anchor="middle" fill="#90a4ae" font-size="10">Ø 95 mm H7</text>

    <!-- Cote Ø120 -->
    <line x1="-150" y1="175" x2="150" y2="175" stroke="#4fc3f7" stroke-width="0.8"/>
    <line x1="-150" y1="150" x2="-150" y2="180" stroke="#4fc3f7" stroke-width="0.8"/>
    <line x1="150" y1="150" x2="150" y2="180" stroke="#4fc3f7" stroke-width="0.8"/>
    <text x="0" y="190" text-anchor="middle" fill="#4fc3f7" font-size="11">Ø 120 mm</text>

    <!-- Cote PCD Ø106 -->
    <text x="145" y="-140" fill="#4fc3f7" font-size="9" opacity="0.7">PCD Ø106</text>
    <text x="145" y="-128" fill="#4fc3f7" font-size="9" opacity="0.7">10× M4</text>
  </g>

  <!-- Masse box actuel -->
  <rect x="80" y="530" width="180" height="40" rx="5" fill="#1a1a2e" stroke="#ff8a65" stroke-width="1.5"/>
  <text x="170" y="555" text-anchor="middle" fill="#ff8a65" font-size="14" font-weight="bold">266,9 g / bride</text>

  <!-- ===== PANEL 2 : BRIDE FESTONNÉE ===== -->
  <rect x="600" y="60" width="580" height="530" rx="8" fill="#111d33" stroke="#2a4a7a" stroke-width="1"/>
  <text x="890" y="88" text-anchor="middle" fill="#66bb6a" font-size="14" font-weight="bold">PANNEAU 2 — FLASQUE FESTONNÉ (ALLÉGÉ)</text>
  <text x="890" y="106" text-anchor="middle" fill="#90a4ae" font-size="11">Masse estimée : ~140-170 g (−80 à −100 g par bride)</text>

  <!-- Bride festonnée - vue de face -->
  <g transform="translate(890, 340)">
    <!-- Disque extérieur Ø120 (contour de la matière restante) -->
    <circle cx="0" cy="0" r="150" fill="url(#aluLightGrad)" stroke="#aabbcc" stroke-width="2"/>

    <!-- 10 poches festonnées entre les trous M4 -->
    <!-- Les poches sont des arcs concentriques entre les trous adjacents -->
    <!-- Poche entre trou 0° et 36° -->
    <path d="M 30 -144 A 150 150 0 0 1 68 -118 L 56 -98 A 120 120 0 0 0 24 -116 Z" fill="url(#hatch)" stroke="#3a5a7a" stroke-width="0.8"/>
    <!-- Poche entre 36° et 72° -->
    <path d="M 89 -97 A 150 150 0 0 1 118 -52 L 96 -42 A 120 120 0 0 0 72 -78 Z" fill="url(#hatch)" stroke="#3a5a7a" stroke-width="0.8"/>
    <!-- Poche entre 72° et 108° -->
    <path d="M 118 -22 A 150 150 0 0 1 118 22 L 96 18 A 120 120 0 0 0 96 -18 Z" fill="url(#hatch)" stroke="#3a5a7a" stroke-width="0.8"/>
    <!-- Poche entre 108° et 144° -->
    <path d="M 118 52 A 150 150 0 0 1 89 97 L 72 78 A 120 120 0 0 0 96 42 Z" fill="url(#hatch)" stroke="#3a5a7a" stroke-width="0.8"/>
    <!-- Poche entre 144° et 180° -->
    <path d="M 68 118 A 150 150 0 0 1 30 144 L 24 116 A 120 120 0 0 0 56 98 Z" fill="url(#hatch)" stroke="#3a5a7a" stroke-width="0.8"/>
    <!-- Poche entre 180° et 216° -->
    <path d="M -30 144 A 150 150 0 0 1 -68 118 L -56 98 A 120 120 0 0 0 -24 116 Z" fill="url(#hatch)" stroke="#3a5a7a" stroke-width="0.8"/>
    <!-- Poche entre 216° et 252° -->
    <path d="M -89 97 A 150 150 0 0 1 -118 52 L -96 42 A 120 120 0 0 0 -72 78 Z" fill="url(#hatch)" stroke="#3a5a7a" stroke-width="0.8"/>
    <!-- Poche entre 252° et 288° -->
    <path d="M -118 22 A 150 150 0 0 1 -118 -22 L -96 -18 A 120 120 0 0 0 -96 18 Z" fill="url(#hatch)" stroke="#3a5a7a" stroke-width="0.8"/>
    <!-- Poche entre 288° et 324° -->
    <path d="M -118 -52 A 150 150 0 0 1 -89 -97 L -72 -78 A 120 120 0 0 0 -96 -42 Z" fill="url(#hatch)" stroke="#3a5a7a" stroke-width="0.8"/>
    <!-- Poche entre 324° et 360° -->
    <path d="M -68 -118 A 150 150 0 0 1 -30 -144 L -24 -116 A 120 120 0 0 0 -56 -98 Z" fill="url(#hatch)" stroke="#3a5a7a" stroke-width="0.8"/>

    <!-- Alésage central Ø95 -->
    <circle cx="0" cy="0" r="118" fill="url(#pocketGrad)" stroke="#556677" stroke-width="1.5"/>

    <!-- PCD Ø106 -->
    <circle cx="0" cy="0" r="132" fill="none" stroke="#66bb6a" stroke-width="0.6" stroke-dasharray="4,4" opacity="0.5"/>

    <!-- 10 trous M4 avec ilots de matière -->
    <g fill="#1a2a40" stroke="#556677" stroke-width="1">
      <circle cx="0"     cy="-132" r="6.7"/>
      <circle cx="77.6"  cy="-106.8" r="6.7"/>
      <circle cx="125.7" cy="-40.7"  r="6.7"/>
      <circle cx="125.7" cy="40.7"   r="6.7"/>
      <circle cx="77.6"  cy="106.8"  r="6.7"/>
      <circle cx="0"     cy="132"    r="6.7"/>
      <circle cx="-77.6" cy="106.8"  r="6.7"/>
      <circle cx="-125.7" cy="40.7"  r="6.7"/>
      <circle cx="-125.7" cy="-40.7" r="6.7"/>
      <circle cx="-77.6" cy="-106.8" r="6.7"/>
    </g>

    <!-- Ilots de matière autour de chaque trou (cerclés en vert) -->
    <g fill="none" stroke="#66bb6a" stroke-width="1.2" stroke-dasharray="3,2">
      <circle cx="0"     cy="-132" r="14"/>
      <circle cx="77.6"  cy="-106.8" r="14"/>
      <circle cx="125.7" cy="-40.7"  r="14"/>
      <circle cx="125.7" cy="40.7"   r="14"/>
      <circle cx="77.6"  cy="106.8"  r="14"/>
      <circle cx="0"     cy="132"    r="14"/>
      <circle cx="-77.6" cy="106.8"  r="14"/>
      <circle cx="-125.7" cy="40.7"  r="14"/>
      <circle cx="-125.7" cy="-40.7" r="14"/>
      <circle cx="-77.6" cy="-106.8" r="14"/>
    </g>

    <!-- Annotation ilot -->
    <line x1="14" y1="-132" x2="50" y2="-165" stroke="#66bb6a" stroke-width="0.8"/>
    <text x="52" y="-168" fill="#66bb6a" font-size="9">Îlot de matière</text>
    <text x="52" y="-157" fill="#66bb6a" font-size="9">Ø 11 mm autour</text>
    <text x="52" y="-146" fill="#66bb6a" font-size="9">de chaque M4</text>

    <!-- Annotation poche -->
    <line x1="107" y1="0" x2="160" y2="-10" stroke="#ffd54f" stroke-width="0.8"/>
    <text x="162" y="-14" fill="#ffd54f" font-size="9" font-weight="bold">Poche festonnée</text>
    <text x="162" y="-3" fill="#ffd54f" font-size="9">Prof. 13 mm</text>
    <text x="162" y="8" fill="#ffd54f" font-size="9">(laisse 5,2 mm plein)</text>

    <!-- Annotations centrales -->
    <text x="0" y="5" text-anchor="middle" fill="#90a4ae" font-size="10">Alésage</text>
    <text x="0" y="18" text-anchor="middle" fill="#90a4ae" font-size="10">Ø 95 mm H7</text>

    <!-- Cote Ø120 -->
    <line x1="-150" y1="175" x2="150" y2="175" stroke="#66bb6a" stroke-width="0.8"/>
    <line x1="-150" y1="150" x2="-150" y2="180" stroke="#66bb6a" stroke-width="0.8"/>
    <line x1="150" y1="150" x2="150" y2="180" stroke="#66bb6a" stroke-width="0.8"/>
    <text x="0" y="190" text-anchor="middle" fill="#66bb6a" font-size="11">Ø 120 mm (inchangé)</text>

    <!-- Congés -->
    <text x="-165" y="90" fill="#ef9a9a" font-size="9" transform="rotate(-15, -165, 90)">R = 3 mm</text>
    <text x="-165" y="102" fill="#ef9a9a" font-size="9" transform="rotate(-15, -165, 102)">congés anti-fatigue</text>
  </g>

  <!-- Masse box festonné -->
  <rect x="700" y="530" width="220" height="40" rx="5" fill="#1a2a1e" stroke="#66bb6a" stroke-width="1.5"/>
  <text x="810" y="550" text-anchor="middle" fill="#66bb6a" font-size="13" font-weight="bold">~170-190 g / bride</text>
  <text x="810" y="567" text-anchor="middle" fill="#a5d6a7" font-size="11">Gain : −80 à −100 g ✅</text>

  <!-- Flèche de transition -->
  <g transform="translate(580, 340)">
    <polygon points="0,-15 20,0 0,15" fill="#4fc3f7" opacity="0.8"/>
  </g>

  <!-- Légende technique bottom -->
  <rect x="20" y="600" width="1160" height="40" rx="5" fill="#0d1a30" stroke="#2a4a7a" stroke-width="1"/>
  <text x="30" y="618" fill="#90a4ae" font-size="10">📐 Principe : Fraisage de 10 poches festonnées (« scallops ») entre chaque paire de trous M4 adjacents sur le PCD Ø 106 mm.</text>
  <text x="30" y="633" fill="#90a4ae" font-size="10">Profondeur de poche = 13 mm (conserve 5,2 mm de matière pleine côté face stator). Congés d'angle R = 3 mm (Kt ≈ 1,15). Usinable en 1 passe fraise Ø 6 mm DLC sur la C500.</text>
</svg>
