<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" width="1200" height="800">
  <defs>
    <!-- Background Grid Pattern -->
    <pattern id="grid" width="20" height="20" patternUnits="userSpaceOnUse">
      <path d="M 20 0 L 0 0 0 20" fill="none" stroke="#1e293b" stroke-width="1"/>
    </pattern>
    <pattern id="grid-major" width="100" height="100" patternUnits="userSpaceOnUse">
      <rect width="100" height="100" fill="url(#grid)"/>
      <path d="M 100 0 L 0 0 0 100" fill="none" stroke="#2a324b" stroke-width="1.5"/>
    </pattern>

    <!-- Material Gradients -->
    <linearGradient id="grad-orange-alu" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f97316"/>
      <stop offset="50%" stop-color="#ea580c"/>
      <stop offset="100%" stop-color="#c2410c"/>
    </linearGradient>

    <linearGradient id="grad-yellow-bride" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#facc15"/>
      <stop offset="50%" stop-color="#eab308"/>
      <stop offset="100%" stop-color="#ca8a04"/>
    </linearGradient>

    <linearGradient id="grad-carbon" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="50%" stop-color="#0284c7"/>
      <stop offset="100%" stop-color="#0369a1"/>
    </linearGradient>

    <linearGradient id="grad-stator" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#475569"/>
      <stop offset="50%" stop-color="#334155"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>

    <linearGradient id="grad-steel" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#94a3b8"/>
      <stop offset="50%" stop-color="#64748b"/>
      <stop offset="100%" stop-color="#475569"/>
    </linearGradient>
  </defs>

  <!-- Main Canvas Background -->
  <rect width="1200" height="800" fill="#0f172a"/>
  <rect width="1200" height="800" fill="url(#grid-major)"/>

  <!-- Main Title Header Banner -->
  <rect x="20" y="20" width="1160" height="55" rx="8" fill="#1e293b" stroke="#3b82f6" stroke-width="1.5"/>
  <text x="40" y="55" fill="#f8fafc" font-family="system-ui, sans-serif" font-size="22" font-weight="bold" letter-spacing="1">
    CAGE H-BRACKET &amp; BRIDE ÉPAULE RS-04 — PLAQUES ÉVIDÉES Ø95mm (FUSION 360 v31)
  </text>
  <text x="1160" y="53" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="13" text-anchor="end">
    D-BOT V1 — 7075-T6 (5mm, Évidement Ø95mm = -400g)
  </text>

  <!-- ==================================================================== -->
  <!-- PANEL 1: VUE DE FACE (Plan Y-Z) -->
  <!-- ==================================================================== -->
  <rect x="20" y="90" width="560" height="430" rx="8" fill="#1e293b" stroke="#334155" stroke-width="1.5"/>
  <text x="40" y="120" fill="#38bdf8" font-family="system-ui, sans-serif" font-size="15" font-weight="bold">
    1. VUE DE FACE (Plaque 7075-T6 5mm Évidée Ø95mm)
  </text>

  <g transform="translate(300, 310)">
    <!-- Center Axes -->
    <line x1="-240" y1="0" x2="240" y2="0" stroke="#475569" stroke-width="1" stroke-dasharray="4,4"/>
    <line x1="0" y1="-180" x2="0" y2="180" stroke="#475569" stroke-width="1" stroke-dasharray="4,4"/>

    <!-- Diagonal Line 23.4 deg -->
    <line x1="-71.4" y1="165.2" x2="71.4" y2="-165.2" stroke="#eab308" stroke-width="1.5" stroke-dasharray="6,4"/>

    <!-- Limit Circle R=78mm (scale 1.8x: R78 -> 140.4px) -->
    <circle cx="0" cy="0" r="140.4" fill="none" stroke="#0284c7" stroke-width="1" stroke-dasharray="3,3"/>

    <!-- Stator Body RS-04 Ø120mm (R60 -> 108px) -->
    <circle cx="0" cy="0" r="108" fill="url(#grad-stator)" stroke="#64748b" stroke-width="2"/>

    <!-- Orange H-Bracket Plate Outer Disc (R75 -> 135px) -->
    <circle cx="0" cy="0" r="135" fill="none" stroke="#f97316" stroke-width="2.5"/>

    <!-- Inner Cutout Ø95mm (R47.5mm -> 85.5px) -->
    <circle cx="0" cy="0" r="85.5" fill="#1e293b" stroke="#ea580c" stroke-width="2" stroke-dasharray="4,2"/>
    <text x="0" y="-45" fill="#fb923c" font-family="sans-serif" font-size="11" font-weight="bold" text-anchor="middle">Évidement Ø95 mm</text>
    <text x="0" y="-30" fill="#94a3b8" font-family="sans-serif" font-size="10" text-anchor="middle">(-100g / plaque)</text>

    <!-- Ear HAUT (Z=+66.1mm -> -119px, Y=+28.6mm -> +51.5px) -->
    <circle cx="51.5" cy="-119" r="22" fill="url(#grad-orange-alu)" stroke="#ea580c" stroke-width="2"/>
    <circle cx="51.5" cy="-119" r="6" fill="#0f172a" stroke="#ffffff" stroke-width="1.5"/>
    <text x="75" y="-124" fill="#fb923c" font-family="sans-serif" font-size="11" font-weight="bold">Tirant M5 HAUT</text>
    <text x="75" y="-110" fill="#94a3b8" font-family="sans-serif" font-size="10">(Z=+66.1, Y=+28.6)</text>

    <!-- Ear BAS (Z=-66.1mm -> +119px, Y=-28.6mm -> -51.5px) -->
    <circle cx="-51.5" cy="119" r="22" fill="url(#grad-orange-alu)" stroke="#ea580c" stroke-width="2"/>
    <circle cx="-51.5" cy="119" r="6" fill="#0f172a" stroke="#ffffff" stroke-width="1.5"/>
    <text x="-165" y="125" fill="#fb923c" font-family="sans-serif" font-size="11" font-weight="bold">Tirant M5 BAS</text>
    <text x="-165" y="139" fill="#94a3b8" font-family="sans-serif" font-size="10">(Z=-66.1, Y=-28.6)</text>

    <!-- PCD Ø106mm (R53 -> 95.4px) with 10x M4 holes -->
    <circle cx="0" cy="0" r="95.4" fill="none" stroke="#94a3b8" stroke-width="1" stroke-dasharray="2,2"/>
    <!-- 10 holes spaced 36 deg -->
    <circle cx="0" cy="-95.4" r="3.5" fill="#f8fafc" stroke="#334155" stroke-width="1"/>
    <circle cx="56.1" cy="-77.2" r="3.5" fill="#f8fafc" stroke="#334155" stroke-width="1"/>
    <circle cx="90.7" cy="-29.5" r="3.5" fill="#f8fafc" stroke="#334155" stroke-width="1"/>
    <circle cx="90.7" cy="29.5" r="3.5" fill="#f8fafc" stroke="#334155" stroke-width="1"/>
    <circle cx="56.1" cy="77.2" r="3.5" fill="#f8fafc" stroke="#334155" stroke-width="1"/>
    <circle cx="0" cy="95.4" r="3.5" fill="#f8fafc" stroke="#334155" stroke-width="1"/>
    <circle cx="-56.1" cy="77.2" r="3.5" fill="#f8fafc" stroke="#334155" stroke-width="1"/>
    <circle cx="-90.7" cy="29.5" r="3.5" fill="#f8fafc" stroke="#334155" stroke-width="1"/>
    <circle cx="-90.7" cy="-29.5" r="3.5" fill="#f8fafc" stroke="#334155" stroke-width="1"/>
    <circle cx="-56.1" cy="-77.2" r="3.5" fill="#f8fafc" stroke="#334155" stroke-width="1"/>

    <!-- Central Bore / Tube Carbon Ø30mm outline (R15 -> 27px) -->
    <circle cx="0" cy="0" r="27" fill="url(#grad-carbon)" stroke="#38bdf8" stroke-width="2"/>
    <circle cx="0" cy="0" r="23.4" fill="#0f172a" stroke="#0284c7" stroke-width="1"/>
    <text x="0" y="4" fill="#f8fafc" font-family="sans-serif" font-size="10" font-weight="bold" text-anchor="middle">Ø30</text>
  </g>

  <!-- Panel 1 Annotations -->
  <text x="40" y="495" fill="#e2e8f0" font-family="sans-serif" font-size="11">
    • Couronne annulaire <tspan fill="#fb923c" font-weight="bold">7075-T6 (5mm)</tspan> : Ø ext 120mm / Ø int 95mm (largeur radiale 12.5mm)
  </text>
  <text x="40" y="510" fill="#e2e8f0" font-family="sans-serif" font-size="11">
    • 10× vis M4 sur <tspan fill="#facc15" font-weight="bold">PCD Ø106 mm</tspan> (marge radiale 3.35mm côté intérieur)
  </text>

  <!-- ==================================================================== -->
  <!-- PANEL 2: VUE LATÉRALE / COUPE AXIALE (Plan X-Z) -->
  <!-- ==================================================================== -->
  <rect x="600" y="90" width="580" height="430" rx="8" fill="#1e293b" stroke="#334155" stroke-width="1.5"/>
  <text x="620" y="120" fill="#38bdf8" font-family="system-ui, sans-serif" font-size="15" font-weight="bold">
    2. VUE LATÉRALE EN COUPE (Évidement Ø95mm Ouvert)
  </text>

  <g transform="translate(640, 150)">
    <!-- Reference Axis Line (X-Axis, Central Tube Line) -->
    <line x1="20" y1="170" x2="520" y2="170" stroke="#475569" stroke-width="1" stroke-dasharray="4,4"/>

    <!-- 1. Plaque Avant Évidée (Orange 5mm) -->
    <!-- Top Part (R=47.5 to 75mm) -->
    <rect x="60" y="30" width="15" height="55" fill="url(#grad-orange-alu)" stroke="#ea580c" stroke-width="1.5"/>
    <!-- Bottom Part -->
    <rect x="60" y="255" width="15" height="55" fill="url(#grad-orange-alu)" stroke="#ea580c" stroke-width="1.5"/>
    <!-- Center Hole Opening Ø95mm -->
    <line x1="60" y1="85" x2="75" y2="85" stroke="#fb923c" stroke-width="1" stroke-dasharray="2,2"/>
    <line x1="60" y1="255" x2="75" y2="255" stroke="#fb923c" stroke-width="1" stroke-dasharray="2,2"/>

    <text x="67" y="20" fill="#fb923c" font-family="sans-serif" font-size="10" text-anchor="middle" font-weight="bold">Plaque AV</text>
    <text x="67" y="325" fill="#fb923c" font-family="sans-serif" font-size="10" text-anchor="middle">5mm 7075</text>

    <!-- 2. Stator RS-04 (Ø120mm x 41mm axial) -->
    <rect x="75" y="50" width="123" height="240" fill="url(#grad-stator)" stroke="#64748b" stroke-width="1.5"/>
    <text x="136.5" y="165" fill="#f8fafc" font-family="sans-serif" font-size="14" font-weight="bold" text-anchor="middle">STATOR RS-04</text>
    <text x="136.5" y="185" fill="#94a3b8" font-family="sans-serif" font-size="11" text-anchor="middle">Ø120 mm × 41 mm</text>

    <!-- 3. Plaque Arrière Évidée (Orange 5mm, Identique) -->
    <rect x="198" y="30" width="15" height="55" fill="url(#grad-orange-alu)" stroke="#ea580c" stroke-width="1.5"/>
    <rect x="198" y="255" width="15" height="55" fill="url(#grad-orange-alu)" stroke="#ea580c" stroke-width="1.5"/>
    <text x="205.5" y="20" fill="#fb923c" font-family="sans-serif" font-size="10" text-anchor="middle" font-weight="bold">Plaque AR</text>
    <text x="205.5" y="325" fill="#fb923c" font-family="sans-serif" font-size="10" text-anchor="middle">5mm 7075</text>

    <!-- 4. Bride Fixation Tube (Jaune 48.2mm) -->
    <rect x="213" y="30" width="40" height="280" fill="url(#grad-yellow-bride)" stroke="#ca8a04" stroke-width="1.5"/>
    <rect x="253" y="110" width="105" height="120" rx="4" fill="url(#grad-yellow-bride)" stroke="#ca8a04" stroke-width="1.5"/>
    <text x="290" y="60" fill="#facc15" font-family="sans-serif" font-size="11" font-weight="bold" text-anchor="middle">BRIDE JAUNE</text>
    <text x="290" y="75" fill="#facc15" font-family="sans-serif" font-size="10" text-anchor="middle">48.2 mm 7075-T651</text>

    <!-- 5. Tie-Rod M5 (Tirant Axial M5 x 65mm) -->
    <rect x="50" y="35" width="170" height="10" rx="2" fill="url(#grad-steel)" stroke="#334155" stroke-width="1"/>
    <line x1="67" y1="40" x2="205" y2="40" stroke="#facc15" stroke-width="1.5"/>
    <rect x="50" y="295" width="170" height="10" rx="2" fill="url(#grad-steel)" stroke="#334155" stroke-width="1"/>
    <line x1="67" y1="300" x2="205" y2="300" stroke="#facc15" stroke-width="1.5"/>

    <text x="136.5" y="315" fill="#e2e8f0" font-family="sans-serif" font-size="10" text-anchor="middle">2× Tirants M5 axiaux (R=72mm, angle 23.4°)</text>

    <!-- 6. Tube Carbone Ø30mm & Internal Plug -->
    <rect x="213" y="130" width="280" height="80" fill="url(#grad-carbon)" stroke="#0284c7" stroke-width="1.5"/>
    <rect x="213" y="142" width="280" height="56" fill="#0f172a"/>
    <text x="410" y="175" fill="#38bdf8" font-family="sans-serif" font-size="12" font-weight="bold">TUBE CARBONE Ø30×26 mm</text>

    <!-- Internal Alu Plug 7075 (Ø26/18 x 34.5mm) inside carbon tube -->
    <rect x="250" y="142" width="103" height="56" fill="url(#grad-steel)" stroke="#94a3b8" stroke-width="1" stroke-dasharray="2,2"/>
    <rect x="250" y="154" width="103" height="32" fill="#1e293b"/>
    <text x="301.5" y="173" fill="#cbd5e1" font-family="sans-serif" font-size="9" text-anchor="middle" font-weight="bold">Bouchon Alu Ø26/18</text>

    <!-- 7. Clamp Screws 2x M4 & Pin Ø4mm -->
    <line x1="277" y1="100" x2="277" y2="240" stroke="#ef4444" stroke-width="2"/>
    <circle cx="277" cy="100" r="4" fill="#ef4444"/>
    <line x1="301" y1="95" x2="301" y2="245" stroke="#facc15" stroke-width="3.5"/>
    <text x="301" y="90" fill="#facc15" font-family="sans-serif" font-size="9" text-anchor="middle" font-weight="bold">Goupille Ø4</text>
    <line x1="328" y1="100" x2="328" y2="240" stroke="#ef4444" stroke-width="2"/>
    <circle cx="328" cy="100" r="4" fill="#ef4444"/>
  </g>

  <!-- ==================================================================== -->
  <!-- PANEL 3: SUMMARY & TECHNICAL SPECIFICATIONS -->
  <!-- ==================================================================== -->
  <rect x="20" y="535" width="1160" height="245" rx="8" fill="#1e293b" stroke="#334155" stroke-width="1.5"/>
  <text x="40" y="565" fill="#f8fafc" font-family="system-ui, sans-serif" font-size="15" font-weight="bold">
    3. VALIDAION TECHNIQUE &amp; GAIN DE MASSE — ÉVIDEMENT Ø95mm (EPAULE 9)
  </text>

  <!-- Table 4 Columns -->
  <g transform="translate(40, 580)">
    <!-- Column 1: Évidement Ø95mm & Gain Masse -->
    <rect x="0" y="0" width="265" height="180" rx="6" fill="#0f172a" stroke="#334155" stroke-width="1"/>
    <text x="15" y="25" fill="#4ade80" font-family="sans-serif" font-size="13" font-weight="bold">Gain de Masse : -400 g !</text>
    <text x="15" y="48" fill="#cbd5e1" font-family="sans-serif" font-size="11">• Volume évidé: 35 440 mm³/plaque</text>
    <text x="15" y="66" fill="#cbd5e1" font-family="sans-serif" font-size="11">• Gain: -100 g / plaque 5mm</text>
    <text x="15" y="84" fill="#cbd5e1" font-family="sans-serif" font-size="11">• Total 4 plaques (2 épaules): <tspan fill="#4ade80" font-weight="bold">-400 g</tspan></text>
    <text x="15" y="102" fill="#cbd5e1" font-family="sans-serif" font-size="11">• Dégagement câblage XT30/CAN</text>
    <text x="15" y="120" fill="#cbd5e1" font-family="sans-serif" font-size="11">• Aération directe du stator RS-04</text>
    <text x="15" y="145" fill="#4ade80" font-family="sans-serif" font-size="12" font-weight="bold">🏆 Solution Très Ingénieuse</text>

    <!-- Column 2: Résistance Mécanique -->
    <rect x="280" y="0" width="270" height="180" rx="6" fill="#0f172a" stroke="#334155" stroke-width="1"/>
    <text x="295" y="25" fill="#fb923c" font-family="sans-serif" font-size="13" font-weight="bold">Couronne 12.5mm (7075-T6)</text>
    <text x="295" y="48" fill="#cbd5e1" font-family="sans-serif" font-size="11">• Largeur radiale: 60 - 47.5 = 12.5mm</text>
    <text x="295" y="66" fill="#cbd5e1" font-family="sans-serif" font-size="11">• Bending anneau: 43.1 MPa</text>
    <text x="295" y="84" fill="#cbd5e1" font-family="sans-serif" font-size="11">• Facteur sécurité: <tspan fill="#4ade80" font-weight="bold">Sf = 10.7</tspan> (7075)</text>
    <text x="295" y="102" fill="#cbd5e1" font-family="sans-serif" font-size="11">• Flexion oreilles: 8.7 MPa (Sf=53)</text>
    <text x="295" y="120" fill="#cbd5e1" font-family="sans-serif" font-size="11">• Rigidité Roll inchangée (0.097mm)</text>
    <text x="295" y="145" fill="#4ade80" font-family="sans-serif" font-size="12" font-weight="bold">✅ Structure Très Solide</text>

    <!-- Column 3: Pince Vis PCD Ø106mm -->
    <rect x="565" y="0" width="275" height="180" rx="6" fill="#0f172a" stroke="#334155" stroke-width="1"/>
    <text x="580" y="25" fill="#facc15" font-family="sans-serif" font-size="13" font-weight="bold">Pince Vis PCD Ø106 mm</text>
    <text x="580" y="48" fill="#cbd5e1" font-family="sans-serif" font-size="11">• Rayon vis: R=53.0 mm</text>
    <text x="580" y="66" fill="#cbd5e1" font-family="sans-serif" font-size="11">• Rayon évidement: R=47.5 mm</text>
    <text x="580" y="84" fill="#cbd5e1" font-family="sans-serif" font-size="11">• Pince nette de matière: <tspan fill="#facc15" font-weight="bold">3.35 mm</tspan></text>
    <text x="580" y="102" fill="#cbd5e1" font-family="sans-serif" font-size="11">• Matage sur vis M4: 11.3 MPa</text>
    <text x="580" y="120" fill="#cbd5e1" font-family="sans-serif" font-size="11">• Facteur sécurité matage: <tspan fill="#4ade80" font-weight="bold">Sf = 61</tspan></text>
    <text x="580" y="145" fill="#4ade80" font-family="sans-serif" font-size="12" font-weight="bold">✅ Zéro Risque d'Arrachement</text>

    <!-- Column 4: Conclusion Fabrication -->
    <rect x="855" y="0" width="265" height="180" rx="6" fill="#0f172a" stroke="#334155" stroke-width="1"/>
    <text x="870" y="25" fill="#38bdf8" font-family="sans-serif" font-size="13" font-weight="bold">Usinage CNC C500</text>
    <text x="870" y="48" fill="#cbd5e1" font-family="sans-serif" font-size="11">• Chutes 5×160×160 7075-T6</text>
    <text x="870" y="66" fill="#cbd5e1" font-family="sans-serif" font-size="11">• 1 seule passe 2D débouchante</text>
    <text x="870" y="84" fill="#cbd5e1" font-family="sans-serif" font-size="11">• Temps usinage: ~10 min / plaque</text>
    <text x="870" y="102" fill="#cbd5e1" font-family="sans-serif" font-size="11">• Zéro surépaisseur requise</text>
    <text x="870" y="120" fill="#cbd5e1" font-family="sans-serif" font-size="11">• Poids final cage x2: ~300g net</text>
    <text x="870" y="145" fill="#4ade80" font-family="sans-serif" font-size="12" font-weight="bold">🏆 VALIDÉ À 100%</text>
  </g>
</svg>
