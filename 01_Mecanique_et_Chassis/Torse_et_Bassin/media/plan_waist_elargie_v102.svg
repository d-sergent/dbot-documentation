<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1380 860" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090d16"/>
      <stop offset="55%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#0b1120"/>
    </linearGradient>
    <linearGradient id="panelGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" stop-opacity="0.96"/>
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0.96"/>
    </linearGradient>
    <linearGradient id="aluOrange" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#c2410c"/>
      <stop offset="50%" stop-color="#ea580c"/>
      <stop offset="100%" stop-color="#f97316"/>
    </linearGradient>
    <linearGradient id="aluAmber" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#b45309"/>
      <stop offset="50%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#d97706"/>
    </linearGradient>
    <linearGradient id="aluBlue" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#1e3a8a"/>
      <stop offset="50%" stop-color="#2563eb"/>
      <stop offset="100%" stop-color="#1d4ed8"/>
    </linearGradient>
    <linearGradient id="steelGreen" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#15803d"/>
      <stop offset="50%" stop-color="#22c55e"/>
      <stop offset="100%" stop-color="#16a34a"/>
    </linearGradient>
    <linearGradient id="motorSlate" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#334155"/>
      <stop offset="50%" stop-color="#475569"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
    <pattern id="gridPat" width="30" height="30" patternUnits="userSpaceOnUse">
      <path d="M 30 0 L 0 0 0 30" fill="none" stroke="#334155" stroke-width="0.55" stroke-opacity="0.28"/>
    </pattern>
    <marker id="arrCyan" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <polygon points="0 1, 8 4, 0 7" fill="#38bdf8"/>
    </marker>
    <marker id="arrRed" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <polygon points="0 1, 8 4, 0 7" fill="#ef4444"/>
    </marker>
    <marker id="arrAmber" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <polygon points="0 1, 8 4, 0 7" fill="#f59e0b"/>
    </marker>
    <marker id="arrGreen" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <polygon points="0 1, 8 4, 0 7" fill="#10b981"/>
    </marker>
    <filter id="cardShadow" x="-8%" y="-8%" width="116%" height="116%">
      <feDropShadow dx="0" dy="5" stdDeviation="6" flood-color="#000000" flood-opacity="0.55"/>
    </filter>
  </defs>
  <rect width="1380" height="860" fill="url(#bgGrad)"/>
  <rect width="1380" height="860" fill="url(#gridPat)"/>
  <g transform="translate(30, 22)">
    <rect width="1320" height="74" rx="12" fill="#1e293b" stroke="#3b82f6" stroke-width="1.5" filter="url(#cardShadow)"/>
    <circle cx="42" cy="37" r="20" fill="#f97316" fill-opacity="0.18" stroke="#f97316" stroke-width="2"/>
    <text x="42" y="44" font-family="Arial, sans-serif" font-size="20" font-weight="bold" fill="#f97316" text-anchor="middle">W</text>
    <text x="78" y="32" font-family="Arial, sans-serif" font-size="19" font-weight="bold" fill="#f8fafc">PLAN D'USINAGE CNC C500 — WAIST PLATE &amp; TRAVERSE RENFORT BASSIN (V42)</text>
    <text x="78" y="55" font-family="Arial, sans-serif" font-size="13" fill="#94a3b8">Superposition polaire exacte au pivot Yaw [49,23 ; 9,36] mm — Dimensions, dégagements faisceaux &amp; visserie vérifiée</text>
    <rect x="1000" y="19" width="290" height="36" rx="8" fill="#0f172a" stroke="#fb923c" stroke-width="1.2"/>
    <text x="1145" y="42" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#fb923c" text-anchor="middle">TORSE-123 V42</text>
  </g>

  <!-- PANEL 1 : SUPERPOSITION POLAIRE -->
  <g transform="translate(30, 114)">
    <rect width="740" height="720" rx="12" fill="url(#panelGrad)" stroke="#334155" stroke-width="1.5" filter="url(#cardShadow)"/>
    <text x="24" y="30" font-family="Arial, sans-serif" font-size="15" font-weight="bold" fill="#38bdf8">1. VUE DE DESSUS SUPERPOSÉE — AXES (-X DORSAL / +X VENTRAL)</text>
    <text x="24" y="50" font-family="Arial, sans-serif" font-size="11.5" fill="#94a3b8">Waist_Plate_7075 (433,53 g) au-dessus de Traverse_Renfort_Bassin (566,74 g) &amp; RB8016</text>

    <g transform="translate(370, 390)">
      <!-- Axes -->
      <line x1="-295" y1="0" x2="295" y2="0" stroke="#475569" stroke-width="1" stroke-dasharray="6,4"/>
      <line x1="0" y1="-260" x2="0" y2="260" stroke="#475569" stroke-width="1" stroke-dasharray="6,4"/>
      <text x="-288" y="-10" font-family="Arial, sans-serif" font-size="11" font-weight="bold" fill="#94a3b8">-X (Dorsal)</text>
      <text x="235" y="-12" font-family="Arial, sans-serif" font-size="11" font-weight="bold" fill="#facc15">+X (Ventral)</text>

      <!-- Traverse Renfort Bassin 174.90 x 174.84 mm (scale 2.3 px/mm -> ~402 x 402) -->
      <rect x="-201" y="-201" width="402" height="402" rx="18" fill="#1e3a8a" fill-opacity="0.32" stroke="#60a5fa" stroke-width="2"/>
      <!-- Waist Plate 176.11 x 173.05 mm -->
      <rect x="-195" y="-199" width="405" height="398" rx="22" fill="#c2410c" fill-opacity="0.18" stroke="#fb923c" stroke-width="2.2" stroke-dasharray="7,4"/>

      <!-- RB8016 Ø 120 / Ø 80 (r = 138 / r = 92) -->
      <circle cx="0" cy="0" r="138" fill="none" stroke="#22c55e" stroke-width="46" stroke-opacity="0.22"/>
      <circle cx="0" cy="0" r="138" fill="none" stroke="#4ade80" stroke-width="1.6"/>
      <circle cx="0" cy="0" r="92" fill="none" stroke="#4ade80" stroke-width="1.6"/>

      <!-- 4x Brides Retenue L at 45 deg -->
      <rect x="85" y="-132" width="38" height="38" rx="5" fill="#f59e0b" fill-opacity="0.65" stroke="#fbbf24" stroke-width="1.5" transform="rotate(45, 104, -113)"/>
      <rect x="85" y="94" width="38" height="38" rx="5" fill="#f59e0b" fill-opacity="0.65" stroke="#fbbf24" stroke-width="1.5" transform="rotate(45, 104, 113)"/>
      <rect x="-123" y="-132" width="38" height="38" rx="5" fill="#f59e0b" fill-opacity="0.65" stroke="#fbbf24" stroke-width="1.5" transform="rotate(45, -104, -113)"/>
      <rect x="-123" y="94" width="38" height="38" rx="5" fill="#f59e0b" fill-opacity="0.65" stroke="#fbbf24" stroke-width="1.5" transform="rotate(45, -104, 113)"/>

      <!-- 4x Corner M4 tapped holes + Equerre waist holes -->
      <circle cx="-175" cy="-175" r="5" fill="#38bdf8"/>
      <circle cx="175" cy="-175" r="5" fill="#38bdf8"/>
      <circle cx="-175" cy="175" r="5" fill="#38bdf8"/>
      <circle cx="175" cy="175" r="5" fill="#38bdf8"/>

      <!-- Moyeu square 48.08 x 48.08 (r_px ~ 55) -->
      <circle cx="-55" cy="-55" r="5.5" fill="#fbbf24"/>
      <circle cx="55" cy="-55" r="5.5" fill="#fbbf24"/>
      <circle cx="-55" cy="55" r="5.5" fill="#fbbf24"/>
      <circle cx="55" cy="55" r="5.5" fill="#fbbf24"/>

      <!-- Dorsal -X arcs R_int 64.75 (149px) to R_ext 84.75 (195px) -->
      <path d="M -79 -152 A 172 172 0 0 0 -79 152" fill="none" stroke="#fb923c" stroke-width="46" stroke-linecap="round" stroke-opacity="0.5"/>
      <path d="M -142 -97 A 172 172 0 0 0 -142 97" fill="none" stroke="#34d399" stroke-width="32" stroke-linecap="round" stroke-opacity="0.8"/>

      <!-- Ventral +X U-Notch -->
      <rect x="142" y="-52" width="84" height="104" rx="8" fill="#0f172a" stroke="#facc15" stroke-width="2"/>
      <text x="184" y="-4" font-family="Arial, sans-serif" font-size="10.5" font-weight="bold" fill="#facc15" text-anchor="middle">Encoche U</text>
      <text x="184" y="14" font-family="Arial, sans-serif" font-size="9.5" fill="#fde047" text-anchor="middle">45 × 20 mm</text>

      <!-- Planned Hard Stop ±95 deg R=83mm (+Y / -Y lateral stops) -->
      <circle cx="48" cy="-185" r="11" fill="#ef4444" fill-opacity="0.3" stroke="#ef4444" stroke-width="1.8" stroke-dasharray="3,2"/>
      <circle cx="48" cy="185" r="11" fill="#ef4444" fill-opacity="0.3" stroke="#ef4444" stroke-width="1.8" stroke-dasharray="3,2"/>

      <!-- Clean Callout Annotations well outside overlapping zones -->
      <text x="0" y="-235" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#fb923c" text-anchor="middle">Waist_Plate_7075 : 176,11 × 173,05 × 9,02 mm (Z = 1033,41..1042,43)</text>
      <text x="0" y="-216" font-family="Arial, sans-serif" font-size="11.5" font-weight="bold" fill="#f87171" text-anchor="middle">Butées ±95° (R = 83,0 mm) : Modification CAO prévue avant usinage CNC</text>
      <text x="0" y="232" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#60a5fa" text-anchor="middle">Traverse_Renfort_Bassin : 174,90 × 174,84 × 12,51 mm (Z = 1007,90..1020,41)</text>
      <text x="-185" y="0" font-family="Arial, sans-serif" font-size="10.5" font-weight="bold" fill="#ffffff" text-anchor="middle" transform="rotate(-90, -185, 0)">Arcs -X : 69,05° &amp; 125,05°</text>
      <text x="0" y="-6" font-family="Arial, sans-serif" font-size="11" font-weight="bold" fill="#f8fafc" text-anchor="middle">Yaw [49,23 ; 9,36]</text>
      <text x="0" y="12" font-family="Arial, sans-serif" font-size="10.5" fill="#fbbf24" text-anchor="middle">Carré M4 : 48,08 × 48,08</text>
    </g>
  </g>

  <!-- PANEL 2 : CARTOUCHE SPECIFICATIONS & VISSERIE -->
  <g transform="translate(795, 114)">
    <rect width="555" height="720" rx="12" fill="url(#panelGrad)" stroke="#334155" stroke-width="1.5" filter="url(#cardShadow)"/>
    <text x="24" y="30" font-family="Arial, sans-serif" font-size="15" font-weight="bold" fill="#fbbf24">2. DONNÉES MÉTROLOGIE &amp; QUINCAILLERIE V42</text>

    <rect x="24" y="50" width="507" height="175" rx="8" fill="#0f172a" stroke="#fb923c" stroke-width="1.2"/>
    <text x="38" y="74" font-family="Arial, sans-serif" font-size="12.5" font-weight="bold" fill="#fb923c">A. PIÈCES PRIMAIRES ALU 7075-T6 (CNC C500)</text>
    <text x="38" y="96" font-family="Arial, sans-serif" font-size="11.5" fill="#e2e8f0">• Waist_Plate_7075:1 : 433,53 g | 176,11 × 173,05 × 9,02 mm</text>
    <text x="38" y="116" font-family="Arial, sans-serif" font-size="11.5" fill="#e2e8f0">• Traverse_Renfort_Bassin : 566,74 g | 174,90 × 174,84 × 12,51 mm</text>
    <text x="38" y="136" font-family="Arial, sans-serif" font-size="11.5" fill="#e2e8f0">• Moyeu_Waist_Sandwich_7075 : 163,94 g | Ø 91,52 × 23,62 mm</text>
    <text x="38" y="156" font-family="Arial, sans-serif" font-size="11.5" fill="#e2e8f0">• 4× Bride_Retenue_RB8016_L : 4,12 g/u | 21,95 × 21,95 × 15,02 mm</text>
    <text x="38" y="176" font-family="Arial, sans-serif" font-size="11.5" fill="#e2e8f0">• 2× Equerre waist : 42,11 g/u (84,22 g) | 90,02 × 30,02 × 30,02 mm</text>
    <text x="38" y="198" font-family="Arial, sans-serif" font-size="11" fill="#34d399" font-weight="bold">• RB8016 (633,41 g) &amp; RS-06 (550,97 g) : arbre plein fermé</text>

    <rect x="24" y="242" width="507" height="245" rx="8" fill="#0f172a" stroke="#38bdf8" stroke-width="1.2"/>
    <text x="38" y="266" font-family="Arial, sans-serif" font-size="12.5" font-weight="bold" fill="#38bdf8">B. RÉFÉRENCES MCMASTER-CARR VÉRIFIÉES (TORSE-123 V42)</text>
    <text x="38" y="290" font-family="Arial, sans-serif" font-size="11.5" fill="#e2e8f0">• 92290A168 : Vis CHC M4×20 Inox 316 (Moyeu ➔ Waist &amp; Equerre)</text>
    <text x="38" y="311" font-family="Arial, sans-serif" font-size="11.5" fill="#e2e8f0">• 92290A154 : Vis CHC M4×16 Inox 316 (4× Brides RB8016)</text>
    <text x="38" y="332" font-family="Arial, sans-serif" font-size="11.5" fill="#e2e8f0">• 92125A213 : Vis FHC M5×18 Inox 18-8 (4× Traverse ➔ Inserts)</text>
    <text x="38" y="353" font-family="Arial, sans-serif" font-size="11.5" fill="#e2e8f0">• 91290A150 : Vis CHC M4×14 Acier 12.9 (4× Corniere basse ➔ Waist)</text>
    <text x="38" y="374" font-family="Arial, sans-serif" font-size="11.5" fill="#e2e8f0">• 91292A122 : Vis CHC M4×25 Inox 18-8 (Equerres &amp; Bassin)</text>
    <text x="38" y="395" font-family="Arial, sans-serif" font-size="11.5" fill="#fbbf24">• 92855A313 : Vis CHC M3×12 Tête Basse (1 modélisée / 8 req. RS-06)</text>
    <text x="38" y="416" font-family="Arial, sans-serif" font-size="11.5" fill="#e2e8f0">• 93475A230 / 93475A240 : Rondelles DIN 125A M4 / M5</text>
    <text x="38" y="437" font-family="Arial, sans-serif" font-size="11.5" fill="#e2e8f0">• 93625A150 / 93625A200 : Écrous frein Nylstop M4 / M5</text>
    <text x="38" y="464" font-family="Arial, sans-serif" font-size="11" fill="#94a3b8" font-weight="bold">• Couple M4 Alu 7075 : 2,8–3,0 N.m | M3 RS-06 : 1,3 N.m (Loctite 243)</text>

    <rect x="24" y="504" width="507" height="190" rx="8" fill="#450a0a" fill-opacity="0.35" stroke="#ef4444" stroke-width="1.3"/>
    <text x="38" y="528" font-family="Arial, sans-serif" font-size="12.5" font-weight="bold" fill="#f87171">C. MODIFICATION CAO PRÉVUE AVANT USINAGE CNC</text>
    <text x="38" y="552" font-family="Arial, sans-serif" font-size="11.5" fill="#fecaca">1. Butée mécanique ±95° (R = 83,0 mm) non encore modélisée en v42 :</text>
    <text x="52" y="572" font-family="Arial, sans-serif" font-size="11" fill="#e2e8f0">ajouter perçages plots fixes sur Traverse &amp; doigt tampon sur Waist_Plate.</text>
    <text x="38" y="596" font-family="Arial, sans-serif" font-size="11.5" fill="#fecaca">2. Compléter 7× vis CHC M3×12 [92855A313] sur stator RS-06 (1/8 v42).</text>
    <text x="38" y="620" font-family="Arial, sans-serif" font-size="11.5" fill="#34d399">3. Faisceau -X : 69,05 deg (Traverse) &amp; 125,05 deg (Waist) concentriques,</text>
    <text x="52" y="640" font-family="Arial, sans-serif" font-size="11" fill="#e2e8f0">largeur 20,0 mm (R_int 64,75 / R_ext 84,75, congés R=8,0 mm).</text>
    <text x="38" y="666" font-family="Arial, sans-serif" font-size="11" fill="#94a3b8">• Ponts résiduels : 4,75 mm (interne) et 3,3 mm (bord externe arrière).</text>
  </g>
</svg>