<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 740" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090d16"/>
      <stop offset="55%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#0b1120"/>
    </linearGradient>
    <linearGradient id="panelGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" stop-opacity="0.96"/>
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0.96"/>
    </linearGradient>
    <linearGradient id="aluOrange" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#c2410c"/>
      <stop offset="50%" stop-color="#ea580c"/>
      <stop offset="100%" stop-color="#f97316"/>
    </linearGradient>
    <linearGradient id="aluAmber" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#b45309"/>
      <stop offset="50%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#d97706"/>
    </linearGradient>
    <linearGradient id="aluBlue" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#1e3a8a"/>
      <stop offset="50%" stop-color="#2563eb"/>
      <stop offset="100%" stop-color="#1d4ed8"/>
    </linearGradient>
    <linearGradient id="steelGreen" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#15803d"/>
      <stop offset="50%" stop-color="#22c55e"/>
      <stop offset="100%" stop-color="#16a34a"/>
    </linearGradient>
    <linearGradient id="motorSlate" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#334155"/>
      <stop offset="50%" stop-color="#475569"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
    <pattern id="gridPat" width="30" height="30" patternUnits="userSpaceOnUse">
      <path d="M 30 0 L 0 0 0 30" fill="none" stroke="#334155" stroke-width="0.55" stroke-opacity="0.28"/>
    </pattern>
    <marker id="arrCyan" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <polygon points="0 1, 8 4, 0 7" fill="#38bdf8"/>
    </marker>
    <marker id="arrRed" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <polygon points="0 1, 8 4, 0 7" fill="#ef4444"/>
    </marker>
    <marker id="arrAmber" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <polygon points="0 1, 8 4, 0 7" fill="#f59e0b"/>
    </marker>
    <marker id="arrGreen" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <polygon points="0 1, 8 4, 0 7" fill="#10b981"/>
    </marker>
    <filter id="cardShadow" x="-8%" y="-8%" width="116%" height="116%">
      <feDropShadow dx="0" dy="5" stdDeviation="6" flood-color="#000000" flood-opacity="0.55"/>
    </filter>
  </defs>
  <rect width="1280" height="740" fill="url(#bgGrad)"/>
  <rect width="1280" height="740" fill="url(#gridPat)"/>
  <g transform="translate(30, 22)">
    <rect width="1220" height="74" rx="12" fill="#1e293b" stroke="#3b82f6" stroke-width="1.5" filter="url(#cardShadow)"/>
    <circle cx="42" cy="37" r="20" fill="#38bdf8" fill-opacity="0.18" stroke="#38bdf8" stroke-width="2"/>
    <text x="42" y="44" font-family="Arial, sans-serif" font-size="20" font-weight="bold" fill="#38bdf8" text-anchor="middle">V</text>
    <text x="78" y="32" font-family="Arial, sans-serif" font-size="19" font-weight="bold" fill="#f8fafc">VIGILANCES MÉCANIQUES WAIST YAW &amp; CRBH 8016 — TORSE-123 V42</text>
    <text x="78" y="55" font-family="Arial, sans-serif" font-size="13" fill="#94a3b8">Synthèse des points critiques vérifiés en CAO vs actions restantes avant lancement CNC C500</text>
    <rect x="900" y="19" width="290" height="36" rx="8" fill="#0f172a" stroke="#38bdf8" stroke-width="1.2"/>
    <text x="1045" y="42" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#38bdf8" text-anchor="middle">AUDIT TORSE-123 V42</text>
  </g>

  <!-- PANEL 1 : COUPE PROPRE -->
  <g transform="translate(30, 114)">
    <rect width="460" height="598" rx="12" fill="url(#panelGrad)" stroke="#334155" stroke-width="1.5" filter="url(#cardShadow)"/>
    <text x="22" y="32" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#38bdf8">1. EMPILEMENT VÉRIFIÉ (SANS CHEVAUCHEMENT)</text>

    <rect x="26" y="70" width="272" height="28" rx="3" fill="url(#aluOrange)" stroke="#fb923c"/>
    <text x="162" y="88" font-family="Arial, sans-serif" font-size="10.5" font-weight="bold" fill="#fff" text-anchor="middle">Waist_Plate_7075 (9,02 mm | 433,53 g)</text>

    <rect x="30" y="106" width="30" height="26" rx="3" fill="url(#aluAmber)" stroke="#fbbf24"/>
    <rect x="264" y="106" width="30" height="26" rx="3" fill="url(#aluAmber)" stroke="#fbbf24"/>
    <text x="304" y="114" font-family="Arial, sans-serif" font-size="10" font-weight="bold" fill="#fbbf24">4× Brides L (4,12 g/u)</text>
    <text x="304" y="130" font-family="Arial, sans-serif" font-size="10" fill="#34d399">Redan / jeu 0,38 mm</text>
    <text x="304" y="148" font-family="Arial, sans-serif" font-size="10" font-weight="bold" fill="#4ade80">RB8016 : 633,41 g</text>

    <rect x="64" y="110" width="196" height="38" rx="3" fill="url(#steelGreen)" stroke="#4ade80"/>
    <rect x="98" y="110" width="128" height="58" rx="3" fill="url(#aluAmber)" fill-opacity="0.9" stroke="#fde047"/>
    <text x="162" y="144" font-family="Arial, sans-serif" font-size="10" font-weight="bold" fill="#0f172a" text-anchor="middle">Moyeu (163,94 g)</text>

    <rect x="26" y="168" width="272" height="34" rx="3" fill="url(#aluBlue)" stroke="#60a5fa"/>
    <text x="162" y="190" font-family="Arial, sans-serif" font-size="10.5" font-weight="bold" fill="#fff" text-anchor="middle">Traverse_Renfort (12,51 mm | 566,74 g)</text>

    <rect x="97" y="202" width="130" height="62" rx="5" fill="url(#motorSlate)" stroke="#94a3b8"/>
    <text x="162" y="232" font-family="Arial, sans-serif" font-size="11.5" font-weight="bold" fill="#f8fafc" text-anchor="middle">RS-06 (550,97 g)</text>
    <text x="162" y="250" font-family="Arial, sans-serif" font-size="10" fill="#f87171" text-anchor="middle">Arbre plein fermé</text>

    <rect x="22" y="290" width="416" height="284" rx="8" fill="#0f172a" stroke="#475569"/>
    <text x="36" y="316" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#fbbf24">CONTRÔLE DES RÈGLES CRITIQUES</text>
    <text x="36" y="344" font-family="Arial, sans-serif" font-size="11" fill="#34d399">• Épaisseur Waist_Plate (9,02 mm) : rigidité flexion VALIDÉE</text>
    <text x="36" y="368" font-family="Arial, sans-serif" font-size="11" fill="#34d399">• Épaisseur Traverse (12,51 mm) : portée lamage RB8016 VALIDÉE</text>
    <text x="36" y="392" font-family="Arial, sans-serif" font-size="11" fill="#34d399">• 4× Bride_Retenue_RB8016_L : modélisées &amp; fixées par [92290A154]</text>
    <text x="36" y="416" font-family="Arial, sans-serif" font-size="11" fill="#34d399">• Moyeu_Waist_Sandwich_7075 : jeu 0,38 mm + 6× M4 rotor</text>
    <text x="36" y="440" font-family="Arial, sans-serif" font-size="11" fill="#f87171">• Butée mécanique ±95° (R=83,0 mm) : MODIF CAO PRÉVUE</text>
    <text x="36" y="464" font-family="Arial, sans-serif" font-size="11" fill="#fbbf24">• Vis stator RS-06 [92855A313] : 1/8 en v42 (7 à dupliquer)</text>
    <text x="36" y="492" font-family="Arial, sans-serif" font-size="10.5" fill="#94a3b8">Toutes les pièces primaires Waist sont en Aluminium 7075-T6 massif.</text>
    <text x="36" y="514" font-family="Arial, sans-serif" font-size="10.5" fill="#94a3b8">Aucune liaison critique ne repose sur du plastique imprimé PA12-CF.</text>
  </g>

  <!-- PANEL 2 : FAISCEAU & ARCS -->
  <g transform="translate(510, 114)">
    <rect width="365" height="598" rx="12" fill="url(#panelGrad)" stroke="#334155" stroke-width="1.5" filter="url(#cardShadow)"/>
    <text x="20" y="32" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#10b981">2. ROUTAGE &amp; CINÉMATIQUE</text>

    <rect x="20" y="58" width="325" height="245" rx="8" fill="#0f172a" stroke="#10b981" stroke-width="1.2"/>
    <text x="34" y="84" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#34d399">ZÉRO EFFET GUILLOTINE SUR ±80°</text>
    <text x="34" y="110" font-family="Arial, sans-serif" font-size="11" fill="#e2e8f0">• Voie ventrale (+X) : encoche ouverte en U</text>
    <text x="46" y="130" font-family="Arial, sans-serif" font-size="11" fill="#cbd5e1">45 × 20 mm (passage XT60/XT30 sans dessouder)</text>
    <text x="34" y="156" font-family="Arial, sans-serif" font-size="11" fill="#e2e8f0">• Voie dorsale (-X) : 2 arcs concentriques</text>
    <text x="46" y="176" font-family="Arial, sans-serif" font-size="11" fill="#cbd5e1">Traverse 69,05° + Waist 125,05° (larg. 20,0 mm)</text>
    <text x="46" y="196" font-family="Arial, sans-serif" font-size="11" fill="#cbd5e1">R_int = 64,75 mm | R_ext = 84,75 mm | R = 8,0 mm</text>
    <text x="34" y="224" font-family="Arial, sans-serif" font-size="11" fill="#fbbf24">• Boucle de service libre L = 160..200 mm</text>
    <text x="46" y="244" font-family="Arial, sans-serif" font-size="11" fill="#cbd5e1">Torsion linéique &lt;= 0,55 deg/mm sur ±95°</text>
    <text x="34" y="274" font-family="Arial, sans-serif" font-size="11" font-weight="bold" fill="#f87171">• Rappel : Arbre RS-06 plein (aucun trou central)</text>

    <rect x="20" y="322" width="325" height="252" rx="8" fill="#0f172a" stroke="#38bdf8" stroke-width="1.2"/>
    <text x="34" y="348" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#38bdf8">RÉSISTANCE DES PONTS ALU 7075</text>
    <text x="34" y="376" font-family="Arial, sans-serif" font-size="11" fill="#e2e8f0">• Pont interne (vers RB8016) : 4,75 mm</text>
    <text x="34" y="398" font-family="Arial, sans-serif" font-size="11" fill="#e2e8f0">• Pont externe (bord arrière -X) : 3,3 mm</text>
    <text x="34" y="420" font-family="Arial, sans-serif" font-size="11" fill="#34d399">• Critère usinabilité C500 (&gt; 2,5 mm) : RESPECTÉ</text>
    <text x="34" y="452" font-family="Arial, sans-serif" font-size="11" fill="#e2e8f0">• Cohérence métrologique v42 :</text>
    <text x="46" y="472" font-family="Arial, sans-serif" font-size="10.5" fill="#cbd5e1">Traverse 174,90×174,84 | Waist 176,11×173,05</text>
    <text x="46" y="492" font-family="Arial, sans-serif" font-size="10.5" fill="#cbd5e1">Centre Yaw exact : [49,23 ; 9,36] mm</text>
    <text x="46" y="512" font-family="Arial, sans-serif" font-size="10.5" fill="#cbd5e1">RB8016 mesuré : faux-rond 0,003 mm</text>
    <text x="34" y="544" font-family="Arial, sans-serif" font-size="11" fill="#fbbf24">• Contrôler serrage couple 3,0 N.m (Loctite 243)</text>
  </g>

  <!-- PANEL 3 : CHECKLIST ACTIONNABLE -->
  <g transform="translate(895, 114)">
    <rect width="355" height="598" rx="12" fill="url(#panelGrad)" stroke="#334155" stroke-width="1.5" filter="url(#cardShadow)"/>
    <text x="20" y="32" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#fbbf24">3. CHECKLIST PRÉ-FABRICATION</text>

    <rect x="20" y="58" width="315" height="96" rx="8" fill="#064e3b" fill-opacity="0.45" stroke="#10b981"/>
    <text x="34" y="82" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#34d399">[FAIT EN V42] 4× Brides L RB8016</text>
    <text x="34" y="104" font-family="Arial, sans-serif" font-size="11" fill="#e2e8f0">Modélisées (4,12 g/u) + [92290A154].</text>
    <text x="34" y="124" font-family="Arial, sans-serif" font-size="11" fill="#e2e8f0">Retenue bague extérieure validée.</text>

    <rect x="20" y="168" width="315" height="96" rx="8" fill="#064e3b" fill-opacity="0.45" stroke="#10b981"/>
    <text x="34" y="192" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#34d399">[FAIT EN V42] Plaques &amp; Moyeu</text>
    <text x="34" y="214" font-family="Arial, sans-serif" font-size="11" fill="#e2e8f0">Waist 9,02 mm (433,53 g) + Traverse 12,51 mm</text>
    <text x="34" y="234" font-family="Arial, sans-serif" font-size="11" fill="#e2e8f0">(566,74 g) + Moyeu Ø 91,52 (163,94 g).</text>

    <rect x="20" y="278" width="315" height="118" rx="8" fill="#450a0a" fill-opacity="0.55" stroke="#ef4444" stroke-width="1.4"/>
    <text x="34" y="302" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#f87171">[MODIF CAO PRÉVUE] Butée ±95°</text>
    <text x="34" y="324" font-family="Arial, sans-serif" font-size="11" fill="#fecaca">Absente de Torse-123 v42 !</text>
    <text x="34" y="344" font-family="Arial, sans-serif" font-size="11" fill="#e2e8f0">À ajouter avant CNC : doigt + 2× plots</text>
    <text x="34" y="364" font-family="Arial, sans-serif" font-size="11" fill="#e2e8f0">amortis TPU à R = 83,0 mm (±95°).</text>

    <rect x="20" y="410" width="315" height="164" rx="8" fill="#451a03" fill-opacity="0.5" stroke="#f59e0b" stroke-width="1.2"/>
    <text x="34" y="434" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#fbbf24">[COMPLÉMENT CAO] Stator &amp; Harnais</text>
    <text x="34" y="458" font-family="Arial, sans-serif" font-size="11" fill="#e2e8f0">• Dupliquer 7× [92855A313] (1/8 v42)</text>
    <text x="34" y="480" font-family="Arial, sans-serif" font-size="11" fill="#e2e8f0">• Modéliser Passe_Fil_Faisceau_Waist</text>
    <text x="46" y="498" font-family="Arial, sans-serif" font-size="10.5" fill="#cbd5e1">(TPU 95A fendu sur encoche +X)</text>
    <text x="34" y="524" font-family="Arial, sans-serif" font-size="11" fill="#e2e8f0">• Clôturer les 8 pièces ASV1_200 hanches</text>
    <text x="46" y="544" font-family="Arial, sans-serif" font-size="10.5" fill="#cbd5e1">(actuellement en cours de définition).</text>
  </g>
</svg>