<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 700" width="100%" height="100%">
  <defs>
    <!-- Dark blueprint pattern -->
    <pattern id="grid" width="20" height="20" patternUnits="userSpaceOnUse">
      <path d="M 20 0 L 0 0 0 20" fill="none" stroke="#1e293b" stroke-width="0.8"/>
    </pattern>
    <pattern id="majorGrid" width="100" height="100" patternUnits="userSpaceOnUse">
      <path d="M 100 0 L 0 0 0 100" fill="none" stroke="#334155" stroke-width="1.2"/>
    </pattern>
    <!-- Gradients -->
    <linearGradient id="panelGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" stop-opacity="0.95"/>
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0.95"/>
    </linearGradient>
    <linearGradient id="platineGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#0284c7" stop-opacity="0.5"/>
    </linearGradient>
    <linearGradient id="bearingGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#d97706" stop-opacity="0.7"/>
    </linearGradient>
    <linearGradient id="waistPlateGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#34d399" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#059669" stop-opacity="0.5"/>
    </linearGradient>
  </defs>

  <!-- Background Canvas -->
  <rect width="1200" height="700" fill="#0b1120"/>
  <rect width="1200" height="700" fill="url(#grid)"/>
  <rect width="1200" height="700" fill="url(#majorGrid)"/>

  <!-- Main Title Header -->
  <rect x="30" y="20" width="1140" height="60" rx="8" fill="url(#panelGrad)" stroke="#38bdf8" stroke-width="1.5"/>
  <text x="50" y="45" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="18" font-weight="bold" fill="#f8fafc">
    D-BOT V1.x — ANALYSE EXPERTE : LES 4 POINTS DE VIGILANCE MÉCANIQUE DU WAIST YAW (CRBH 8016)
  </text>
  <text x="50" y="66" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#94a3b8">
    Recommandations d'Ingénierie pour la Modélisation CAO Fusion 360 &amp; l'Usinage CNC NestWorks C500 (Septembre 2026)
  </text>

  <!-- ==================== PANEL 1 : COUPE AXIALE (BRIDAGE & REDAN) ==================== -->
  <rect x="30" y="95" width="560" height="360" rx="8" fill="url(#panelGrad)" stroke="#334155" stroke-width="1.2"/>
  <rect x="30" y="95" width="560" height="32" rx="8" fill="#1e293b"/>
  <text x="45" y="116" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="bold" fill="#38bdf8">
    PANNEAU 1 : COUPE AXIALE Z — BRIDAGE CRBH &amp; REDAN D'ENTREFER
  </text>

  <!-- Drawing elements Panel 1 -->
  <!-- Axis line -->
  <line x1="310" y1="140" x2="310" y2="435" stroke="#ef4444" stroke-width="1" stroke-dasharray="8,4,2,4"/>
  <text x="315" y="152" font-family="monospace" font-size="10" fill="#ef4444">Axe Z (Yaw)</text>

  <!-- Platine d'Interface (Fixe Pelvis) -->
  <!-- Left section of Platine -->
  <path d="M 80,330 L 150,330 L 150,360 L 220,360 L 220,410 L 80,410 Z" fill="url(#platineGrad)" stroke="#38bdf8" stroke-width="1.5"/>
  <!-- Right section of Platine -->
  <path d="M 540,330 L 470,330 L 470,360 L 400,360 L 400,410 L 540,410 Z" fill="url(#platineGrad)" stroke="#38bdf8" stroke-width="1.5"/>
  <text x="90" y="395" font-family="sans-serif" font-size="11" font-weight="bold" fill="#38bdf8">Platine 7075-T6 (Fixe)</text>
  <text x="90" y="407" font-family="sans-serif" font-size="9" fill="#94a3b8">Ép. 12 mm / Ø 140 mm</text>

  <!-- Lamage Ø 120 H7 x 3 mm (Recess) -->
  <rect x="150" y="330" width="70" height="30" fill="#0f172a" opacity="0.6" stroke="#fbbf24" stroke-dasharray="3,3"/>
  <rect x="400" y="330" width="70" height="30" fill="#0f172a" opacity="0.6" stroke="#fbbf24" stroke-dasharray="3,3"/>

  <!-- Roulement CRBH 8016 UU (Outer Ring & Inner Ring) -->
  <!-- Left Outer Ring (Fixed) -->
  <rect x="150" y="240" width="32" height="120" fill="url(#bearingGrad)" stroke="#f59e0b" stroke-width="1.5"/>
  <!-- Left Inner Ring (Rotates) -->
  <rect x="188" y="240" width="32" height="120" fill="url(#bearingGrad)" stroke="#f59e0b" stroke-width="1.5"/>
  <!-- Rollers in cross -->
  <line x1="182" y1="290" x2="188" y2="310" stroke="#fef08a" stroke-width="3"/>
  <line x1="188" y1="290" x2="182" y2="310" stroke="#fef08a" stroke-width="3"/>

  <!-- Right Inner Ring (Rotates) -->
  <rect x="400" y="240" width="32" height="120" fill="url(#bearingGrad)" stroke="#f59e0b" stroke-width="1.5"/>
  <!-- Right Outer Ring (Fixed) -->
  <rect x="438" y="240" width="32" height="120" fill="url(#bearingGrad)" stroke="#f59e0b" stroke-width="1.5"/>
  <!-- Rollers in cross -->
  <line x1="432" y1="290" x2="438" y2="310" stroke="#fef08a" stroke-width="3"/>
  <line x1="438" y1="290" x2="432" y2="310" stroke="#fef08a" stroke-width="3"/>

  <!-- Flasque de Bridage Axial Extérieur (Vigilance 1) -->
  <rect x="135" y="225" width="50" height="15" fill="#f43f5e" opacity="0.85" stroke="#ffe4e6" stroke-width="1"/>
  <line x1="145" y1="225" x2="145" y2="330" stroke="#ffe4e6" stroke-width="1.2" stroke-dasharray="2,2"/>
  <rect x="435" y="225" width="50" height="15" fill="#f43f5e" opacity="0.85" stroke="#ffe4e6" stroke-width="1"/>
  <line x1="475" y1="225" x2="475" y2="330" stroke="#ffe4e6" stroke-width="1.2" stroke-dasharray="2,2"/>
  <text x="80" y="215" font-family="sans-serif" font-size="10" font-weight="bold" fill="#f43f5e">
    Flasque de bridage axial M3/M4 (Sécurise en Z)
  </text>
  <line x1="160" y1="218" x2="160" y2="230" stroke="#f43f5e" stroke-width="1"/>

  <!-- Waist Plate (Mobile Torse) avec REDAN (Vigilance 2) -->
  <!-- Left side Waist plate -->
  <path d="M 120,180 L 500,180 L 500,225 L 432,225 L 432,240 L 395,240 L 395,225 L 225,225 L 225,240 L 188,240 L 188,225 L 120,225 Z"
        fill="url(#waistPlateGrad)" stroke="#34d399" stroke-width="1.5"/>
  <text x="320" y="205" font-family="sans-serif" font-size="11" font-weight="bold" fill="#34d399">Waist Plate Mobile (Torse)</text>

  <!-- Entrefer d'Air 1.5 mm Callout -->
  <rect x="150" y="225" width="35" height="15" fill="#38bdf8" opacity="0.2"/>
  <line x1="175" y1="200" x2="170" y2="232" stroke="#38bdf8" stroke-width="1.2"/>
  <text x="75" y="170" font-family="sans-serif" font-size="10" font-weight="bold" fill="#38bdf8">
    Redan +1.5 mm = Entrefer de sécurité
  </text>
  <text x="75" y="182" font-family="sans-serif" font-size="9" fill="#94a3b8">
    (Zéro frottement avec bague externe fixe !)
  </text>

  <!-- Central bore -->
  <line x1="220" y1="420" x2="400" y2="420" stroke="#cbd5e1" stroke-width="1"/>
  <text x="260" y="432" font-family="monospace" font-size="10" fill="#cbd5e1">Bore Central Ø 80 mm</text>

  <!-- ==================== PANEL 2 : BUTÉE ANGULAIRE CINÉMATIQUE ==================== -->
  <rect x="610" y="95" width="560" height="360" rx="8" fill="url(#panelGrad)" stroke="#334155" stroke-width="1.2"/>
  <rect x="610" y="95" width="560" height="32" rx="8" fill="#1e293b"/>
  <text x="625" y="116" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="bold" fill="#f59e0b">
    PANNEAU 2 : VIGILANCE 3 — GÉOMÉTRIE &amp; CINÉMATIQUE DE BUTÉE
  </text>

  <!-- Problem Illustration: 2 Pins Tangential -->
  <rect x="630" y="145" width="255" height="290" rx="6" fill="#1e293b" stroke="#ef4444" stroke-width="1"/>
  <text x="645" y="170" font-family="sans-serif" font-size="12" font-weight="bold" fill="#ef4444">
    CAS A : 2 Goupilles Tangentielles ⚠️
  </text>
  <text x="645" y="190" font-family="sans-serif" font-size="10" fill="#94a3b8">
    L'entraxe angulaire mange la course !
  </text>

  <!-- Arc drawing Cas A -->
  <path d="M 670,300 A 70,70 0 1,1 845,300" fill="none" stroke="#64748b" stroke-width="14" stroke-linecap="round"/>
  <path d="M 685,295 A 70,70 0 1,1 830,295" fill="none" stroke="#ef4444" stroke-width="4" stroke-dasharray="4,4"/>
  <!-- 2 pins -->
  <circle cx="720" cy="245" r="7" fill="#f8fafc" stroke="#ef4444" stroke-width="2"/>
  <circle cx="745" cy="235" r="7" fill="#f8fafc" stroke="#ef4444" stroke-width="2"/>
  <text x="645" y="340" font-family="monospace" font-size="10" fill="#fca5a5">Course Rainure : 190°</text>
  <text x="645" y="355" font-family="monospace" font-size="10" fill="#fca5a5">Entraxe 2 pins : -19°</text>
  <text x="645" y="375" font-family="sans-serif" font-size="11" font-weight="bold" fill="#ef4444">
    Course Réelle = 171° (+/- 85.5°)
  </text>
  <text x="645" y="390" font-family="sans-serif" font-size="10" fill="#f87171">
    ❌ Perte de la course +/- 90° nominale !
  </text>

  <!-- Solution Illustration: Single Heavy-Duty Pin -->
  <rect x="900" y="145" width="255" height="290" rx="6" fill="#1e293b" stroke="#10b981" stroke-width="1.2"/>
  <text x="915" y="170" font-family="sans-serif" font-size="12" font-weight="bold" fill="#34d399">
    CAS B : Goupille Unique Ø 8 mm ✅
  </text>
  <text x="915" y="190" font-family="sans-serif" font-size="10" fill="#94a3b8">
    Recommandation Expert Humanoïde
  </text>

  <!-- Arc drawing Cas B -->
  <path d="M 940,300 A 70,70 0 1,1 1115,300" fill="none" stroke="#047857" stroke-width="16" stroke-linecap="round"/>
  <!-- Single heavy pin -->
  <circle cx="1027" cy="230" r="10" fill="#f8fafc" stroke="#10b981" stroke-width="3"/>
  <text x="915" y="340" font-family="monospace" font-size="10" fill="#6ee7b7">Goupille DIN 6325 Ø 8 mm</text>
  <text x="915" y="355" font-family="monospace" font-size="10" fill="#6ee7b7">Acier trempé 60 HRC</text>
  <text x="915" y="375" font-family="sans-serif" font-size="11" font-weight="bold" fill="#34d399">
    Course 100% Préservée (+/- 95°)
  </text>
  <text x="915" y="390" font-family="sans-serif" font-size="10" fill="#a7f3d0">
    ✅ Résistance cisaillement > 45 kN
  </text>
  <text x="915" y="405" font-family="sans-serif" font-size="10" fill="#a7f3d0">
    ✅ Usinage CNC rainure grandement simplifié
  </text>

  <!-- ==================== PANEL 3 : TRAVERSÉE FAISCEAU & SYNTHÈSE ==================== -->
  <rect x="30" y="470" width="1140" height="210" rx="8" fill="url(#panelGrad)" stroke="#334155" stroke-width="1.2"/>
  <rect x="30" y="470" width="1140" height="32" rx="8" fill="#1e293b"/>
  <text x="45" y="491" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="bold" fill="#a855f7">
    PANNEAU 3 : VIGILANCE 4 — INTÉGRATION DU FAISCEAU &amp; ACTIONS IMMÉDIATES CAO
  </text>

  <!-- Left: Cable path -->
  <!-- Left: Cable path -->
  <g transform="translate(50, 515)">
    <rect x="0" y="0" width="480" height="145" rx="6" fill="#1e293b" stroke="#64748b" stroke-width="0.8"/>
    <text x="15" y="24" font-family="sans-serif" font-size="12" font-weight="bold" fill="#c084fc">
      Traversée Électrique Déportée (Torse ➔ Pelvis)
    </text>
    <text x="15" y="48" font-family="sans-serif" font-size="11" fill="#f8fafc">
      • Moteur RS-06 : Axe et carter fermés (aucun arbre creux central).
    </text>
    <text x="15" y="70" font-family="sans-serif" font-size="11" fill="#38bdf8">
      • Faisceau Général : Passage par corridor latéral déporté (lumière 25x15 mm).
    </text>
    <text x="15" y="92" font-family="sans-serif" font-size="11" fill="#f8fafc">
      • Contenu faisceau : 2x Câbles 10 AWG 48V (puissance) + 1x Paire CAN-FD blindée.
    </text>
    <text x="15" y="114" font-family="sans-serif" font-size="11" fill="#10b981">
      • Boucle de service : Surlongueur L = 150 mm (rayon courbure R >= 40 mm à +/- 90°).
    </text>
  </g>

  <!-- Right: Checklist CAO -->
  <g transform="translate(560, 515)">
    <rect x="0" y="0" width="590" height="145" rx="6" fill="#1e293b" stroke="#10b981" stroke-width="1"/>
    <text x="15" y="24" font-family="sans-serif" font-size="12" font-weight="bold" fill="#34d399">
      Checklist de Retouche CAO Fusion 360 avant Usinage C500 :
    </text>
    <text x="15" y="48" font-family="sans-serif" font-size="11" fill="#f8fafc">
      [1] Platine Ø 140 mm : Ajouter 4x taraudages M3/M4 (PCD ~128 mm) pour flasque de retenue Z.
    </text>
    <text x="15" y="70" font-family="sans-serif" font-size="11" fill="#f8fafc">
      [2] Waist Plate : Usiner un redan axial de +1.5 mm (Ø 80 à 92 mm) créant un entrefer avec la bague fixe.
    </text>
    <text x="15" y="92" font-family="sans-serif" font-size="11" fill="#f8fafc">
      [3] Butée d'angle : Remplacer les 2 pins Ø 5 mm par 1x goupille trempée DIN 6325 Ø 8 mm (course +/- 95°).
    </text>
    <text x="15" y="114" font-family="sans-serif" font-size="11" fill="#f8fafc">
      [4] Passage Câbles : Modéliser la lumière oblongue 25x15 mm avec passe-fil en zone arrière.
    </text>
    <text x="15" y="134" font-family="sans-serif" font-size="10" fill="#f59e0b">
      [5] Métrologie : Vérifier le Ø 120 mm réel du CRBH 8016 au palmer avant perçage final C500 !
    </text>
  </g>

</svg>
