<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" width="100%" height="100%">
  <defs>
    <!-- Grille discrète d'atelier -->
    <pattern id="shop_grid" width="30" height="30" patternUnits="userSpaceOnUse">
      <path d="M 30 0 L 0 0 0 30" fill="none" stroke="#1e293b" stroke-width="0.7"/>
    </pattern>

    <!-- Marqueurs de cote dorés -->
    <marker id="marker-yellow-start" viewBox="0 0 10 10" refX="0" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 10 2 L 0 5 L 10 8 z" fill="#facc15"/>
    </marker>
    <marker id="marker-yellow-end" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 2 L 10 5 L 0 8 z" fill="#facc15"/>
    </marker>

    <!-- Dégradé métallique pour corps Alu 7075 -->
    <linearGradient id="alu_grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#334155"/>
      <stop offset="50%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>

    <!-- Dégradé pour surface usinée CN -->
    <linearGradient id="machined_top" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.25"/>
      <stop offset="50%" stop-color="#38bdf8" stop-opacity="0.08"/>
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0.20"/>
    </linearGradient>
  </defs>

  <!-- Fond sombre atelier d'usinage -->
  <rect width="1200" height="800" fill="#0b1329"/>
  <rect width="1200" height="800" fill="url(#shop_grid)"/>

  <!-- Cadre principal d'inspection -->
  <rect x="25" y="25" width="1150" height="750" rx="10" fill="#0f172a" fill-opacity="0.9" stroke="#38bdf8" stroke-width="1.6"/>

  <!-- Bannière titre supérieure -->
  <g transform="translate(50, 60)">
    <rect x="-10" y="-20" width="1100" height="52" rx="6" fill="#1e293b" stroke="#334155" stroke-width="1"/>
    <circle cx="15" cy="6" r="10" fill="#facc15"/>
    <text x="11" y="10" fill="#0f172a" font-family="'Segoe UI', sans-serif" font-size="12" font-weight="bold">!</text>
    <text x="35" y="10" fill="#f8fafc" font-family="'Segoe UI', sans-serif" font-size="15" font-weight="bold">FICHE D'INSPECTION ATELIER &amp; OVERLAY DE COTES RÉELLES</text>
    <text x="750" y="10" fill="#38bdf8" font-family="'Segoe UI', monospace" font-size="12">PIÈCE : WAIST_PLATE_7075 (ASV1_100_02A)</text>
  </g>

  <!-- ===================================================================== -->
  <!-- ZONE GAUCHE : RENDU 3D ISOMÉTRIQUE AVEC OVERLAY DE COTES GÉOMÉTRIQUES  -->
  <!-- ===================================================================== -->
  <g id="zone_visuelle_3d" transform="translate(320, 360)">
    <!-- Cadre de visualisation 3D -->
    <rect x="-260" y="-240" width="530" height="420" rx="8" fill="#0b1329" stroke="#38bdf8" stroke-width="1.2"/>
    <text x="-240" y="-215" fill="#38bdf8" font-family="'Segoe UI', sans-serif" font-size="11" font-weight="bold">RENDU ISOLÉ FUSION 360 AVEC COTES EN SURIMPRESSION</text>

    <!-- Modèle volumique de la Waist Plate en perspective -->
    <!-- Base inférieure de la plaque -->
    <polygon points="-160,20 0,-50 160,20 0,90" fill="#1e293b" stroke="#334155" stroke-width="1.5"/>
    <!-- Chants verticaux usinés (épaisseur 9.0 mm) -->
    <polygon points="-160,20 -160,45 0,115 0,90" fill="#0f172a" stroke="#38bdf8" stroke-width="1.5"/>
    <polygon points="0,90 0,115 160,45 160,20" fill="#1e293b" stroke="#38bdf8" stroke-width="1.5"/>
    <!-- Face supérieure usinée -->
    <polygon points="-160,20 0,-50 160,20 0,90" fill="url(#machined_top)" stroke="#38bdf8" stroke-width="2.2"/>

    <!-- Alésage central traversant RB8016 (Ø 80.0 mm H7) -->
    <ellipse cx="0" cy="20" rx="70" ry="30" fill="#0b1329" stroke="#38bdf8" stroke-width="2.0"/>
    <ellipse cx="0" cy="28" rx="70" ry="30" fill="none" stroke="#1e293b" stroke-width="1.2"/>
    <!-- Épaulement redan 3.0 mm (Ø 89.6 mm) -->
    <ellipse cx="0" cy="14" rx="82" ry="35" fill="none" stroke="#38bdf8" stroke-width="1.2" stroke-dasharray="4,2"/>

    <!-- 4x Perçages M4 RobStride RS-06 (PCD Ø 68 mm) -->
    <g fill="#facc15" stroke="#0f172a" stroke-width="1.2">
      <ellipse cx="-42" cy="5" rx="5" ry="3"/>
      <ellipse cx="42" cy="5" rx="5" ry="3"/>
      <ellipse cx="0" cy="-15" rx="5" ry="3"/>
      <ellipse cx="0" cy="55" rx="5" ry="3"/>
    </g>

    <!-- =================== OVERLAY DES COTES MAJEURES =================== -->
    <!-- Cote 1 : Largeur X = 176.1 mm -->
    <g id="dim_x">
      <line x1="-165" y1="55" x2="-165" y2="125" stroke="#64748b" stroke-width="0.8" stroke-dasharray="3,3"/>
      <line x1="0" y1="125" x2="0" y2="155" stroke="#64748b" stroke-width="0.8" stroke-dasharray="3,3"/>
      <line x1="-155" y1="140" x2="-10" y2="140" stroke="#facc15" stroke-width="1.5" marker-start="url(#marker-yellow-start)" marker-end="url(#marker-yellow-end)"/>
      <rect x="-115" y="130" width="80" height="20" rx="3" fill="#0f172a" stroke="#facc15" stroke-width="1"/>
      <text x="-75" y="144" fill="#facc15" font-family="'Segoe UI', monospace" font-size="11" font-weight="bold" text-anchor="middle">176.1 mm</text>
    </g>

    <!-- Cote 2 : Profondeur Y = 173.0 mm -->
    <g id="dim_y">
      <line x1="165" y1="20" x2="195" y2="5" stroke="#64748b" stroke-width="0.8" stroke-dasharray="3,3"/>
      <line x1="0" y1="-50" x2="30" y2="-65" stroke="#64748b" stroke-width="0.8" stroke-dasharray="3,3"/>
      <line x1="185" y1="0" x2="45" y2="-60" stroke="#facc15" stroke-width="1.5" marker-start="url(#marker-yellow-start)" marker-end="url(#marker-yellow-end)"/>
      <rect x="85" y="-45" width="80" height="20" rx="3" fill="#0f172a" stroke="#facc15" stroke-width="1"/>
      <text x="125" y="-31" fill="#facc15" font-family="'Segoe UI', monospace" font-size="11" font-weight="bold" text-anchor="middle">173.0 mm</text>
    </g>

    <!-- Cote 3 : Épaisseur Z = 9.0 mm -->
    <g id="dim_z">
      <line x1="165" y1="20" x2="200" y2="20" stroke="#64748b" stroke-width="0.8" stroke-dasharray="3,3"/>
      <line x1="165" y1="45" x2="200" y2="45" stroke="#64748b" stroke-width="0.8" stroke-dasharray="3,3"/>
      <line x1="190" y1="23" x2="190" y2="42" stroke="#facc15" stroke-width="1.4" marker-start="url(#marker-yellow-start)" marker-end="url(#marker-yellow-end)"/>
      <rect x="195" y="24" width="55" height="18" rx="3" fill="#0f172a" stroke="#facc15" stroke-width="0.8"/>
      <text x="222" y="37" fill="#facc15" font-family="'Segoe UI', monospace" font-size="10" font-weight="bold" text-anchor="middle">9.0 mm</text>
    </g>

    <!-- =================== PASTILLES D'APPEL NUMÉROTÉES =================== -->
    <!-- Pastille 1 : Alésage central RB8016 -->
    <g transform="translate(-40, 20)">
      <circle cx="0" cy="0" r="12" fill="#ef4444" stroke="#f8fafc" stroke-width="1.5"/>
      <text x="0" y="4" fill="#ffffff" font-family="'Segoe UI', sans-serif" font-size="11" font-weight="bold" text-anchor="middle">1</text>
    </g>

    <!-- Pastille 2 : Perçage M4 RS-06 -->
    <g transform="translate(42, 5)">
      <circle cx="0" cy="0" r="12" fill="#f59e0b" stroke="#f8fafc" stroke-width="1.5"/>
      <text x="0" y="4" fill="#ffffff" font-family="'Segoe UI', sans-serif" font-size="11" font-weight="bold" text-anchor="middle">2</text>
    </g>

    <!-- Pastille 3 : Épaulement Redan 3 mm -->
    <g transform="translate(-105, 5)">
      <circle cx="0" cy="0" r="12" fill="#3b82f6" stroke="#f8fafc" stroke-width="1.5"/>
      <text x="0" y="4" fill="#ffffff" font-family="'Segoe UI', sans-serif" font-size="11" font-weight="bold" text-anchor="middle">3</text>
    </g>

    <!-- Pastille 4 : Perçages Cornières Torse M4 -->
    <g transform="translate(-140, 40)">
      <circle cx="0" cy="0" r="12" fill="#10b981" stroke="#f8fafc" stroke-width="1.5"/>
      <text x="0" y="4" fill="#ffffff" font-family="'Segoe UI', sans-serif" font-size="11" font-weight="bold" text-anchor="middle">4</text>
    </g>
  </g>

  <!-- ===================================================================== -->
  <!-- ZONE DROITE : TABLEAU DE CONTRÔLE D'USINAGE & OUTILLAGE D'ATELIER      -->
  <!-- ===================================================================== -->
  <g id="zone_tableau_atelier" transform="translate(630, 120)">
    <!-- Cadre du tableau -->
    <rect x="0" y="0" width="520" height="420" rx="8" fill="#1e293b" stroke="#38bdf8" stroke-width="1.2"/>
    <rect x="0" y="0" width="520" height="38" rx="8 8 0 0" fill="#334155"/>
    <text x="18" y="24" fill="#f8fafc" font-family="'Segoe UI', sans-serif" font-size="13" font-weight="bold">TABLEAU DES OPÉRATIONS &amp; TOLÉRANCES D'ATELIER</text>

    <!-- Ligne Repère 1 : Alésage Roulement RB8016 -->
    <g transform="translate(15, 60)">
      <circle cx="12" cy="12" r="11" fill="#ef4444"/>
      <text x="12" y="16" fill="#fff" font-family="'Segoe UI', sans-serif" font-size="11" font-weight="bold" text-anchor="middle">1</text>
      <text x="35" y="10" fill="#f8fafc" font-family="'Segoe UI', sans-serif" font-size="11" font-weight="bold">Alésage Axial Traversant Roulement RB8016</text>
      <text x="35" y="26" fill="#94a3b8" font-family="'Segoe UI', sans-serif" font-size="10">Cote : <tspan fill="#38bdf8" font-weight="bold">Ø 80.00 mm H7 (+0.030 / 0.000 mm)</tspan> | Outil : Tête à aléser</text>
      <line x1="0" y1="36" x2="490" y2="36" stroke="#475569" stroke-width="0.8"/>
    </g>

    <!-- Ligne Repère 2 : 4x Perçages M4 RobStride RS-06 -->
    <g transform="translate(15, 115)">
      <circle cx="12" cy="12" r="11" fill="#f59e0b"/>
      <text x="12" y="16" fill="#fff" font-family="'Segoe UI', sans-serif" font-size="11" font-weight="bold" text-anchor="middle">2</text>
      <text x="35" y="10" fill="#f8fafc" font-family="'Segoe UI', sans-serif" font-size="11" font-weight="bold">4x Perçages Traversants Fixation RobStride RS-06</text>
      <text x="35" y="26" fill="#94a3b8" font-family="'Segoe UI', sans-serif" font-size="10">Cote : <tspan fill="#facc15" font-weight="bold">Ø 4.50 mm (+0.1 / 0)</tspan> sur PCD Ø 68.00 mm (entraxe +/-0.02 mm)</text>
      <line x1="0" y1="36" x2="490" y2="36" stroke="#475569" stroke-width="0.8"/>
    </g>

    <!-- Ligne Repère 3 : Épaulement Redan 3 mm -->
    <g transform="translate(15, 170)">
      <circle cx="12" cy="12" r="11" fill="#3b82f6"/>
      <text x="12" y="16" fill="#fff" font-family="'Segoe UI', sans-serif" font-size="11" font-weight="bold" text-anchor="middle">3</text>
      <text x="35" y="10" fill="#f8fafc" font-family="'Segoe UI', sans-serif" font-size="11" font-weight="bold">Épaulement Redan d'Appui Axial Roulement</text>
      <text x="35" y="26" fill="#94a3b8" font-family="'Segoe UI', sans-serif" font-size="10">Cote : <tspan fill="#38bdf8" font-weight="bold">Ø 89.62 mm H8</tspan>, Profondeur <tspan fill="#38bdf8" font-weight="bold">3.00 mm (+0.05 / 0)</tspan></text>
      <line x1="0" y1="36" x2="490" y2="36" stroke="#475569" stroke-width="0.8"/>
    </g>

    <!-- Ligne Repère 4 : Perçages Cornières Torse M4 -->
    <g transform="translate(15, 225)">
      <circle cx="12" cy="12" r="11" fill="#10b981"/>
      <text x="12" y="16" fill="#fff" font-family="'Segoe UI', sans-serif" font-size="11" font-weight="bold" text-anchor="middle">4</text>
      <text x="35" y="10" fill="#f8fafc" font-family="'Segoe UI', sans-serif" font-size="11" font-weight="bold">4x Trous de Raccordement Cornières Torse 7075</text>
      <text x="35" y="26" fill="#94a3b8" font-family="'Segoe UI', sans-serif" font-size="10">Cote : <tspan fill="#10b981" font-weight="bold">Ø 4.50 mm</tspan> débouchant avec lamage tête basse DIN 7984 Ø8.5 mm</text>
      <line x1="0" y1="36" x2="490" y2="36" stroke="#475569" stroke-width="0.8"/>
    </g>

    <!-- Paramètres Fraiseuse CNC C500 -->
    <g transform="translate(15, 280)" font-family="'Segoe UI', sans-serif" font-size="10">
      <text x="0" y="0" fill="#38bdf8" font-weight="bold">CONDITIONS DE COUPE RECOMMANDÉES (ALU 7075-T6) :</text>
      <text x="0" y="18" fill="#e2e8f0">• Détourage : Fraise 3 lèvres carbure Ø 10 mm DLC | Vc = 220 m/min | Fz = 0.06 mm/d</text>
      <text x="0" y="34" fill="#e2e8f0">• Perçage Ø 4.5 mm : Foret carbure non revêtu | Vc = 110 m/min | Fz = 0.05 mm/d</text>
      <text x="0" y="50" fill="#e2e8f0">• Ébavurage : Micro-chanfrein 0.3 mm × 45° sur toutes les arêtes vives</text>
    </g>

    <!-- Validation Métrologique -->
    <rect x="15" y="355" width="490" height="48" rx="4" fill="#0b1329" stroke="#10b981" stroke-width="1"/>
    <text x="30" y="375" fill="#10b981" font-family="'Segoe UI', sans-serif" font-size="11" font-weight="bold">✓ CONTRÔLE CONFORMITÉ B-REP VALIDÉ :</text>
    <text x="30" y="391" fill="#94a3b8" font-family="'Segoe UI', sans-serif" font-size="10">Masse finale pesée admissible : 434.7 g +/- 5 g | Zéro bavure | Planéité face &lt; 0.02 mm</text>
  </g>

  <!-- ===================================================================== -->
  <!-- ZONE INFÉRIEURE : QUINCAILLERIE NORMALISÉE MCMASTER-CARR ASSOCIÉE      -->
  <!-- ===================================================================== -->
  <g id="zone_bom_hardware" transform="translate(50, 570)">
    <rect x="0" y="0" width="1100" height="175" rx="8" fill="#1e293b" stroke="#334155" stroke-width="1"/>
    <rect x="0" y="0" width="1100" height="32" rx="8 8 0 0" fill="#334155"/>
    <text x="18" y="21" fill="#38bdf8" font-family="'Segoe UI', sans-serif" font-size="12" font-weight="bold">QUINCAILLERIE D'ASSEMBLAGE NORMALISÉE MCMASTER-CARR (INSERTION FUSION 360)</text>

    <!-- Composant 1 : Vis CHC M4x16 -->
    <g transform="translate(20, 50)">
      <rect x="0" y="0" width="250" height="105" rx="4" fill="#0f172a" stroke="#475569" stroke-width="1"/>
      <text x="12" y="20" fill="#f8fafc" font-family="'Segoe UI', sans-serif" font-size="11" font-weight="bold">Vis CHC M4 × 16 mm Inox</text>
      <text x="12" y="36" fill="#94a3b8" font-family="'Segoe UI', sans-serif" font-size="10">Fixation RobStride RS-06 (x4)</text>
      <text x="12" y="55" fill="#64748b" font-family="'Segoe UI', sans-serif" font-size="9">Code McMaster-Carr 1-clic :</text>
      <rect x="12" y="62" width="120" height="24" rx="3" fill="#1e293b" stroke="#facc15" stroke-width="1"/>
      <text x="72" y="78" fill="#facc15" font-family="'Segoe UI', monospace" font-size="11" font-weight="bold" text-anchor="middle">91292A118</text>
    </g>

    <!-- Composant 2 : Rondelle DIN 125A M4 -->
    <g transform="translate(290, 50)">
      <rect x="0" y="0" width="250" height="105" rx="4" fill="#0f172a" stroke="#475569" stroke-width="1"/>
      <text x="12" y="20" fill="#f8fafc" font-family="'Segoe UI', sans-serif" font-size="11" font-weight="bold">Rondelle Plate DIN 125A M4</text>
      <text x="12" y="36" fill="#94a3b8" font-family="'Segoe UI', sans-serif" font-size="10">Répartition d'appui sous tête (x4)</text>
      <text x="12" y="55" fill="#64748b" font-family="'Segoe UI', sans-serif" font-size="9">Code McMaster-Carr 1-clic :</text>
      <rect x="12" y="62" width="120" height="24" rx="3" fill="#1e293b" stroke="#facc15" stroke-width="1"/>
      <text x="72" y="78" fill="#facc15" font-family="'Segoe UI', monospace" font-size="11" font-weight="bold" text-anchor="middle">93475A230</text>
    </g>

    <!-- Composant 3 : Écrou Nylstop M4 -->
    <g transform="translate(560, 50)">
      <rect x="0" y="0" width="250" height="105" rx="4" fill="#0f172a" stroke="#475569" stroke-width="1"/>
      <text x="12" y="20" fill="#f8fafc" font-family="'Segoe UI', sans-serif" font-size="11" font-weight="bold">Écrou Frein Nylstop DIN 985 M4</text>
      <text x="12" y="36" fill="#94a3b8" font-family="'Segoe UI', sans-serif" font-size="10">Anti-desserrage dynamique lacet (x4)</text>
      <text x="12" y="55" fill="#64748b" font-family="'Segoe UI', sans-serif" font-size="9">Code McMaster-Carr 1-clic :</text>
      <rect x="12" y="62" width="120" height="24" rx="3" fill="#1e293b" stroke="#facc15" stroke-width="1"/>
      <text x="72" y="78" fill="#facc15" font-family="'Segoe UI', monospace" font-size="11" font-weight="bold" text-anchor="middle">93625A150</text>
    </g>

    <!-- Composant 4 : Roulement RB8016 -->
    <g transform="translate(830, 50)">
      <rect x="0" y="0" width="250" height="105" rx="4" fill="#0f172a" stroke="#475569" stroke-width="1"/>
      <text x="12" y="20" fill="#f8fafc" font-family="'Segoe UI', sans-serif" font-size="11" font-weight="bold">Roulement Croisé RB8016</text>
      <text x="12" y="36" fill="#94a3b8" font-family="'Segoe UI', sans-serif" font-size="10">Ø80 int × Ø120 ext × 16 mm</text>
      <text x="12" y="55" fill="#64748b" font-family="'Segoe UI', sans-serif" font-size="9">Couple de serrage recommandé :</text>
      <rect x="12" y="62" width="120" height="24" rx="3" fill="#1e293b" stroke="#38bdf8" stroke-width="1"/>
      <text x="72" y="78" fill="#38bdf8" font-family="'Segoe UI', monospace" font-size="11" font-weight="bold" text-anchor="middle">2.8 N.m</text>
    </g>
  </g>
</svg>
