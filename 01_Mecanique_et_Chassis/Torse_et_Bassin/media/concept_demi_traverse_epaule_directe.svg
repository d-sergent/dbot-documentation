<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 960" width="1440" height="960">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090d16"/>
      <stop offset="55%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#0b1120"/>
    </linearGradient>
    <linearGradient id="panelGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" stop-opacity="0.96"/>
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0.96"/>
    </linearGradient>
    <linearGradient id="aluOrange" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#c2410c"/>
      <stop offset="50%" stop-color="#ea580c"/>
      <stop offset="100%" stop-color="#f97316"/>
    </linearGradient>
    <linearGradient id="aluAmber" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#b45309"/>
      <stop offset="50%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#d97706"/>
    </linearGradient>
    <linearGradient id="aluBlue" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#1e3a8a"/>
      <stop offset="50%" stop-color="#2563eb"/>
      <stop offset="100%" stop-color="#1d4ed8"/>
    </linearGradient>
    <linearGradient id="steelGreen" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#15803d"/>
      <stop offset="50%" stop-color="#22c55e"/>
      <stop offset="100%" stop-color="#16a34a"/>
    </linearGradient>
    <linearGradient id="paViolet" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#5b21b6"/>
      <stop offset="50%" stop-color="#7c3aed"/>
      <stop offset="100%" stop-color="#6d28d9"/>
    </linearGradient>
    <linearGradient id="motorSlate" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#334155"/>
      <stop offset="50%" stop-color="#475569"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
    <pattern id="gridPat" width="30" height="30" patternUnits="userSpaceOnUse">
      <path d="M 30 0 L 0 0 0 30" fill="none" stroke="#334155" stroke-width="0.55" stroke-opacity="0.28"/>
    </pattern>
    <pattern id="hatchWaste" width="10" height="10" patternTransform="rotate(45 0 0)" patternUnits="userSpaceOnUse">
      <line x1="0" y1="0" x2="0" y2="10" stroke="#ef4444" stroke-width="1.6" stroke-opacity="0.55"/>
    </pattern>
    <marker id="arrCyan" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <polygon points="0 1, 8 4, 0 7" fill="#38bdf8"/>
    </marker>
    <marker id="arrRed" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <polygon points="0 1, 8 4, 0 7" fill="#ef4444"/>
    </marker>
    <marker id="arrAmber" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <polygon points="0 1, 8 4, 0 7" fill="#f59e0b"/>
    </marker>
    <marker id="arrGreen" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <polygon points="0 1, 8 4, 0 7" fill="#10b981"/>
    </marker>
    <filter id="cardShadow" x="-8%" y="-8%" width="116%" height="116%">
      <feDropShadow dx="0" dy="5" stdDeviation="6" flood-color="#000000" flood-opacity="0.55"/>
    </filter>
  </defs>
  <rect width="1440" height="960" fill="url(#bgGrad)"/>
  <rect width="1440" height="960" fill="url(#gridPat)"/>
  <g transform="translate(30, 22)">
    <rect width="1380" height="74" rx="12" fill="#1e293b" stroke="#3b82f6" stroke-width="1.5" filter="url(#cardShadow)"/>
    <circle cx="42" cy="37" r="20" fill="#38bdf8" fill-opacity="0.18" stroke="#38bdf8" stroke-width="2"/>
    <text x="42" y="44" font-family="Arial, sans-serif" font-size="19" font-weight="bold" fill="#38bdf8" text-anchor="middle">+</text>
    <text x="76" y="31" font-family="Arial, sans-serif" font-size="18" font-weight="bold" fill="#f8fafc">ÉVOLUTION DEMI-TRAVERSE ÉPAULE : FIXATION DIRECTE BRIDE → STATOR RS-04</text>
    <text x="76" y="54" font-family="Arial, sans-serif" font-size="12" fill="#94a3b8">Suppression de la cage H-bracket : Bride monobloc 7075-T651 festonnée 10 lobes centrée Ø 97 H7 sur stator RS-04</text>
    <rect x="1056" y="19" width="300" height="36" rx="8" fill="#0f172a" stroke="#38bdf8" stroke-width="1.3"/>
    <text x="1206" y="42" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#38bdf8" text-anchor="middle">ARCHITECTURE V2 (Torse-123 v42)</text>
  </g>

  <!-- PANEL 1 : FRONT VIEW X-Z -->
  <g transform="translate(30, 114)">
    <rect width="675" height="404" rx="12" fill="url(#panelGrad)" stroke="#334155" stroke-width="1.3" filter="url(#cardShadow)"/>
    <text x="22" y="30" font-family="Arial, sans-serif" font-size="13.5" font-weight="bold" fill="#38bdf8">1. VUE FRONTALE D'ENSEMBLE (PLAN X-Z, INCLINAISON 15°)</text>

    <!-- Colonne vertical -->
    <rect x="92" y="64" width="16" height="260" rx="2" fill="url(#aluAmber)" stroke="#fde68a" stroke-width="1.5"/>
    <text x="58" y="196" font-family="Arial, sans-serif" font-size="11" font-weight="bold" fill="#fde68a" text-anchor="middle" transform="rotate(-90 58 196)">COLONNE 5 mm (489,50 g)</text>

    <!-- Semelle + Insert -->
    <rect x="108" y="88" width="16" height="212" rx="2" fill="url(#aluOrange)" stroke="#fb923c" stroke-width="1.4"/>
    <rect x="124" y="138" width="44" height="104" rx="3" fill="url(#steelGreen)" stroke="#86efac" stroke-width="1.4"/>
    <text x="150" y="114" font-family="Arial, sans-serif" font-size="10.5" fill="#86efac" text-anchor="middle">Insert 85,71 g</text>
    <line x1="150" y1="118" x2="150" y2="138" stroke="#86efac" stroke-width="1.1"/>

    <!-- Tube 60x60x2 -->
    <rect x="168" y="132" width="194" height="116" rx="3" fill="url(#aluBlue)" stroke="#38bdf8" stroke-width="2"/>
    <line x1="168" y1="142" x2="362" y2="142" stroke="#60a5fa" stroke-width="1" stroke-dasharray="5,3"/>
    <line x1="168" y1="238" x2="362" y2="238" stroke="#60a5fa" stroke-width="1" stroke-dasharray="5,3"/>
    <text x="250" y="185" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#f8fafc" text-anchor="middle">TUBE 60×60×2</text>
    <text x="250" y="205" font-family="Arial, sans-serif" font-size="10" fill="#bfdbfe" text-anchor="middle">6060-T6 (80,07 / 81,08 mm)</text>

    <!-- Bride Monobloc 3 etages -->
    <rect x="332" y="138" width="38" height="104" rx="2" fill="url(#aluAmber)" stroke="#fde68a" stroke-width="1.4"/>
    <rect x="370" y="114" width="22" height="152" rx="2" fill="url(#aluAmber)" stroke="#fde68a" stroke-width="1.4"/>
    <rect x="392" y="84" width="16" height="212" rx="2" fill="url(#aluOrange)" stroke="#fdba74" stroke-width="1.8"/>

    <!-- Stator RS-04 -->
    <rect x="408" y="84" width="96" height="212" rx="6" fill="url(#motorSlate)" stroke="#f59e0b" stroke-width="2"/>
    <rect x="408" y="118" width="14" height="144" rx="2" fill="#f59e0b" fill-opacity="0.35" stroke="#fbbf24"/>
    <text x="456" y="194" font-family="Arial, sans-serif" font-size="12.5" font-weight="bold" fill="#fde68a" text-anchor="middle" transform="rotate(-90 456 194)">STATOR RS-04 (120 N.m)</text>
    <text x="530" y="194" font-family="Arial, sans-serif" font-size="11" font-weight="bold" fill="#34d399" text-anchor="middle" transform="rotate(-90 530 194)">FACE AVANT LIBRE</text>

    <!-- Top callouts strictly in open zone y=60..84 -->
    <line x1="400" y1="84" x2="365" y2="62" stroke="#fdba74" stroke-width="1.2"/>
    <text x="360" y="65" font-family="Arial, sans-serif" font-size="11" font-weight="bold" fill="#fdba74" text-anchor="end">Bride v87 (202,30 g | Ø 97 H7)</text>
    <line x1="414" y1="100" x2="462" y2="64" stroke="#34d399" stroke-width="1.2"/>
    <text x="468" y="68" font-family="Arial, sans-serif" font-size="11" font-weight="bold" fill="#34d399">10× M4 (PCD Ø 106 mm) + Nord-Lock</text>

    <!-- Bottom dimension lines -->
    <line x1="100" y1="354" x2="408" y2="354" stroke="#ef4444" stroke-width="1.6" marker-end="url(#arrRed)"/>
    <text x="254" y="374" font-family="Arial, sans-serif" font-size="11.5" font-weight="bold" fill="#fca5a5" text-anchor="middle">Demi-traverse compacte — Usinage 100 % C500</text>
    <text x="22" y="392" font-family="Arial, sans-serif" font-size="10.5" fill="#94a3b8">Semelle 158,32 g | Tubes 100,04 g/u | Zéro H-bracket avant</text>
  </g>

  <!-- PANEL 2 : DETAIL INTERNE & VIS M5x70 -->
  <g transform="translate(735, 114)">
    <rect width="675" height="404" rx="12" fill="url(#panelGrad)" stroke="#334155" stroke-width="1.3" filter="url(#cardShadow)"/>
    <text x="22" y="30" font-family="Arial, sans-serif" font-size="13.5" font-weight="bold" fill="#38bdf8">2. DÉTAIL D'EMBOÎTEMENT INTERNE &amp; VERROUILLAGE M5×70</text>

    <!-- Schematic 3D/Profile zoom -->
    <rect x="86" y="138" width="38" height="118" rx="3" fill="url(#aluOrange)" stroke="#fb923c" stroke-width="1.5"/>
    <rect x="148" y="130" width="186" height="134" rx="4" fill="url(#aluBlue)" stroke="#38bdf8" stroke-width="2"/>
    <rect x="334" y="138" width="42" height="118" rx="3" fill="url(#aluAmber)" stroke="#fde68a" stroke-width="1.5"/>
    <circle cx="468" cy="197" r="76" fill="url(#motorSlate)" stroke="#38bdf8" stroke-width="2.2"/>
    <circle cx="468" cy="197" r="46" fill="none" stroke="#94a3b8" stroke-width="1.5" stroke-dasharray="5,3"/>
    <text x="468" y="193" font-family="Arial, sans-serif" font-size="11.5" font-weight="bold" fill="#f8fafc" text-anchor="middle">Centrage Ø 97 H7</text>
    <text x="468" y="210" font-family="Arial, sans-serif" font-size="10" fill="#93c5fd" text-anchor="middle">(10 lobes festonnés)</text>

    <!-- M5x70 bolt through Tube & Bossage -->
    <line x1="354" y1="106" x2="354" y2="288" stroke="#ef4444" stroke-width="2.2"/>
    <rect x="348" y="102" width="12" height="10" rx="1" fill="#ef4444"/>
    <rect x="348" y="282" width="12" height="9" rx="1" fill="#facc15"/>

    <!-- Clean external labels -->
    <text x="105" y="114" font-family="Arial, sans-serif" font-size="10.5" font-weight="bold" fill="#fdba74" text-anchor="middle">Appui Semelle 5 mm</text>
    <text x="241" y="196" font-family="Arial, sans-serif" font-size="12.5" font-weight="bold" fill="#f8fafc" text-anchor="middle">Tube 60×60</text>
    <text x="241" y="214" font-family="Arial, sans-serif" font-size="10.5" fill="#bfdbfe" text-anchor="middle">Emboîtement 15,0 mm</text>
    <line x1="354" y1="102" x2="310" y2="74" stroke="#fca5a5" stroke-width="1.2"/>
    <text x="305" y="77" font-family="Arial, sans-serif" font-size="11" font-weight="bold" fill="#fca5a5" text-anchor="end">CHC M5×70 [91290A272] à X = 7,5 mm</text>
    <line x1="468" y1="121" x2="505" y2="78" stroke="#34d399" stroke-width="1.2"/>
    <text x="510" y="81" font-family="Arial, sans-serif" font-size="11" font-weight="bold" fill="#34d399">10× M4 PCD Ø 106 mm</text>
    <text x="22" y="346" font-family="Arial, sans-serif" font-size="11.5" fill="#cbd5e1">• Zone 1 (4 oreilles 5 mm) : [90128A214] M4×16 CAO / [91290A154] M4×12 atelier.</text>
    <text x="22" y="370" font-family="Arial, sans-serif" font-size="11.5" fill="#cbd5e1">• Zone 2 (6 bossages 18,2 mm) : [92855A422] M4×25 Tête Basse + Nord-Lock [91812A252].</text>
  </g>

  <!-- PANEL 3 : TOP VIEW X-Y + ADVANTAGES -->
  <g transform="translate(30, 536)">
    <rect width="675" height="394" rx="12" fill="url(#panelGrad)" stroke="#334155" stroke-width="1.3" filter="url(#cardShadow)"/>
    <text x="22" y="30" font-family="Arial, sans-serif" font-size="13.5" font-weight="bold" fill="#38bdf8">3. VUE DE DESSUS (PLAN X-Y) : PRINCIPE DE FIXATION</text>

    <!-- Symmetric Left/Right tubes + center spine -->
    <rect x="195" y="64" width="12" height="270" rx="2" fill="url(#aluAmber)" stroke="#fde68a" stroke-width="1.4"/>
    <rect x="64" y="138" width="131" height="114" rx="3" fill="url(#aluBlue)" stroke="#38bdf8" stroke-width="1.8"/>
    <rect x="207" y="138" width="131" height="114" rx="3" fill="url(#aluBlue)" stroke="#38bdf8" stroke-width="1.8"/>
    <rect x="46" y="106" width="18" height="178" rx="2" fill="url(#aluOrange)" stroke="#fb923c" stroke-width="1.4"/>
    <rect x="338" y="106" width="18" height="178" rx="2" fill="url(#aluOrange)" stroke="#fb923c" stroke-width="1.4"/>
    <!-- 4 sandwich M5x25 bolts -->
    <line x1="176" y1="154" x2="226" y2="154" stroke="#e2e8f0" stroke-width="2"/>
    <line x1="176" y1="236" x2="226" y2="236" stroke="#e2e8f0" stroke-width="2"/>
    <text x="201" y="54" font-family="Arial, sans-serif" font-size="10.5" fill="#fde68a" text-anchor="middle">COLONNE 5 mm + 4× CHC M5×25 [90348A023]</text>
    <text x="130" y="198" font-family="Arial, sans-serif" font-size="11" font-weight="bold" fill="#f8fafc" text-anchor="middle">TUBE G (81,08 mm)</text>
    <text x="272" y="198" font-family="Arial, sans-serif" font-size="11" font-weight="bold" fill="#f8fafc" text-anchor="middle">TUBE D (80,07 mm)</text>
    <text x="201" y="362" font-family="Arial, sans-serif" font-size="10.5" fill="#94a3b8" text-anchor="middle">4× Nylstop M5 [90631A113] + 4× Goupilles Ø 3×14 [91585A374]</text>

    <!-- Advantages card -->
    <rect x="382" y="66" width="272" height="292" rx="10" fill="#0f172a" stroke="#10b981" stroke-width="1.3"/>
    <text x="400" y="96" font-family="Arial, sans-serif" font-size="12.5" font-weight="bold" fill="#34d399">AVANTAGES VALIDÉS v42 :</text>
    <text x="400" y="130" font-family="Arial, sans-serif" font-size="11.5" fill="#e2e8f0">✓ 0 cage, 0 tirant avant parasite</text>
    <text x="400" y="160" font-family="Arial, sans-serif" font-size="11.5" fill="#e2e8f0">✓ Centrage pilote Ø 97,00 H7</text>
    <text x="400" y="190" font-family="Arial, sans-serif" font-size="11.5" fill="#e2e8f0">✓ FEA Bride v87 : 85 MPa (Sf = 5,92)</text>
    <text x="400" y="220" font-family="Arial, sans-serif" font-size="11.5" fill="#e2e8f0">✓ Rigidité torsion 120 N.m (Sf = 9,75)</text>
    <text x="400" y="250" font-family="Arial, sans-serif" font-size="11.5" fill="#e2e8f0">✓ 100 % usinable C500 (1 seule gamme</text>
    <text x="414" y="270" font-family="Arial, sans-serif" font-size="11.5" fill="#e2e8f0">pour 4 brides : Épaules + Hanches)</text>
    <text x="400" y="308" font-family="Arial, sans-serif" font-size="11.5" font-weight="bold" fill="#38bdf8">✓ Ventilation face avant 100 % libre</text>
  </g>

  <!-- PANEL 4 : BILAN COMPARATIF -->
  <g transform="translate(735, 536)">
    <rect width="675" height="394" rx="12" fill="url(#panelGrad)" stroke="#3b82f6" stroke-width="1.3" filter="url(#cardShadow)"/>
    <text x="22" y="30" font-family="Arial, sans-serif" font-size="13.5" font-weight="bold" fill="#38bdf8">4. BILAN COMPARATIF &amp; MATURITÉ DE CONCEPTION</text>

    <text x="24" y="68" font-family="Arial, sans-serif" font-size="11.5" font-weight="bold" fill="#94a3b8">PARAMÈTRE</text>
    <text x="240" y="68" font-family="Arial, sans-serif" font-size="11.5" font-weight="bold" fill="#fca5a5">DESIGN V1 (H-BRACKET)</text>
    <text x="455" y="68" font-family="Arial, sans-serif" font-size="11.5" font-weight="bold" fill="#34d399">DESIGN V2 DIRECT (v42)</text>
    <line x1="22" y1="80" x2="653" y2="80" stroke="#334155"/>

    <text x="24" y="110" font-family="Arial, sans-serif" font-size="12" fill="#f8fafc">Pièces usinées / paire</text>
    <text x="240" y="110" font-family="Arial, sans-serif" font-size="12" fill="#cbd5e1">7 pièces + cage avant</text>
    <text x="455" y="110" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#34d399">8 pièces (4 paires sym.)</text>
    <line x1="22" y1="124" x2="653" y2="124" stroke="#1e293b"/>

    <text x="24" y="152" font-family="Arial, sans-serif" font-size="12" fill="#f8fafc">Masse sous-ensemble (2 côtés)</text>
    <text x="240" y="152" font-family="Arial, sans-serif" font-size="12" fill="#cbd5e1">~1 460 g (avec tirants)</text>
    <text x="455" y="152" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#34d399">1 092,7 g (hors vis/col.)</text>
    <line x1="22" y1="166" x2="653" y2="166" stroke="#1e293b"/>

    <text x="24" y="194" font-family="Arial, sans-serif" font-size="12" fill="#f8fafc">Procédés atelier C500</text>
    <text x="240" y="194" font-family="Arial, sans-serif" font-size="12" fill="#cbd5e1">Tournage + colle + pins</text>
    <text x="455" y="194" font-family="Arial, sans-serif" font-size="12" fill="#cbd5e1">Fraisage 2.5D direct</text>
    <line x1="22" y1="208" x2="653" y2="208" stroke="#1e293b"/>

    <text x="24" y="236" font-family="Arial, sans-serif" font-size="12" fill="#f8fafc">Transmission 120 N.m</text>
    <text x="240" y="236" font-family="Arial, sans-serif" font-size="12" fill="#cbd5e1">Friction tube (risque gliss.)</text>
    <text x="455" y="236" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#34d399">Emboîtement + M5×70 (Sf 9,75)</text>
    <line x1="22" y1="250" x2="653" y2="250" stroke="#1e293b"/>

    <text x="24" y="278" font-family="Arial, sans-serif" font-size="12" fill="#f8fafc">Maintenance RS-04</text>
    <text x="240" y="278" font-family="Arial, sans-serif" font-size="12" fill="#cbd5e1">Démontage global cage</text>
    <text x="455" y="278" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#34d399">Accès direct 10 vis M4</text>

    <rect x="22" y="302" width="631" height="72" rx="8" fill="#0f172a" stroke="#38bdf8" stroke-width="1.3"/>
    <text x="38" y="326" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#38bdf8">RECOMMANDATION INGÉNIERIE VALIDÉE (Torse-123 v42) :</text>
    <text x="38" y="346" font-family="Arial, sans-serif" font-size="11.5" fill="#e2e8f0">Semelle 158,32 g/u + Insert 85,71 g/u + Tube 60×60 100,04 g/u + Bride v87 202,30 g/u.</text>
    <text x="38" y="364" font-family="Arial, sans-serif" font-size="11.5" fill="#a7f3d0">Zéro cage avant, dissipation thermique directe dans l'Alu 7075, maintenance rapide.</text>
  </g>
</svg>