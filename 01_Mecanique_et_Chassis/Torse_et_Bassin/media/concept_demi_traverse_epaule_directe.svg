<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 960" width="100%" height="100%">
  <defs>
    <!-- Background Grid Patterns -->
    <pattern id="grid-pattern" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#1e293b" stroke-width="1" />
      <path d="M 200 0 L 0 0 0 200" fill="none" stroke="#2a324b" stroke-width="1.5" />
    </pattern>

    <!-- Gradients -->
    <linearGradient id="grad-sky" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#0284c7" />
    </linearGradient>
    <linearGradient id="grad-amber" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f59e0b" />
      <stop offset="100%" stop-color="#b45309" />
    </linearGradient>
    <linearGradient id="grad-emerald" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981" />
      <stop offset="100%" stop-color="#047857" />
    </linearGradient>
    <linearGradient id="grad-card" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" stop-opacity="0.95" />
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0.95" />
    </linearGradient>

    <!-- Filters for Glow & Shadows -->
    <filter id="drop-shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#000000" flood-opacity="0.6" />
    </filter>
  </defs>

  <!-- Background Base -->
  <rect width="1400" height="960" fill="#0b1120" />
  <rect width="1400" height="960" fill="url(#grid-pattern)" />

  <!-- HEADER -->
  <g transform="translate(40, 30)">
    <rect width="1320" height="70" rx="8" fill="#1e293b" stroke="#334155" stroke-width="1.5" filter="url(#drop-shadow)" />
    <circle cx="35" cy="35" r="18" fill="url(#grad-sky)" />
    <path d="M 28 35 L 42 35 M 35 28 L 35 42" stroke="#ffffff" stroke-width="2.5" stroke-linecap="round" />
    <text x="68" y="32" font-family="'Segoe UI', sans-serif" font-size="20" font-weight="700" fill="#f8fafc">
      D-BOT V1 — ARCHITECTURE ÉPAULE V2 : ÉVOLUTION DEMI-TRAVERSE &amp; FIXATION DIRECTE STATOR
    </text>
    <text x="68" y="54" font-family="'Segoe UI', sans-serif" font-size="13" font-weight="500" fill="#94a3b8">
      Suppression de la cage H-bracket · Connexion directe Bride Monobloc 7075 (10× M4) sur Stator RS-04 (Centrage Ø95 mm H7)
    </text>
    <rect x="1130" y="20" width="165" height="30" rx="6" fill="#0284c7" fill-opacity="0.2" stroke="#38bdf8" stroke-width="1" />
    <text x="1212" y="40" text-anchor="middle" font-family="'Segoe UI', sans-serif" font-size="12" font-weight="700" fill="#38bdf8">
      ARCHITECTURE V2
    </text>
  </g>

  <!-- ========================================================================= -->
  <!-- PANEL 1: VUE FRONTALE D'ENSEMBLE (Plan X-Z) -->
  <!-- ========================================================================= -->
  <g transform="translate(40, 120)">
    <rect width="640" height="400" rx="10" fill="url(#grad-card)" stroke="#334155" stroke-width="1.5" filter="url(#drop-shadow)" />
    <rect x="15" y="15" width="220" height="26" rx="4" fill="#0f172a" stroke="#475569" stroke-width="1" />
    <text x="25" y="32" font-family="'Segoe UI', sans-serif" font-size="12" font-weight="700" fill="#38bdf8">
      1. VUE FRONTALE D'ENSEMBLE (Plan X-Z)
    </text>

    <!-- Center Line (Spine) -->
    <line x1="80" y1="55" x2="80" y2="375" stroke="#ec4899" stroke-width="1.5" stroke-dasharray="6,4" />
    <text x="80" y="390" text-anchor="middle" font-family="'Segoe UI', sans-serif" font-size="11" font-weight="600" fill="#ec4899">AXE SAGITTAL (X=0)</text>

    <!-- Plaque Sagittale 5mm -->
    <rect x="74" y="65" width="12" height="300" rx="2" fill="url(#grad-amber)" stroke="#f59e0b" stroke-width="1" />
    <text x="45" y="200" font-family="'Segoe UI', sans-serif" font-size="11" font-weight="600" fill="#fcd34d" transform="rotate(-90,45,200)">Plaque Colonne 5 mm</text>

    <!-- Demi-Traverse Droite (Alu Usiné) -->
    <!-- Semelle centrale -->
    <path d="M 86 110 L 115 110 L 115 290 L 86 290 Z" fill="#38bdf8" fill-opacity="0.25" stroke="#38bdf8" stroke-width="2" />
    <!-- Vis liaison colonne -->
    <circle cx="100" cy="135" r="4.5" fill="#f8fafc" stroke="#0284c7" stroke-width="1.5" />
    <circle cx="100" cy="180" r="4.5" fill="#f8fafc" stroke="#0284c7" stroke-width="1.5" />
    <circle cx="100" cy="220" r="4.5" fill="#f8fafc" stroke="#0284c7" stroke-width="1.5" />
    <circle cx="100" cy="265" r="4.5" fill="#f8fafc" stroke="#0284c7" stroke-width="1.5" />

    <!-- Corps de Poutre Tube Carré 60x60x2 mm -->
    <rect x="115" y="130" width="175" height="140" fill="#1e293b" stroke="#38bdf8" stroke-width="2" />
    <rect x="115" y="136" width="175" height="128" fill="#0f172a" fill-opacity="0.9" />
    <text x="202" y="195" text-anchor="middle" font-family="'Segoe UI', sans-serif" font-size="12" font-weight="700" fill="#38bdf8">TUBE 60×60×2 mm</text>
    <text x="202" y="210" text-anchor="middle" font-family="'Segoe UI', sans-serif" font-size="10" fill="#94a3b8">Alu 6060-T6 (L=85 mm)</text>

    <!-- Flasque Côté Moteur (Direct Stator) -->
    <path d="M 290 80 L 305 80 L 305 320 L 290 320 Z" fill="#0284c7" stroke="#38bdf8" stroke-width="2" />
    <text x="297" y="65" text-anchor="middle" font-family="'Segoe UI', sans-serif" font-size="9" font-weight="700" fill="#38bdf8">Flasque 6mm</text>

    <!-- Stator RS-04 (Doré/Marron) -->
    <rect x="305" y="90" width="60" height="220" rx="4" fill="#d97706" fill-opacity="0.35" stroke="#f59e0b" stroke-width="2" />
    <text x="335" y="200" text-anchor="middle" font-family="'Segoe UI', sans-serif" font-size="12" font-weight="700" fill="#fde68a" transform="rotate(-90,335,200)">STATOR RS-04 (120 Nm)</text>

    <!-- Vis 10x M4 directes PCD Ø106 mm -->
    <line x1="290" y1="105" x2="320" y2="105" stroke="#f8fafc" stroke-width="2.5" stroke-linecap="round" />
    <line x1="290" y1="295" x2="320" y2="295" stroke="#f8fafc" stroke-width="2.5" stroke-linecap="round" />
    <text x="345" y="70" font-family="'Segoe UI', sans-serif" font-size="9" font-weight="700" fill="#34d399">10× M4×12 direct</text>

    <!-- Face Avant Dégagée -->
    <rect x="365" y="90" width="30" height="220" rx="2" fill="#10b981" fill-opacity="0.1" stroke="#34d399" stroke-width="1" stroke-dasharray="4,2" />
    <text x="380" y="200" text-anchor="middle" font-family="'Segoe UI', sans-serif" font-size="9" font-weight="700" fill="#34d399" transform="rotate(-90,380,200)">FACE AVANT LIBRE</text>

    <!-- Cotes et annotations -->
    <line x1="86" y1="365" x2="305" y2="365" stroke="#94a3b8" stroke-width="1.5" />
    <line x1="86" y1="358" x2="86" y2="372" stroke="#94a3b8" stroke-width="1.5" />
    <line x1="305" y1="358" x2="305" y2="372" stroke="#94a3b8" stroke-width="1.5" />
    <text x="195" y="360" text-anchor="middle" font-family="'Segoe UI', sans-serif" font-size="11" font-weight="700" fill="#f8fafc">Longueur Demi-Traverse ~125 mm (C500)</text>
  </g>

  <!-- ========================================================================= -->
  <!-- PANEL 2: VUE PERSPECTIVE 3D DU COMPOSANT MONOBLOC -->
  <!-- ========================================================================= -->
  <g transform="translate(720, 120)">
    <rect width="640" height="400" rx="10" fill="url(#grad-card)" stroke="#334155" stroke-width="1.5" filter="url(#drop-shadow)" />
    <rect x="15" y="15" width="310" height="26" rx="4" fill="#0f172a" stroke="#475569" stroke-width="1" />
    <text x="25" y="32" font-family="'Segoe UI', sans-serif" font-size="12" font-weight="700" fill="#38bdf8">
      2. PERSPECTIVE DU MODULE ÉPAULE DIRECT
    </text>

    <!-- Dessin 3D Isométrique Stylisé -->
    <g transform="translate(40, 60)">
      <!-- Semelle d'ancrage colonne (Gauche) -->
      <polygon points="60,110 90,95 90,260 60,275" fill="#0284c7" stroke="#38bdf8" stroke-width="1.5" />
      <polygon points="90,95 120,80 120,245 90,260" fill="#0369a1" stroke="#38bdf8" stroke-width="1.5" />

      <!-- Tube Carré 60x60x2 mm -->
      <polygon points="120,95 280,95 310,75 150,75" fill="#64748b" stroke="#38bdf8" stroke-width="1.5" />
      <polygon points="120,95 280,95 280,215 120,215" fill="#334155" stroke="#38bdf8" stroke-width="1.5" />
      <polygon points="280,95 310,75 310,195 280,215" fill="#1e293b" stroke="#38bdf8" stroke-width="1.5" />
      <text x="200" y="160" text-anchor="middle" font-family="'Segoe UI', sans-serif" font-size="11" font-weight="700" fill="#93c5fd">TUBE 60×60</text>

      <!-- Flasque circulaire Bride Monobloc (Droite) -->
      <ellipse cx="340" cy="155" rx="30" ry="85" fill="#0284c7" fill-opacity="0.8" stroke="#38bdf8" stroke-width="2" />
      <ellipse cx="340" cy="155" rx="18" ry="50" fill="#0f172a" stroke="#38bdf8" stroke-width="1.5" />
      <text x="340" y="160" text-anchor="middle" font-family="'Segoe UI', sans-serif" font-size="9" font-weight="700" fill="#38bdf8">Centrage Ø95</text>

      <!-- Trous de fixation Stator PCD Ø106 mm -->
      <circle cx="325" cy="95" r="3.5" fill="#f8fafc" stroke="#0284c7" stroke-width="1" />
      <circle cx="355" cy="95" r="3.5" fill="#f8fafc" stroke="#0284c7" stroke-width="1" />
      <circle cx="365" cy="155" r="3.5" fill="#f8fafc" stroke="#0284c7" stroke-width="1" />
      <circle cx="355" cy="215" r="3.5" fill="#f8fafc" stroke="#0284c7" stroke-width="1" />
      <circle cx="325" cy="215" r="3.5" fill="#f8fafc" stroke="#0284c7" stroke-width="1" />

      <!-- Légendes Callout 3D -->
      <path d="M 340 70 L 390 40 L 480 40" fill="none" stroke="#34d399" stroke-width="1.5" />
      <text x="400" y="32" font-family="'Segoe UI', sans-serif" font-size="11" font-weight="700" fill="#34d399">10× M4 Direct Stator</text>

      <path d="M 75 140 L 40 100 L 10 100" fill="none" stroke="#f59e0b" stroke-width="1.5" />
      <text x="10" y="92" font-family="'Segoe UI', sans-serif" font-size="11" font-weight="700" fill="#fcd34d">Appui Plaque 5 mm</text>
    </g>
  </g>

  <!-- ========================================================================= -->
  <!-- PANEL 3: VUE DE DESSUS (Plan Transversal X-Y) — MONTAGE EN SANDWICH -->
  <!-- ========================================================================= -->
  <g transform="translate(40, 540)">
    <rect width="640" height="380" rx="10" fill="url(#grad-card)" stroke="#334155" stroke-width="1.5" filter="url(#drop-shadow)" />
    <rect x="15" y="15" width="310" height="26" rx="4" fill="#0f172a" stroke="#475569" stroke-width="1" />
    <text x="25" y="32" font-family="'Segoe UI', sans-serif" font-size="12" font-weight="700" fill="#38bdf8">
      3. VUE DE DESSUS (Plan X-Y) : PRINCIPE DE FIXATION
    </text>

    <!-- Schéma Coupe de Dessus -->
    <g transform="translate(30, 70)">
      <!-- Plaque Colonne Centrale 5 mm -->
      <rect x="180" y="20" width="8" height="230" rx="1" fill="url(#grad-amber)" stroke="#f59e0b" stroke-width="1.5" />
      <text x="184" y="265" text-anchor="middle" font-family="'Segoe UI', sans-serif" font-size="11" font-weight="700" fill="#fcd34d">COLONNE 5 mm</text>

      <!-- Demi-Traverse GAUCHE -->
      <rect x="50" y="50" width="130" height="150" fill="#38bdf8" fill-opacity="0.2" stroke="#38bdf8" stroke-width="2" />
      <!-- Flasque épaule G -->
      <rect x="30" y="30" width="20" height="190" rx="3" fill="#0284c7" stroke="#38bdf8" stroke-width="1.5" />

      <!-- Demi-Traverse DROITE -->
      <rect x="188" y="50" width="130" height="150" fill="#38bdf8" fill-opacity="0.3" stroke="#38bdf8" stroke-width="2" />
      <!-- Flasque épaule D -->
      <rect x="318" y="30" width="20" height="190" rx="3" fill="#0284c7" stroke="#38bdf8" stroke-width="1.5" />

      <!-- Vis Traversantes d'Assemblage Sandwich au Centre (4x M5x25) -->
      <line x1="160" y1="80" x2="208" y2="80" stroke="#f8fafc" stroke-width="4" stroke-linecap="round" />
      <line x1="160" y1="120" x2="208" y2="120" stroke="#f8fafc" stroke-width="4" stroke-linecap="round" />
      <line x1="160" y1="160" x2="208" y2="160" stroke="#f8fafc" stroke-width="4" stroke-linecap="round" />
      <text x="215" y="125" font-family="'Segoe UI', sans-serif" font-size="10" font-weight="700" fill="#f8fafc">4x M5×25</text>

      <!-- Moteur Droit RS-04 -->
      <rect x="338" y="45" width="40" height="160" rx="3" fill="#d97706" fill-opacity="0.4" stroke="#f59e0b" stroke-width="1.5" />

      <!-- Moteur Gauche RS-04 -->
      <rect x="-10" y="45" width="40" height="160" rx="3" fill="#d97706" fill-opacity="0.4" stroke="#f59e0b" stroke-width="1.5" />

      <!-- Annotations Avantages -->
      <rect x="420" y="30" width="165" height="95" rx="6" fill="#0f172a" stroke="#10b981" stroke-width="1" />
      <text x="430" y="52" font-family="'Segoe UI', sans-serif" font-size="11" font-weight="700" fill="#34d399">AVANTAGES V2 :</text>
      <text x="430" y="70" font-family="'Segoe UI', sans-serif" font-size="10" fill="#f8fafc">✓ 0 cage, 0 tirant parasite</text>
      <text x="430" y="86" font-family="'Segoe UI', sans-serif" font-size="10" fill="#f8fafc">✓ Centrage direct Ø95 H7</text>
      <text x="430" y="102" font-family="'Segoe UI', sans-serif" font-size="10" fill="#f8fafc">✓ Rigidité torsion 120 Nm</text>
      <text x="430" y="118" font-family="'Segoe UI', sans-serif" font-size="10" fill="#f8fafc">✓ 100% démontable C500</text>
    </g>
  </g>

  <!-- ========================================================================= -->
  <!-- PANEL 4: SYNTHÈSE TECHNIQUE & GAIN MASSE/COMPLEXITÉ -->
  <!-- ========================================================================= -->
  <g transform="translate(720, 540)">
    <rect width="640" height="380" rx="10" fill="url(#grad-card)" stroke="#334155" stroke-width="1.5" filter="url(#drop-shadow)" />
    <rect x="15" y="15" width="310" height="26" rx="4" fill="#0f172a" stroke="#475569" stroke-width="1" />
    <text x="25" y="32" font-family="'Segoe UI', sans-serif" font-size="12" font-weight="700" fill="#38bdf8">
      4. BILAN COMPARATIF &amp; MATURITÉ DE CONCEPTION
    </text>

    <!-- Tableau Comparatif Visuel -->
    <g transform="translate(20, 55)">
      <!-- En-tête -->
      <rect x="0" y="0" width="600" height="30" rx="4" fill="#0f172a" stroke="#475569" stroke-width="1" />
      <text x="15" y="20" font-family="'Segoe UI', sans-serif" font-size="11" font-weight="700" fill="#94a3b8">PARAMÈTRE</text>
      <text x="210" y="20" font-family="'Segoe UI', sans-serif" font-size="11" font-weight="700" fill="#f43f5e">DESIGN V1 (COMPOSITE)</text>
      <text x="410" y="20" font-family="'Segoe UI', sans-serif" font-size="11" font-weight="700" fill="#34d399">NOUVEAU DESIGN V2 DIRECT</text>

      <!-- Ligne 1: Nombre de pièces -->
      <rect x="0" y="35" width="600" height="32" rx="4" fill="#1e293b" fill-opacity="0.5" />
      <text x="15" y="56" font-family="'Segoe UI', sans-serif" font-size="11" font-weight="600" fill="#f8fafc">Nb de pièces usinées</text>
      <text x="210" y="56" font-family="'Segoe UI', sans-serif" font-size="11" fill="#fca5a5">7 pièces + tube composite</text>
      <text x="410" y="56" font-family="'Segoe UI', sans-serif" font-size="11" font-weight="700" fill="#6ee7b7">4 pièces (2 inserts + 2 brides)</text>

      <!-- Ligne 2: Masse totale liaison -->
      <rect x="0" y="72" width="600" height="32" rx="4" fill="#0f172a" fill-opacity="0.5" />
      <text x="15" y="93" font-family="'Segoe UI', sans-serif" font-size="11" font-weight="600" fill="#f8fafc">Masse totale structure</text>
      <text x="210" y="93" font-family="'Segoe UI', sans-serif" font-size="11" fill="#fca5a5">~815 g (avec inserts/vis)</text>
      <text x="410" y="93" font-family="'Segoe UI', sans-serif" font-size="11" font-weight="700" fill="#6ee7b7">~394 g (Gain -51%)</text>

      <!-- Ligne 3: Procédé de fabrication -->
      <rect x="0" y="109" width="600" height="32" rx="4" fill="#1e293b" fill-opacity="0.5" />
      <text x="15" y="130" font-family="'Segoe UI', sans-serif" font-size="11" font-weight="600" fill="#f8fafc">Procédés atelier</text>
      <text x="210" y="130" font-family="'Segoe UI', sans-serif" font-size="11" fill="#fca5a5">Tournage + Fente + Colle + Pins</text>
      <text x="410" y="130" font-family="'Segoe UI', sans-serif" font-size="11" font-weight="700" fill="#6ee7b7">Fraisage CNC 2.5D C500 direct</text>

      <!-- Ligne 4: Reprise Couple RS-04 -->
      <rect x="0" y="146" width="600" height="32" rx="4" fill="#0f172a" fill-opacity="0.5" />
      <text x="15" y="167" font-family="'Segoe UI', sans-serif" font-size="11" font-weight="600" fill="#f8fafc">Transmission couple 120 Nm</text>
      <text x="210" y="167" font-family="'Segoe UI', sans-serif" font-size="11" fill="#fca5a5">Friction sur tube (glissement)</text>
      <text x="410" y="167" font-family="'Segoe UI', sans-serif" font-size="11" font-weight="700" fill="#6ee7b7">Tube carré + 10x M4 (Sf = ×9.75)</text>

      <!-- Ligne 5: Maintenance / Démontage -->
      <rect x="0" y="183" width="600" height="32" rx="4" fill="#1e293b" fill-opacity="0.5" />
      <text x="15" y="204" font-family="'Segoe UI', sans-serif" font-size="11" font-weight="600" fill="#f8fafc">Maintenance moteur</text>
      <text x="210" y="204" font-family="'Segoe UI', sans-serif" font-size="11" fill="#fca5a5">Démontage global complexe</text>
      <text x="410" y="204" font-family="'Segoe UI', sans-serif" font-size="11" font-weight="700" fill="#6ee7b7">4 vis au centre = épaule libre</text>
    </g>

    <!-- Résumé Recommandation -->
    <g transform="translate(20, 285)">
      <rect width="600" height="70" rx="6" fill="#0284c7" fill-opacity="0.15" stroke="#38bdf8" stroke-width="1.5" />
      <text x="20" y="25" font-family="'Segoe UI', sans-serif" font-size="12" font-weight="700" fill="#38bdf8">RECOMMANDATION INGÉNIERIE D-BOT V2 :</text>
      <text x="20" y="45" font-family="'Segoe UI', sans-serif" font-size="11" fill="#e2e8f0">
        Adopter l'Architecture V2 Directe : Tube carré 60×60×2 mm + Bride monobloc 7075-T651.
      </text>
      <text x="20" y="60" font-family="'Segoe UI', sans-serif" font-size="11" fill="#e2e8f0">
        Suppression de 100% des cages H-bracket, gain de 368 g et ventilation face avant libre.
      </text>
    </g>
  </g>
</svg>
