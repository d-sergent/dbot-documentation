<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1040" width="1600" height="1040">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090d16"/>
      <stop offset="55%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#0b1120"/>
    </linearGradient>
    <linearGradient id="panelGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" stop-opacity="0.96"/>
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0.96"/>
    </linearGradient>
    <linearGradient id="aluOrange" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#c2410c"/>
      <stop offset="50%" stop-color="#ea580c"/>
      <stop offset="100%" stop-color="#f97316"/>
    </linearGradient>
    <linearGradient id="aluAmber" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#b45309"/>
      <stop offset="50%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#d97706"/>
    </linearGradient>
    <linearGradient id="aluBlue" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#1e3a8a"/>
      <stop offset="50%" stop-color="#2563eb"/>
      <stop offset="100%" stop-color="#1d4ed8"/>
    </linearGradient>
    <linearGradient id="steelGreen" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#15803d"/>
      <stop offset="50%" stop-color="#22c55e"/>
      <stop offset="100%" stop-color="#16a34a"/>
    </linearGradient>
    <linearGradient id="paViolet" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#5b21b6"/>
      <stop offset="50%" stop-color="#7c3aed"/>
      <stop offset="100%" stop-color="#6d28d9"/>
    </linearGradient>
    <linearGradient id="motorSlate" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#334155"/>
      <stop offset="50%" stop-color="#475569"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
    <pattern id="gridPat" width="30" height="30" patternUnits="userSpaceOnUse">
      <path d="M 30 0 L 0 0 0 30" fill="none" stroke="#334155" stroke-width="0.55" stroke-opacity="0.28"/>
    </pattern>
    <pattern id="hatchWaste" width="10" height="10" patternTransform="rotate(45 0 0)" patternUnits="userSpaceOnUse">
      <line x1="0" y1="0" x2="0" y2="10" stroke="#ef4444" stroke-width="1.6" stroke-opacity="0.55"/>
    </pattern>
    <marker id="arrCyan" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <polygon points="0 1, 8 4, 0 7" fill="#38bdf8"/>
    </marker>
    <marker id="arrRed" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <polygon points="0 1, 8 4, 0 7" fill="#ef4444"/>
    </marker>
    <marker id="arrAmber" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <polygon points="0 1, 8 4, 0 7" fill="#f59e0b"/>
    </marker>
    <marker id="arrGreen" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <polygon points="0 1, 8 4, 0 7" fill="#10b981"/>
    </marker>
    <filter id="cardShadow" x="-8%" y="-8%" width="116%" height="116%">
      <feDropShadow dx="0" dy="5" stdDeviation="6" flood-color="#000000" flood-opacity="0.55"/>
    </filter>
  </defs>
  <rect width="1600" height="1040" fill="url(#bgGrad)"/>
  <rect width="1600" height="1040" fill="url(#gridPat)"/>
  <g transform="translate(30, 22)">
    <rect width="1540" height="74" rx="12" fill="#1e293b" stroke="#3b82f6" stroke-width="1.5" filter="url(#cardShadow)"/>
    <circle cx="42" cy="37" r="20" fill="#38bdf8" fill-opacity="0.18" stroke="#38bdf8" stroke-width="2"/>
    <text x="42" y="44" font-family="Arial, sans-serif" font-size="19" font-weight="bold" fill="#38bdf8" text-anchor="middle">+</text>
    <text x="76" y="31" font-family="Arial, sans-serif" font-size="18" font-weight="bold" fill="#f8fafc">PORTIQUE TORSE — ANCRAGE PIED CORNIÈRE BASSE : TANDEM 2× M4 [91290A150]</text>
    <text x="76" y="54" font-family="Arial, sans-serif" font-size="12" fill="#94a3b8">Corniere basse v42 (70,34 g | 20,02×73,84×191,10 mm) : Tandem 2× CHC M4×14 (d = 12,0 mm) vs Goupille</text>
    <rect x="1226" y="19" width="290" height="36" rx="8" fill="#0f172a" stroke="#10b981" stroke-width="1.3"/>
    <text x="1371" y="42" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#10b981" text-anchor="middle">SOLUTION CERTIFIÉE (v42)</text>
  </g>

  <!-- PANNEAU A -->
  <g transform="translate(30, 114)">
    <rect width="755" height="456" rx="12" fill="url(#panelGrad)" stroke="#334155" stroke-width="1.3" filter="url(#cardShadow)"/>
    <text x="20" y="30" font-family="Arial, sans-serif" font-size="13.5" font-weight="bold" fill="#38bdf8">PANNEAU A : PROFIL CORNIÈRE BASSE &amp; CONFLIT MANDRIN C500</text>

    <!-- Waist Plate bottom -->
    <rect x="44" y="388" width="290" height="36" rx="3" fill="url(#aluOrange)" stroke="#fb923c" stroke-width="1.6"/>
    <text x="189" y="411" font-family="Arial, sans-serif" font-size="11.5" font-weight="bold" fill="#fff" text-anchor="middle">Waist_Plate_7075 (9,02 mm | 433,53 g)</text>

    <!-- True Jogged Corniere Basse profile (Corniere_basse_iso.png!) -->
    <path d="M 102 82 L 154 82 L 154 96 L 122 96 L 122 204 L 176 286 L 176 372 L 246 372 L 246 388 L 160 388 L 160 294 L 104 212 L 102 82 Z" fill="url(#steelGreen)" stroke="#86efac" stroke-width="1.8"/>
    <text x="136" y="72" font-family="Arial, sans-serif" font-size="10.5" font-weight="bold" fill="#86efac" text-anchor="middle">Tête → ceinture [91292A122]</text>

    <!-- Dimension H = 191,10 mm far left -->
    <line x1="68" y1="82" x2="68" y2="388" stroke="#f8fafc" stroke-width="1.4" marker-end="url(#arrCyan)"/>
    <text x="54" y="240" font-family="Arial, sans-serif" font-size="11" font-weight="bold" fill="#f8fafc" text-anchor="middle" transform="rotate(-90 54 240)">Corniere basse H = 191,10 mm</text>

    <!-- C500 limit & chuck collision circle cleanly placed to right of L-foot -->
    <line x1="168" y1="224" x2="328" y2="224" stroke="#ef4444" stroke-width="1.6" stroke-dasharray="6,4"/>
    <text x="248" y="214" font-family="Arial, sans-serif" font-size="10.5" font-weight="bold" fill="#ef4444" text-anchor="middle">Course Z C500 = 128 mm DÉPASSÉE</text>
    <circle cx="242" cy="316" r="34" fill="#ef4444" fill-opacity="0.22" stroke="#ef4444" stroke-width="1.8" stroke-dasharray="4,3"/>
    <text x="242" y="314" font-family="Arial, sans-serif" font-size="10" font-weight="bold" fill="#fca5a5" text-anchor="middle">COLLISION</text>
    <text x="242" y="328" font-family="Arial, sans-serif" font-size="9.5" fill="#fca5a5" text-anchor="middle">Mandrin Ø 45</text>

    <!-- Diagnostic box x=356..735 -->
    <rect x="356" y="54" width="380" height="378" rx="8" fill="#0f172a" stroke="#ef4444" stroke-width="1.2"/>
    <text x="374" y="80" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#fca5a5">DIAGNOSTIC ATELIER : L'IMPASSE GOUPILLE</text>
    <text x="374" y="108" font-family="Arial, sans-serif" font-size="11" font-weight="bold" fill="#f8fafc">1. Dépassement Course Z C500 :</text>
    <text x="374" y="128" font-family="Arial, sans-serif" font-size="11" fill="#cbd5e1">• Hauteur Corniere = 191,10 mm &gt; Z_max C500 (128 mm).</text>
    <text x="374" y="146" font-family="Arial, sans-serif" font-size="11" fill="#cbd5e1">• Impossible de brider la cornière debout pour aléser H7.</text>
    <text x="374" y="176" font-family="Arial, sans-serif" font-size="11" font-weight="bold" fill="#f8fafc">2. Interférence Mandrin / Montant :</text>
    <text x="374" y="196" font-family="Arial, sans-serif" font-size="11" fill="#cbd5e1">• Pied serré contre le voile vertical : un mandrin Ø 45 mm</text>
    <text x="374" y="214" font-family="Arial, sans-serif" font-size="11" fill="#cbd5e1">percute la paroi avant d'atteindre la semelle.</text>
    <text x="374" y="244" font-family="Arial, sans-serif" font-size="11" font-weight="bold" fill="#f8fafc">3. Tolérance Micrométrique Goupille :</text>
    <text x="374" y="264" font-family="Arial, sans-serif" font-size="11" fill="#cbd5e1">• Une goupille exige alésage H7 (+/- 0,01 mm), impossible</text>
    <text x="374" y="282" font-family="Arial, sans-serif" font-size="11" fill="#cbd5e1">à garantir au perçage portatif en atelier.</text>
    <rect x="372" y="302" width="348" height="114" rx="6" fill="#064e3b" stroke="#10b981"/>
    <text x="386" y="326" font-family="Arial, sans-serif" font-size="11.5" font-weight="bold" fill="#34d399">SOLUTION VALIDÉE (TORSE-123 v42) :</text>
    <text x="386" y="348" font-family="Arial, sans-serif" font-size="11" fill="#d1fae5">Tandem 2× CHC M4×14 [91290A150] (entraxe 12,0 mm)</text>
    <text x="386" y="368" font-family="Arial, sans-serif" font-size="11" fill="#d1fae5">guidés par gabarit 3D (Ø 4,5 mm lisses sur cornière).</text>
    <text x="386" y="388" font-family="Arial, sans-serif" font-size="11" fill="#d1fae5">Zéro alésage H7, couple anti-lacet bloqué par friction.</text>
  </g>

  <!-- PANNEAU B : TOP VIEW -->
  <g transform="translate(815, 114)">
    <rect width="755" height="456" rx="12" fill="url(#panelGrad)" stroke="#10b981" stroke-width="1.3" filter="url(#cardShadow)"/>
    <text x="20" y="30" font-family="Arial, sans-serif" font-size="13.5" font-weight="bold" fill="#10b981">PANNEAU B : VUE DE DESSUS SEMELLE &amp; TANDEM 2× M4 (d = 12,0 mm)</text>

    <!-- Waist Plate top outline -->
    <rect x="38" y="64" width="300" height="360" rx="8" fill="#1e3a8a" stroke="#38bdf8" stroke-width="1.6"/>
    <text x="188" y="88" font-family="Arial, sans-serif" font-size="11" font-weight="bold" fill="#bfdbfe" text-anchor="middle">Waist_Plate_7075 (Z = 1042,43 mm)</text>

    <!-- Rounded-end Corniere Basse foot matching Corniere_basse_dessus.png -->
    <rect x="134" y="138" width="110" height="220" rx="22" fill="url(#steelGreen)" stroke="#86efac" stroke-width="2"/>
    <text x="189" y="164" font-family="Arial, sans-serif" font-size="11" font-weight="bold" fill="#fff" text-anchor="middle">Semelle 7075</text>

    <!-- 2 M4 holes d=12mm -->
    <circle cx="189" cy="216" r="14" fill="#0f172a" stroke="#fde68a" stroke-width="2.2"/>
    <circle cx="189" cy="216" r="6" fill="#fde68a"/>
    <circle cx="189" cy="300" r="14" fill="#0f172a" stroke="#fde68a" stroke-width="2.2"/>
    <circle cx="189" cy="300" r="6" fill="#fde68a"/>

    <line x1="154" y1="216" x2="154" y2="300" stroke="#facc15" stroke-width="2"/>
    <text x="142" y="262" font-family="Arial, sans-serif" font-size="11.5" font-weight="bold" fill="#facc15" text-anchor="end">d = 12,0 mm</text>
    <text x="212" y="220" font-family="Arial, sans-serif" font-size="10.5" font-weight="bold" fill="#fde68a">Vis 1 (M4×14)</text>
    <text x="212" y="304" font-family="Arial, sans-serif" font-size="10.5" font-weight="bold" fill="#fde68a">Vis 2 (Tandem)</text>
    <text x="188" y="408" font-family="Arial, sans-serif" font-size="10.5" fill="#93c5fd" text-anchor="middle">2× Taraudages M4 usinés C500 sur Waist_Plate</text>

    <!-- Specs box right -->
    <rect x="356" y="54" width="380" height="378" rx="8" fill="#0f172a" stroke="#10b981" stroke-width="1.2"/>
    <text x="374" y="80" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#34d399">SPÉCIFICATIONS TECHNIQUES (v42)</text>
    <text x="374" y="108" font-family="Arial, sans-serif" font-size="11" font-weight="bold" fill="#f8fafc">1. Encombrement &amp; Entraxe :</text>
    <text x="374" y="128" font-family="Arial, sans-serif" font-size="11" fill="#cbd5e1">• Pièce Corniere basse : 20,02 × 73,84 × 191,10 mm</text>
    <text x="374" y="146" font-family="Arial, sans-serif" font-size="11" fill="#cbd5e1">• Masse auditée v42 : 70,34 g/u (140,68 g / paire)</text>
    <text x="374" y="164" font-family="Arial, sans-serif" font-size="11" fill="#cbd5e1">• Entraxe rigoureux pied tandem : d = 12,00 mm</text>
    <text x="374" y="194" font-family="Arial, sans-serif" font-size="11" font-weight="bold" fill="#f8fafc">2. Quincaillerie Certifiée McMaster :</text>
    <text x="374" y="214" font-family="Arial, sans-serif" font-size="11" fill="#fde68a">• Pied → Waist_Plate : 4× CHC M4×14 cl. 12.9 [91290A150]</text>
    <text x="374" y="232" font-family="Arial, sans-serif" font-size="11" fill="#fde68a">• Freinage : Nord-Lock M4 [91812A252] + Nylstop [93625A150]</text>
    <text x="374" y="250" font-family="Arial, sans-serif" font-size="11" fill="#cbd5e1">• Tête → ceinture 3 mm : CHC M4×25 [91292A122]</text>
    <text x="374" y="280" font-family="Arial, sans-serif" font-size="11" font-weight="bold" fill="#f8fafc">3. Couples &amp; Précharge :</text>
    <text x="374" y="300" font-family="Arial, sans-serif" font-size="11" fill="#cbd5e1">• Serrage nominal : 3,0 N.m (clé Allen 3,0 mm)</text>
    <text x="374" y="318" font-family="Arial, sans-serif" font-size="11" fill="#cbd5e1">• Précharge cumulée : ~13 400 N / pied (2 vis 12.9)</text>
    <text x="374" y="348" font-family="Arial, sans-serif" font-size="11" font-weight="bold" fill="#34d399">4. Zéro Collision Inférieure RB8016 :</text>
    <text x="374" y="368" font-family="Arial, sans-serif" font-size="11" fill="#a7f3d0">• Pied à Z = 1042,4 mm | Entrefer libre &gt; 25 mm</text>
    <text x="374" y="386" font-family="Arial, sans-serif" font-size="11" fill="#a7f3d0">au-dessus du roulement RB8016 (Z = 1018 mm).</text>
  </g>

  <!-- PANNEAU C : RDM COMPARISON -->
  <g transform="translate(30, 590)">
    <rect width="755" height="420" rx="12" fill="url(#panelGrad)" stroke="#334155" stroke-width="1.3" filter="url(#cardShadow)"/>
    <text x="20" y="30" font-family="Arial, sans-serif" font-size="13.5" font-weight="bold" fill="#38bdf8">PANNEAU C : RDM — 1 VIS (ROTULE) vs TANDEM 2× M4 (ENCASTREMENT)</text>

    <rect x="24" y="54" width="340" height="338" rx="8" fill="#0f172a" stroke="#ef4444" stroke-width="1.2"/>
    <text x="40" y="80" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#ef4444">1 VIS SEULE : MODÈLE ROTULE</text>
    <rect x="138" y="138" width="112" height="48" rx="6" fill="#475569" stroke="#ef4444"/>
    <circle cx="194" cy="162" r="10" fill="#ef4444"/>
    <text x="194" y="122" font-family="Arial, sans-serif" font-size="11" fill="#fca5a5" text-anchor="middle">Pivot libre Rz (moment nul)</text>
    <text x="40" y="232" font-family="Arial, sans-serif" font-size="11.5" fill="#cbd5e1">• Résistance lacet = simple frottement sec.</text>
    <text x="40" y="258" font-family="Arial, sans-serif" font-size="11.5" fill="#cbd5e1">• Sous choc RS-06 (210 N.m) : micro-glissement.</text>
    <text x="40" y="284" font-family="Arial, sans-serif" font-size="11.5" fill="#cbd5e1">• Dérive angulaire et désalignement portique.</text>
    <text x="40" y="346" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#ef4444">✗ REJETÉ : TROP VULNÉRABLE AUX CHOCS</text>

    <rect x="390" y="54" width="340" height="338" rx="8" fill="#0f172a" stroke="#10b981" stroke-width="1.2"/>
    <text x="406" y="80" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#34d399">TANDEM 2× M4 : ENCASTREMENT RIGIDE</text>
    <rect x="504" y="138" width="112" height="48" rx="6" fill="#064e3b" stroke="#10b981"/>
    <circle cx="534" cy="162" r="8" fill="#10b981"/>
    <circle cx="586" cy="162" r="8" fill="#10b981"/>
    <text x="560" y="122" font-family="Arial, sans-serif" font-size="11" font-weight="bold" fill="#a7f3d0" text-anchor="middle">Couple d'obstacle d = 12,0 mm</text>
    <text x="406" y="232" font-family="Arial, sans-serif" font-size="11.5" fill="#cbd5e1">• 2 vis espacées d = 12 mm + friction 13,4 kN.</text>
    <text x="406" y="258" font-family="Arial, sans-serif" font-size="11.5" fill="#cbd5e1">• Couple résistant &gt; 160 N.m (4× le pic lacet).</text>
    <text x="406" y="284" font-family="Arial, sans-serif" font-size="11.5" fill="#cbd5e1">• Découplage Z parfait via trou oblong haut.</text>
    <text x="406" y="346" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#34d399">✓ CERTIFIÉ : RIGIDITÉ ABSOLUE PORTIQUE</text>
  </g>

  <!-- PANNEAU D : DECISION MATRIX -->
  <g transform="translate(815, 590)">
    <rect width="755" height="420" rx="12" fill="url(#panelGrad)" stroke="#38bdf8" stroke-width="1.3" filter="url(#cardShadow)"/>
    <text x="20" y="30" font-family="Arial, sans-serif" font-size="13.5" font-weight="bold" fill="#38bdf8">PANNEAU D : MATRICE DÉCISIONNELLE ATELIER &amp; SOURCING</text>

    <text x="24" y="68" font-family="Arial, sans-serif" font-size="11" font-weight="bold" fill="#94a3b8">CRITÈRE D'ATELIER</text>
    <text x="255" y="68" font-family="Arial, sans-serif" font-size="11" font-weight="bold" fill="#fca5a5">OPTION B (1 VIS + GOUPILLE)</text>
    <text x="500" y="68" font-family="Arial, sans-serif" font-size="11" font-weight="bold" fill="#34d399">OPTION A (TANDEM 2× M4)</text>
    <line x1="22" y1="80" x2="733" y2="80" stroke="#334155"/>

    <text x="24" y="112" font-family="Arial, sans-serif" font-size="11.5" fill="#f8fafc">Tolérance d'entraxe</text>
    <text x="255" y="112" font-family="Arial, sans-serif" font-size="11.5" fill="#cbd5e1">+/- 0,02 mm (alésage H7)</text>
    <text x="500" y="112" font-family="Arial, sans-serif" font-size="11.5" font-weight="bold" fill="#34d399">+/- 0,25 mm (absorbé Ø 4,5 mm)</text>
    <line x1="22" y1="128" x2="733" y2="128" stroke="#1e293b"/>

    <text x="24" y="158" font-family="Arial, sans-serif" font-size="11.5" fill="#f8fafc">Outillage requis</text>
    <text x="255" y="158" font-family="Arial, sans-serif" font-size="11.5" fill="#cbd5e1">Foret court + alésoir H7</text>
    <text x="500" y="158" font-family="Arial, sans-serif" font-size="11.5" font-weight="bold" fill="#34d399">Foret standard Ø 3,3 + Taraud M4</text>
    <line x1="22" y1="174" x2="733" y2="174" stroke="#1e293b"/>

    <text x="24" y="204" font-family="Arial, sans-serif" font-size="11.5" fill="#f8fafc">Usinage Waist Plate C500</text>
    <text x="255" y="204" font-family="Arial, sans-serif" font-size="11.5" fill="#cbd5e1">Reprise après bridage</text>
    <text x="500" y="204" font-family="Arial, sans-serif" font-size="11.5" font-weight="bold" fill="#34d399">100 % direct sur C500</text>
    <line x1="22" y1="220" x2="733" y2="220" stroke="#1e293b"/>

    <text x="24" y="250" font-family="Arial, sans-serif" font-size="11.5" fill="#f8fafc">Risque collision mandrin</text>
    <text x="255" y="250" font-family="Arial, sans-serif" font-size="11.5" fill="#fca5a5">Élevé sur montant 191 mm</text>
    <text x="500" y="250" font-family="Arial, sans-serif" font-size="11.5" font-weight="bold" fill="#34d399">Nul (vissage Allen par-dessus)</text>
    <line x1="22" y1="266" x2="733" y2="266" stroke="#1e293b"/>

    <text x="24" y="296" font-family="Arial, sans-serif" font-size="11.5" fill="#f8fafc">Précharge axiale d'assise</text>
    <text x="255" y="296" font-family="Arial, sans-serif" font-size="11.5" fill="#cbd5e1">6 700 N (1 seule vis)</text>
    <text x="500" y="296" font-family="Arial, sans-serif" font-size="11.5" font-weight="bold" fill="#34d399">13 400 N (2× M4×14 [91290A150])</text>

    <rect x="22" y="324" width="711" height="74" rx="8" fill="#064e3b" stroke="#10b981" stroke-width="1.2"/>
    <text x="38" y="350" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#a7f3d0">ARBITRAGE SYSTÈME D-BOT V2 :</text>
    <text x="38" y="374" font-family="Arial, sans-serif" font-size="11.5" fill="#d1fae5">Adoption définitive du Tandem 2× M4×14 [91290A150] (d = 12,0 mm) : rigidité RDM maximale et zéro galère d'usinage.</text>
  </g>
</svg>