<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 420" width="100%" height="100%">
  <defs>
    <pattern id="grid" width="20" height="20" patternUnits="userSpaceOnUse">
      <path d="M 20 0 L 0 0 0 20" fill="none" stroke="#2a324b" stroke-width="0.8"/>
    </pattern>

    <linearGradient id="alu" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#94a3b8"/>
      <stop offset="50%" stop-color="#64748b"/>
      <stop offset="100%" stop-color="#334155"/>
    </linearGradient>

    <linearGradient id="motor" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ea580c"/>
      <stop offset="100%" stop-color="#9a3412"/>
    </linearGradient>

    <linearGradient id="carbon" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="50%" stop-color="#334155"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>

    <linearGradient id="shell" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#475569" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#1e293b" stop-opacity="0.5"/>
    </linearGradient>
  </defs>

  <rect width="100%" height="100%" fill="#0f172a"/>
  <rect width="100%" height="100%" fill="url(#grid)"/>

  <!-- Title -->
  <text x="450" y="28" fill="#f8fafc" font-family="system-ui, sans-serif" font-size="14" font-weight="bold" text-anchor="middle">
    VUE ÉCLATÉE — SÉQUENCE D'ASSEMBLAGE COAXIALE DU CARTER MONOBLOC &amp; RS-04
  </text>

  <!-- Central Assembly Axis Line -->
  <line x1="40" y1="210" x2="860" y2="210" stroke="#38bdf8" stroke-width="1.5" stroke-dasharray="8,4"/>
  <text x="850" y="195" fill="#38bdf8" font-family="system-ui, sans-serif" font-size="10" text-anchor="end">Axe Coaxial Principal</text>

  <!-- 1. Vis CHC M5 (Far Left) -->
  <g transform="translate(60, 160)">
    <rect width="35" height="100" rx="4" fill="#ef4444" stroke="#ffffff" stroke-width="1"/>
    <text x="17" y="55" fill="#ffffff" font-family="system-ui, sans-serif" font-size="10" font-weight="bold" text-anchor="middle">Vis M5</text>
    <text x="17" y="70" fill="#ffffff" font-family="system-ui, sans-serif" font-size="8" text-anchor="middle">(×8 CHC)</text>
    <text x="17" y="-10" fill="#cbd5e0" font-family="system-ui, sans-serif" font-size="9" font-weight="bold" text-anchor="middle">① Vis M5</text>
  </g>

  <!-- Arrow 1 to 2 -->
  <path d="M 115 210 L 160 210 M 150 205 L 160 210 L 150 215" stroke="#38bdf8" stroke-width="2" fill="none"/>

  <!-- 2. Tube Carbone Ø30mm & Goupille (Top Ancrage) -->
  <g transform="translate(170, 70)">
    <rect x="0" y="90" width="100" height="30" rx="15" fill="url(#carbon)" stroke="#00f2fe" stroke-width="1.5"/>
    <text x="50" y="109" fill="#00f2fe" font-family="system-ui, sans-serif" font-size="9" font-weight="bold" text-anchor="middle">Tube Ø30mm</text>

    <!-- Goupille Ø3mm -->
    <rect x="43" y="45" width="14" height="40" rx="2" fill="#a855f7" stroke="#ffffff" stroke-width="1"/>
    <text x="50" y="38" fill="#a855f7" font-family="system-ui, sans-serif" font-size="8" font-weight="bold" text-anchor="middle">Goupille Ø3mm</text>
    <path d="M 50 85 L 50 90" stroke="#a855f7" stroke-width="1.5" stroke-dasharray="2,2"/>

    <text x="50" y="145" fill="#cbd5e0" font-family="system-ui, sans-serif" font-size="9" font-weight="bold" text-anchor="middle">② Ancrage Carbone</text>
  </g>

  <!-- Arrow 2 to 3 -->
  <path d="M 290 210 L 335 210 M 325 205 L 335 210 L 325 215" stroke="#38bdf8" stroke-width="2" fill="none"/>

  <!-- 3. Carter Monobloc Alu 6061-T6 (Middle-Left) -->
  <g transform="translate(350, 130)">
    <!-- Flasque Arriere 6mm -->
    <rect x="0" y="20" width="18" height="120" rx="2" fill="url(#alu)" stroke="#cbd5e0" stroke-width="1"/>
    <!-- Socket Carbone Top -->
    <rect x="0" y="0" width="40" height="20" rx="2" fill="url(#alu)" stroke="#cbd5e0" stroke-width="1"/>
    <!-- Paroi 360deg 3mm -->
    <rect x="18" y="20" width="90" height="15" fill="url(#alu)" stroke="#cbd5e0" stroke-width="1"/>
    <rect x="18" y="125" width="90" height="15" fill="url(#alu)" stroke="#cbd5e0" stroke-width="1"/>

    <text x="50" y="80" fill="#ffffff" font-family="system-ui, sans-serif" font-size="10" font-weight="bold" text-anchor="middle">Carter Monobloc</text>
    <text x="50" y="95" fill="#cbd5e0" font-family="system-ui, sans-serif" font-size="8" text-anchor="middle">Alu 6061-T6</text>
    <text x="50" y="-10" fill="#cbd5e0" font-family="system-ui, sans-serif" font-size="9" font-weight="bold" text-anchor="middle">③ Carter Monobloc</text>
  </g>

  <!-- Arrow 3 to 4 -->
  <path d="M 470 210 L 515 210 M 505 205 L 515 210 L 505 215" stroke="#38bdf8" stroke-width="2" fill="none"/>

  <!-- 4. Collet Torse PA12-CF (Middle-Right) -->
  <g transform="translate(530, 130)">
    <rect x="0" y="10" width="80" height="140" rx="6" fill="url(#shell)" stroke="#64748b" stroke-width="1.5" stroke-dasharray="4,2"/>
    <text x="40" y="80" fill="#cbd5e0" font-family="system-ui, sans-serif" font-size="9" font-weight="bold" text-anchor="middle">Collet Torse</text>
    <text x="40" y="95" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="8" text-anchor="middle">PA12-CF</text>
    <text x="40" y="-10" fill="#cbd5e0" font-family="system-ui, sans-serif" font-size="9" font-weight="bold" text-anchor="middle">④ Poche Coque</text>
  </g>

  <!-- Arrow 4 to 5 (Insertion Frontale du RS-04 depuis la droite) -->
  <path d="M 760 210 L 630 210 M 640 205 L 630 210 L 640 215" stroke="#f59e0b" stroke-width="2.5" fill="none"/>

  <!-- 5. Moteur RobStride RS-04 (Far Right) -->
  <g transform="translate(670, 140)">
    <rect x="0" y="10" width="100" height="120" rx="6" fill="url(#motor)" stroke="#ffedd5" stroke-width="1.5"/>
    <text x="50" y="65" fill="#ffffff" font-family="system-ui, sans-serif" font-size="11" font-weight="bold" text-anchor="middle">Moteur RS-04</text>
    <text x="50" y="80" fill="#feebc8" font-family="system-ui, sans-serif" font-size="8" text-anchor="middle">Stator / Rotor</text>
    <text x="50" y="-20" fill="#f59e0b" font-family="system-ui, sans-serif" font-size="9" font-weight="bold" text-anchor="middle">⑤ RS-04 (Glissement Avant)</text>
  </g>

  <!-- Assembly Directions Label at Bottom -->
  <rect x="150" y="345" width="600" height="35" rx="6" fill="#1e293b" stroke="#334155" stroke-width="1"/>
  <text x="450" y="367" fill="#f59e0b" font-family="system-ui, sans-serif" font-size="10" font-weight="bold" text-anchor="middle">
    Séquence : Collage Carter Alu (③) dans Collet (④) ➔ Tube Carbone (②) ➔ Insertion Frontale RS-04 (⑤) ➔ Vissage M5 par l'Arrière (①)
  </text>
</svg>
