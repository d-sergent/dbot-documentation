        "git_show",
        "git_status"
      ]
    },
    "tavily": {
      "command": "npx",
      "args": [
        "-y",
        "tavily-mcp@latest"
      ],
      "env": {
        "TAVILY_API_KEY": "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"
      },
