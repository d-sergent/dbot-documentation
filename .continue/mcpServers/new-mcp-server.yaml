{
  "mcpServers": {
    "filesystem": {
      "command": "npx",
      "args": [
        "-y",
        "@modelcontextprotocol/server-filesystem@latest",
        "/Users/Shared/Mon Google Drive Physique/Documentation"
      ],
      "disabled": false,
      "alwaysAllow": [
        "read_file",
        "list_directory",
        "search_files"
      ]
    },
    "git": {
      "command": "npx",
      "args": [
        "-y",
        "mcp-git@latest"
